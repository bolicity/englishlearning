    let currentCategory = 'textbook';
    let currentPlayingIndex = -1;

    function renderAudioList(list) {
      const container = document.getElementById('audioContainer');
      container.innerHTML = '';
      if (!list || list.length === 0) {
        container.innerHTML = '<div style="grid-column: 1/-1; text-align: center; color: var(--text-muted); padding: 3rem;">未找到相关音频项目</div>';
        return;
      }

      list.forEach((item, index) => {
        const card = document.createElement('div');
        card.className = 'audio-item-card' + (currentPlayingIndex === index ? ' playing' : '');
        card.onclick = () => playTrack(item, index);

        card.innerHTML = `
          <div>
            <div class="audio-meta">
              <span class="audio-badge">${item.unit}</span>
              <span style="font-size: 0.75rem; color: var(--text-muted);">MP3 官方音频</span>
            </div>
            <div class="audio-title">${item.title}</div>
          </div>
          <div class="audio-play-btn">
            <span>▶ 立即播放音频</span>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function switchCategory(cat) {
      currentCategory = cat;
      document.getElementById('tabTextbook').className = 'tab-btn' + (cat === 'textbook' ? ' active' : '');
      document.getElementById('tabWorkbook').className = 'tab-btn' + (cat === 'workbook' ? ' active' : '');
      filterAudioList();
    }

    function filterAudioList() {
      const query = document.getElementById('searchInput').value.toLowerCase().trim();
      const baseList = currentCategory === 'textbook' ? textbookAudios : workbookAudios;
      
      const filtered = baseList.filter(item => {
        return item.title.toLowerCase().includes(query) || item.unit.toLowerCase().includes(query);
      });
      renderAudioList(filtered);
    }

    function playTrack(item, index) {
      currentPlayingIndex = index;
      const player = document.getElementById('mainAudioPlayer');
      const titleSpan = document.getElementById('currentTrackTitle');

      titleSpan.innerText = `${item.unit} - ${item.title}`;
      player.src = encodeURI(item.path);
      player.play();

      filterAudioList();
    }

    // 初始化渲染
    window.onload = function() {
      renderAudioList(textbookAudios);
    };
