<style>
  :root{
    --bg-main:#F8FAFC; --bg-card:#FFFFFF; --bg-subtle:#F1F5F9;
    --border:#E2E8F0; --tp:#0F172A; --ts:#475569; --tm:#64748B;
    --red:#DC2626; --red-l:#EF4444; --red-bg:#FEF2F2;
    --shadow:0 1px 3px rgba(15,23,42,.06);
    --shadow-md:0 8px 24px rgba(15,23,42,.10);
    --r-s:8px; --r-m:12px; --r-l:16px;
    --sidebar-w:264px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{font-family:'Inter',system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;
       background:var(--bg-main);color:var(--tp);line-height:1.6}

  /* ---------- header ---------- */
  header{background:var(--bg-card);border-bottom:1px solid var(--border);
         position:sticky;top:0;z-index:60;box-shadow:var(--shadow)}
  .nav{max-width:1500px;margin:0 auto;padding:.7rem 1.1rem;display:flex;
       justify-content:space-between;align-items:center;gap:1rem}
  .brand{display:flex;align-items:center;gap:.7rem;text-decoration:none;color:var(--tp)}
  .brand-logo{width:38px;height:38px;background:linear-gradient(135deg,var(--red),var(--red-l));
       color:#fff;border-radius:var(--r-s);display:flex;align-items:center;justify-content:center;
       font-weight:800;font-size:.95rem;flex:none}
  .brand-title{font-family:'Outfit',sans-serif;font-weight:700;font-size:1.08rem;color:var(--red)}
  .brand-sub{font-size:.72rem;color:var(--tm)}
  .nav-right{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap}
  .btn{display:inline-flex;align-items:center;gap:.35rem;padding:.5rem .85rem;min-height:40px;
       background:var(--bg-subtle);color:var(--ts);border:1px solid var(--border);
       border-radius:var(--r-s);text-decoration:none;font-weight:600;font-size:.82rem;
       cursor:pointer;transition:.18s;white-space:nowrap}
  .btn:hover{background:var(--red-bg);color:var(--red-l);border-color:#FECDD3}

  /* ---------- layout ---------- */
  .shell{max-width:1500px;margin:0 auto;display:flex;gap:1.1rem;padding:1.1rem;align-items:flex-start}

  /* ---------- sidebar ---------- */
  aside{width:var(--sidebar-w);flex:none;background:var(--bg-card);border:1px solid var(--border);
        border-radius:var(--r-l);box-shadow:var(--shadow);position:sticky;top:74px;
        max-height:calc(100vh - 92px);display:flex;flex-direction:column;overflow:hidden;transition:.22s}
  aside.collapsed{width:0;opacity:0;border-width:0;margin-right:-1.1rem}
  .side-head{padding:.85rem 1rem;border-bottom:1px solid var(--border);display:flex;
        justify-content:space-between;align-items:center;flex:none}
  .side-head h2{font-family:'Outfit',sans-serif;font-size:.92rem;font-weight:800;color:var(--tp)}
  .side-head span{font-size:.7rem;color:var(--tm)}
  .side-body{overflow-y:auto;padding:.5rem .55rem 1rem}
  .vol{margin-bottom:.3rem}
  .vol-btn{width:100%;display:flex;align-items:center;gap:.45rem;padding:.5rem .6rem;
        background:none;border:none;border-radius:var(--r-s);cursor:pointer;text-align:left;
        font-family:inherit;font-size:.83rem;font-weight:700;color:var(--ts);transition:.15s}
  .vol-btn:hover{background:var(--bg-subtle)}
  .vol-btn .dot{width:8px;height:8px;border-radius:2px;flex:none}
  .vol-btn .cnt{margin-left:auto;font-size:.68rem;color:var(--tm);font-weight:600}
  .vol-btn .arw{font-size:.6rem;color:var(--tm);transition:.2s}
  .vol.open .arw{transform:rotate(90deg)}
  .vol-list{display:none;padding:.1rem 0 .25rem .55rem}
  .vol.open .vol-list{display:block}
  .poem-btn{width:100%;display:flex;align-items:baseline;gap:.35rem;padding:.36rem .55rem;
        background:none;border:none;border-left:2px solid var(--border);border-radius:0 var(--r-s) var(--r-s) 0;
        cursor:pointer;text-align:left;font-family:inherit;font-size:.8rem;color:var(--ts);transition:.15s}
  .poem-btn:hover{background:var(--bg-subtle);color:var(--tp)}
  .poem-btn.active{background:var(--red-bg);border-left-color:var(--red);color:var(--red);font-weight:700}
  .poem-btn .pno{font-size:.66rem;color:var(--tm);font-variant-numeric:tabular-nums;flex:none;min-width:1.4em}
  .poem-btn.active .pno{color:var(--red-l)}

  /* ---------- main ---------- */
  main{flex:1;min-width:0;display:flex;flex-direction:column;gap:1rem}
  .panel-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--r-l);
        box-shadow:var(--shadow);padding:1.4rem 1.5rem}
  .poem-head{display:flex;justify-content:space-between;align-items:flex-end;gap:1rem;flex-wrap:wrap}
  .poem-title{font-family:'Outfit','Noto Serif SC',serif;font-size:1.75rem;font-weight:800;color:var(--tp);line-height:1.25}
  .poem-meta{display:flex;align-items:center;gap:.5rem;margin-top:.4rem;flex-wrap:wrap}
  .chip{font-size:.72rem;font-weight:700;padding:.18rem .55rem;border-radius:999px;
        background:var(--bg-subtle);color:var(--tm)}
  .chip.vol{color:#fff}
  .chip.type{background:#EFF6FF;color:#1D4ED8}
  .toolbar{display:flex;gap:.45rem;flex-wrap:wrap;align-items:center}
  .btn.on{background:var(--red-bg);color:var(--red);border-color:#FECDD3}
  .counter{font-size:.75rem;color:var(--tm);font-variant-numeric:tabular-nums}

  /* ---------- panels ---------- */
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:.8rem;margin-top:1rem}
  .pn{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--r-m);
      overflow:hidden;display:flex;flex-direction:column;transition:.2s;cursor:zoom-in;position:relative}
  .pn:hover{box-shadow:var(--shadow-md);transform:translateY(-2px);border-color:#FECDD3}
  .pn-img{position:relative;background:#FBF9F4;aspect-ratio:1/1;overflow:hidden}
  .pn-img img{width:100%;height:100%;object-fit:cover;display:block}
  .pn-no{position:absolute;top:.55rem;left:.55rem;width:28px;height:28px;border-radius:50%;
      background:rgba(255,255,255,.92);border:1px solid var(--border);display:flex;align-items:center;
      justify-content:center;font-size:.85rem;color:var(--red);font-weight:700;z-index:2;
      box-shadow:0 1px 4px rgba(0,0,0,.08)}
  .pn-txt{padding:.75rem .85rem .85rem;display:flex;flex-direction:column;gap:.4rem;
      border-top:1px solid var(--border);background:#FFFDFB}
  .verse{font-family:'Noto Serif SC',serif;font-size:.95rem;font-weight:700;color:var(--red);
      line-height:1.55;letter-spacing:.01em}
  .scene{font-size:.72rem;color:var(--tm);line-height:1.6}
  .pn.hide-verse .verse{filter:blur(6px);opacity:.55;user-select:none;transition:.25s}
  .pn.hide-verse .scene{opacity:.45}
  .pn.hide-verse .pn-img img{filter:brightness(.97)}
  .pn.revealed .verse{filter:none;opacity:1}
  .reveal-tip{position:absolute;bottom:.55rem;left:50%;transform:translateX(-50%);
      background:rgba(15,23,42,.72);color:#fff;font-size:.68rem;padding:.2rem .6rem;border-radius:999px;
      pointer-events:none;opacity:0;transition:.2s}
  .pn.hide-verse:not(.revealed) .reveal-tip{opacity:1}
  .no-scene .scene{display:none}

  /* ---------- lightbox ---------- */
  .lb{position:fixed;inset:0;background:rgba(15,23,42,.92);z-index:200;display:none;
      align-items:center;justify-content:center;padding:1.5rem;cursor:zoom-out}
  .lb.show{display:flex}
  .lb-inner{max-width:min(96vw,1000px);width:100%;background:var(--bg-card);border-radius:var(--r-l);
      overflow:hidden;box-shadow:0 24px 60px rgba(0,0,0,.4)}
  .lb-inner img{width:100%;display:block;background:#FBF9F4}
  .lb-txt{padding:.9rem 1.1rem 1.1rem}
  .lb-txt .verse{font-size:1.15rem}
  .lb-txt .scene{margin-top:.3rem}
  .lb-close{position:absolute;top:1rem;right:1.1rem;width:42px;height:42px;border-radius:50%;
      background:rgba(255,255,255,.16);color:#fff;border:none;font-size:1.3rem;cursor:pointer}
  .lb-nav{position:absolute;top:50%;transform:translateY(-50%);width:46px;height:46px;border-radius:50%;
      background:rgba(255,255,255,.16);color:#fff;border:none;font-size:1.3rem;cursor:pointer}
  .lb-nav.prev{left:1rem}.lb-nav.next{right:1rem}

  footer{max-width:1500px;margin:0 auto;padding:1.6rem 1.1rem 3rem;text-align:center;
      color:var(--tm);font-size:.78rem}

  /* ---------- mobile ---------- */
  .side-toggle{display:none}
  @media(max-width:1080px){
    .shell{padding:.8rem}
    aside{position:fixed;left:0;top:0;bottom:0;z-index:100;border-radius:0;max-height:100vh;width:280px;
          box-shadow:0 0 40px rgba(0,0,0,.2)}
    aside.collapsed{transform:translateX(-100%);width:280px;opacity:1;border-width:1px;margin:0}
    .side-toggle{display:inline-flex}
    .mask{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:90;display:none}
    .mask.show{display:block}
  }
  @media(max-width:1080px){
    .grid{grid-template-columns:repeat(2,1fr)}
  }
  @media(max-width:760px){
    .grid{grid-template-columns:repeat(2,1fr);gap:.6rem}
    .verse{font-size:.82rem}
    .scene{font-size:.66rem}
    .pn-txt{padding:.5rem .6rem .6rem}
    .poem-title{font-size:1.35rem}
    .panel-card{padding:1.05rem}
    .brand-sub{display:none}
    .nav{padding:.6rem .8rem}
  }
</style>
</head>

const DATA = [{"vol":"六年级（上册）","color":"#DC2626","items":[{"id":0,"slug":"sujiandejiang","title":"宿建德江","author":"唐·孟浩然","type":"古诗","panels":[{"v":"移舟泊烟渚","s":"暮色苍茫的江面，一叶小舟缓缓停泊在烟水朦胧的江中小洲旁，舟子撑篙，诗人立于船头远望","img":"images/recitation-comics/sujiandejiang-c1.webp","no":"①"},{"v":"日暮客愁新","s":"落日西沉的江边，旅人独坐小舟之中，垂首抱膝凝思，眉宇间新添羁旅愁绪，江面浮着薄雾","img":"images/recitation-comics/sujiandejiang-c2.webp","no":"②"},{"v":"野旷天低树","s":"极目旷野空旷无边，天幕低垂几乎与远处的树木相接，一棵孤树立于空旷原野，天地辽阔而人迹渺小","img":"images/recitation-comics/sujiandejiang-c3.webp","no":"③"},{"v":"江清月近人","s":"夜色降临，江水清澈如镜，一轮明月倒映水中，月影近在舟边仿佛贴近舟中之人，清辉满江","img":"images/recitation-comics/sujiandejiang-c4.webp","no":"④"}]},{"id":1,"slug":"wanghulou","title":"六月二十七日望湖楼醉书","author":"宋·苏轼","type":"古诗","panels":[{"v":"黑云翻墨未遮山","s":"乌云如打翻的墨汁般翻涌而来，尚未遮住远山，山尖仍在云隙间显露，湖面天色骤暗","img":"images/recitation-comics/wanghulou-c1.webp","no":"①"},{"v":"白雨跳珠乱入船","s":"白亮的雨点如珍珠般蹦跳着乱打入湖中小船，雨珠在船板与水面四溅飞跳","img":"images/recitation-comics/wanghulou-c2.webp","no":"②"},{"v":"卷地风来忽吹散","s":"一阵大风平地卷来，霎时吹散满天乌云急雨，云开雨霁，湖面重见天光","img":"images/recitation-comics/wanghulou-c3.webp","no":"③"},{"v":"望湖楼下水如天","s":"雨后凭栏俯瞰望湖楼下，湖水澄澈平静，水天一色，倒映着新霁的天空","img":"images/recitation-comics/wanghulou-c4.webp","no":"④"}]},{"id":2,"slug":"xijiangyue","title":"西江月·夜行黄沙道中","author":"宋·辛弃疾","type":"词","panels":[{"v":"明月别枝惊鹊，清风半夜鸣蝉","s":"夏夜月明，明月升起惊起枝头乌鹊，半夜清风里蝉声阵阵，乡村夜色静谧","img":"images/recitation-comics/xijiangyue-c1.webp","no":"①"},{"v":"稻花香里说丰年，听取蛙声一片","s":"稻花飘香的田间小路上，农人笑谈丰收年景，稻田里蛙声连成一片","img":"images/recitation-comics/xijiangyue-c2.webp","no":"②"},{"v":"七八个星天外，两三点雨山前","s":"远处天边疏星七八点，山前飘来三两点细雨，夜行人加快脚步","img":"images/recitation-comics/xijiangyue-c3.webp","no":"③"},{"v":"旧时茅店社林边，路转溪桥忽见","s":"走过溪上小桥山路一转，旧时熟悉的茅草客店忽然出现在社林旁边","img":"images/recitation-comics/xijiangyue-c4.webp","no":"④"}]},{"id":3,"slug":"langtaosha","title":"浪淘沙（其一）","author":"唐·刘禹锡","type":"古诗","panels":[{"v":"九曲黄河万里沙","s":"九曲连环的黄河奔腾东去，河道里裹挟着万里黄沙，浊浪滔滔气势磅礴","img":"images/recitation-comics/langtaosha-c1.webp","no":"①"},{"v":"浪淘风簸自天涯","s":"巨浪淘涌狂风颠簸，波涛滚滚仿佛从天边奔流而来，水天相接处浪头高卷","img":"images/recitation-comics/langtaosha-c2.webp","no":"②"},{"v":"如今直上银河去","s":"仰望夜空，思绪随黄河之水扶摇直上银河，银河横贯天际与大河相接","img":"images/recitation-comics/langtaosha-c3.webp","no":"③"},{"v":"同到牵牛织女家","s":"星河灿灿，河畔牵牛星与织女星遥遥相对，仿佛将一同到那牛郎织女的家中做客","img":"images/recitation-comics/langtaosha-c4.webp","no":"④"}]},{"id":4,"slug":"jiangnanchun","title":"江南春","author":"唐·杜牧","type":"古诗","panels":[{"v":"千里莺啼绿映红","s":"千里江南，黄莺啼鸣，红花与绿叶相互掩映，满目春色烂漫","img":"images/recitation-comics/jiangnanchun-c1.webp","no":"①"},{"v":"水村山郭酒旗风","s":"傍水的村庄、依山的城郭，酒家的旗子在春风中招展","img":"images/recitation-comics/jiangnanchun-c2.webp","no":"②"},{"v":"南朝四百八十寺","s":"南朝遗留下来的众多佛寺，殿宇层叠掩映在山野之间","img":"images/recitation-comics/jiangnanchun-c3.webp","no":"③"},{"v":"多少楼台烟雨中","s":"无数亭台楼阁矗立在朦胧烟雨之中，若隐若现，苍茫迷离","img":"images/recitation-comics/jiangnanchun-c4.webp","no":"④"}]},{"id":5,"slug":"shuhuyin","title":"书湖阴先生壁","author":"宋·王安石","type":"古诗","panels":[{"v":"茅檐长扫净无苔","s":"茅草屋檐下庭院洁净，主人常加扫拭，阶前青苔不生，一派清幽","img":"images/recitation-comics/shuhuyin-c1.webp","no":"①"},{"v":"花木成畦手自栽","s":"屋前花木分畦成行、齐整葱茏，皆是主人亲手栽种","img":"images/recitation-comics/shuhuyin-c2.webp","no":"②"},{"v":"一水护田将绿绕","s":"一条溪水环绕守护着田亩，把一片浓绿温柔地围在中间","img":"images/recitation-comics/shuhuyin-c3.webp","no":"③"},{"v":"两山排闼送青来","s":"推门而望，两座青山仿佛破门而入，把满目青翠直送到眼前","img":"images/recitation-comics/shuhuyin-c4.webp","no":"④"}]},{"id":6,"slug":"qilv-changzheng","title":"七律·长征","author":"毛泽东","type":"律诗","panels":[{"v":"红军不怕远征难，万水千山只等闲","s":"红军队伍翻山越水昂首前行，万水千山在脚下不过寻常，行军队伍绵延于崇山之间","img":"images/recitation-comics/qilv-changzheng-c1.webp","no":"①"},{"v":"五岭逶迤腾细浪，乌蒙磅礴走泥丸","s":"连绵起伏的五岭在红军眼中不过翻腾的细浪，磅礴的乌蒙山如滚动的泥丸","img":"images/recitation-comics/qilv-changzheng-c2.webp","no":"②"},{"v":"金沙水拍云崖暖，大渡桥横铁索寒","s":"金沙江浊浪拍击高耸入云的山崖，大渡河上铁索桥横跨激流寒气逼人，红军抢渡飞夺","img":"images/recitation-comics/qilv-changzheng-c3.webp","no":"③"},{"v":"更喜岷山千里雪，三军过后尽开颜","s":"千里岷山白雪皑皑，红军战士翻越雪山之后个个笑逐颜开，红旗在雪岭上飘扬","img":"images/recitation-comics/qilv-changzheng-c4.webp","no":"④"}]},{"id":7,"slug":"boyaguchin","title":"伯牙鼓琴","author":"《吕氏春秋》","type":"文言文","panels":[{"v":"伯牙鼓琴，锺子期听之","s":"山水之间，伯牙端坐抚琴，锺子期盘坐对面凝神聆听，松风清流相伴","img":"images/recitation-comics/boyaguchin-c1.webp","no":"①"},{"v":"方鼓琴而志在太山，锺子期曰善哉乎鼓琴，巍巍乎若太山","s":"琴声激越高亢，锺子期侧耳赞叹，眼前仿佛现出巍巍耸立的高山","img":"images/recitation-comics/boyaguchin-c2.webp","no":"②"},{"v":"少选之间而志在流水，锺子期又曰善哉乎鼓琴，汤汤乎若流水","s":"曲调流转舒缓，锺子期颔首称善，眼前仿佛现出汤汤奔流的江水","img":"images/recitation-comics/boyaguchin-c3.webp","no":"③"},{"v":"锺子期死，伯牙破琴绝弦，终身不复鼓琴","s":"锺子期已逝，伯牙悲痛中摔破琴挑断琴弦，终身不再弹琴，只余孤琴断弦","img":"images/recitation-comics/boyaguchin-c4.webp","no":"④"}]}]},{"vol":"七年级（上册）","color":"#D97706","items":[{"id":8,"slug":"guancanghai","title":"观沧海","author":"东汉·曹操","type":"古诗","panels":[{"v":"东临碣石，以观沧海","s":"诗人登上碣石山顶，居高临下眺望苍茫大海，秋风猎猎，衣袂飘动","img":"images/recitation-comics/guancanghai-c1.webp","no":"①"},{"v":"水何澹澹，山岛竦峙。树木丛生，百草丰茂","s":"海面水波荡漾，山岛高高地耸立，岛上树木丛生百草丰茂，一片生机","img":"images/recitation-comics/guancanghai-c2.webp","no":"②"},{"v":"秋风萧瑟，洪波涌起","s":"萧瑟秋风中海面洪波巨澜汹涌而起，浪涛拍岸气势雄浑","img":"images/recitation-comics/guancanghai-c3.webp","no":"③"},{"v":"日月之行，若出其中；星汉灿烂，若出其里","s":"沧海吞吐日月，灿烂银河仿佛也从海中升起，天地星月尽在胸中","img":"images/recitation-comics/guancanghai-c4.webp","no":"④"}]},{"id":9,"slug":"wenchangling","title":"闻王昌龄左迁龙标遥有此寄","author":"唐·李白","type":"古诗","panels":[{"v":"杨花落尽子规啼","s":"暮春时节杨花飘落殆尽，枝头子规声声啼叫，一派萧瑟春光","img":"images/recitation-comics/wenchangling-c1.webp","no":"①"},{"v":"闻道龙标过五溪","s":"友人远谪荒僻之地，要跋涉五溪蛮荒之地，山水迢迢令人挂念","img":"images/recitation-comics/wenchangling-c2.webp","no":"②"},{"v":"我寄愁心与明月","s":"诗人仰望夜空，把满怀愁思托付给皎皎明月，月光如水","img":"images/recitation-comics/wenchangling-c3.webp","no":"③"},{"v":"随君直到夜郎西","s":"明月当空，仿佛带着这颗牵挂之心一路相随，照着友人远去夜郎以西的路","img":"images/recitation-comics/wenchangling-c4.webp","no":"④"}]},{"id":10,"slug":"cibeigu","title":"次北固山下","author":"唐·王湾","type":"古诗","panels":[{"v":"客路青山外，行舟绿水前","s":"旅途蜿蜒在青翠北固山之外，行舟扬帆于碧绿江水之前","img":"images/recitation-comics/cibeigu-c1.webp","no":"①"},{"v":"潮平两岸阔，风正一帆悬","s":"潮水上涨与岸齐平，江面开阔，顺风行船白帆高高悬挂","img":"images/recitation-comics/cibeigu-c2.webp","no":"②"},{"v":"海日生残夜，江春入旧年","s":"残夜未尽一轮红日已从海上升起，旧年未过江上已露出春天气息","img":"images/recitation-comics/cibeigu-c3.webp","no":"③"},{"v":"乡书何处达？归雁洛阳边","s":"仰望北归大雁排成人字掠过长空，家书要寄往何处？就托鸿雁捎到洛阳城边","img":"images/recitation-comics/cibeigu-c4.webp","no":"④"}]},{"id":11,"slug":"tianjingsha","title":"天净沙·秋思","author":"元·马致远","type":"曲","panels":[{"v":"枯藤老树昏鸦","s":"深秋村野，枯藤缠绕着老树，暮色中乌鸦栖息枝头，一片萧瑟","img":"images/recitation-comics/tianjingsha-c1.webp","no":"①"},{"v":"小桥流水人家","s":"不远处小桥横跨溪流，桥边炊烟袅袅几户人家，温暖恬静","img":"images/recitation-comics/tianjingsha-c2.webp","no":"②"},{"v":"古道西风瘦马","s":"荒凉古道上秋风萧瑟，游子骑着一匹瘦马踽踽独行","img":"images/recitation-comics/tianjingsha-c3.webp","no":"③"},{"v":"夕阳西下，断肠人在天涯","s":"夕阳西沉，愁肠寸断的旅人还漂泊在远离家乡的天涯","img":"images/recitation-comics/tianjingsha-c4.webp","no":"④"}]},{"id":12,"slug":"lunyu","title":"《论语》十二章","author":"孔子弟子及再传弟子","type":"文言文","panels":[{"v":"学而时习之，不亦说乎？有朋自远方来，不亦乐乎","s":"杏坛之上孔子讲学，弟子按时温习欣然会意；远方友人来访，众人拱手相迎笑语盈门","img":"images/recitation-comics/lunyu-c1.webp","no":"①"},{"v":"温故而知新，可以为师矣；学而不思则罔，思而不学则殆","s":"弟子灯下翻检旧简忽有所悟，一手执卷一手托腮，边读边思温故知新","img":"images/recitation-comics/lunyu-c2.webp","no":"②"},{"v":"一箪食，一瓢饮，在陋巷，人不堪其忧，回也不改其乐","s":"陋巷之中颜回身居简屋，一箪饭一瓢水，粗茶淡饭却怡然自乐","img":"images/recitation-comics/lunyu-c3.webp","no":"③"},{"v":"三人行，必有我师焉。择其善者而从之，其不善者而改之","s":"三人同行于道上，年长者指点评说，年少者侧耳聆听，彼此切磋互为师友","img":"images/recitation-comics/lunyu-c4.webp","no":"④"}]},{"id":13,"slug":"emeishan","title":"峨眉山月歌","author":"唐·李白","type":"古诗","panels":[{"v":"峨眉山月半轮秋","s":"秋夜峨眉山头悬着半轮明月，月色清朗山影如黛","img":"images/recitation-comics/emeishan-c1.webp","no":"①"},{"v":"影入平羌江水流","s":"月影倒映在平羌江中，随江水缓缓流动，碎银满江","img":"images/recitation-comics/emeishan-c2.webp","no":"②"},{"v":"夜发清溪向三峡","s":"夜色中乘舟从清溪驿出发，直向三峡驶去，两岸山影飞速后退","img":"images/recitation-comics/emeishan-c3.webp","no":"③"},{"v":"思君不见下渝州","s":"月被山遮思念友人却难以相见，船已顺流而下驶往渝州，怅然回望","img":"images/recitation-comics/emeishan-c4.webp","no":"④"}]},{"id":14,"slug":"liguinian","title":"江南逢李龟年","author":"唐·杜甫","type":"古诗","panels":[{"v":"岐王宅里寻常见","s":"开元盛世，岐王宅第里歌舞升平，乐师李龟年抚琴而歌，宾客满座","img":"images/recitation-comics/liguinian-c1.webp","no":"①"},{"v":"崔九堂前几度闻","s":"崔九堂前多次聆听李龟年的美妙歌声，堂上华灯高照盛极一时","img":"images/recitation-comics/liguinian-c2.webp","no":"②"},{"v":"正是江南好风景","s":"多年后江南暮春，风景依旧美好，江山却已残破凋零","img":"images/recitation-comics/liguinian-c3.webp","no":"③"},{"v":"落花时节又逢君","s":"落花纷飞的季节，落魄的乐师与流落的诗人意外重逢，相对无言","img":"images/recitation-comics/liguinian-c4.webp","no":"④"}]},{"id":15,"slug":"xingjunjiuri","title":"行军九日思长安故园","author":"唐·岑参","type":"古诗","panels":[{"v":"强欲登高去","s":"重阳佳节军旅之中，诗人勉强振起精神欲登高远望","img":"images/recitation-comics/xingjunjiuri-c1.webp","no":"①"},{"v":"无人送酒来","s":"战乱行军之中无酒可送，四顾茫茫，无人相伴举杯","img":"images/recitation-comics/xingjunjiuri-c2.webp","no":"②"},{"v":"遥怜故园菊","s":"遥想长安故园的菊花此时正独自开放，无人欣赏令人怜惜","img":"images/recitation-comics/xingjunjiuri-c3.webp","no":"③"},{"v":"应傍战场开","s":"那丛丛菊花大概就开在残破的战场旁边，冷月寒霜映着硝烟散尽的废墟","img":"images/recitation-comics/xingjunjiuri-c4.webp","no":"④"}]},{"id":16,"slug":"shouxiangcheng","title":"夜上受降城闻笛","author":"唐·李益","type":"古诗","panels":[{"v":"回乐烽前沙似雪","s":"回乐峰前的沙地在月光下白得如同积雪，一片苍茫","img":"images/recitation-comics/shouxiangcheng-c1.webp","no":"①"},{"v":"受降城外月如霜","s":"受降城外夜色如霜，冷月高悬，照着戍楼与旌旗","img":"images/recitation-comics/shouxiangcheng-c2.webp","no":"②"},{"v":"不知何处吹芦管","s":"不知从何处传来悠悠芦笛声，呜咽婉转在夜空回荡","img":"images/recitation-comics/shouxiangcheng-c3.webp","no":"③"},{"v":"一夜征人尽望乡","s":"笛声勾起无限乡愁，帐篷中戍边的将士一夜之间全都起身眺望故乡的方向","img":"images/recitation-comics/shouxiangcheng-c4.webp","no":"④"}]},{"id":17,"slug":"jiezishu","title":"诫子书","author":"三国·诸葛亮","type":"文言文","panels":[{"v":"静以修身，俭以养德","s":"书斋之中老父亲端坐案前，屏息静气修身养性，屋内陈设简朴一几一灯","img":"images/recitation-comics/jiezishu-c1.webp","no":"①"},{"v":"非淡泊无以明志，非宁静无以致远","s":"灯下提笔凝神，笔下写下淡泊明志宁静致远的告诫，窗外月色澄明","img":"images/recitation-comics/jiezishu-c2.webp","no":"②"},{"v":"夫学须静也，才须学也，非学无以广才，非志无以成学","s":"少年伏案苦读，案上书卷层叠，宁静书房中唯闻翻书之声","img":"images/recitation-comics/jiezishu-c3.webp","no":"③"},{"v":"年与时驰，意与日去，遂成枯落，多不接世，悲守穷庐，将复何及","s":"时光飞逝如白马过隙，枯叶飘零落满荒芜庭院，老来独守空庐追悔莫及","img":"images/recitation-comics/jiezishu-c4.webp","no":"④"}]}]},{"vol":"六年级（下册）","color":"#EA580C","items":[{"id":18,"slug":"tiaotiao","title":"迢迢牵牛星","author":"《古诗十九首》","type":"古诗","panels":[{"v":"迢迢牵牛星，皎皎河汉女","s":"辽阔夜空中银河横贯，牵牛星与织女星隔河遥遥相望，星光皎洁","img":"images/recitation-comics/tiaotiao-c1.webp","no":"①"},{"v":"纤纤擢素手，札札弄机杼","s":"织女伸出纤细雪白的手，在织机前札札地穿引织布，梭影翻飞","img":"images/recitation-comics/tiaotiao-c2.webp","no":"②"},{"v":"终日不成章，泣涕零如雨","s":"织女整日织不成布匹，泪珠如雨般簌簌落下，织机旁愁容满面","img":"images/recitation-comics/tiaotiao-c3.webp","no":"③"},{"v":"河汉清且浅，相去复几许。盈盈一水间，脉脉不得语","s":"银河之水清浅，相隔并没有多远，两人隔着盈盈一水，含情凝望却不能互诉衷肠","img":"images/recitation-comics/tiaotiao-c4.webp","no":"④"}]},{"id":19,"slug":"zhushi","title":"竹石","author":"清·郑燮","type":"古诗","panels":[{"v":"咬定青山不放松","s":"一丛翠竹紧咬青山石缝，根须深扎，任凭风雨也绝不松动","img":"images/recitation-comics/zhushi-c1.webp","no":"①"},{"v":"立根原在破岩中","s":"竹根牢牢扎立在破裂的岩石之中，石缝间虬根盘结","img":"images/recitation-comics/zhushi-c2.webp","no":"②"},{"v":"千磨万击还坚劲","s":"历经千般折磨万般打击，竹身依然挺拔坚劲，傲然不折","img":"images/recitation-comics/zhushi-c3.webp","no":"③"},{"v":"任尔东西南北风","s":"任凭四面八方狂风袭来，翠竹迎风摇曳而屹立不倒","img":"images/recitation-comics/zhushi-c4.webp","no":"④"}]},{"id":20,"slug":"huixiang","title":"回乡偶书（其一）","author":"唐·贺知章","type":"古诗","panels":[{"v":"少小离家老大回","s":"少年离乡时意气风发，归来已是白发苍苍的老翁拄杖立于村口，物是人非","img":"images/recitation-comics/huixiang-c1.webp","no":"①"},{"v":"乡音无改鬓毛衰","s":"老者开口仍是乡音，只是两鬓的毛发已经斑白稀疏，镜中容颜大改","img":"images/recitation-comics/huixiang-c2.webp","no":"②"},{"v":"儿童相见不相识","s":"村口孩童围拢过来，睁着好奇的眼睛打量这位陌生的老人","img":"images/recitation-comics/huixiang-c3.webp","no":"③"},{"v":"笑问客从何处来","s":"孩童笑嘻嘻地拱手发问：客人您是从哪里来的呀？老人一时百感交集","img":"images/recitation-comics/huixiang-c4.webp","no":"④"}]},{"id":21,"slug":"liangxiaoer","title":"两小儿辩日","author":"《列子》","type":"文言文","panels":[{"v":"孔子东游，见两小儿辩斗，问其故","s":"孔子东游途中，路遇两个小孩正在激烈争辩，孔子下车询问缘由","img":"images/recitation-comics/liangxiaoer-c1.webp","no":"①"},{"v":"我以日始出时去人近，而日中时远也；我以日初出远，而日中时近也","s":"一个小孩指指初升的太阳说早晨近中午远，另一个连连摇头说恰恰相反","img":"images/recitation-comics/liangxiaoer-c2.webp","no":"②"},{"v":"日初出大如车盖，及日中则如盘盂；日初出沧沧凉凉，及其日中如探汤","s":"一个小孩说日出时大如车盖到中午小如盘盂，另一个说清晨凉而中午热得像把手伸进热水","img":"images/recitation-comics/liangxiaoer-c3.webp","no":"③"},{"v":"孔子不能决也。两小儿笑曰：孰为汝多知乎","s":"孔子想了半天也判断不出谁对，两个小孩笑着打趣：谁说你知识渊博呢？","img":"images/recitation-comics/liangxiaoer-c4.webp","no":"④"}]}]},{"vol":"七年级（下册）","color":"#059669","items":[{"id":22,"slug":"dengyouzhoutai","title":"登幽州台歌","author":"唐·陈子昂","type":"古诗","panels":[{"v":"前不见古人","s":"诗人独立于幽州台头，向前眺望，古代礼贤下士的明君已不可见","img":"images/recitation-comics/dengyouzhoutai-c1.webp","no":"①"},{"v":"后不见来者","s":"回首身后，后世的贤明之主同样渺不可寻，天地间唯余苍茫","img":"images/recitation-comics/dengyouzhoutai-c2.webp","no":"②"},{"v":"念天地之悠悠","s":"天地辽阔，宇宙无穷，个人渺小如沧海一粟，苍穹之下独立高台","img":"images/recitation-comics/dengyouzhoutai-c3.webp","no":"③"},{"v":"独怆然而涕下","s":"孤身立于高台，悲从中来，怆然泪下，衣袂在风中翻飞","img":"images/recitation-comics/dengyouzhoutai-c4.webp","no":"④"}]},{"id":23,"slug":"wangyue","title":"望岳","author":"唐·杜甫","type":"古诗","panels":[{"v":"岱宗夫如何？齐鲁青未了","s":"远望泰山，青翠的山色绵延齐鲁大地望不到尽头，云雾缭绕","img":"images/recitation-comics/wangyue-c1.webp","no":"①"},{"v":"造化钟神秀，阴阳割昏晓","s":"大自然把神奇秀美都汇聚于泰山，山南山北明暗分明如分昏晓","img":"images/recitation-comics/wangyue-c2.webp","no":"②"},{"v":"荡胸生曾云，决眦入归鸟","s":"山中层云升腾荡涤心胸，极目远望归鸟入林，目不转睛","img":"images/recitation-comics/wangyue-c3.webp","no":"③"},{"v":"会当凌绝顶，一览众山小","s":"定要登上那最高峰，俯瞰群山都显得矮小，登顶者立于云海之上","img":"images/recitation-comics/wangyue-c4.webp","no":"④"}]},{"id":24,"slug":"youshanxicun","title":"游山西村","author":"宋·陆游","type":"古诗","panels":[{"v":"莫笑农家腊酒浑，丰年留客足鸡豚","s":"丰收年景农家殷勤留客，腊酒虽浑鸡肉充足，主人捧盘相邀","img":"images/recitation-comics/youshanxicun-c1.webp","no":"①"},{"v":"山重水复疑无路，柳暗花明又一村","s":"山峦重叠水道迂回正疑无路可走，柳色深绿花光明艳忽然又见一村","img":"images/recitation-comics/youshanxicun-c2.webp","no":"②"},{"v":"箫鼓追随春社近，衣冠简朴古风存","s":"春社将近，村中箫鼓声此起彼伏，村民衣着简朴古风犹存","img":"images/recitation-comics/youshanxicun-c3.webp","no":"③"},{"v":"从今若许闲乘月，拄杖无时夜叩门","s":"月色朦胧的小路上，诗人拄着拐杖，今后若得闲暇随时再来夜访叩门","img":"images/recitation-comics/youshanxicun-c4.webp","no":"④"}]},{"id":25,"slug":"loushiming","title":"陋室铭","author":"唐·刘禹锡","type":"文言文","panels":[{"v":"山不在高，有仙则名。水不在深，有龙则灵","s":"远山不必高峻有仙居住便有名，潭水不必幽深有龙潜藏便显灵，山水掩映成趣","img":"images/recitation-comics/loushiming-c1.webp","no":"①"},{"v":"斯是陋室，惟吾德馨。苔痕上阶绿，草色入帘青","s":"简陋小屋之中德行馨香自远，碧绿苔痕爬上台阶，青葱草色映入门帘","img":"images/recitation-comics/loushiming-c2.webp","no":"②"},{"v":"谈笑有鸿儒，往来无白丁。可以调素琴，阅金经","s":"屋内谈笑皆博学之士，案上素琴轻抚，佛经静读，气氛清雅","img":"images/recitation-comics/loushiming-c3.webp","no":"③"},{"v":"无丝竹之乱耳，无案牍之劳形。南阳诸葛庐，西蜀子云亭","s":"没有笙箫扰乱听觉，没有公文劳累身心，正如南阳诸葛庐西蜀扬子亭一般清幽自得","img":"images/recitation-comics/loushiming-c4.webp","no":"④"}]},{"id":26,"slug":"ailianshuo","title":"爱莲说","author":"宋·周敦颐","type":"文言文","panels":[{"v":"晋陶渊明独爱菊。自李唐来，世人甚爱牡丹","s":"东篱下陶渊明独爱秋菊傲霜，唐以来世人竞赏雍容牡丹，花市繁盛","img":"images/recitation-comics/ailianshuo-c1.webp","no":"①"},{"v":"予独爱莲之出淤泥而不染，濯清涟而不妖","s":"一枝莲花亭亭立于池水之中，从淤泥中生长却不沾染，经清波洗涤而不妖艳","img":"images/recitation-comics/ailianshuo-c2.webp","no":"②"},{"v":"中通外直，不蔓不枝，香远益清，亭亭净植","s":"莲茎中通外直不生蔓不长枝，清香远播愈发清幽，纯净地挺立水面","img":"images/recitation-comics/ailianshuo-c3.webp","no":"③"},{"v":"莲，花之君子者也","s":"莲如君子卓然独立于众花之间，菊隐逸牡丹富贵，唯莲清高可敬","img":"images/recitation-comics/ailianshuo-c4.webp","no":"④"}]},{"id":27,"slug":"boqinhuai","title":"泊秦淮","author":"唐·杜牧","type":"古诗","panels":[{"v":"烟笼寒水月笼沙","s":"迷蒙烟雾笼罩着寒冷的秦淮河水，月光映照着江边白沙，一片朦胧","img":"images/recitation-comics/boqinhuai-c1.webp","no":"①"},{"v":"夜泊秦淮近酒家","s":"夜里小船停泊在秦淮河畔，岸边酒家灯火点点，笙歌隐隐","img":"images/recitation-comics/boqinhuai-c2.webp","no":"②"},{"v":"商女不知亡国恨","s":"酒楼之上歌女轻拨琵琶依旧唱着靡靡之曲，浑然不知亡国之痛","img":"images/recitation-comics/boqinhuai-c3.webp","no":"③"},{"v":"隔江犹唱后庭花","s":"隔岸歌声随风飘来还在唱着那曲后庭花，听者心情沉痛江水呜咽","img":"images/recitation-comics/boqinhuai-c4.webp","no":"④"}]},{"id":28,"slug":"mulanshi","title":"木兰诗","author":"北朝民歌","type":"古诗","panels":[{"v":"唧唧复唧唧，木兰当户织。昨夜见军帖，可汗大点兵","s":"木兰对着门户织布机声声声不停，昨夜见到军中文书，可汗大规模征兵","img":"images/recitation-comics/mulanshi-c1.webp","no":"①"},{"v":"愿为市鞍马，从此替爷征。东市买骏马，西市买鞍鞯","s":"木兰愿替年迈的父亲出征，奔走四方集市买来骏马鞍鞯辔头长鞭","img":"images/recitation-comics/mulanshi-c2.webp","no":"②"},{"v":"万里赴戎机，关山度若飞。朔气传金柝，寒光照铁衣","s":"万里奔波奔赴战场，飞越关隘山岭，北方寒气中传来打更声，冷月映照铠甲","img":"images/recitation-comics/mulanshi-c3.webp","no":"③"},{"v":"归来见天子，脱我战时袍，著我旧时裳。同行十二年，不知木兰是女郎","s":"凯旋归来天子赏赐，木兰脱下战袍换上旧时衣裳，同伴才惊觉同行十二年她竟是女子","img":"images/recitation-comics/mulanshi-c4.webp","no":"④"}]},{"id":29,"slug":"maiyouweng","title":"卖油翁","author":"宋·欧阳修","type":"文言文","panels":[{"v":"陈康肃公善射，当世无双，公亦以此自矜","s":"庭院中陈尧咨张弓搭箭十发九中，洋洋自得，观者啧啧称赞","img":"images/recitation-comics/maiyouweng-c1.webp","no":"①"},{"v":"有卖油翁释担而立，睨之久而不去，但微颔之","s":"卖油翁放下担子站在一旁，斜着眼看了许久，对神射之技只是微微点头","img":"images/recitation-comics/maiyouweng-c2.webp","no":"②"},{"v":"尔安敢轻吾射！无他，但手熟尔","s":"陈尧咨怒斥老翁敢轻视我的箭术，老翁从容答道不过手熟罢了","img":"images/recitation-comics/maiyouweng-c3.webp","no":"③"},{"v":"徐以杓酌油沥之，自钱孔入，而钱不湿","s":"老翁取葫芦置于地，铜钱覆在葫芦口上，用勺舀油缓缓注入，油从钱孔穿过而铜钱不湿","img":"images/recitation-comics/maiyouweng-c4.webp","no":"④"}]}]},{"vol":"八年级（上册）","color":"#0891B2","items":[{"id":30,"slug":"sanxia","title":"三峡","author":"北魏·郦道元","type":"文言文","panels":[{"v":"自三峡七百里中，两岸连山，略无阙处。重岩叠嶂，隐天蔽日","s":"三峡两岸高山连绵毫无缺口，重重岩崖层层陡壁遮天蔽日，江水从峡中奔流","img":"images/recitation-comics/sanxia-c1.webp","no":"①"},{"v":"夏水襄陵，沿溯阻绝。朝发白帝，暮到江陵","s":"夏日江水漫上山陵，上行下行水路断绝，清晨从白帝城出发的快船傍晚已到江陵","img":"images/recitation-comics/sanxia-c2.webp","no":"②"},{"v":"春冬之时，素湍绿潭，回清倒影。绝巘多生怪柏，悬泉瀑布，飞漱其间","s":"春冬时节白色急流碧绿深潭，回旋清波倒映两岸景致，极高的山峰上怪柏丛生，悬泉瀑布飞流冲荡","img":"images/recitation-comics/sanxia-c3.webp","no":"③"},{"v":"每至晴初霜旦，林寒涧肃，常有高猿长啸，哀转久绝","s":"秋日晴初霜降的早晨，树林山涧一片清寒寂静，高处的猿猴长啸声声，哀婉余音在空谷久久回荡","img":"images/recitation-comics/sanxia-c4.webp","no":"④"}]},{"id":31,"slug":"daxiezhongshu","title":"答谢中书书","author":"南朝·陶弘景","type":"文言文","panels":[{"v":"高峰入云，清流见底","s":"山峰高耸直插云霄，溪流清澈一望见底，山水交映如同画卷","img":"images/recitation-comics/daxiezhongshu-c1.webp","no":"①"},{"v":"两岸石壁，五色交辉。青林翠竹，四时俱备","s":"两岸石壁色彩斑斓交相辉映，青葱树林翠绿竹林四季常存","img":"images/recitation-comics/daxiezhongshu-c2.webp","no":"②"},{"v":"晓雾将歇，猿鸟乱鸣；夕日欲颓，沉鳞竞跃","s":"清晨薄雾将要消散时猿鸟此起彼伏地鸣叫，夕阳将落时潜游的鱼儿争相跃出水面","img":"images/recitation-comics/daxiezhongshu-c3.webp","no":"③"},{"v":"实是欲界之仙都","s":"这里实在是人间的仙境，云雾缭绕山水清绝，令人流连忘返","img":"images/recitation-comics/daxiezhongshu-c4.webp","no":"④"}]},{"id":32,"slug":"jichengtiansi","title":"记承天寺夜游","author":"宋·苏轼","type":"文言文","panels":[{"v":"元丰六年十月十二日夜，解衣欲睡，月色入户，欣然起行","s":"十月十二的夜晚，苏轼正欲解衣入睡，见月色洒满门户，欣然披衣起身走出门去","img":"images/recitation-comics/jichengtiansi-c1.webp","no":"①"},{"v":"遂至承天寺寻张怀民。怀民亦未寝，相与步于中庭","s":"到承天寺寻张怀民，怀民也还未睡，两人便一同在庭院中散步","img":"images/recitation-comics/jichengtiansi-c2.webp","no":"②"},{"v":"庭下如积水空明，水中藻荇交横，盖竹柏影也","s":"月光洒满庭院如一汪积水清澈透明，水中纵横交错的藻荇原来是竹柏的影子","img":"images/recitation-comics/jichengtiansi-c3.webp","no":"③"},{"v":"何夜无月？何处无竹柏？但少闲人如吾两人者耳","s":"月光下两位闲人并肩缓步，哪个夜晚没有月光？哪里没有竹柏？只是少有像我们这样的闲人罢了","img":"images/recitation-comics/jichengtiansi-c4.webp","no":"④"}]},{"id":33,"slug":"yuzhuyuansi","title":"与朱元思书","author":"南朝·吴均","type":"文言文","panels":[{"v":"风烟俱净，天山共色。从流飘荡，任意东西","s":"风停烟消天空山色浑然一色，小船随江流飘荡，任凭它时而偏东时而偏西","img":"images/recitation-comics/yuzhuyuansi-c1.webp","no":"①"},{"v":"水皆缥碧，千丈见底。游鱼细石，直视无碍","s":"江水青白透碧千丈深处也能见底，游动的鱼和细小的石子都能看得清清楚楚","img":"images/recitation-comics/yuzhuyuansi-c2.webp","no":"②"},{"v":"急湍甚箭，猛浪若奔","s":"湍急的水流比箭还快，凶猛的浪涛像飞奔的骏马","img":"images/recitation-comics/yuzhuyuansi-c3.webp","no":"③"},{"v":"负势竞上，互相轩邈；泉水激石，泠泠作响","s":"夹岸高山凭依形势争着向上，泉水冲击岩石发出泠泠清响","img":"images/recitation-comics/yuzhuyuansi-c4.webp","no":"④"}]},{"id":34,"slug":"yewang","title":"野望","author":"唐·王绩","type":"古诗","panels":[{"v":"东皋薄暮望，徙倚欲何依","s":"黄昏时分诗人独立东皋纵目远望，来来回回徘徊不定不知该归依何处","img":"images/recitation-comics/yewang-c1.webp","no":"①"},{"v":"树树皆秋色，山山唯落晖","s":"棵棵树木都染上秋天的色彩，重重山岭都只披着落日的余晖","img":"images/recitation-comics/yewang-c2.webp","no":"②"},{"v":"牧人驱犊返，猎马带禽归","s":"牧人赶着牛犊返回村里，猎人骑着马带着猎获的禽鸟归家","img":"images/recitation-comics/yewang-c3.webp","no":"③"},{"v":"相顾无相识，长歌怀采薇","s":"大家相顾无言彼此都不相识，诗人只好长声歌唱怀念古代采薇的隐士","img":"images/recitation-comics/yewang-c4.webp","no":"④"}]},{"id":35,"slug":"huanghelou","title":"黄鹤楼","author":"唐·崔颢","type":"古诗","panels":[{"v":"昔人已乘黄鹤去，此地空余黄鹤楼","s":"昔日的仙人已乘黄鹤飞去，此地只留下一座空荡荡的黄鹤楼","img":"images/recitation-comics/huanghelou-c1.webp","no":"①"},{"v":"黄鹤一去不复返，白云千载空悠悠","s":"黄鹤一去再也没有回来，千百年来只有白云悠悠飘荡","img":"images/recitation-comics/huanghelou-c2.webp","no":"②"},{"v":"晴川历历汉阳树，芳草萋萋鹦鹉洲","s":"晴日里汉阳一带的树木清晰可见，鹦鹉洲上芳草长得茂盛浓密","img":"images/recitation-comics/huanghelou-c3.webp","no":"③"},{"v":"日暮乡关何处是？烟波江上使人愁","s":"天色渐暮，眺望远方家乡在何处？江上烟波渺茫更使人发愁","img":"images/recitation-comics/huanghelou-c4.webp","no":"④"}]},{"id":36,"slug":"shizhisai","title":"使至塞上","author":"唐·王维","type":"古诗","panels":[{"v":"单车欲问边，属国过居延","s":"轻车简从出使边塞去慰问，途经居延属国，车马行于广袤大漠","img":"images/recitation-comics/shizhisai-c1.webp","no":"①"},{"v":"征蓬出汉塞，归雁入胡天","s":"像随风飘飞的蓬草飘出汉塞，像归巢的大雁飞入胡天，羁旅之感油然而生","img":"images/recitation-comics/shizhisai-c2.webp","no":"②"},{"v":"大漠孤烟直，长河落日圆","s":"浩瀚沙漠中一缕孤烟笔直升起，蜿蜒的黄河上一轮落日浑圆低垂","img":"images/recitation-comics/shizhisai-c3.webp","no":"③"},{"v":"萧关逢候骑，都护在燕然","s":"到萧关时遇到侦察骑兵，都说都护正在燕然前线，大军远在千里之外","img":"images/recitation-comics/shizhisai-c4.webp","no":"④"}]},{"id":37,"slug":"dujingmen","title":"渡荆门送别","author":"唐·李白","type":"古诗","panels":[{"v":"渡远荆门外，来从楚国游","s":"乘船远渡到荆门山之外，来到古时楚国故地尽情漫游","img":"images/recitation-comics/dujingmen-c1.webp","no":"①"},{"v":"山随平野尽，江入大荒流","s":"山峦随着平原的出现渐渐消失，江水在辽阔原野上奔流而去","img":"images/recitation-comics/dujingmen-c2.webp","no":"②"},{"v":"月下飞天镜，云生结海楼","s":"江中月影如天上飞来的明镜，云霞升腾结成海市蜃楼般的奇景","img":"images/recitation-comics/dujingmen-c3.webp","no":"③"},{"v":"仍怜故乡水，万里送行舟","s":"依旧深爱这来自故乡的江水，不远万里来送我的行舟","img":"images/recitation-comics/dujingmen-c4.webp","no":"④"}]},{"id":38,"slug":"qiantanghu","title":"钱塘湖春行","author":"唐·白居易","type":"古诗","panels":[{"v":"孤山寺北贾亭西，水面初平云脚低","s":"从孤山寺北到贾公亭西，春水初涨与堤岸相平，云幕低垂与湖面相连","img":"images/recitation-comics/qiantanghu-c1.webp","no":"①"},{"v":"几处早莺争暖树，谁家新燕啄春泥","s":"几只早出的黄莺争着飞向向阳的暖树，谁家新来的燕子正衔着春泥筑巢","img":"images/recitation-comics/qiantanghu-c2.webp","no":"②"},{"v":"乱花渐欲迷人眼，浅草才能没马蹄","s":"缤纷的春花渐渐要迷住人的眼睛，浅浅的春草刚刚能够没过马蹄","img":"images/recitation-comics/qiantanghu-c3.webp","no":"③"},{"v":"最爱湖东行不足，绿杨阴里白沙堤","s":"最爱湖东的美景总也游览不够，绿杨阴里那条白沙堤令人流连","img":"images/recitation-comics/qiantanghu-c4.webp","no":"④"}]},{"id":39,"slug":"tingzhongqishu","title":"庭中有奇树","author":"《古诗十九首》","type":"古诗","panels":[{"v":"庭中有奇树，绿叶发华滋","s":"庭院中一株佳美奇异的花树，绿叶间绽开繁盛的花朵","img":"images/recitation-comics/tingzhongqishu-c1.webp","no":"①"},{"v":"攀条折其荣，将以遗所思","s":"思妇攀着枝条折下最美的一枝花，想把它送给心中思念的远人","img":"images/recitation-comics/tingzhongqishu-c2.webp","no":"②"},{"v":"馨香盈怀袖，路远莫致之","s":"花香充满她的衣袖，可是路途遥远这花始终无法送到","img":"images/recitation-comics/tingzhongqishu-c3.webp","no":"③"},{"v":"此物何足贵，但感别经时","s":"这花本不足以珍贵，只是感伤离别已久，睹花思人","img":"images/recitation-comics/tingzhongqishu-c4.webp","no":"④"}]},{"id":40,"slug":"yinjiu","title":"饮酒（其五）","author":"东晋·陶渊明","type":"古诗","panels":[{"v":"结庐在人境，而无车马喧","s":"在人来人往之地结庐而居，却听不见车马的喧闹，柴门半掩静意自生","img":"images/recitation-comics/yinjiu-c1.webp","no":"①"},{"v":"问君何能尔？心远地自偏","s":"有人问为何能如此？只因心已远离尘俗，住地自然就显得偏远了","img":"images/recitation-comics/yinjiu-c2.webp","no":"②"},{"v":"采菊东篱下，悠然见南山","s":"东篱下俯身采菊，不经意间抬起头，悠然望见秀美的南山","img":"images/recitation-comics/yinjiu-c3.webp","no":"③"},{"v":"山气日夕佳，飞鸟相与还","s":"傍晚的山色氤氲美好，成群的飞鸟结伴归巢","img":"images/recitation-comics/yinjiu-c4.webp","no":"④"}]},{"id":41,"slug":"chibi","title":"赤壁","author":"唐·杜牧","type":"古诗","panels":[{"v":"折戟沉沙铁未销","s":"一支折断的铁戟沉埋在江底沙中，数百年过去铁还没有完全销蚀","img":"images/recitation-comics/chibi-c1.webp","no":"①"},{"v":"自将磨洗认前朝","s":"诗人把它捞起磨光洗净，认出那是前朝赤壁之战的遗物","img":"images/recitation-comics/chibi-c2.webp","no":"②"},{"v":"东风不与周郎便","s":"遥想当年若不是东风给周瑜方便，火攻之计便无从施展","img":"images/recitation-comics/chibi-c3.webp","no":"③"},{"v":"铜雀春深锁二乔","s":"那样一来，东吴的两位美人早被深锁进曹操的铜雀台了","img":"images/recitation-comics/chibi-c4.webp","no":"④"}]},{"id":42,"slug":"fuguibunengyin","title":"富贵不能淫","author":"《孟子》","type":"文言文","panels":[{"v":"一怒而诸侯惧，安居而天下熄","s":"景春指着远方说：公孙衍张仪一发怒诸侯都害怕，他们安静下来天下便太平无事","img":"images/recitation-comics/fuguibunengyin-c1.webp","no":"①"},{"v":"以顺为正者，妾妇之道也","s":"孟子摇头：把顺从当作准则的，那是妇人丫头遵行的道理，岂是大丈夫","img":"images/recitation-comics/fuguibunengyin-c2.webp","no":"②"},{"v":"居天下之广居，立天下之正位，行天下之大道","s":"真正的大丈夫住在天下最宽广的住宅里，站在天下最正确的位置，走天下最光明的道路","img":"images/recitation-comics/fuguibunengyin-c3.webp","no":"③"},{"v":"富贵不能淫，贫贱不能移，威武不能屈，此之谓大丈夫","s":"昂首而立的君子，富贵不能使他迷乱，贫贱不能使他动摇，威武不能使他屈服","img":"images/recitation-comics/fuguibunengyin-c4.webp","no":"④"}]},{"id":43,"slug":"shengyuyouhuan","title":"生于忧患，死于安乐","author":"《孟子》","type":"文言文","panels":[{"v":"舜发于畎亩之中，傅说举于版筑之间","s":"舜从田间耕作中被起用，傅说从筑墙的劳作中被举拔，六位先贤皆从微贱中崛起","img":"images/recitation-comics/shengyuyouhuan-c1.webp","no":"①"},{"v":"天将降大任于是人也，必先苦其心志，劳其筋骨，饿其体肤","s":"上天将要把重大使命降临给这样的人，必定先使他内心痛苦筋骨劳累身体饥饿","img":"images/recitation-comics/shengyuyouhuan-c2.webp","no":"②"},{"v":"行拂乱其所为，所以动心忍性，曾益其所不能","s":"让他所做的事颠倒错乱，以此震动心灵坚韧性情，增长他所不具备的才能","img":"images/recitation-comics/shengyuyouhuan-c3.webp","no":"③"},{"v":"然后知生于忧患而死于安乐也","s":"历经磨砺的人终于挺立起来，沉溺安乐的城邦悄然衰亡，忧患使人生存，安乐使人萎亡","img":"images/recitation-comics/shengyuyouhuan-c4.webp","no":"④"}]}]},{"vol":"八年级（下册）","color":"#2563EB","items":[{"id":44,"slug":"guanju","title":"关雎","author":"《诗经·周南》","type":"古诗","panels":[{"v":"关关雎鸠，在河之洲。窈窕淑女，君子好逑","s":"河中小洲上雎鸠关关和鸣，文静美好的姑娘正是君子的好配偶","img":"images/recitation-comics/guanju-c1.webp","no":"①"},{"v":"参差荇菜，左右流之。窈窕淑女，寤寐求之","s":"姑娘在水中采捞长短不齐的荇菜，君子对她朝思暮想日夜追求","img":"images/recitation-comics/guanju-c2.webp","no":"②"},{"v":"求之不得，寤寐思服。悠哉悠哉，辗转反侧","s":"追求不能如愿，思念绵绵不断，长夜漫漫翻来覆去难以入眠","img":"images/recitation-comics/guanju-c3.webp","no":"③"},{"v":"参差荇菜，左右采之。窈窕淑女，琴瑟友之，钟鼓乐之","s":"姑娘终于款款而来，君子弹琴鼓瑟与她亲近，敲钟打鼓使她快乐","img":"images/recitation-comics/guanju-c4.webp","no":"④"}]},{"id":45,"slug":"jianjia","title":"蒹葭","author":"《诗经·秦风》","type":"古诗","panels":[{"v":"蒹葭苍苍，白露为霜。所谓伊人，在水一方","s":"深秋芦苇苍茫，白露凝成了霜，所思慕的那个身影就在河的那一方","img":"images/recitation-comics/jianjia-c1.webp","no":"①"},{"v":"溯洄从之，道阻且长。溯游从之，宛在水中央","s":"逆流而上去追寻她，道路险阻而漫长；顺流而下去寻她，她仿佛又在水的中央","img":"images/recitation-comics/jianjia-c2.webp","no":"②"},{"v":"蒹葭萋萋，白露未晞。所谓伊人，在水之湄","s":"芦苇茂密连成一片，露水尚未晒干，那人的身影依稀又在水草交接的岸边","img":"images/recitation-comics/jianjia-c3.webp","no":"③"},{"v":"蒹葭采采，白露未已。道阻且右，宛在水中沚","s":"芦苇繁盛露水未干，追寻之路曲折难行，那身影又仿佛立在水中的小洲上，始终可望而不可即","img":"images/recitation-comics/jianjia-c4.webp","no":"④"}]},{"id":46,"slug":"shiwei","title":"式微","author":"《诗经·邶风》","type":"古诗","panels":[{"v":"式微式微，胡不归","s":"天色已晚暮色沉沉，为什么还不回家？役夫在暮色中劳作不息","img":"images/recitation-comics/shiwei-c1.webp","no":"①"},{"v":"微君之故，胡为乎中露","s":"若不是为君主劳役，何至于在露水中终年辛苦","img":"images/recitation-comics/shiwei-c2.webp","no":"②"},{"v":"式微式微，胡不归","s":"夜幕再次降临，仍不能归家的役夫仰天长叹","img":"images/recitation-comics/shiwei-c3.webp","no":"③"},{"v":"微君之躬，胡为乎泥中","s":"若不是为君主养贵体，何至于在泥浆中没日没夜地劳作","img":"images/recitation-comics/shiwei-c4.webp","no":"④"}]},{"id":47,"slug":"songshaofu","title":"送杜少府之任蜀州","author":"唐·王勃","type":"古诗","panels":[{"v":"城阙辅三秦，风烟望五津","s":"长安城阙被三秦大地护卫着，遥望蜀州五津只见风烟迷茫","img":"images/recitation-comics/songshaofu-c1.webp","no":"①"},{"v":"与君离别意，同是宦游人","s":"与你分别心中同怀不舍，我们都是远离故乡宦游之人","img":"images/recitation-comics/songshaofu-c2.webp","no":"②"},{"v":"海内存知己，天涯若比邻","s":"四海之内只要有知心朋友，纵使远在天涯也如近在比邻","img":"images/recitation-comics/songshaofu-c3.webp","no":"③"},{"v":"无为在歧路，儿女共沾巾","s":"在分别的岔路口，不要像小儿女一样让泪水沾湿佩巾","img":"images/recitation-comics/songshaofu-c4.webp","no":"④"}]},{"id":48,"slug":"wangdongtinghu","title":"望洞庭湖赠张丞相","author":"唐·孟浩然","type":"古诗","panels":[{"v":"八月湖水平，涵虚混太清","s":"八月洞庭湖水盛涨与岸齐平，水天含混相接浑然一体","img":"images/recitation-comics/wangdongtinghu-c1.webp","no":"①"},{"v":"气蒸云梦泽，波撼岳阳城","s":"云梦二泽水气蒸腾白白茫茫，波涛汹涌似乎把岳阳城撼动","img":"images/recitation-comics/wangdongtinghu-c2.webp","no":"②"},{"v":"欲济无舟楫，端居耻圣明","s":"想要渡水却没有船只，闲居不仕有愧于圣明的时代","img":"images/recitation-comics/wangdongtinghu-c3.webp","no":"③"},{"v":"坐观垂钓者，徒有羡鱼情","s":"坐着看别人垂钓，空有羡慕鱼儿上钩的心情","img":"images/recitation-comics/wangdongtinghu-c4.webp","no":"④"}]},{"id":49,"slug":"taohuayuan","title":"桃花源记","author":"东晋·陶渊明","type":"文言文","panels":[{"v":"缘溪行，忘路之远近。忽逢桃花林，夹岸数百步，中无杂树，芳草鲜美，落英缤纷","s":"渔人沿溪行船忘了路程远近，忽然遇见一片桃花林，两岸数百步内没有别的树，芳草鲜嫩落花缤纷","img":"images/recitation-comics/taohuayuan-c1.webp","no":"①"},{"v":"林尽水源，便得一山，山有小口，仿佛若有光。便舍船，从口入","s":"桃林尽处溪水发源处发现一座山，山有小口隐隐透出光亮，渔人便舍船从洞口钻入","img":"images/recitation-comics/taohuayuan-c2.webp","no":"②"},{"v":"土地平旷，屋舍俨然，有良田、美池、桑竹之属。阡陌交通，鸡犬相闻","s":"眼前豁然开朗，土地平旷屋舍整齐，良田美池桑竹环绕，田间小路交错相通，鸡鸣犬吠之声彼此可闻","img":"images/recitation-comics/taohuayuan-c3.webp","no":"③"},{"v":"自云先世避秦时乱……不复出焉。后遂无问津者","s":"村人自言先世为避秦时战乱携妻儿乡邻来此绝境，再也没有出去；渔人出洞处处做标记再去寻找却迷失了路，从此再无人问津","img":"images/recitation-comics/taohuayuan-c4.webp","no":"④"}]},{"id":50,"slug":"xiaoshitan","title":"小石潭记","author":"唐·柳宗元","type":"文言文","panels":[{"v":"从小丘西行百二十步，隔篁竹，闻水声，如鸣珮环，心乐之","s":"从小丘向西行走，隔着竹林听见水声，像玉珮玉环相互碰击般清脆，心中欢喜","img":"images/recitation-comics/xiaoshitan-c1.webp","no":"①"},{"v":"全石以为底，卷石底以出，为坻，为屿，为嵁，为岩。青树翠蔓，蒙络摇缀，参差披拂","s":"小潭以整块石头为底，石底翻卷出水面成为坻屿嵁岩，青葱的树木翠绿的藤蔓蒙盖缠绕摇曳参差","img":"images/recitation-comics/xiaoshitan-c2.webp","no":"②"},{"v":"潭中鱼可百许头，皆若空游无所依。日光下澈，影布石上","s":"潭中约有一百来条鱼，都好像在空中游动没有依托，阳光直射潭底鱼的影子映在石上","img":"images/recitation-comics/xiaoshitan-c3.webp","no":"③"},{"v":"四面竹树环合，寂寥无人，凄神寒骨，悄怆幽邃","s":"坐在潭上四面竹树环抱，寂静寥落没有旁人，寒气透骨幽静深邃，令人心生凄凉","img":"images/recitation-comics/xiaoshitan-c4.webp","no":"④"}]},{"id":51,"slug":"hezhouji","title":"核舟记","author":"明·魏学洢","type":"文言文","panels":[{"v":"明有奇巧人曰王叔远，能以径寸之木，为宫室、器皿、人物，罔不因势象形，各具情态","s":"明代奇巧匠人王叔远，能用直径一寸的木头雕刻宫室器皿人物，无不因势象形各具情态","img":"images/recitation-comics/hezhouji-c1.webp","no":"①"},{"v":"尝贻余核舟一，盖大苏泛赤壁云","s":"他曾赠送一枚核舟，刻的正是苏东坡泛舟游赤壁的场景，舟身小巧而气象万千","img":"images/recitation-comics/hezhouji-c2.webp","no":"②"},{"v":"船头坐三人，中峨冠而多髯者为东坡，佛印居右，鲁直居左。苏、黄共阅一手卷","s":"船头坐着三人，中间峨冠多髯的是东坡，佛印在右鲁直在左，苏黄二人共览一卷书画","img":"images/recitation-comics/hezhouji-c3.webp","no":"③"},{"v":"佛印绝类弥勒，袒胸露乳，矫首昂视，神情与苏、黄不属","s":"佛印极像弥勒佛，敞开胸怀露出双乳，抬头仰望，神情悠然与苏黄二人不同","img":"images/recitation-comics/hezhouji-c4.webp","no":"④"}]},{"id":52,"slug":"beimingyouyu","title":"北冥有鱼","author":"《庄子》","type":"文言文","panels":[{"v":"北冥有鱼，其名为鲲。鲲之大，不知其几千里也","s":"北方的大海里有一条鱼，名叫鲲，鲲的巨大不知道有几千里","img":"images/recitation-comics/beimingyouyu-c1.webp","no":"①"},{"v":"化而为鸟，其名为鹏。鹏之背，不知其几千里也","s":"鲲变化成鸟名叫鹏，鹏的背脊也不知道有几千里，遮天蔽日","img":"images/recitation-comics/beimingyouyu-c2.webp","no":"②"},{"v":"怒而飞，其翼若垂天之云","s":"大鹏振翅奋飞，那展开的双翅就像悬挂在天空的云","img":"images/recitation-comics/beimingyouyu-c3.webp","no":"③"},{"v":"水击三千里，抟扶摇而上者九万里","s":"鹏鸟起飞时水面激起三千里波涛，乘着旋风盘旋直上九万里高空","img":"images/recitation-comics/beimingyouyu-c4.webp","no":"④"}]},{"id":53,"slug":"suiyoujiaoyao","title":"虽有嘉肴","author":"《礼记》","type":"文言文","panels":[{"v":"虽有嘉肴，弗食，不知其旨也；虽有至道，弗学，不知其善也","s":"即使有美味佳肴不吃就不知道它的甘美，即使有最好的道理不学就不知道它的好处","img":"images/recitation-comics/suiyoujiaoyao-c1.webp","no":"①"},{"v":"学然后知不足，教然后知困","s":"深入学习之后才知道自己的不足，教导别人之后才知道自己还有困惑","img":"images/recitation-comics/suiyoujiaoyao-c2.webp","no":"②"},{"v":"知不足，然后能自反也；知困，然后能自强也","s":"知道不足然后才能自我反省，知道困惑然后才能自我勉励","img":"images/recitation-comics/suiyoujiaoyao-c3.webp","no":"③"},{"v":"故曰：教学相长也","s":"所以教与学是互相推动互相促进的，师者与弟子各有所得","img":"images/recitation-comics/suiyoujiaoyao-c4.webp","no":"④"}]},{"id":54,"slug":"mashuo","title":"马说","author":"唐·韩愈","type":"文言文","panels":[{"v":"世有伯乐，然后有千里马。千里马常有，而伯乐不常有","s":"世上先有伯乐然后才有千里马，千里马经常有，可是伯乐却不常有","img":"images/recitation-comics/mashuo-c1.webp","no":"①"},{"v":"祗辱于奴隶人之手，骈死于槽枥之间","s":"名马屈辱地在马夫手中受役使，和普通马一起死在马厩里，日行千里之才终被埋没","img":"images/recitation-comics/mashuo-c2.webp","no":"②"},{"v":"食不饱，力不足，才美不外见","s":"吃不饱力气不足，卓越的才能和优良的素质无法表现在外","img":"images/recitation-comics/mashuo-c3.webp","no":"③"},{"v":"执策而临之，曰：天下无马！呜呼！其真不知马也","s":"马夫手执马鞭走到马前却说天下没有好马，唉！哪里是真的没有马，只是不识马罢了","img":"images/recitation-comics/mashuo-c4.webp","no":"④"}]},{"id":55,"slug":"maowu","title":"茅屋为秋风所破歌","author":"唐·杜甫","type":"古诗","panels":[{"v":"八月秋高风怒号，卷我屋上三重茅","s":"八月秋深狂风怒号，卷走了屋顶上好几层茅草，草飞过江洒落江郊","img":"images/recitation-comics/maowu-c1.webp","no":"①"},{"v":"南村群童欺我老无力，公然抱茅入竹去","s":"南村的孩童欺负老人无力，当面把茅草抱进竹林，老人唇焦口燥呼喊不得，归来拄杖独自叹息","img":"images/recitation-comics/maowu-c2.webp","no":"②"},{"v":"床头屋漏无干处，雨脚如麻未断绝","s":"长夜屋漏床头没有一点干处，雨点像麻线一样密集不停，布衾冷硬娇儿踏裂","img":"images/recitation-comics/maowu-c3.webp","no":"③"},{"v":"安得广厦千万间，大庇天下寒士俱欢颜！吾庐独破受冻死亦足","s":"风雨中诗人遥想广厦千万间庇护天下寒士，哪怕自己的茅屋独破受冻而死也心甘情愿","img":"images/recitation-comics/maowu-c4.webp","no":"④"}]},{"id":56,"slug":"maitanweng","title":"卖炭翁","author":"唐·白居易","type":"古诗","panels":[{"v":"卖炭翁，伐薪烧炭南山中。满面尘灰烟火色，两鬓苍苍十指黑","s":"卖炭翁在终南山里伐木烧炭，满面尘灰烟熏火燎之色，两鬓花白十指乌黑","img":"images/recitation-comics/maitanweng-c1.webp","no":"①"},{"v":"可怜身上衣正单，心忧炭贱愿天寒","s":"可怜他身上衣衫单薄，心里却担忧炭价便宜，宁愿天气更冷些","img":"images/recitation-comics/maitanweng-c2.webp","no":"②"},{"v":"夜来城外一尺雪，晓驾炭车辗冰辙。牛困人饥日已高，市南门外泥中歇","s":"夜里城外下了一尺厚的雪，清晨驾着炭车碾过冰辙进城，牛困人饥日头已高，在市南门外泥泞中歇脚","img":"images/recitation-comics/maitanweng-c3.webp","no":"③"},{"v":"翩翩两骑来是谁？手把文书口称敕，半匹红纱一丈绫，系向牛头充炭直","s":"两个骑马的人轻快而来，手拿文书口称皇帝命令，调转车头吆喝着牛往北拉去，一车千余斤的炭只换来半匹红纱一丈绫系在牛头上","img":"images/recitation-comics/maitanweng-c4.webp","no":"④"}]},{"id":57,"slug":"tiposhansi","title":"题破山寺后禅院","author":"唐·常建","type":"古诗","panels":[{"v":"清晨入古寺，初日照高林","s":"清晨走进古老寺院，初升的太阳照耀着高高的山林","img":"images/recitation-comics/tiposhansi-c1.webp","no":"①"},{"v":"曲径通幽处，禅房花木深","s":"一条曲折的小路通向幽静的深处，禅房就掩映在繁茂花木深处","img":"images/recitation-comics/tiposhansi-c2.webp","no":"②"},{"v":"山光悦鸟性，潭影空人心","s":"山光明媚使飞鸟更加欢悦，潭水空明清澈涤荡心中的尘念","img":"images/recitation-comics/tiposhansi-c3.webp","no":"③"},{"v":"万籁此都寂，但余钟磬音","s":"此时此刻万物都沉默静寂，只留下敲钟击磬的悠悠清音","img":"images/recitation-comics/tiposhansi-c4.webp","no":"④"}]},{"id":58,"slug":"songyouren","title":"送友人","author":"唐·李白","type":"古诗","panels":[{"v":"青山横北郭，白水绕东城","s":"青翠的山峦横卧在城北，波光粼粼的流水绕过东城","img":"images/recitation-comics/songyouren-c1.webp","no":"①"},{"v":"此地一为别，孤蓬万里征","s":"在此地一分别，友人就像孤飞的蓬草踏上万里征程","img":"images/recitation-comics/songyouren-c2.webp","no":"②"},{"v":"浮云游子意，落日故人情","s":"天边浮云仿佛游子行踪不定，缓缓下落的夕阳依依不舍像老友惜别之情","img":"images/recitation-comics/songyouren-c3.webp","no":"③"},{"v":"挥手自兹去，萧萧班马鸣","s":"挥手告别从此离去，连马儿也萧萧长鸣似不忍分离","img":"images/recitation-comics/songyouren-c4.webp","no":"④"}]},{"id":59,"slug":"busuanzi","title":"卜算子·咏梅","author":"宋·陆游","type":"词","panels":[{"v":"驿外断桥边，寂寞开无主","s":"驿站之外的断桥旁边，一树梅花寂寞地开放无人照管","img":"images/recitation-comics/busuanzi-c1.webp","no":"①"},{"v":"已是黄昏独自愁，更著风和雨","s":"黄昏时分独自发愁，又遭到风吹雨打的摧残","img":"images/recitation-comics/busuanzi-c2.webp","no":"②"},{"v":"无意苦争春，一任群芳妒","s":"无意苦苦争抢春光，任凭百花嫉妒轻视","img":"images/recitation-comics/busuanzi-c3.webp","no":"③"},{"v":"零落成泥碾作尘，只有香如故","s":"花瓣零落凋残被碾作尘土，唯有那缕清香依旧如故","img":"images/recitation-comics/busuanzi-c4.webp","no":"④"}]}]},{"vol":"九年级（上册）","color":"#7C3AED","items":[{"id":60,"slug":"qinyuanchun","title":"沁园春·雪","author":"毛泽东","type":"词","panels":[{"v":"北国风光，千里冰封，万里雪飘","s":"北国大地千里冰封，万里长空雪花飞舞，一派苍茫壮阔","img":"images/recitation-comics/qinyuanchun-c1.webp","no":"①"},{"v":"山舞银蛇，原驰蜡象，欲与天公试比高","s":"群山像银蛇舞动，高原如白象奔驰，仿佛要与苍天一比高低","img":"images/recitation-comics/qinyuanchun-c2.webp","no":"②"},{"v":"江山如此多娇，引无数英雄竞折腰","s":"江山如此壮美多娇，引得古往今来无数英雄为之倾倒","img":"images/recitation-comics/qinyuanchun-c3.webp","no":"③"},{"v":"数风流人物，还看今朝","s":"秦皇汉武唐宗宋祖皆成过往，真正的风流人物还看今朝","img":"images/recitation-comics/qinyuanchun-c4.webp","no":"④"}]},{"id":61,"slug":"yueyanglou","title":"岳阳楼记","author":"宋·范仲淹","type":"文言文","panels":[{"v":"衔远山，吞长江，浩浩汤汤，横无际涯；朝晖夕阴，气象万千","s":"洞庭湖衔着远山吞着长江，浩浩荡荡无边无际，清晨湖面洒满阳光傍晚又是一片昏暗，气象变化万千","img":"images/recitation-comics/yueyanglou-c1.webp","no":"①"},{"v":"霪雨霏霏，连月不开；日星隐耀，山岳潜形；薄暮冥冥，虎啸猿啼","s":"连月阴雨绵绵不晴，日星失去光辉山岳隐没形迹，天色昏暗暮霭沉沉，虎啸猿啼令人满目萧然感极而悲","img":"images/recitation-comics/yueyanglou-c2.webp","no":"②"},{"v":"春和景明，波澜不惊；沙鸥翔集，锦鳞游泳；皓月千里，静影沉璧","s":"春风和煦阳光明媚，湖面平静沙鸥飞翔锦鳞游泳，皓月千里浮光闪着金色，静静的月影如沉入水中的玉璧","img":"images/recitation-comics/yueyanglou-c3.webp","no":"③"},{"v":"先天下之忧而忧，后天下之乐而乐","s":"岳阳楼上把酒临风，古仁人不以物喜不以己悲，先于天下人忧忧后于天下人乐乐","img":"images/recitation-comics/yueyanglou-c4.webp","no":"④"}]},{"id":62,"slug":"zuiwengting","title":"醉翁亭记","author":"宋·欧阳修","type":"文言文","panels":[{"v":"环滁皆山也。其西南诸峰，林壑尤美，望之蔚然而深秀者，琅琊也","s":"滁州四面环山，西南诸峰树林山谷格外秀美，草木茂盛幽深秀丽的那座便是琅琊山","img":"images/recitation-comics/zuiwengting-c1.webp","no":"①"},{"v":"峰回路转，有亭翼然临于泉上者，醉翁亭也","s":"山势回环路随峰转，有一座亭子四角翘起像鸟儿展翅一样飞架在泉上，那便是醉翁亭","img":"images/recitation-comics/zuiwengting-c2.webp","no":"②"},{"v":"若夫日出而林霏开，云归而岩穴暝，晦明变化者，山间之朝暮也","s":"太阳出来林间雾气散开，云雾归山岩谷昏暗，这明暗交替的便是山间的清晨与傍晚","img":"images/recitation-comics/zuiwengting-c3.webp","no":"③"},{"v":"临溪而渔，溪深而鱼肥；酿泉为酒，泉香而酒洌；觥筹交错，起坐而喧哗者，众宾欢也","s":"太守宴上临溪捕鱼溪深鱼肥，用酿泉的水造酒泉香酒清，宴中觥筹交错宾客起坐喧哗，苍颜白发的太守颓然醉倒其间","img":"images/recitation-comics/zuiwengting-c4.webp","no":"④"}]},{"id":63,"slug":"huxinting","title":"湖心亭看雪","author":"明·张岱","type":"文言文","panels":[{"v":"大雪三日，湖中人鸟声俱绝","s":"西湖大雪连下三日，湖中行人飞鸟的声音都消失了，天地一片寂静","img":"images/recitation-comics/huxinting-c1.webp","no":"①"},{"v":"余拏一小舟，拥毳衣炉火，独往湖心亭看雪","s":"更定之后作者撑一叶小舟，裹着毛皮衣拥着炉火，独自前往湖心亭看雪","img":"images/recitation-comics/huxinting-c2.webp","no":"②"},{"v":"雾凇沆砀，天与云与山与水，上下一白。湖上影子，惟长堤一痕、湖心亭一点、与余舟一芥、舟中人两三粒而已","s":"湖面冰花周围弥漫白气，天与云与山与水浑然一体上下一白，湖上只有长堤一道痕迹湖心亭一点，与一叶小舟舟中两三粒人影","img":"images/recitation-comics/huxinting-c3.webp","no":"③"},{"v":"湖中焉得更有此人！余强饮三大白而别","s":"亭上竟有两人铺毡对坐备好了酒，见了作者大喜，拉着同饮，作者强饮三大杯后作别","img":"images/recitation-comics/huxinting-c4.webp","no":"④"}]},{"id":64,"slug":"xinglunan","title":"行路难（其一）","author":"唐·李白","type":"古诗","panels":[{"v":"金樽清酒斗十千，玉盘珍羞直万钱。停杯投箸不能食","s":"金杯美酒一斗值十千，玉盘菜肴珍贵值万钱，诗人却放下杯子扔开筷子吃不下去","img":"images/recitation-comics/xinglunan-c1.webp","no":"①"},{"v":"欲渡黄河冰塞川，将登太行雪满山","s":"想渡黄河冰雪堵塞了河道，想登太行大雪铺满了山路，前路艰难","img":"images/recitation-comics/xinglunan-c2.webp","no":"②"},{"v":"闲来垂钓碧溪上，忽复乘舟梦日边","s":"遥想姜太公碧溪垂钓终遇明主，伊尹乘舟梦见经过太阳，古贤终有大器晚成之时","img":"images/recitation-comics/xinglunan-c3.webp","no":"③"},{"v":"长风破浪会有时，直挂云帆济沧海","s":"扬起云帆立于船头，坚信总有一天能乘风破浪，横渡苍茫大海","img":"images/recitation-comics/xinglunan-c4.webp","no":"④"}]},{"id":65,"slug":"chouletian","title":"酬乐天扬州初逢席上见赠","author":"唐·刘禹锡","type":"古诗","panels":[{"v":"巴山楚水凄凉地，二十三年弃置身","s":"被贬谪到巴山楚水这样凄凉的地方，度过了二十三年被弃置的岁月","img":"images/recitation-comics/chouletian-c1.webp","no":"①"},{"v":"怀旧空吟闻笛赋，到乡翻似烂柯人","s":"思念故友只能空吟闻笛赋，回到故乡恍如隔世恍若烂柯人","img":"images/recitation-comics/chouletian-c2.webp","no":"②"},{"v":"沉舟侧畔千帆过，病树前头万木春","s":"沉船旁边千帆竞相驶过，病树前面万木争春欣欣向荣，新事物必将取代旧事物","img":"images/recitation-comics/chouletian-c3.webp","no":"③"},{"v":"今日听君歌一曲，暂凭杯酒长精神","s":"今天听了你写的诗歌不胜感慨，暂且借着这杯酒振作精神","img":"images/recitation-comics/chouletian-c4.webp","no":"④"}]},{"id":66,"slug":"shuidiaogetou","title":"水调歌头（明月几时有）","author":"宋·苏轼","type":"词","panels":[{"v":"明月几时有？把酒问青天","s":"中秋月夜，诗人举杯遥问青天：明月是从什么时候开始有的？","img":"images/recitation-comics/shuidiaogetou-c1.webp","no":"①"},{"v":"我欲乘风归去，又恐琼楼玉宇，高处不胜寒","s":"想乘着清风回到天上去，又担心月宫琼楼玉宇太高经不住清寒","img":"images/recitation-comics/shuidiaogetou-c2.webp","no":"②"},{"v":"起舞弄清影，何似在人间","s":"月下翩翩起舞摆弄清影，天上哪里比得上人间","img":"images/recitation-comics/shuidiaogetou-c3.webp","no":"③"},{"v":"人有悲欢离合，月有阴晴圆缺，此事古难全。但愿人长久，千里共婵娟","s":"月光转过朱阁低照绮户照着无眠之人，人有悲欢离合月有阴晴圆缺自古难以两全，只愿亲人平安长久，相隔千里也能共赏这轮明月","img":"images/recitation-comics/shuidiaogetou-c4.webp","no":"④"}]},{"id":67,"slug":"yueye-yishedi","title":"月夜忆舍弟","author":"唐·杜甫","type":"古诗","panels":[{"v":"戍鼓断人行，边秋一雁声","s":"戍楼上的更鼓响起道路断绝人行，边塞秋夜一只孤雁在空中哀鸣","img":"images/recitation-comics/yueye-yishedi-c1.webp","no":"①"},{"v":"露从今夜白，月是故乡明","s":"露水从今夜起变得更白更凉，月亮还是故乡的最明亮","img":"images/recitation-comics/yueye-yishedi-c2.webp","no":"②"},{"v":"有弟皆分散，无家问死生","s":"有兄弟却都各自分散飘零，无家可归想打听生死也无从问起","img":"images/recitation-comics/yueye-yishedi-c3.webp","no":"③"},{"v":"寄书长不达，况乃未休兵","s":"平时寄出的家书常常都送不到，更何况如今战乱还没有平息","img":"images/recitation-comics/yueye-yishedi-c4.webp","no":"④"}]},{"id":68,"slug":"changsha-jiayi","title":"长沙过贾谊宅","author":"唐·刘长卿","type":"古诗","panels":[{"v":"三年谪宦此栖迟，万古惟留楚客悲","s":"贾谊被贬在此居住三年，千秋万代只留下一篇楚客的悲哀","img":"images/recitation-comics/changsha-jiayi-c1.webp","no":"①"},{"v":"秋草独寻人去后，寒林空见日斜时","s":"诗人踏着秋草独自寻访斯人已去的故宅，寒林间只见夕阳斜照","img":"images/recitation-comics/changsha-jiayi-c2.webp","no":"②"},{"v":"汉文有道恩犹薄，湘水无情吊岂知","s":"汉文帝是有道的明君对贾谊仍恩情淡薄，湘水无情凭吊又岂能知情","img":"images/recitation-comics/changsha-jiayi-c3.webp","no":"③"},{"v":"寂寂江山摇落处，怜君何事到天涯","s":"寂寂江山草木摇落的地方，怜悯你为何竟被贬谪到这般天涯","img":"images/recitation-comics/changsha-jiayi-c4.webp","no":"④"}]},{"id":69,"slug":"zuoqian-languan","title":"左迁至蓝关示侄孙湘","author":"唐·韩愈","type":"古诗","panels":[{"v":"一封朝奏九重天，夕贬潮州路八千","s":"清晨向朝廷呈上一封谏书，傍晚就被贬往八千里外的潮州","img":"images/recitation-comics/zuoqian-languan-c1.webp","no":"①"},{"v":"欲为圣明除弊事，肯将衰朽惜残年","s":"想替圣明天子革除弊政，哪肯顾惜衰朽之身吝惜残年","img":"images/recitation-comics/zuoqian-languan-c2.webp","no":"②"},{"v":"云横秦岭家何在？雪拥蓝关马不前","s":"云横秦岭回望长安家在何方？大雪拥塞蓝关马儿也不肯前行","img":"images/recitation-comics/zuoqian-languan-c3.webp","no":"③"},{"v":"知汝远来应有意，好收吾骨瘴江边","s":"知道你远道赶来应有所打算，正好到瘴江边收殓我的尸骨","img":"images/recitation-comics/zuoqian-languan-c4.webp","no":"④"}]},{"id":70,"slug":"shangshan","title":"商山早行","author":"唐·温庭筠","type":"古诗","panels":[{"v":"晨起动征铎，客行悲故乡","s":"清晨驿站的车铃声叮当作响，旅人上路还悲念着故乡","img":"images/recitation-comics/shangshan-c1.webp","no":"①"},{"v":"鸡声茅店月，人迹板桥霜","s":"鸡鸣声起茅草旅店上残月未落，板桥清霜之上已留下早行人的足迹","img":"images/recitation-comics/shangshan-c2.webp","no":"②"},{"v":"槲叶落山路，枳花明驿墙","s":"槲树叶飘落在山间小路上，枳树白花映照着驿站的土墙","img":"images/recitation-comics/shangshan-c3.webp","no":"③"},{"v":"因思杜陵梦，凫雁满回塘","s":"想起昨夜梦见杜陵的美景，野鸭大雁都挤满了曲折的池塘","img":"images/recitation-comics/shangshan-c4.webp","no":"④"}]},{"id":71,"slug":"wuti","title":"无题","author":"唐·李商隐","type":"古诗","panels":[{"v":"相见时难别亦难，东风无力百花残","s":"相见机会难得离别时更难分舍，暮春东风无力百花纷纷凋残","img":"images/recitation-comics/wuti-c1.webp","no":"①"},{"v":"春蚕到死丝方尽，蜡炬成灰泪始干","s":"春蚕直到死去才把丝吐尽，蜡烛燃成灰烬烛泪才流干","img":"images/recitation-comics/wuti-c2.webp","no":"②"},{"v":"晓镜但愁云鬓改，夜吟应觉月光寒","s":"清晨对镜梳妆只愁如云乌鬓悄然改变，夜里吟诗推想对方应感到月光清寒","img":"images/recitation-comics/wuti-c3.webp","no":"③"},{"v":"蓬山此去无多路，青鸟殷勤为探看","s":"对方住处离蓬莱山没有多远了，殷勤的青鸟请为我前去探望","img":"images/recitation-comics/wuti-c4.webp","no":"④"}]}]},{"vol":"九年级（下册）","color":"#DB2777","items":[{"id":72,"slug":"yuwosuoyuye","title":"鱼我所欲也","author":"《孟子》","type":"文言文","panels":[{"v":"鱼，我所欲也；熊掌，亦我所欲也。二者不可得兼，舍鱼而取熊掌者也","s":"桌上摆着鱼和熊掌两样美味，二者不可兼得时便舍弃鱼而选取熊掌","img":"images/recitation-comics/yuwosuoyuye-c1.webp","no":"①"},{"v":"生，亦我所欲也；义，亦我所欲也。二者不可得兼，舍生而取义者也","s":"生命是我珍视的，大义也是我珍视的，二者不可兼得时便舍弃生命而选取大义","img":"images/recitation-comics/yuwosuoyuye-c2.webp","no":"②"},{"v":"一箪食，一豆羹，得之则生，弗得则死。呼尔而与之，行道之人弗受","s":"饿汉跪在路旁，即使是一箪饭一碗羹，呵斥着给他连过路的饿人也不肯接受","img":"images/recitation-comics/yuwosuoyuye-c3.webp","no":"③"},{"v":"乡为身死而不受，今为宫室之美为之：此之谓失其本心","s":"从前宁死也不接受的东西，如今却为了豪宅美眷而接受，这便叫做丧失了本性","img":"images/recitation-comics/yuwosuoyuye-c4.webp","no":"④"}]},{"id":73,"slug":"caogui","title":"曹刿论战","author":"《左传》","type":"文言文","panels":[{"v":"齐师伐我。公将战，曹刿请见","s":"齐国军队攻打鲁国，鲁庄公准备迎战，平民曹刿主动请求进见献策","img":"images/recitation-comics/caogui-c1.webp","no":"①"},{"v":"小大之狱，虽不能察，必以情。对曰：忠之属也。可以一战","s":"庄公答：大大小小的诉讼案件即使不能一一明察也一定按实情处理，曹刿说这是尽职尽责的表现，可以凭此一战","img":"images/recitation-comics/caogui-c2.webp","no":"②"},{"v":"一鼓作气，再而衰，三而竭。彼竭我盈，故克之","s":"长勺之战齐人三次击鼓进军，曹刿按兵不动待齐军士气衰竭鲁军一鼓作气掩杀过去，大败齐师","img":"images/recitation-comics/caogui-c3.webp","no":"③"},{"v":"吾视其辙乱，望其旗靡，故逐之","s":"齐军败退时曹刿下车察看车辙、登上车轼远望，见辙乱旗倒才下令追击","img":"images/recitation-comics/caogui-c4.webp","no":"④"}]},{"id":74,"slug":"chushibiao","title":"出师表","author":"三国·诸葛亮","type":"文言文","panels":[{"v":"先帝创业未半而中道崩殂，今天下三分，益州疲弊，此诚危急存亡之秋也","s":"先帝开创大业未半而中道离世，如今天下三分益州民力困乏，这实在是危急存亡的关键时刻","img":"images/recitation-comics/chushibiao-c1.webp","no":"①"},{"v":"亲贤臣，远小人，此先汉所以兴隆也；亲小人，远贤臣，此后汉所以倾颓也","s":"诸葛亮在表中恳切进言：亲近贤臣疏远小人这是前汉兴隆的原因，亲近小人疏远贤臣这是后汉衰败的缘由","img":"images/recitation-comics/chushibiao-c2.webp","no":"②"},{"v":"先帝不以臣卑鄙，猥自枉屈，三顾臣于草庐之中","s":"先帝不因我出身低微屈尊自降，三次到草庐之中来访我，我由是感激，遂许先帝以驱驰","img":"images/recitation-comics/chushibiao-c3.webp","no":"③"},{"v":"受命以来，夙夜忧叹……五月渡泸，深入不毛。今当远离，临表涕零，不知所言","s":"受命以来日夜忧叹，五月率军渡过泸水深入不毛之地，如今南方已定兵甲已足，当奖率三军北定中原，临行泪落不知所言","img":"images/recitation-comics/chushibiao-c4.webp","no":"④"}]},{"id":75,"slug":"songdongyang","title":"送东阳马生序","author":"明·宋濂","type":"文言文","panels":[{"v":"家贫，无从致书以观，每假借于藏书之家，手自笔录，计日以还","s":"幼时家贫无书可读，常向藏书之家借书亲手抄录，按约定的日子归还从不失信","img":"images/recitation-comics/songdongyang-c1.webp","no":"①"},{"v":"天大寒，砚冰坚，手指不可屈伸，弗之怠","s":"大寒时节砚台里的墨结成了坚冰，手指冻得不能屈伸，仍然不敢懈怠抄录不辍","img":"images/recitation-comics/songdongyang-c2.webp","no":"②"},{"v":"余立侍左右，援疑质理，俯身倾耳以请；或遇其叱咄，色愈恭，礼愈至","s":"百里之外求师问学，恭敬地站立在老师身旁提出疑难询问道理，俯下身子侧着耳朵请教，遇到训斥时神情更加恭谨礼数更加周到","img":"images/recitation-comics/songdongyang-c3.webp","no":"③"},{"v":"负箧曳屣行深山巨谷中。穷冬烈风，大雪深数尺，足肤皲裂而不知","s":"背着书箱拖着鞋子行走在深山大谷之中，穷冬烈风大雪深达数尺，脚上的皮肤冻裂了也浑然不觉","img":"images/recitation-comics/songdongyang-c4.webp","no":"④"}]},{"id":76,"slug":"baixuege","title":"白雪歌送武判官归京","author":"唐·岑参","type":"古诗","panels":[{"v":"北风卷地白草折，胡天八月即飞雪","s":"北风席卷大地吹折白草，塞外八月就已满天飞雪","img":"images/recitation-comics/baixuege-c1.webp","no":"①"},{"v":"忽如一夜春风来，千树万树梨花开","s":"好像一夜之间春风忽然吹来，千万棵树上仿佛梨花竞相开放","img":"images/recitation-comics/baixuege-c2.webp","no":"②"},{"v":"瀚海阑干百丈冰，愁云惨淡万里凝","s":"沙漠纵横结着百丈坚冰，愁云暗淡在万里长空凝滞","img":"images/recitation-comics/baixuege-c3.webp","no":"③"},{"v":"山回路转不见君，雪上空留马行处","s":"轮台东门设帐送别友人，山路回转友人身影已消失，雪地上只空留一行马蹄印","img":"images/recitation-comics/baixuege-c4.webp","no":"④"}]},{"id":77,"slug":"guolingdingyang","title":"过零丁洋","author":"宋·文天祥","type":"古诗","panels":[{"v":"辛苦遭逢起一经，干戈寥落四周星","s":"靠精通经书考试入仕历尽辛苦，在荒凉冷落的战火中已度过四年","img":"images/recitation-comics/guolingdingyang-c1.webp","no":"①"},{"v":"山河破碎风飘絮，身世浮沉雨打萍","s":"大宋山河支离破碎像被风吹散的柳絮，自身浮沉如雨中漂泊无依的浮萍","img":"images/recitation-comics/guolingdingyang-c2.webp","no":"②"},{"v":"惶恐滩头说惶恐，零丁洋里叹零丁","s":"惶恐滩头曾诉说心中的惶恐，零丁洋里如今慨叹自身的孤零","img":"images/recitation-comics/guolingdingyang-c3.webp","no":"③"},{"v":"人生自古谁无死，留取丹心照汗青","s":"人生自古以来有谁能不死？留下这颗赤诚之心永远光照史册","img":"images/recitation-comics/guolingdingyang-c4.webp","no":"④"}]},{"id":78,"slug":"shanpoyang","title":"山坡羊·潼关怀古","author":"元·张养浩","type":"曲","panels":[{"v":"峰峦如聚，波涛如怒，山河表里潼关路","s":"华山的峰峦从四面八方汇聚，黄河的波涛奔腾咆哮，潼关外有黄河内有华山山河环抱","img":"images/recitation-comics/shanpoyang-c1.webp","no":"①"},{"v":"望西都，意踌躇","s":"遥望古都长安，心潮起伏思绪万千","img":"images/recitation-comics/shanpoyang-c2.webp","no":"②"},{"v":"伤心秦汉经行处，宫阙万间都做了土","s":"令人伤心的地方是秦汉故地经过之处，万千宫殿如今都化作了尘土","img":"images/recitation-comics/shanpoyang-c3.webp","no":"③"},{"v":"兴，百姓苦；亡，百姓苦","s":"朝代兴起百姓受苦，朝代灭亡百姓依旧受苦","img":"images/recitation-comics/shanpoyang-c4.webp","no":"④"}]},{"id":79,"slug":"nanxiangzi","title":"南乡子·登京口北固亭有怀","author":"宋·辛弃疾","type":"词","panels":[{"v":"何处望神州？满眼风光北固楼","s":"登上京口北固亭远望，中原故土在哪里呢？满眼所见只有北固楼四周的风光","img":"images/recitation-comics/nanxiangzi-c1.webp","no":"①"},{"v":"千古兴亡多少事？悠悠。不尽长江滚滚流","s":"千古兴亡多少事悠悠难说，只有不尽的长江滚滚东流","img":"images/recitation-comics/nanxiangzi-c2.webp","no":"②"},{"v":"年少万兜鍪，坐断东南战未休","s":"孙权年纪轻轻就统率千军万马，占据东南坚持征战不休","img":"images/recitation-comics/nanxiangzi-c3.webp","no":"③"},{"v":"天下英雄谁敌手？曹刘。生子当如孙仲谋","s":"天下英雄谁是孙权的对手？只有曹操和刘备，生儿子就应当像孙仲谋一样","img":"images/recitation-comics/nanxiangzi-c4.webp","no":"④"}]},{"id":80,"slug":"pozhenzi","title":"破阵子·为陈同甫赋壮词以寄之","author":"宋·辛弃疾","type":"词","panels":[{"v":"醉里挑灯看剑，梦回吹角连营","s":"醉里挑亮灯芯端详宝剑，梦中回到号角连天的军营","img":"images/recitation-comics/pozhenzi-c1.webp","no":"①"},{"v":"八百里分麾下炙，五十弦翻塞外声，沙场秋点兵","s":"军营里把烤牛肉分给部下，乐器奏起雄壮的边塞军歌，秋天在沙场上检阅军队","img":"images/recitation-comics/pozhenzi-c2.webp","no":"②"},{"v":"马作的卢飞快，弓如霹雳弦惊","s":"战马像的卢马一样飞驰，弓弦响声如惊雷霹雳","img":"images/recitation-comics/pozhenzi-c3.webp","no":"③"},{"v":"了却君王天下事，赢得生前身后名。可怜白发生","s":"一心想为君王完成收复中原的大业，赢得生前死后的美名，可惜壮志未酬满头白发已生","img":"images/recitation-comics/pozhenzi-c4.webp","no":"④"}]},{"id":81,"slug":"linjiangxian","title":"临江仙·夜登小阁，忆洛中旧游","author":"宋·陈与义","type":"词","panels":[{"v":"忆昔午桥桥上饮，坐中多是豪英","s":"回忆当年在午桥桥上宴饮，在座的多是英雄才俊","img":"images/recitation-comics/linjiangxian-c1.webp","no":"①"},{"v":"长沟流月去无声。杏花疏影里，吹笛到天明","s":"月光随长沟流水悄悄逝去无声无息，杏花稀疏的影子里吹着笛子直到天明","img":"images/recitation-comics/linjiangxian-c2.webp","no":"②"},{"v":"二十余年如一梦，此身虽在堪惊","s":"二十多年过去恍如一场梦，此身虽在回首往事胆战心惊","img":"images/recitation-comics/linjiangxian-c3.webp","no":"③"},{"v":"古今多少事，渔唱起三更","s":"闲登小阁看新雨初晴的夜色，古今多少兴亡旧事，都化作渔人三更时的歌声","img":"images/recitation-comics/linjiangxian-c4.webp","no":"④"}]},{"id":82,"slug":"jiangchengzi","title":"江城子·密州出猎","author":"宋·苏轼","type":"词","panels":[{"v":"老夫聊发少年狂，左牵黄，右擎苍","s":"老夫姑且抒发一回少年人的狂气，左手牵着猎犬右臂托着猎鹰","img":"images/recitation-comics/jiangchengzi-c1.webp","no":"①"},{"v":"锦帽貂裘，千骑卷平冈","s":"随行将士头戴锦帽身着貂裘，千骑奔驰席卷平坦的山冈","img":"images/recitation-comics/jiangchengzi-c2.webp","no":"②"},{"v":"为报倾城随太守，亲射虎，看孙郎","s":"为报答全城人跟随太守出猎的盛情，要像孙权一样亲自弯弓射虎","img":"images/recitation-comics/jiangchengzi-c3.webp","no":"③"},{"v":"会挽雕弓如满月，西北望，射天狼","s":"将那雕弓拉得如满月一般，朝着西北方向瞄准天狼星，射向来犯之敌","img":"images/recitation-comics/jiangchengzi-c4.webp","no":"④"}]},{"id":83,"slug":"dingfengbo","title":"定风波（莫听穿林打叶声）","author":"宋·苏轼","type":"词","panels":[{"v":"莫听穿林打叶声，何妨吟啸且徐行","s":"雨点穿过树林打在叶上沙沙作响，不必理会，不妨一边吟咏长啸一边从容徐行","img":"images/recitation-comics/dingfengbo-c1.webp","no":"①"},{"v":"竹杖芒鞋轻胜马，谁怕？一蓑烟雨任平生","s":"拄着竹杖穿着草鞋轻便胜过骑马，有什么可怕的？披一身蓑衣任凭风吹雨打，这就是我的一生","img":"images/recitation-comics/dingfengbo-c2.webp","no":"②"},{"v":"料峭春风吹酒醒，微冷，山头斜照却相迎","s":"微寒的春风将我的酒意吹醒，身上略感微微发冷，山头初晴的斜阳却已殷殷相迎","img":"images/recitation-comics/dingfengbo-c3.webp","no":"③"},{"v":"回首向来萧瑟处，归去，也无风雨也无晴","s":"回望来时风雨萧瑟的地方，归去时既没有风雨也无晴天，宠辱不惊去留无意","img":"images/recitation-comics/dingfengbo-c4.webp","no":"④"}]},{"id":84,"slug":"taichangyin","title":"太常引·建康中秋夜为吕叔潜赋","author":"宋·辛弃疾","type":"词","panels":[{"v":"一轮秋影转金波，飞镜又重磨","s":"中秋明月洒下金色的波光，像新磨的铜镜般明亮飞上天空","img":"images/recitation-comics/taichangyin-c1.webp","no":"①"},{"v":"把酒问姮娥：被白发，欺人奈何","s":"举杯遥问月中嫦娥：白发日渐增多，仿佛在欺负人，这可怎么办？","img":"images/recitation-comics/taichangyin-c2.webp","no":"②"},{"v":"乘风好去，长空万里，直下看山河","s":"我要乘风飞上万里长空，俯瞰祖国的大好山河","img":"images/recitation-comics/taichangyin-c3.webp","no":"③"},{"v":"斫去桂婆娑，人道是，清光更多","s":"砍去月宫中婆娑摇曳的桂树阴影，人们说这样月光会更加清澈明亮","img":"images/recitation-comics/taichangyin-c4.webp","no":"④"}]},{"id":85,"slug":"huanxisha","title":"浣溪沙（身向云山那畔行）","author":"清·纳兰性德","type":"词","panels":[{"v":"身向云山那畔行，北风吹断马嘶声","s":"向云山那边一路前行，北风凛冽吹断了马的嘶鸣","img":"images/recitation-comics/huanxisha-c1.webp","no":"①"},{"v":"深秋远塞若为情","s":"深秋时节远赴边塞，心中涌起万般滋味","img":"images/recitation-comics/huanxisha-c2.webp","no":"②"},{"v":"一抹晚烟荒戍垒，半竿斜日旧关城","s":"一抹傍晚的炊烟升起在荒凉的戍楼营垒，半竿高的斜阳照着古老的关城","img":"images/recitation-comics/huanxisha-c3.webp","no":"③"},{"v":"古今幽恨几时平","s":"古今兴亡的无限幽恨，要到什么时候才能平息呢","img":"images/recitation-comics/huanxisha-c4.webp","no":"④"}]}]}];
const flat = [];
DATA.forEach(v => v.items.forEach(it => flat.push({...it, vol: v.vol, color: v.color})));
const TOTAL = flat.length;

const $ = id => document.getElementById(id);
let cur = 0, curPanel = 0, blurMode = false, showScene = true;

/* ---------- sidebar ---------- */
let html = '';
DATA.forEach((v, vi) => {
  html += `<div class="vol${vi === 0 ? ' open' : ''}" data-vol="${vi}">
    <button class="vol-btn">
      <span class="dot" style="background:${v.color}"></span>${v.vol}
      <span class="cnt">${v.items.length}</span><span class="arw">▶</span>
    </button>
    <div class="vol-list">`;
  v.items.forEach(it => {
    html += `<button class="poem-btn" data-id="${it.id}">
      <span class="pno">${String(it.id + 1).padStart(2, '0')}</span><span>${it.title}</span>
    </button>`;
  });
  html += `</div></div>`;
});
$('sideBody').innerHTML = html;
$('sideCount').textContent = TOTAL + ' 篇';

$('sideBody').addEventListener('click', e => {
  const vb = e.target.closest('.vol-btn');
  if (vb) { vb.parentElement.classList.toggle('open'); return; }
  const pb = e.target.closest('.poem-btn');
  if (pb) { go(+pb.dataset.id); closeSide(); }
});

/* ---------- render ---------- */
function go(i) {
  cur = (i + TOTAL) % TOTAL;
  const p = flat[cur];
  $('pTitle').textContent = p.title;
  $('pMeta').innerHTML =
    `<span class="chip vol" style="background:${p.color}">${p.vol}</span>` +
    `<span class="chip">${p.author}</span>` +
    `<span class="chip type">${p.type}</span>` +
    `<span class="chip">四格连环画</span>`;
  $('pCounter').textContent = `${cur + 1} / ${TOTAL}`;

  $('grid').innerHTML = p.panels.map((pn, k) => `
    <article class="pn${blurMode ? ' hide-verse' : ''}${showScene ? '' : ' no-scene'}" data-k="${k}">
      <div class="pn-img">
        <span class="pn-no">${pn.no}</span>
        <img src="${pn.img}" alt="${p.title} 第${k + 1}格" loading="${k < 2 ? 'eager' : 'lazy'}">
        <span class="reveal-tip">点击看图猜诗句</span>
      </div>
      <div class="pn-txt">
        <div class="verse">${pn.v}</div>
        <div class="scene">${pn.s}</div>
      </div>
    </article>`).join('');

  document.querySelectorAll('.poem-btn').forEach(b => b.classList.toggle('active', +b.dataset.id === cur));
  const volBox = document.querySelector(`.vol[data-vol="${DATA.findIndex(v => v.vol === p.vol)}"]`);
  if (volBox) volBox.classList.add('open');
  const act = document.querySelector('.poem-btn.active');
  if (act) act.scrollIntoView({block: 'nearest'});
  window.scrollTo({top: 0, behavior: 'smooth'});
  history.replaceState(null, '', '#' + p.slug);
}

/* ---------- panel interactions ---------- */
$('grid').addEventListener('click', e => {
  const pn = e.target.closest('.pn');
  if (!pn) return;
  const k = +pn.dataset.k;
  if (blurMode && !pn.classList.contains('revealed')) {
    pn.classList.add('revealed');
  } else {
    openLb(k);
  }
});

/* ---------- lightbox ---------- */
function openLb(k) {
  curPanel = k;
  const p = flat[cur], pn = p.panels[k];
  $('lbImg').src = pn.img;
  $('lbVerse').textContent = pn.v;
  $('lbScene').textContent = `${p.title} · ${p.author}　|　${pn.s}`;
  $('lb').classList.add('show');
}
function closeLb() { $('lb').classList.remove('show'); }
$('lbClose').onclick = closeLb;
$('lb').onclick = e => { if (e.target === $('lb') || e.target.id === 'lbImg') closeLb(); };
$('lbPrev').onclick = e => { e.stopPropagation(); openLb((curPanel + 3) % 4); };
$('lbNext').onclick = e => { e.stopPropagation(); openLb((curPanel + 1) % 4); };
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeLb();
  if ($('lb').classList.contains('show')) {
    if (e.key === 'ArrowLeft') openLb((curPanel + 3) % 4);
    if (e.key === 'ArrowRight') openLb((curPanel + 1) % 4);
    return;
  }
  if (e.key === 'ArrowLeft') go(cur - 1);
  if (e.key === 'ArrowRight') go(cur + 1);
});
document.addEventListener('touchstart', e => { tsx = e.touches[0].clientX; }, {passive: true});
let tsx = 0;
document.addEventListener('touchend', e => {
  if ($('lb').classList.contains('show')) return;
  const dx = e.changedTouches[0].clientX - tsx;
  if (Math.abs(dx) > 90) go(cur + (dx < 0 ? 1 : -1));
}, {passive: true});

/* ---------- toolbar ---------- */
$('btnPrev').onclick = () => go(cur - 1);
$('btnNext').onclick = () => go(cur + 1);
$('btnBlur').onclick = () => {
  blurMode = !blurMode;
  $('btnBlur').classList.toggle('on', blurMode);
  $('btnBlur').textContent = blurMode ? '👁 背诗中' : '👁 看图背诗';
  document.querySelectorAll('.pn').forEach(pn => {
    pn.classList.toggle('hide-verse', blurMode);
    pn.classList.remove('revealed');
  });
};
$('btnScene').onclick = () => {
  showScene = !showScene;
  $('btnScene').classList.toggle('on', !showScene);
  $('btnScene').textContent = showScene ? '📝 图注' : '📝 图注（隐藏）';
  document.querySelectorAll('.pn').forEach(pn => pn.classList.toggle('no-scene', !showScene));
};

/* ---------- sidebar toggle (mobile) ---------- */
function closeSide() { if (innerWidth <= 1080) { $('sidebar').classList.add('collapsed'); $('mask').classList.remove('show'); } }
$('sideToggle').onclick = () => {
  const c = $('sidebar').classList.toggle('collapsed');
  $('mask').classList.toggle('show', !c);
};
$('mask').onclick = closeSide;

/* ---------- init ---------- */
const hash = decodeURIComponent(location.hash.replace('#', ''));
if (innerWidth <= 1080) { $('sidebar').classList.add('collapsed'); }
const startIdx = hash ? flat.findIndex(p => p.slug === hash) : 0;
go(startIdx < 0 ? 0 : startIdx);
</script>
</body>
</html>
