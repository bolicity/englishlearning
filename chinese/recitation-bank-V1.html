：满一年。"}, {"s": "板块五：上海中考真题与模拟·课内文言字词释义与多义通假", "sid": "sh-words", "n": 91, "id": "sh-words-389", "tag": "文言字词专项·第91题", "t": "填空题", "stem": "解释下列句中加点字：\n故天将降大任于是．人也：__________", "ans": "这、这样", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】《孟子·生于忧患，死于安乐》。是：代词，这。"}, {"s": "板块五：上海中考真题与模拟·课内文言字词释义与多义通假", "sid": "sh-words", "n": 92, "id": "sh-words-390", "tag": "文言字词专项·第92题", "t": "填空题", "stem": "解释下列句中加点字：\n动心忍．性，曾益其所不能：__________", "ans": "坚韧、使……坚韧", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】《生于忧患，死于安乐》。忍：使动用法，使他的性格坚强起来。"}, {"s": "板块五：上海中考真题与模拟·课内文言字词释义与多义通假", "sid": "sh-words", "n": 93, "id": "sh-words-391", "tag": "文言字词专项·第93题", "t": "填空题", "stem": "解释下列句中加点字：\n安．陵君其许寡人：__________", "ans": "副词，表祈使商量语气，可译为“一定、希望”", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】《唐雎不辱使命》。其：表祈使语气助词。"}, {"s": "板块五：上海中考真题与模拟·课内文言字词释义与多义通假", "sid": "sh-words", "n": 94, "id": "sh-words-392", "tag": "文言字词专项·第94题", "t": "填空题", "stem": "解释下列句中加点字：\n长跪而谢．之：__________", "ans": "道歉、认错", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】《唐雎不辱使命》。谢：动词，道歉。"}, {"s": "板块五：上海中考真题与模拟·课内文言字词释义与多义通假", "sid": "sh-words", "n": 95, "id": "sh-words-393", "tag": "文言字词专项·第95题", "t": "填空题", "stem": "解释下列句中加点字：\n寡人谕．矣：__________", "ans": "明白、懂得", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】《唐雎不辱使命》。谕：明白、晓悟。"}, {"s": "板块五：上海中考真题与模拟·课内文言字词释义与多义通假", "sid": "sh-words", "n": 96, "id": "sh-words-394", "tag": "文言字词专项·第96题", "t": "填空题", "stem": "解释下列句中加点字：\n媵人持汤沃．灌：__________", "ans": "浇、洗", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】宋濂《送东阳马生序》。沃：浇水洗涤。"}, {"s": "板块五：上海中考真题与模拟·课内文言字词释义与多义通假", "sid": "sh-words", "n": 97, "id": "sh-words-395", "tag": "文言字词专项·第97题", "t": "填空题", "stem": "解释下列句中加点字：\n烨然若神人．．：__________", "ans": "光彩照人的样子", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】宋濂《送东阳马生序》。烨然：光彩鲜明貌。"}, {"s": "板块五：上海中考真题与模拟·课内文言字词释义与多义通假", "sid": "sh-words", "n": 98, "id": "sh-words-396", "tag": "文言字词专项·第98题", "t": "填空题", "stem": "解释下列句中加点字：\n余立侍左右，援．疑质理：__________", "ans": "引、提出", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】宋濂《送东阳马生序》。援：引述、提出；质：询问、求教。"}, {"s": "板块五：上海中考真题与模拟·课内文言字词释义与多义通假", "sid": "sh-words", "n": 99, "id": "sh-words-397", "tag": "文言字词专项·第99题", "t": "填空题", "stem": "解释下列句中加点字：\n色愈恭，礼愈至．：__________", "ans": "周到、极点", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】宋濂《送东阳马生序》。至：周到、恭敬至极。"}, {"s": "板块五：上海中考真题与模拟·课内文言字词释义与多义通假", "sid": "sh-words", "n": 100, "id": "sh-words-398", "tag": "文言字词专项·第100题", "t": "填空题", "stem": "解释下列句中加点字：\n流血五步，天下缟素．．：__________", "ans": "穿白色丧服（代指为国君戴孝执丧）", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】《唐雎不辱使命》。缟、素均为白色绢帛。"}, {"s": "板块六：上海中考真题与模拟·课内文言重点句子翻译与文意探究", "sid": "sh-fanyi", "n": 1, "id": "sh-fanyi-399", "tag": "2025上海中考第5题", "t": "翻译题", "stem": "用现代汉语翻译下列句子：\n苔痕上阶绿，草色入帘青。", "ans": "苔痕碧绿，长到台阶上；草色青葱，映入竹帘中。", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】刘禹锡《陋室铭》。\n【采分点】\n1. “上”、“入”的动词活用落实（长上、映入）。\n2. 对仗工整，准确译出陋室幽雅清朗的自然环境描写，以景衬托主人高洁的情操。"}, {"s": "板块六：上海中考真题与模拟·课内文言重点句子翻译与文意探究", "sid": "sh-fanyi", "n": 2, "id": "sh-fanyi-400", "tag": "2024上海中考第5题", "t": "翻译题", "stem": "用现代汉语翻译下列句子：\n万钟则不辩礼义而受之，万钟于我何加焉！", "ans": "（如果有人）优厚俸禄却不分辨是否合乎礼义就接受它，这优厚的俸禄对我有什么益处呢！", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】《孟子·鱼我所欲也》。\n【采分点】\n1. 辨：通“辨”，辨别、分辨；\n2. 何加：宾语前置，有什么益处/好处；\n3. 译出反问语气。"}, {"s": "板块六：上海中考真题与模拟·课内文言重点句子翻译与文意探究", "sid": "sh-fanyi", "n": 3, "id": "sh-fanyi-401", "tag": "2023上海中考第7题", "t": "翻译题", "stem": "用现代汉语翻译下列句子：\n善哉乎鼓琴，巍巍乎若太山。", "ans": "琴弹得真好啊，巍峨高耸就像泰山一样！", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】《吕氏春秋·伯牙鼓琴》。\n【采分点】\n1. 善哉：好啊、赞叹声；\n2. 巍巍：高大崇峻的样子；\n3. 鼓琴：弹奏古琴。"}, {"s": "板块六：上海中考真题与模拟·课内文言重点句子翻译与文意探究", "sid": "sh-fanyi", "n": 4, "id": "sh-fanyi-402", "tag": "2022上海中考第7题", "t": "翻译题", "stem": "用现代汉语翻译下列句子：\n日初出沧沧凉凉，及其日中如探汤，此不为近者热而远者凉乎？", "ans": "太阳刚出来时清凉寒冷，等到正午时热得像把手伸进热水里，这难道不是距离近的就热而距离远的就凉吗？", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】《列子·两小儿辩日》。\n【采分点】\n1. 沧沧凉凉：清凉寒冷貌；\n2. 探汤：把手伸进热水；\n3. 译出反问句式（此不为……乎）。"}, {"s": "板块六：上海中考真题与模拟·课内文言重点句子翻译与文意探究", "sid": "sh-fanyi", "n": 5, "id": "sh-fanyi-403", "tag": "2021上海中考第10题", "t": "翻译题", "stem": "用现代汉语翻译下列句子：\n登斯楼也，则有去国怀乡，忧谗畏讥，满目萧然，感极而悲者矣。", "ans": "（这时）登上这座楼，就会产生远离京城、怀念家乡，担心被说坏话、害怕被讥讽，满目萧条凄凉，感触到了极点而悲伤的情怀了。", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】范仲淹《岳阳楼记》。\n【采分点】\n1. 去国：离开国都/京城；\n2. 忧谗畏讥：担心谗言，害怕讥讽；\n3. 萧然：萧条冷落的样子。"}, {"s": "板块六：上海中考真题与模拟·课内文言重点句子翻译与文意探究", "sid": "sh-fanyi", "n": 6, "id": "sh-fanyi-404", "tag": "2020上海中考第8题", "t": "翻译题", "stem": "用现代汉语翻译下列句子：\n叶徒相似，其实味不同。所以然者何？水土异也。", "ans": "树叶只是相似，它们的果实味道却不同。这样的原因是什么呢？（是因为两地的）水土不同啊。", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】《晏子使楚》。\n【采分点】\n1. 徒：只、仅仅；\n2. 其实：它们的果实（其：代词它们，实：果实）；\n3. 所以然者何：自问自答表因果。"}, {"s": "板块六：上海中考真题与模拟·课内文言重点句子翻译与文意探究", "sid": "sh-fanyi", "n": 7, "id": "sh-fanyi-405", "tag": "2019上海中考第8题", "t": "翻译题", "stem": "用现代汉语翻译下列句子：\n问今是何世，乃不知有汉，无论魏晋。", "ans": "（源中人）问现在是什么朝代，竟然不知道有过汉朝，更不必说魏朝和晋朝了。", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】陶渊明《桃花源记》。\n【采分点】\n1. 乃：副词，竟然；\n2. 无论：更不必说；\n3. 省略主语补充准确。"}, {"s": "板块六：上海中考真题与模拟·课内文言重点句子翻译与文意探究", "sid": "sh-fanyi", "n": 8, "id": "sh-fanyi-406", "tag": "2018上海中考第8题", "t": "翻译题", "stem": "用现代汉语翻译下列句子：\n一狼洞其中，意将隧入以攻其后也。", "ans": "一只狼在柴草堆里打洞，打算顺着通道钻进去从背后攻击屠户。", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】蒲松龄《狼》。\n【采分点】\n1. 洞：名词活用为动词，打洞；\n2. 隧：名词作状语，从通道/打地道；\n3. 意：企图、打算。"}, {"s": "板块六：上海中考真题与模拟·课内文言重点句子翻译与文意探究", "sid": "sh-fanyi", "n": 9, "id": "sh-fanyi-407", "tag": "2017上海中考第8题", "t": "翻译题", "stem": "用现代汉语翻译下列句子：\n微斯人，吾谁与归？", "ans": "如果没有这种人，我同谁一道呢？（我归附、敬仰谁呢？）", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】范仲淹《岳阳楼记》。\n【采分点】\n1. 微：如果没有；\n2. 吾谁与归：宾语前置句（吾与谁归）。"}, {"s": "板块六：上海中考真题与模拟·课内文言重点句子翻译与文意探究", "sid": "sh-fanyi", "n": 10, "id": "sh-fanyi-408", "tag": "2016上海中考第8题", "t": "翻译题", "stem": "用现代汉语翻译下列句子：\n莲之爱，同予者何人？", "ans": "对于莲花的喜爱，像我一样的还有谁呢？", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】周敦颐《爱莲说》。\n【采分点】\n1. 莲之爱：宾语前置，爱莲；\n2. 同予者：像我一样的人。"}, {"s": "板块六：上海中考真题与模拟·课内文言重点句子翻译与文意探究", "sid": "sh-fanyi", "n": 11, "id": "sh-fanyi-409", "tag": "2015上海中考第8题", "t": "翻译题", "stem": "用现代汉语翻译下列句子：\n醉能同其乐，醒能述以文者，太守也。", "ans": "醉了能够同大家一起欢乐，醒来能用文章记叙这种乐事的人，是太守啊。", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】欧阳修《醉翁亭记》。\n【采分点】\n1. 同其乐：与民同乐；\n2. 述以文：介宾短语后置（以文述）；\n3. 判断句式（……者，……也）。"}, {"s": "板块六：上海中考真题与模拟·课内文言重点句子翻译与文意探究", "sid": "sh-fanyi", "n": 12, "id": "sh-fanyi-410", "tag": "2014上海中考第8题", "t": "翻译题", "stem": "用现代汉语翻译下列句子：\n小大之狱，虽不能察，必以情。", "ans": "大大小小的诉讼案件，即使不能一一明察，也一定按照实情处理。", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】《曹刿论战》。\n【采分点】\n1. 狱：诉讼案件；\n2. 虽：即使；\n3. 情：实情、诚意。"}, {"s": "板块六：上海中考真题与模拟·课内文言重点句子翻译与文意探究", "sid": "sh-fanyi", "n": 13, "id": "sh-fanyi-411", "tag": "2013上海中考第8题", "t": "翻译题", "stem": "用现代汉语翻译下列句子：\n亲贤臣，远小人，此先汉所以兴隆也。", "ans": "亲近贤能的大臣，远离奸佞的小人，这是前汉之所以兴盛昌隆的原因。", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】诸葛亮《出师表》。\n【采分点】\n1. 亲、远：形容词作动词，亲近、疏远；\n2. 所以：……的原因。"}, {"s": "板块六：上海中考真题与模拟·课内文言重点句子翻译与文意探究", "sid": "sh-fanyi", "n": 14, "id": "sh-fanyi-412", "tag": "2012上海中考第8题", "t": "翻译题", "stem": "用现代汉语翻译下列句子：\n以中有足乐者，不知口体之奉不若人也。", "ans": "因为内心有足以快乐的事情（读书求知），就不觉得吃的穿的享受不如别人了。", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】宋濂《送东阳马生序》。\n【采分点】\n1. 以：连词，因为；\n2. 足乐者：足以快乐的事；\n3. 口体之奉：吃的穿的奉养供给。"}, {"s": "板块六：上海中考真题与模拟·课内文言重点句子翻译与文意探究", "sid": "sh-fanyi", "n": 15, "id": "sh-fanyi-413", "tag": "2011上海中考第8题", "t": "翻译题", "stem": "用现代汉语翻译下列句子：\n策之不以其道，食之不能尽其材，鸣之而不能通其意。", "ans": "驱策它不按照正确的方法，喂养它不能竭尽它的才能，它鸣叫却不能通晓它的心意。", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】韩愈《马说》。\n【采分点】\n1. 策：鞭打、驱策；\n2. 道：正确法则方法；\n3. 材：才能；\n4. 通：通晓。"}, {"s": "板块六：上海中考真题与模拟·课内文言重点句子翻译与文意探究", "sid": "sh-fanyi", "n": 16, "id": "sh-fanyi-414", "tag": "2024杨浦一模第7题", "t": "翻译题", "stem": "用现代汉语翻译下面的句子：\n但当涉猎，见往事耳。", "ans": "只是应当粗略地阅读，了解历史罢了。", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】《资治通鉴·孙权劝学》。\n【采分点】\n1. 但：副词，只、只是；\n2. 涉猎：粗略阅读；\n3. 见：了解、晓得；\n4. 往事：历史、过去的事；\n5. 耳：语气词，罢了。"}, {"s": "板块六：上海中考真题与模拟·课内文言重点句子翻译与文意探究", "sid": "sh-fanyi", "n": 17, "id": "sh-fanyi-415", "tag": "2024静安二模第7题", "t": "翻译题", "stem": "用现代汉语翻译下面的句子：\n盖余之勤且艰若此。", "ans": "我求学时的勤奋和艰苦大概就是这样。", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】宋濂《送东阳马生序》。\n【采分点】\n1. 盖：发语词，大概；\n2. 勤且艰：勤奋而且艰苦；\n3. 若此：像这样。"}, {"s": "板块六：上海中考真题与模拟·课内文言重点句子翻译与文意探究", "sid": "sh-fanyi", "n": 18, "id": "sh-fanyi-416", "tag": "2024徐汇一模第7题", "t": "翻译题", "stem": "用现代汉语翻译下面的句子：\n庭下如积水空明，水中藻、荇交横，盖竹柏影也。", "ans": "庭院中的月光如积水般清澈透明，水中有水藻、荇菜纵横交错，原来是竹子和柏树的影子啊。", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】苏轼《记承天寺夜游》。\n【采分点】\n1. 空明：清澈透明；\n2. 交横：交错交叉；\n3. 盖：原来是。"}, {"s": "板块六：上海中考真题与模拟·课内文言重点句子翻译与文意探究", "sid": "sh-fanyi", "n": 19, "id": "sh-fanyi-417", "tag": "2024黄浦一模第7题", "t": "翻译题", "stem": "用现代汉语翻译下面的句子：\n野芳发而幽香，佳木秀而繁阴。", "ans": "野花开放散发出清幽的香气，美好的树木滋长出繁茂的绿荫。", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】欧阳修《醉翁亭记》。\n【采分点】\n1. 芳：花；\n2. 发：开放；\n3. 秀：滋长、茂盛；\n4. 繁阴：浓密的树荫。"}, {"s": "板块六：上海中考真题与模拟·课内文言重点句子翻译与文意探究", "sid": "sh-fanyi", "n": 20, "id": "sh-fanyi-418", "tag": "2024浦东一模第7题", "t": "翻译题", "stem": "用现代汉语翻译下面的句子：\n其西南诸峰，林壑尤美，望之蔚然而深秀者，琅琊也。", "ans": "滁州西南方各个山峰，树林山谷格外优美，远望树木茂盛并且幽深秀丽的，是琅琊山啊。", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】欧阳修《醉翁亭记》。\n【采分点】\n1. 诸峰：各个山峰；\n2. 尤：格外、尤其；\n3. 蔚然：草木茂密貌；\n4. 判断句式（……者，……也）。"}, {"s": "板块六：上海中考真题与模拟·课内文言重点句子翻译与文意探究", "sid": "sh-fanyi", "n": 21, "id": "sh-fanyi-419", "tag": "2024闵行一模第7题", "t": "翻译题", "stem": "用现代汉语翻译下面的句子：\n军中闻将军令，不闻天子之诏。", "ans": "军营中只听从将军的军令，不听天子的诏令。", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】司马迁《周亚夫军细柳》。\n【采分点】\n1. 闻：听从；\n2. 表现周亚夫治军严明、刚正不阿的治军威仪。"}, {"s": "板块六：上海中考真题与模拟·课内文言重点句子翻译与文意探究", "sid": "sh-fanyi", "n": 22, "id": "sh-fanyi-420", "tag": "2024宝山一模第7题", "t": "翻译题", "stem": "用现代汉语翻译下面的句子：\n以君之力，曾不能损魁父之丘，如太行、王屋何？", "ans": "凭您的力气，连魁父这样的小土丘都不能削平，能把太行山、王屋山怎么样呢？", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】《愚公移山》。\n【采分点】\n1. 曾：副词，连……都；\n2. 损：削减、削平；\n3. 如……何：固定句式，把……怎么样。"}, {"s": "板块六：上海中考真题与模拟·课内文言重点句子翻译与文意探究", "sid": "sh-fanyi", "n": 23, "id": "sh-fanyi-421", "tag": "2024松江一模第7题", "t": "翻译题", "stem": "用现代汉语翻译下面的句子：\n自康乐以来，未复有能与其奇者。", "ans": "自从谢灵运以来，就再也没有能参与欣赏这种奇山异水的人了。", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】陶弘景《答谢中书书》。\n【采分点】\n1. 康乐：指南朝宋文学家谢灵运（袭封康乐公）；\n2. 与（yù）：参与，指欣赏、领悟；\n3. 奇：奇丽景色。"}, {"s": "板块六：上海中考真题与模拟·课内文言重点句子翻译与文意探究", "sid": "sh-fanyi", "n": 24, "id": "sh-fanyi-422", "tag": "2024虹口一模第7题", "t": "翻译题", "stem": "用现代汉语翻译下面的句子：\n罔不因势象形，各具情态。", "ans": "全都是顺着原料原来的地势形态来雕刻各种形象，各自具有不同的神情姿态。", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】魏学洢《核舟记》。\n【采分点】\n1. 罔不：无不、全都（双重否定）；\n2. 因：顺着、依照；\n3. 象：模拟、雕刻成……形象。"}, {"s": "板块六：上海中考真题与模拟·课内文言重点句子翻译与文意探究", "sid": "sh-fanyi", "n": 25, "id": "sh-fanyi-423", "tag": "2024长宁一模第7题", "t": "翻译题", "stem": "用现代汉语翻译下面的句子：\n其真无马邪？其真不知马也！", "ans": "难道真的没有千里马吗？恐怕是真的不识得千里马吧！", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】韩愈《马说》。\n【采分点】\n1. 第一个“其”：表反问语气，难道；\n2. 第二个“其”：表揣测语气，恐怕；\n3. 邪（yé）：同“耶”，表疑问语气词。"}, {"s": "板块六：上海中考真题与模拟·课内文言重点句子翻译与文意探究", "sid": "sh-fanyi", "n": 26, "id": "sh-fanyi-424", "tag": "2024普陀一模第7题", "t": "翻译题", "stem": "用现代汉语翻译下面的句子：\n此臣所以报先帝而忠陛下之职分也。", "ans": "这是我用来报答先帝厚恩并尽忠于陛下的职责本分啊。", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】诸葛亮《出师表》。\n【采分点】\n1. 所以：用来……的凭据/方法；\n2. 职分：职责本分。"}, {"s": "板块六：上海中考真题与模拟·课内文言重点句子翻译与文意探究", "sid": "sh-fanyi", "n": 27, "id": "sh-fanyi-425", "tag": "2024嘉定一模第7题", "t": "翻译题", "stem": "用现代汉语翻译下面的句子：\n自非亭午夜分，不见曦月。", "ans": "如果不是正午和半夜，连太阳和月亮都看不见。", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】郦道元《三峡》。\n【采分点】\n1. 自非：如果不是；\n2. 亭午：正午；\n3. 夜分：半夜；\n4. 曦：日光、太阳。"}, {"s": "板块六：上海中考真题与模拟·课内文言重点句子翻译与文意探究", "sid": "sh-fanyi", "n": 28, "id": "sh-fanyi-426", "tag": "2024青浦一模第7题", "t": "翻译题", "stem": "用现代汉语翻译下面的句子：\n居天下之广居，立天下之正位，行天下之大道。", "ans": "（大丈夫应该）住在天下最宽敞的住所里（行仁），站在天下最端正的位置上（守礼），走在天下最光明的大道上（行义）。", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】《孟子·富贵不能淫》。\n【采分点】广居（仁）、正位（礼）、大道（义）。"}, {"s": "板块六：上海中考真题与模拟·课内文言重点句子翻译与文意探究", "sid": "sh-fanyi", "n": 29, "id": "sh-fanyi-427", "tag": "2024金山一模第7题", "t": "翻译题", "stem": "用现代汉语翻译下面的句子：\n群臣吏民能面刺寡人之过者，受上赏。", "ans": "所有大臣、官吏和百姓，能够当面指责我的过错的，受上等赏赐。", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】《战国策·邹忌讽齐王纳谏》。\n【采分点】\n1. 面：名词作状语，当面；\n2. 刺：指责、批评；\n3. 定语后置句式（能面刺寡人之过者群臣吏民）。"}, {"s": "板块六：上海中考真题与模拟·课内文言重点句子翻译与文意探究", "sid": "sh-fanyi", "n": 30, "id": "sh-fanyi-428", "tag": "2024奉贤一模第7题", "t": "翻译题", "stem": "用现代汉语翻译下面的句子：\n入则无法家拂士，出则无敌国外患者，国恒亡。", "ans": "国内如果没有守法度的大臣和辅佐的贤士，国外如果没有势力相当的国家和外来的祸患，这样的国家常常会灭亡。", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】《孟子·生于忧患，死于安乐》。\n【采分点】\n1. 入、出：国内、国外；\n2. 拂（bì）士：通“弼”，辅佐之贤士；\n3. 恒：常常。"}, {"s": "板块六：上海中考真题与模拟·课内文言重点句子翻译与文意探究", "sid": "sh-fanyi", "n": 31, "id": "sh-fanyi-429", "tag": "文言翻译专项·第31题", "t": "翻译题", "stem": "用现代汉语翻译下列句子：\n肉食者鄙，未能远谋。", "ans": "居高位享厚禄的当权者眼光短浅，不能作长远周全的谋划。", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】《曹刿论战》。\n【采分点】肉食者：高官当权者；鄙：眼光短浅、见识浅陋；远谋：长远谋划。"}, {"s": "板块六：上海中考真题与模拟·课内文言重点句子翻译与文意探究", "sid": "sh-fanyi", "n": 32, "id": "sh-fanyi-430", "tag": "文言翻译专项·第32题", "t": "翻译题", "stem": "用现代汉语翻译下列句子：\n一鼓作气，再而衰，三而竭。", "ans": "第一次击鼓能振作起士兵们的士气，第二次击鼓士气就会衰落，第三次击鼓士气就竭尽了。", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】《曹刿论战》。\n【采分点】作：振作；再：第二次；竭：耗尽、竭尽。"}, {"s": "板块六：上海中考真题与模拟·课内文言重点句子翻译与文意探究", "sid": "sh-fanyi", "n": 33, "id": "sh-fanyi-431", "tag": "文言翻译专项·第33题", "t": "翻译题", "stem": "用现代汉语翻译下列句子：\n吾妻之美我者，私我也；妾之美我者，畏我也；客之美我者，欲有求于我也。", "ans": "我的妻子认为我长得漂亮，是偏爱我；我的侍妾认为我长得漂亮，是害怕我；我的客人认为我长得漂亮，是想有求于我啊。", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】《战国策·邹忌讽齐王纳谏》。\n【采分点】美：意动用法（认为……美）；私：偏爱；排比句式气势充沛。"}, {"s": "板块六：上海中考真题与模拟·课内文言重点句子翻译与文意探究", "sid": "sh-fanyi", "n": 34, "id": "sh-fanyi-432", "tag": "文言翻译专项·第34题", "t": "翻译题", "stem": "用现代汉语翻译下列句子：\n燕、赵、韩、魏闻之，皆朝于齐。此所谓战胜于朝廷。", "ans": "燕国、赵国、韩国、魏国听到这消息，都到齐国来朝见纳贡。这就是人们所说的在朝廷上战胜敌国。", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】《邹忌讽齐王纳谏》。\n【采分点】皆朝于齐：介宾后置句；战胜于朝廷：不用兵力而通过内政修明战胜敌国。"}, {"s": "板块六：上海中考真题与模拟·课内文言重点句子翻译与文意探究", "sid": "sh-fanyi", "n": 35, "id": "sh-fanyi-433", "tag": "文言翻译专项·第35题", "t": "翻译题", "stem": "用现代汉语翻译下列句子：\n非独贤者有是心也，人皆有之，贤者能勿丧耳。", "ans": "不仅贤德的人有这种羞恶之心，人人都有这种本心，只是贤德的人能够不丧失罢了。", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】《孟子·鱼我所欲也》。\n【采分点】非独：不仅；是心：这种本心；丧：丧失、丢弃；耳：罢了。"}, {"s": "板块六：上海中考真题与模拟·课内文言重点句子翻译与文意探究", "sid": "sh-fanyi", "n": 36, "id": "sh-fanyi-434", "tag": "文言翻译专项·第36题", "t": "翻译题", "stem": "用现代汉语翻译下列句子：\n呼尔而与之，行道之人弗受；蹴尔而与之，乞人不屑也。", "ans": "轻蔑地吆喝着给别人吃，过路的饥民也不肯接受；用脚踢着给人吃，即使乞丐也认为不值得接受。", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】《孟子·鱼我所欲也》。\n【采分点】呼尔：吆喝着；蹴（cù）尔：踢着；不屑：认为不值得接受。"}, {"s": "板块六：上海中考真题与模拟·课内文言重点句子翻译与文意探究", "sid": "sh-fanyi", "n": 37, "id": "sh-fanyi-435", "tag": "文言翻译专项·第37题", "t": "翻译题", "stem": "用现代汉语翻译下列句子：\n故天将降大任于是人也，必先苦其心志，劳其筋骨。", "ans": "所以上天将要下达重大使命给这样的人，一定要先使他的内心经受痛苦煎熬，使他的筋骨承受劳累之苦。", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】《孟子·生于忧患，死于安乐》。\n【采分点】大任：重大使命；苦、劳：形容词使动用法。"}, {"s": "板块六：上海中考真题与模拟·课内文言重点句子翻译与文意探究", "sid": "sh-fanyi", "n": 38, "id": "sh-fanyi-436", "tag": "文言翻译专项·第38题", "t": "翻译题", "stem": "用现代汉语翻译下列句子：\n得道者多助，失道者寡助。寡助之至，亲戚畔之；多助之至，天下顺之。", "ans": "施行仁政的君主得到广泛的支持帮助，违背仁政的君主得到的支持帮助很少。支持帮助少到了极点，连内外亲戚都会背叛他；支持帮助多到了极点，普天下都会归顺他。", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】《孟子·得道多助，失道寡助》。\n【采分点】得道：施行王道仁政；畔：通“叛”，背叛；顺：归顺。"}, {"s": "板块六：上海中考真题与模拟·课内文言重点句子翻译与文意探究", "sid": "sh-fanyi", "n": 39, "id": "sh-fanyi-437", "tag": "文言翻译专项·第39题", "t": "翻译题", "stem": "用现代汉语翻译下列句子：\n域民不以封疆之界，固国不以山溪之险，威天下不以兵革之利。", "ans": "使百姓定居下来不能单靠划定疆界的长城要塞，巩固国防不能单靠山河险阻的阻隔，威慑天下更不能单靠武器装备的锋利坚固。", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】《孟子·得道多助，失道寡助》。\n【采分点】域民：限制百姓移徙；固国：巩固国防；兵革：兵器铠甲。"}, {"s": "板块六：上海中考真题与模拟·课内文言重点句子翻译与文意探究", "sid": "sh-fanyi", "n": 40, "id": "sh-fanyi-438", "tag": "文言翻译专项·第40题", "t": "翻译题", "stem": "用现代汉语翻译下列句子：\n安陵君受地于先王而守之，虽千里不敢易也，岂直五百里哉？", "ans": "安陵君从先王那里继承了这块土地并世代守护它，即使拿一千里的土地来我也不敢交换，难道仅仅是用五百里土地吗？", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】《战国策·唐雎不辱使命》。\n【采分点】虽：即使；易：交换；岂直：难道仅仅。"}, {"s": "板块六：上海中考真题与模拟·课内文言重点句子翻译与文意探究", "sid": "sh-fanyi", "n": 41, "id": "sh-fanyi-439", "tag": "文言翻译专项·第41题", "t": "翻译题", "stem": "用现代汉语翻译下列句子：\n布衣之怒，亦免冠徒跣，以头抢地尔。", "ans": "寻常百姓发怒，也不过就是摘下帽子、光着脚板，把脑袋往地上撞罢了。", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】《唐雎不辱使命》。\n【采分点】免冠：摘掉帽子；徒跣（xiǎn）：光着脚；抢（qiāng）：撞击。"}, {"s": "板块六：上海中考真题与模拟·课内文言重点句子翻译与文意探究", "sid": "sh-fanyi", "n": 42, "id": "sh-fanyi-440", "tag": "文言翻译专项·第42题", "t": "翻译题", "stem": "用现代汉语翻译下列句子：\n夫大国，难测也，惧有伏焉。", "ans": "大国的虚实是难以推测度量的，我担心敌军设有埋伏啊。", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】《左传·曹刿论战》。\n【采分点】测：推测、估计；伏：埋伏；焉：兼词兼语气词（于此）。"}, {"s": "板块六：上海中考真题与模拟·课内文言重点句子翻译与文意探究", "sid": "sh-fanyi", "n": 43, "id": "sh-fanyi-441", "tag": "文言翻译专项·第43题", "t": "翻译题", "stem": "用现代汉语翻译下列句子：\n忠之属也，可以一战。战则请从。", "ans": "这是尽职尽责的一类事情，可以凭借这个条件打上一仗。作战时请允许我随从前去。", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】《曹刿论战》。\n【采分点】忠之属：忠于职守的一类；可以：可以凭借；从：跟随跟随。"}, {"s": "板块六：上海中考真题与模拟·课内文言重点句子翻译与文意探究", "sid": "sh-fanyi", "n": 44, "id": "sh-fanyi-442", "tag": "文言翻译专项·第44题", "t": "翻译题", "stem": "用现代汉语翻译下列句子：\n阡陌交通，鸡犬相闻。其中往来种作，男女衣着，悉如外人。", "ans": "田间小路交错相通，村落间鸡鸣狗叫之声处处可以听到。人们在田野里来来往往耕种劳作，男女老少的穿戴服饰，完全跟外面的世人一样。", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】陶渊明《桃花源记》。\n【采分点】交通：交错相通；种作：耕种劳作；悉：全都。"}, {"s": "板块六：上海中考真题与模拟·课内文言重点句子翻译与文意探究", "sid": "sh-fanyi", "n": 45, "id": "sh-fanyi-443", "tag": "文言翻译专项·第45题", "t": "翻译题", "stem": "用现代汉语翻译下列句子：\n黄发垂髫，并怡然自乐。", "ans": "老人与小孩，全都神态欢畅愉悦，自得其乐。", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】《桃花源记》。\n【采分点】黄发（借代老人）；垂髫（借代儿童）；怡然：欣悦自得貌。"}, {"s": "板块六：上海中考真题与模拟·课内文言重点句子翻译与文意探究", "sid": "sh-fanyi", "n": 46, "id": "sh-fanyi-444", "tag": "文言翻译专项·第46题", "t": "翻译题", "stem": "用现代汉语翻译下列句子：\n自云先世避秦时乱，率妻子邑人来此绝境，不复出焉，遂与外人间隔。", "ans": "他们自己说他们的祖先为了躲避秦朝时的战乱，率领妻子儿女和同乡百姓来到这与人世隔绝的地方，不再从这里出去，于是就与外面的人断绝了往来。", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】《桃花源记》。\n【采分点】妻子：妻子和儿女；绝境：与世隔绝之处；间隔：隔绝不通。"}, {"s": "板块六：上海中考真题与模拟·课内文言重点句子翻译与文意探究", "sid": "sh-fanyi", "n": 47, "id": "sh-fanyi-445", "tag": "文言翻译专项·第47题", "t": "翻译题", "stem": "用现代汉语翻译下列句子：\n水陆草木之花，可爱者甚蕃。晋陶渊明独爱菊。", "ans": "水上、陆地上各种草本木本的花卉，值得喜爱的非常多。晋代的陶渊明唯独喜爱菊花。", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】周敦颐《爱莲说》。\n【采分点】蕃：多；独：唯独、只。"}, {"s": "板块六：上海中考真题与模拟·课内文言重点句子翻译与文意探究", "sid": "sh-fanyi", "n": 48, "id": "sh-fanyi-446", "tag": "文言翻译专项·第48题", "t": "翻译题", "stem": "用现代汉语翻译下列句子：\n孔子云：“何陋之有？”", "ans": "孔子说：“有什么简陋的呢？”", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】刘禹锡《陋室铭》。\n【采分点】宾语前置句（有何陋之有，“之”为宾语前置标志）。"}, {"s": "板块六：上海中考真题与模拟·课内文言重点句子翻译与文意探究", "sid": "sh-fanyi", "n": 49, "id": "sh-fanyi-447", "tag": "文言翻译专项·第49题", "t": "翻译题", "stem": "用现代汉语翻译下列句子：\n斯是陋室，惟吾德馨。", "ans": "这是简陋的屋舍，只因为我的品德高尚馨香（就不觉得简陋了）。", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】刘禹锡《陋室铭》。\n【采分点】斯：这；惟：只；馨：香气远闻，比喻道德高尚声誉远扬。"}, {"s": "板块六：上海中考真题与模拟·课内文言重点句子翻译与文意探究", "sid": "sh-fanyi", "n": 50, "id": "sh-fanyi-448", "tag": "文言翻译专项·第50题", "t": "翻译题", "stem": "用现代汉语翻译下列句子：\n先天下之忧而忧，后天下之乐而乐。", "ans": "在天下人忧虑之前先忧虑，在天下人享乐之后才享乐。", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】范仲淹《岳阳楼记》。\n【采分点】先、后：方位名词作状语，在……之前、在……之后；表达作者崇高远大的政治抱负。"}, {"s": "板块七：上海中考名著阅读全景通关（12 部必考名著真题模拟）", "sid": "sh-mingzhu", "n": 1, "id": "sh-mingzhu-449", "tag": "上海中考名著·《西游记》第1题", "t": "简答题", "stem": "【2024静安二模名著题】阅读下面选段，回答问题：\n行者道：“你这个呆子！我临别之时，曾叮咛又叮咛，说道：‘若有妖魔捉住师父，你就说老孙是他大徒弟。’怎么却不说我？”八戒道：“我说：‘妖精，你不要无礼，莫害我师父！我还有个大师兄，叫做孙行者。他神通广大，善能降妖。他来时教你死无葬身之地！’那怪闻言，越加忿怒，骂道：‘是个甚么孙行者，我可怕他？他若来，我剥了他皮，抽了他筋……’行者闻言，就气得抓耳挠腮……八戒道：“哥哥息怒，是那妖怪这等骂来，我故学与你听也。”\n(1) 选段中横线上的妖怪名是__________。\n(2) 选段生动刻画了猪八戒__________的性格特征。\n(3) 孙悟空此前因__________事情被唐僧逐回水帘洞，但仍心系师父，可见其__________品质。", "ans": "(1) 黄袍怪（或奎木狼）；(2) 聪明机智、善用激将法、能言善辩；(3) 三打白骨精；忠心耿耿、重情重义", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】《西游记》第三十一回《猪八戒义激美猴王 孙行者智降妖怪》。\n【考点分析】\n1. 黄袍怪占据碗子山波月洞，强掳宝象国百花羞公主。\n2. 猪八戒深知孙悟空好胜心强、受不得辱骂，故用激将法编造谎言激怒孙悟空出山降妖。\n3. 孙悟空三打白骨精被唐僧错怪贬回花果山，虽受委屈仍挂念师父安危，足见其赤胆忠心。"}, {"s": "板块七：上海中考名著阅读全景通关（12 部必考名著真题模拟）", "sid": "sh-mingzhu", "n": 2, "id": "sh-mingzhu-450", "tag": "上海中考名著·《西游记》第2题", "t": "简答题", "stem": "简述孙悟空在取经前后的性格变化，并结合“大闹天宫”与“三打白骨精/真假美猴王”各举一例说明。", "ans": "变化：由最初桀骜不驯、任性妄为、追求个人自由的“美猴王”，转变为顾全大局、忠诚勇敢、具有高度责任感和除暴安良决心的“斗战胜佛”。\n举例：取经前在大闹天宫时不服天庭管辖，自封齐天大圣，随性狂放；取经途中面对白骨精三番挑拨屡遭师父念紧箍咒驱逐，却三次回顾、心念取经大业，重归队伍斩妖除魔。", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【考点分析】上海中考考查经典名著的核心是“人物的成长与蜕变”，从野性到佛性的升华是《西游记》的主线精神。"}, {"s": "板块七：上海中考名著阅读全景通关（12 部必考名著真题模拟）", "sid": "sh-mingzhu", "n": 3, "id": "sh-mingzhu-451", "tag": "上海中考名著·《西游记》第3题", "t": "填空题", "stem": "《西游记》中，孙悟空在菩提祖师处学得__________和__________两项重大本领，后在太上老君的__________中炼就了一双“火眼金睛”。", "ans": "七十二变（七十二般变化）；筋斗云；八卦炉", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】《西游记》前七回。孙悟空在灵台方寸山斜月三星洞拜菩提祖师为师。"}, {"s": "板块七：上海中考名著阅读全景通关（12 部必考名著真题模拟）", "sid": "sh-mingzhu", "n": 4, "id": "sh-mingzhu-452", "tag": "上海中考名著·《简·爱》第1题", "t": "表格综合题", "stem": "【2024静安二模名著题】阅读表格，完成简·爱的四次“离开与前往”关键事件梳理：\n【简·爱的抗争之旅】\n(1) 第一次：从盖茨黑德府到洛伍德学校 —— 影响命运走向的关键事件：____________________\n(2) 第二次：从洛伍德学校到桑菲尔德庄园 —— 原因与事件：谭波尔小姐结婚离校，简·爱为了____________________\n(3) 第三次：从桑菲尔德庄园到沼地居 —— 原因与事件：得知罗切斯特已婚真相，简·爱不愿____________________\n(4) 第四次：从沼地居到芬丁庄园 —— 关键事件：____________________", "ans": "(1) 被舅妈关进红房子受虐待后奋起抗争反驳舅妈；(2) 渴望开拓视野、寻求新的生活与自由；(3) 放弃自尊原则做罗切斯特的情人，毅然离开；(4) 拒绝圣约翰缺乏真爱的传教求婚，追随内心的真爱返回罗切斯特身边", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】夏洛蒂·勃朗特《简·爱》。\n【考点分析】简·爱的四次离开完整串联起她追求人格尊严、自由与真正爱情的一生。"}, {"s": "板块七：上海中考名著阅读全景通关（12 部必考名著真题模拟）", "sid": "sh-mingzhu", "n": 5, "id": "sh-mingzhu-453", "tag": "上海中考名著·《简·爱》第2题", "t": "简答题", "stem": "简·爱在桑菲尔德庄园面对罗切斯特时曾说：“你以为因为我贫穷、低微、不美、矮小，我就没有灵魂，没有心吗？……我们的精神是同等的！”这段话集中体现了简·爱怎样的性格追求？", "ans": "体现了简·爱追求人格独立、自尊自爱、渴望精神上的完全平等以及勇敢无畏的独立女性精神。", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】《简·爱》第二十三章。这是全书震撼人心的最高思想光辉。"}, {"s": "板块七：上海中考名著阅读全景通关（12 部必考名著真题模拟）", "sid": "sh-mingzhu", "n": 6, "id": "sh-mingzhu-454", "tag": "上海中考名著·《朝花夕拾》第1题", "t": "简答题", "stem": "在《朝花夕拾》中，促使鲁迅先生毅然决定“弃医从文”的两个关键事件是（1）__________；（2）__________。", "ans": "(1) 匿名信事件；(2) 看电影（日俄战争幻灯片）事件", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】鲁迅《朝花夕拾·藤野先生》。\n【考点分析】匿名信事件使鲁迅深感弱国子民备受歧视；看电影事件中围观枪毙同胞的中国人的麻木神情，让鲁迅深刻认识到医治思想精神比医治身体更为迫切，从而弃医从文。"}, {"s": "板块七：上海中考名著阅读全景通关（12 部必考名著真题模拟）", "sid": "sh-mingzhu", "n": 7, "id": "sh-mingzhu-455", "tag": "上海中考名著·《朝花夕拾》第2题", "t": "填空题", "stem": "《朝花夕拾》中《阿长与〈山海经〉》一文，阿长为鲁迅买来了他日夜渴求的带图画的《__________》，文中鲁迅把阿长称作具有“__________”的人，表达了对这位劳动妇女真挚深切的怀念与感激。", "ans": "山海经；伟大的神力", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】《朝花夕拾·阿长与〈山海经〉》。"}, {"s": "板块七：上海中考名著阅读全景通关（12 部必考名著真题模拟）", "sid": "sh-mingzhu", "n": 8, "id": "sh-mingzhu-456", "tag": "上海中考名著·《朝花夕拾》第3题", "t": "简答题", "stem": "《五猖会》中，儿时的鲁迅兴高采烈正准备去看难得一遇的五猖盛会，父亲却突然勒令他背出《__________》，这一情节深刻批判了封建家长制怎样的弊端？", "ans": "《鉴略》；深刻批判了封建强制教育对儿童活泼天性的粗暴摧残与压抑，揭露了家庭封建伦理的专制与虚伪。", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】《朝花夕拾·五猖会》。"}, {"s": "板块七：上海中考名著阅读全景通关（12 部必考名著真题模拟）", "sid": "sh-mingzhu", "n": 9, "id": "sh-mingzhu-457", "tag": "上海中考名著·《水浒传》第1题", "t": "简答题", "stem": "林冲是《水浒传》中性格发展最富戏剧性的悲剧英雄。请结合“误入白虎堂”、“刺配沧州”、“风雪山神庙”等情节，概括其性格发生的重大转变。", "ans": "转变过程：林冲由最初身为东京八十万禁军教头时的委曲求全、安分守己、逆来顺受、对统治阶层抱有幻想，经过误入白虎堂、沧州道险遭暗算、草料场被陆谦等人纵火暗害的步步紧逼，最终彻底认清现实、走向奋起反抗与怒杀仇敌，展现了“官逼民反”的最典型性格蜕变历程。", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【考点分析】林冲是全书刻画最成功的典型人物，深刻诠释了《水浒传》“官逼民反”的深刻主题。"}, {"s": "板块七：上海中考名著阅读全景通关（12 部必考名著真题模拟）", "sid": "sh-mingzhu", "n": 10, "id": "sh-mingzhu-458", "tag": "上海中考名著·《水浒传》第2题", "t": "填空题", "stem": "《水浒传》中“拳打镇关西”、“倒拔垂杨柳”、“大闹野猪林”的主人公是__________；他在沧州野猪林搭救了生死至交__________。", "ans": "鲁智深（鲁达/花和尚）；林冲", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】施耐庵《水浒传》。鲁智深见义勇为、粗中有细、侠肝义胆。"}, {"s": "板块七：上海中考名著阅读全景通关（12 部必考名著真题模拟）", "sid": "sh-mingzhu", "n": 11, "id": "sh-mingzhu-459", "tag": "上海中考名著·《水浒传》第3题", "t": "填空题", "stem": "武松在景阳冈上__________，名扬四方；后来在张蒙方家中遭陷害，刺配恩州，在飞云浦杀掉杀手后回到孟州，发生的情节是“__________”。", "ans": "赤手打虎（景阳冈打虎）；血溅鸳鸯楼", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】《水浒传》第二十七至三十一回。"}, {"s": "板块七：上海中考名著阅读全景通关（12 部必考名著真题模拟）", "sid": "sh-mingzhu", "n": 12, "id": "sh-mingzhu-460", "tag": "上海中考名著·《儒林外史》第1题", "t": "简答题", "stem": "《儒林外史》中刻画了著名吝啬鬼严监生的经典临终细节：严监生病重垂危之际，喉咙里痰响，却一直伸着两根指头不肯断气，众人不知何意，直到赵氏做了什么事他才闭眼断气？这一细节揭示了封建士人怎样的扭曲心理？", "ans": "赵氏挑掉灯盏里点着的两茎灯草中的一茎（省油），严监生才点点头断气。这一细节极度夸张又真实入微地揭示了守财奴爱财胜过生命的极端吝啬与荒谬本性。", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】清代吴敬梓《儒林外史》第六回。"}, {"s": "板块七：上海中考名著阅读全景通关（12 部必考名著真题模拟）", "sid": "sh-mingzhu", "n": 13, "id": "sh-mingzhu-461", "tag": "上海中考名著·《儒林外史》第2题", "t": "简答题", "stem": "范进中举前胡屠户骂他是“现世宝”、“癞蛤蟆想吃天鹅肉”；范进中举后胡屠户却夸他是“天上的文曲星”，甚至把范进带给他的银子攥在手里假意推辞。胡屠户态度的鲜明对比具有怎样的讽刺批判意义？", "ans": "辛辣讽刺了封建科举制度下市侩小人趋炎附势、前倨后恭、贪婪虚伪的丑陋嘴脸，深刻暴露出科举制度对整个社会世态人心的极度扭曲与腐蚀。", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】《儒林外史》第三回《范进中举》。"}, {"s": "板块七：上海中考名著阅读全景通关（12 部必考名著真题模拟）", "sid": "sh-mingzhu", "n": 14, "id": "sh-mingzhu-462", "tag": "上海中考名著·《儒林外史》第3题", "t": "填空题", "stem": "《儒林外史》全书以元末隐士__________不慕名利、自食其力为全书全篇楔子，全书寄托了作者吴敬梓理想人格的正面知识分子代表人物是__________。", "ans": "王冕；杜少卿", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【考点分析】王冕是全书品德楷模，杜少卿是不慕名利、尊重妇女、慷慨仗义的知性代表。"}, {"s": "板块七：上海中考名著阅读全景通关（12 部必考名著真题模拟）", "sid": "sh-mingzhu", "n": 15, "id": "sh-mingzhu-463", "tag": "上海中考名著·《骆驼祥子》第1题", "t": "简答题", "stem": "请简述老舍小说《骆驼祥子》中祥子“三起三落”的主要经历。", "ans": "一起：省吃俭用苦干三年，买上第一辆新洋车；一落：连人带车被逃兵掳走，梦想破灭。\n二起：逃回后拼命拉车积攒买车钱；二落：买车钱全被孙侦探敲诈洗劫一空。\n三起：与虎妞结婚后用虎妞的私房钱再买一辆车；三落：虎妞难产死后，为料理丧事被迫卖车，最终沦为自甘堕落的游民行尸走肉。", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【考点分析】祥子的“三起三落”完整展示了一个纯朴老实勤劳的农民青年如何被旧社会逼向毁灭。"}, {"s": "板块七：上海中考名著阅读全景通关（12 部必考名著真题模拟）", "sid": "sh-mingzhu", "n": 16, "id": "sh-mingzhu-464", "tag": "上海中考名著·《骆驼祥子》第2题", "t": "简答题", "stem": "老舍在小说结尾写道：“体面的，要强的，好梦想的，利己的，个人的，健壮的，伟大的，祥子，不知陪着人家送了多少回殡；不知何年何月他也叫人家送差……个人主义的末路鬼！”祥子悲剧的根本原因是什么？", "ans": "祥子悲剧的根本原因是黑暗、残酷、不公的半殖民地半封建旧社会对底层劳动人民的无情压迫与摧残；同时也批判了祥子仅凭个人奋斗、脱离群体社会的狭隘“个人主义”自救道路的必然破灭。", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】老舍《骆驼祥子》终章。"}, {"s": "板块七：上海中考名著阅读全景通关（12 部必考名著真题模拟）", "sid": "sh-mingzhu", "n": 17, "id": "sh-mingzhu-465", "tag": "上海中考名著·《红星照耀中国》第1题", "t": "简答题", "stem": "《红星照耀中国》原名《__________》，作者是美国著名记者__________；书名中“红星”的核心象征意义是：__________。", "ans": "《西行漫记》；埃德加·斯诺；象征着中国共产党及其领导的红色革命力量如星火燎原，必将照亮全中国的前途与未来", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【考点分析】斯诺是首位进入陕北根据地进行实地采访并报道红色中国的外国记者。"}, {"s": "板块七：上海中考名著阅读全景通关（12 部必考名著真题模拟）", "sid": "sh-mingzhu", "n": 18, "id": "sh-mingzhu-466", "tag": "上海中考名著·《红星照耀中国》第2题", "t": "简答题", "stem": "在斯诺的笔下，中国共产党的领袖毛泽东和周恩来分别展现了怎样的人格魅力？", "ans": "毛泽东：具有卓越深邃的战略眼光、渊博的学识，生活朴素节俭（住窑洞穿粗布衣），平易近人，谈吐幽默充满感染力；\n周恩来：头脑敏捷清醒、不知疲倦，兼具儒雅博学的君子之风与沉着坚毅的革命者品质，生活极其简朴纯粹。", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【考点分析】斯诺对领袖人物客观而生动的生活细节刻画，打破了国民党的妖魔化宣传。"}, {"s": "板块七：上海中考名著阅读全景通关（12 部必考名著真题模拟）", "sid": "sh-mingzhu", "n": 19, "id": "sh-mingzhu-467", "tag": "上海中考名著·《红星照耀中国》第3题", "t": "简答题", "stem": "斯诺在书中称誉红军的二万五千里长征为“现代史上无与伦比的史诗”。长征途中红军战士克服了哪些极端考验？体现了怎样的长征精神？", "ans": "考验：强渡大渡河、飞夺泸定桥、翻越终年积雪的夹金山、穿过杳无人烟吞噬生命的茫茫草地、冲破国民党几十万大军的围追堵截；\n长征精神：体现了坚定的革命信念、不怕牺牲、一往无前的英雄主义精神和紧密团结同舟共济的阶级友爱。", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】《红星照耀中国》第五篇《长征》。"}, {"s": "板块七：上海中考名著阅读全景通关（12 部必考名著真题模拟）", "sid": "sh-mingzhu", "n": 20, "id": "sh-mingzhu-468", "tag": "上海中考名著·《艾青诗选》第1题", "t": "简答题", "stem": "艾青诗歌创作的两大核心意象是“__________”和“__________”；他在《我爱这土地》中直抒胸臆的千古名句是：“______________________？______________________……”", "ans": "土地；太阳（或光明）；为什么我的眼里常含泪水；因为我对这土地爱得深沉", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【考点分析】“土地”凝聚着艾青对苦难祖国母亲的深沉眷恋；“太阳”寄托着对光明胜利与自由解放的执着追求。"}, {"s": "板块七：上海中考名著阅读全景通关（12 部必考名著真题模拟）", "sid": "sh-mingzhu", "n": 21, "id": "sh-mingzhu-469", "tag": "上海中考名著·《海底两万里》第1题", "t": "简答题", "stem": "《海底两万里》的作者是被誉为“现代科学幻想小说之父”的法国作家__________；小说中的潜水艇名为“__________”，它的艇长是__________。", "ans": "儒勒·凡尔纳；诺第留斯号（或鹦鹉螺号）；尼摩船长", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】凡尔纳科幻三部曲第二部。"}, {"s": "板块七：上海中考名著阅读全景通关（12 部必考名著真题模拟）", "sid": "sh-mingzhu", "n": 22, "id": "sh-mingzhu-470", "tag": "上海中考名著·《昆虫记》第1题", "t": "填空题", "stem": "法国昆虫学家法布尔的巨著《昆虫记》被誉为“__________”；在法布尔笔下，常在夏日树梢高声歌唱的__________其实并不是掠夺者，反而常常被贪婪凶狠的__________抢走食物。", "ans": "昆虫的史诗；蝉；蚂蚁", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】法布尔《昆虫记》。打破了《伊索寓言》中“勤劳蚂蚁与懒惰蝉”的传统成见。"}, {"s": "板块七：上海中考名著阅读全景通关（12 部必考名著真题模拟）", "sid": "sh-mingzhu", "n": 23, "id": "sh-mingzhu-471", "tag": "上海中考名著·《钢铁是怎样炼成的》第1题", "t": "简答题", "stem": "奥斯特洛夫斯基在《钢铁是怎样炼成的》中，主人公保尔·柯察金在烈士墓前曾立下关于生命的著名独白，请写出其中最震撼人心的核心名句。", "ans": "人最宝贵的是生命。生命每个人只有一次。人的一生应当这样度过：当回忆往事的时候，他不会因为虚度年华而悔恨，也不会因为碌碌无为而羞愧；在临死的时候，他能够说：“我的整个生命和全部精力，都已经献给了世界上最壮丽的事业——为人类的解放而斗争。”", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】苏联作家奥斯特洛夫斯基《钢铁是怎样炼成的》。"}, {"s": "板块七：上海中考名著阅读全景通关（12 部必考名著真题模拟）", "sid": "sh-mingzhu", "n": 24, "id": "sh-mingzhu-472", "tag": "上海中考名著·《水浒传》第4题", "t": "简答题", "stem": "《水浒传》中李逵这一人物形象鲜明可爱，又有草莽残暴的复杂一面。请结合“沂岭杀四虎”或“真假李逵”情节，简要分析李逵的性格特点。", "ans": "李逵的性格特点：坦率质朴、耿直忠诚、见义勇为、具有极强反抗精神；但同时性情急躁、鲁莽粗疏，杀人如麻不计后果。\n情节例证：在沂岭见母亲被老虎吃掉后，李逵悲愤交加，痛哭流涕，怒杀四虎为母报仇，充分体现其淳朴真挚的孝心与勇猛无畏的英雄本色。", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【考点分析】李逵是梁山好汉中反抗最彻底、性格最天真未凿也最具原生态野性的代表。"}, {"s": "板块七：上海中考名著阅读全景通关（12 部必考名著真题模拟）", "sid": "sh-mingzhu", "n": 25, "id": "sh-mingzhu-473", "tag": "上海中考名著·《水浒传》第5题", "t": "简答题", "stem": "《水浒传》全书以宋江为核心领袖，宋江一生坚持的政治口号是“__________”；梁山大聚义后，宋江极力推行的发展战略是“__________”，并最终导致了梁山起义军怎样的悲剧结局？", "ans": "替天行道；接受朝廷招安；\n悲剧结局：起义军被统治者当枪使南征方腊，死伤惨重，十去七八，最终宋江、卢俊义等人被奸臣用毒酒暗害，轰轰烈烈的梁山起义归于彻底失败。", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】施耐庵《水浒传》第七十一回后半部。"}, {"s": "板块七：上海中考名著阅读全景通关（12 部必考名著真题模拟）", "sid": "sh-mingzhu", "n": 26, "id": "sh-mingzhu-474", "tag": "上海中考名著·《西游记》第4题", "t": "填空题", "stem": "《西游记》中，唐僧在五庄观因两个徒弟偷吃__________，引发与镇元大仙的纠纷；最后孙悟空去南海请来__________菩萨，用净瓶甘露救活了宝树，双方才化敌为友结拜为兄弟。", "ans": "人参果；观音（观世音）", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】《西游记》第二十四至二十六回。"}, {"s": "板块七：上海中考名著阅读全景通关（12 部必考名著真题模拟）", "sid": "sh-mingzhu", "n": 27, "id": "sh-mingzhu-475", "tag": "上海中考名著·《西游记》第5题", "t": "简答题", "stem": "《西游记》第五十七回“真假美猴王”中，六耳猕猴假冒孙悟空打伤唐僧、抢走包袱。普天之下诸神皆无法辨别真伪，唯有地藏菩萨座下的神兽“__________”知其根底却不敢当面说明，最终如来佛祖道破六耳猕猴乃是天地间“__________”之一，方才将其收服。", "ans": "谛听；混世四猴（六耳猕猴）", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】《西游记》第五十八回《二心竞斗闹乾坤》。"}, {"s": "板块七：上海中考名著阅读全景通关（12 部必考名著真题模拟）", "sid": "sh-mingzhu", "n": 28, "id": "sh-mingzhu-476", "tag": "上海中考名著·《朝花夕拾》第4题", "t": "简答题", "stem": "在《朝花夕拾·范爱农》中，鲁迅描绘了一位怎样的辛亥革命志士形象？他在革命前后的命运遭遇揭示了辛亥革命怎样的局限性？", "ans": "形象：范爱农是一个耿直方正、孤傲执着、爱国深沉却生性倔强的青年知识分子；\n揭示局限：辛亥革命虽然推翻了满清皇帝帝制，但封建旧官僚和反动社会势力依然盘踞朝野，革命很不彻底。范爱农等进步青年在革命后不仅未能施展抱负，反而穷困潦倒、备受排挤打击，最终悲愤投水溺亡，深刻暴露出辛亥革命妥协软弱的社会悲剧。", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】鲁迅《朝花夕拾·范爱农》。"}, {"s": "板块七：上海中考名著阅读全景通关（12 部必考名著真题模拟）", "sid": "sh-mingzhu", "n": 29, "id": "sh-mingzhu-477", "tag": "上海中考名著·《朝花夕拾》第5题", "t": "简答题", "stem": "鲁迅在《朝花夕拾·二十四孝图》中重点批判了“__________”和“__________”两个孝道故事，指出这些虚伪愚孝故事是“摧残儿童天性，将肉麻当作有趣”的封建精神枷锁。", "ans": "老莱娱亲；郭巨埋儿", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】鲁迅《朝花夕拾·二十四孝图》。"}, {"s": "板块七：上海中考名著阅读全景通关（12 部必考名著真题模拟）", "sid": "sh-mingzhu", "n": 30, "id": "sh-mingzhu-478", "tag": "上海中考名著·《儒林外史》第4题", "t": "简答题", "stem": "《儒林外史》第二回中，老童生周进在同考官面前连考秀才不中，六十多岁仍是个童生，在参观贡院时竟然发生号啕大哭、一头撞在号板上不省人事的情节。这一震撼情节揭露了封建科举制度怎样的残酷本质？", "ans": "极度真实而惨烈地展现了封建科举制度对下层读书人精神灵魂的残酷折磨与彻底奴役，周进毕生受尽功名白眼与欺凌，在贡院号板前将数十年的屈辱、绝望与对功名的病态执念全部喷涌而出，具有震撼人心的悲剧控诉力量。", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】吴敬梓《儒林外史》第二回。"}, {"s": "板块七：上海中考名著阅读全景通关（12 部必考名著真题模拟）", "sid": "sh-mingzhu", "n": 31, "id": "sh-mingzhu-479", "tag": "上海中考名著·《儒林外史》第5题", "t": "填空题", "stem": "《儒林外史》中，原本孝敬母亲、做豆汁买卖勤劳纯朴的青年__________，在流落温州结识了官府胥吏之后，学会了钻营伪造假官文、欺名盗世，甚至停妻再娶，彻底堕落为道德败坏的八股蠹虫与伪君子。", "ans": "匡超人（匡迥）", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【考点分析】匡超人的蜕变过程是全书揭露科举名利场如何一步步将纯真青年腐蚀成虚伪小人的经典样本。"}, {"s": "板块七：上海中考名著阅读全景通关（12 部必考名著真题模拟）", "sid": "sh-mingzhu", "n": 32, "id": "sh-mingzhu-480", "tag": "上海中考名著·《骆驼祥子》第3题", "t": "填空题", "stem": "《骆驼祥子》中，人和车厂的老板是性格严苛残暴的__________；他的女儿__________看中并引诱祥子与其成婚，但最终因难产母子双亡；真正让祥子体会到人间温情、被祥子真心视作精神依靠却最终自缢惨死的人物是__________。", "ans": "刘四爷；虎妞；小福子", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】老舍《骆驼祥子》。小福子的自杀是彻底压垮祥子生存意志的最后一根稻草。"}, {"s": "板块七：上海中考名著阅读全景通关（12 部必考名著真题模拟）", "sid": "sh-mingzhu", "n": 33, "id": "sh-mingzhu-481", "tag": "上海中考名著·《鲁滨逊漂流记》第1题", "t": "简答题", "stem": "《鲁滨逊漂流记》的作者是英国启蒙时期小说家__________；小说的主人公鲁滨逊在荒岛上凭借惊人的毅力和智慧孤独生活了二十八年，他在荒岛上从野人刀下救出的忠实仆人取名为“__________”。", "ans": "丹尼尔·笛福；星期五", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【考点分析】鲁滨逊身上集中体现了近代上升期资产阶级开拓进取、百折不挠、勇于战胜自然的顽强进取精神。"}, {"s": "板块七：上海中考名著阅读全景通关（12 部必考名著真题模拟）", "sid": "sh-mingzhu", "n": 34, "id": "sh-mingzhu-482", "tag": "上海中考名著·《格列佛游记》第1题", "t": "简答题", "stem": "英国讽刺大师斯威夫特在《格列佛游记》第一卷中描写了“小人国”（利立浦特），小人国朝廷选拔官员和晋升爵位的主要方式是看谁在绳上跳得最高而不跌下来。这一荒诞情节辛辣讽刺了当时英国怎样的社会现实？", "ans": "辛辣讽刺了18世纪英国托利党与辉格党无休止的党派倾轧，以及英国宫廷大臣不凭真才实学、只靠阿谀奉承和弄权杂耍钻营求官的腐朽丑态。", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】斯威夫特《格列佛游记》第一卷。"}, {"s": "板块七：上海中考名著阅读全景通关（12 部必考名著真题模拟）", "sid": "sh-mingzhu", "n": 35, "id": "sh-mingzhu-483", "tag": "上海中考名著·《格列佛游记》第2题", "t": "填空题", "stem": "《格列佛游记》第四卷游记所到达的理想国度是“__________国”，那里的统治者是智慧纯良、崇尚理性的神骏良马，而代表贪婪下贱、充满兽性丑恶的劣等生物是“__________”。", "ans": "慧骃（慧骃国）；耶胡（野胡）", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【考点分析】以理性的马（慧骃）与丑陋的人形野兽（耶胡）形成鲜明对照，表达对人类社会恶疾的尖锐批判。"}, {"s": "板块七：上海中考名著阅读全景通关（12 部必考名著真题模拟）", "sid": "sh-mingzhu", "n": 36, "id": "sh-mingzhu-484", "tag": "上海中考名著·《童年》第1题", "t": "简答题", "stem": "高尔基自传体小说《童年》以阿廖沙的成长为线索。在凶狠残暴、自私冷酷的外祖父家里，给阿廖沙苦难幼年带来母性般温暖、慈爱与人道主义光芒的核心人物是他的__________；而乐观向上、因替师傅背沉重十字架而惨遭压死的热情青年是__________。", "ans": "外祖母（阿库琳娜）；“小茨冈”（伊凡）", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】高尔基自传体三部曲之一《童年》。外祖母是照亮阿廖沙黑暗童年的明灯。"}, {"s": "板块七：上海中考名著阅读全景通关（12 部必考名著真题模拟）", "sid": "sh-mingzhu", "n": 37, "id": "sh-mingzhu-485", "tag": "上海中考名著·《钢铁是怎样炼成的》第2题", "t": "简答题", "stem": "在《钢铁是怎样炼成的》中，保尔·柯察金一生经历的四次死里逃生展现了惊人的生命坚韧意志。在全身瘫痪、双目失明的人生绝境下，保尔选择以怎样的全新方式重新回到革命战斗的队伍中？", "ans": "保尔在瘫痪双目失明后，克服常人难以想象的伤痛与绝望，选择拿起手中的笔进行文学创作，以口述的方式坚持完成了中篇小说《暴风雨所诞生的》，以文学之笔继续为共产主义革命事业战斗一生。", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【考点分析】体现了“钢铁就是这样炼成的”——在苦难与烈火中百炼成钢的共产主义崇高意志。"}, {"s": "板块七：上海中考名著阅读全景通关（12 部必考名著真题模拟）", "sid": "sh-mingzhu", "n": 38, "id": "sh-mingzhu-486", "tag": "上海中考名著·《红星照耀中国》第4题", "t": "简答题", "stem": "斯诺在《红星照耀中国》中对中国工农红军的“红小鬼”（少年红军战士）给予了极高的赞誉。这些年轻战士展现了怎样的精神面貌？具有怎样的时代象征意义？", "ans": "面貌与意义：红小鬼们虽然年纪幼小、生活艰苦，却乐观自信、聪明机警、朝气蓬勃、纪律严明、热爱学习，具有强烈的爱国热情与坚定信念；他们象征着红色中国生机盎然的未来与不可战胜的新生力量。", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】《红星照耀中国》第十篇《战争与和平》。"}, {"s": "板块七：上海中考名著阅读全景通关（12 部必考名著真题模拟）", "sid": "sh-mingzhu", "n": 39, "id": "sh-mingzhu-487", "tag": "上海中考名著·《昆虫记》第2题", "t": "简答题", "stem": "法布尔在《昆虫记》中不仅用严谨求实的科学方法观察昆虫，更运用充满诗意、拟人化的文学语言描摹昆虫。请以“圣甲虫”（蜣螂）滚粪球或“螳螂”捕食为例，简述其写作特色。", "ans": "特色示例：法布尔把圣甲虫制作粪球比作自然界精巧勤劳的清道夫与慈爱的育幼专家，把螳螂捕食比作身着绿纱却暗藏杀机的优雅女杀手。他将自然科学与人文情怀熔于一炉，既有科学家的细致客观，又有文学家生动幽默的情趣，字里行间充满对生命的敬畏与挚爱。", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【考点分析】《昆虫记》是科学与文学完美结合的典范（“科学小品文”）。"}, {"s": "板块七：上海中考名著阅读全景通关（12 部必考名著真题模拟）", "sid": "sh-mingzhu", "n": 40, "id": "sh-mingzhu-488", "tag": "上海中考名著·《艾青诗选》第2题", "t": "简答题", "stem": "艾青的成名作是《__________》，诗人在寒冷的牢房中深情回忆了养育自己的贫苦保姆，抒发了对广大劳动人民真挚深沉的感激与爱戴。", "ans": "《大堰河——我的保姆》", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】艾青1933年创作的著名长诗。"}, {"s": "板块八：上海中考真题与模拟·语言文字综合运用与传统文化", "sid": "sh-zonghe", "n": 1, "id": "sh-zonghe-489", "tag": "上海中考病句·成分残缺", "t": "选择题", "stem": "下列句子中没有语病的一项是（    ）\nA. 通过开展“名著整本书阅读”主题活动，使广大初中生的文学素养和表达能力得到了明显提高。\nB. 随着城市绿道和口袋公园的相继建成，让上海市民的绿色休闲空间得到了极大的丰富和拓展。\nC. 各学校要高度重视心理健康教育，及时发现、引导和化解学生的负面情绪与成长困惑。\nD. 在数字化时代，博物馆利用虚拟现实技术，深藏在库房里的珍贵文物“活”了起来。", "ans": "C", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【病因剖析】\nA项：成分残缺。“通过……”与“使……”连用，介词短语淹没主语，应删去“通过”或“使”。\nB项：成分残缺。“随着……”与“让……”连用，导致全句缺少主语，删去“随着”或“让”。\nC项：语序合理，动宾搭配恰当，句子结构完整，没有语病。\nD项：结构混乱，“博物馆利用……”后缺少谓语动词让前后句衔接，应在“珍贵文物”前加“让”。"}, {"s": "板块八：上海中考真题与模拟·语言文字综合运用与传统文化", "sid": "sh-zonghe", "n": 2, "id": "sh-zonghe-490", "tag": "上海中考病句·两面对一面", "t": "选择题", "stem": "下列句子中没有语病的一项是（    ）\nA. 能否在初三复习阶段保持从容良好的心理状态，是取得中考理想成绩的关键。\nB. 一个人能否成为对社会有用的人才，关键在于他是否具有坚定的理想信念和拼搏精神。\nC. 具有扎实的基础知识和良好的审题习惯，是决定我们中考能否取得高分的唯一因素。\nD. 面对复杂的考题，同学们能否沉着应考，决定了整场考试的发挥效果。", "ans": "B", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【病因剖析】\nB项：“能否”对应“是否具有”，两面呼应得当，没有语病。\nA项：两面对一面。“能否”（两面）与“取得中考理想成绩”（一面）前后不对应，应在“取得”前加“能否”或删去句首的“能否”。\nC项：一面对两面。“具有扎实的基础……”是一面，后半句“能否取得高分”是两面，应删去“能否”。\nD项：“决定了整场考试的发挥效果”表意不明确，两面未对应好。"}, {"s": "板块八：上海中考真题与模拟·语言文字综合运用与传统文化", "sid": "sh-zonghe", "n": 3, "id": "sh-zonghe-491", "tag": "上海中考病句·句式杂糅", "t": "选择题", "stem": "下列句子中没有语病的一项是（    ）\nA. 调查表明，青少年近视率上升的主要原因是因为长时间使用电子产品和缺乏足够的户外运动造成的。\nB. 《本草纲目》的作者是由明代杰出的医药学家李时珍历时二十七年编写完成的。\nC. 为了避免校园欺凌事件再次发生，学校成立了专门的安全巡查小组和心理关怀机制。\nD. 航天员在太空中展示的奇妙微重力实验，不仅激发了青少年的科学探索热情，更拓宽了他们的科学视野。", "ans": "D", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【病因剖析】\nA项：句式杂糅。“主要原因是因为……造成的”杂糅了“主要原因是……”与“是由……造成的”两种句式，应删去“因为”和“造成的”。\nB项：句式杂糅。“作者是由……编写完成的”杂糅了“作者是李时珍”与“是由李时珍编写完成的”。\nC项：搭配不当。“成立”不能与“心理关怀机制”搭配，可在“心理关怀机制”前补出动词“健全”。\nD项：递进分句逻辑恰当，语序顺畅，没有语病。"}, {"s": "板块八：上海中考真题与模拟·语言文字综合运用与传统文化", "sid": "sh-zonghe", "n": 4, "id": "sh-zonghe-492", "tag": "上海中考病句·否定不当", "t": "选择题", "stem": "下列句子中没有语病的一项是（    ）\nA. 为了防止类似火灾事故不再发生，消防部门对全市的老旧住宅区展开了拉网式安全排查。\nB. 谁也不能否认雷锋精神在当今时代依然具有强大的道德感染力与深远的现实意义。\nC. 我们必须认真吸取经验教训，切忌不能在今后的中考复习备考中产生麻痹大意思想。\nD. 学校食堂严把食品采购源头关，谨防过期变质食品不流入广大学生餐桌。", "ans": "B", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【病因剖析】\nB项：“谁也不能否认……”是双重否定表示强烈的肯定，“否认”+“不能”，表达“大家都承认”，语意正确通畅。\nA项：否定不当。“防止”本身含有否定意味，后接“不再发生”导致多重否定颠倒了句意，应删去“不”。\nC项：否定不当。“切忌”即千万不要，后接“不能”导致表意相反，应删去“不能”。\nD项：否定不当。“谨防”意为小心防备，后加“不流入”导致逻辑错乱，应删去“不”。"}, {"s": "板块八：上海中考真题与模拟·语言文字综合运用与传统文化", "sid": "sh-zonghe", "n": 5, "id": "sh-zonghe-493", "tag": "上海中考病句·搭配不当", "t": "选择题", "stem": "下列句子中没有语病的一项是（    ）\nA. 黄浦江两岸的夜景璀璨夺目，吸引了数以万计的海内外游客和市民前来驻足欣赏。\nB. 在阅读经典名著的过程中，使我深深感受到了中华优秀传统文化的博大精深与恒久魅力。\nC. 随着我国航天事业的飞速发展，展现了中华民族自强不息、勇攀世界科技高峰的壮志雄心。\nD. 我们不仅要学好课堂书本知识，更要在丰富多彩的社会实践中锤炼坚毅品格与综合本领。", "ans": "D", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【病因剖析】\nA项：语意重复与逻辑并列不当。“驻足”本身即停下脚步，与“前来驻足”重复；且“海内外游客”包含部分市民，二者交叉不能并列。\nB项：缺主语。“在……过程中”与“使我……”掩盖主语，删去“在……中”或“使”。\nC项：缺主语。“随着……”掩盖了全句主语，应删去“随着”。\nD项：动宾搭配得当，递进自然，没有语病。"}, {"s": "板块八：上海中考真题与模拟·语言文字综合运用与传统文化", "sid": "sh-zonghe", "n": 6, "id": "sh-zonghe-494", "tag": "上海中考病句·语序不当", "t": "选择题", "stem": "下列句子中语序最恰当、没有语病的一项是（    ）\nA. 面对数字化阅读浪潮，我们要善于发现、甄别和吸纳网络中的优质文化资源。\nB. 这一重大的考古新发现，不仅引起了国际学术界的广泛关注，而且改写了中国古代冶金史。\nC. 很多外国留学生通过在上海的生活体验，深切理解和领会了海派文化的开放包容。\nD. 为了提高同学们的写作水平，语文老师向全班推荐了莫言最新出版的一本散文集。", "ans": "A", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【试题剖析】\nA项：语序合理。“发现”（先接触）→“甄别”（再辨别）→“吸纳”（最后吸收），层层递进，符合认知规律。\nB项：递进分句语序颠倒。应为“不仅改写了中国古代冶金史，而且引起了国际学术界的广泛关注”（国际关注影响范围更大）。\nC项：“理解和领会”语意重复近义堆砌。\nD项：多层定语语序不当。“莫言最新出版的一本散文集”应为“一本莫言最新出版的散文集”（数量代词应放在前面）。"}, {"s": "板块八：上海中考真题与模拟·语言文字综合运用与传统文化", "sid": "sh-zonghe", "n": 7, "id": "sh-zonghe-495", "tag": "上海中考病句·表意不明", "t": "选择题", "stem": "下列句子中没有语病、表意明确的一项是（    ）\nA. 班主任把我们班和二班的几个代表召集到会议室，共同商讨初三年级毕业典礼的筹备方案。\nB. 随着“天宫课堂”第四课的开讲，使广大中小学生进一步领略到了微重力环境下的神奇科学魅力。\nC. 人工智能作为引领新一轮科技革命的核心技术，正在深刻改变着人类社会的生产生活方式。\nD. 看到小明和小华的精彩辩论，大家都忍不住为他的敏捷才思与雄辩口才热烈鼓掌。", "ans": "C", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【病因剖析】\nA项：表意不明。“几个代表”产生歧义，是指“二班的几个代表”，还是两班合起来的几个代表，修饰界限不清。\nB项：成分残缺，滥用介词“随着……使……”，缺少主语。\nC项：表意明确，结构完整，用词规范。\nD项：代词指代不明。“为他的敏捷才思”中“他”指代不清，究竟指小明还是小华。"}, {"s": "板块八：上海中考真题与模拟·语言文字综合运用与传统文化", "sid": "sh-zonghe", "n": 8, "id": "sh-zonghe-496", "tag": "上海中考病句·不合逻辑", "t": "选择题", "stem": "下列句子中没有语病的一项是（    ）\nA. 为了庆祝中秋佳节，同学们采购了月饼、苹果、香蕉、橙子和各类新鲜水果。\nB. 寒假期间，图书馆迎来了借阅高峰，每天接待读者大约 2000 多人次左右。\nC. 建设美丽中国，既需要全社会树立生态文明理念，更需要每一个公民付诸实实在在的行动。\nD. 经过严格的体能训练与战术演练，使这支青年龙舟队的竞技水平获得了飞跃式提升。", "ans": "C", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【病因剖析】\nA项：不合逻辑，概念包含混淆。“苹果、香蕉、橙子”属于“新鲜水果”，不能与“各类新鲜水果”用“和”并列。\nB项：不合逻辑，重复赘余。“大约”与“多”、“左右”同表约数，矛盾堆砌，应删去“大约”或“多”、“左右”。\nC项：递进句式恰当，“理念”到“行动”逻辑缜密，没有语病。\nD项：成分残缺，滥用“经过……使……”，导致主语残缺。"}, {"s": "板块八：上海中考真题与模拟·语言文字综合运用与传统文化", "sid": "sh-zonghe", "n": 9, "id": "sh-zonghe-497", "tag": "上海中考病句修改·主观改错1", "t": "简答题", "stem": "请找出下面这段通知中的两处语病，并提出具体的修改意见：\n“为了迎接上海市中学生古诗文大赛，学校决定于本周五下午在报告厅召开古诗词背诵选拔赛。请各班语文课代表务必准时按时到场，积极组织本班选手参赛。通过这次选拔，使同学们进一步感受中华传统文化的博大精深。”", "ans": "【病句一】“召开古诗词背诵选拔赛”搭配不当。\n修改意见：将“召开”改为“举行”或“举办”（比赛通常用举办/举行，会议用召开）。\n\n【病句二】“准时按时”语意重复。\n修改意见：删去“准时”或“按时”中的一个。\n\n【病句三】“通过这次选拔，使同学们……”缺少主语。\n修改意见：删去“通过”或“使”。（指出任两处即可满分）", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【考点分析】综合考查搭配不当、语义重复和介词掩盖主语三种高频语病类型的修改能力。"}, {"s": "板块八：上海中考真题与模拟·语言文字综合运用与传统文化", "sid": "sh-zonghe", "n": 10, "id": "sh-zonghe-498", "tag": "上海中考病句修改·主观改错2", "t": "简答题", "stem": "请修改下面的病句，保持原意不变：\n“我们要引导青少年树立正确的人生观、价值观和世界观，谨防不良网络文化不侵蚀他们的身心健康。”", "ans": "【修改后】我们要引导青少年树立正确的世界观、人生观和价值观，谨防不良网络文化侵蚀他们的身心健康。\n\n【修改说明】\n①语序不当：“人生观、价值观和世界观”应调整为“世界观、人生观和价值观”（按照由宏观认知到具体人生的逻辑顺序）；\n②否定不当：“谨防”后多用了否定词“不”，导致意图颠倒，应删去“不”。", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【采分点】①调整世界观/人生观/价值观语序；②删去“谨防”后面的否定词“不”。"}, {"s": "板块八：上海中考真题与模拟·语言文字综合运用与传统文化", "sid": "sh-zonghe", "n": 11, "id": "sh-zonghe-499", "tag": "上海中考成语·褒贬误用", "t": "选择题", "stem": "下列句子中加点成语使用恰当的一项是（    ）\nA. 毕业晚会上，同学们各展所长，小明表演的近景魔术手法神妙，令人叹．为．观．止．。\nB. 面对敌人的严刑拷打与诱降，共产党员李大钊逢．场．作．戏．，最终严守了党的最高机密。\nC. 犯罪分子处心积虑制造伪证，妄图掩盖罪行，但在人民警察的火眼金睛下最终无．所．不．为．。\nD. 小李同学平时学习非常刻苦，经常利用课间十分钟处．心．积．虑．地钻研数学难题。", "ans": "A", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【成语辨析】\nA项：叹为观止，指赞美所见到的事物好到了极点。使用恰当。\nB项：逢场作戏，原指旧时卖艺人遇到合适场地就表演，后比喻随意应酬凑热闹或态度不严肃，贬义词，不能用于形容革命先烈，褒贬误用。\nC项：无所不为，指什么坏事都干得出来，贬义词，此处想表达“无处隐藏”，用词错误。\nD项：处心积虑，指千方百计谋划（多含贬义），不能用来形容同学刻苦钻研难题，褒贬误用。"}, {"s": "板块八：上海中考真题与模拟·语言文字综合运用与传统文化", "sid": "sh-zonghe", "n": 12, "id": "sh-zonghe-500", "tag": "上海中考成语·望文生义", "t": "选择题", "stem": "下列句子中加点成语使用恰当的一项是（    ）\nA. 遇到难题时，我们应该积极思考，而不能目．无．全．牛．、轻视每一个细微的环节。\nB. 暴雨即将来临，街道上的行人和车辆首．当．其．冲．，纷纷躲进附近的商场避雨。\nC. 语文老师朗读课文声情并茂，抑扬顿挫，同学们听得如．坐．春．风．，沉浸在诗意之中。\nD. 他写的那篇论说文观点鲜明，论据翔实，逻辑严密，真是文．不．加．点．、空洞无物。", "ans": "C", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【成语辨析】\nC项：如坐春风，比喻同品德高尚、学识渊博的人相处并受到熏陶教育。使用恰当。\nA项：目无全牛，形容技艺已经达到极其纯熟高超的境地，并非“缺乏全局观、轻视细节”，望文生义。\nB项：首当其冲，比喻最先受到攻击或遭遇灾难，不是“首先”的意思，望文生义。\nD项：文不加点，“点”指涂改删削，形容文章写得极快极好，一气呵成无需修改；此处与“空洞无物”自相矛盾，望文生义。"}, {"s": "板块八：上海中考真题与模拟·语言文字综合运用与传统文化", "sid": "sh-zonghe", "n": 13, "id": "sh-zonghe-501", "tag": "上海中考成语·对象不当", "t": "选择题", "stem": "下列句子中加点成语使用恰当的一项是（    ）\nA. 陆家嘴金融贸易区高楼林立，鳞．次．栉．比．，展现出国际现代化大都市的非凡气魄。\nB. 他书法造诣极深，笔力雄健，挥洒自如，写出的楷书真可谓巧．夺．天．工．。\nC. 在这次中学生辩论赛中，小华同学引经据典，口若悬河，表现出色，真可谓美．轮．美．奂．。\nD. 这两支实力强劲的足球队在决赛中相遇，场面极其激烈，双方你来我往，真是一对蓬．头．垢．面．的对手。", "ans": "A", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【成语辨析】\nA项：鳞次栉比，多用来形容房屋、高楼或船只密集排列。形容陆家嘴摩天大楼林立恰当。\nB项：巧夺天工，精巧的人工胜过天然，专用于形容精湛的人工工艺品（雕刻、园林等），不能形容书法作品。\nC项：美轮美奂，形容房屋建筑高大华丽或装饰极美，不能用来形容辩论表现或口才。\nD项：蓬头垢面，形容头发凌乱、脸上肮脏不堪，不能形容球场对手。"}, {"s": "板块八：上海中考真题与模拟·语言文字综合运用与传统文化", "sid": "sh-zonghe", "n": 14, "id": "sh-zonghe-502", "tag": "上海中考成语·语义重复", "t": "选择题", "stem": "下列各句中加点成语使用恰当、没有语病的一项是（    ）\nA. 听到中国空间站建造全面完成的喜讯，全国人民无不欢欣鼓舞，大家忍．俊．不．禁．地笑了起来。\nB. 面对浩瀚无垠的宇宙奥秘，科学家们始终保持着孜．孜．不．倦．的探索求知精神。\nC. 他看到歹徒持刀抢劫，毫不犹豫地挺身而出，这种见义勇为的精神真是令人贻．笑．大．方．。\nD. 这件珍贵青铜器流失海外数百年，如今终于物归原主，重新完．好．无．损．地完璧归赵了。", "ans": "B", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【成语辨析】\nB项：孜孜不倦，指工作或学习勤奋不知疲倦。使用恰当。\nA项：忍俊不禁，指忍不住笑出来，后接“地笑了起来”造成语义重复。\nC项：贻笑大方，指被内行的人笑话（贬义），不能形容令人敬佩的英雄壮举。\nD项：完璧归赵，本就指把物品完好无损地归还原主，前加“完好无损地”语义重复。"}, {"s": "板块八：上海中考真题与模拟·语言文字综合运用与传统文化", "sid": "sh-zonghe", "n": 15, "id": "sh-zonghe-503", "tag": "上海中考成语·典故语境1", "t": "选择题", "stem": "下列加点成语使用不恰当的一项是（    ）\nA. 经典文学作品之所以历久弥新，是因为它能给不同时代的人以深邃的思想启迪与不．绝．如．缕．的心灵滋养。\nB. 做学问必须脚踏实地、探骊得珠，绝不能走．马．观．花．、浅尝辄止。\nC. 面对科技创新中的“卡脖子”难题，科研团队迎难而上，终于取得了吹．毛．求．疵．的重大突破。\nD. 经过几代治沙人的艰苦创业，昔日荒无人烟的沙漠如今变成了郁郁葱葱的绿洲，沧．海．桑．田．的变化令人震撼。", "ans": "C", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【成语辨析】\nC项错误。吹毛求疵：故意挑剔毛病，寻找差错（贬义词），不能用来修饰科研上的重大突破，属于褒贬误用。"}, {"s": "板块八：上海中考真题与模拟·语言文字综合运用与传统文化", "sid": "sh-zonghe", "n": 16, "id": "sh-zonghe-504", "tag": "上海中考成语·典故语境2", "t": "选择题", "stem": "下列各句中加点词语运用恰当的一项是（    ）\nA. 面对瞬息万变的信息化社会，我们要保持敏锐的洞察力，不能坐．井．观．天．。\nB. 小明在班长竞选演说中闪烁其词，口若悬河，博得了台下师生的阵阵掌声。\nC. 在这次拔河比赛中，全班同学齐心协力，各．行．其．是．，终于夺得初三年级组冠军。\nD. 他在长跑训练中不慎摔倒受伤，但他轻．描．淡．写．地站起来，依然坚持跑完了全程。", "ans": "A", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【成语辨析】\nA项：坐井观天，比喻眼界狭小、所见有限。使用恰当。\nB项：闪烁其词，形容说话吞吞吐吐、不肯明说，与“口若悬河、赢得掌声”自相矛盾。\nC项：各行其是，指各自按照自己的意见去做（不协同），与“齐心协力”矛盾。\nD项：轻描淡写，原指绘画时轻轻描绘，后比喻说话做事轻轻带过、不加重视，不能用来形容摔倒后爬起的动作。"}, {"s": "板块八：上海中考真题与模拟·语言文字综合运用与传统文化", "sid": "sh-zonghe", "n": 17, "id": "sh-zonghe-505", "tag": "上海中考熟语·歇后语与惯用语", "t": "选择题", "stem": "下列句子中惯用语或熟语使用恰当的一项是（    ）\nA. 小张在团队中工作最勤恳扎实，脏活累活抢着干，大家都亲切地称他是团队里的“领头羊”。\nB. 面对突如其来的困难，我们不能做“井底之蛙”，而要敢于挑起重担，当好“顶梁柱”。\nC. 小李在班级活动中总爱发表不同看法，大家评价他是一个特别爱“唱白脸”的人。\nD. 遇到突发问题要迅速向老师汇报，切不可“开绿灯”，以免延误解决的最佳时机。", "ans": "B", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【熟语辨析】\nB项：顶梁柱，比喻起支撑和决定作用的中坚骨干力量。使用恰当。\nA项：埋头苦干、任劳任怨的人应称为“老黄牛”，而非引领带头的“领头羊”。\nC项：唱白脸，戏曲中借指扮演奸诈阴险的角色，不能用来形容提出不同见解。\nD项：开绿灯，比喻提供方便或准许放行，不能形容知情不报或自作主张。"}, {"s": "板块八：上海中考真题与模拟·语言文字综合运用与传统文化", "sid": "sh-zonghe", "n": 18, "id": "sh-zonghe-506", "tag": "上海中考成语·综合填空", "t": "填空题", "stem": "请结合语境，在横线上填写一个符合句意的四字成语：\n面对浩瀚的文学海洋，如果我们只是浮光掠影、__________（比喻只看不动脑思考、走马看花），就永远无法体会到经典著作深沉博大的精神内涵。", "ans": "浅尝辄止（或：走马观花 / 浮光掠影）", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【成语填空】浅尝辄止：略微尝试一下就停止，比喻不往深处钻研。切合“只看不动脑、不往深处体会”的语境。"}, {"s": "板块八：上海中考真题与模拟·语言文字综合运用与传统文化", "sid": "sh-zonghe", "n": 19, "id": "sh-zonghe-507", "tag": "上海中考标点·选择问句与顿号", "t": "选择题", "stem": "下列句子中标点符号使用完全正确的一项是（    ）\nA. “海内存知己，天涯若比邻。”唐代诗人王勃的这两句诗，千百年来一直激励着奔赴前程的年轻友人。\nB. 面对人生旅途中的风雨坎坷，我们是选择怨天尤人？还是选择勇敢面对、迎难而上？\nC. 语文综合性学习包括四个基本环节：选题立意、搜集资料、成果展示、和总结评价。\nD. 他看起来大约十三、四岁的年纪，个子不高，眼神却格外清澈坚定。", "ans": "A", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【标点规范辨析】\nA项：引用整句诗作主语成分，句末句号在引号内，标点完全正确。\nB项：选择问句中间各分句间用逗号，句末才用问号，应改为：“我们是选择怨天尤人，还是选择勇敢面对、迎难而上？”\nC项：连词“和”前面不能使用顿号，应删去“成果展示”后面的顿号。\nD项：表示概数的相邻两个数字之间不能用顿号，“十三四岁”中间不加顿号。"}, {"s": "板块八：上海中考真题与模拟·语言文字综合运用与传统文化", "sid": "sh-zonghe", "n": 20, "id": "sh-zonghe-508", "tag": "上海中考标点·引号与冒号", "t": "选择题", "stem": "下列句子中标点符号使用完全规范的一项是（    ）\nA. 鲁迅先生在《朝花夕拾》的小引中说：“我有一时，曾经屡次忆起儿时在故乡所吃的蔬果：菱角，罗汉豆，茭白，香瓜。”\nB. 语文老师今天向我们重点推荐了《红星照耀中国》、《昆虫记》、和《钢铁是怎样炼成的》三部名著。\nC. “请同学们抓紧时间整理好行装，”班主任在车门前叮嘱道：“客车马上就要出发了。”\nD. 他到底能不能在中考中发挥出最佳水平？我们现在还无法妄下定论。", "ans": "A", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【标点符号辨析】\nA项：直接完整引用，引文独立成段成分完整，句号在引号内，冒号分层正确。\nB项：标有书名号的书名之间通常不需要使用顿号；且连词“和”前不加顿号。\nC项：在人物语言在前后、提示语在中间时，提示语“班主任叮嘱道”后应用逗号，不能用冒号。\nD项：“他到底能不能发挥出最佳水平”是充当动词谓语“下定论”的宾语从句，全句为陈述语气，句末应使用句号，不能用问号。"}, {"s": "板块八：上海中考真题与模拟·语言文字综合运用与传统文化", "sid": "sh-zonghe", "n": 21, "id": "sh-zonghe-509", "tag": "上海中考标点·破折号与括号", "t": "选择题", "stem": "下列句子中标点符号使用不规范的一项是（    ）\nA. 上海，这座被誉为“东方明珠”的国际大都市——正在以昂扬的姿态迈向更现代化的未来。\nB. 初中语文教材选入了不少古代山水游记，如柳宗元的《小石潭记》、欧阳修的《醉翁亭记》等。\nC. 居里夫人（1867—1934），波兰裔法国籍物理学家、化学家，曾两次荣获诺贝尔奖。\nD. “今天的天气真好啊！”小明望着窗外蔚蓝的天空赞叹道。", "ans": "A", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【标点符号辨析】\nA项错误。破折号不能放在主语与谓语之间强行割裂主谓成分；“东方明珠”是上海的同位语修饰，应用逗号或者括号，此处破折号导致全句语气突兀断裂。"}, {"s": "板块八：上海中考真题与模拟·语言文字综合运用与传统文化", "sid": "sh-zonghe", "n": 22, "id": "sh-zonghe-510", "tag": "上海中考标点·综合填空1", "t": "填空题", "stem": "在下面语段的方框中填入最恰当的标点符号：\n经典名著之所以能够穿越时空，是因为它们记录了人类对真、善、美永恒追求的密码□阅读这些经典，就像是与先哲们围炉长谈□倾听他们的思想独白，感受他们博大的精神力量。", "ans": "。 ；（或：； 、）", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【标点填空】第一空断句用句号（。）或分号（；），前后是两个相对独立的并列阐释；第二空“长谈”与“倾听”为连贯动作分句，用逗号（，）或分号（；）。"}, {"s": "板块八：上海中考真题与模拟·语言文字综合运用与传统文化", "sid": "sh-zonghe", "n": 23, "id": "sh-zonghe-511", "tag": "上海中考标点·书名号与分号", "t": "选择题", "stem": "下列句子中分号使用正确的一项是（    ）\nA. 学习犹如登山；不畏艰难险阻方能领略无限风光。\nB. 做人要诚实守信，一诺千金；做事要脚踏实地，精益求精。\nC. 班会课上，同学们热烈讨论了三个议题：第一，如何合理规划复习时间；第二，如何保持健康心态；第三，如何加强体育锻炼。\nD. 只有树立了崇高的理想；我们才能在人生的道路上走得更稳、更远。", "ans": "B", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【标点符号辨析】\nB项：并列复句中分句内部已经使用了逗号，并列分句之间使用分号，规范标准。\nA项：单句分句之间语意连贯，无并列结构，不应使用分号，应为逗号。\nC项：冒号后面统领的并列分项，内部没有逗号时，项与项之间应用逗号或句号，使用分号不妥。\nD项：条件复句“只有……才……”分句之间应用逗号，不能用分号强行割裂。"}, {"s": "板块八：上海中考真题与模拟·语言文字综合运用与传统文化", "sid": "sh-zonghe", "n": 24, "id": "sh-zonghe-512", "tag": "上海中考标点·综合判断", "t": "选择题", "stem": "下列句子中顿号使用正确的一项是（    ）\nA. 动物园里有斑马、大象、长颈鹿、和金丝猴等珍稀野生动物。\nB. 遇到不懂的问题，我们要多向老师、家长、和身边的同学请教。\nC. 展览馆陈列着齐白石、徐悲鸿、张大千三位大师的传世国画名作。\nD. 这座桥长约五、六十米，宽约八米，全部由青石砌成。", "ans": "C", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【试题剖析】\nC项正确。三位画家名字为句内并列词语，中间用顿号隔开，符合规范。\nA项和B项：连词“和”之前不得使用顿号。\nD项：“五六十米”表示概数，相邻数字之间不得使用顿号。"}, {"s": "板块八：上海中考真题与模拟·语言文字综合运用与传统文化", "sid": "sh-zonghe", "n": 25, "id": "sh-zonghe-513", "tag": "上海中考对联·选配下联", "t": "选择题", "stem": "请根据对联“字数相等、词性相对、平仄相谐（仄起平收）”的格律规则，为上联选配最恰当的下联：\n上联：春风拂柳千条翠\n下联：（    ）\nA. 红日照山万朵红       B. 晴日催花百树红       C. 润雨滋桃万朵红       D. 秋雨敲窗一帘幽", "ans": "C", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【对联格律深度剖析】\n上联“春风（偏正名）拂（动）柳（名）千条（数量）翠（形）”。\nA项：“红日（名）照（动）山（名）万朵红”，“山”不能用“万朵”修饰，搭配不合常理；\nB项：“晴日”与“春风”时令不完全相对，“催花”与“拂柳”平仄不谐；\nC项：“润雨（偏正名）滋（动）桃（名）万朵（数量）红（形）”，词性结构完全对应，“春风”对“润雨”，“拂柳”对“滋桃”，“千条翠”对“万朵红”，且“翠”为仄声，“红”为平声，完全符合仄起平收；\nD项：“秋雨”与上联春景季节矛盾。"}, {"s": "板块八：上海中考真题与模拟·语言文字综合运用与传统文化", "sid": "sh-zonghe", "n": 26, "id": "sh-zonghe-514", "tag": "上海中考对联·拟写横线", "t": "填空题", "stem": "为庆祝初中毕业典礼，学校团委拟写了一副励志对联，请补全下联：\n上联：书山策马抒壮志\n下联：学海__________乘长风", "ans": "扬帆（或：泛舟 / 驾舟）", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【对联采分】上联“策马”为动宾结构，对应下联“扬帆/泛舟”，词性相对，语意豪迈，暗合“直挂云帆济沧海”之意。"}, {"s": "板块八：上海中考真题与模拟·语言文字综合运用与传统文化", "sid": "sh-zonghe", "n": 27, "id": "sh-zonghe-515", "tag": "上海中考修辞·手法辨析", "t": "选择题", "stem": "下列诗文语句中没有使用修辞手法的一项是（    ）\nA. 忽如一夜春风来，千树万树梨花开。\nB. 盼望着，盼望着，东风来了，春天的脚步近了。\nC. 他看起来特别像他年轻时候的父亲。\nD. 沉舟侧畔千帆过，病树前头万木春。", "ans": "C", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【修辞辨析】\nC项：虽然含有“像”，但是两同类人物（儿子与父亲）相貌对比，属于具象外貌特征比照，不是比喻修辞。\nA项：比喻（将大雪比作梨花）。\nB项：反复（“盼望着，盼望着”）与拟人（“春天的脚步近了”）。\nD项：借喻/比喻（沉舟病树自比）与对偶。"}, {"s": "板块八：上海中考真题与模拟·语言文字综合运用与传统文化", "sid": "sh-zonghe", "n": 28, "id": "sh-zonghe-516", "tag": "上海中考修辞·排比与仿写", "t": "填空题", "stem": "【2024静安二模任务】学校读书节开幕式上，请仿照画线句在横线上续写两组排比分句：\n“整本书阅读，使我们拓宽了视野，感受到了文学的魅力；\n整本书阅读，______________________，______________________；\n整本书阅读，______________________，______________________。”", "ans": "启迪了我们的心智，汲取了精神的养分；升华了我们的情操，指引了人生的航向", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【仿写采分点】句式保持“动词+偏正宾语，动词+偏正宾语”的工整结构，语意逐层递进，紧扣阅读对心智与精神的滋润。"}, {"s": "板块八：上海中考真题与模拟·语言文字综合运用与传统文化", "sid": "sh-zonghe", "n": 29, "id": "sh-zonghe-517", "tag": "上海中考对联·名胜古迹对联", "t": "选择题", "stem": "下列对联中，适合悬挂在岳阳楼上的一项是（    ）\nA. 翁去八百载，醉乡犹在；山行六七里，亭影不孤。\nB. 四面湖山归眼底；万家忧乐到心头。\nC. 诸葛大名垂宇宙；宗臣遗像肃清高。\nD. 一门父子三词客；千古文章四大家。", "ans": "B", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【名胜对联文化常识】\nB项：“四面湖山”指洞庭湖，“万家忧乐”化用范仲淹《岳阳楼记》“先天下之忧而忧，后天下之乐而乐”，正是湖南岳阳楼名联。\nA项：悬挂于安徽滁州“醉翁亭”（欧阳修醉翁亭记）；\nC项：悬挂于四川成都“武侯祠”（诸葛亮）；\nD项：悬挂于四川眉山“三苏祠”（苏洵、苏轼、苏辙）。"}, {"s": "板块八：上海中考真题与模拟·语言文字综合运用与传统文化", "sid": "sh-zonghe", "n": 30, "id": "sh-zonghe-518", "tag": "上海中考对联·中考励志", "t": "选择题", "stem": "中考前夕，班级黑板报准备写一副激励斗志的对联，下列对仗最工整、立意最积极的一项是（    ）\nA. 宝剑锋从磨砺出；梅花香自苦寒来。\nB. 十年磨剑争分夺秒；今朝出征定能考好。\nC. 汗水洒满书山路；笔墨染就锦绣文。\nD. 青春须早为；岂能长少年。", "ans": "A", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【试题剖析】\n答案 A。“宝剑锋从磨砺出，梅花香自苦寒来”平仄协调（出为仄，来为平），词性高度对应，意境坚毅，是历久弥新的励志名联。B项对仗不工整且平仄失调；C项“路”与“文”对仗较弱；D项为五言古诗句，非律联。"}, {"s": "板块八：上海中考真题与模拟·语言文字综合运用与传统文化", "sid": "sh-zonghe", "n": 31, "id": "sh-zonghe-519", "tag": "上海中考综合实践·图表分析", "t": "简答题", "stem": "【图表分析题】某校对初中三个年级学生“课外阅读时间与媒介方式”进行了问卷调查，数据统计显示：\n- 六年级：纸质阅读占比 78%，数字化阅读占比 22%，日均阅读时长 45 分钟；\n- 七八年级：纸质阅读占比 52%，数字化阅读占比 48%，日均阅读时长 35 分钟；\n- 九年级：纸质阅读占比 31%，数字化阅读占比 69%，日均阅读时长 20 分钟。\n\n请根据以上数据，概括得出两条核心结论：", "ans": "结论一：随着年级的升高，初中生纸质阅读比例逐渐下降，而数字化阅读比例显著上升（甚至成为高年级主要阅读方式）；\n结论二：随着年级的升高，初中生每日平均课外阅读时间呈现出明显的逐年递减趋势。", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【图表概括要点】①对比阅读媒介比例的升降趋势；②提炼日均阅读时长的整体走低趋势。"}, {"s": "板块八：上海中考真题与模拟·语言文字综合运用与传统文化", "sid": "sh-zonghe", "n": 32, "id": "sh-zonghe-520", "tag": "上海中考综合实践·新闻一句话标题", "t": "简答题", "stem": "请为下面的新闻材料拟写一则“一句话新闻标题”（不超过 20 字）：\n“2026年10月，上海图书馆东馆正式向公众发布‘青少年经典古籍数字化互动平台’。该平台运用先进的人工智能与三维数字孪生技术，将馆藏的数百部宋元珍本古籍转化为可视化、可交互的沉浸式数字画卷。全市中小学生只需轻点触控屏，即可穿越千年时空，与苏轼、辛弃疾等古代文人跨时空‘对话’，零距离领略中华典籍的博大深邃。”", "ans": "上海图书馆发布古籍数字化互动平台（或：上图东馆推古籍互动平台，助青少年沉浸阅读）", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【新闻标题拟写要点】新闻标题四要素：主体（上海图书馆东馆）+ 事件（发布青少年古籍数字化互动平台），语言高度精炼，字数在20字以内。"}, {"s": "板块八：上海中考真题与模拟·语言文字综合运用与传统文化", "sid": "sh-zonghe", "n": 33, "id": "sh-zonghe-521", "tag": "上海中考综合实践·提取关键词", "t": "填空题", "stem": "请从下面这段关于“探究性学习”的论述中，提炼出 3 个能够概括其核心特征的关键词：\n“探究性学习强调以学生为主体，紧密围绕真实生活情境中的问题展开深度调研。在这一过程中，学生通过自主搜集数据、设计对照实验和严密逻辑论证，不仅提升了跨学科综合思维，更培养了独立发现问题、解决问题的创新实践本领。”\n关键词：__________、__________、__________", "ans": "真实情境（或：问题驱动）；自主探究（或：实验论证）；创新实践", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【提炼关键词】扣住材料的核心主旨词：围绕“真实问题/情境”、通过“自主/论证”、培养“创新实践本领”。"}, {"s": "板块八：上海中考真题与模拟·语言文字综合运用与传统文化", "sid": "sh-zonghe", "n": 34, "id": "sh-zonghe-522", "tag": "上海中考综合实践·漫画寓意分析", "t": "简答题", "stem": "【中考漫画探究题】一幅题为《“低头”的风景》的时事漫画中：地铁车厢里坐成一排的年轻乘客全部深深低着头紧盯手机屏幕，手指飞速滑动，而窗外壮丽的蓝天白云、江上飞鸟以及身旁老人的交谈全被视而不见。请写出这幅漫画所讽刺的社会现象及给人们的启示。", "ans": "【讽刺现象】讽刺了现代社会中人们过度沉迷智能手机等电子产品、沦为“低头族”，从而忽视了身边的现实美好生活、淡漠了人际交往与自然环境的现象。\n【启示】我们应当合理自律地使用手机等电子媒介，多抬起头去关注身边的亲人朋友，主动拥抱真实多彩的现实生活和大自然。", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【考点分析】读懂漫画画面的夸张手法，提炼讽刺核心（低头族、手机依赖），写出积极深刻的警示与启发。"}, {"s": "板块八：上海中考真题与模拟·语言文字综合运用与传统文化", "sid": "sh-zonghe", "n": 35, "id": "sh-zonghe-523", "tag": "上海中考综合实践·活动方案设计", "t": "简答题", "stem": "班级准备组织一次“走近非物质文化遗产·感受上海传统手工艺”综合实践活动，请仿照示例再设计两个具体的活动板块：\n【示例】板块一：寻访民间艺人，聆听非遗故事；\n板块二：________________________________________；\n板块三：________________________________________。", "ans": "板块二：体验传统技艺，动手制作非遗；\n板块三：举办成果展评，宣讲非遗魅力。（或：开展线上科普，建言非遗传承）", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【活动方案设计】句式保持“动宾短语+动宾短语”的工整结构，紧扣“走近非遗”、“动手体验”和“宣传传承”的活动主题。"}, {"s": "板块八：上海中考真题与模拟·语言文字综合运用与传统文化", "sid": "sh-zonghe", "n": 36, "id": "sh-zonghe-524", "tag": "上海中考文化常识·传统节日与诗词", "t": "选择题", "stem": "下列诗句所描写的中国传统节日，按一年中时间先后顺序排列正确的一项是（    ）\n①千门万户曈曈日，总把新桃换旧符。\n②清明时节雨纷纷，路上行人欲断魂。\n③遥知兄弟登高处，遍插茱萸少一人。\n④千秋佳节月正圆，千里婵娟思亲眷。\n⑤东风夜放花千树，更吹落，星如雨。", "ans": "A", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【传统节日时序考查】\n①春节（正月初一）：新桃换旧符；\n⑤元宵节（正月十五）：东风夜放花千树；\n②清明节（春分后十五日，公历4月5日前后）：清明时节雨纷纷；\n④中秋节（农历八月十五）：月正圆、千里共婵娟；\n③重阳节（农历九月初九）：登高、插茱萸。\n因此时序为：①⑤②④③。"}, {"s": "板块八：上海中考真题与模拟·语言文字综合运用与传统文化", "sid": "sh-zonghe", "n": 37, "id": "sh-zonghe-525", "tag": "上海中考文化常识·谦辞敬辞辨析", "t": "选择题", "stem": "在日常语言交际中，正确使用谦辞和敬辞是文明修养的重要体现。下列交际用语使用得体的一项是（    ）\nA. 毕业在即，这是我写的一篇习作，水平有限，特呈送给老师您，请您务必拜．读．。\nB. 听说您令．尊．大人近来身体欠安，特致电表示诚挚问候，祝愿早日康复。\nC. 欢迎李教授光临我们学校做学术报告，您的到来使我们全校师生感到蓬．荜．生．辉．。\nD. 这是我们俩初次见面，小小心意，这本家．父．亲手撰写的学术著作就赠送给您留念吧。", "ans": "B", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【谦辞敬辞辨析】\nB项：“令尊”是对对方父亲的尊称，使用得体规范。\nA项：“拜读”是谦辞，指自己怀着崇敬心情阅读别人的作品；不能要求老师“拜读”自己的习作，应改为“请您斧正/垂阅/指正”。\nC项：“蓬荜生辉”是谦辞，指贵客到来使自己简陋的房屋增添光彩，不能直接用来修饰学校全校师生。\nD项：“家父”是对自己父亲的称呼，这里使用没有问题，但不能送别人礼物时强求对方“留念”。"}, {"s": "板块八：上海中考真题与模拟·语言文字综合运用与传统文化", "sid": "sh-zonghe", "n": 38, "id": "sh-zonghe-526", "tag": "上海中考情境交际·劝说技巧", "t": "简答题", "stem": "【情境交际】同桌小明最近沉迷手机短视频，导致初三复习状态下滑，成绩明显退步。他情绪低落并对你说：“反正中考题目那么难，我底子薄，再怎么努力也考不上心仪的示范性高中了，还不如看视频放松放松。”作为挚友，请写一段 80 字左右的话劝说他，要求语言得体、态度真诚、有说服力。", "ans": "小明，我特别理解你目前的焦虑，中考确实有挑战，但乾坤未定，你我皆是黑马！短视频只能带来暂时的麻木逃避，关掉手机、哪怕每天攻克一个错题，踏实的积累才是消除焦虑最好的解药。我们一起并肩制定提分计划，不到交卷最后一刻，绝不要提前认输，我相信你一定行！", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【情境交际采分点】①称呼与共情（理解焦虑）；②指出沉迷短视频的危害；③给出切实可行的建议（并肩作战、攻克难题）；④表达鼓励与信心，语言得体动人。"}, {"s": "板块八：上海中考真题与模拟·语言文字综合运用与传统文化", "sid": "sh-zonghe", "n": 39, "id": "sh-zonghe-527", "tag": "上海中考文化常识·二十四节气与农谚", "t": "选择题", "stem": "“清明断雪，谷雨断霜。”“露从今夜白，月是故乡明。”下列关于二十四节气的表述，不正确的一项是（    ）\nA. 二十四节气起源于黄河流域，是我国古代劳动人民顺应农时、指导农业生产的智慧结晶，被誉为中国的“第五大发明”。\nB. “白露”是秋季的第三个节气，标志着天气由凉爽向寒冷过渡，夜间水汽遇冷在草木上凝结成晶莹的白露。\nC. “春分”与“秋分”这两天，太阳直射赤道，昼夜时间长短完全相等。\nD. 二十四节气中反映四季更迭的四立是：立春、立夏、立秋、立冬，每个季度只有两个节气。", "ans": "D", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【文化常识辨析】\nD项错误。每个季节有六个节气，一年四季共二十四个节气（4 × 6 = 24），绝非“每个季度只有两个节气”。"}, {"s": "板块八：上海中考真题与模拟·语言文字综合运用与传统文化", "sid": "sh-zonghe", "n": 40, "id": "sh-zonghe-528", "tag": "上海中考语言表达·撰写倡议书结语", "t": "简答题", "stem": "校学生会起草了一份《关于“践行光盘行动，杜绝校园舌尖浪费”的倡议书》，正文列举了节约粮食的具体做法。请你为这份倡议书拟写一段富有感染力、号召力的结语（不超过 50 字）。", "ans": "一粥一饭，当思来之不易；半丝半缕，恒念物力维艰。让我们携起手来，从光盘做起，争做崇德尚俭的新时代好少年！", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【倡议书结语】引用古训典故，扣住“光盘行动/节约粮食”主题，富有号召力和仪式感。"}]};

const IMGPH = "data:image/svg+xml," + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="8" height="6"><rect width="8" height="6" fill="#e2e8f0"/></svg>');
const LSKEY = "shanghai-zhongkao-recite-v1";
const POSKEY = "shanghai-zhongkao-pos-map";
const SECKEY = "shanghai-zhongkao-cursec";

let known = {};
try{ known = JSON.parse(localStorage.getItem(LSKEY) || "{}"); }catch(e){ known = {}; }

let secPos = {};
try{ secPos = JSON.parse(localStorage.getItem(POSKEY) || "{}"); }catch(e){ secPos = {}; }

let mode="recite", curSec="all", cursor=0, qOnly=false, imgOnly=false, query="";
let alwaysAns=true;
try{ alwaysAns = localStorage.getItem("8shang-recite-ans") !== "0"; }catch(e){}
let showJy=true;
try{ showJy = localStorage.getItem("8shang-recite-jx") !== "0"; }catch(e){}
document.body.classList.toggle("nojx", !showJy);
const byId = {}; DATA.questions.forEach(q=>byId[q.id]=q);

// 恢复上次学习板块与题号
let savedSec = localStorage.getItem(SECKEY);
if (savedSec && (savedSec === "all" || DATA.sections.some(s => s.sid === savedSec))) {
  curSec = savedSec;
}

let showPosRestoreBanner = false;

function filtered(){
  return DATA.questions.filter(q=>{
    if(curSec!=="all" && q.sid!==curSec) return false;
    if(qOnly && known[q.id]) return false;
    if(imgOnly && !((q.t && q.t.includes("情境")) || (q.stem && q.stem.includes("情境")) || (q.tag && q.tag.includes("情境")))) return false;
    if(query){
      const s=q.stem+"\n"+q.ans;
      if(!s.toLowerCase().includes(query)) return false;
    }
    return true;
  });
}

// 初始化光标定位
const fInit = filtered();
const targetQid = secPos[curSec] || secPos["all"];
if (targetQid) {
  const initIdx = fInit.findIndex(q => q.id === targetQid);
  if (initIdx > 0) {
    cursor = initIdx;
    showPosRestoreBanner = true;
  }
}

function save(){ try{ localStorage.setItem(LSKEY, JSON.stringify(known)); }catch(e){} }
function totalKnown(){ return DATA.questions.filter(q=>known[q.id]).length; }

// 记录当前题号与板块位置
function recordPos(){
  const f = filtered();
  if (f[cursor]) {
    const qid = f[cursor].id;
    secPos[curSec] = qid;
    secPos["all"] = qid;
    try {
      localStorage.setItem(POSKEY, JSON.stringify(secPos));
      localStorage.setItem(SECKEY, curSec);
    } catch(e){}
    const topNum = document.getElementById("top-qnum");
    if (topNum) topNum.textContent = (cursor + 1);
  }
}

// 切换板块
function switchSection(sid, targetQid){
  curSec = sid;
  const f = filtered();
  let idx = -1;
  if (targetQid) {
    idx = f.findIndex(q => q.id === targetQid);
  } else if (secPos[curSec]) {
    idx = f.findIndex(q => q.id === secPos[curSec]);
  }
  if (idx < 0) {
    const fi = f.findIndex(q => !known[q.id]);
    idx = fi >= 0 ? fi : 0;
  }
  cursor = Math.max(0, idx);
  recordPos();
  renderSidebar();
  render();
}

/* ---------------- 侧栏 ---------------- */
function renderSidebar(){
  const box=document.getElementById("sec-list");
  const tot=DATA.questions.length;
  let h=`<div class="sec ${curSec==="all"?"active":""}" data-sid="all">
    <div class="sec-row"><span class="sec-dot ${totalKnown()>=tot?"full":""}"></span>
    <span class="sec-name">全部板块</span><span class="sec-n">${tot}</span></div></div>`;
  for(const s of DATA.sections){
    const qs=DATA.questions.filter(q=>q.sid===s.sid);
    const k=qs.filter(q=>known[q.id]).length;
    h+=`<div class="sec ${curSec===s.sid?"active":""}" data-sid="${s.sid}">
      <div class="sec-row"><span class="sec-dot ${k>=qs.length&&qs.length>0?"full":""}"></span>
      <span class="sec-name">${s.s}</span><span class="sec-n">${k}/${qs.length}</span></div></div>`;
  }
  box.innerHTML=h;
  box.querySelectorAll(".sec").forEach(el=>{
    el.onclick=()=>{
      showPosRestoreBanner = false;
      switchSection(el.dataset.sid);
    };
  });
  const t=totalKnown();
  document.getElementById("foot-label").textContent=`总进度 ${t} / ${DATA.questions.length}`;
  document.getElementById("progress-fill").style.width=(t/DATA.questions.length*100)+"%";
  const jl=document.getElementById("jx-label");
  if(jl) jl.textContent=`含解析 ${DATA.jxN} / ${DATA.total} 题`;
}

/* ---------------- 工具 ---------------- */
function esc(s){return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function hl(text){
  if(text==null) return "";
  const e=esc(text).replace(/\*\*([^*]+)\*\*/g,'<b class="k">$1</b>');
  if(!query) return e;
  return e.replace(new RegExp("("+query.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","gi"),"<mark>$1</mark>");
}
/* 选择题：高亮正确选项 */
function optHl(stem, ans){
  if(!/^[A-D]{1,4}$/.test(ans.trim())) return null;
  const lines=stem.split("\n");
  const idx=lines.map((L,i)=>{
    const m=L.match(/^\s*[·•]?\s*([A-D])[.、．]/);
    return m && ans.includes(m[1]) ? i : -1;
  }).filter(i=>i>=0);
  if(!idx.length) return null;
  return lines.map((L,i)=>{
    let e=esc(L);
    if(idx.includes(i)) e="<mark>"+e+"</mark>";
    return e;
  }).join("\n");
}
function stemHtml(q, hlMode){
  let body;
  if(hlMode){ body=optHl(q.stem,q.ans)||hl(q.stem); }
  else{
    body=esc(q.stem)
      .replace(/_{2,}/g,'<span class="blank">＿＿＿＿</span>')
      .replace(/\n/g,"\n");
  }
  return body;
}
function ansText(q){
  if(q.ph && !q.ans || (q.ans.startsWith("请对照")||q.ans.startsWith("请查看"))) return null;
  return q.ans;
}

/* ---------------- 背诵模式 ---------------- */
function renderRecite(){
  const f=filtered(), view=document.getElementById("view");
  if(!f.length){ view.innerHTML='<div class="empty">没有符合条件的题目</div>'; return; }
  if(cursor>=f.length) cursor=f.length-1; if(cursor<0) cursor=0;
  recordPos();
  const q=f[cursor], at=ansText(q);
  const knownOn=!!known[q.id];
  const bar=`<div id="cardbar"><div id="cardbar-f" style="width:${f.length?((cursor+1)/f.length*100):0}%"></div></div>`;
  let answerHtml;
  if(at){
    answerHtml=`<div class="atext">${hl(at).replace(/ ｜ /g,'<br>')}</div>`;
    if(q.aimg) answerHtml+=`<img loading="lazy" src="${q.aimg}" alt="参考答案图">`;
  }else if(q.aimg){
    answerHtml=`<div class="atext">对照下方参考答案原图自评</div><img loading="lazy" src="${q.aimg}" alt="参考答案图">`;
  }else{
    answerHtml=`<div class="atext">⚠️ 原仓库未提供本题答案（原书答案页可查：板块内“原资料页”）</div>`;
  }

  let posBannerHtml = "";
  if (showPosRestoreBanner && cursor > 0) {
    posBannerHtml = `<div class="pos-banner" id="pos-banner">
      <span>📖 已自动恢复上次学习进度：<b>${q.s} · 第 ${q.n} 题</b>（第 ${cursor+1} / ${f.length} 题）</span>
      <div style="display:flex;align-items:center;gap:6px">
        <button class="pos-banner-btn" onclick="cursor=0;recordPos();showPosRestoreBanner=false;renderRecite();">从第1题重新开始</button>
        <button class="pos-banner-close" onclick="showPosRestoreBanner=false;document.getElementById('pos-banner')?.remove()" title="关闭提示">×</button>
      </div>
    </div>`;
  }

  view.innerHTML=`<div id="card-wrap">${posBannerHtml}${bar}
    <div class="card">
      <div class="meta">
        <span class="chip">${q.s}</span>
        <span class="chip gray">第 ${q.n} 题</span>
        <span class="chip gray">${q.t}</span>
        ${q.tag?`<span class="chip gray">${q.tag}</span>`:""}
        ${q.ph?`<span class="chip" style="background:var(--amber-bg);color:var(--amber)">需看原题图</span>`:""}
        ${q.jx?`<span class="chip" style="background:var(--blue-bg);color:var(--blue)">有解析</span>`:""}
      </div>
      ${q.ph?`<div class="imgbox show"><img loading="lazy" src="${q.img}" alt="原题图"></div>`
            :`<div class="stem">${stemHtml(q,true)}</div>
              ${q.img?`<button class="fchip" style="margin-top:.8rem" onclick="this.nextElementSibling.classList.toggle('show');this.textContent=this.textContent.includes('题')?'收起题图':'看题图'">看题图</button><div class="imgbox"><img loading="lazy" src="${q.img}"></div>`:""}`}
      ${q.ph&&q.src?`<button class="fchip" style="margin-top:.5rem" onclick="this.nextElementSibling.classList.toggle('show')">看原资料页</button><div class="imgbox"><img loading="lazy" src="${q.src}"></div>`:""}
      ${alwaysAns?"":'<button id="reveal-btn">显示答案（空格）</button>'}
      <div class="answer${alwaysAns?" show":""}" id="ansbox"><div class="alabel">答案</div>${answerHtml}
        ${q.jx?`<div class="jx"><div class="jxlabel">解析 · 为什么是这个答案</div><div class="jxtext">${hl(q.jx)}</div></div>`:""}
      </div>
      <div class="ops">
        <button class="know ${knownOn?"on":""}" id="know-btn">${knownOn?"✓ 已背熟（点击取消）":"标记为已背熟"}</button>
      </div>
    </div>
    <div class="navrow">
      <button id="prev-btn" title="上一题 (←)">← 上一题</button>
      <button id="open-picker-btn" class="picker-pill" title="点击打开选题答题卡，快速跳题 (快捷键 G)">
        <span>第 <b>${cursor+1}</b> / ${f.length} 题</span>
        <span class="picker-pill-sub">📋 选题 ▾</span>
      </button>
      <button id="next-btn" title="下一题 (→ 或 空格)">下一题 →</button>
    </div>
    <div class="hint"><kbd>空格</kbd> 答案/下题 · <kbd>G</kbd> 选题卡 · <kbd>M</kbd> 熟记 · <kbd>←</kbd><kbd>→</kbd> 翻题 · <kbd>Shift+←/→</kbd> 快翻10题 · <kbd>/</kbd> 搜索</div>
  </div>`;
  const rb=document.getElementById("reveal-btn");
  if(rb) rb.onclick=()=>{
    document.getElementById("ansbox").classList.add("show");
    rb.style.display="none";
  };
  document.getElementById("know-btn").onclick=()=>{
    if(known[q.id]) delete known[q.id]; else known[q.id]=1;
    save(); renderSidebar(); renderRecite();
  };
  document.getElementById("prev-btn").onclick=()=>{cursor--;showPosRestoreBanner=false;recordPos();renderRecite()};
  document.getElementById("next-btn").onclick=()=>{cursor++;showPosRestoreBanner=false;recordPos();renderRecite()};
  document.getElementById("open-picker-btn").onclick=openPickerModal;
  document.getElementById("view").scrollTop=0;
}

/* ---------------- 速览模式 ---------------- */
function renderBrowse(){
  const f=filtered(), view=document.getElementById("view");
  if(!f.length){ view.innerHTML='<div class="empty">没有符合条件的题目</div>'; return; }
  let h='<div id="list">';
  f.forEach(q=>{
    const at=ansText(q);
    const body=optHl(q.stem,q.ans)||hl(q.stem).replace(/_{2,}/g,'<span class="blank">＿＿＿＿</span>');
    let ans="";
    if(at) ans=`<div class="li-ans">${hl(at).replace(/ ｜ /g,'<br>')}</div>`;
    else if(q.aimg) ans=`<div class="li-ans">对照参考答案原图自评 ↓<img class="qimg" loading="lazy" src="${q.aimg}"></div>`;
    else ans=`<div class="li-ans" style="background:var(--amber-bg);color:var(--amber)">原仓库未提供本题答案</div>`;
    h+=`<div class="li" data-id="${q.id}">
      <div class="li-head">
        <span class="li-n">#${q.n}</span>
        <span class="li-sect">${q.s}${q.tag?" · "+q.tag:""}</span>
        ${known[q.id]?'<span class="li-know">已背熟 ✓</span>':""}
      </div>
      ${q.ph?`<img class="qimg" loading="lazy" src="${q.img}">`:`<div class="li-stem">${body}</div>`}
      ${ans}
      ${q.jx?`<div class="li-jx"><div style="font-size:0.75rem;font-weight:700;color:var(--blue);margin-bottom:2px">解析 · 为什么是这个答案</div>${hl(q.jx)}</div>`:""}
    </div>`;
  });
  h+='</div>';
  view.innerHTML=h;
  view.scrollTop=0;
  view.querySelectorAll(".li").forEach(el=>{
    el.onclick=()=>{
      const id=el.dataset.id, f2=filtered();
      const i=f2.findIndex(q=>q.id===id);
      if(i>=0){ mode="recite"; cursor=i; recordPos(); setMode(); }
    };
  });
}

function render(){ mode==="recite"?renderRecite():renderBrowse(); renderSidebar(); }
function setMode(){
  document.getElementById("m-recite").classList.toggle("on",mode==="recite");
  document.getElementById("m-browse").classList.toggle("on",mode==="browse");
  render();
}

/* ---------------- 选题面板 (Picker Modal) ---------------- */
let pickerTab = "all";

function openPickerModal(){
  const modal = document.getElementById("picker-modal");
  if (!modal) return;
  modal.classList.add("show");
  populatePickerSecSelect();
  renderPickerGrid();
  setTimeout(()=>{
    const inp = document.getElementById("jump-val");
    if(inp){ inp.value = cursor + 1; inp.select(); }
  }, 100);
}

function closePickerModal(){
  const modal = document.getElementById("picker-modal");
  if (modal) modal.classList.remove("show");
}

function populatePickerSecSelect(){
  const sel = document.getElementById("picker-sec-select");
  if (!sel) return;
  let opt = `<option value="all" ${curSec==="all"?"selected":""}>全部板块 (${DATA.questions.length}题)</option>`;
  for (const s of DATA.sections) {
    opt += `<option value="${s.sid}" ${curSec===s.sid?"selected":""}>${s.s} (${s.n}题)</option>`;
  }
  sel.innerHTML = opt;
  sel.onchange = (e) => {
    switchSection(e.target.value);
    populatePickerSecSelect();
    renderPickerGrid();
  };
}

function renderPickerGrid(){
  const f = filtered();
  const curQ = f[cursor];
  const grid = document.getElementById("picker-grid");
  const sub = document.getElementById("picker-subtitle");
  
  const secName = curSec === "all" ? "全部板块" : (DATA.sections.find(s=>s.sid===curSec)?.s || "当前板块");
  const knownCount = f.filter(q=>known[q.id]).length;
  if (sub) {
    sub.textContent = `${secName} · 共 ${f.length} 题 · 已背熟 ${knownCount} / ${f.length}`;
  }

  const allCount = f.length;
  const todoCount = allCount - knownCount;
  const cntAll = document.getElementById("cnt-all"); if(cntAll) cntAll.textContent = `(${allCount})`;
  const cntTodo = document.getElementById("cnt-todo"); if(cntTodo) cntTodo.textContent = `(${todoCount})`;
  const cntDone = document.getElementById("cnt-done"); if(cntDone) cntDone.textContent = `(${knownCount})`;

  let displayList = [];
  f.forEach((q, idx) => {
    const isDone = !!known[q.id];
    if (pickerTab === "todo" && isDone) return;
    if (pickerTab === "done" && !isDone) return;
    displayList.push({ q, idx, isDone, isCur: (curQ && curQ.id === q.id) });
  });

  if (!displayList.length) {
    grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:2.5rem 1rem;color:var(--mut);font-size:0.85rem">该筛选分类下暂无题目</div>';
    return;
  }

  let h = "";
  displayList.forEach(item => {
    const { q, idx, isDone, isCur } = item;
    const numDisplay = curSec === "all" ? (idx + 1) : q.n;
    const subText = curSec === "all" ? q.s.substring(0, 2) : "";
    let cls = "q-btn";
    if (isDone) cls += " known";
    if (isCur) cls += " current";
    
    h += `<button class="${cls}" data-idx="${idx}" title="${q.s} 第${q.n}题 (${idx+1}/${f.length}) ${isDone?'[已背熟]':''}">
      <span>${numDisplay}</span>
      ${subText ? `<span class="q-btn-sub">${subText}</span>` : ""}
      ${isDone ? `<span class="q-btn-dot"></span>` : ""}
    </button>`;
  });
  grid.innerHTML = h;

  grid.querySelectorAll(".q-btn").forEach(btn => {
    btn.onclick = () => {
      const idx = parseInt(btn.dataset.idx, 10);
      if (!isNaN(idx) && idx >= 0 && idx < f.length) {
        showPosRestoreBanner = false;
        cursor = idx;
        recordPos();
        closePickerModal();
        if (mode !== "recite") {
          mode = "recite";
          setMode();
        } else {
          renderRecite();
        }
      }
    };
  });
}

function doJump(){
  const f = filtered();
  const inp = document.getElementById("jump-val");
  if (!inp) return;
  const val = parseInt(inp.value.trim(), 10);
  if (isNaN(val) || val < 1 || val > f.length) {
    alert(`请输入 1 到 ${f.length} 之间的有效题号`);
    return;
  }
  showPosRestoreBanner = false;
  cursor = val - 1;
  recordPos();
  closePickerModal();
  if (mode !== "recite") {
    mode = "recite";
    setMode();
  } else {
    renderRecite();
  }
}

function jumpFirstUnmastered(){
  const f = filtered();
  const fi = f.findIndex(q => !known[q.id]);
  if (fi < 0) {
    alert("🎉 恭喜！当前筛选范围内所有题目均已背熟！");
    return;
  }
  showPosRestoreBanner = false;
  cursor = fi;
  recordPos();
  closePickerModal();
  if (mode !== "recite") {
    mode = "recite";
    setMode();
  } else {
    renderRecite();
  }
}

function jumpFirst(){
  showPosRestoreBanner = false;
  cursor = 0;
  recordPos();
  closePickerModal();
  if (mode !== "recite") { mode = "recite"; setMode(); } else { renderRecite(); }
}

function jumpLast(){
  const f = filtered();
  showPosRestoreBanner = false;
  cursor = Math.max(0, f.length - 1);
  recordPos();
  closePickerModal();
  if (mode !== "recite") { mode = "recite"; setMode(); } else { renderRecite(); }
}

/* ---------------- 事件绑定 ---------------- */
document.getElementById("m-recite").onclick=()=>{mode="recite";setMode()};
document.getElementById("m-browse").onclick=()=>{mode="browse";setMode()};
document.getElementById("burger").onclick=()=>document.body.classList.toggle("collapsed");
document.getElementById("search").oninput=e=>{query=e.target.value.trim().toLowerCase();cursor=0;render()};
document.getElementById("f-todo").onclick=e=>{qOnly=!qOnly;e.target.classList.toggle("on",qOnly);cursor=0;render()};
document.getElementById("f-img").onclick=e=>{imgOnly=!imgOnly;e.target.classList.toggle("on",imgOnly);cursor=0;render()};

const topPicker = document.getElementById("top-picker-btn");
if (topPicker) topPicker.onclick = openPickerModal;

document.getElementById("picker-close-btn").onclick = closePickerModal;
document.getElementById("jump-submit-btn").onclick = doJump;
document.getElementById("jump-first-unmastered").onclick = jumpFirstUnmastered;
document.getElementById("jump-first-btn").onclick = jumpFirst;
document.getElementById("jump-last-btn").onclick = jumpLast;
document.getElementById("jump-val").onkeydown = (e) => { if(e.key === "Enter") doJump(); };

// 选题面板分类 Tab
document.querySelectorAll(".ptab").forEach(tab => {
  tab.onclick = () => {
    document.querySelectorAll(".ptab").forEach(t => t.classList.remove("active"));
    tab.classList.add("active");
    pickerTab = tab.dataset.tab;
    renderPickerGrid();
  };
});

function syncAnsBtn(){
  const b=document.getElementById("f-ans");
  b.classList.toggle("ans-on",alwaysAns);
  b.classList.toggle("on",!alwaysAns);
  b.textContent=alwaysAns?"答案默认展开":"答案手动展开";
}
document.getElementById("f-ans").onclick=()=>{
  alwaysAns=!alwaysAns;
  try{ localStorage.setItem("8shang-recite-ans",alwaysAns?"1":"0"); }catch(e){}
  syncAnsBtn(); renderRecite();
};
function syncJyBtn(){
  const b=document.getElementById("f-jx");
  b.classList.toggle("jx-on",showJy);
  b.classList.toggle("on",!showJy);
  b.textContent=showJy?"显示解析":"隐藏解析";
}
document.getElementById("f-jx").onclick=()=>{
  showJy=!showJy;
  try{ localStorage.setItem("8shang-recite-jx",showJy?"1":"0"); }catch(e){}
  document.body.classList.toggle("nojx",!showJy);
  syncJyBtn();
};

/* 题图 / 答案图 点击看大图 */
document.getElementById("view").addEventListener("click",e=>{
  const t=e.target;
  if(t&&t.tagName==="IMG"&&t.closest(".imgbox")&&t.src){
    e.stopPropagation(); e.preventDefault(); window.open(t.src,"_blank");
  }
},true);

document.addEventListener("keydown",e=>{
  const tag=(e.target.tagName||"").toLowerCase();
  if(tag==="input"||tag==="textarea"||tag==="select"){
    if(e.key==="Escape") {
      e.target.blur();
      closePickerModal();
    }
    return;
  }
  if(e.key==="Escape"){ closePickerModal(); return; }
  if(e.key==="/"){ e.preventDefault(); document.getElementById("search").focus(); return; }
  if(e.key==="g"||e.key==="G"){ e.preventDefault(); openPickerModal(); return; }
  if(mode!=="recite") return;
  const f=filtered(); if(!f.length) return;
  const ansShown=document.getElementById("ansbox")?.classList.contains("show");
  
  if(e.shiftKey && e.key==="ArrowRight" || e.key==="PageDown"){
    e.preventDefault();
    cursor=Math.min(cursor+10, f.length-1);
    recordPos();
    renderRecite();
    return;
  }
  if(e.shiftKey && e.key==="ArrowLeft" || e.key==="PageUp"){
    e.preventDefault();
    cursor=Math.max(cursor-10, 0);
    recordPos();
    renderRecite();
    return;
  }
  if(e.code==="Space"){
    e.preventDefault();
    if(!ansShown){ document.getElementById("ansbox")?.classList.add("show"); const b=document.getElementById("reveal-btn"); if(b)b.style.display="none"; }
    else{ cursor=(cursor+1)%f.length; recordPos(); renderRecite(); }
  }else if(e.key==="ArrowRight"){
    cursor=Math.min(cursor+1,f.length-1); recordPos(); renderRecite();
  }else if(e.key==="ArrowLeft"){
    cursor=Math.max(cursor-1,0); recordPos(); renderRecite();
  }else if(e.key==="m"||e.key==="M"){
    const q=f[cursor]; if(known[q.id]) delete known[q.id]; else known[q.id]=1;
    save(); renderRecite();
  }
});

if (location.hash === "#browse" || new URLSearchParams(location.search).get("mode") === "browse") {
  mode = "browse";
  document.getElementById("m-recite")?.classList.remove("on");
  document.getElementById("m-browse")?.classList.add("on");
}
syncAnsBtn(); syncJyBtn(); renderSidebar(); render();
</script>
</body>
