。”", "ans": "野旷天低树，江清月近人", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】唐代孟浩然《宿建德江》。\n【考点分析】远望“天低树”见天地空旷与羁旅孤寂；近看“月近人”得清幽慰藉。\n【易错字提示】「旷」日字旁；「低」右边为氐，非氏。"}, {"s": "板块三：上海考纲必背 86 篇全册·理解性情境默写全通关", "sid": "sh-syllabus", "n": 2, "id": "sh-syllabus-160", "tag": "考纲必背·六年级上·《六月二十七日望湖楼醉书》", "t": "情境默写", "stem": "苏轼在《六月二十七日望湖楼醉书》中生动描绘疾风骤雨忽来忽散、雨过天晴湖水如镜的诗句是：“______________________，______________________。”", "ans": "卷地风来忽吹散，望湖楼下水如天", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】北宋苏轼《六月二十七日望湖楼醉书》。\n【易错字提示】「卷」注意上部写法；「吹散」散字右边为反文旁。"}, {"s": "板块三：上海考纲必背 86 篇全册·理解性情境默写全通关", "sid": "sh-syllabus", "n": 3, "id": "sh-syllabus-161", "tag": "考纲必背·六年级上·《西江月·夜行黄沙道中》", "t": "情境默写", "stem": "辛弃疾在《西江月·夜行黄沙道中》中借骤雨将至、山前疏星微雨的空灵幽趣的名句是：“______________________，______________________。”", "ans": "七八个星天外，两三点雨山前", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】南宋辛弃疾《西江月》。\n【考点分析】数字连用（七八个、两三点），写出夏夜骤雨将至、天朗气清的乡村山行之趣。"}, {"s": "板块三：上海考纲必背 86 篇全册·理解性情境默写全通关", "sid": "sh-syllabus", "n": 4, "id": "sh-syllabus-162", "tag": "考纲必背·六年级上·《浪淘沙（其一）》", "t": "情境默写", "stem": "刘禹锡在《浪淘沙（其一）》中展开浪漫奇瑰想象，溯黄河而上直至天河拜访织女的诗句是：“______________________，______________________。”", "ans": "如今直上银河去，同到牵牛织女家", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】唐代刘禹锡《浪淘沙（其一）》。\n【考点分析】借张骞溯河至天河遇牵牛织女之典故，展现诗人豪放宏阔的精神境界。"}, {"s": "板块三：上海考纲必背 86 篇全册·理解性情境默写全通关", "sid": "sh-syllabus", "n": 5, "id": "sh-syllabus-163", "tag": "考纲必背·六年级上·《江南春》", "t": "情境默写", "stem": "杜牧在《江南春》中既展现江南明媚春景，又寄托对南朝历史兴亡沉思慨叹的名句是：“______________________，______________________。”", "ans": "南朝四百八十寺，多少楼台烟雨中", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】唐代杜牧《江南春》。\n【易错字提示】「楼台」木字旁；「烟雨」火字旁。"}, {"s": "板块三：上海考纲必背 86 篇全册·理解性情境默写全通关", "sid": "sh-syllabus", "n": 6, "id": "sh-syllabus-164", "tag": "考纲必背·六年级上·《书湖阴先生壁》", "t": "情境默写", "stem": "王安石在《书湖阴先生壁》中运用拟人手法，赋予山水生机与待客之情的千古名联是：“______________________，______________________。”", "ans": "一水护田将绿绕，两山排闼送青来", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】北宋王安石《书湖阴先生壁》。\n【词义理解】排闼（tà）：推开小门。赋予绿水青山以护田送青之脉脉深情。"}, {"s": "板块三：上海考纲必背 86 篇全册·理解性情境默写全通关", "sid": "sh-syllabus", "n": 7, "id": "sh-syllabus-165", "tag": "考纲必背·六年级上·《七律·长征》", "t": "情境默写", "stem": "毛泽东在《七律·长征》中概括全诗核心、表现红军战士不畏艰难险阻的革命英雄主义豪情的总起句是：“______________________，______________________。”", "ans": "红军不怕远征难，万水千山只等闲", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】毛泽东《七律·长征》。\n【词义采分】等闲：平常、视若平常。"}, {"s": "板块三：上海考纲必背 86 篇全册·理解性情境默写全通关", "sid": "sh-syllabus", "n": 8, "id": "sh-syllabus-166", "tag": "考纲必背·六年级上·《伯牙鼓琴》", "t": "情境默写", "stem": "《伯牙鼓琴》中写锺子期能从伯牙琴音中听出巍峨高山雄伟气势的赞叹是：“______________________，______________________。”", "ans": "善哉乎鼓琴，巍巍乎若太山", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】《吕氏春秋·本味》。\n【易错字提示】「巍巍」山字头；「太山」通“泰山”。"}, {"s": "板块三：上海考纲必背 86 篇全册·理解性情境默写全通关", "sid": "sh-syllabus", "n": 9, "id": "sh-syllabus-167", "tag": "考纲必背·六年级下·《迢迢牵牛星》", "t": "情境默写", "stem": "《迢迢牵牛星》中形象细腻描绘织女织布动作与泪落如雨的悲伤情态的句子是：“______________________，______________________。”", "ans": "纤纤擢素手，札札弄机杼", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】《古诗十九首·迢迢牵牛星》。\n【易错字提示】「擢」提手旁；「机杼」木字旁加予。"}, {"s": "板块三：上海考纲必背 86 篇全册·理解性情境默写全通关", "sid": "sh-syllabus", "n": 10, "id": "sh-syllabus-168", "tag": "考纲必背·六年级下·《竹石》", "t": "情境默写", "stem": "郑燮在《竹石》中托竹言志，展现坚韧不拔、历经千难万险而巍然挺立的铮铮傲骨的名句是：“______________________，______________________。”", "ans": "千磨万击还坚劲，任尔东西南北风", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】清代郑燮《竹石》。\n【词义理解】坚劲：坚韧有力；任：任凭。"}, {"s": "板块三：上海考纲必背 86 篇全册·理解性情境默写全通关", "sid": "sh-syllabus", "n": 11, "id": "sh-syllabus-169", "tag": "考纲必背·六年级下·《回乡偶书（其一）》", "t": "情境默写", "stem": "贺知章在《回乡偶书（其一）》中写出岁月流逝、容颜衰老却乡音难改的深沉沧桑感的诗句是：“______________________，______________________。”", "ans": "少小离家老大回，乡音无改鬓毛衰", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】唐代贺知章《回乡偶书（其一）》。\n【易错字提示】「鬓」髟字头；「衰」读 cuī，疏落凋零之意。"}, {"s": "板块三：上海考纲必背 86 篇全册·理解性情境默写全通关", "sid": "sh-syllabus", "n": 12, "id": "sh-syllabus-170", "tag": "考纲必背·六年级下·《两小儿辩日》", "t": "情境默写", "stem": "《两小儿辩日》中孔子面对两小儿的辩论无法裁决，两小儿笑着说的一句话体现了朴素求真态度的句子是：“______________________？”", "ans": "孰为汝多知乎", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】《列子·汤问》。\n【通假字】知：通“智”，聪明、智慧。孰：谁；汝：你。"}, {"s": "板块三：上海考纲必背 86 篇全册·理解性情境默写全通关", "sid": "sh-syllabus", "n": 13, "id": "sh-syllabus-171", "tag": "考纲必背·七年级上·《观沧海》", "t": "情境默写", "stem": "曹操在《观沧海》中通过写秋风与海浪，表现大海宏阔雄健动感态势的诗句是：“______________________，______________________。”", "ans": "秋风萧瑟，洪波涌起", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】东汉曹操《观沧海》。\n【考点分析】萧瑟：形容秋风吹拂树木声；洪波：巨大的波涛。"}, {"s": "板块三：上海考纲必背 86 篇全册·理解性情境默写全通关", "sid": "sh-syllabus", "n": 14, "id": "sh-syllabus-172", "tag": "考纲必背·七年级上·《次北固山下》", "t": "情境默写", "stem": "王湾在《次北固山下》中借大雁南飞、托寄故园相思乡愁的诗句是：“______________________？______________________。”", "ans": "乡书何处达，归雁洛阳边", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】唐代王湾《次北固山下》。\n【修辞与意象】归雁：古代鸿雁传书意象，写游子对故都洛阳的羁旅思念。"}, {"s": "板块三：上海考纲必背 86 篇全册·理解性情境默写全通关", "sid": "sh-syllabus", "n": 15, "id": "sh-syllabus-173", "tag": "考纲必背·七年级上·《天净沙·秋思》", "t": "情境默写", "stem": "马致远在《天净沙·秋思》中将萧瑟冷清的苍茫秋景与游子漂泊行程相交织的句子是：“______________________。”", "ans": "古道西风瘦马", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】元代马致远《天净沙·秋思》。"}, {"s": "板块三：上海考纲必背 86 篇全册·理解性情境默写全通关", "sid": "sh-syllabus", "n": 16, "id": "sh-syllabus-174", "tag": "考纲必背·七年级上·《〈论语〉十二章》", "t": "情境默写", "stem": "《〈论语〉十二章》中强调学思结合、不可偏废的重要辩证治学名句是：“______________________，______________________。”", "ans": "学而不思则罔，思而不学则殆", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】《论语·为政》。\n【词义采分】罔（wǎng）：迷惑无所得；殆（dài）：疑惑疲惫。"}, {"s": "板块三：上海考纲必背 86 篇全册·理解性情境默写全通关", "sid": "sh-syllabus", "n": 17, "id": "sh-syllabus-175", "tag": "考纲必背·七年级上·《〈论语〉十二章》", "t": "情境默写", "stem": "《〈论语〉十二章》中告诫我们要善于向不同人学习，吸取优点、克服自身缺点的修身名句是：“______________________，______________________。”", "ans": "择其善者而从之，其不善者而改之", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】《论语·述而》。“三人行，必有我师焉”。"}, {"s": "板块三：上海考纲必背 86 篇全册·理解性情境默写全通关", "sid": "sh-syllabus", "n": 18, "id": "sh-syllabus-176", "tag": "考纲必背·七年级上·《峨眉山月歌》", "t": "情境默写", "stem": "李白在《峨眉山月歌》中连用五个地名，展现舟行江上、思念友人却难相逢的深情名句是：“______________________，______________________。”", "ans": "夜发清溪向三峡，思君不见下渝州", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】唐代李白《峨眉山月歌》。峨眉山、平羌江、清溪、三峡、渝州五地名连缀。"}, {"s": "板块三：上海考纲必背 86 篇全册·理解性情境默写全通关", "sid": "sh-syllabus", "n": 19, "id": "sh-syllabus-177", "tag": "考纲必背·七年级上·《江南逢李龟年》", "t": "情境默写", "stem": "杜甫在《江南逢李龟年》中抚今追昔，将盛唐繁华幻灭与个人迟暮沧桑融为一体的千古绝唱是：“______________________，______________________。”", "ans": "正是江南好风景，落花时节又逢君", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】唐代杜甫《江南逢李龟年》。落花时节：既写暮春自然景色，亦象征盛唐盛世不再与二人飘零身世。"}, {"s": "板块三：上海考纲必背 86 篇全册·理解性情境默写全通关", "sid": "sh-syllabus", "n": 20, "id": "sh-syllabus-178", "tag": "考纲必背·七年级上·《秋词（其一）》", "t": "情境默写", "stem": "刘禹锡在《秋词（其一）》中反常人之悲秋情绪，以鹤冲青天展现豪迈乐观诗情与昂扬斗志的名句是：“______________________，______________________。”", "ans": "晴空一鹤排云上，便引诗情到碧霄", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】唐代刘禹锡《秋词（其一）》。\n【词义采分】排云：推开白云；碧霄：青天。"}, {"s": "板块三：上海考纲必背 86 篇全册·理解性情境默写全通关", "sid": "sh-syllabus", "n": 21, "id": "sh-syllabus-179", "tag": "考纲必背·七年级上·《诫子书》", "t": "情境默写", "stem": "诸葛亮在《诫子书》中阐释修身养德、淡泊明志的人生根本原则的千古警句是：“______________________，______________________。”", "ans": "非淡泊无以明志，非宁静无以致远", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】三国诸葛亮《诫子书》。\n【易错字提示】「淡泊」三点水；「致远」达到远大目标。"}, {"s": "板块三：上海考纲必背 86 篇全册·理解性情境默写全通关", "sid": "sh-syllabus", "n": 22, "id": "sh-syllabus-180", "tag": "考纲必背·七年级上·《狼》", "t": "情境默写", "stem": "蒲松龄在《狼》中结尾发表议论，点明狼再狡黠也终究难逃毁灭结局、嘲讽恶势力愚蠢可笑的句子是：“______________________，______________________？”", "ans": "禽兽之变诈几何哉，止增笑耳", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】清代蒲松龄《聊斋志异·狼》。\n【字词采分】几何：多少；止：通“只”，仅仅。"}, {"s": "板块三：上海考纲必背 86 篇全册·理解性情境默写全通关", "sid": "sh-syllabus", "n": 23, "id": "sh-syllabus-181", "tag": "考纲必背·七年级下·《竹里馆》", "t": "情境默写", "stem": "王维在《竹里馆》中写隐居深林、独自抚琴长啸，惟有明月相伴相随的清幽诗句是：“______________________，______________________。”", "ans": "深林人不知，明月来相照", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】唐代王维《竹里馆》。独坐幽篁里，弹琴复长啸。"}, {"s": "板块三：上海考纲必背 86 篇全册·理解性情境默写全通关", "sid": "sh-syllabus", "n": 24, "id": "sh-syllabus-182", "tag": "考纲必背·七年级下·《春夜洛城闻笛》", "t": "情境默写", "stem": "李白在《春夜洛城闻笛》中因听到《折杨柳》曲调而勾起满城游子无尽故园相思的名句是：“______________________，______________________。”", "ans": "此夜曲中闻折柳，何人不起故园情", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】唐代李白《春夜洛城闻笛》。折柳：汉唐乐曲《折杨柳》，多叙离别怀乡。"}, {"s": "板块三：上海考纲必背 86 篇全册·理解性情境默写全通关", "sid": "sh-syllabus", "n": 25, "id": "sh-syllabus-183", "tag": "考纲必背·七年级下·《逢入京使》", "t": "情境默写", "stem": "岑参在《逢入京使》中西出阳关偶遇返京使者，借口信向家人报平安、强抑泪水豪迈宽慰的名句是：“______________________，______________________。”", "ans": "马上相逢无纸笔，凭君传语报平安", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】唐代岑参《逢入京使》。凭：托付。"}, {"s": "板块三：上海考纲必背 86 篇全册·理解性情境默写全通关", "sid": "sh-syllabus", "n": 26, "id": "sh-syllabus-184", "tag": "考纲必背·七年级下·《晚春》", "t": "情境默写", "stem": "韩愈在《晚春》中生动描摹杨花榆荚虽无艳丽姿容，却也化作漫天白雪竞相争春的拟人名句是：“______________________，______________________。”", "ans": "杨花榆荚无才思，惟解漫天作雪飞", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】唐代韩愈《晚春》。\n【易错字提示】「榆荚」草字头加夹；「惟解」只知道。"}, {"s": "板块三：上海考纲必背 86 篇全册·理解性情境默写全通关", "sid": "sh-syllabus", "n": 27, "id": "sh-syllabus-185", "tag": "考纲必背·七年级下·《登幽州台歌》", "t": "情境默写", "stem": "陈子昂在《登幽州台歌》中感慨生不逢时、圣贤不见的开篇两句是：“______________________，______________________。”", "ans": "前不见古人，后不见来者", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】唐代陈子昂《登幽州台歌》。"}, {"s": "板块三：上海考纲必背 86 篇全册·理解性情境默写全通关", "sid": "sh-syllabus", "n": 28, "id": "sh-syllabus-186", "tag": "考纲必背·七年级下·《登飞来峰》", "t": "情境默写", "stem": "王安石在《登飞来峰》中展现胸襟开阔、立足高远无所畏惧的政治家自信诗句是：“______________________，______________________。”", "ans": "不畏浮云遮望眼，自缘身在最高层", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】北宋王安石《登飞来峰》。"}, {"s": "板块三：上海考纲必背 86 篇全册·理解性情境默写全通关", "sid": "sh-syllabus", "n": 29, "id": "sh-syllabus-187", "tag": "考纲必背·七年级下·《泊秦淮》", "t": "情境默写", "stem": "杜牧在《泊秦淮》中借歌女唱亡国之曲，辛辣讽刺晚唐统治者沉湎享乐、不顾国家前途命运的名句是：“______________________，______________________。”", "ans": "商女不知亡国恨，隔江犹唱后庭花", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】唐代杜牧《泊秦淮》。后庭花：《玉树后庭花》，南朝陈后主所作亡国之音。"}, {"s": "板块三：上海考纲必背 86 篇全册·理解性情境默写全通关", "sid": "sh-syllabus", "n": 30, "id": "sh-syllabus-188", "tag": "考纲必背·七年级下·《贾生》", "t": "情境默写", "stem": "李商隐在《贾生》中托古讽今，揭露汉文帝看似虚怀纳谏，实则不问国计民生、偏问鬼神迷信的千古讽刺名句是：“______________________，______________________。”", "ans": "可怜夜半虚前席，不问苍生问鬼神", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】唐代李商隐《贾生》。\n【词义采分】虚前席：汉文帝听得入神不自觉移席向前；苍生：百姓人民。"}, {"s": "板块三：上海考纲必背 86 篇全册·理解性情境默写全通关", "sid": "sh-syllabus", "n": 31, "id": "sh-syllabus-189", "tag": "考纲必背·七年级下·《过松源晨炊漆公店》", "t": "情境默写", "stem": "杨万里在《过松源晨炊漆公店》中以翻山比喻人生历程，揭示克服一个困难后又面临新困难、不可盲目乐观哲理的名句是：“______________________，______________________。”", "ans": "政入万山围子里，一山放出一山拦", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】南宋杨万里《过松源晨炊漆公店（其五）》。政：通“正”。"}, {"s": "板块三：上海考纲必背 86 篇全册·理解性情境默写全通关", "sid": "sh-syllabus", "n": 32, "id": "sh-syllabus-190", "tag": "考纲必背·七年级下·《约客》", "t": "情境默写", "stem": "赵师秀在《约客》中通过雨夜落子、灯花散落的细节动作，细腻展现久候友人不至的失落与闲适交织心境的诗句是：“______________________，______________________。”", "ans": "有约不来过夜半，闲敲棋子落灯花", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】南宋赵师秀《约客》。敲棋子、落灯花，以动衬静。"}, {"s": "板块三：上海考纲必背 86 篇全册·理解性情境默写全通关", "sid": "sh-syllabus", "n": 33, "id": "sh-syllabus-191", "tag": "考纲必背·七年级下·《孙权劝学》", "t": "情境默写", "stem": "《孙权劝学》中鲁肃与吕蒙结友后，称赞吕蒙才略大有长进、不再是当年吴下阿蒙的惊叹语句是：“______________________！”", "ans": "卿今者才略，非复吴下阿蒙", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】《资治通鉴·孙权劝学》。\n【成语溯源】“吴下阿蒙”、“刮目相待”。"}, {"s": "板块三：上海考纲必背 86 篇全册·理解性情境默写全通关", "sid": "sh-syllabus", "n": 34, "id": "sh-syllabus-192", "tag": "考纲必背·七年级下·《卖油翁》", "t": "情境默写", "stem": "欧阳修在《卖油翁》中点明全文主旨，说明无论射箭还是酌油都不过是技艺熟练而已的传神结语是：“______________________。”", "ans": "我亦无他，惟手熟尔", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】北宋欧阳修《归田录·卖油翁》。惟：只是；熟：熟练；尔：罢了。"}, {"s": "板块三：上海考纲必背 86 篇全册·理解性情境默写全通关", "sid": "sh-syllabus", "n": 35, "id": "sh-syllabus-193", "tag": "考纲必背·八年级上·《野望》", "t": "情境默写", "stem": "王绩在《野望》中描摹秋日黄昏薄暮薄雾弥漫、山树皆染秋色的写景名句是：“______________________，______________________。”", "ans": "树树皆秋色，山山唯落晖", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】唐代王绩《野望》。树树、山山重叠，意境深广苍茫。"}, {"s": "板块三：上海考纲必背 86 篇全册·理解性情境默写全通关", "sid": "sh-syllabus", "n": 36, "id": "sh-syllabus-194", "tag": "考纲必背·八年级上·《三峡》", "t": "情境默写", "stem": "郦道元在《三峡》中描写夏水暴涨、江流迅猛、朝发白帝暮到江陵的一日千里之势的句子是：“______________________，______________________。”", "ans": "朝发白帝，暮到江陵", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】北魏郦道元《水经注·三峡》。"}, {"s": "板块三：上海考纲必背 86 篇全册·理解性情境默写全通关", "sid": "sh-syllabus", "n": 37, "id": "sh-syllabus-195", "tag": "考纲必背·八年级上·《三峡》", "t": "情境默写", "stem": "郦道元在《三峡》中写春冬之时水波清澈、倒映奇景、色彩极其秀美的极妙景致是：“______________________，______________________。”", "ans": "素湍绿潭，回清倒影", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】北魏郦道元《水经注·三峡》。素湍：白色的急流；回清：回旋的清波。"}, {"s": "板块三：上海考纲必背 86 篇全册·理解性情境默写全通关", "sid": "sh-syllabus", "n": 38, "id": "sh-syllabus-196", "tag": "考纲必背·八年级上·《与朱元思书》", "t": "情境默写", "stem": "吴均在《与朱元思书》中描写富春江江水清澈至极、游鱼细石历历可见的极佳句子是：“______________________，______________________。”", "ans": "游鱼细石，直视无碍", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】南朝梁吴均《与朱元思书》。"}, {"s": "板块三：上海考纲必背 86 篇全册·理解性情境默写全通关", "sid": "sh-syllabus", "n": 39, "id": "sh-syllabus-197", "tag": "考纲必背·八年级上·《得道多助，失道寡助》", "t": "情境默写", "stem": "《孟子·公孙丑下》开篇提出著名治国与战争准则的中心论点是：“______________________，______________________。”", "ans": "天时不如地利，地利不如人和", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】《孟子·公孙丑下》。孟子强调“人和”是战胜敌人、治国安邦之根本。"}, {"s": "板块三：上海考纲必背 86 篇全册·理解性情境默写全通关", "sid": "sh-syllabus", "n": 40, "id": "sh-syllabus-198", "tag": "考纲必背·八年级上·《富贵不能淫》", "t": "情境默写", "stem": "孟子在《富贵不能淫》中提出了流传千古的“大丈夫”人格标准的三句话是：“______________________，______________________，______________________。”", "ans": "富贵不能淫，贫贱不能移，威武不能屈", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】《孟子·滕文公下》。\n【词类活用】淫：使动，使……迷惑动摇；移：使……改变志节；屈：使……屈服低头。"}, {"s": "板块三：上海考纲必背 86 篇全册·理解性情境默写全通关", "sid": "sh-syllabus", "n": 41, "id": "sh-syllabus-199", "tag": "考纲必背·八年级上·《愚公移山》", "t": "情境默写", "stem": "《愚公移山》中愚公驳斥智叟，阐述子子孙孙无穷匮而山不加增的辩证发展名言是：“______________________，______________________，______________________。”", "ans": "子子孙孙无穷匮也，而山不加增，何苦而不平", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】《列子·汤问·愚公移山》。\n【易错字提示】「匮」匮乏竭尽之意。"}, {"s": "板块三：上海考纲必背 86 篇全册·理解性情境默写全通关", "sid": "sh-syllabus", "n": 42, "id": "sh-syllabus-200", "tag": "考纲必背·八年级上·《使至塞上》", "t": "情境默写", "stem": "王维在《使至塞上》中自比蓬草与归雁，表达被排挤出朝廷远赴边塞的孤寂凄苦心境的诗句是：“______________________，______________________。”", "ans": "征蓬出汉塞，归雁入胡天", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】唐代王维《使至塞上》。征蓬、归雁双关借喻漂泊孤寂之臣。"}, {"s": "板块三：上海考纲必背 86 篇全册·理解性情境默写全通关", "sid": "sh-syllabus", "n": 43, "id": "sh-syllabus-201", "tag": "考纲必背·八年级下·《关雎》", "t": "情境默写", "stem": "《诗经·关雎》中描写君子追求心上人思念极深、辗转反侧难以成眠的经典名句是：“______________________，______________________。”", "ans": "悠哉悠哉，辗转反侧", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】《诗经·周南·关雎》。悠哉：长长的思念貌；辗转：翻来覆去。"}, {"s": "板块三：上海考纲必背 86 篇全册·理解性情境默写全通关", "sid": "sh-syllabus", "n": 44, "id": "sh-syllabus-202", "tag": "考纲必背·八年级下·《蒹葭》", "t": "情境默写", "stem": "《诗经·蒹葭》中描摹清晨深秋白露凝结为霜、伊人宛在水之湄的朦胧优美意境的名句是：“______________________，______________________。”", "ans": "蒹葭苍苍，白露为霜", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】《诗经·秦风·蒹葭》。\n【易错字提示】「蒹葭」草字头，指初生与长成的芦苇。"}, {"s": "板块三：上海考纲必背 86 篇全册·理解性情境默写全通关", "sid": "sh-syllabus", "n": 45, "id": "sh-syllabus-203", "tag": "考纲必背·八年级下·《送杜少府之任蜀州》", "t": "情境默写", "stem": "王勃在《送杜少府之任蜀州》中劝慰友人勿学寻常男女抹泪分别、展现高远旷达胸怀的结句是：“______________________，______________________。”", "ans": "无为在歧路，儿女共沾巾", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】唐代王勃《送杜少府之任蜀州》。歧路：岔路分别之处；沾巾：眼泪沾湿手巾。"}, {"s": "板块三：上海考纲必背 86 篇全册·理解性情境默写全通关", "sid": "sh-syllabus", "n": 46, "id": "sh-syllabus-204", "tag": "考纲必背·八年级下·《北冥有鱼》", "t": "情境默写", "stem": "庄子在《北冥有鱼》中描摹大鹏展翅九万里、翻江倒海腾空而起的壮观奇崛想象的名句是：“______________________，______________________。”", "ans": "水击三千里，抟扶摇而上者九万里", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】《庄子·逍遥游》。\n【词义采分】抟（tuán）：盘旋飞翔；扶摇：旋风。"}, {"s": "板块三：上海考纲必背 86 篇全册·理解性情境默写全通关", "sid": "sh-syllabus", "n": 47, "id": "sh-syllabus-205", "tag": "考纲必背·八年级下·《虽有嘉肴》", "t": "情境默写", "stem": "《礼记·虽有嘉肴》中揭示教与学相互促进、相辅相成实践哲理的核心结论是：“______________________。”", "ans": "教学相长也", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】《礼记·学记》。\n【词类活用】长（zhǎng）：促进提高。"}, {"s": "板块三：上海考纲必背 86 篇全册·理解性情境默写全通关", "sid": "sh-syllabus", "n": 48, "id": "sh-syllabus-206", "tag": "考纲必背·八年级下·《卖炭翁》", "t": "情境默写", "stem": "白居易在《卖炭翁》中通过极度矛盾的心理活动描写，深刻揭露老翁饱受剥削、可怜心酸至极的诗句是：“______________________，______________________。”", "ans": "可怜身上衣正单，心忧炭贱愿天寒", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】唐代白居易《卖炭翁》。愿天寒与身上衣单形成巨大反差，血泪控诉宫市暴政。"}, {"s": "板块三：上海考纲必背 86 篇全册·理解性情境默写全通关", "sid": "sh-syllabus", "n": 49, "id": "sh-syllabus-207", "tag": "考纲必背·八年级下·《大道之行也》", "t": "情境默写", "stem": "《礼记·大道之行也》中阐述大同社会人人安居乐业、老有所终幼有所长的经典句子是：“______________________，______________________，______________________。”", "ans": "使老有所终，壮有所用，幼有所长", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】《礼记·礼运·大道之行也》。"}, {"s": "板块三：上海考纲必背 86 篇全册·理解性情境默写全通关", "sid": "sh-syllabus", "n": 50, "id": "sh-syllabus-208", "tag": "考纲必背·九年级上·《沁园春·雪》", "t": "情境默写", "stem": "毛泽东在《沁园春·雪》中由评论古代帝王文采武功自然过渡到当今人民群众、点明全词最高主旨的名句是：“______________________，______________________，______________________。”", "ans": "俱往矣，数风流人物，还看今朝", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】毛泽东《沁园春·雪》。俱往矣：承上启下，赞颂真正的历史创造者属于当代革命人民。"}, {"s": "板块三：上海考纲必背 86 篇全册·理解性情境默写全通关", "sid": "sh-syllabus", "n": 51, "id": "sh-syllabus-209", "tag": "考纲必背·九年级上·《湖心亭看雪》", "t": "情境默写", "stem": "张岱在《湖心亭看雪》中运用白描手法，将茫茫大雪中的西湖景物精妙点染为几抹微痕的传神句子是：“______________________，______________________，______________________，______________________。”", "ans": "湖上影子，惟长堤一痕、湖心亭一点、与余舟一芥、舟中人两三粒而已", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】明代张岱《湖心亭看雪》。量词“一痕、一点、一芥、两三粒”由大及小，白描绝品。"}, {"s": "板块三：上海考纲必背 86 篇全册·理解性情境默写全通关", "sid": "sh-syllabus", "n": 52, "id": "sh-syllabus-210", "tag": "考纲必背·九年级上·《月夜忆舍弟》", "t": "情境默写", "stem": "杜甫在《月夜忆舍弟》中借白露节令与故乡明月，抒发对战乱中失散兄弟深切思念的千古名联是：“______________________，______________________。”", "ans": "露从今夜白，月是故乡明", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】唐代杜甫《月夜忆舍弟》。\n【考点分析】白露节气夜凉露白，因主观深情而觉故乡之月分外清明。"}, {"s": "板块三：上海考纲必背 86 篇全册·理解性情境默写全通关", "sid": "sh-syllabus", "n": 53, "id": "sh-syllabus-211", "tag": "考纲必背·九年级上·《左迁至蓝关示侄孙湘》", "t": "情境默写", "stem": "韩愈在《左迁至蓝关示侄孙湘》中表明自己忠心为国直言进谏、虽遭严惩残年亦无怨无悔的崇高气节的名句是：“______________________，______________________！”", "ans": "欲为圣明除弊事，肯将衰朽惜残年", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】唐代韩愈《左迁至蓝关示侄孙湘》。\n【词义理解】衰朽：衰老残破之身躯；惜：顾惜爱惜。"}, {"s": "板块三：上海考纲必背 86 篇全册·理解性情境默写全通关", "sid": "sh-syllabus", "n": 54, "id": "sh-syllabus-212", "tag": "考纲必背·九年级上·《左迁至蓝关示侄孙湘》", "t": "情境默写", "stem": "韩愈在《左迁至蓝关示侄孙湘》中融情于景，写蓝关雪厚马行不前、前途未卜茫然心酸的沉痛名联是：“______________________？______________________。”", "ans": "云横秦岭家何在，雪拥蓝关马不前", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】唐代韩愈《左迁至蓝关示侄孙湘》。"}, {"s": "板块三：上海考纲必背 86 篇全册·理解性情境默写全通关", "sid": "sh-syllabus", "n": 55, "id": "sh-syllabus-213", "tag": "考纲必背·九年级下·《鱼我所欲也》", "t": "情境默写", "stem": "《孟子·鱼我所欲也》中论述人人都有“舍生取义”的本心，并用因果句揭示人之所以不贪生避死的根本原因的名句是：“______________________，______________________。”", "ans": "所欲有甚于生者，所恶有甚于死者", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】《孟子·告子上·鱼我所欲也》。甚于：超过。"}, {"s": "板块三：上海考纲必背 86 篇全册·理解性情境默写全通关", "sid": "sh-syllabus", "n": 56, "id": "sh-syllabus-214", "tag": "考纲必背·九年级下·《送东阳马生序》", "t": "情境默写", "stem": "宋濂在《送东阳马生序》中写自己虽衣衫褴褛与锦衣华服的富家子弟同处，却毫无艳羡之意，其内心笃定强大的精神原因在于：“______________________，______________________。”", "ans": "以中有足乐者，不知口体之奉不若人也", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】明代宋濂《送东阳马生序》。足乐者：读书求学之至乐；口体之奉：衣食享受。"}, {"s": "板块三：上海考纲必背 86 篇全册·理解性情境默写全通关", "sid": "sh-syllabus", "n": 57, "id": "sh-syllabus-215", "tag": "考纲必背·九年级下·《曹刿论战》", "t": "情境默写", "stem": "《曹刿论战》中曹刿解释选择在齐军“下视其辄，登轼而望之”之后才发起追击命令的科学依据是：“______________________，______________________。”", "ans": "吾视其辙乱，望其旗靡，故逐之", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】《左传·曹刿论战》。辙乱：车辙混乱；旗靡：军旗倒下。表明敌军真正败溃而非诈败。"}, {"s": "板块三：上海考纲必背 86 篇全册·理解性情境默写全通关", "sid": "sh-syllabus", "n": 58, "id": "sh-syllabus-216", "tag": "考纲必背·九年级下·《邹忌讽齐王纳谏》", "t": "情境默写", "stem": "《邹忌讽齐王纳谏》中齐威王采纳邹忌劝谏，下达奖赏令规定“能在公众场所议论指责朝政过失”的群臣吏民所受赏赐等级的句子是：“______________________，______________________，______________________。”", "ans": "能谤讥于市朝，闻寡人之耳者，受下赏", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】《战国策·齐策一·邹忌讽齐王纳谏》。谤讥：议论指责过失；市朝：公共场所。"}, {"s": "板块三：上海考纲必背 86 篇全册·理解性情境默写全通关", "sid": "sh-syllabus", "n": 59, "id": "sh-syllabus-217", "tag": "考纲必背·九年级下·《定风波》", "t": "情境默写", "stem": "苏轼在《定风波·莫听穿林打叶声》中面对沙湖骤雨竹杖芒鞋泰然自若、展现笑傲人生风雨旷达情怀的结句是：“______________________。______________________，______________________。”", "ans": "回首向来萧瑟处，归去，也无风雨也无晴", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】北宋苏轼《定风波》。萧瑟处：刚才风雨交加之处。表现宠辱不惊超然物外的大智大勇。"}, {"s": "板块三：上海考纲必背 86 篇全册·理解性情境默写全通关", "sid": "sh-syllabus", "n": 60, "id": "sh-syllabus-218", "tag": "考纲必背·九年级下·《山坡羊·潼关怀古》", "t": "情境默写", "stem": "张养浩在《山坡羊·潼关怀古》中超越朝代更迭表象，深刻揭示封建统治下老百姓永远遭受深重苦难的千古名句是：“______________________；______________________！”", "ans": "兴，百姓苦；亡，百姓苦", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】元代张养浩《山坡羊·潼关怀古》。一针见血道出历史本质，悲悯情怀动人心魄。"}, {"s": "板块三：上海考纲必背 86 篇全册·理解性情境默写全通关", "sid": "sh-syllabus", "n": 61, "id": "sh-syllabus-219", "tag": "考纲必背·九年级下·《太常引·建康中秋夜为吕叔潜赋》", "t": "情境默写", "stem": "辛弃疾在《太常引》中借嫦娥奔月神话，抒发扫除天下尘霾阴翳、还人间一片清明乾坤的爱国壮志的句子是：“______________________，______________________，______________________。”", "ans": "乘风好去，长空万里，直下看山河", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】南宋辛弃疾《太常引》。"}, {"s": "板块三：上海考纲必背 86 篇全册·理解性情境默写全通关", "sid": "sh-syllabus", "n": 62, "id": "sh-syllabus-220", "tag": "考纲必背·九年级下·《满江红（小住京华）》", "t": "情境默写", "stem": "秋瑾在《满江红》中写自己虽为女子身却有一副英雄肝胆豪气、身处封建枷锁奋起抗争的自白是：“______________________，______________________，______________________！”", "ans": "身不得，男儿列，心却比，男儿烈", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】清末秋瑾《满江红》。"}, {"s": "板块三：上海考纲必背 86 篇全册·理解性情境默写全通关", "sid": "sh-syllabus", "n": 63, "id": "sh-syllabus-221", "tag": "考纲必背·八年级上·《答谢中书书》", "t": "情境默写", "stem": "陶弘景在《答谢中书书》中总括江南山水灵秀、赞美这是人间仙境的句子是：“______________________。”", "ans": "实是欲界之仙都", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】南朝梁陶弘景《答谢中书书》。欲界：人间世俗世界；仙都：神仙居住的地方。"}, {"s": "板块三：上海考纲必背 86 篇全册·理解性情境默写全通关", "sid": "sh-syllabus", "n": 64, "id": "sh-syllabus-222", "tag": "考纲必背·八年级上·《记承天寺夜游》", "t": "情境默写", "stem": "苏轼在《记承天寺夜游》中以竹柏之影生动比喻月光澄澈纯净、空灵剔透的诗意名句是：“______________________，______________________，盖竹柏影也。”", "ans": "庭下如积水空明，水中藻、荇交横", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】北宋苏轼《记承天寺夜游》。【易错字提示】「藻荇」草字头；「空明」清澈透明。"}, {"s": "板块三：上海考纲必背 86 篇全册·理解性情境默写全通关", "sid": "sh-syllabus", "n": 65, "id": "sh-syllabus-223", "tag": "考纲必背·八年级上·《黄鹤楼》", "t": "情境默写", "stem": "崔颢在《黄鹤楼》中描写登楼远眺，汉阳碧树历历在目、江中鹦鹉洲芳草繁茂生机的对仗名句是：“______________________，______________________。”", "ans": "晴川历历汉阳树，芳草萋萋鹦鹉洲", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】唐代崔颢《黄鹤楼》。历历：清晰可数；萋萋：草木茂盛貌。"}, {"s": "板块三：上海考纲必背 86 篇全册·理解性情境默写全通关", "sid": "sh-syllabus", "n": 66, "id": "sh-syllabus-224", "tag": "考纲必背·八年级上·《渡荆门送别》", "t": "情境默写", "stem": "李白在《渡荆门送别》中以飞动传神之笔描摹江面月出如飞镜、云海翻涌结出奇幻云霞的颔联是：“______________________，______________________。”", "ans": "月下飞天镜，云生结海楼", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】唐代李白《渡荆门送别》。海楼：海市蜃楼。"}, {"s": "板块三：上海考纲必背 86 篇全册·理解性情境默写全通关", "sid": "sh-syllabus", "n": 67, "id": "sh-syllabus-225", "tag": "考纲必背·八年级上·《钱塘湖春行》", "t": "情境默写", "stem": "白居易在《钱塘湖春行》中借早莺争树、新燕啄泥描摹初春生机盎然景致的颔联是：“______________________，______________________。”", "ans": "几处早莺争暖树，谁家新燕啄春泥", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】唐代白居易《钱塘湖春行》。【易错字提示】「新燕」燕字字形；「啄」口字旁加豖。"}, {"s": "板块三：上海考纲必背 86 篇全册·理解性情境默写全通关", "sid": "sh-syllabus", "n": 68, "id": "sh-syllabus-226", "tag": "考纲必背·八年级上·《龟虽寿》", "t": "情境默写", "stem": "曹操在《龟虽寿》中以千里之马为喻，表达英雄虽已暮年却雄心壮志永不衰竭的千古绝唱是：“______________________，______________________；______________________，__________________ 背·八年级下·《茅屋为秋风所破歌》", "t": "情境默写", "stem": "杜甫在《茅屋为秋风所破歌》中宁愿自己茅屋独破受冻而死，也要换取天下寒士脱离苦海的博大博爱仁慈情怀是：“______________________，______________________！”", "ans": "何时眼前突兀见此屋，吾庐独破受冻死亦足", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】唐代杜甫《茅屋为秋风所破歌》。突兀：高耸挺拔貌；庐：茅屋。"}, {"s": "板块三：上海考纲必背 86 篇全册·理解性情境默写全通关", "sid": "sh-syllabus", "n": 75, "id": "sh-syllabus-233", "tag": "考纲必背·八年级下·《卜算子·黄州定慧院寓居作》", "t": "情境默写", "stem": "苏轼在《卜算子·黄州定慧院寓居作》中以孤鸿自比，表现自己身处逆境却心性高洁、绝不随波逐流的词句是：“______________________，______________________。”", "ans": "拣尽寒枝不肯栖，寂寞沙洲冷", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】北宋苏轼《卜算子·黄州定慧院寓居作》。【赏析】借孤鸿托物言志，表现坚贞自守、旷达脱俗的气节。"}, {"s": "板块三：上海考纲必背 86 篇全册·理解性情境默写全通关", "sid": "sh-syllabus", "n": 76, "id": "sh-syllabus-234", "tag": "考纲必背·八年级下·《卖炭翁》", "t": "情境默写", "stem": "白居易在《卖炭翁》中刻画老翁饱受冻馁却又企盼天气更加寒冷以便炭能卖个好价钱的极度矛盾心理的名句是：“______________________，______________________。”", "ans": "可怜身上衣正单，心忧炭贱愿天寒", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】唐代白居易《卖炭翁》。【易错字提示】「单」简单之单；「炭」山字头加灰。"}, {"s": "板块三：上海考纲必背 86 篇全册·理解性情境默写全通关", "sid": "sh-syllabus", "n": 77, "id": "sh-syllabus-235", "tag": "考纲必背·九年级上·《岳阳楼记》", "t": "情境默写", "stem": "范仲淹在《岳阳楼记》中描写洞庭湖水面波光闪耀如碎金、月影静静倒映如沉璧的对偶写景句是：“______________________，______________________。”", "ans": "浮光跃金，静影沉璧", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】北宋范仲淹《岳阳楼记》。【易错字提示】「璧」下半部为玉，切勿写成土（壁）。"}, {"s": "板块三：上海考纲必背 86 篇全册·理解性情境默写全通关", "sid": "sh-syllabus", "n": 78, "id": "sh-syllabus-236", "tag": "考纲必背·九年级上·《醉翁亭记》", "t": "情境默写", "stem": "欧阳修在《醉翁亭记》中描写山间朝暮阴晴变幻，若隐若现、朝暮成趣的句子是：“______________________，______________________，山间之朝暮也。”", "ans": "若夫日出而林霏开，云归而岩穴暝", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】北宋欧阳修《醉翁亭记》。霏：雾气；暝：昏暗。"}, {"s": "板块三：上海考纲必背 86 篇全册·理解性情境默写全通关", "sid": "sh-syllabus", "n": 79, "id": "sh-syllabus-237", "tag": "考纲必背·九年级上·《湖心亭看雪》", "t": "情境默写", "stem": "张岱在《湖心亭看雪》中以极凝练之白描手法勾勒天地苍茫纯白、天地浑然一体的奇景名句是：“______________________，______________________，上下一白。”", "ans": "雾凇沆砀，天与云与山与水", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】明末清初张岱《陶庵梦忆·湖心亭看雪》。【易错字提示】「凇」两点水；「沆砀」水汽弥漫浩瀚貌。"}, {"s": "板块三：上海考纲必背 86 篇全册·理解性情境默写全通关", "sid": "sh-syllabus", "n": 80, "id": "sh-syllabus-238", "tag": "考纲必背·九年级上·《行路难（其一）》", "t": "情境默写", "stem": "李白在《行路难（其一）》中形象生动比喻仕途险恶、人生前途充满艰难阻绝的颔联是：“______________________，______________________。”", "ans": "欲渡黄河冰塞川，将登太行雪满山", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】唐代李白《行路难（其一）》。【易错字提示】「塞」堵塞；「太行」行读 háng。"}, {"s": "板块三：上海考纲必背 86 篇全册·理解性情境默写全通关", "sid": "sh-syllabus", "n": 81, "id": "sh-syllabus-239", "tag": "考纲必背·九年级上·《酬乐天扬州初逢席上见赠》", "t": "情境默写", "stem": "刘禹锡在《酬乐天扬州初逢席上见赠》中借典故抒发自己贬谪归来，旧友零落、物是人非的无限沧桑感慨的名句是：“______________________，______________________。”", "ans": "怀旧空吟闻笛赋，到乡翻似烂柯人", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】唐代刘禹锡《酬乐天扬州初逢席上见赠》。【典故解析】闻笛赋化用向秀《思旧赋》；烂柯人化用王质观棋柯烂传说。"}, {"s": "板块三：上海考纲必背 86 篇全册·理解性情境默写全通关", "sid": "sh-syllabus", "n": 82, "id": "sh-syllabus-240", "tag": "考纲必背·九年级上·《水调歌头》", "t": "情境默写", "stem": "苏轼在《水调歌头·明月几时有》中打破时空阻隔、向远方亲人和天下所有离人送上最美好祝福的千古绝唱是：“______________________，______________________。”", "ans": "但愿人长久，千里共婵娟", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】北宋苏轼《水调歌头·明月几时有》。【字词采分】婵娟：美好的月色，借指明月。"}, {"s": "板块三：上海考纲必背 86 篇全册·理解性情境默写全通关", "sid": "sh-syllabus", "n": 83, "id": "sh-syllabus-241", "tag": "考纲必背·七年级上·《观沧海》", "t": "情境默写", "stem": "曹操在《观沧海》中借大海吞吐日月、包容宇宙星河的博大雄奇景观表达宏伟统一抱负的名句是：“______________________，______________________；______________________，______________________。”", "ans": "日月之行，若出其中；星汉灿烂，若出其里", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】东汉曹操《步出夏门行·观沧海》。【考点】虚实结合与博大胸襟。【易错字】「灿烂」火字旁；「星汉」指银河。"}, {"s": "板块三：上海考纲必背 86 篇全册·理解性情境默写全通关", "sid": "sh-syllabus", "n": 84, "id": "sh-syllabus-242", "tag": "考纲必背·七年级上·《闻王昌龄左迁龙标遥有此寄》", "t": "情境默写", "stem": "李白在《闻王昌龄左迁龙标遥有此寄》中将无形的愁心托付给明月，跨越关山伴送被贬友人的深情名句是：“______________________，______________________。”", "ans": "我寄愁心与明月，随君直到夜郎西", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】唐代李白《闻王昌龄左迁龙标遥有此寄》。【手法】拟人手法与托物传情。【易错字】「郎」部首右耳旁。"}, {"s": "板块三：上海考纲必背 86 篇全册·理解性情境默写全通关", "sid": "sh-syllabus", "n": 85, "id": "sh-syllabus-243", "tag": "考纲必背·七年级上·《次北固山下》", "t": "情境默写", "stem": "王湾在《次北固山下》中借雁足传书、寄托无尽羁旅乡愁与思亲之情的尾联是：“______________________？______________________。”", "ans": "乡书何处达？归雁洛阳边", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】唐代王湾《次北固山下》。【词义】归雁：北归的大雁，古代有雁足传书的传说。"}, {"s": "板块三：上海考纲必背 86 篇全册·理解性情境默写全通关", "sid": "sh-syllabus", "n": 86, "id": "sh-syllabus-244", "tag": "考纲必背·七年级上·《天净沙·秋思》", "t": "情境默写", "stem": "马致远在《天净沙·秋思》中点明全篇主旨、直抒天涯游子在夕阳西下时孤寂漂泊之痛的结句是：“______________________，______________________。”", "ans": "夕阳西下，断肠人在天涯", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】元代马致远《天净沙·秋思》。【考点】全曲点睛之笔，断肠人形容极度悲伤的羁旅漂泊者。"}, {"s": "板块三：上海考纲必背 86 篇全册·理解性情境默写全通关", "sid": "sh-syllabus", "n": 87, "id": "sh-syllabus-245", "tag": "考纲必背·七年级上·《峨眉山月歌》", "t": "情境默写", "stem": "李白在《峨眉山月歌》中连用平羌江、清溪、三峡、渝州四个地名，借江水月色抒发离乡远行思友之情的后两句是：“______________________，______________________。”", "ans": "夜发清溪向三峡，思君不见下渝州", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】唐代李白《峨眉山月歌》。【易错字】「溪」三点水；「渝」渝水/重庆。"}, {"s": "板块三：上海考纲必背 86 篇全册·理解性情境默写全通关", "sid": "sh-syllabus", "n": 88, "id": "sh-syllabus-246", "tag": "考纲必背·七年级上·《夜雨寄北》", "t": "情境默写", "stem": "李商隐在《夜雨寄北》中由眼前巴山秋池夜雨的孤寂，跨越时空设想未来重逢、围炉长谈的温情诗句是：“______________________，______________________。”", "ans": "何当共剪西窗烛，却话巴山夜雨时", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】唐代李商隐《夜雨寄北》。【手法】虚实相生，化眼前凄楚为重逢遐想。"}, {"s": "板块三：上海考纲必背 86 篇全册·理解性情境默写全通关", "sid": "sh-syllabus", "n": 89, "id": "sh-syllabus-247", "tag": "考纲必背·七年级下·《木兰诗》", "t": "情境默写", "stem": "《木兰诗》中跨越十年征战、极写边关战事残酷惨烈与将士凯旋英雄气概的对偶名句是：“______________________，______________________。”", "ans": "将军百战死，壮士十年归", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】北朝民歌《木兰诗》。【手法】互文修辞，将士们历经百战伤亡惨重，幸存英雄十年后凯旋而归。"}, {"s": "板块三：上海考纲必背 86 篇全册·理解性情境默写全通关", "sid": "sh-syllabus", "n": 90, "id": "sh-syllabus-248", "tag": "考纲必背·七年级下·《木兰诗》", "t": "情境默写", "stem": "《木兰诗》中以雄雌莫辨的双兔奔跑为喻，风趣赞美木兰女扮男装代父从军却未被同袍识破的结尾名句是：“______________________，______________________；______________________，______________________？”", "ans": "雄兔脚扑朔，雌兔眼迷离；双兔傍地走，安能辨我是雄雌", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】《木兰诗》。成语“扑朔迷离”的出处。【易错字】「雌」此字旁加隹。"}, {"s": "板块三：上海考纲必背 86 篇全册·理解性情境默写全通关", "sid": "sh-syllabus", "n": 91, "id": "sh-syllabus-249", "tag": "考纲必背·七年级下·《登幽州台歌》", "t": "情境默写", "stem": "陈子昂在《登幽州台歌》中俯仰古今宇宙、抒发宇宙无穷而人生苦短、怀才不遇极度孤独悲壮的千古绝唱是：“______________________，______________________！______________________，______________________！”", "ans": "前不见古人，后不见来者！念天地之悠悠，独怆然而涕下", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】唐代陈子昂《登幽州台歌》。【易错字】「怆」竖心旁加仓；「涕」古代专指眼泪。"}, {"s": "板块三：上海考纲必背 86 篇全册·理解性情境默写全通关", "sid": "sh-syllabus", "n": 92, "id": "sh-syllabus-250", "tag": "考纲必背·七年级下·《望岳》", "t": "情境默写", "stem": "杜甫在《望岳》中由望岳升华为勇攀顶峰、傲视群雄的人生雄心与进取哲理的诗句是：“______________________，______________________。”", "ans": "会当凌绝顶，一览众山小", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】唐代杜甫《望岳》。凌：登上；览：俯瞰。"}, {"s": "板块三：上海考纲必背 86 篇全册·理解性情境默写全通关", "sid": "sh-syllabus", "n": 93, "id": "sh-syllabus-251", "tag": "考纲必背·七年级下·《登飞来峰》", "t": "情境默写", "stem": "王安石在《登飞来峰》中借塔高望远阐发站得高方能看得远、无畏世俗守旧浮云遮蔽的改革家自信情怀是：“______________________，______________________。”", "ans": "不畏浮云遮望眼，自缘身在最高层", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】北宋王安石《登飞来峰》。【词义】缘：因为。身在最高层故不受浮云蔽日所惑。"}, {"s": "板块三：上海考纲必背 86 篇全册·理解性情境默写全通关", "sid": "sh-syllabus", "n": 94, "id": "sh-syllabus-252", "tag": "考纲必背·七年级下·《游山西村》", "t": "情境默写", "stem": "陆游在《游山西村》中借山回路转、忽现村舍的惊喜体验，揭示在困境中只要坚持就能迎来全新转机哲理的诗句是：“______________________，______________________。”", "ans": "山重水复疑无路，柳暗花明又一村", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】南宋陆游《游山西村》。【哲理】困境之中充满希望，绝处逢生。"}, {"s": "板块三：上海考纲必背 86 篇全册·理解性情境默写全通关", "sid": "sh-syllabus", "n": 95, "id": "sh-syllabus-253", "tag": "考纲必背·七年级下·《己亥杂诗（其五）》", "t": "情境默写", "stem": "龚自珍在《己亥杂诗（其五）》中以落花化作沃土滋养新枝为喻，表达甘愿奉献一生培植后进人才崇高精神的诗句是：“______________________，______________________。”", "ans": "落红不是无情物，化作春泥更护花", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】清代龚自珍《己亥杂诗（其五）》。【考点】托物言志与牺牲奉献精神。"}, {"s": "板块三：上海考纲必背 86 篇全册·理解性情境默写全通关", "sid": "sh-syllabus", "n": 96, "id": "sh-syllabus-254", "tag": "考纲必背·八年级上·《三峡》", "t": "情境默写", "stem": "郦道元在《三峡》中描写两岸崇山峻岭连绵不绝、若非正午和半夜甚至看不见太阳和月亮的奇险地貌的句子是：“______________________，______________________。”", "ans": "自非亭午夜分，不见曦月", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】北魏郦道元《水经注·三峡》。【易错字】「曦」日字旁加羲，指太阳。"}, {"s": "板块三：上海考纲必背 86 篇全册·理解性情境默写全通关", "sid": "sh-syllabus", "n": 97, "id": "sh-syllabus-255", "tag": "考纲必背·八年级上·《三峡》", "t": "情境默写", "stem": "郦道元在《三峡》中极写夏水之盛、江流极速，朝发白帝暮达江陵的奔腾气势的句子是：“______________________，______________________，虽乘奔御风，不以疾也。”", "ans": "有时朝发白帝，暮到江陵", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】《水经注·三峡》。奔：飞奔的骏马；疾：快。"}, {"s": "板块三：上海考纲必背 86 篇全册·理解性情境默写全通关", "sid": "sh-syllabus", "n": 98, "id": "sh-syllabus-256", "tag": "考纲必背·八年级上·《野望》", "t": "情境默写", "stem": "王绩在《野望》中总写秋日山野全景，漫山遍野秋色浓重、落日余晖洒满山川的对偶名句是：“______________________，______________________。”", "ans": "树树皆秋色，山山唯落晖", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】唐代王绩《野望》。【赏析】五律首开唐风，静谧苍茫。"}, {"s": "板块三：上海考纲必背 86 篇全册·理解性情境默写全通关", "sid": "sh-syllabus", "n": 99, "id": "sh-syllabus-257", "tag": "考纲必背·八年级上·《使至塞上》", "t": "情境默写", "stem": "王维在《使至塞上》中被誉为“千古壮观”的塞外雄奇风光对仗名联是：“______________________，______________________。”", "ans": "大漠孤烟直，长河落日圆", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】唐代王维《使至塞上》。【易错字】「直」与「圆」的炼字精妙。"}, {"s": "板块三：上海考纲必背 86 篇全册·理解性情境默写全通关", "sid": "sh-syllabus", "n": 100, "id": "sh-syllabus-258", "tag": "考纲必背·八年级下·《庄子与惠子游于濠梁之上》", "t": "情境默写", "stem": "《庄子与惠子游于濠梁之上》中庄子面对桥下游鱼自由游弋，由衷感叹鱼之快乐的开篇名句是：“______________________，______________________。”", "ans": "鲦鱼出游从容，是鱼之乐也", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】《庄子·秋水》。【易错字】「鲦」鱼字旁加条；从容：悠闲自在貌。"}, {"s": "板块三：上海考纲必背 86 篇全册·理解性情境默写全通关", "sid": "sh-syllabus", "n": 101, "id": "sh-syllabus-259", "tag": "考纲必背·八年级下·《北冥有鱼》", "t": "情境默写", "stem": "《北冥有鱼》中形容大鹏振翅高飞、双翼舒展浩大如天边垂天之云的奇伟想象名句是：“______________________，______________________。”", "ans": "怒而飞，其翼若垂天之云", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】《庄子·逍遥游》。怒：奋起、振作的样子。"}, {"s": "板块三：上海考纲必背 86 篇全册·理解性情境默写全通关", "sid": "sh-syllabus", "n": 102, "id": "sh-syllabus-260", "tag": "考纲必背·八年级下·《马说》", "t": "情境默写", "stem": "韩愈在《马说》中揭露封建统治者不知才、不爱才、残酷摧残千里马的愚妄罪状的三个并列排比短句是：“______________________，______________________，______________________，执策而临之，曰：‘天下无马！’”", "ans": "策之不以其道，食之不能尽其材，鸣之而不能通其意", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】唐代韩愈《马说》。【易错字】「材」通“才”；「策」用马鞭驱赶。"}, {"s": "板块三：上海考纲必背 86 篇全册·理解性情境默写全通关", "sid": "sh-syllabus", "n": 103, "id": "sh-syllabus-261", "tag": "考纲必背·九年级上·《富贵不能淫》", "t": "情境默写", "stem": "孟子在《富贵不能淫》中概括真正大丈夫在面对财富、贫困与强暴威慑时所坚守的崇高道德人格的三重准则是：“______________________，______________________，______________________，此之谓大丈夫。”", "ans": "富贵不能淫，贫贱不能移，威武不能屈", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】《孟子·滕文公下》。淫：惑乱；移：改变志向；屈：屈服退缩。"}, {"s": "板块三：上海考纲必背 86 篇全册·理解性情境默写全通关", "sid": "sh-syllabus", "n": 104, "id": "sh-syllabus-262", "tag": "考纲必背·九年级上·《生于忧患，死于安乐》", "t": "情境默写", "stem": "《生于忧患，死于安乐》中从国家治理层面指出，如果一个国家内部没有贤臣法度、外部没有敌国侵扰，往往招致灭亡的论断名句是：“______________________，______________________，国恒亡。”", "ans": "入则无法家拂士，出则无敌国外患者", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】《孟子·告子下》。【易错字】「拂」通“弼”，辅佐之意。"}, {"s": "板块三：上海考纲必背 86 篇全册·理解性情境默写全通关", "sid": "sh-syllabus", "n": 105, "id": "sh-syllabus-263", "tag": "考纲必背·九年级上·《鱼我所欲也》", "t": "情境默写", "stem": "孟子在《鱼我所欲也》中批评那些不顾礼义廉耻、贪图万钟优厚俸禄的利欲熏心之徒的设问批判名句是：“______________________，______________________！”", "ans": "万钟则不辩礼义而受之，万钟于我何加焉", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】《孟子·告子上》。【易错字】「辩」通“辨”，辨别；加：益处。"}, {"s": "板块三：上海考纲必背 86 篇全册·理解性情境默写全通关", "sid": "sh-syllabus", "n": 106, "id": "sh-syllabus-264", "tag": "考纲必背·九年级下·《曹刿论战》", "t": "情境默写", "stem": "《曹刿论战》中曹刿在长勺之战取胜后向鲁庄公解释选择敌军“三通鼓”之后才发起反击的军事心理战法是：“______________________，______________________，______________________。彼竭我盈，故克之。”", "ans": "一鼓作气，再而衰，三而竭", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】《左传·庄公十年·曹刿论战》。【成语】一鼓作气。盈：充满。"}, {"s": "板块三：上海考纲必背 86 篇全册·理解性情境默写全通关", "sid": "sh-syllabus", "n": 107, "id": "sh-syllabus-265", "tag": "考纲必背·九年级下·《邹忌讽齐王纳谏》", "t": "情境默写", "stem": "齐威王听取邹忌劝谏后颁布法令，对臣民能当面指出寡人过失者给予最高嘉奖的下令原句是：“______________________，______________________。”", "ans": "群臣吏民能面刺寡人之过者，受上赏", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】《战国策·齐策一·邹忌讽齐王纳谏》。面刺：当面指责过失。"}, {"s": "板块三：上海考纲必背 86 篇全册·理解性情境默写全通关", "sid": "sh-syllabus", "n": 108, "id": "sh-syllabus-266", "tag": "考纲必背·九年级下·《出师表》", "t": "情境默写", "stem": "诸葛亮在《出师表》中语重心长告诫后主刘禅，汉室前期之所以繁荣昌盛的核心政治历史经验是：“______________________，______________________，此先汉所以兴隆也。”", "ans": "亲贤臣，远小人", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】三国诸葛亮《出师表》。亲、远：形容词活用作动词，亲近、疏远。"}, {"s": "板块三：上海考纲必背 86 篇全册·理解性情境默写全通关", "sid": "sh-syllabus", "n": 109, "id": "sh-syllabus-267", "tag": "考纲必背·九年级下·《出师表》", "t": "情境默写", "stem": "诸葛亮在《出师表》中回顾自己年轻时隐居南阳隆中，不慕名利虚荣的高洁心志名句是：“______________________，______________________。”", "ans": "苟全性命于乱世，不求闻达于诸侯", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】三国诸葛亮《出师表》。苟全：苟且保全；闻达：显扬做官。"}, {"s": "板块三：上海考纲必背 86 篇全册·理解性情境默写全通关", "sid": "sh-syllabus", "n": 110, "id": "sh-syllabus-268", "tag": "考纲必背·九年级下·《送东阳马生序》", "t": "情境默写", "stem": "宋濂在《送东阳马生序》中身穿破旧衣服处在衣着华丽的富家子弟中间却毫无艳羡自卑之心，揭示内心专注于学业求知充实快乐的名句是：“______________________，______________________。”", "ans": "以中有足乐者，不知口体之奉不若人也", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】明代宋濂《送东阳马生序》。【考点】安贫乐道、专心治学的崇高志趣。"}, {"s": "板块四：上海中考真题与模拟·古诗词曲理解与赏析专练", "sid": "sh-gushi", "n": 1, "id": "sh-gushi-269", "tag": "2024上海中考第2题", "t": "选择题", "stem": "【2024上海中考】阅读白居易《钱塘湖春行》，完成题目：\n孤山寺北贾亭西，水面初平云脚低。\n几处早莺争暖树，谁家新燕啄春泥。\n乱花渐欲迷人眼，浅草才能没马蹄。\n最爱湖东行不足，绿杨阴里白沙堤。\n\n下列对这首诗的理解与赏析，不恰当的一项是（    ）\nA. 首联交代了行踪，点明春水初涨、云气低垂的早春西湖开阔景象。\nB. 颔联中“争”和“啄”两个动词，生动描摹出初春早莺与新燕充满生机的动态之美。\nC. 颈联“乱花渐欲迷人眼”写出西湖暮春时节百花凋零、迷乱游人视线的感伤之情。\nD. 尾联直接抒情，“最爱”与“行不足”直抒胸臆，表达了诗人流连忘返的喜悦沉醉。", "ans": "C", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【试题剖析】\nC项错误。“乱花渐欲迷人眼”描写的是早春西湖百花初放、姹紫嫣红、欣欣向荣之景，而非“暮春百花凋零”。“乱花”指纷繁绚烂的野花，“渐欲”表现出春花逐渐盛开的过程，全诗洋溢着对西湖早春蓬勃生机的无限热爱与喜悦，毫无感伤情绪。"}, {"s": "板块四：上海中考真题与模拟·古诗词曲理解与赏析专练", "sid": "sh-gushi", "n": 2, "id": "sh-gushi-270", "tag": "2024上海中考第2题衍生", "t": "简答题", "stem": "【2024上海中考】白居易在《钱塘湖春行》颔联中用“几处”而不用“处处”，用“谁家”而不用“家家”，请结合全诗意境，简要分析诗人用词的精妙之处。", "ans": "①“几处”说明早莺尚少，只是星星点点，而非处处可见；“谁家”说明新燕刚开始归来筑巢，而非家家燕筑。\n②这两个词准确生动地扣住了题眼中的“早春”特征，形象表现了初春万物复苏、生机刚刚萌动之景；若改成“处处”与“家家”，就变成了春深盛景，失去了早春的独特韵味与敏锐观察。", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【炼字采分点】①扣住词义（初来、尚少）；②扣住全诗主旨（扣紧“早春”特征，表现生机萌发）；③分析艺术效果（准确传神，显出观察细致入微）。"}, {"s": "板块四：上海中考真题与模拟·古诗词曲理解与赏析专练", "sid": "sh-gushi", "n": 3, "id": "sh-gushi-271", "tag": "2023上海中考第2题", "t": "选择题", "stem": "【2023上海中考】阅读李白《渡荆门送别》，完成题目：\n渡远荆门外，来从楚国游。\n山随平野尽，江入大荒流。\n月下飞天镜，云生结海楼。\n仍怜故乡水，万里送行舟。\n\n下列对颔联“山随平野尽，江入大荒流”的赏析，不正确的一项是（    ）\nA. 诗人乘舟沿江而下，视野从崇山峻岭过渡到一马平川的广袤平原。\nB. “随”字化静为动，写出两岸群山随着行舟移动而逐渐隐退的动态视觉感受。\nC. “入”字气势磅礴，描摹出浩荡长江奔腾注入广袤荒野的壮阔雄浑景象。\nD. 颔联借崇山退去、江流荒寂的萧瑟景物，流露出诗人初出蜀地内心的迷茫与凄凉。", "ans": "D", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【试题剖析】\nD项错误。颔联描绘的是长江冲出三峡、进入平原后开阔宏大的壮丽景观，洋溢着青年李白初次出蜀、仗剑远游时的意气风发、豪迈豁达与宏伟气魄，绝非“迷茫与凄凉”。"}, {"s": "板块四：上海中考真题与模拟·古诗词曲理解与赏析专练", "sid": "sh-gushi", "n": 4, "id": "sh-gushi-272", "tag": "2023上海中考第2题衍生", "t": "简答题", "stem": "【2023上海中考】《渡荆门送别》尾联“仍怜故乡水，万里送行舟”采用了什么表现手法？抒发了诗人怎样的思想情感？", "ans": "【表现手法】拟人手法（或移情于物、反客为主）。\n【情感分析】诗人不直接说自己依依不舍故乡，而说是故乡的江水对自己充满眷恋，不辞万里万里护送行舟。生动含蓄、深情款款地抒发了诗人离开蜀地远游时对故乡山水的无限眷恋与依依惜别之情。", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【采分点】①答出拟人或移情手法；②点明“反客为主”；③准确答出对故乡的依恋深情。"}, {"s": "板块四：上海中考真题与模拟·古诗词曲理解与赏析专练", "sid": "sh-gushi", "n": 5, "id": "sh-gushi-273", "tag": "2022上海中考第3题", "t": "选择题", "stem": "【2022上海中考】阅读辛弃疾《丑奴儿·书博山道中壁》，完成题目：\n少年不识愁滋味，爱上层楼。爱上层楼，为赋新词强说愁。\n而今识尽愁滋味，欲说还休。欲说还休，却道天凉好个秋。\n\n下列关于这首词的理解与分析，正确的一项是（    ）\nA. 上阕写词人少年时期饱受苦难，因此常常登楼作词、痛诉内心深重的愁苦。\nB. 下阕“识尽”二字概括了词人一生历经抗金风霜、屡遭主和派排挤打击的沧桑际遇。\nC. 词作上下阕末尾均采用反复手法，节奏轻快欢悦，表现出词人晚年寄情山水的安逸闲适。\nD. “却道天凉好个秋”表现词人胸襟极其乐观开朗，完全忘却了昔日所有的抗金遗憾。", "ans": "B", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【试题剖析】\nB项正确。“识尽”高度凝聚了辛弃疾一生抗金救国却壮志未酬、屡遭贬谪的沉痛沧桑。\nA项“少年时期饱受苦难”错误，少年是“不识愁滋味”、“为赋新词强说愁”的少不更事与无病呻吟；\nC项“轻快欢悦、安逸闲适”错误，全词是深沉郁结、悲壮沉痛的风格；\nD项“完全忘却”错误，化愁苦为故作轻松的闲谈天气，正是悲愤至极、欲说还休的深层艺术表达。"}, {"s": "板块四：上海中考真题与模拟·古诗词曲理解与赏析专练", "sid": "sh-gushi", "n": 6, "id": "sh-gushi-274", "tag": "2021上海中考第2题", "t": "选择题", "stem": "【2021上海中考】阅读王维《山居秋暝》，完成题目：\n空山新雨后，天气晚来秋。\n明月松间照，清泉石上流。\n竹喧归浣女，莲动下渔舟。\n随意春芳歇，王孙自可留。\n\n下列对这首诗歌的分析，不正确的一项是（    ）\nA. 首联“空山”点明山居环境幽静清新，“新雨后”带来初秋傍晚的丝丝凉意。\nB. 颔联“明月松间照，清泉石上流”融静景与动景于一体，构成纯净空灵的诗情画意。\nC. 颈联“竹喧归浣女，莲动下渔舟”以先闻其声、后见其影的笔法，破坏了山居原本幽静和谐的气氛。\nD. 尾联反用《楚辞·招隐士》“王孙兮归来，山中兮不可久留”之典，表达了诗人隐居秋山、寄情泉石的高洁情操。", "ans": "C", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【试题剖析】\nC项错误。“竹喧”、“莲动”不仅没有破坏山居幽静，反而运用了“以动衬静”、“以闹衬幽”的艺术手法，展现出山中民风淳朴、生机盎然的和谐生活画卷，更加反衬出山居环境的超脱尘俗与闲适安宁。"}, {"s": "板块四：上海中考真题与模拟·古诗词曲理解与赏析专练", "sid": "sh-gushi", "n": 7, "id": "sh-gushi-275", "tag": "2020上海中考第2题", "t": "选择题", "stem": "【2020上海中考】阅读常建《题破山寺后禅院》，完成题目：\n清晨入古寺，初日照高林。\n竹径通幽处，禅房花木深。\n山光悦鸟性，潭影空人心。\n万籁此都寂，但余钟磬音。\n\n下列对诗歌颈联“山光悦鸟性，潭影空人心”中“空”字的理解，最恰当的一项是（    ）\nA. 指潭水清澈见底，没有游鱼和水草。\nB. 指使人心中的世俗杂念与烦恼完全消除、回归宁静澄澈。\nC. 指寺庙庭院空空荡荡，没有任何游人香客。\nD. 指诗人仕途受挫后内心极度空虚和失望迷茫。", "ans": "B", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【试题剖析】\n答案 B。“潭影空人心”的“空”为形容词活用作动词，使动用法，意思是“使……空寂、消除杂念”。清澈的潭水倒映着山光禅影，使诗人体会到万缘皆空、超脱尘俗的佛家境界，荡涤了内心的烦恼名利之念。"}, {"s": "板块四：上海中考真题与模拟·古诗词曲理解与赏析专练", "sid": "sh-gushi", "n": 8, "id": "sh-gushi-276", "tag": "2019上海中考第2题", "t": "选择题", "stem": "【2019上海中考】阅读杜甫《望岳》，完成题目：\n岱宗夫如何？齐鲁青未了。\n造化钟神秀，阴阳割昏晓。\n荡胸生曾云，决眦入归鸟。\n会当凌绝顶，一览众山小。\n\n下列关于颔联中“割”字的炼字赏析，最恰当的一项是（    ）\nA. “割”字生动表现出泰山遮天蔽日、将山南山北晨昏光色截然分开的神奇壮观力量。\nB. “割”字描写出泰山山势陡峭险峻，犹如一把锋利的宝剑直插云霄。\nC. “割”字表明泰山地处齐鲁边界，硬生生将齐国和鲁国版图分割开来。\nD. “割”字表现出夕阳西下时晚霞如刀割般的破碎景象。", "ans": "A", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【试题剖析】\n答案 A。“阴阳割昏晓”中“割”字炼得极好。泰山极高极广，山南阳光普照（明/晓），山北背阴暗黑（昏），一山之隔宛如天工奇裁、截然划分为一明一暗两个截然不同的天地。化静为动，极写泰山遮天蔽日的巍峨高大与大自然的神奇造化。"}, {"s": "板块四：上海中考真题与模拟·古诗词曲理解与赏析专练", "sid": "sh-gushi", "n": 9, "id": "sh-gushi-277", "tag": "2018上海中考第2题", "t": "选择题", "stem": "【2018上海中考】阅读欧阳修《生查子·元夕》，完成题目：\n去年元夜时，花市灯如昼。\n月上柳梢头，人约黄昏后。\n今年元夜时，月与灯依旧。\n不见去年人，泪湿春衫袖。\n\n这首词主要运用的表现手法与抒发的情感是（    ）\nA. 托物言志；赞美青年男女矢志不渝的纯洁爱情。\nB. 虚实结合与物是人非的今昔对比；抒发对物在人亡（失恋离散）的深沉伤感。\nC. 借景抒情；批判封建礼教对青年男女恋爱自由的残酷束缚。\nD. 抑扬结合；表现词人对元宵佳节热闹繁华场面的极度反感与厌倦。", "ans": "B", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【试题剖析】\n答案 B。全词上阕回忆“去年元夜”相会之乐，花灯如昼、月上柳梢、情投意合；下阕写“今年元夜”重寻旧迹，月色灯火依旧，唯独伊人不再，泪湿春衫。运用了鲜明的今昔对比与虚实相生手法，深刻抒发了物是人非的深哀巨痛。"}, {"s": "板块四：上海中考真题与模拟·古诗词曲理解与赏析专练", "sid": "sh-gushi", "n": 10, "id": "sh-gushi-278", "tag": "2017上海中考第2题", "t": "简答题", "stem": "【2017上海中考】苏轼在《江城子·密州出猎》结穴处写道：“会挽雕弓如满月，西北望，射天狼。”请分析其中“天狼”的象征意义以及这三句表达了词人怎样的抱负。", "ans": "①“天狼”借指天狼星，古代星象中象征贪残侵掠，此处代指当时侵扰北宋西北边境的西夏侵略者。\n②这三句词运用典故与比喻，生动刻画出一位手挽强弓、严阵以待的抗敌英雄形象，淋漓尽致地表达了词人渴望报效国家、奔赴前线抗击强敌、收复失地的雄心壮志与爱国豪情。", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【试题采分】①天狼喻指西夏侵略者（敌寇）；②表达抵抗外侮、报效国家的坚定决心与爱国抱负。"}, {"s": "板块四：上海中考真题与模拟·古诗词曲理解与赏析专练", "sid": "sh-gushi", "n": 11, "id": "sh-gushi-279", "tag": "2016上海中考第2题", "t": "选择题", "stem": "【2016上海中考】阅读曹操《观沧海》，完成题目：\n东临碣石，以观沧海。\n水何澹澹，山岛竦峙。\n树木丛生，百草丰茂。\n秋风萧瑟，洪波涌起。\n日月之行，若出其中；\n星汉灿烂，若出其里。\n幸甚至哉，歌以咏志。\n\n对诗中“日月之行，若出其中；星汉灿烂，若出其里”理解不正确的一项是（    ）\nA. 这四句诗采用奇特瑰丽的想象，属于虚写。\nB. 诗人登高远眺，真实看到了太阳和月亮从大海正中央跳跃升起的全过程。\nC. 借助大海吞吐日月星辰的宏伟壮阔意象，生动展现出大海磅礴开阔的气势。\nD. 寄托了诗人消灭割据势力、一统中原的博大政治胸怀和宏伟建功立业抱负。", "ans": "B", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【试题剖析】\nB项错误。“若出其中”、“若出其里”中的“若”是“好像”的意思，属于诗人的奇特夸张与浪漫主义主观想象（虚写），并非真实肉眼所见的大海吞吐日月的具象过程。"}, {"s": "板块四：上海中考真题与模拟·古诗词曲理解与赏析专练", "sid": "sh-gushi", "n": 12, "id": "sh-gushi-280", "tag": "2015上海中考第2题", "t": "选择题", "stem": "【2015上海中考】阅读崔颢《黄鹤楼》，完成题目：\n昔人已乘黄鹤去，此地空余黄鹤楼。\n黄鹤一去不复返，白云千载空悠悠。\n晴川历历汉阳树，芳草萋萋鹦鹉洲。\n日暮乡关何处是？烟波江上使人愁。\n\n下列关于这首诗歌的赏析，不正确的一项是（    ）\nA. 首联和颔联连用三个“黄鹤”，打破律诗避重字的常规，音节清朗，流露岁月悠悠、仙去楼空的怅惘。\nB. 颈联“晴川历历汉阳树，芳草萋萋鹦鹉洲”对仗工整，视野由虚入实，展现出一派明丽清晰的江上胜景。\nC. 尾联“烟波江上使人愁”中的“愁”，仅指诗人因黄鹤不归、无法修道成仙而产生的沮丧懊恼之情。\nD. 全诗融神话传说与眼前实景于一体，诗情由怀古而思乡，意境阔大，被称为唐人七律压卷之作。", "ans": "C", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【试题剖析】\nC项错误。尾联“日暮乡关何处是？烟波江上使人愁”中的“愁”，是游子在暮色苍茫面对浩渺江水时油然而生的羁旅乡愁与漂泊身世之叹，表达了深沉浓烈的思乡怀土之情，绝非“无法修道成仙的沮丧”。"}, {"s": "板块四：上海中考真题与模拟·古诗词曲理解与赏析专练", "sid": "sh-gushi", "n": 13, "id": "sh-gushi-281", "tag": "2024杨浦一模诗歌赏析", "t": "简答题", "stem": "【2024杨浦一模】阅读王湾《次北固山下》，品析颈联“海日生残夜，江春入旧年”蕴含的自然与生活哲理。", "ans": "①自然哲理：残夜还未退尽，红日已在海面上升起；旧年尚未过去，江南春意已早早潜入。生动描绘了冬尽春来、昼夜交替的壮丽自然时序。\n②生活哲理：揭示了新旧事物交替的普遍自然规律，表明新生事物脱胎于旧事物之中，具有不可遏止的生命力，蕴含着乐观向上、积极进取的生活哲理与希望。", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【采分点】①具体阐释日生残夜、春入旧年的自然景象；②提炼出新生事物必将代替旧事物的普遍哲理与乐观精神。"}, {"s": "板块四：上海中考真题与模拟·古诗词曲理解与赏析专练", "sid": "sh-gushi", "n": 14, "id": "sh-gushi-282", "tag": "2024静安二模诗歌赏析", "t": "选择题", "stem": "【2024静安二模】阅读辛弃疾《破阵子·为陈同甫赋壮词以寄之》，下列理解不正确的一项是（    ）\n醉里挑灯看剑，梦回吹角连营。八百里分麾下炙，五十弦翻塞外声，沙场秋点兵。\n马作的卢飞快，弓如霹雳弦惊。了却君王天下事，赢得生前身后名。可怜白发生！\n\nA. 词作开篇由醉酒挑灯看剑引出梦境，起笔雄浑矫健。\nB. “八百里分麾下炙，五十弦翻塞外声”极力渲染了军营生活的热烈壮阔与军威的振奋。\nC. “了却君王天下事，赢得生前身后名”直抒胸臆，展现了抗金报国、收复中原的宏伟抱负。\nD. 尾联“可怜白发生”笔锋骤转，流露出词人对自己一生杀敌战功赫赫、已无遗憾的欣慰感慨。", "ans": "D", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【试题剖析】\nD项错误。“可怜白发生”是全词最沉痛之笔，由热烈豪迈的梦境骤然跌回冰冷残酷的现实。词人空有一腔报国热情，却已两鬓斑白、英雄暮年而功业未就，抒发的是理想破灭、报国无门的极度悲愤与沉痛哀叹，毫无“欣慰”可言。"}, {"s": "板块四：上海中考真题与模拟·古诗词曲理解与赏析专练", "sid": "sh-gushi", "n": 15, "id": "sh-gushi-283", "tag": "2024黄浦一模诗歌赏析", "t": "简答题", "stem": "【2024黄浦一模】王维在《使至塞上》中被誉为千古奇观的诗句是“大漠孤烟直，长河落日圆”。请从几何构图与词语锤炼角度简析其美感。", "ans": "①几何构图之美：辽阔茫茫的“大漠”横向铺展，烽火台上一缕“孤烟”垂直向上，构成了垂直线与水平线的纵横对比；奔流浩瀚的“长河”线条苍凉延伸，一轮“落日”浑圆金黄，方圆相间，线条极其开阔雄浑。\n②词语锤炼之妙：“直”字准确写出边塞无风、狼烟劲挺升腾的劲拔坚毅；“圆”字写出暮色落日的苍凉沉浑。字字传神，勾勒出边疆大漠苍茫浩瀚的雄壮意境。", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【采分点】①构图对比（线与面、纵与横、直与圆）；②炼字（“直”的劲拔与“圆”的浑厚苍凉）；③总结边塞雄浑之美。"}, {"s": "板块四：上海中考真题与模拟·古诗词曲理解与赏析专练", "sid": "sh-gushi", "n": 16, "id": "sh-gushi-284", "tag": "2024徐汇一模诗歌赏析", "t": "选择题", "stem": "【2024徐汇一模】岑参《白雪歌送武判官归京》中“忽如一夜春风来，千树万树梨花开”以春花喻冬雪，下列对其艺术手法与抒发情感的评价，最准确的一项是（    ）\nA. 极写边塞严寒之残酷，表现将士苦不堪言的绝望心情。\nB. 运用新奇贴切的比喻，将漫天大雪想象成盛开的千树梨花，豪迈乐观，表现了诗人对塞外雪景的惊叹赞美。\nC. 描写边塞气候异常多变，一夜之间寒冬瞬间变成了春天。\nD. 借繁花似锦反衬塞外荒凉，表达对中原故土繁华春光的无尽眷恋。", "ans": "B", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【试题剖析】\n答案 B。“忽如一夜春风来，千树万树梨花开”是盛唐边塞诗中的神来之笔。诗人化严寒为生机，以南国的春风暖意和梨花盛景比拟边塞奇寒的大雪纷飞，意境开阔明朗、浪漫蓬勃，充满神奇瑰丽的想象力。"}, {"s": "板块四：上海中考真题与模拟·古诗词曲理解与赏析专练", "sid": "sh-gushi", "n": 17, "id": "sh-gushi-285", "tag": "2024浦东一模诗歌赏析", "t": "简答题", "stem": "【2024浦东一模】李贺在《雁门太守行》中开篇写道：“黑云压城城欲摧，甲光向日金鳞开。”请简要分析该联在色彩运用和氛围渲染上的妙处。", "ans": "①色彩强烈对照：以沉沉浓黑的“黑云”与金光闪耀的“金鳞（甲光）”形成极强烈的冷暖色调视觉反差，色彩鲜明凝练。\n②氛围凝重悲壮：“黑云压城城欲摧”渲染敌军兵临城下、重兵合围的危急与窒息感；“甲光向日金鳞开”写出守军将士披坚执锐、严阵以待的英勇昂扬斗志。一沉一扬，生动表现出边关战事的紧迫惨烈与将士誓死卫国的豪迈气概。", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【采分点】①色彩对比（黑与金）；②氛围渲染（敌军压境之危急与我军将士威武昂扬）；③主题升华。"}, {"s": "板块四：上海中考真题与模拟·古诗词曲理解与赏析专练", "sid": "sh-gushi", "n": 18, "id": "sh-gushi-286", "tag": "2024闵行一模诗歌赏析", "t": "选择题", "stem": "【2024闵行一模】阅读杜甫《春望》，下列对诗歌颔联“感时花溅泪，恨别鸟惊心”的理解与赏析，不正确的一项是（    ）\nA. 运用拟人手法，将诗人内心的感伤离恨移情于花鸟。\nB. 运用互文见义，意为感时恨别使得看见花开也想落泪、听见鸟鸣也觉心惊。\nC. 展现出诗人因国破家亡、战火离散而产生的沉郁顿挫深沉悲痛。\nD. 描写春日花朵含露如泪、飞鸟啼鸣惊心，批评花鸟不懂得体恤百姓的疾苦。", "ans": "D", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【试题剖析】\nD项错误。花鸟本为无情物，但在国破家亡的特殊历史语境下，诗人移情于物，正是以乐景反衬哀痛，凸显诗人内心感时伤世之深沉，绝非“批评花鸟不懂体恤百姓”。"}, {"s": "板块四：上海中考真题与模拟·古诗词曲理解与赏析专练", "sid": "sh-gushi", "n": 19, "id": "sh-gushi-287", "tag": "2024虹口二模诗歌赏析", "t": "简答题", "stem": "【2024虹口二模】李白在《行路难（其一）》中情感经历了大起大落的波澜起伏，请梳理诗人的情感脉络，并分析尾联“长风破浪会有时，直挂云帆济沧海”表达了怎样的精神品质。", "ans": "①情感波澜：从开篇美酒佳肴的“苦闷停杯”，到面对冰塞黄河、雪满太行的“迷茫阻绝”，再到想望伊尹姜尚被任用的“企盼渴望”，最终升华至坚信理想必能实现的“豪迈坚定”。\n②精神品质：尾联表达了诗人即使身处重重逆境困厄，依然坚守崇高抱负、永不气馁、勇往直前的乐观豪迈气概与高度自信执着的人生信念。", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【采分点】①理清情感波动曲线；②准确归纳尾联的自信、乐观、坚毅精神品质。"}, {"s": "板块四：上海中考真题与模拟·古诗词曲理解与赏析专练", "sid": "sh-gushi", "n": 20, "id": "sh-gushi-288", "tag": "2024宝山一模诗歌赏析", "t": "选择题", "stem": "【2024宝山一模】刘禹锡在《酬乐天扬州初逢席上见赠》中以“沉舟侧畔千帆过，病树前头万木春”答赠白居易，下列赏析最准确的一项是（    ）\nA. 诗人以沉舟、病树自比，感伤自己二十三年谪居生涯毫无建树，彻底心灰意冷。\nB. 表现诗人嫉妒后来居上的年轻官员，借千帆竞渡表达内心的愤愤不平。\nC. 虽以沉舟病树自况，却借千帆争渡、万木争春的盎然生机，展现出豁达从容的博大胸襟，揭示出新事物必将取代旧事物的哲理。\nD. 纯粹描写扬州江面千帆竞发、沿岸树木葱郁的初春实景，毫无政治寄托。", "ans": "C", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【试题剖析】\n答案 C。白居易原诗《醉赠刘二十八使君》对刘禹锡的不幸遭遇深表同情与不平（“二十三年折太多”）；刘禹锡答诗没有消沉怨怼，而是以沉舟病树自嘲，更以千帆万木自励，体现出坚毅旷达的胸怀与历史发展的辩证智慧。"}, {"s": "板块四：上海中考真题与模拟·古诗词曲理解与赏析专练", "sid": "sh-gushi", "n": 21, "id": "sh-gushi-289", "tag": "2024松江二模诗歌赏析", "t": "选择题", "stem": "【2024松江二模】苏轼《水调歌头·明月几时有》中“转朱阁，低绮户，照无眠。不应有恨，何事长向别时圆”表现的情思是（    ）\nA. 责怪月亮故意与离人作对，在亲人分离时偏偏团圆，流露出细腻微妙的怨月与怀人之情。\nB. 表现词人失眠烦躁，厌恶月光照进窗户打扰自己休息。\nC. 批评弟弟苏辙多年不来探望自己，内心充满怨恨与失望。\nD. 表明词人政治失意后夜不能寐，借月光宣泄对朝廷的不满。", "ans": "A", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【试题剖析】\n答案 A。词人借月光西沉、照耀无眠之人，推己及人，向明月发出看似无理的埋怨“何事长向别时圆”，表面怨月，实则借天伦圆缺抒发对胞弟苏辙的刻骨相思与深沉牵挂，情致委婉深沉。"}, {"s": "板块四：上海中考真题与模拟·古诗词曲理解与赏析专练", "sid": "sh-gushi", "n": 22, "id": "sh-gushi-290", "tag": "2024嘉定一模诗歌赏析", "t": "简答题", "stem": "【2024嘉定一模】文天祥在《过零丁洋》尾联中写下千古名句“人生自古谁无死？留取丹心照汗青”。请从修辞手法和思想主旨两个方面简要评析其震撼人心的力量。", "ans": "①修辞手法：运用设问（反问）与借代手法。“人生自古谁无死”自问自答，气势磅礴；“汗青”借代青史史册，化抽象为具体。\n②思想主旨：直抒胸臆，面对死亡与威逼利诱，诗人慷慨赴死，表达了视死如归的民族气节、舍生取义的忠贞操守和崇高的爱国主义献身精神，成为中华民族不朽的精神丰碑。", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【采分点】①指出设问/反问及借代修辞；②深刻阐述以死报国、舍生取义的坚定气节与爱国主旨。"}, {"s": "板块四：上海中考真题与模拟·古诗词曲理解与赏析专练", "sid": "sh-gushi", "n": 23, "id": "sh-gushi-291", "tag": "2024青浦一模诗歌赏析", "t": "选择题", "stem": "【2024青浦一模】范仲淹《渔家傲·秋思》中“浊酒一杯家万里，燕然未勒归无计”集中表达了词人怎样的复杂心境（    ）\nA. 痛恨朝廷克扣军饷，打算早日辞官归隐故里。\nB. 思念万里之外的家乡亲人，却又因边患未平、功业未建而无法归去的矛盾与爱国情怀。\nC. 贪图边塞饮酒作乐的闲适生活，乐不思蜀。\nD. 悲叹边关将士贪生怕死，无法取得抗敌胜利。", "ans": "B", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【试题剖析】\n答案 B。“浊酒一杯家万里”写思乡之深切；“燕然未勒归无计”化用窦宪勒石燕然典故，写卫国建功、守土有责之重任。两句深刻揭示了守边将士思乡盼归与保家卫国之间的内心激烈冲突，沉重悲壮。"}, {"s": "板块四：上海中考真题与模拟·古诗词曲理解与赏析专练", "sid": "sh-gushi", "n": 24, "id": "sh-gushi-292", "tag": "2024金山一模诗歌赏析", "t": "简答题", "stem": "【2024金山一模】王安石《登飞来峰》中“不畏浮云遮望眼，自缘身在最高层”与王之涣“欲穷千里目，更上一层楼”都包含登高哲理，两者的主旨侧重有何不同？", "ans": "①王安石《登飞来峰》侧重于政治抱负与远见卓识：“浮云”比喻阻碍改革变法的守旧势力和世俗谗言，表达了改革家站得高、看得远，不畏邪恶、坚定推行新法的无畏政治魄力。\n②王之涣《登鹳雀楼》侧重于认知与进取法则：强调只有站得更高才能看得更远，阐述了普遍的求知与积极向上、永不止步的人生进取哲理。", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【采分点】①分别阐明两诗的哲理意象（浮云比喻世俗谗邪）；②点明王安石诗具有鲜明的政治远见与变法自信特色。"}, {"s": "板块四：上海中考真题与模拟·古诗词曲理解与赏析专练", "sid": "sh-gushi", "n": 25, "id": "sh-gushi-293", "tag": "2024奉贤二模诗歌赏析", "t": "选择题", "stem": "【2024奉贤二模】陆游《游山西村》中“山重水复疑无路，柳暗花明又一村”历来被作为哲理名句传诵，下列对其意蕴阐释最贴切的一项是（    ）\nA. 告诫人们外出旅游时务必带好指南针，谨防在山水之间迷路。\nB. 表现山西村地理位置偏僻难找，村民生活贫困闭塞。\nC. 说明人在陷入困境似乎山穷水尽时，只要坚持前行、不放弃希望，往往会出现豁然开朗的全新转机。\nD. 讽刺官场险恶多变，随时可能遭遇无法预料的灾祸。", "ans": "C", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【试题剖析】\n答案 C。诗人借行山路时原本以为无路可行、忽见柳绿花红中隐现村庄的惊喜体验，生动阐发出深刻的人生哲理：在看似绝望的逆境与困局中，只要坚韧执着、继续探索，定能迎来柳暗花明的新局面。"}, {"s": "板块四：上海中考真题与模拟·古诗词曲理解与赏析专练", "sid": "sh-gushi", "n": 26, "id": "sh-gushi-294", "tag": "2024长宁一模诗歌赏析", "t": "简答题", "stem": "【2024长宁一模】李白在《闻王昌龄左迁龙标遥有此寄》中写道：“我寄愁心与明月，随君直到夜郎西。”请简析这一联诗的艺术构思与情感深度。", "ans": "①艺术构思奇绝：诗人运用拟人手法，将无形抽象的“愁心”托付给高悬夜空的“明月”，让明月带着自己的关切与悲悯，一路伴随远谪龙标的友人直至偏远的夜郎之西，构思新颖浪漫，神来之笔。\n②情感深度：跨越千山万水的阻隔，充分展现了诗人对友人无辜被贬的极度牵挂、同情与慰藉，字里行间洋溢着纯洁真挚的深厚友谊。", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【采分点】①分析借月抒怀与拟人手法（将愁心托与明月）；②点出对友人被贬的深切同情与真挚关怀。"}, {"s": "板块四：上海中考真题与模拟·古诗词曲理解与赏析专练", "sid": "sh-gushi", "n": 27, "id": "sh-gushi-295", "tag": "2024普陀一模诗歌赏析", "t": "选择题", "stem": "【2024普陀一模】阅读《诗经·周南·关雎》，下列对这首诗的艺术特色与思想内容的理解，不正确的一项是（    ）\nA. 诗歌以雎鸠水鸟的鸣叫起兴，自然引出青年男子对美丽善良姑娘的爱慕。\nB. “求之不得，寤寐思服。悠哉悠哉，辗转反侧”真实生动地描绘出热恋中求而不得的相思煎熬与深情。\nC. “琴瑟友之”、“钟鼓乐之”表现了二人结为连理后举行奢靡盛大婚礼、炫耀家族财富的世俗虚荣。\nD. 全诗运用重章叠句、双声叠韵，语言纯朴自然，感情热烈健康，体现了“乐而不淫，哀而不伤”的雅正之美。", "ans": "C", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【试题剖析】\nC项错误。“琴瑟友之”、“钟鼓乐之”属于主人公在求而不得时的美好期盼与虚拟想象，运用琴瑟、钟鼓表达对迎娶淑女、相敬如宾、琴瑟和鸣的和美婚姻生活的热烈向往，情感真挚纯朴，毫无“炫耀世俗虚荣”之意。"}, {"s": "板块四：上海中考真题与模拟·古诗词曲理解与赏析专练", "sid": "sh-gushi", "n": 28, "id": "sh-gushi-296", "tag": "2024浦东二模诗歌赏析", "t": "简答题", "stem": "【2024浦东二模】《诗经·秦风·蒹葭》中“蒹葭苍苍，白露为霜。所谓伊人，在水一方”营造了怎样的意境氛围？“伊人”具有怎样的象征意味？", "ans": "①意境氛围：以深秋清晨苍茫的芦苇、晶莹的寒霜以及浩渺迷茫的秋水为背景，营造了一种深秋萧瑟、凄清迷蒙、空灵幽美的抒情意境。\n②象征意味：“伊人”既可指代主人公所热烈恋慕但可望而不可即的美丽女子，也可寄托和象征美好的人生理想、崇高的政治抱负或追求探索的精神境界。", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【采分点】①描摹苍茫迷蒙凄清的秋景意境；②阐发伊人的双重象征意义（特定意中人与理想精神追求）。"}, {"s": "板块四：上海中考真题与模拟·古诗词曲理解与赏析专练", "sid": "sh-gushi", "n": 29, "id": "sh-gushi-297", "tag": "2024徐汇二模诗歌赏析", "t": "选择题", "stem": "【2024徐汇二模】陶渊明《饮酒（其五）》中“采菊东篱下，悠然见南山。山气日夕佳，飞鸟相与还”中的“见”字，有的版本作“望”。苏轼曾评议认为“见”字远胜于“望”字，其主要原因是（    ）\nA. “望”字是有心去寻视，“见”字是无意中偶见，更能体现诗人采菊时心与物融、超然物外的物我合一化境。\nB. “见”字比“望”字笔画更少，书写更加优美。\nC. “望”字通常用于白天，而此时是傍晚夕阳，只能用“见”。\nD. 陶渊明当时视力衰退，无法“望”见远方的南山，只能模糊“见”到。", "ans": "A", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【试题剖析】\n答案 A。苏轼《东坡题跋》精辟指出：“因采菊而见山，境与意会，此句最有妙处。近岁俗本皆作‘望南山’，则千里远矣！”“见”是随意闲看、无心偶遇，浑然天成；“望”是有意凝视，带有了功利刻意的专注，破坏了诗人闲适超脱、物我两忘的宁静自然之美。"}, {"s": "板块四：上海中考真题与模拟·古诗词曲理解与赏析专练", "sid": "sh-gushi", "n": 30, "id": "sh-gushi-298", "tag": "2024崇明一模诗歌赏析", "t": "简答题", "stem": "【2024崇明一模】龚自珍在《己亥杂诗（其五）》中说：“落红不是无情物，化作春泥更护花。”请结合全诗，简要分析这两句诗所表达的思想情怀。", "ans": "①借物言志（托物言志）：诗人以凋落的花瓣自比，形象生动地表明自己虽然辞官归隐、离开朝廷，但绝非冷酷无情、忘怀家国之人。\n②崇高情怀：落花化作春泥反而滋养新生花木茁壮成长，以此明志，坚定表达了诗人即使身处江湖荒远，依然愿倾尽毕生心血、竭诚培植后进人才、报效国家的崇高奉献精神与爱国情操。", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【采分点】①指出落红的比喻与托物言志手法；②点明辞官不忘报国、甘当春泥培育人才的崇高奉献情操。"}, {"s": "板块五：上海中考真题与模拟·课内文言字词释义与多义通假", "sid": "sh-words", "n": 1, "id": "sh-words-299", "tag": "2025上海中考第3(1)题", "t": "选择题", "stem": "为句中加点字选择最合适的解释：\n可以调素．琴（    ）\nA. 白色的       B. 不加装饰的、质朴的       C. 质地光滑的       D. 素常的", "ans": "B", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】刘禹锡《陋室铭》。调素琴指弹抚质朴不加雕饰的素木之琴。A项白色不合乐器常理；D项素常不贴合语境修饰。"}, {"s": "板块五：上海中考真题与模拟·课内文言字词释义与多义通假", "sid": "sh-words", "n": 2, "id": "sh-words-300", "tag": "2025上海中考第3(2)题", "t": "选择题", "stem": "为选文中加点字选择最合适的解释：\n道．尽陋室增光处（    ）\nA. 主张       B. 说、说明       C. 道路       D. 学派", "ans": "B", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】《重订古文释义新编》。道：动词，说出、表达出。"}, {"s": "板块五：上海中考真题与模拟·课内文言字词释义与多义通假", "sid": "sh-words", "n": 3, "id": "sh-words-301", "tag": "2025上海中考第4题", "t": "选择题", "stem": "下面加点词的词类活用与“无丝竹之乱．耳”中“乱”用法一致的是（    ）\nA. 山不在此高．       B. 斯是陋．室       C. 往来无白．丁       D. 无案牍之劳．形", "ans": "D", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【词类活用辨析】乱耳之“乱”：形容词使动用法，“使……扰乱”。\nD项“劳形”之“劳”：形容词使动用法，“使……劳累”。二者完全一致。\nA、B、C项均为普通形容词用作表语或定语。"}, {"s": "板块五：上海中考真题与模拟·课内文言字词释义与多义通假", "sid": "sh-words", "n": 4, "id": "sh-words-302", "tag": "2024上海中考第3(1)题", "t": "选择题", "stem": "下列对词语含义的理解，正确的一项是（    ）\n故不为苟．得也\nA. 暂且       B. 假如       C. 随便、苟且       D. 已忘", "ans": "C", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】《孟子·鱼我所欲也》。句意：所以我不会做苟且偷生的事。苟：随便、苟且。"}, {"s": "板块五：上海中考真题与模拟·课内文言字词释义与多义通假", "sid": "sh-words", "n": 5, "id": "sh-words-303", "tag": "2024上海中考第3(2)题", "t": "选择题", "stem": "下列对词语含义的理解，正确的一项是（    ）\n遂度．终不能听\nA. 度过       B. 揣测、估计       C. 测量       D. 准则", "ans": "B", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】《宋史·马遂传》。度（duó）：动词，揣测、推断、估计。"}, {"s": "板块五：上海中考真题与模拟·课内文言字词释义与多义通假", "sid": "sh-words", "n": 6, "id": "sh-words-304", "tag": "2023上海中考第6(1)题", "t": "填空题", "stem": "解释下列文言句子中的加点词：\n伯牙破琴绝．弦：__________", "ans": "断、折断、弄断", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】《吕氏春秋·伯牙鼓琴》。绝：断、弄断。写知音已逝、终身不复鼓琴之悲壮决绝。"}, {"s": "板块五：上海中考真题与模拟·课内文言字词释义与多义通假", "sid": "sh-words", "n": 7, "id": "sh-words-305", "tag": "2023上海中考第6(2)题", "t": "填空题", "stem": "解释下列文言句子中的加点词：\n灯下简．箧中故书：__________", "ans": "挑选、检点、翻检", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】《相见甚欢》。简：动词，挑选、检阅、翻检。"}, {"s": "板块五：上海中考真题与模拟·课内文言字词释义与多义通假", "sid": "sh-words", "n": 8, "id": "sh-words-306", "tag": "2022上海中考第6(1)题", "t": "填空题", "stem": "解释下列句中加点词：\n及其日中如探汤．：__________", "ans": "热水", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】《两小儿辩日》。古代“汤”指热水；现代指菜汤食物。"}, {"s": "板块五：上海中考真题与模拟·课内文言字词释义与多义通假", "sid": "sh-words", "n": 9, "id": "sh-words-307", "tag": "2022上海中考第6(2)题", "t": "填空题", "stem": "解释下列句中加点词：\n孔子不能决．也：__________", "ans": "判断、裁决、决断", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】《两小儿辩日》。决：判断、定夺。"}, {"s": "板块五：上海中考真题与模拟·课内文言字词释义与多义通假", "sid": "sh-words", "n": 10, "id": "sh-words-308", "tag": "2021上海中考第9(1)题", "t": "填空题", "stem": "解释下列句中加点词：\n更．无所供：__________", "ans": "另、另外、再", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】《王端毅公恕巡抚云南》。更：副词，另外、再。"}, {"s": "板块五：上海中考真题与模拟·课内文言字词释义与多义通假", "sid": "sh-words", "n": 11, "id": "sh-words-309", "tag": "2021上海中考第9(2)题", "t": "填空题", "stem": "解释下列句中加点词：\n其告示云．：__________", "ans": "说、写道", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】云：动词，说（如“孔子云：何陋之有”）。"}, {"s": "板块五：上海中考真题与模拟·课内文言字词释义与多义通假", "sid": "sh-words", "n": 12, "id": "sh-words-310", "tag": "2020上海中考第10(1)题", "t": "填空题", "stem": "解释下列句中加点词：\n齐人固．善盗乎：__________", "ans": "本来、原来", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】《晏子使楚》。固：副词，本来。"}, {"s": "板块五：上海中考真题与模拟·课内文言字词释义与多义通假", "sid": "sh-words", "n": 13, "id": "sh-words-311", "tag": "2020上海中考第10(2)题", "t": "填空题", "stem": "解释下列句中加点词：\n公输盘不说．：__________", "ans": "同“悦”，高兴、愉快", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【通假字】说：通“悦”，高兴、愉快。"}, {"s": "板块五：上海中考真题与模拟·课内文言字词释义与多义通假", "sid": "sh-words", "n": 14, "id": "sh-words-312", "tag": "2019上海中考第7(1)题", "t": "填空题", "stem": "解释下列句中加点词：\n便扶向．路：__________", "ans": "原先的、先前的", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】《桃花源记》。向：先前、从前。"}, {"s": "板块五：上海中考真题与模拟·课内文言字词释义与多义通假", "sid": "sh-words", "n": 15, "id": "sh-words-313", "tag": "2019上海中考第7(2)题", "t": "填空题", "stem": "解释下列句中加点词：\n欣然规．往：__________", "ans": "计划、打算", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】《桃花源记》。规：名词活用为动词，计划、筹划。"}, {"s": "板块五：上海中考真题与模拟·课内文言字词释义与多义通假", "sid": "sh-words", "n": 16, "id": "sh-words-314", "tag": "2018上海中考第7(1)题", "t": "填空题", "stem": "解释文中加点的词：\n一狼径．去：__________", "ans": "径直、直接", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】蒲松龄《狼》。径：副词，径直、径自。"}, {"s": "板块五：上海中考真题与模拟·课内文言字词释义与多义通假", "sid": "sh-words", "n": 17, "id": "sh-words-315", "tag": "2018上海中考第7(2)题", "t": "填空题", "stem": "解释文中加点的词：\n顾．野有麦场：__________", "ans": "回头看、看", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】蒲松龄《狼》。顾：动词，回头看。"}, {"s": "板块五：上海中考真题与模拟·课内文言字词释义与多义通假", "sid": "sh-words", "n": 18, "id": "sh-words-316", "tag": "2017上海中考第7(1)题", "t": "填空题", "stem": "解释文中加点的词：\n贻．以药物：__________", "ans": "赠送、送给", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】《宋史·苏轼传》。贻（yí）：赠给、送给。"}, {"s": "板块五：上海中考真题与模拟·课内文言字词释义与多义通假", "sid": "sh-words", "n": 19, "id": "sh-words-317", "tag": "2017上海中考第7(2)题", "t": "填空题", "stem": "解释文中加点的词：\n微．斯人，吾谁与归：__________", "ans": "没有", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】范仲淹《岳阳楼记》。微：否定副词，如果不是、如果没有。"}, {"s": "板块五：上海中考真题与模拟·课内文言字词释义与多义通假", "sid": "sh-words", "n": 20, "id": "sh-words-318", "tag": "2016上海中考第7(1)题", "t": "填空题", "stem": "解释文中加点的词：\n菊之爱，陶后鲜．有闻：__________", "ans": "少", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】周敦颐《爱莲说》。鲜（xiǎn）：副词，少、很少。"}, {"s": "板块五：上海中考真题与模拟·课内文言字词释义与多义通假", "sid": "sh-words", "n": 21, "id": "sh-words-319", "tag": "2016上海中考第7(2)题", "t": "填空题", "stem": "解释文中加点的词：\n莲之爱，同予者何人？花之隐逸者也．：__________", "ans": "表判断语气，相当于“啊”或“呀”", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】周敦颐《爱莲说》。句末语气助词，表肯定判断。"}, {"s": "板块五：上海中考真题与模拟·课内文言字词释义与多义通假", "sid": "sh-words", "n": 22, "id": "sh-words-320", "tag": "2015上海中考第7(1)题", "t": "填空题", "stem": "解释加点词：\n天下局促于方寸，而此翁偃然自伯．：__________", "ans": "称霸、为首、称长", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】《核舟记》。伯：名词作动词，称霸、称长。"}, {"s": "板块五：上海中考真题与模拟·课内文言字词释义与多义通假", "sid": "sh-words", "n": 23, "id": "sh-words-321", "tag": "2015上海中考第7(2)题", "t": "填空题", "stem": "解释加点词：\n醉翁之意．不在酒：__________", "ans": "情趣、意趣、心思", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】欧阳修《醉翁亭记》。意：意趣、心意、旨趣。"}, {"s": "板块五：上海中考真题与模拟·课内文言字词释义与多义通假", "sid": "sh-words", "n": 24, "id": "sh-words-322", "tag": "2014上海中考第7(1)题", "t": "填空题", "stem": "解释文中加点词：\n齐师伐．我：__________", "ans": "攻打、讨伐", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】《曹刿论战》。伐：动词，攻打、征伐。"}, {"s": "板块五：上海中考真题与模拟·课内文言字词释义与多义通假", "sid": "sh-words", "n": 25, "id": "sh-words-323", "tag": "2014上海中考第7(2)题", "t": "填空题", "stem": "解释文中加点词：\n牺牲玉帛，弗敢加．也：__________", "ans": "虚夸、虚报", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】《曹刿论战》。加：动词，虚报、虚夸、夸大。"}, {"s": "板块五：上海中考真题与模拟·课内文言字词释义与多义通假", "sid": "sh-words", "n": 26, "id": "sh-words-324", "tag": "2024杨浦一模第6(1)题", "t": "填空题", "stem": "解释下列句中的加点词：\n不可以故意．待也：__________", "ans": "过去的、原来的旧眼光（故交旧情）", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】《三国志·吕蒙传》。故意：过去的看法、原来的态度。"}, {"s": "板块五：上海中考真题与模拟·课内文言字词释义与多义通假", "sid": "sh-words", "n": 27, "id": "sh-words-325", "tag": "2024杨浦一模第6(2)题", "t": "填空题", "stem": "解释下列句中的加点词：\n遂往诣．蒙：__________", "ans": "拜访、探望", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】《三国志·吕蒙传》。诣（yì）：拜访、造访。"}, {"s": "板块五：上海中考真题与模拟·课内文言字词释义与多义通假", "sid": "sh-words", "n": 28, "id": "sh-words-326", "tag": "2024静安二模第6(1)题", "t": "填空题", "stem": "解释下列加点词：\n录毕，走送之，不敢稍逾约．：__________", "ans": "期限、约定的日期", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】宋濂《送东阳马生序》。约：约定的期限。"}, {"s": "板块五：上海中考真题与模拟·课内文言字词释义与多义通假", "sid": "sh-words", "n": 29, "id": "sh-words-327", "tag": "2024静安二模第6(2)题", "t": "填空题", "stem": "解释下列加点词：\n俟其欣悦，则又请焉．：__________", "ans": "代词，向他（老师）请教", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】宋濂《送东阳马生序》。焉：代词兼语气词，相当于“向之”。"}, {"s": "板块五：上海中考真题与模拟·课内文言字词释义与多义通假", "sid": "sh-words", "n": 30, "id": "sh-words-328", "tag": "2024徐汇一模第6(1)题", "t": "填空题", "stem": "解释下列加点词：\n月色入户，欣然起行．：__________", "ans": "散步、漫步", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】苏轼《记承天寺夜游》。起行：起来散步。"}, {"s": "板块五：上海中考真题与模拟·课内文言字词释义与多义通假", "sid": "sh-words", "n": 31, "id": "sh-words-329", "tag": "通假字专项·第1题", "t": "填空题", "stem": "指出下列句子中的通假字并解释其含义：\n便要．还家，设酒杀鸡作食（    ）通（    ），释义：__________", "ans": "“要”通“邀”，邀请", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】陶渊明《桃花源记》。要：通“邀”，邀请。"}, {"s": "板块五：上海中考真题与模拟·课内文言字词释义与多义通假", "sid": "sh-words", "n": 32, "id": "sh-words-330", "tag": "通假字专项·第2题", "t": "填空题", "stem": "指出下列句子中的通假字并解释其含义：\n属．予作文以记之（    ）通（    ），释义：__________", "ans": "“属”通“嘱”，嘱托", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】范仲淹《岳阳楼记》。属（zhǔ）：通“嘱”，嘱托。"}, {"s": "板块五：上海中考真题与模拟·课内文言字词释义与多义通假", "sid": "sh-words", "n": 33, "id": "sh-words-331", "tag": "通假字专项·第3题", "t": "填空题", "stem": "指出下列句子中的通假字并解释其含义：\n困于心，衡．于虑，而后作（    ）通（    ），释义：__________", "ans": "“衡”通“横”，梗塞、不顺达", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】《孟子·告子下·生于忧患，死于安乐》。衡：通“横”，梗塞不顺。"}, {"s": "板块五：上海中考真题与模拟·课内文言字词释义与多义通假", "sid": "sh-words", "n": 34, "id": "sh-words-332", "tag": "通假字专项·第4题", "t": "填空题", "stem": "指出下列句子中的通假字并解释其含义：\n学．学半（    ）通（    ），释义：__________", "ans": "第一个“学”通“敩”（xiào），教导、教人", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】《礼记·虽有嘉肴》引《兑命》。学（xiào）：通“敩”，教导。"}, {"s": "板块五：上海中考真题与模拟·课内文言字词释义与多义通假", "sid": "sh-words", "n": 35, "id": "sh-words-333", "tag": "通假字专项·第5题", "t": "填空题", "stem": "指出下列句子中的通假字并解释其含义：\n甚矣，汝之不惠．（    ）通（    ），释义：__________", "ans": "“惠”通“慧”，聪明、智慧", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】《列子·愚公移山》。惠：通“慧”，聪明。"}, {"s": "板块五：上海中考真题与模拟·课内文言字词释义与多义通假", "sid": "sh-words", "n": 36, "id": "sh-words-334", "tag": "通假字专项·第6题", "t": "填空题", "stem": "指出下列句子中的通假字并解释其含义：\n为天下唱．，宜多应者（    ）通（    ），释义：__________", "ans": "“唱”通“倡”，首发、倡导", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】《史记·陈涉世家》。唱：通“倡”，倡导、带头。"}, {"s": "板块五：上海中考真题与模拟·课内文言字词释义与多义通假", "sid": "sh-words", "n": 37, "id": "sh-words-335", "tag": "通假字专项·第7题", "t": "填空题", "stem": "指出下列句子中的通假字并解释其含义：\n当窗理云鬓，对镜帖．花黄（    ）通（    ），释义：__________", "ans": "“帖”通“贴”，粘贴、贴上", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】《木兰诗》。帖：通“贴”，粘贴。"}, {"s": "板块五：上海中考真题与模拟·课内文言字词释义与多义通假", "sid": "sh-words", "n": 38, "id": "sh-words-336", "tag": "通假字专项·第8题", "t": "填空题", "stem": "指出下列句子中的通假字并解释其含义：\n火齐．之所及也（    ）通（    ），释义：__________", "ans": "“齐”通“剂”，药剂、汤药", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】《韩非子·扁鹊见蔡桓公》。火齐：汤药剂。"}, {"s": "板块五：上海中考真题与模拟·课内文言字词释义与多义通假", "sid": "sh-words", "n": 39, "id": "sh-words-337", "tag": "通假字专项·第9题", "t": "填空题", "stem": "指出下列句子中的通假字并解释其含义：\n学而时习之，不亦说．乎（    ）通（    ），释义：__________", "ans": "“说”通“悦”，愉快、喜悦", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】《论语·学而》。说（yuè）：通“悦”，高兴。"}, {"s": "板块五：上海中考真题与模拟·课内文言字词释义与多义通假", "sid": "sh-words", "n": 40, "id": "sh-words-338", "tag": "通假字专项·第10题", "t": "填空题", "stem": "指出下列句子中的通假字并解释其含义：\n食马者不知其能千里而食也，才美不外见．（    ）通（    ），释义：__________", "ans": "“见”通“现”，表露、显现", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】韩愈《马说》。见（xiàn）：通“现”，显露。"}, {"s": "板块五：上海中考真题与模拟·课内文言字词释义与多义通假", "sid": "sh-words", "n": 41, "id": "sh-words-339", "tag": "通假字专项·第11题", "t": "填空题", "stem": "指出下列句子中的通假字并解释其含义：\n寒暑易节，始一反．焉（    ）通（    ），释义：__________", "ans": "“反”通“返”，往返、返回", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】《愚公移山》。反：通“返”，返回。"}, {"s": "板块五：上海中考真题与模拟·课内文言字词释义与多义通假", "sid": "sh-words", "n": 42, "id": "sh-words-340", "tag": "通假字专项·第12题", "t": "填空题", "stem": "指出下列句子中的通假字并解释其含义：\n政通人和，百废具．兴（    ）通（    ），释义：__________", "ans": "“具”通“俱”，全、都", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】范仲淹《岳阳楼记》。具：通“俱”，全都。"}, {"s": "板块五：上海中考真题与模拟·课内文言字词释义与多义通假", "sid": "sh-words", "n": 43, "id": "sh-words-341", "tag": "通假字专项·第13题", "t": "填空题", "stem": "指出下列句子中的通假字并解释其含义：\n孰为汝多知．乎（    ）通（    ），释义：__________", "ans": "“知”通“智”，聪明、智慧", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】《两小儿辩日》。知（zhì）：通“智”，智慧。"}, {"s": "板块五：上海中考真题与模拟·课内文言字词释义与多义通假", "sid": "sh-words", "n": 44, "id": "sh-words-342", "tag": "通假字专项·第14题", "t": "填空题", "stem": "指出下列句子中的通假字并解释其含义：\n同舍生皆被．绮绣（    ）通（    ），释义：__________", "ans": "“被”通“披”，穿、披在身上", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】宋濂《送东阳马生序》。被（pī）：通“披”，穿戴。"}, {"s": "板块五：上海中考真题与模拟·课内文言字词释义与多义通假", "sid": "sh-words", "n": 45, "id": "sh-words-343", "tag": "通假字专项·第15题", "t": "填空题", "stem": "指出下列句子中的通假字并解释其含义：\n故不．错．意也（    ）通（    ），释义：__________", "ans": "“错”通“措”，放置、安放、放在心上", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】《战国策·唐雎不辱使命》。错：通“措”，置意、放在心上。"}, {"s": "板块五：上海中考真题与模拟·课内文言字词释义与多义通假", "sid": "sh-words", "n": 46, "id": "sh-words-344", "tag": "通假字专项·第16题", "t": "填空题", "stem": "指出下列句子中的通假字并解释其含义：\n满坐．寂然，无敢哗者（    ）通（    ），释义：__________", "ans": "“坐”通“座”，座位、全座的人", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】林嗣环《口技》。坐：通“座”，指满座的人。"}, {"s": "板块五：上海中考真题与模拟·课内文言字词释义与多义通假", "sid": "sh-words", "n": 47, "id": "sh-words-345", "tag": "通假字专项·第17题", "t": "填空题", "stem": "指出下列句子中的通假字并解释其含义：\n尊君在不．（    ）通（    ），释义：__________", "ans": "“不”通“否”，表询问句末语气词", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】《世说新语·陈太丘与友期行》。不（fǒu）：通“否”。"}, {"s": "板块五：上海中考真题与模拟·课内文言字词释义与多义通假", "sid": "sh-words", "n": 48, "id": "sh-words-346", "tag": "通假字专项·第18题", "t": "填空题", "stem": "指出下列句子中的通假字并解释其含义：\n寡助之至，亲戚畔．之（    ）通（    ），释义：__________", "ans": "“畔”通“叛”，背叛", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】《孟子·得道多助，失道寡助》。畔：通“叛”，背叛。"}, {"s": "板块五：上海中考真题与模拟·课内文言字词释义与多义通假", "sid": "sh-words", "n": 49, "id": "sh-words-347", "tag": "通假字专项·第19题", "t": "填空题", "stem": "指出下列句子中的通假字并解释其含义：\n入则无法家拂．士（    ）通（    ），释义：__________", "ans": "“拂”通“弼”，辅弼、辅佐", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】《生于忧患，死于安乐》。拂（bì）：通“弼”，辅佐大臣。"}, {"s": "板块五：上海中考真题与模拟·课内文言字词释义与多义通假", "sid": "sh-words", "n": 50, "id": "sh-words-348", "tag": "通假字专项·第20题", "t": "填空题", "stem": "指出下列句子中的通假字并解释其含义：\n自三峡七百里中，两岸连山，略无阙．处（    ）通（    ），释义：__________", "ans": "“阙”通“缺”，中断、缺口", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】郦道元《三峡》。阙（quē）：通“缺”，空缺、中断。"}, {"s": "板块五：上海中考真题与模拟·课内文言字词释义与多义通假", "sid": "sh-words", "n": 51, "id": "sh-words-349", "tag": "古今异义专项·第1题", "t": "填空题", "stem": "指出加点词的古今异义：\n阡陌交通．．，鸡犬相闻\n古义：__________；今义：__________", "ans": "古义：交错相通；今义：交通运输业或往来通行的车辆行人", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】《桃花源记》。交：交叉；通：通达。"}, {"s": "板块五：上海中考真题与模拟·课内文言字词释义与多义通假", "sid": "sh-words", "n": 52, "id": "sh-words-350", "tag": "古今异义专项·第2题", "t": "填空题", "stem": "指出加点词的古今异义：\n率妻子．．邑人来此绝境\n古义：__________；今义：__________", "ans": "古义：妻子和儿女（两个词）；今义：男子的配偶（单指妻子一人）", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】《桃花源记》。古代妻为妻室，子为子女。"}, {"s": "板块五：上海中考真题与模拟·课内文言字词释义与多义通假", "sid": "sh-words", "n": 53, "id": "sh-words-351", "tag": "古今异义专项·第3题", "t": "填空题", "stem": "指出加点词的古今异义：\n来此绝境．．\n古义：__________；今义：__________", "ans": "古义：与人世隔绝的地方；今义：没有出路、走投无路的绝望境地", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】《桃花源记》。绝：断绝；境：界地。"}, {"s": "板块五：上海中考真题与模拟·课内文言字词释义与多义通假", "sid": "sh-words", "n": 54, "id": "sh-words-352", "tag": "古今异义专项·第4题", "t": "填空题", "stem": "指出加点词的古今异义：\n乃不知有汉，无论．．魏晋\n古义：__________；今义：__________", "ans": "古义：不要说、更不必说；今义：表条件的连词", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】《桃花源记》。无：不；论：议论、谈及。"}, {"s": "板块五：上海中考真题与模拟·课内文言字词释义与多义通假", "sid": "sh-words", "n": 55, "id": "sh-words-353", "tag": "古今异义专项·第5题", "t": "填空题", "stem": "指出加点词的古今异义：\n牺牲．．玉帛，弗敢加也\n古义：__________；今义：__________", "ans": "古义：祭祀用的纯色牛羊猪等牲畜；今义：为了正义放弃生命或利益", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】《曹刿论战》。古代指祭祀用的毛色纯一的牺牲。"}, {"s": "板块五：上海中考真题与模拟·课内文言字词释义与多义通假", "sid": "sh-words", "n": 56, "id": "sh-words-354", "tag": "古今异义专项·第6题", "t": "填空题", "stem": "指出加点词的古今异义：\n小大之狱．，虽不能察\n古义：__________；今义：__________", "ans": "古义：诉讼案件；今义：监牢、监狱", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】《曹刿论战》。狱：案件。"}, {"s": "板块五：上海中考真题与模拟·课内文言字词释义与多义通假", "sid": "sh-words", "n": 57, "id": "sh-words-355", "tag": "古今异义专项·第7题", "t": "填空题", "stem": "指出加点词的古今异义：\n可以．．一战，战则请从\n古义：__________；今义：__________", "ans": "古义：可以凭借（“可”可以 + “以”凭借）；今义：表示许可、可能", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】《曹刿论战》。两个词连用，以凭借鲁庄公取信于民之德。"}, {"s": "板块五：上海中考真题与模拟·课内文言字词释义与多义通假", "sid": "sh-words", "n": 58, "id": "sh-words-356", "tag": "古今异义专项·第8题", "t": "填空题", "stem": "指出加点词的古今异义：\n委而去．之，是地利不如人和也\n古义：__________；今义：__________", "ans": "古义：离开；今义：从所在地到别的地方（前往）", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】《孟子·公孙丑下》。去：离去、离开。"}, {"s": "板块五：上海中考真题与模拟·课内文言字词释义与多义通假", "sid": "sh-words", "n": 59, "id": "sh-words-357", "tag": "古今异义专项·第9题", "t": "填空题", "stem": "指出加点词的古今异义：\n扁鹊望桓侯而还走．\n古义：__________；今义：__________", "ans": "古义：跑、快跑；今义：行走、漫步", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】《韩非子·喻老》。古代“走”指跑；“步”或“行”指走。"}, {"s": "板块五：上海中考真题与模拟·课内文言字词释义与多义通假", "sid": "sh-words", "n": 60, "id": "sh-words-358", "tag": "古今异义专项·第10题", "t": "填空题", "stem": "指出加点词的古今异义：\n舜发．于畎亩之中\n古义：__________；今义：__________", "ans": "古义：被起用、被任用；今义：发射、发出、散发", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】《生于忧患，死于安乐》。发：被提拔起用。"}, {"s": "板块五：上海中考真题与模拟·课内文言字词释义与多义通假", "sid": "sh-words", "n": 61, "id": "sh-words-359", "tag": "古今异义专项·第11题", "t": "填空题", "stem": "指出加点词的古今异义：\n城非不高也，池．非不深也\n古义：__________；今义：__________", "ans": "古义：护城河；今义：池塘、水池", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】《得道多助，失道寡助》。城：城墙；池：护城河。"}, {"s": "板块五：上海中考真题与模拟·课内文言字词释义与多义通假", "sid": "sh-words", "n": 62, "id": "sh-words-360", "tag": "古今异义专项·第12题", "t": "填空题", "stem": "指出加点词的古今异义：\n一鼓作气，再．而衰，三而竭\n古义：__________；今义：__________", "ans": "古义：第二次；今义：又一次、再次", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】《曹刿论战》。再：数词，第二次。"}, {"s": "板块五：上海中考真题与模拟·课内文言字词释义与多义通假", "sid": "sh-words", "n": 63, "id": "sh-words-361", "tag": "古今异义专项·第13题", "t": "填空题", "stem": "指出加点词的古今异义：\n烈士．．暮年，壮心不已\n古义：__________；今义：__________", "ans": "古义：有远大抱负、志向坚定的勇士；今义：为革命或正义事业献出生命的人", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】曹操《龟虽寿》。烈：刚烈有志；士：士人。"}, {"s": "板块五：上海中考真题与模拟·课内文言字词释义与多义通假", "sid": "sh-words", "n": 64, "id": "sh-words-362", "tag": "古今异义专项·第14题", "t": "填空题", "stem": "指出加点词的古今异义：\n中间．．力拉崩倒之声\n古义：__________；今义：__________", "ans": "古义：其中夹杂着（“中”其中 + “间”夹杂）；今义：中心、方位居中", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】林嗣环《口技》。间（jiàn）：夹杂。"}, {"s": "板块五：上海中考真题与模拟·课内文言字词释义与多义通假", "sid": "sh-words", "n": 65, "id": "sh-words-363", "tag": "古今异义专项·第15题", "t": "填空题", "stem": "指出加点词的古今异义：\n寻．病终，后遂无问津者\n古义：__________；今义：__________", "ans": "古义：不久、随即；今义：寻找、搜寻", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】《桃花源记》。寻：时间副词，不久。"}, {"s": "板块五：上海中考真题与模拟·课内文言字词释义与多义通假", "sid": "sh-words", "n": 66, "id": "sh-words-364", "tag": "古今异义专项·第16题", "t": "填空题", "stem": "指出加点词的古今异义：\n先帝不以臣卑鄙．．\n古义：__________；今义：__________", "ans": "古义：身份低微，见识浅陋（谦词）；今义：语言品质恶劣、下流", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】诸葛亮《出师表》。卑：身份低微；鄙：见识浅陋。"}, {"s": "板块五：上海中考真题与模拟·课内文言字词释义与多义通假", "sid": "sh-words", "n": 67, "id": "sh-words-365", "tag": "古今异义专项·第17题", "t": "填空题", "stem": "指出加点词的古今异义：\n未尝不叹息痛恨．．于桓、灵也\n古义：__________；今义：__________", "ans": "古义：痛心与遗憾；今义：极端憎恨、深恶痛绝", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】诸葛亮《出师表》。恨：遗憾、叹惋。"}, {"s": "板块五：上海中考真题与模拟·课内文言字词释义与多义通假", "sid": "sh-words", "n": 68, "id": "sh-words-366", "tag": "古今异义专项·第18题", "t": "填空题", "stem": "指出加点词的古今异义：\n臣本布衣．．，躬耕于南阳\n古义：__________；今义：__________", "ans": "古义：平民百姓（代指无官职者）；今义：布料做的衣服", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】诸葛亮《出师表》。布衣借代平民。"}, {"s": "板块五：上海中考真题与模拟·课内文言字词释义与多义通假", "sid": "sh-words", "n": 69, "id": "sh-words-367", "tag": "古今异义专项·第19题", "t": "填空题", "stem": "指出加点词的古今异义：\n由是感激．．，遂许先帝以驱驰\n古义：__________；今义：__________", "ans": "古义：感奋激发（内心感动奋发）；今义：深深感谢", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】诸葛亮《出师表》。感：感动；激：振奋。"}, {"s": "板块五：上海中考真题与模拟·课内文言字词释义与多义通假", "sid": "sh-words", "n": 70, "id": "sh-words-368", "tag": "古今异义专项·第20题", "t": "填空题", "stem": "指出加点词的古今异义：\n诚宜开张．．圣听，以光先帝遗德\n古义：__________；今义：__________", "ans": "古义：扩大、广开；今义：店铺开业营业", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】诸葛亮《出师表》。开张圣听：广开言路、扩大听取意见的途径。"}, {"s": "板块五：上海中考真题与模拟·课内文言字词释义与多义通假", "sid": "sh-words", "n": 71, "id": "sh-words-369", "tag": "一词多义专项·「食」", "t": "填空题", "stem": "解释下列各句中的加点字「食」：\n(1) 一食．或尽粟一石（__________）\n(2) 食．马者不知其能千里而食．也（__________ / __________）\n(3) 食．之不能尽其材（__________）", "ans": "(1) 吃一顿；(2) 喂养 / 喂养；(3) 喂养", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【考点分析】《马说》核心高频词。(1)动词，吃；(2)(3)通“饲”，喂养。"}, {"s": "板块五：上海中考真题与模拟·课内文言字词释义与多义通假", "sid": "sh-words", "n": 72, "id": "sh-words-370", "tag": "一词多义专项·「见」", "t": "填空题", "stem": "解释下列各句中的加点字「见」：\n(1) 才美不外见．（__________）\n(2) 见．往事耳（__________）\n(3) 有一牧童见．之（__________）\n(4) 何时眼前突兀见．此屋（__________）", "ans": "(1) 通“现”，显现；(2) 了解、晓得；(3) 看见；(4) 通“现”，出现", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】(1)《马说》；(2)《孙权劝学》；(3)《书戴嵩画牛》；(4)《茅屋为秋风所破歌》。"}, {"s": "板块五：上海中考真题与模拟·课内文言字词释义与多义通假", "sid": "sh-words", "n": 73, "id": "sh-words-371", "tag": "一词多义专项·「止」", "t": "填空题", "stem": "解释下列各句中的加点字「止」：\n(1) 担中肉尽，止．有剩骨（__________）\n(2) 一狼得骨止．，一狼仍从（__________）\n(3) 止．增笑耳（__________）", "ans": "(1) 副词，通“只”，只有、仅仅；(2) 动词，停止；(3) 副词，通“只”，仅仅", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】蒲松龄《狼》。"}, {"s": "板块五：上海中考真题与模拟·课内文言字词释义与多义通假", "sid": "sh-words", "n": 74, "id": "sh-words-372", "tag": "一词多义专项·「及」", "t": "填空题", "stem": "解释下列各句中的加点字「及」：\n(1) 及．鲁肃过寻阳（__________）\n(2) 徐公何能及．君也（__________）\n(3) 受任于败军之际．（__________）", "ans": "(1) 到了……的时候（等到）；(2) 比得上；(3) 时候、时机", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】(1)《孙权劝学》；(2)《邹忌讽齐王纳谏》；(3)《出师表》。"}, {"s": "板块五：上海中考真题与模拟·课内文言字词释义与多义通假", "sid": "sh-words", "n": 75, "id": "sh-words-373", "tag": "一词多义专项·「临」", "t": "填空题", "stem": "解释下列各句中的加点字「临」：\n(1) 执策而临．之（__________）\n(2) 故临．崩寄臣以大事也（__________）\n(3) 临．溪而渔，溪深而鱼肥（__________）\n(4) 临．表涕零，不知所言（__________）", "ans": "(1) 面对、靠近；(2) 将要、将近；(3) 来到、到……旁；(4) 面对", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】(1)《马说》；(2)《出师表》；(3)《醉翁亭记》；(4)《出师表》。"}, {"s": "板块五：上海中考真题与模拟·课内文言字词释义与多义通假", "sid": "sh-words", "n": 76, "id": "sh-words-374", "tag": "一词多义专项·「异」", "t": "填空题", "stem": "解释下列各句中的加点字「异」：\n(1) 渔人甚异．之（__________）\n(2) 览物之情，得无异．乎（__________）\n(3) 奇山异．水，天下独绝（__________）", "ans": "(1) 意动用法，对……感到惊异/奇怪；(2) 形容词，不同、差异；(3) 形容词，奇异、奇特", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】(1)《桃花源记》；(2)《岳阳楼记》；(3)《与朱元思书》。"}, {"s": "板块五：上海中考真题与模拟·课内文言字词释义与多义通假", "sid": "sh-words", "n": 77, "id": "sh-words-375", "tag": "一词多义专项·「穷」", "t": "填空题", "stem": "解释下列各句中的加点字「穷」：\n(1) 穷．冬烈风，大雪深数尺（__________）\n(2) 复前行，欲穷．其林（__________）\n(3) 蝉则千转不穷．（__________）", "ans": "(1) 穷尽、深冬、极其；(2) 动词，走到尽头；(3) 穷尽、停息", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】(1)《送东阳马生序》；(2)《桃花源记》；(3)《与朱元思书》。"}, {"s": "板块五：上海中考真题与模拟·课内文言字词释义与多义通假", "sid": "sh-words", "n": 78, "id": "sh-words-376", "tag": "一词多义专项·「固」", "t": "填空题", "stem": "解释下列各句中的加点字「固」：\n(1) 固．国不以山溪之险（__________）\n(2) 汝心之固．，固．不可彻（__________ / __________）\n(3) 齐人固．善盗乎（__________）", "ans": "(1) 巩固、稳固；(2) 顽固 / 固执、顽固；(3) 本来、原来", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】(1)《得道多助》；(2)《愚公移山》；(3)《晏子使楚》。"}, {"s": "板块五：上海中考真题与模拟·课内文言字词释义与多义通假", "sid": "sh-words", "n": 79, "id": "sh-words-377", "tag": "一词多义专项·「许」", "t": "填空题", "stem": "解释下列各句中的加点字「许」：\n(1) 潭中鱼可百许．头（__________）\n(2) 杂然相许．（__________）\n(3) 遂许．先帝以驱驰（__________）", "ans": "(1) 左右、上下（表概数）；(2) 赞同、同意；(3) 答应、允诺", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】(1)《小石潭记》；(2)《愚公移山》；(3)《出师表》。"}, {"s": "板块五：上海中考真题与模拟·课内文言字词释义与多义通假", "sid": "sh-words", "n": 80, "id": "sh-words-378", "tag": "一词多义专项·「策」", "t": "填空题", "stem": "解释下列各句中的加点字「策」：\n(1) 执策．而临之（__________）\n(2) 策．之不以其道（__________）\n(3) 策．勋十二转（__________）", "ans": "(1) 名词，马鞭；(2) 动词，鞭打、驱赶；(3) 动词，记下、记入功勋册", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】(1)(2)《马说》；(3)《木兰诗》。"}, {"s": "板块五：上海中考真题与模拟·课内文言字词释义与多义通假", "sid": "sh-words", "n": 81, "id": "sh-words-379", "tag": "文言字词专项·第81题", "t": "选择题", "stem": "为下列句中加点字选择最恰当的解释：\n策之不以其道．（    ）\nA. 道路       B. 道理、方法       C. 道德       D. 取道", "ans": "B", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】韩愈《马说》。道：法则、正确的方法。"}, {"s": "板块五：上海中考真题与模拟·课内文言字词释义与多义通假", "sid": "sh-words", "n": 82, "id": "sh-words-380", "tag": "文言字词专项·第82题", "t": "选择题", "stem": "为下列句中加点字选择最恰当的解释：\n生亦我所欲，所欲有甚．于生者（    ）\nA. 厉害       B. 超过       C. 甚至       D. 甚且", "ans": "B", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】《孟子·鱼我所欲也》。甚于：超过。"}, {"s": "板块五：上海中考真题与模拟·课内文言字词释义与多义通假", "sid": "sh-words", "n": 83, "id": "sh-words-381", "tag": "文言字词专项·第83题", "t": "选择题", "stem": "为下列句中加点字选择最恰当的解释：\n肉食者鄙．，未能远谋（    ）\nA. 卑鄙       B. 粗俗       C. 目光短浅、见识浅陋       D. 偏远", "ans": "C", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】《曹刿论战》。鄙：目光短浅、见识浅陋。"}, {"s": "板块五：上海中考真题与模拟·课内文言字词释义与多义通假", "sid": "sh-words", "n": 84, "id": "sh-words-382", "tag": "文言字词专项·第84题", "t": "选择题", "stem": "为下列句中加点字选择最恰当的解释：\n公将驰．之（    ）\nA. 逃跑       B. 驱车追赶       C. 奔驰       D. 传布", "ans": "B", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】《曹刿论战》。驰：驱车追赶。"}, {"s": "板块五：上海中考真题与模拟·课内文言字词释义与多义通假", "sid": "sh-words", "n": 85, "id": "sh-words-383", "tag": "文言字词专项·第85题", "t": "选择题", "stem": "为下列句中加点字选择最恰当的解释：\n望其旗靡．，故逐之（    ）\nA. 倒下       B. 奢靡       C. 破烂       D. 摇晃", "ans": "A", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】《曹刿论战》。靡（mǐ）：倒下。"}, {"s": "板块五：上海中考真题与模拟·课内文言字词释义与多义通假", "sid": "sh-words", "n": 86, "id": "sh-words-384", "tag": "文言字词专项·第86题", "t": "填空题", "stem": "解释下列句中加点字：\n士不可以不弘毅．．：__________", "ans": "刚强勇毅、坚强不屈（弘：宽广；毅：刚强）", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】《论语·泰伯》。“士不可以不弘毅，任重而道远”。"}, {"s": "板块五：上海中考真题与模拟·课内文言字词释义与多义通假", "sid": "sh-words", "n": 87, "id": "sh-words-385", "tag": "文言字词专项·第87题", "t": "填空题", "stem": "解释下列句中加点字：\n朝服衣冠，窥．镜：__________", "ans": "照、看", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】《邹忌讽齐王纳谏》。窥：照看、暗中察看。"}, {"s": "板块五：上海中考真题与模拟·课内文言字词释义与多义通假", "sid": "sh-words", "n": 88, "id": "sh-words-386", "tag": "文言字词专项·第88题", "t": "填空题", "stem": "解释下列句中加点字：\n吾妻之美．我者，私我也：__________", "ans": "形容词意动用法，认为……美", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】《邹忌讽齐王纳谏》。美：以……为美、认为……漂亮。"}, {"s": "板块五：上海中考真题与模拟·课内文言字词释义与多义通假", "sid": "sh-words", "n": 89, "id": "sh-words-387", "tag": "文言字词专项·第89题", "t": "填空题", "stem": "解释下列句中加点字：\n时时而间．进：__________", "ans": "间或、偶然", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】《邹忌讽齐王纳谏》。间（jiàn）：副词，间或、偶尔。"}, {"s": "板块五：上海中考真题与模拟·课内文言字词释义与多义通假", "sid": "sh-words", "n": 90, "id": "sh-words-388", "tag": "文言字词专项·第90题", "t": "填空题", "stem": "解释下列句中加点字：\n期．年之后：__________", "ans": "满一年（整一年）", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】《邹忌讽齐王纳谏》。期（jī）
