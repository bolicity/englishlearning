<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>上海中考语文真题全收录 · 基础题库背诵版（真题与各区模拟 528 题）</title>
<style>
:root{
  --bg:#F8FAFC; --card:#FFFFFF; --subtle:#F1F5F9; --border:#E2E8F0;
  --tx:#0F172A; --tx2:#475569; --mut:#64748B; --red:#DC2626; --red-l:#EF4444; --red-bg:#FEF2F2;
  --green:#059669; --green-bg:#ECFDF5; --amber:#D97706; --amber-bg:#FFFBEB;
  --blue:#1D4ED8; --blue-bg:#EFF6FF;
  --serif:"Songti SC","STSong","Noto Serif SC","SimSun",serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:-apple-system,"PingFang SC","Inter",sans-serif;background:var(--bg);color:var(--tx);line-height:1.6;display:flex}

/* ---------- 左侧目录（可折叠） ---------- */
#sidebar{width:264px;flex:none;background:var(--card);border-right:1px solid var(--border);
  display:flex;flex-direction:column;height:100vh;position:sticky;top:0;transition:margin-left .25s ease;z-index:40}
body.collapsed #sidebar{margin-left:-264px}
#side-head{padding:1rem 1rem .8rem;border-bottom:1px solid var(--border)}
#side-head h1{font-size:1.02rem;font-weight:800;color:var(--red)}
#side-head p{font-size:.72rem;color:var(--mut)}
#sec-list{flex:1;overflow-y:auto;padding:.5rem}
.sec{border-radius:9px;margin-bottom:2px;cursor:pointer;user-select:none}
.sec-row{display:flex;align-items:center;gap:.5rem;padding:.5rem .6rem;border-radius:9px}
.sec:hover{background:var(--subtle)}
.sec.active{background:var(--red-bg)}
.sec-name{flex:1;font-size:.82rem;font-weight:600;color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sec.active .sec-name{color:var(--red)}
.sec-n{font-size:.68rem;color:var(--mut);flex:none}
.sec-dot{width:6px;height:6px;border-radius:50%;background:var(--border);flex:none}
.sec-dot.full{background:var(--green)}
#side-foot{padding:.7rem 1rem;border-top:1px solid var(--border);font-size:.7rem;color:var(--mut)}
#progress-line{height:6px;border-radius:3px;background:var(--subtle);margin-top:.45rem;overflow:hidden}
#progress-fill{height:100%;background:linear-gradient(90deg,var(--red),var(--red-l));width:0;transition:width .3s}

/* ---------- 主区 ---------- */
#main{flex:1;display:flex;flex-direction:column;height:100vh;min-width:0}
#topbar{background:var(--card);border-bottom:1px solid var(--border);padding:.55rem .9rem;
  display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;position:sticky;top:0;z-index:30}
#burger{border:1px solid var(--border);background:var(--card);border-radius:8px;width:34px;height:34px;
  cursor:pointer;font-size:1rem;color:var(--tx2);flex:none}
.modes{display:flex;border:1px solid var(--border);border-radius:9px;overflow:hidden;flex:none}
.modes button{border:0;background:var(--card);padding:.42rem .8rem;font-size:.8rem;font-weight:600;color:var(--mut);cursor:pointer}
.modes button.on{background:var(--red);color:#fff}
#search{flex:1;min-width:150px;border:1px solid var(--border);border-radius:9px;padding:.45rem .7rem;font-size:.85rem;outline:none;background:var(--subtle)}
#search:focus{border-color:var(--red-l);background:#fff}
.fchip{border:1px solid var(--border);background:var(--card);border-radius:9px;padding:.42rem .7rem;
  font-size:.78rem;font-weight:600;color:var(--mut);cursor:pointer;flex:none}
.fchip.on{background:var(--amber-bg);border-color:#FDE68A;color:var(--amber)}
.fchip.ans-on{background:var(--green-bg);border-color:#A7F3D0;color:var(--green)}
.fchip.jx-on{background:var(--blue-bg);border-color:#BFDBFE;color:var(--blue)}
#view{flex:1;overflow-y:auto;padding:.8rem 1.1rem 3rem}

/* ---------- 背诵卡（紧凑版） ---------- */
#card-wrap{max-width:760px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:1rem 1.15rem;box-shadow:0 1px 3px rgba(15,23,42,.06)}
.meta{display:flex;gap:.35rem;flex-wrap:wrap;align-items:center;margin-bottom:.55rem}
.chip{font-size:.64rem;font-weight:700;padding:.1rem .46rem;border-radius:99px;background:var(--red-bg);color:var(--red)}
.chip.gray{background:var(--subtle);color:var(--mut)}
.stem{font-family:var(--serif);font-size:1rem;line-height:1.75;white-space:pre-wrap;color:var(--tx)}
.stem .blank{color:var(--red);font-weight:700;letter-spacing:.05em}
.imgbox{margin-top:.55rem;border:1px solid var(--border);border-radius:9px;overflow:hidden;background:var(--subtle);display:none}
.imgbox img{display:block;margin:0 auto;max-width:100%;max-height:64vh;cursor:zoom-in}
.imgbox.show{display:block}
#reveal-btn{display:block;width:100%;margin-top:.7rem;padding:.58rem;border:0;border-radius:9px;
  background:var(--red);color:#fff;font-size:.84rem;font-weight:700;cursor:pointer}
#reveal-btn:hover{background:var(--red-l)}
.answer{display:none;margin-top:.7rem;border-radius:10px;padding:.7rem .85rem;background:var(--green-bg);border:1px solid #A7F3D0}
.answer.show{display:block}
.answer .alabel{font-size:.64rem;font-weight:800;color:var(--green);margin-bottom:.25rem}
.answer .atext{font-family:var(--serif);font-size:1rem;line-height:1.72;color:#064E3B;white-space:pre-wrap}
.answer img{max-width:100%;border-radius:8px;margin-top:.4rem;display:block;cursor:zoom-in}
/* 解析块 */
.jx{margin-top:.7rem;padding-top:.6rem;border-top:1px dashed #6EE7B7}
.jxlabel{font-size:.64rem;font-weight:800;color:var(--blue);margin-bottom:.3rem;letter-spacing:.02em}
.jxtext{font-family:var(--serif);font-size:.98rem;line-height:1.72;color:var(--tx);white-space:pre-wrap}
.jxtext .k{color:var(--blue);font-weight:700}
body.nojx .jx{display:none}
.ops{display:flex;gap:.5rem;margin-top:.7rem;flex-wrap:wrap}
.ops button{flex:1;min-width:110px;padding:.52rem;border-radius:9px;border:1px solid var(--border);
  background:var(--card);font-size:.78rem;font-weight:700;color:var(--tx2);cursor:pointer}
.ops .know{background:var(--green);border-color:var(--green);color:#fff}
.ops .know.on{background:var(--green-bg);color:var(--green)}
.ops button:hover{filter:brightness(.97)}
.navrow{display:flex;justify-content:space-between;align-items:center;margin-top:.6rem;gap:.5rem}
.navrow button{border:1px solid var(--border);background:var(--card);border-radius:9px;padding:.42rem .8rem;
  font-size:.78rem;font-weight:600;color:var(--tx2);cursor:pointer}
.navrow button:hover{background:var(--subtle)}
#cardbar{height:4px;border-radius:3px;background:var(--subtle);overflow:hidden;margin-bottom:.55rem}
#cardbar-f{height:100%;background:var(--red-l);transition:width .25s}
.hint{text-align:center;color:var(--mut);font-size:.66rem;margin-top:.6rem}
.hint kbd{background:var(--subtle);border:1px solid var(--border);border-radius:4px;padding:0 .3rem;font-size:.62rem}

/* ---------- 速览 ---------- */
#list{max-width:860px;margin:0 auto}
.li{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:.8rem .95rem;margin-bottom:.55rem;cursor:pointer}
.li:hover{border-color:var(--red-l)}
.li-head{display:flex;gap:.45rem;align-items:center;margin-bottom:.3rem}
.li-n{font-size:.7rem;font-weight:800;color:var(--mut)}
.li-sect{font-size:.68rem;color:var(--mut);background:var(--subtle);border-radius:99px;padding:.05rem .5rem}
.li-know{margin-left:auto;font-size:.68rem;color:var(--green);font-weight:700}
.li-stem{font-family:var(--serif);font-size:1rem;line-height:1.85;white-space:pre-wrap}
.li-ans{margin-top:.45rem;font-family:var(--serif);font-size:1rem;line-height:1.8;color:var(--green);
  background:var(--green-bg);border-radius:8px;padding:.45rem .7rem;white-space:pre-wrap}
.li img.qimg{margin-top:.5rem;max-width:min(420px,100%);border-radius:8px;border:1px solid var(--border);display:block}
.li-jx{margin-top:.45rem;font-family:var(--serif);font-size:.92rem;line-height:1.7;color:var(--tx2);
  border-left:3px solid #BFDBFE;padding-left:.6rem}
.li-jx .k{color:var(--blue);font-weight:700}
body.nojx .li-jx{display:none}
mark{background:#FEF08A;border-radius:3px;padding:0 1px}
.empty{text-align:center;color:var(--mut);padding:3rem 1rem;font-size:.9rem}
@media (max-width:760px){
  #sidebar{position:fixed;left:0;top:0;box-shadow:4px 0 16px rgba(0,0,0,.08)}
  body:not(.collapsed) #sidebar{margin-left:0}
  body.collapsed #sidebar{margin-left:-280px}
  #main{width:100%}
}

/* ---------- 快速选题面板与答题卡 (Picker Modal) ---------- */
.picker-pill{
  display:inline-flex;align-items:center;gap:.4rem;padding:.36rem .85rem;
  border:1px solid var(--border);border-radius:99px;background:var(--subtle);
  font-size:.82rem;font-weight:700;color:var(--tx);cursor:pointer;transition:all .15s;
}
.picker-pill:hover{background:var(--red-bg);border-color:var(--red-l);color:var(--red)}
.picker-pill-sub{
  font-size:.7rem;color:var(--mut);font-weight:600;padding:.08rem .45rem;
  border-radius:99px;background:#fff;border:1px solid var(--border);
}
.picker-pill:hover .picker-pill-sub{color:var(--red);border-color:#FECACA}

.pos-banner{
  background:var(--blue-bg);border:1px solid #BFDBFE;border-radius:10px;
  padding:.5rem .85rem;margin-bottom:.7rem;display:flex;align-items:center;
  justify-content:space-between;gap:.6rem;font-size:.78rem;color:var(--blue);
  animation:fadeSlideIn .25s ease;
}
.pos-banner b{font-weight:700}
.pos-banner-btn{
  border:1px solid #BFDBFE;background:#fff;color:var(--blue);border-radius:6px;
  padding:.18rem .5rem;font-size:.72rem;font-weight:700;cursor:pointer;flex:none;
}
.pos-banner-btn:hover{background:var(--blue);color:#fff}
.pos-banner-close{border:0;background:transparent;color:var(--blue);cursor:pointer;font-size:1rem;line-height:1;padding:0 .2rem}

.modal-mask{
  position:fixed;top:0;left:0;right:0;bottom:0;
  background:rgba(15,23,42,.5);backdrop-filter:blur(3px);
  z-index:999;display:none;align-items:center;justify-content:center;
  padding:1rem;opacity:0;transition:opacity .2s ease;
}
.modal-mask.show{display:flex;opacity:1}
.modal-box{
  background:var(--card);border:1px solid var(--border);border-radius:16px;
  width:100%;max-width:700px;max-height:86vh;
  box-shadow:0 20px 25px -5px rgba(0,0,0,.18), 0 8px 10px -6px rgba(0,0,0,.1);
  display:flex;flex-direction:column;overflow:hidden;
  animation:modalScale .2s cubic-bezier(.16,1,.3,1);
}
@keyframes modalScale{from{transform:scale(.95);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes fadeSlideIn{from{transform:translateY(-6px);opacity:0}to{transform:translateY(0);opacity:1}}

.modal-head{
  padding:.85rem 1.15rem;border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;gap:.5rem;
  background:#fff;flex:none;
}
.modal-head h3{font-size:1.02rem;font-weight:800;color:var(--tx);display:flex;align-items:center;gap:.4rem}
.modal-head p{font-size:.74rem;color:var(--mut);margin-top:1px}
.modal-close-btn{
  border:0;background:var(--subtle);border-radius:8px;
  width:32px;height:32px;font-size:1.15rem;color:var(--mut);cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;transition:all .15s;
}
.modal-close-btn:hover{background:#FEE2E2;color:var(--red)}

.modal-tools{
  padding:.75rem 1.15rem;background:var(--bg);border-bottom:1px solid var(--border);
  display:flex;flex-direction:column;gap:.55rem;flex:none;
}
.jump-row{display:flex;align-items:center;gap:.45rem;flex-wrap:wrap}
.jump-input-box{
  display:inline-flex;align-items:center;gap:.3rem;background:#fff;
  border:1px solid var(--border);border-radius:8px;padding:.2rem .5rem;
}
.jump-input-box input{
  width:55px;border:none;outline:none;font-size:.88rem;
  font-weight:700;color:var(--tx);text-align:center;
}
.jump-submit{
  border:0;background:var(--red);color:#fff;border-radius:8px;
  padding:.38rem .75rem;font-size:.78rem;font-weight:700;cursor:pointer;
}
.jump-submit:hover{background:var(--red-l)}
.jump-quick{
  border:1px solid var(--border);background:#fff;color:var(--tx2);
  border-radius:8px;padding:.35rem .6rem;font-size:.75rem;font-weight:600;cursor:pointer;
}
.jump-quick:hover{border-color:var(--blue);color:var(--blue);background:var(--blue-bg)}

.filter-row{display:flex;align-items:center;justify-content:space-between;gap:.5rem;flex-wrap:wrap}
.picker-sec-select{
  border:1px solid var(--border);background:#fff;border-radius:8px;
  padding:.32rem .55rem;font-size:.78rem;font-weight:600;color:var(--tx);outline:none;
}
.picker-tabs{display:flex;gap:.25rem}
.ptab{
  border:1px solid var(--border);background:#fff;border-radius:7px;
  padding:.28rem .55rem;font-size:.74rem;font-weight:600;color:var(--tx2);cursor:pointer;
}
.ptab.active{background:var(--red);border-color:var(--red);color:#fff}

.modal-body{flex:1;overflow-y:auto;padding:.9rem 1.15rem}
.picker-grid{
  display:grid;grid-template-columns:repeat(auto-fill, minmax(46px, 1fr));gap:.45rem;
}
.q-btn{
  position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;
  aspect-ratio:1;border-radius:9px;border:1px solid var(--border);background:#fff;
  font-size:.82rem;font-weight:700;color:var(--tx2);cursor:pointer;
  transition:all .12s ease;user-select:none;padding:.15rem;
}
.q-btn:hover{border-color:var(--red-l);transform:translateY(-1px);box-shadow:0 2px 4px rgba(0,0,0,.08)}
.q-btn.current{
  border-color:var(--red);background:var(--red-bg);color:var(--red);font-weight:800;
  box-shadow:0 0 0 2px rgba(239,68,68,.3);
}
.q-btn.known{
  background:var(--green-bg);border-color:#A7F3D0;color:var(--green);
}
.q-btn.known.current{
  box-shadow:0 0 0 2px var(--green);border-color:var(--green);
}
.q-btn-sub{
  font-size:.56rem;font-weight:600;line-height:1;margin-top:1px;color:inherit;opacity:.75;
}
.q-btn-dot{
  position:absolute;top:3px;right:3px;width:5px;height:5px;border-radius:50%;
  background:var(--green);
}
.q-btn.current .q-btn-dot{background:var(--red)}

.modal-foot{
  padding:.6rem 1.15rem;border-top:1px solid var(--border);background:#fff;
  display:flex;align-items:center;justify-content:space-between;gap:.5rem;
  font-size:.72rem;color:var(--mut);flex-wrap:wrap;flex:none;
}
.legend-group{display:flex;gap:.7rem;align-items:center}
.legend-item{display:inline-flex;align-items:center;gap:.3rem}
.legend-dot{width:7px;height:7px;border-radius:50%;display:inline-block}
.legend-dot.cur{background:var(--red)}
.legend-dot.kn{background:var(--green)}
.legend-dot.un{background:var(--border)}

</style>
</head>
<body class="collapsed-init">
<nav id="sidebar">
  <div id="side-head">
    <h1>上海中考语文真题与模拟题库</h1>
    <p>2008–2026 全套真题 + 各区一模二模 · 528 题全量收录（默写 / 诗词赏析 / 字词通假 / 句子翻译 / 名著阅读 / 综合语用）</p>
  </div>
  <div id="sec-list"></div>
  <div id="side-foot">
    <span id="foot-label">总进度 0 / 528</span>
    <div id="progress-line"><div id="progress-fill"></div></div>
    <div id="jx-label" style="margin-top:.35rem"></div>
  </div>
</nav>

<div id="main">
  <div id="topbar">
    <a href="chinese.html" style="display:inline-flex; align-items:center; gap:4px; padding:0.38rem 0.7rem; border:1px solid var(--border); border-radius:8px; font-size:0.8rem; font-weight:600; text-decoration:none; color:var(--tx2); background:var(--card); flex:none; margin-right:4px;" title="返回初中语文复习中心"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg> 语文中心</a>
    <button id="burger" title="收起 / 展开目录">☰</button>
    <div class="modes">
      <button id="m-recite" class="on">背诵</button>
      <button id="m-browse">速览</button>
    </div>
    <button class="fchip" id="top-picker-btn" title="选题答题卡 / 快速跳题 (快捷键 G)">📋 选题 (第<span id="top-qnum">1</span>题)</button>
    <input id="search" type="search" placeholder="搜索题干 / 答案…（快捷键 /）">
    <button class="fchip ans-on" id="f-ans" title="开关：答案是否随题一起展开">答案默认展开</button>
    <button class="fchip jx-on" id="f-jx" title="开关：是否显示答案解析">显示解析</button>
    <button class="fchip" id="f-todo">只看未背熟</button>
    <button class="fchip" id="f-img" title="筛选情境理解性默写与情境应用题">情境题专项</button>
  </div>
  <div id="view"></div>
</div>

<div id="picker-modal" class="modal-mask" onclick="closePickerModal()">
  <div class="modal-box" onclick="event.stopPropagation()">
    <div class="modal-head">
      <div>
        <h3 id="picker-title">📋 题库选题卡 · 快速跳题</h3>
        <p id="picker-subtitle">全部板块 · 共 528 题 · 已熟 0 / 528</p>
      </div>
      <button class="modal-close-btn" id="picker-close-btn" title="关闭 (Esc)">✕</button>
    </div>
    <div class="modal-tools">
      <div class="jump-row">
        <div class="jump-input-box">
          <span style="font-size:0.75rem;color:var(--mut)">跳至第</span>
          <input type="number" id="jump-val" min="1" placeholder="题号">
          <span style="font-size:0.75rem;color:var(--mut)">题</span>
        </div>
        <button class="jump-submit" id="jump-submit-btn">前往</button>
        <button class="jump-quick" id="jump-first-unmastered">首个未背熟</button>
        <button class="jump-quick" id="jump-first-btn">第 1 题</button>
        <button class="jump-quick" id="jump-last-btn">末题</button>
      </div>
      <div class="filter-row">
        <div style="display:flex;align-items:center;gap:4px">
          <label for="picker-sec-select" style="font-size:0.74rem;color:var(--mut);font-weight:600">板块：</label>
          <select id="picker-sec-select" class="picker-sec-select"></select>
        </div>
        <div class="picker-tabs">
          <button class="ptab active" data-tab="all" id="tab-all">全部 <span id="cnt-all">(0)</span></button>
          <button class="ptab" data-tab="todo" id="tab-todo">未背 <span id="cnt-todo">(0)</span></button>
          <button class="ptab" data-tab="done" id="tab-done">已背 <span id="cnt-done">(0)</span></button>
        </div>
      </div>
    </div>
    <div class="modal-body">
      <div class="picker-grid" id="picker-grid"></div>
    </div>
    <div class="modal-foot">
      <div class="legend-group">
        <span class="legend-item"><span class="legend-dot cur"></span> 当前学习</span>
        <span class="legend-item"><span class="legend-dot kn"></span> 已背熟</span>
        <span class="legend-item"><span class="legend-dot un"></span> 未背熟</span>
      </div>
      <div>支持快捷键 <kbd>G</kbd> 开启 · <kbd>Esc</kbd> 关闭</div>
    </div>
  </div>

<script>

, "sid": "sh-moxie", "n": 5, "id": "sh-moxie-5", "tag": "2025上海中考第1(1)题", "t": "名句默写", "stem": "造化钟神秀，______________________。（杜甫《望岳》）", "ans": "阴阳割昏晓", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】唐代杜甫《望岳》。\n【考点分析】写泰山神奇秀美，巍峨高耸遮蔽天日。\n【易错字提示】「割」字右边为立刀旁，切勿误写；「晓」字右半部为“尧”，右上无点。"}, {"s": "板块一：历年中考真题·名句默写与情境运用", "sid": "sh-moxie", "n": 6, "id": "sh-moxie-6", "tag": "2025上海中考第1(2)题", "t": "名句默写", "stem": "山气日夕佳，______________________。（陶渊明《饮酒（其五）》）", "ans": "飞鸟相与还", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】东晋陶渊明《饮酒（其五）》。\n【考点分析】直接考查田园诗名句默写。夕阳西下，飞鸟相伴归巢。\n【易错字提示】「与」切勿写漏笔画；「还」注意走之底。"}, {"s": "板块一：历年中考真题·名句默写与情境运用", "sid": "sh-moxie", "n": 7, "id": "sh-moxie-7", "tag": "2025上海中考第1(3)题", "t": "名句默写", "stem": "______________________，听取蛙声一片。（辛弃疾《西江月·夜行黄沙道中》）", "ans": "稻花香里说丰年", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】南宋辛弃疾《西江月·夜行黄沙道中》。\n【考点分析】名篇名句上句识记。\n【易错字提示】「稻」字为禾木旁加舀；「丰」字三横一竖。"}, {"s": "板块一：历年中考真题·名句默写与情境运用", "sid": "sh-moxie", "n": 8, "id": "sh-moxie-8", "tag": "2025上海中考第1(4)题", "t": "情境默写", "stem": "小申同学在阅读时明白，作为当代的中国青年需要心怀家国，以天下为己任的人生目标，正如范仲淹在《岳阳楼记》中所写的那样：“______________________，______________________。”", "ans": "先天下之忧而忧，后天下之乐而乐", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】北宋范仲淹《岳阳楼记》。\n【情境剖析】题干关键词为“当代中国青年心怀家国，以天下为己任”，精准对应范仲淹表达政治抱负的名句。\n【易错字提示】注意「忧」与「乐」字的书写。"}, {"s": "板块一：历年中考真题·名句默写与情境运用", "sid": "sh-moxie", "n": 9, "id": "sh-moxie-9", "tag": "2024上海中考第1(1)题", "t": "名句默写", "stem": "醉里挑灯看剑，______________________。（辛弃疾《破阵子·为陈同甫赋壮词以寄之》）", "ans": "梦回吹角连营", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】南宋辛弃疾《破阵子·为陈同甫赋壮词以寄之》。\n【易错字提示】「角」刀字头勿写漏；「营」草字头加两个口一个冖一个吕。"}, {"s": "板块一：历年中考真题·名句默写与情境运用", "sid": "sh-moxie", "n": 10, "id": "sh-moxie-10", "tag": "2024上海中考第1(2)题", "t": "名句默写", "stem": "枯藤老树昏鸦，______________________。（马致远《天净沙·秋思》）", "ans": "小桥流水人家", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】元代马致远《天净沙·秋思》。\n【考点分析】元曲经典名句，九种秋景意象连缀，以乐景反衬游子之思乡羁旅。"}, {"s": "板块一：历年中考真题·名句默写与情境运用", "sid": "sh-moxie", "n": 11, "id": "sh-moxie-11", "tag": "2024上海中考第1(3)题", "t": "名句默写", "stem": "______________________，在乎山水之间也。（欧阳修《醉翁亭记》）", "ans": "醉翁之意不在酒", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】北宋欧阳修《醉翁亭记》。\n【易错字提示】「醉」字酉字旁；「翁」字上公下羽。"}, {"s": "板块一：历年中考真题·名句默写与情境运用", "sid": "sh-moxie", "n": 12, "id": "sh-moxie-12", "tag": "2024上海中考第1(4)题", "t": "情境默写", "stem": "小张去夏日西湖游玩时，看见了美丽的花朵，浅浅的草坪，他可以用白居易《钱塘湖春行》中的“______________________，______________________”两句来表示。", "ans": "乱花渐欲迷人眼，浅草才能没马蹄", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】唐代白居易《钱塘湖春行》。\n【情境提示】“美丽的花朵”对应“乱花渐欲迷人眼”；“浅浅的草坪”对应“浅草才能没马蹄”。\n【易错字提示】「渐」三点水；「没」读 mò；「蹄」足字旁。"}, {"s": "板块一：历年中考真题·名句默写与情境运用", "sid": "sh-moxie", "n": 13, "id": "sh-moxie-13", "tag": "2023上海中考第1(1)题", "t": "名句默写", "stem": "山川之美，______________________。（陶弘景《答谢中书书》）", "ans": "古来共谈", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】南朝梁陶弘景《答谢中书书》。\n【考点分析】开篇总领全文，赞叹自然山水自古以来为高雅文士所赞赏。"}, {"s": "板块一：历年中考真题·名句默写与情境运用", "sid": "sh-moxie", "n": 14, "id": "sh-moxie-14", "tag": "2023上海中考第1(2)题", "t": "名句默写", "stem": "仍怜故乡水，______________________。（李白《渡荆门送别》）", "ans": "万里送行舟", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】唐代李白《渡荆门送别》。\n【考点分析】诗人初出蜀峡，借故乡之江水万里相送，表现对故园的依依不舍之深情。"}, {"s": "板块一：历年中考真题·名句默写与情境运用", "sid": "sh-moxie", "n": 15, "id": "sh-moxie-15", "tag": "2023上海中考第1(3)题", "t": "名句默写", "stem": "______________________，不亦乐乎？（《〈论语〉十二章》）", "ans": "有朋自远方来", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】《论语·学而》。\n【考点分析】儒家交友修身名句。“朋”指志同道合之人；“乐”读 lè。"}, {"s": "板块一：历年中考真题·名句默写与情境运用", "sid": "sh-moxie", "n": 16, "id": "sh-moxie-16", "tag": "2023上海中考第1(4)题", "t": "情境默写", "stem": "小申在美术馆欣赏一幅山景图，画面上神奇秀丽的高山耸入云端，太阳照射下山的两面阴暗不同，他不觉吟诵了杜甫《望岳》中的两句“______________________，______________________。”", "ans": "造化钟神秀，阴阳割昏晓", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】唐代杜甫《望岳》。\n【情境提示】“神奇秀丽的高山耸入云端”对应“造化钟神秀”；“太阳照射下山两面阴暗不同”对应“阴阳割昏晓”。"}, {"s": "板块一：历年中考真题·名句默写与情境运用", "sid": "sh-moxie", "n": 17, "id": "sh-moxie-17", "tag": "2022上海中考第1题", "t": "名句默写", "stem": "山不在高，______________________。（刘禹锡《陋室铭》）", "ans": "有仙则名", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】唐代刘禹锡《陋室铭》。\n【考点分析】“名”名词活用为动词，出名。以仙龙引出陋室之德馨。"}, {"s": "板块一：历年中考真题·名句默写与情境运用", "sid": "sh-moxie", "n": 18, "id": "sh-moxie-18", "tag": "2022上海中考第2题", "t": "名句默写", "stem": "而今识尽愁滋味，______________________。（辛弃疾《丑奴儿·书博山道中壁》）", "ans": "欲说还休", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】南宋辛弃疾《丑奴儿·书博山道中壁》。\n【考点分析】词人饱经风霜后内心的深沉郁结，想说却又止住。"}, {"s": "板块一：历年中考真题·名句默写与情境运用", "sid": "sh-moxie", "n": 19, "id": "sh-moxie-19", "tag": "2022上海中考第3题", "t": "名句默写", "stem": "几处早莺争暖树，______________________。（白居易《钱塘湖春行》）", "ans": "谁家新燕啄春泥", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】唐代白居易《钱塘湖春行》。\n【易错字提示】「新燕」注意燕的字形；「啄」口字旁加豖。"}, {"s": "板块一：历年中考真题·名句默写与情境运用", "sid": "sh-moxie", "n": 20, "id": "sh-moxie-20", "tag": "2022上海中考第4题", "t": "情境默写", "stem": "傍晚时分，小华漫步山间，看到鸟儿结伴归巢，不由地用陶渊明《饮酒（其五）》中的诗句来形容所见之景：“______________________，______________________。”", "ans": "山气日夕佳，飞鸟相与还", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】东晋陶渊明《饮酒（其五）》。\n【情境提示】“傍晚时分山间”对应“山气日夕佳”；“鸟儿结伴归巢”对应“飞鸟相与还”。"}, {"s": "板块一：历年中考真题·名句默写与情境运用", "sid": "sh-moxie", "n": 21, "id": "sh-moxie-21", "tag": "2021上海中考第1题", "t": "名句默写", "stem": "明月几时有？______________________。（苏轼《水调歌头》）", "ans": "把酒问青天", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】北宋苏轼《水调歌头·明月几时有》。\n【考点分析】开篇举杯问天之旷达豪迈名句。"}, {"s": "板块一：历年中考真题·名句默写与情境运用", "sid": "sh-moxie", "n": 22, "id": "sh-moxie-22", "tag": "2021上海中考第2题", "t": "名句默写", "stem": "盈盈一水间，______________________。（无名氏《迢迢牵牛星》）", "ans": "脉脉不得语", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】《古诗十九首·迢迢牵牛星》。\n【易错字提示】「脉脉」读 mò mò，含情凝视，切勿误写为默默。"}, {"s": "板块一：历年中考真题·名句默写与情境运用", "sid": "sh-moxie", "n": 23, "id": "sh-moxie-23", "tag": "2021上海中考第3题", "t": "名句默写", "stem": "______________________，天气晚来秋。（王维《山居秋暝》）", "ans": "空山新雨后", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】唐代王维《山居秋暝》。\n【考点分析】首联以清新笔调写出初秋傍晚雨后山林的空旷明净。"}, {"s": "板块一：历年中考真题·名句默写与情境运用", "sid": "sh-moxie", "n": 24, "id": "sh-moxie-24", "tag": "2021上海中考第4题", "t": "名句默写", "stem": "朝晖夕阴，______________________……（范仲淹《岳阳楼记》）", "ans": "气象万千", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】北宋范仲淹《岳阳楼记》。\n【考点分析】形容洞庭湖早晚阴晴万千变幻的壮阔景象。"}, {"s": "板块一：历年中考真题·名句默写与情境运用", "sid": "sh-moxie", "n": 25, "id": "sh-moxie-25", "tag": "2021上海中考第5题", "t": "情境默写", "stem": "学校组织学农活动，同学们来到农村，看到一片片农田和整齐的村舍，情不自禁地用陶渊明《桃花源记》中的句子“______________________，______________________”来形容所见之景。", "ans": "土地平旷，屋舍俨然", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】东晋陶渊明《桃花源记》。\n【情境提示】“平坦的农田”对应“土地平旷”；“整齐的村舍”对应“屋舍俨然”。\n【易错字提示】「俨」单人旁加严。"}, {"s": "板块一：历年中考真题·名句默写与情境运用", "sid": "sh-moxie", "n": 26, "id": "sh-moxie-26", "tag": "2020上海中考第1题", "t": "名句默写", "stem": "清晨入古寺，______________________。（常建《题破山寺后禅院》）", "ans": "初日照高林", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】唐代常建《题破山寺后禅院》。\n【考点分析】首联写清晨步入幽静古刹之所见。"}, {"s": "板块一：历年中考真题·名句默写与情境运用", "sid": "sh-moxie", "n": 27, "id": "sh-moxie-27", "tag": "2020上海中考第2题", "t": "名句默写", "stem": "青山横北郭，______________________。（李白《送友人》）", "ans": "白水绕东城", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】唐代李白《送友人》。\n【考点分析】对偶工整首联，青山对白水，北郭对东城。"}, {"s": "板块一：历年中考真题·名句默写与情境运用", "sid": "sh-moxie", "n": 28, "id": "sh-moxie-28", "tag": "2020上海中考第3题", "t": "名句默写", "stem": "相见时难别亦难，______________________。（李商隐《无题》）", "ans": "东风无力百花残", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】唐代李商隐《无题·相见时难别亦难》。\n【考点分析】写暮春离别时凄恻动人的情感。"}, {"s": "板块一：历年中考真题·名句默写与情境运用", "sid": "sh-moxie", "n": 29, "id": "sh-moxie-29", "tag": "2020上海中考第4题", "t": "名句默写", "stem": "其必曰：“______________________，后天下之乐而乐”乎！（范仲淹《岳阳楼记》）", "ans": "先天下之忧而忧", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】北宋范仲淹《岳阳楼记》。\n【易错字提示】「忧」心字底，注意字形笔画。"}, {"s": "板块一：历年中考真题·名句默写与情境运用", "sid": "sh-moxie", "n": 30, "id": "sh-moxie-30", "tag": "2020上海中考第5题", "t": "情境默写", "stem": "纪录片《航拍中国》有一组镜头展现了祖国秋季的绚丽色彩，我们可用白朴《天净沙·秋》中的句子“______________________，______________________”为画面配字幕。", "ans": "青山绿水，白草红叶黄花", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】元代白朴《天净沙·秋》。\n【情境提示】青、绿、白、红、黄五色并置，色彩鲜明绚烂。"}, {"s": "板块一：历年中考真题·名句默写与情境运用", "sid": "sh-moxie", "n": 31, "id": "sh-moxie-31", "tag": "2019上海中考第1(1)题", "t": "名句默写", "stem": "会当凌绝顶，______________________。（杜甫《望岳》）", "ans": "一览众山小", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】唐代杜甫《望岳》。\n【易错字提示】「览」下半部为见字底。"}, {"s": "板块一：历年中考真题·名句默写与情境运用", "sid": "sh-moxie", "n": 32, "id": "sh-moxie-32", "tag": "2019上海中考第1(2)题", "t": "名句默写", "stem": "草枯鹰眼疾，______________________。（王维《观猎》）", "ans": "雪尽马蹄轻", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】唐代王维《观猎》。\n【易错字提示】「蹄」足字旁。"}, {"s": "板块一：历年中考真题·名句默写与情境运用", "sid": "sh-moxie", "n": 33, "id": "sh-moxie-33", "tag": "2019上海中考第1(3)题", "t": "名句默写", "stem": "狼不敢前，______________________。（蒲松龄《狼》）", "ans": "眈眈相向", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】清代蒲松龄《聊斋志异·狼》。\n【易错字提示】「眈」为目字旁+耽右半部。"}, {"s": "板块一：历年中考真题·名句默写与情境运用", "sid": "sh-moxie", "n": 34, "id": "sh-moxie-34", "tag": "2019上海中考第1(4)题", "t": "名句默写", "stem": "______________________，竭其庐之入……（柳宗元《捕蛇者说》）", "ans": "殚其地之出", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】唐代柳宗元《捕蛇者说》。\n【易错字提示】「殚」歹字旁加单，竭尽之意。"}, {"s": "板块一：历年中考真题·名句默写与情境运用", "sid": "sh-moxie", "n": 35, "id": "sh-moxie-35", "tag": "2019上海中考第1(5)题", "t": "名句默写", "stem": "枯藤老树昏鸦，______________________，古道西风瘦马。（马致远《天净沙·秋思》）", "ans": "小桥流水人家", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】元代马致远《天净沙·秋思》。"}, {"s": "板块一：历年中考真题·名句默写与情境运用", "sid": "sh-moxie", "n": 36, "id": "sh-moxie-36", "tag": "2018上海中考第1(1)题", "t": "名句默写", "stem": "空山新雨后，______________________。（王维《山居秋暝》）", "ans": "天气晚来秋", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】唐代王维《山居秋暝》。"}, {"s": "板块一：历年中考真题·名句默写与情境运用", "sid": "sh-moxie", "n": 37, "id": "sh-moxie-37", "tag": "2018上海中考第1(2)题", "t": "名句默写", "stem": "______________________，草色入帘青。（刘禹锡《陋室铭》）", "ans": "苔痕上阶绿", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】唐代刘禹锡《陋室铭》。\n【易错字提示】「苔」草字头；「痕」病字旁加艮。"}, {"s": "板块一：历年中考真题·名句默写与情境运用", "sid": "sh-moxie", "n": 38, "id": "sh-moxie-38", "tag": "2018上海中考第1(3)题", "t": "名句默写", "stem": "青山绿水，______________________。（白朴《天净沙·秋》）", "ans": "白草红叶黄花", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】元代白朴《天净沙·秋》。"}, {"s": "板块一：历年中考真题·名句默写与情境运用", "sid": "sh-moxie", "n": 39, "id": "sh-moxie-39", "tag": "2018上海中考第1(4)题", "t": "名句默写", "stem": "______________________，不耻下问，是以谓之文也。（《论语·公冶长》）", "ans": "敏而好学", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】《论语·公冶长》。敏：勤勉。"}, {"s": "板块一：历年中考真题·名句默写与情境运用", "sid": "sh-moxie", "n": 40, "id": "sh-moxie-40", "tag": "2018上海中考第1(5)题", "t": "名句默写", "stem": "月上柳梢头，______________________。（欧阳修《生查子·元夕》）", "ans": "人约黄昏后", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】北宋欧阳修《生查子·元夕》。"}, {"s": "板块一：历年中考真题·名句默写与情境运用", "sid": "sh-moxie", "n": 41, "id": "sh-moxie-41", "tag": "2017上海中考第1题", "t": "名句默写", "stem": "斗折蛇行，______________________。（柳宗元《小石潭记》）", "ans": "明灭可见", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】唐代柳宗元《小石潭记》。"}, {"s": "板块一：历年中考真题·名句默写与情境运用", "sid": "sh-moxie", "n": 42, "id": "sh-moxie-42", "tag": "2017上海中考第2题", "t": "名句默写", "stem": "锦帽貂裘，______________________。（苏轼《江城子·密州出猎》）", "ans": "千骑卷平冈", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】北宋苏轼《江城子·密州出猎》。\n【易错字提示】「冈」平冈，切勿误加点。"}, {"s": "板块一：历年中考真题·名句默写与情境运用", "sid": "sh-moxie", "n": 43, "id": "sh-moxie-43", "tag": "2017上海中考第3题", "t": "名句默写", "stem": "______________________，落日故人情。（李白《送友人》）", "ans": "浮云游子意", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】唐代李白《送友人》。"}, {"s": "板块一：历年中考真题·名句默写与情境运用", "sid": "sh-moxie", "n": 44, "id": "sh-moxie-44", "tag": "2017上海中考第4题", "t": "名句默写", "stem": "试问卷帘人，______________________。（李清照《如梦令》）", "ans": "却道海棠依旧", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】宋代李清照《如梦令》。\n【易错字提示】「棠」木字底。"}, {"s": "板块一：历年中考真题·名句默写与情境运用", "sid": "sh-moxie", "n": 45, "id": "sh-moxie-45", "tag": "2017上海中考第5题", "t": "名句默写", "stem": "______________________，草盛豆苗稀。（陶渊明《归园田居（其三）》）", "ans": "晨兴理荒秽", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】东晋陶渊明《归园田居（其三）》。\n【易错字提示】「秽」禾木旁加岁。"}, {"s": "板块一：历年中考真题·名句默写与情境运用", "sid": "sh-moxie", "n": 46, "id": "sh-moxie-46", "tag": "2016上海中考第1(1)题", "t": "名句默写", "stem": "蜂蝶纷纷过墙去，______________________。（王驾《雨晴》）", "ans": "却疑春色在邻家", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】唐代王驾《雨晴》。"}, {"s": "板块一：历年中考真题·名句默写与情境运用", "sid": "sh-moxie", "n": 47, "id": "sh-moxie-47", "tag": "2016上海中考第1(2)题", "t": "名句默写", "stem": "______________________，若出其里。（曹操《观沧海》）", "ans": "星汉灿烂", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】东汉曹操《观沧海》。星汉：银河。"}, {"s": "板块一：历年中考真题·名句默写与情境运用", "sid": "sh-moxie", "n": 48, "id": "sh-moxie-48", "tag": "2016上海中考第1(3)题", "t": "名句默写", "stem": "故天将降大任于是人也，______________________，劳其筋骨。（《生于忧患，死于安乐》）", "ans": "必先苦其心志", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】《孟子·告子下》。苦：使动用法。"}, {"s": "板块一：历年中考真题·名句默写与情境运用", "sid": "sh-moxie", "n": 49, "id": "sh-moxie-49", "tag": "2016上海中考第1(4)题", "t": "名句默写", "stem": "人生自古谁无死，______________________。（文天祥《过零丁洋》）", "ans": "留取丹心照汗青", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】南宋文天祥《过零丁洋》。汗青：史册。"}, {"s": "板块一：历年中考真题·名句默写与情境运用", "sid": "sh-moxie", "n": 50, "id": "sh-moxie-50", "tag": "2016上海中考第1(5)题", "t": "名句默写", "stem": "______________________，落英缤纷。（陶渊明《桃花源记》）", "ans": "芳草鲜美", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】东晋陶渊明《桃花源记》。"}, {"s": "板块一：历年中考真题·名句默写与情境运用", "sid": "sh-moxie", "n": 51, "id": "sh-moxie-51", "tag": "2015上海中考第1(1)题", "t": "名句默写", "stem": "夜来城外一尺雪，______________________。（白居易《卖炭翁》）", "ans": "晓驾炭车辗冰辙", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】唐代白居易《卖炭翁》。\n【易错字提示】「辗」车字旁加展；「辙」车字旁加彻右半部。"}, {"s": "板块一：历年中考真题·名句默写与情境运用", "sid": "sh-moxie", "n": 52, "id": "sh-moxie-52", "tag": "2015上海中考第1(2)题", "t": "名句默写", "stem": "______________________，脉脉不得语。（《迢迢牵牛星》）", "ans": "盈盈一水间", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】《古诗十九首·迢迢牵牛星》。间：读 jiàn，隔开。"}, {"s": "板块一：历年中考真题·名句默写与情境运用", "sid": "sh-moxie", "n": 53, "id": "sh-moxie-53", "tag": "2015上海中考第1(3)题", "t": "名句默写", "stem": "______________________，芳草萋萋鹦鹉洲。（崔颢《黄鹤楼》）", "ans": "晴川历历汉阳树", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】唐代崔颢《黄鹤楼》。历历：清晰可数。"}, {"s": "板块一：历年中考真题·名句默写与情境运用", "sid": "sh-moxie", "n": 54, "id": "sh-moxie-54", "tag": "2015上海中考第1(4)题", "t": "名句默写", "stem": "衣带渐宽终不悔，______________________。（柳永《蝶恋花》）", "ans": "为伊消得人憔悴", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】北宋柳永《蝶恋花》。憔悴：竖心旁。"}, {"s": "板块一：历年中考真题·名句默写与情境运用", "sid": "sh-moxie", "n": 55, "id": "sh-moxie-55", "tag": "2015上海中考第1(5)题", "t": "名句默写", "stem": "山水之乐，______________________。（欧阳修《醉翁亭记》）", "ans": "得之心而寓之酒也", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】北宋欧阳修《醉翁亭记》。寓：寄托。"}, {"s": "板块一：历年中考真题·名句默写与情境运用", "sid": "sh-moxie", "n": 56, "id": "sh-moxie-56", "tag": "2014上海中考第1题", "t": "名句默写", "stem": "马作的卢飞快，______________________。（辛弃疾《破阵子·为陈同甫赋壮词以寄之》）", "ans": "弓如霹雳弦惊", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】南宋辛弃疾《破阵子》。\n【易错字提示】「霹雳」雨字头；「弦」弓字旁加玄。"}, {"s": "板块一：历年中考真题·名句默写与情境运用", "sid": "sh-moxie", "n": 57, "id": "sh-moxie-57", "tag": "2014上海中考第2题", "t": "名句默写", "stem": "______________________，莲动下渔舟。（王维《山居秋暝》）", "ans": "竹喧归浣女", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】唐代王维《山居秋暝》。喧：口字旁；浣：三点水。"}, {"s": "板块一：历年中考真题·名句默写与情境运用", "sid": "sh-moxie", "n": 58, "id": "sh-moxie-58", "tag": "2014上海中考第3题", "t": "名句默写", "stem": "沉舟侧畔千帆过，______________________。（刘禹锡《酬乐天扬州初逢席上见赠》）", "ans": "病树前头万木春", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】唐代刘禹锡《酬乐天扬州初逢席上见赠》。"}, {"s": "板块一：历年中考真题·名句默写与情境运用", "sid": "sh-moxie", "n": 59, "id": "sh-moxie-59", "tag": "2014上海中考第4题", "t": "名句默写", "stem": "______________________，锦鳞游泳。（范仲淹《岳阳楼记》）", "ans": "沙鸥翔集", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】北宋范仲淹《岳阳楼记》。翔集：时飞时停。"}, {"s": "板块一：历年中考真题·名句默写与情境运用", "sid": "sh-moxie", "n": 60, "id": "sh-moxie-60", "tag": "2014上海中考第5题", "t": "名句默写", "stem": "挥手自兹去，______________________。（李白《送友人》）", "ans": "萧萧班马鸣", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】唐代李白《送友人》。萧萧：马嘶叫声；班马：离群之马。"}, {"s": "板块一：历年中考真题·名句默写与情境运用", "sid": "sh-moxie", "n": 61, "id": "sh-moxie-61", "tag": "2013上海中考第1题", "t": "名句默写", "stem": "岱宗夫如何？______________________。（杜甫《望岳》）", "ans": "齐鲁青未了", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】唐代杜甫《望岳》。齐鲁大地一片青翠苍茫无际。"}, {"s": "板块一：历年中考真题·名句默写与情境运用", "sid": "sh-moxie", "n": 62, "id": "sh-moxie-62", "tag": "2013上海中考第2题", "t": "名句默写", "stem": "______________________，奉命于危难之间。（诸葛亮《出师表》）", "ans": "受任于败军之际", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】三国诸葛亮《出师表》。"}, {"s": "板块一：历年中考真题·名句默写与情境运用", "sid": "sh-moxie", "n": 63, "id": "sh-moxie-63", "tag": "2013上海中考第3题", "t": "名句默写", "stem": "夕阳西下，______________________。（马致远《天净沙·秋思》）", "ans": "断肠人在天涯", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】元代马致远《天净沙·秋思》。断肠人：极度悲伤的游子。"}, {"s": "板块一：历年中考真题·名句默写与情境运用", "sid": "sh-moxie", "n": 64, "id": "sh-moxie-64", "tag": "2013上海中考第4题", "t": "名句默写", "stem": "不畏浮云遮望眼，______________________。（王安石《登飞来峰》）", "ans": "自缘身在最高层", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】北宋王安石《登飞来峰》。缘：因为。"}, {"s": "板块一：历年中考真题·名句默写与情境运用", "sid": "sh-moxie", "n": 65, "id": "sh-moxie-65", "tag": "2013上海中考第5题", "t": "名句默写", "stem": "______________________，亭亭净植，可远观而不可亵玩焉。（周敦颐《爱莲说》）", "ans": "香远益清", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】北宋周敦颐《爱莲说》。益：更加。"}, {"s": "板块一：历年中考真题·名句默写与情境运用", "sid": "sh-moxie", "n": 66, "id": "sh-moxie-66", "tag": "2012上海中考第1题", "t": "名句默写", "stem": "山重水复疑无路，______________________。（陆游《游山西村》）", "ans": "柳暗花明又一村", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】南宋陆游《游山西村》。蕴含在逆境中只要坚持终见希望之哲理。"}, {"s": "板块一：历年中考真题·名句默写与情境运用", "sid": "sh-moxie", "n": 67, "id": "sh-moxie-67", "tag": "2012上海中考第2题", "t": "名句默写", "stem": "日暮乡关何处是？______________________。（崔颢《黄鹤楼》）", "ans": "烟波江上使人愁", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】唐代崔颢《黄鹤楼》。"}, {"s": "板块一：历年中考真题·名句默写与情境运用", "sid": "sh-moxie", "n": 68, "id": "sh-moxie-68", "tag": "2012上海中考第3题", "t": "名句默写", "stem": "夜阑卧听风吹雨，______________________。（陆游《十一月四日风雨大作》）", "ans": "铁马冰河入梦来", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】南宋陆游《十一月四日风雨大作》。爱国热忱感人至深。"}, {"s": "板块一：历年中考真题·名句默写与情境运用", "sid": "sh-moxie", "n": 69, "id": "sh-moxie-69", "tag": "2012上海中考第4题", "t": "名句默写", "stem": "下见小潭，______________________。（柳宗元《小石潭记》）", "ans": "水尤清冽", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】唐代柳宗元《小石潭记》。冽：两点水加列，寒冷清澈。"}, {"s": "板块一：历年中考真题·名句默写与情境运用", "sid": "sh-moxie", "n": 70, "id": "sh-moxie-70", "tag": "2012上海中考第5题", "t": "名句默写", "stem": "______________________，江春入旧年。（王湾《次北固山下》）", "ans": "海日生残夜", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】唐代王湾《次北固山下》。"}, {"s": "板块一：历年中考真题·名句默写与情境运用", "sid": "sh-moxie", "n": 71, "id": "sh-moxie-71", "tag": "2011上海中考第2题", "t": "名句默写", "stem": "乱花渐欲迷人眼，______________________。（白居易《钱塘湖春行》）", "ans": "浅草才能没马蹄", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】唐代白居易《钱塘湖春行》。"}, {"s": "板块一：历年中考真题·名句默写与情境运用", "sid": "sh-moxie", "n": 72, "id": "sh-moxie-72", "tag": "2011上海中考第3题", "t": "名句默写", "stem": "______________________，病树前头万木春。（刘禹锡《酬乐天扬州初逢席上见赠》）", "ans": "沉舟侧畔千帆过", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】唐代刘禹锡《酬乐天扬州初逢席上见赠》。"}, {"s": "板块一：历年中考真题·名句默写与情境运用", "sid": "sh-moxie", "n": 73, "id": "sh-moxie-73", "tag": "2011上海中考第4题", "t": "名句默写", "stem": "______________________，自缘身在最高层。（王安石《登飞来峰》）", "ans": "不畏浮云遮望眼", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】北宋王安石《登飞来峰》。"}, {"s": "板块一：历年中考真题·名句默写与情境运用", "sid": "sh-moxie", "n": 74, "id": "sh-moxie-74", "tag": "2011上海中考第5题", "t": "名句默写", "stem": "人有悲欢离合，______________________，此事古难全。（苏轼《水调歌头》）", "ans": "月有阴晴圆缺", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】北宋苏轼《水调歌头·明月几时有》。"}, {"s": "板块一：历年中考真题·名句默写与情境运用", "sid": "sh-moxie", "n": 75, "id": "sh-moxie-75", "tag": "2010上海中考第1题", "t": "名句默写", "stem": "潮平两岸阔，______________________。（王湾《次北固山下》）", "ans": "风正一帆悬", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】唐代王湾《次北固山下》。风正：顺风；悬：挂起。"}, {"s": "板块一：历年中考真题·名句默写与情境运用", "sid": "sh-moxie", "n": 76, "id": "sh-moxie-76", "tag": "2010上海中考第2题", "t": "名句默写", "stem": "东临碣石，以观沧海。______________________，山岛竦峙。（曹操《观沧海》）", "ans": "水何澹澹", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】东汉曹操《观沧海》。澹澹：水波荡漾貌；竦峙：高高挺拔耸立。"}, {"s": "板块一：历年中考真题·名句默写与情境运用", "sid": "sh-moxie", "n": 77, "id": "sh-moxie-77", "tag": "2010上海中考第4题", "t": "名句默写", "stem": "浮云游子意，______________________。（李白《送友人》）", "ans": "落日故人情", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】唐代李白《送友人》。"}, {"s": "板块一：历年中考真题·名句默写与情境运用", "sid": "sh-moxie", "n": 78, "id": "sh-moxie-78", "tag": "2010上海中考第5题", "t": "名句默写", "stem": "一鼓作气，再而衰，三而竭。______________________，故克之。（《曹刿论战》）", "ans": "彼竭我盈", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】《左传·曹刿论战》。盈：士气饱满。"}, {"s": "板块一：历年中考真题·名句默写与情境运用", "sid": "sh-moxie", "n": 79, "id": "sh-moxie-79", "tag": "2009上海中考第1题", "t": "名句默写", "stem": "关关雎鸠，在河之洲。______________________，君子好逑。（《诗经·关雎》）", "ans": "窈窕淑女", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】《诗经·周南·关雎》。\n【易错字提示】「窈窕」穴字头；「淑」三点水加叔。"}, {"s": "板块一：历年中考真题·名句默写与情境运用", "sid": "sh-moxie", "n": 80, "id": "sh-moxie-80", "tag": "2009上海中考第2题", "t": "名句默写", "stem": "忽如一夜春风来，______________________。（岑参《白雪歌送武判官归京》）", "ans": "千树万树梨花开", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】唐代岑参《白雪歌送武判官归京》。"}, {"s": "板块一：历年中考真题·名句默写与情境运用", "sid": "sh-moxie", "n": 81, "id": "sh-moxie-81", "tag": "2009上海中考第3题", "t": "名句默写", "stem": "气蒸云梦泽，______________________。（孟浩然《望洞庭湖赠张丞相》）", "ans": "波撼岳阳城", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】唐代孟浩然《望洞庭湖赠张丞相》。撼：手字旁加感。"}, {"s": "板块一：历年中考真题·名句默写与情境运用", "sid": "sh-moxie", "n": 82, "id": "sh-moxie-82", "tag": "2009上海中考第4题", "t": "名句默写", "stem": "______________________，留取丹心照汗青。（文天祥《过零丁洋》）", "ans": "人生自古谁无死", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】南宋文天祥《过零丁洋》。"}, {"s": "板块一：历年中考真题·名句默写与情境运用", "sid": "sh-moxie", "n": 83, "id": "sh-moxie-83", "tag": "2009上海中考第5题", "t": "名句默写", "stem": "野芳发而幽香，______________________。（欧阳修《醉翁亭记》）", "ans": "佳木秀而繁阴", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】北宋欧阳修《醉翁亭记》。秀：滋长、繁茂。"}, {"s": "板块一：历年中考真题·名句默写与情境运用", "sid": "sh-moxie", "n": 84, "id": "sh-moxie-84", "tag": "2008上海中考第1题", "t": "名句默写", "stem": "结庐在人境，______________________。（陶渊明《饮酒（其五）》）", "ans": "而无车马喧", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】东晋陶渊明《饮酒（其五）》。喧：口字旁加宣。"}, {"s": "板块一：历年中考真题·名句默写与情境运用", "sid": "sh-moxie", "n": 85, "id": "sh-moxie-85", "tag": "2008上海中考第2题", "t": "名句默写", "stem": "七八个星天外，______________________。（辛弃疾《西江月·夜行黄沙道中》）", "ans": "两三点雨山前", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】南宋辛弃疾《西江月·夜行黄沙道中》。"}, {"s": "板块一：历年中考真题·名句默写与情境运用", "sid": "sh-moxie", "n": 86, "id": "sh-moxie-86", "tag": "2008上海中考第3题", "t": "名句默写", "stem": "予独爱莲之出淤泥而不染，______________________。（周敦颐《爱莲说》）", "ans": "濯清涟而不妖", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】北宋周敦颐《爱莲说》。\n【易错字提示】「濯」三点水加翟；「涟」三点水加连。"}, {"s": "板块一：历年中考真题·名句默写与情境运用", "sid": "sh-moxie", "n": 87, "id": "sh-moxie-87", "tag": "2008上海中考第4题", "t": "名句默写", "stem": "______________________，皓月千里，浮光跃金，静影沉璧。（范仲淹《岳阳楼记》）", "ans": "长烟一空", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】北宋范仲淹《岳阳楼记》。一空：全消。"}, {"s": "板块一：历年中考真题·名句默写与情境运用", "sid": "sh-moxie", "n": 88, "id": "sh-moxie-88", "tag": "2008上海中考第5题", "t": "情境默写", "stem": "《桃花源记》中交代源中人来到桃花源原因的句子是：“______________________”。", "ans": "自云先世避秦时乱，率妻子邑人来此绝境", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】东晋陶渊明《桃花源记》。妻子：妻子和儿女；绝境：与世隔绝之处。"}, {"s": "板块二：上海各区初三一模/二模真题·名句与情境默写精选", "sid": "sh-mock", "n": 1, "id": "sh-mock-89", "tag": "2024杨浦一模第1(1)题", "t": "名句默写", "stem": "蓬山此去无多路，______________________。（李商隐《无题》）", "ans": "青鸟殷勤为探看", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】唐代李商隐《无题·相见时难别亦难》。\n【考点分析】青鸟：神话中为西王母传递消息的信使。殷勤：频频、反复照料。"}, {"s": "板块二：上海各区初三一模/二模真题·名句与情境默写精选", "sid": "sh-mock", "n": 2, "id": "sh-mock-90", "tag": "2024杨浦一模第1(2)题", "t": "名句默写", "stem": "______________________，拄杖无时夜叩门。（陆游《游山西村》）", "ans": "从今若许闲乘月", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】南宋陆游《游山西村》。\n【易错字提示】「闲」门字框内为木（闲暇）。"}, {"s": "板块二：上海各区初三一模/二模真题·名句与情境默写精选", "sid": "sh-mock", "n": 3, "id": "sh-mock-91", "tag": "2024杨浦一模第1(4)题", "t": "情境默写", "stem": "小语读到“终日不成章，泣涕零如雨”时，想起《关雎》中“______________________，______________________”两句诗也表达求之不得、寤寐思念的相似情感。", "ans": "求之不得，寤寐思服", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】《诗经·周南·关雎》。\n【情境提示】“求之不得的思念相思之苦”对应“求之不得，寤寐思服”。\n【易错字提示】「寤寐」字形较繁复，注意左边为广字头加木；「服」思念。"}, {"s": "板块二：上海各区初三一模/二模真题·名句与情境默写精选", "sid": "sh-mock", "n": 4, "id": "sh-mock-92", "tag": "2023杨浦二模第1(4)题", "t": "情境默写", "stem": "诸葛亮在《出师表》中劝勉后主刘禅应当广泛听取各方合理意见、考察采纳正确言论的句子是：“______________________，______________________。”", "ans": "咨诹善道，察纳雅言", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】三国诸葛亮《出师表》。\n【词义采分】咨诹（zōu）：询问；雅言：正确的言论。"}, {"s": "板块二：上海各区初三一模/二模真题·名句与情境默写精选", "sid": "sh-mock", "n": 5, "id": "sh-mock-93", "tag": "2024静安二模第1(1)题", "t": "名句默写", "stem": "了却君王天下事，______________________。（辛弃疾《破阵子·为陈同甫赋壮词以寄之》）", "ans": "赢得生前身后名", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】南宋辛弃疾《破阵子·为陈同甫赋壮词以寄之》。\n【考点分析】生前建功立业，死后名垂青史，词人雄心壮志跃然纸上。"}, {"s": "板块二：上海各区初三一模/二模真题·名句与情境默写精选", "sid": "sh-mock", "n": 6, "id": "sh-mock-94", "tag": "2024静安二模第1(2)题", "t": "名句默写", "stem": "复行数十步，______________________。（陶渊明《桃花源记》）", "ans": "豁然开朗", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】东晋陶渊明《桃花源记》。\n【易错字提示】「豁然」开阔明亮貌；「朗」左边为良，右边为月。"}, {"s": "板块二：上海各区初三一模/二模真题·名句与情境默写精选", "sid": "sh-mock", "n": 7, "id": "sh-mock-95", "tag": "2024静安二模第1(3)题", "t": "名句默写", "stem": "______________________，人皆有之，贤者能勿丧耳。（孟子《鱼我所欲也》）", "ans": "非独贤者有是心也", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】《孟子·告子上·鱼我所欲也》。\n【考点分析】是心：这种羞恶之心（本心）。孟子强调人人皆有善端，关键在于能否坚守不失。"}, {"s": "板块二：上海各区初三一模/二模真题·名句与情境默写精选", "sid": "sh-mock", "n": 8, "id": "sh-mock-96", "tag": "2024静安二模第1(4)题", "t": "情境默写", "stem": "小明在演讲中引用《〈论语〉十二章》里的“______________________，______________________”来阐释“兴趣对学习的重要性”。", "ans": "知之者不如好之者，好之者不如乐之者", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】《论语·雍也》。\n【情境提示】“兴趣对学习的重要性”对应“知之、好之、乐之”的三重境界递进。"}, {"s": "板块二：上海各区初三一模/二模真题·名句与情境默写精选", "sid": "sh-mock", "n": 9, "id": "sh-mock-97", "tag": "2023静安一模第1(3)题", "t": "名句默写", "stem": "越明年，政通人和，______________________。（范仲淹《岳阳楼记》）", "ans": "百废具兴", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】北宋范仲淹《岳阳楼记》。\n【通假字】具：同“俱”，全、都。"}, {"s": "板块二：上海各区初三一模/二模真题·名句与情境默写精选", "sid": "sh-mock", "n": 10, "id": "sh-mock-98", "tag": "2024浦东一模第1(1)题", "t": "名句默写", "stem": "其岸势犬牙差互，______________________。（柳宗元《小石潭记》）", "ans": "不可知其源", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】唐代柳宗元《小石潭记》。\n【词类活用】犬牙：名词作状语，像狗的牙齿那样。"}, {"s": "板块二：上海各区初三一模/二模真题·名句与情境默写精选", "sid": "sh-mock", "n": 11, "id": "sh-mock-99", "tag": "2024浦东一模第1(2)题", "t": "名句默写", "stem": "欲说还休，______________________。（辛弃疾《丑奴儿·书博山道中壁》）", "ans": "却道天凉好个秋", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】南宋辛弃疾《丑奴儿·书博山道中壁》。\n【情味品析】千言万语之沉痛愁苦，化作一句寻常谈天天气语，更显苍凉悲慨。"}, {"s": "板块二：上海各区初三一模/二模真题·名句与情境默写精选", "sid": "sh-mock", "n": 12, "id": "sh-mock-100", "tag": "2024浦东一模第1(3)题", "t": "名句默写", "stem": "黄鹤一去不复返，______________________。（崔颢《黄鹤楼》）", "ans": "白云千载空悠悠", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】唐代崔颢《黄鹤楼》。\n【易错字提示】「载」车字旁，年之意；「悠悠」长远渺茫貌。"}, {"s": "板块二：上海各区初三一模/二模真题·名句与情境默写精选", "sid": "sh-mock", "n": 13, "id": "sh-mock-101", "tag": "2024浦东一模第1(4)题", "t": "情境默写", "stem": "九年级毕业在即，同学们面临人生的分流与挑战，班主任借李白《行路难（其一）》中的诗句“______________________，______________________”鼓励大家坚定信念、勇往直前。", "ans": "长风破浪会有时，直挂云帆济沧海", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】唐代李白《行路难（其一）》。\n【情境提示】“坚定理想信念、不惧坎坷勇往直前”对应李白乘风破浪的千古壮语。"}, {"s": "板块二：上海各区初三一模/二模真题·名句与情境默写精选", "sid": "sh-mock", "n": 14, "id": "sh-mock-102", "tag": "2023浦东二模第1(2)题", "t": "名句默写", "stem": "无可奈何花落去，______________________。（晏殊《浣溪沙》）", "ans": "似曾相识燕归来", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】北宋晏殊《浣溪沙》。"}, {"s": "板块二：上海各区初三一模/二模真题·名句与情境默写精选", "sid": "sh-mock", "n": 15, "id": "sh-mock-103", "tag": "2023浦东一模第1(4)题", "t": "情境默写", "stem": "杜甫在《望岳》中通过虚实结合，用“______________________，______________________”两句表现了泰山高峻神奇秀美和遮天蔽日的磅礴气势。", "ans": "造化钟神秀，阴阳割昏晓", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】唐代杜甫《望岳》。"}, {"s": "板块二：上海各区初三一模/二模真题·名句与情境默写精选", "sid": "sh-mock", "n": 16, "id": "sh-mock-104", "tag": "2024黄浦一模第1(1)题", "t": "名句默写", "stem": "______________________，往来而不绝者，滁人游也。（欧阳修《醉翁亭记》）", "ans": "伛偻提携", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】北宋欧阳修《醉翁亭记》。\n【易错字提示】「伛偻」均为单人旁，指老人弯腰驼背；「提携」指老少相携。"}, {"s": "板块二：上海各区初三一模/二模真题·名句与情境默写精选", "sid": "sh-mock", "n": 17, "id": "sh-mock-105", "tag": "2024黄浦一模第1(2)题", "t": "名句默写", "stem": "感时花溅泪，______________________。（杜甫《春望》）", "ans": "恨别鸟惊心", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】唐代杜甫《春望》。\n【考点分析】移情于物，花鸟本常景，因战乱离合而令人感伤惊心。"}, {"s": "板块二：上海各区初三一模/二模真题·名句与情境默写精选", "sid": "sh-mock", "n": 18, "id": "sh-mock-106", "tag": "2024黄浦一模第1(3)题", "t": "名句默写", "stem": "采菊东篱下，______________________。（陶渊明《饮酒（其五）》）", "ans": "悠然见南山", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】东晋陶渊明《饮酒（其五）》。\n【易错字提示】「见」读 xiàn（现）或 jiàn；「悠然」安闲自在貌。"}, {"s": "板块二：上海各区初三一模/二模真题·名句与情境默写精选", "sid": "sh-mock", "n": 19, "id": "sh-mock-107", "tag": "2024黄浦一模第1(4)题", "t": "情境默写", "stem": "范仲淹在《渔家傲·秋思》中既表达思乡心切，又流露因功业未立而无法归乡的矛盾痛苦的名句是：“______________________，______________________。”", "ans": "浊酒一杯家万里，燕然未勒归无计", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】北宋范仲淹《渔家傲·秋思》。\n【典故采分】“燕然未勒”用东汉窦宪勒石燕然纪功之典故，抒发征夫报国无门的壮烈悲怀。"}, {"s": "板块二：上海各区初三一模/二模真题·名句与情境默写精选", "sid": "sh-mock", "n": 20, "id": "sh-mock-108", "tag": "2023黄浦二模第1(3)题", "t": "名句默写", "stem": "惶恐滩头说惶恐，______________________。（文天祥《过零丁洋》）", "ans": "零丁洋里叹零丁", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】南宋文天祥《过零丁洋》。\n【修辞分析】巧妙借地名“惶恐滩”、“零丁洋”表现自己坎坷经历与孤苦无依的艰难处境。"}, {"s": "板块二：上海各区初三一模/二模真题·名句与情境默写精选", "sid": "sh-mock", "n": 21, "id": "sh-mock-109", "tag": "2023黄浦一模第1(4)题", "t": "情境默写", "stem": "学校秋季登山研学，同学们极目远眺，看到重峦叠嶂、烟波浩渺，不由借用王湾《次北固山下》中“______________________，______________________”来描绘江面壮阔、春意盎然的景象。", "ans": "潮平两岸阔，风正一帆悬", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】唐代王湾《次北固山下》。"}, {"s": "板块二：上海各区初三一模/二模真题·名句与情境默写精选", "sid": "sh-mock", "n": 22, "id": "sh-mock-110", "tag": "2024徐汇一模第1(2)题", "t": "名句默写", "stem": "何夜无月？何处无竹柏？______________________。（苏轼《记承天寺夜游》）", "ans": "但少闲人如吾两人者耳", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】北宋苏轼《记承天寺夜游》。\n【词义采分】闲人：指具有闲情雅致之人，亦含贬谪失意之自嘲与超脱。"}, {"s": "板块二：上海各区初三一模/二模真题·名句与情境默写精选", "sid": "sh-mock", "n": 23, "id": "sh-mock-111", "tag": "2024徐汇一模第1(3)题", "t": "名句默写", "stem": "何处望神州？______________________。（辛弃疾《南乡子·登京口北固亭有怀》）", "ans": "满眼风光北固楼", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】南宋辛弃疾《南乡子·登京口北固亭有怀》。"}, {"s": "板块二：上海各区初三一模/二模真题·名句与情境默写精选", "sid": "sh-mock", "n": 24, "id": "sh-mock-112", "tag": "2024徐汇一模第1(4)题", "t": "情境默写", "stem": "秋游野外，夕阳西下，孤独的游子牵着瘦马行进在苍茫古道上，马致远在《天净沙·秋思》中将这幅凄凉画卷凝聚为：“______________________，______________________。”", "ans": "夕阳西下，断肠人在天涯", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】元代马致远《天净沙·秋思》。"}, {"s": "板块二：上海各区初三一模/二模真题·名句与情境默写精选", "sid": "sh-mock", "n": 25, "id": "sh-mock-113", "tag": "2023徐汇二模第1(2)题", "t": "名句默写", "stem": "天下英雄谁敌手？曹刘。______________________。（辛弃疾《南乡子·登京口北固亭有怀》）", "ans": "生子当如孙仲谋", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】南宋辛弃疾《南乡子》。借曹操叹赏孙权之语，讽刺南宋统治者苟且偷安。"}, {"s": "板块二：上海各区初三一模/二模真题·名句与情境默写精选", "sid": "sh-mock", "n": 26, "id": "sh-mock-114", "tag": "2023徐汇一模第1(4)题", "t": "情境默写", "stem": "辛弃疾在《破阵子》中充分展现边塞沙场战马飞驰、弓弦惊响的激烈战斗场面的名句是：“______________________，______________________。”", "ans": "马作的卢飞快，弓如霹雳弦惊", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】南宋辛弃疾《破阵子·为陈同甫赋壮词以寄之》。"}, {"s": "板块二：上海各区初三一模/二模真题·名句与情境默写精选", "sid": "sh-mock", "n": 27, "id": "sh-mock-115", "tag": "2024闵行一模第1(1)题", "t": "名句默写", "stem": "大漠孤烟直，______________________。（王维《使至塞上》）", "ans": "长河落日圆", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】唐代王维《使至塞上》。\n【考点分析】王国维《人间词话》誉为“千古奇观”，直、圆二字极写塞外雄浑开阔。"}, {"s": "板块二：上海各区初三一模/二模真题·名句与情境默写精选", "sid": "sh-mock", "n": 28, "id": "sh-mock-116", "tag": "2024闵行一模第1(2)题", "t": "名句默写", "stem": "山回路转不见君，______________________。（岑参《白雪歌送武判官归京》）", "ans": "雪上空留马行处", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】唐代岑参《白雪歌送武判官归京》。\n【考点分析】以景结情，写出友人已远去、诗人久久伫立雪中凝望的不舍深情。"}, {"s": "板块二：上海各区初三一模/二模真题·名句与情境默写精选", "sid": "sh-mock", "n": 29, "id": "sh-mock-117", "tag": "2024闵行一模第1(4)题", "t": "情境默写", "stem": "在探讨治学之道时，语文老师常勉励我们既要广博学习，又要坚定志向，多提问并联系当前实际，这正是《论语》所讲的：“______________________，______________________。”", "ans": "博学而笃志，切问而近思", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】《论语·子张》。\n【词义理解】笃：坚定；切：恳切；近思：思考与当前切近的事理。"}, {"s": "板块二：上海各区初三一模/二模真题·名句与情境默写精选", "sid": "sh-mock", "n": 30, "id": "sh-mock-118", "tag": "2023闵行二模第1(3)题", "t": "名句默写", "stem": "世有伯乐，______________________。（韩愈《马说》）", "ans": "然后有千里马", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】唐代韩愈《马说》。开门见山提出“千里马常有，而伯乐不常有”的核心论点。"}, {"s": "板块二：上海各区初三一模/二模真题·名句与情境默写精选", "sid": "sh-mock", "n": 31, "id": "sh-mock-119", "tag": "2023闵行一模第1(4)题", "t": "情境默写", "stem": "面对生活中的挫折与打击，刘禹锡在《酬乐天扬州初逢席上见赠》中以富有哲理的诗句“______________________，______________________”表达了积极向上、新生必胜的豁达胸怀。", "ans": "沉舟侧畔千帆过，病树前头万木春", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】唐代刘禹锡《酬乐天扬州初逢席上见赠》。"}, {"s": "板块二：上海各区初三一模/二模真题·名句与情境默写精选", "sid": "sh-mock", "n": 32, "id": "sh-mock-120", "tag": "2024宝山一模第1(1)题", "t": "名句默写", "stem": "落红不是无情物，______________________。（龚自珍《己亥杂诗（其五）》）", "ans": "化作春泥更护花", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】清代龚自珍《己亥杂诗》。\n【考点分析】托物言志，落红代指落花，表现献身育人、心系家国的崇高志节。"}, {"s": "板块二：上海各区初三一模/二模真题·名句与情境默写精选", "sid": "sh-mock", "n": 33, "id": "sh-mock-121", "tag": "2024宝山一模第1(2)题", "t": "名句默写", "stem": "海内存知己，______________________。（王勃《送杜少府之任蜀州》）", "ans": "天涯若比邻", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】唐代王勃《送杜少府之任蜀州》。\n【易错字提示】「涯」三点水加厓；「邻」右边为双耳旁。"}, {"s": "板块二：上海各区初三一模/二模真题·名句与情境默写精选", "sid": "sh-mock", "n": 34, "id": "sh-mock-122", "tag": "2024宝山一模第1(3)题", "t": "名句默写", "stem": "东风不与周郎便，______________________。（杜牧《赤壁》）", "ans": "铜雀春深锁二乔", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】唐代杜牧《赤壁》。\n【易错字提示】「铜雀」金字旁；「锁」金字旁。"}, {"s": "板块二：上海各区初三一模/二模真题·名句与情境默写精选", "sid": "sh-mock", "n": 35, "id": "sh-mock-123", "tag": "2024宝山一模第1(4)题", "t": "情境默写", "stem": "孟子在《生于忧患，死于安乐》中归纳出国家要长治久安，必须内有法度辅臣、外有敌国外患，最后总结全文核心结论的名句是：“______________________。”", "ans": "然后知生于忧患而死于安乐也", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】《孟子·告子下·生于忧患，死于安乐》。"}, {"s": "板块二：上海各区初三一模/二模真题·名句与情境默写精选", "sid": "sh-mock", "n": 36, "id": "sh-mock-124", "tag": "2023宝山二模第1(4)题", "t": "情境默写", "stem": "面对长江的滚滚波涛，苏轼在《江城子·密州出猎》中借“______________________，______________________”表达了希望得到朝廷重用、奔赴边关杀敌报国的雄心壮志。", "ans": "持节云中，何日遣冯唐", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】北宋苏轼《江城子·密州出猎》。用汉文帝派冯唐赦免魏尚之典故。"}, {"s": "板块二：上海各区初三一模/二模真题·名句与情境默写精选", "sid": "sh-mock", "n": 37, "id": "sh-mock-125", "tag": "2024松江一模第1(1)题", "t": "名句默写", "stem": "我寄愁心与明月，______________________。（李白《闻王昌龄左迁龙标遥有此寄》）", "ans": "随君直到夜郎西", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】唐代李白《闻王昌龄左迁龙标遥有此寄》。\n【修辞手法】拟人手法，将愁心托付给明月，伴随友人远赴贬所夜郎。"}, {"s": "板块二：上海各区初三一模/二模真题·名句与情境默写精选", "sid": "sh-mock", "n": 38, "id": "sh-mock-126", "tag": "2024松江一模第1(2)题", "t": "名句默写", "stem": "但愿人长久，______________________。（苏轼《水调歌头》）", "ans": "千里共婵娟", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】北宋苏轼《水调歌头·明月几时有》。\n【词义采分】婵娟：美好的月色，也指明月。"}, {"s": "板块二：上海各区初三一模/二模真题·名句与情境默写精选", "sid": "sh-mock", "n": 39, "id": "sh-mock-127", "tag": "2024松江一模第1(3)题", "t": "名句默写", "stem": "千里马常有，______________________。（韩愈《马说》）", "ans": "而伯乐不常有", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】唐代韩愈《马说》。"}, {"s": "板块二：上海各区初三一模/二模真题·名句与情境默写精选", "sid": "sh-mock", "n": 40, "id": "sh-mock-128", "tag": "2024松江一模第1(4)题", "t": "情境默写", "stem": "文天祥在《过零丁洋》中以激昂笔调表达舍生取义、誓死报国的崇高民族气节的千古名句是：“______________________，______________________。”", "ans": "人生自古谁无死，留取丹心照汗青", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】南宋文天祥《过零丁洋》。\n【易错字提示】「汗青」借指史书。"}, {"s": "板块二：上海各区初三一模/二模真题·名句与情境默写精选", "sid": "sh-mock", "n": 41, "id": "sh-mock-129", "tag": "2023松江二模第1(4)题", "t": "情境默写", "stem": "欧阳修在《醉翁亭记》中用凝练的语言描摹琅琊山春夏之景的对偶句子是：“______________________，______________________。”", "ans": "野芳发而幽香，佳木秀而繁阴", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】北宋欧阳修《醉翁亭记》。野芳：野花；佳木秀：树木繁茂。"}, {"s": "板块二：上海各区初三一模/二模真题·名句与情境默写精选", "sid": "sh-mock", "n": 42, "id": "sh-mock-130", "tag": "2024虹口一模第1(1)题", "t": "名句默写", "stem": "鸡声茅店月，______________________。（温庭筠《商山早行》）", "ans": "人迹板桥霜", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】唐代温庭筠《商山早行》。\n【手法分析】纯名词意象叠加，勾勒早行游子凄冷孤寂之景。"}, {"s": "板块二：上海各区初三一模/二模真题·名句与情境默写精选", "sid": "sh-mock", "n": 43, "id": "sh-mock-131", "tag": "2024虹口一模第1(2)题", "t": "名句默写", "stem": "九万里风鹏正举。风休住，______________________！（李清照《渔家傲》）", "ans": "蓬舟吹取三山去", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】宋代李清照《渔家傲·天接云涛连晓雾》。\n【易错字提示】「蓬舟」草字头加逢；「三山」传说中的蓬莱、方丈、瀛洲仙山。"}, {"s": "板块二：上海各区初三一模/二模真题·名句与情境默写精选", "sid": "sh-mock", "n": 44, "id": "sh-mock-132", "tag": "2024虹口一模第1(3)题", "t": "名句默写", "stem": "黄发垂髫，______________________。（陶渊明《桃花源记》）", "ans": "并怡然自乐", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】东晋陶渊明《桃花源记》。\n【借代修辞】黄发代指老人，垂髫代指小孩。怡然：欣喜满足貌。"}, {"s": "板块二：上海各区初三一模/二模真题·名句与情境默写精选", "sid": "sh-mock", "n": 45, "id": "sh-mock-133", "tag": "2024虹口一模第1(4)题", "t": "情境默写", "stem": "周敦颐在《爱莲说》中以莲花象征君子特立独行、正直不苟、不蔓不枝品格的名句是：“______________________，______________________。”", "ans": "中通外直，不蔓不枝", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】北宋周敦颐《爱莲说》。\n【词义采分】蔓：牵扯蔓生；枝：旁生枝杈。"}, {"s": "板块二：上海各区初三一模/二模真题·名句与 题", "t": "情境默写", "stem": "白居易在《钱塘湖春行》中借落花与浅草展现早春西湖盎然生机、游人流连忘返的诗句是：“______________________，______________________。”", "ans": "乱花渐欲迷人眼，浅草才能没马蹄", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】唐代白居易《钱塘湖春行》。"}, {"s": "板块二：上海各区初三一模/二模真题·名句与情境默写精选", "sid": "sh-mock", "n": 60, "id": "sh-mock-148", "tag": "2023嘉定二模第1(4)题", "t": "情境默写", "stem": "杜牧在《赤壁》中借一件沉沙折戟的小器物引发对三国历史兴亡沉思的起首名句是：“______________________，______________________。”", "ans": "折戟沉沙铁未销，自将磨洗认前朝", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】唐代杜牧《赤壁》。"}, {"s": "板块二：上海各区初三一模/二模真题·名句与情境默写精选", "sid": "sh-mock", "n": 61, "id": "sh-mock-149", "tag": "2024青浦一模第1(1)题", "t": "名句默写", "stem": "客路青山外，______________________。（王湾《次北固山下》）", "ans": "行舟绿水前", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】唐代王湾《次北固山下》。\n【考点分析】起笔点题，青山、绿水对仗工稳，写游子羁旅。"}, {"s": "板块二：上海各区初三一模/二模真题·名句与情境默写精选", "sid": "sh-mock", "n": 62, "id": "sh-mock-150", "tag": "2024青浦一模第1(4)题", "t": "情境默写", "stem": "陈子昂在《登幽州台歌》中极力表现天地辽阔无穷、历史久远漫长、自己怀才不遇无限孤寂悲怆的名句是：“______________________，______________________！”", "ans": "念天地之悠悠，独怆然而涕下", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】唐代陈子昂《登幽州台歌》。\n【易错字提示】「怆然」竖心旁；「涕」古代指眼泪。"}, {"s": "板块二：上海各区初三一模/二模真题·名句与情境默写精选", "sid": "sh-mock", "n": 63, "id": "sh-mock-151", "tag": "2024金山一模第1(4)题", "t": "情境默写", "stem": "陶渊明在《饮酒（其五）》中说明自己虽然身处喧嚣人境，却不受尘俗干扰，其根本原因在于心境超脱的两句是：“______________________？______________________。”", "ans": "问君何能尔，心远地自偏", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】东晋陶渊明《饮酒（其五）》。尔：如此；心远：内心超脱出世俗名利。"}, {"s": "板块二：上海各区初三一模/二模真题·名句与情境默写精选", "sid": "sh-mock", "n": 64, "id": "sh-mock-152", "tag": "2024奉贤一模第1(1)题", "t": "名句默写", "stem": "潭中鱼可百许头，______________________。（柳宗元《小石潭记》）", "ans": "皆若空游无所依", "img": "", "aimg": "", "src": "", "ph": false, "jx": "【出处】唐代柳宗元《小石潭记》。\n【考点分析】侧面烘托潭水清澈见底，鱼儿犹如在空气中游动一般。"}, {"s": "板块二：上海各区初三一模/二模真题·名句与情境默写精选", "sid": "sh-mock", "n": 65, "id": "sh-mock-153", "tag": "2024奉贤一模第1(4)题", "t": "情境默写", "stem": "孟子在《鱼我所欲也》中开宗明义，通过比喻提出“舍生取义”中心论点的经
