, "panels": [{"v": "晨起动征铎，客行悲故乡", "s": "清晨驿站的车铃声叮当作响，旅人上路还悲念着故乡", "img": "images/recitation-comics/shangshan-c1.webp", "no": "①"}, {"v": "鸡声茅店月，人迹板桥霜", "s": "鸡鸣声起茅草旅店上残月未落，板桥清霜之上已留下早行人的足迹", "img": "images/recitation-comics/shangshan-c2.webp", "no": "②"}, {"v": "槲叶落山路，枳花明驿墙", "s": "槲树叶飘落在山间小路上，枳树白花映照着驿站的土墙", "img": "images/recitation-comics/shangshan-c3.webp", "no": "③"}, {"v": "因思杜陵梦，凫雁满回塘", "s": "想起昨夜梦见杜陵的美景，野鸭大雁都挤满了曲折的池塘", "img": "images/recitation-comics/shangshan-c4.webp", "no": "④"}], "py": {"c": {"筠": "yún", "铎": "duó", "茅": "máo", "槲": "hú", "枳": "zhǐ", "驿": "yì"}, "w": {}}, "paras": ["晨起动征铎，客行悲故乡。鸡声茅店月，人迹板桥霜。槲叶落山路，枳花明驿墙。因思杜陵梦，凫雁满回塘。"], "hard": "筠（yún）、铎（duó）、茅（máo）、槲（hú）、枳（zhǐ）、驿（yì）、凫、（fú）", "hardList": [{"zi": "筠", "py": "yún"}, {"zi": "铎", "py": "duó"}, {"zi": "茅", "py": "máo"}, {"zi": "槲", "py": "hú"}, {"zi": "枳", "py": "zhǐ"}, {"zi": "驿", "py": "yì"}]}, {"id": 71, "slug": "wuti", "title": "无题", "author": "唐·李商隐", "type": "古诗", "panels": [{"v": "相见时难别亦难，东风无力百花残", "s": "相见机会难得离别时更难分舍，暮春东风无力百花纷纷凋残", "img": "images/recitation-comics/wuti-c1.webp", "no": "①"}, {"v": "春蚕到死丝方尽，蜡炬成灰泪始干", "s": "春蚕直到死去才把丝吐尽，蜡烛燃成灰烬烛泪才流干", "img": "images/recitation-comics/wuti-c2.webp", "no": "②"}, {"v": "晓镜但愁云鬓改，夜吟应觉月光寒", "s": "清晨对镜梳妆只愁如云乌鬓悄然改变，夜里吟诗推想对方应感到月光清寒", "img": "images/recitation-comics/wuti-c3.webp", "no": "③"}, {"v": "蓬山此去无多路，青鸟殷勤为探看", "s": "对方住处离蓬莱山没有多远了，殷勤的青鸟请为我前去探望", "img": "images/recitation-comics/wuti-c4.webp", "no": "④"}], "py": {"c": {"隐": "yǐn", "蚕": "cán", "炬": "jù", "鬓": "bìn", "吟": "yín", "蓬": "péng"}, "w": {}}, "paras": ["相见时难别亦难，东风无力百花残。春蚕到死丝方尽，蜡炬成灰泪始干。晓镜但愁云鬓改，夜吟应觉月光寒。蓬山此去无多路，青鸟殷勤为探看。"], "hard": "隐（yǐn）、蚕（cán）、炬（jù）、鬓（bìn）、吟（yín）、蓬（péng）、殷、（yīn）", "hardList": [{"zi": "隐", "py": "yǐn"}, {"zi": "蚕", "py": "cán"}, {"zi": "炬", "py": "jù"}, {"zi": "鬓", "py": "bìn"}, {"zi": "吟", "py": "yín"}, {"zi": "蓬", "py": "péng"}]}]}, {"vol": "九年级（下册）", "color": "#DB2777", "items": [{"id": 72, "slug": "yuwosuoyuye", "title": "鱼我所欲也", "author": "《孟子》", "type": "文言文", "panels": [{"v": "鱼，我所欲也；熊掌，亦我所欲也。二者不可得兼，舍鱼而取熊掌者也", "s": "桌上摆着鱼和熊掌两样美味，二者不可兼得时便舍弃鱼而选取熊掌", "img": "images/recitation-comics/yuwosuoyuye-c1.webp", "no": "①"}, {"v": "生，亦我所欲也；义，亦我所欲也。二者不可得兼，舍生而取义者也", "s": "生命是我珍视的，大义也是我珍视的，二者不可兼得时便舍弃生命而选取大义", "img": "images/recitation-comics/yuwosuoyuye-c2.webp", "no": "②"}, {"v": "一箪食，一豆羹，得之则生，弗得则死。呼尔而与之，行道之人弗受", "s": "饿汉跪在路旁，即使是一箪饭一碗羹，呵斥着给他连过路的饿人也不肯接受", "img": "images/recitation-comics/yuwosuoyuye-c3.webp", "no": "③"}, {"v": "乡为身死而不受，今为宫室之美为之：此之谓失其本心", "s": "从前宁死也不接受的东西，如今却为了豪宅美眷而接受，这便叫做丧失了本性", "img": "images/recitation-comics/yuwosuoyuye-c4.webp", "no": "④"}], "py": {"c": {"兼": "jiān", "苟": "gǒu", "辟": "bì", "箪": "dān", "羹": "gēng", "屑": "xiè", "辩": "biàn", "乡": "xiàng", "乏": "fá", "得": "dé", "与": "yǔ"}, "w": {}}, "paras": ["鱼，我所欲也；熊掌，亦我所欲也。二者不可得兼，舍鱼而取熊掌者也。生，亦我所欲也；义，亦我所欲也。二者不可得兼，舍生而取义者也。生亦我所欲，所欲有甚于生者，故不为苟得也；死亦我所恶，所恶有甚于死者，故患有所不辟也。如使人之所欲莫甚于生，则凡可以得生者何不用也？使人之所恶莫甚于死者，则凡可以辟患者何不为也？由是则生而有不用也，由是则可以辟患而有不为也。是故所欲有甚于生者，所恶有甚于死者。非独贤者有是心也，人皆有之，贤者能勿丧耳。一箪食，一豆羹，得之则生，弗得则死。呼尔而与之，行道之人弗受；蹴尔而与之，乞人不屑也。万钟则不辩礼义而受之，万钟于我何加焉！为宫室之美，妻妾之奉，所识穷乏者得我与？乡为身死而不受，今为宫室之美为之；乡为身死而不受，今为妻妾之奉为之；乡为身死而不受，今为所识穷乏者得我而为之：是亦不可以已乎？此之谓失其本心。"], "hard": "兼（jiān）、苟（gǒu）、辟（bì，通“避”）、箪（dān）、羹（gēng）、蹴、（cù）、屑（xiè）、辩（biàn，通“辨”）、乡（xiàng，通“向”）、乏（fá）、得（dé，、通“德”）、与（yú，通“欤”）", "hardList": [{"zi": "兼", "py": "jiān"}, {"zi": "苟", "py": "gǒu"}, {"zi": "辟", "py": "bì，通“避”"}, {"zi": "箪", "py": "dān"}, {"zi": "羹", "py": "gēng"}, {"zi": "屑", "py": "xiè"}, {"zi": "辩", "py": "biàn，通“辨”"}, {"zi": "乡", "py": "xiàng，通“向”"}, {"zi": "乏", "py": "fá"}, {"zi": "得", "py": "dé，、通“德”"}, {"zi": "与", "py": "yú，通“欤”"}]}, {"id": 73, "slug": "caogui", "title": "曹刿论战", "author": "《左传》", "type": "文言文", "panels": [{"v": "齐师伐我。公将战，曹刿请见", "s": "齐国军队攻打鲁国，鲁庄公准备迎战，平民曹刿主动请求进见献策", "img": "images/recitation-comics/caogui-c1.webp", "no": "①"}, {"v": "小大之狱，虽不能察，必以情。对曰：忠之属也。可以一战", "s": "庄公答：大大小小的诉讼案件即使不能一一明察也一定按实情处理，曹刿说这是尽职尽责的表现，可以凭此一战", "img": "images/recitation-comics/caogui-c2.webp", "no": "②"}, {"v": "一鼓作气，再而衰，三而竭。彼竭我盈，故克之", "s": "长勺之战齐人三次击鼓进军，曹刿按兵不动待齐军士气衰竭鲁军一鼓作气掩杀过去，大败齐师", "img": "images/recitation-comics/caogui-c3.webp", "no": "③"}, {"v": "吾视其辙乱，望其旗靡，故逐之", "s": "齐军败退时曹刿下车察看车辙、登上车轼远望，见辙乱旗倒才下令追击", "img": "images/recitation-comics/caogui-c4.webp", "no": "④"}], "py": {"c": {"刿": "guì", "间": "jiàn", "鄙": "bǐ", "帛": "bó", "孚": "fú", "狱": "yù", "辙": "zhé", "轼": "shì", "靡": "mǐ"}, "w": {}}, "paras": ["十年春，齐师伐我。公将战，曹刿请见。其乡人曰：“肉食者谋之，又何间焉？”刿曰：“肉食者鄙，未能远谋。”乃入见。问：“何以战？”公曰：“衣食所安，弗敢专也，必以分人。”对曰：“小惠未遍，民弗从也。”公曰：“牺牲玉帛，弗敢加也，必以信。”对曰：“小信未孚，神弗福也。”公曰：“小大之狱，虽不能察，必以情。”对曰：“忠之属也。可以一战。战则请从。”公与之乘，战于长勺。公将鼓之。刿曰：“未可。”齐人三鼓。刿曰：“可矣。”齐师败绩。公将驰之。刿曰：“未可。”下视其辙，登轼而望之，曰：“可矣。”遂逐齐师。既克，公问其故。对曰：“夫战，勇气也。一鼓作气，再而衰，三而竭。彼竭我盈，故克之。夫大国，难测也，惧有伏焉。吾视其辙乱，望其旗靡，故逐之。”"], "hard": "刿（guì）、间（jiàn）、鄙（bǐ）、帛（bó）、孚（fú）、狱（yù）、勺、（sháo）、辙（zhé）、轼（shì）、靡（mǐ）", "hardList": [{"zi": "刿", "py": "guì"}, {"zi": "间", "py": "jiàn"}, {"zi": "鄙", "py": "bǐ"}, {"zi": "帛", "py": "bó"}, {"zi": "孚", "py": "fú"}, {"zi": "狱", "py": "yù"}, {"zi": "辙", "py": "zhé"}, {"zi": "轼", "py": "shì"}, {"zi": "靡", "py": "mǐ"}]}, {"id": 74, "slug": "chushibiao", "title": "出师表", "author": "三国·诸葛亮", "type": "文言文", "panels": [{"v": "先帝创业未半而中道崩殂，今天下三分，益州疲弊，此诚危急存亡之秋也", "s": "先帝开创大业未半而中道离世，如今天下三分益州民力困乏，这实在是危急存亡的关键时刻", "img": "images/recitation-comics/chushibiao-c1.webp", "no": "①"}, {"v": "亲贤臣，远小人，此先汉所以兴隆也；亲小人，远贤臣，此后汉所以倾颓也", "s": "诸葛亮在表中恳切进言：亲近贤臣疏远小人这是前汉兴隆的原因，亲近小人疏远贤臣这是后汉衰败的缘由", "img": "images/recitation-comics/chushibiao-c2.webp", "no": "②"}, {"v": "先帝不以臣卑鄙，猥自枉屈，三顾臣于草庐之中", "s": "先帝不因我出身低微屈尊自降，三次到草庐之中来访我，我由是感激，遂许先帝以驱驰", "img": "images/recitation-comics/chushibiao-c3.webp", "no": "③"}, {"v": "受命以来，夙夜忧叹……五月渡泸，深入不毛。今当远离，临表涕零，不知所言", "s": "受命以来日夜忧叹，五月率军渡过泸水深入不毛之地，如今南方已定兵甲已足，当奖率三军北定中原，临行泪落不知所言", "img": "images/recitation-comics/chushibiao-c4.webp", "no": "④"}], "py": {"c": {"殂": "cú", "弊": "bì", "懈": "xiè", "恢": "huī", "妄": "wàng", "菲": "fěi", "陟": "zhì", "否": "pǐ", "攸": "yōu", "祎": "yī", "遗": "wèi", "裨": "bì", "阙": "quē", "淑": "shū", "颓": "tuí", "桓": "huán", "猥": "wěi", "有": "yòu", "夙": "sù", "泸": "lú", "驽": "nú", "钝": "dùn", "攘": "rǎng", "斟": "zhēn", "彰": "zhāng", "咎": "jiù", "诹": "zōu"}, "w": {}}, "paras": ["先帝创业未半而中道崩殂，今天下三分，益州疲弊，此诚危急存亡之秋也。然侍卫之臣不懈于内，忠志之士忘身于外者，盖追先帝之殊遇，欲报之于陛下也。诚宜开张圣听，以光先帝遗德，恢弘志士之气，不宜妄自菲薄，引喻失义，以塞忠谏之路也。宫中府中，俱为一体，陟罚臧否，不宜异同。若有作奸犯科及为忠善者，宜付有司论其刑赏，以昭陛下平明之理，不宜偏私，使内外异法也。侍中、侍郎郭攸之、费祎、董允等，此皆良实，志虑忠纯，是以先帝简拔以遗陛下。愚以为宫中之事，事无大小，悉以咨之，然后施行，必能裨补阙漏，有所广益。将军向宠，性行淑均，晓畅军事，试用于昔日，先帝称之曰能，是以众议举宠为督。愚以为营中之事，悉以咨之，必能使行阵和睦，优劣得所。亲贤臣，远小人，此先汉所以兴隆也；亲小人，远贤臣，此后汉所以倾颓也。先帝在时，每与臣论此事，未尝不叹息痛恨于桓、灵也。侍中、尚书、长史、参军，此悉贞良死节之臣，愿陛下亲之信之，则汉室之隆，可计日而待也。臣本布衣，躬耕于南阳，苟全性命于乱世，不求闻达于诸侯。先帝不以臣卑鄙，猥自枉屈，三顾臣于草庐之中，咨臣以当世之事，由是感激，遂许先帝以驱驰。后值倾覆，受任于败军之际，奉命于危难之间，尔来二十有一年矣。", "先帝知臣谨慎，故临崩寄臣以大事也。受命以来，夙夜忧叹，恐托付不效，以伤先帝之明，故五月渡泸，深入不毛。今南方已定，兵甲已足，当奖率三军，北定中原，庶竭驽钝，攘除奸凶，兴复汉室，还于旧都。此臣所以报先帝而忠陛下之职分也。至于斟酌损益，进尽忠言，则攸之、祎、允之任也。愿陛下托臣以讨贼兴复之效，不效，则治臣之罪，以告先帝之灵。若无兴德之言，则责攸之、祎、允等之慢，以彰其咎。陛下亦宜自谋，以咨诹善道，察纳雅言，深追先帝遗诏。臣不胜受恩感激。今当远离，临表涕零，不知所言。"], "hard": "殂（cú）、弊（bì）、懈（xiè）、恢（huī）、妄（wàng）、菲（fěi）、谏、（jiàn）、陟（zhì）、臧否（zāng pǐ）、攸（yōu）、祎（yī）、遗（wèi，赠送）、咨、（zī）、裨（bì）、阙（quē）、淑（shū）、颓（tuí）、桓（huán）、猥（wěi）、有（yòu，、通“又”）、夙（sù）、泸（lú）、驽（nú）、钝（dùn）、攘（rǎng）、斟（zhēn）、酌、（zhuó）、彰（zhāng）、咎（jiù）、诹（zōu）", "hardList": [{"zi": "殂", "py": "cú"}, {"zi": "弊", "py": "bì"}, {"zi": "懈", "py": "xiè"}, {"zi": "恢", "py": "huī"}, {"zi": "妄", "py": "wàng"}, {"zi": "菲", "py": "fěi"}, {"zi": "陟", "py": "zhì"}, {"zi": "否", "py": "zāng pǐ"}, {"zi": "攸", "py": "yōu"}, {"zi": "祎", "py": "yī"}, {"zi": "遗", "py": "wèi，赠送"}, {"zi": "裨", "py": "bì"}, {"zi": "阙", "py": "quē"}, {"zi": "淑", "py": "shū"}, {"zi": "颓", "py": "tuí"}, {"zi": "桓", "py": "huán"}, {"zi": "猥", "py": "wěi"}, {"zi": "有", "py": "yòu，、通“又”"}, {"zi": "夙", "py": "sù"}, {"zi": "泸", "py": "lú"}, {"zi": "驽", "py": "nú"}, {"zi": "钝", "py": "dùn"}, {"zi": "攘", "py": "rǎng"}, {"zi": "斟", "py": "zhēn"}, {"zi": "彰", "py": "zhāng"}, {"zi": "咎", "py": "jiù"}, {"zi": "诹", "py": "zōu"}]}, {"id": 75, "slug": "songdongyang", "title": "送东阳马生序", "author": "明·宋濂", "type": "文言文", "panels": [{"v": "家贫，无从致书以观，每假借于藏书之家，手自笔录，计日以还", "s": "幼时家贫无书可读，常向藏书之家借书亲手抄录，按约定的日子归还从不失信", "img": "images/recitation-comics/songdongyang-c1.webp", "no": "①"}, {"v": "天大寒，砚冰坚，手指不可屈伸，弗之怠", "s": "大寒时节砚台里的墨结成了坚冰，手指冻得不能屈伸，仍然不敢懈怠抄录不辍", "img": "images/recitation-comics/songdongyang-c2.webp", "no": "②"}, {"v": "余立侍左右，援疑质理，俯身倾耳以请；或遇其叱咄，色愈恭，礼愈至", "s": "百里之外求师问学，恭敬地站立在老师身旁提出疑难询问道理，俯下身子侧着耳朵请教，遇到训斥时神情更加恭谨礼数更加周到", "img": "images/recitation-comics/songdongyang-c3.webp", "no": "③"}, {"v": "负箧曳屣行深山巨谷中。穷冬烈风，大雪深数尺，足肤皲裂而不知", "s": "背着书箱拖着鞋子行走在深山大谷之中，穷冬烈风大雪深达数尺，脚上的皮肤冻裂了也浑然不觉", "img": "images/recitation-comics/songdongyang-c4.webp", "no": "④"}], "py": {"c": {"濂": "lián", "嗜": "shì", "砚": "yàn", "弗": "fú", "怠": "dài", "逾": "yú", "硕": "shuò", "趋": "qū", "叩": "kòu", "填": "tián", "援": "yuán", "咄": "duō", "俟": "sì", "卒": "zú", "箧": "qiè", "曳": "yè", "屣": "xǐ", "皲": "jūn", "媵": "yìng", "食": "sì", "被": "pī", "绮": "qǐ", "缨": "yīng", "烨": "yè", "缊": "yùn", "敝": "bì"}, "w": {}}, "paras": ["余幼时即嗜学。家贫，无从致书以观，每假借于藏书之家，手自笔录，计日以还。天大寒，砚冰坚，手指不可屈伸，弗之怠。录毕，走送之，不敢稍逾约。以是人多以书假余，余因得遍观群书。既加冠，益慕圣贤之道。又患无硕师名人与游，尝趋百里外，从乡之先达执经叩问。先达德隆望尊，门人弟子填其室，未尝稍降辞色。余立侍左右，援疑质理，俯身倾耳以请；或遇其叱咄，色愈恭，礼愈至，不敢出一言以复；俟其欣悦，则又请焉。故余虽愚，卒获有所闻。当余之从师也，负箧曳屣行深山巨谷中。穷冬烈风，大雪深数尺，足肤皲裂而不知。至舍，四支僵劲不能动，媵人持汤沃灌，以衾拥覆，久而乃和。寓逆旅，主人日再食，无鲜肥滋味之享。同舍生皆被绮绣，戴朱缨宝饰之帽，腰白玉之环，左佩刀，右备容臭，烨然若神人；余则缊袍敝衣处其间，略无慕艳意，以中有足乐者，不知口体之奉不若人也。盖余之勤且艰若此。"], "hard": "濂（lián）、嗜（shì）、砚（yàn）、弗（fú）、怠（dài）、逾（yú）、冠、（guān）、硕（shuò）、趋（qū）、叩（kòu）、填（tián）、援（yuán）、叱咄（chì、duō）、俟（sì）、卒（zú）、箧（qiè）、曳（yè）、屣（xǐ）、皲（jūn）、媵（yìng）、衾、（qīn）、食（sì）、被（pī，通“披”）、绮（qǐ）、缨（yīng）、烨（yè）、缊（yùn）、、敝（bì）", "hardList": [{"zi": "濂", "py": "lián"}, {"zi": "嗜", "py": "shì"}, {"zi": "砚", "py": "yàn"}, {"zi": "弗", "py": "fú"}, {"zi": "怠", "py": "dài"}, {"zi": "逾", "py": "yú"}, {"zi": "硕", "py": "shuò"}, {"zi": "趋", "py": "qū"}, {"zi": "叩", "py": "kòu"}, {"zi": "填", "py": "tián"}, {"zi": "援", "py": "yuán"}, {"zi": "咄", "py": "chì、duō"}, {"zi": "俟", "py": "sì"}, {"zi": "卒", "py": "zú"}, {"zi": "箧", "py": "qiè"}, {"zi": "曳", "py": "yè"}, {"zi": "屣", "py": "xǐ"}, {"zi": "皲", "py": "jūn"}, {"zi": "媵", "py": "yìng"}, {"zi": "食", "py": "sì"}, {"zi": "被", "py": "pī，通“披”"}, {"zi": "绮", "py": "qǐ"}, {"zi": "缨", "py": "yīng"}, {"zi": "烨", "py": "yè"}, {"zi": "缊", "py": "yùn"}, {"zi": "敝", "py": "bì"}]}, {"id": 76, "slug": "baixuege", "title": "白雪歌送武判官归京", "author": "唐·岑参", "type": "古诗", "panels": [{"v": "北风卷地白草折，胡天八月即飞雪", "s": "北风席卷大地吹折白草，塞外八月就已满天飞雪", "img": "images/recitation-comics/baixuege-c1.webp", "no": "①"}, {"v": "忽如一夜春风来，千树万树梨花开", "s": "好像一夜之间春风忽然吹来，千万棵树上仿佛梨花竞相开放", "img": "images/recitation-comics/baixuege-c2.webp", "no": "②"}, {"v": "瀚海阑干百丈冰，愁云惨淡万里凝", "s": "沙漠纵横结着百丈坚冰，愁云暗淡在万里长空凝滞", "img": "images/recitation-comics/baixuege-c3.webp", "no": "③"}, {"v": "山回路转不见君，雪上空留马行处", "s": "轮台东门设帐送别友人，山路回转友人身影已消失，雪地上只空留一行马蹄印", "img": "images/recitation-comics/baixuege-c4.webp", "no": "④"}], "py": {"c": {"衾": "qīn", "着": "zhuó", "瀚": "hàn", "阑": "lán", "琶": "pá", "辕": "yuán", "掣": "chè"}, "w": {}}, "paras": ["北风卷地白草折，胡天八月即飞雪。忽如一夜春风来，千树万树梨花开。散入珠帘湿罗幕，狐裘不暖锦衾薄。", "将军角弓不得控，都护铁衣冷难着。瀚海阑干百丈冰，愁云惨淡万里凝。中军置酒饮归客，胡琴琵琶与羌笛。纷纷暮雪下辕门，风掣红旗冻不翻。轮台东门送君去，去时雪满天山路。山回路转不见君，雪上空留马行处。"], "hard": "衾（qīn）、着（zhuó，穿）、瀚（hàn）、阑（lán）、琵琶（pí pá）、羌、（qiāng）、辕（yuán）、掣（chè）", "hardList": [{"zi": "衾", "py": "qīn"}, {"zi": "着", "py": "zhuó，穿"}, {"zi": "瀚", "py": "hàn"}, {"zi": "阑", "py": "lán"}, {"zi": "琶", "py": "pí pá"}, {"zi": "辕", "py": "yuán"}, {"zi": "掣", "py": "chè"}]}, {"id": 77, "slug": "guolingdingyang", "title": "过零丁洋", "author": "宋·文天祥", "type": "古诗", "panels": [{"v": "辛苦遭逢起一经，干戈寥落四周星", "s": "靠精通经书考试入仕历尽辛苦，在荒凉冷落的战火中已度过四年", "img": "images/recitation-comics/guolingdingyang-c1.webp", "no": "①"}, {"v": "山河破碎风飘絮，身世浮沉雨打萍", "s": "大宋山河支离破碎像被风吹散的柳絮，自身浮沉如雨中漂泊无依的浮萍", "img": "images/recitation-comics/guolingdingyang-c2.webp", "no": "②"}, {"v": "惶恐滩头说惶恐，零丁洋里叹零丁", "s": "惶恐滩头曾诉说心中的惶恐，零丁洋里如今慨叹自身的孤零", "img": "images/recitation-comics/guolingdingyang-c3.webp", "no": "③"}, {"v": "人生自古谁无死，留取丹心照汗青", "s": "人生自古以来有谁能不死？留下这颗赤诚之心永远光照史册", "img": "images/recitation-comics/guolingdingyang-c4.webp", "no": "④"}], "py": {"c": {"寥": "liáo", "絮": "xù", "萍": "píng", "惶": "huáng", "青": "qīng"}, "w": {}}, "paras": ["辛苦遭逢起一经，干戈寥落四周星。山河破碎风飘絮，身世浮沉雨打萍。惶恐滩头说惶恐，零丁洋里叹零丁。人生自古谁无死，留取丹心照汗青。"], "hard": "寥（liáo）、絮（xù）、萍（píng）、惶（huáng）、汗青（hàn qīng，史、册）", "hardList": [{"zi": "寥", "py": "liáo"}, {"zi": "絮", "py": "xù"}, {"zi": "萍", "py": "píng"}, {"zi": "惶", "py": "huáng"}, {"zi": "青", "py": "hàn qīng，史、册"}]}, {"id": 78, "slug": "shanpoyang", "title": "山坡羊·潼关怀古", "author": "元·张养浩", "type": "曲", "panels": [{"v": "峰峦如聚，波涛如怒，山河表里潼关路", "s": "华山的峰峦从四面八方汇聚，黄河的波涛奔腾咆哮，潼关外有黄河内有华山山河环抱", "img": "images/recitation-comics/shanpoyang-c1.webp", "no": "①"}, {"v": "望西都，意踌躇", "s": "遥望古都长安，心潮起伏思绪万千", "img": "images/recitation-comics/shanpoyang-c2.webp", "no": "②"}, {"v": "伤心秦汉经行处，宫阙万间都做了土", "s": "令人伤心的地方是秦汉故地经过之处，万千宫殿如今都化作了尘土", "img": "images/recitation-comics/shanpoyang-c3.webp", "no": "③"}, {"v": "兴，百姓苦；亡，百姓苦", "s": "朝代兴起百姓受苦，朝代灭亡百姓依旧受苦", "img": "images/recitation-comics/shanpoyang-c4.webp", "no": "④"}], "py": {"c": {"潼": "tóng", "峦": "luán", "躇": "chú", "阙": "què"}, "w": {}}, "paras": ["峰峦如聚，波涛如怒，山河表里潼关路。望西都，意踌躇。伤心秦汉经行处，宫阙万间都做了土。兴，百姓苦；亡，百姓苦。"], "hard": "潼（tóng）、峦（luán）、踌躇（chóu chú）、阙（què）", "hardList": [{"zi": "潼", "py": "tóng"}, {"zi": "峦", "py": "luán"}, {"zi": "躇", "py": "chóu chú"}, {"zi": "阙", "py": "què"}]}, {"id": 79, "slug": "nanxiangzi", "title": "南乡子·登京口北固亭有怀", "author": "宋·辛弃疾", "type": "词", "panels": [{"v": "何处望神州？满眼风光北固楼", "s": "登上京口北固亭远望，中原故土在哪里呢？满眼所见只有北固楼四周的风光", "img": "images/recitation-comics/nanxiangzi-c1.webp", "no": "①"}, {"v": "千古兴亡多少事？悠悠。不尽长江滚滚流", "s": "千古兴亡多少事悠悠难说，只有不尽的长江滚滚东流", "img": "images/recitation-comics/nanxiangzi-c2.webp", "no": "②"}, {"v": "年少万兜鍪，坐断东南战未休", "s": "孙权年纪轻轻就统率千军万马，占据东南坚持征战不休", "img": "images/recitation-comics/nanxiangzi-c3.webp", "no": "③"}, {"v": "天下英雄谁敌手？曹刘。生子当如孙仲谋", "s": "天下英雄谁是孙权的对手？只有曹操和刘备，生儿子就应当像孙仲谋一样", "img": "images/recitation-comics/nanxiangzi-c4.webp", "no": "④"}], "py": {"c": {"鍪": "móu"}, "w": {}}, "paras": ["何处望神州？满眼风光北固楼。千古兴亡多少事？悠悠。不尽长江滚滚流。年少万兜鍪，坐断东南战未休。天下英雄谁敌手？曹刘。生子当如孙仲谋。"], "hard": "兜鍪（dōu móu）", "hardList": [{"zi": "鍪", "py": "dōu móu"}]}, {"id": 80, "slug": "pozhenzi", "title": "破阵子·为陈同甫赋壮词以寄之", "author": "宋·辛弃疾", "type": "词", "panels": [{"v": "醉里挑灯看剑，梦回吹角连营", "s": "醉里挑亮灯芯端详宝剑，梦中回到号角连天的军营", "img": "images/recitation-comics/pozhenzi-c1.webp", "no": "①"}, {"v": "八百里分麾下炙，五十弦翻塞外声，沙场秋点兵", "s": "军营里把烤牛肉分给部下，乐器奏起雄壮的边塞军歌，秋天在沙场上检阅军队", "img": "images/recitation-comics/pozhenzi-c2.webp", "no": "②"}, {"v": "马作的卢飞快，弓如霹雳弦惊", "s": "战马像的卢马一样飞驰，弓弦响声如惊雷霹雳", "img": "images/recitation-comics/pozhenzi-c3.webp", "no": "③"}, {"v": "了却君王天下事，赢得生前身后名。可怜白发生", "s": "一心想为君王完成收复中原的大业，赢得生前死后的美名，可惜壮志未酬满头白发已生", "img": "images/recitation-comics/pozhenzi-c4.webp", "no": "④"}], "py": {"c": {"麾": "huī", "炙": "zhì", "弦": "xián", "雳": "lì", "赢": "yíng"}, "w": {}}, "paras": ["醉里挑灯看剑，梦回吹角连营。八百里分麾下炙，五十弦翻塞外声，沙场秋点兵。马作的卢飞快，弓如霹雳弦惊。了却君王天下事，赢得生前身后名。可怜白发生！"], "hard": "麾（huī）、炙（zhì）、弦（xián）、霹雳（pī lì）、赢（yíng）", "hardList": [{"zi": "麾", "py": "huī"}, {"zi": "炙", "py": "zhì"}, {"zi": "弦", "py": "xián"}, {"zi": "雳", "py": "pī lì"}, {"zi": "赢", "py": "yíng"}]}, {"id": 81, "slug": "linjiangxian", "title": "临江仙·夜登小阁，忆洛中旧游", "author": "宋·陈与义", "type": "词", "panels": [{"v": "忆昔午桥桥上饮，坐中多是豪英", "s": "回忆当年在午桥桥上宴饮，在座的多是英雄才俊", "img": "images/recitation-comics/linjiangxian-c1.webp", "no": "①"}, {"v": "长沟流月去无声。杏花疏影里，吹笛到天明", "s": "月光随长沟流水悄悄逝去无声无息，杏花稀疏的影子里吹着笛子直到天明", "img": "images/recitation-comics/linjiangxian-c2.webp", "no": "②"}, {"v": "二十余年如一梦，此身虽在堪惊", "s": "二十多年过去恍如一场梦，此身虽在回首往事胆战心惊", "img": "images/recitation-comics/linjiangxian-c3.webp", "no": "③"}, {"v": "古今多少事，渔唱起三更", "s": "闲登小阁看新雨初晴的夜色，古今多少兴亡旧事，都化作渔人三更时的歌声", "img": "images/recitation-comics/linjiangxian-c4.webp", "no": "④"}], "py": {"c": {"堪": "kān", "渔": "yú"}, "w": {}}, "paras": ["忆昔午桥桥上饮，坐中多是豪英。长沟流月去无声。杏花疏影里，吹笛到天明。二十余年如一梦，此身虽在堪惊。闲登小阁看新晴。古今多少事，渔唱起三更。"], "hard": "堪（kān）、渔（yú）", "hardList": [{"zi": "堪", "py": "kān"}, {"zi": "渔", "py": "yú"}]}, {"id": 82, "slug": "jiangchengzi", "title": "江城子·密州出猎", "author": "宋·苏轼", "type": "词", "panels": [{"v": "老夫聊发少年狂，左牵黄，右擎苍", "s": "老夫姑且抒发一回少年人的狂气，左手牵着猎 "}, {"zi": "畔", "py": "pàn"}, {"zi": "嘶", "py": "sī"}, {"zi": "戍", "py": "shù"}, {"zi": "垒", "py": "lěi"}]}]}];
const flat = [];
DATA.forEach(v => v.items.forEach(it => flat.push({...it, vol: v.vol, color: v.color})));
const TOTAL = flat.length;

const $ = id => document.getElementById(id);
let cur = 0, curPanel = 0, blurMode = false, showScene = true;

/* ---------- 难字注音 ---------- */
const PYM = {};
flat.forEach(p => { PYM[p.id] = p.py || {c:{}, w:{}}; });

function esc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function annotate(text, m) {
  if (!m) return esc(text);
  const marks = new Array(text.length).fill(null);
  const words = m.w || {}, chars = m.c || {};
  Object.keys(words).forEach(w => {
    const syl = String(words[w]).split(' ');
    let from = 0, i;
    while ((i = text.indexOf(w, from)) !== -1) {
      for (let k = 0; k < w.length; k++) marks[i + k] = syl[k] || '';
      from = i + w.length;
    }
  });
  Object.keys(chars).forEach(zi => {
    for (let i = 0; i < text.length; i++) if (text[i] === zi && !marks[i]) marks[i] = chars[zi];
  });
  let out = '';
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    out += marks[i] ? `<ruby>${esc(ch)}<rt>${esc(marks[i])}</rt></ruby>` : esc(ch);
  }
  return out;
}

/* ---------- sidebar ---------- */
let html = '';
DATA.forEach((v, vi) => {
  html += `<div class="vol${vi === 0 ? ' open' : ''}" data-vol="${vi}">
    <button class="vol-btn">
      <span class="dot" style="background:${v.color}"></span>${v.vol}
      <span class="cnt">${v.items.length}</span><span class="arw">▶</span>
    </button>
    <div class="vol-list">`;
  v.items.forEach(it => {
    html += `<button class="poem-btn" data-id="${it.id}">
      <span class="pno">${String(it.id + 1).padStart(2, '0')}</span><span>${it.title}</span>
    </button>`;
  });
  html += `</div></div>`;
});
$('sideBody').innerHTML = html;
$('sideCount').textContent = TOTAL + ' 篇';

$('sideBody').addEventListener('click', e => {
  const vb = e.target.closest('.vol-btn');
  if (vb) { vb.parentElement.classList.toggle('open'); return; }
  const pb = e.target.closest('.poem-btn');
  if (pb) { go(+pb.dataset.id); closeSide(); }
});

/* ---------- render ---------- */
function go(i) {
  cur = (i + TOTAL) % TOTAL;
  const p = flat[cur];
  $('pTitle').textContent = p.title;
  $('pMeta').innerHTML =
    `<span class="chip vol" style="background:${p.color}">${p.vol}</span>` +
    `<span class="chip">${p.author}</span>` +
    `<span class="chip type">${p.type}</span>` +
    `<span class="chip">四格连环画</span>`;
  $('pCounter').textContent = `${cur + 1} / ${TOTAL}`;

  $('grid').innerHTML = p.panels.map((pn, k) => `
    <article class="pn${blurMode ? ' hide-verse' : ''}${showScene ? '' : ' no-scene'}" data-k="${k}">
      <div class="pn-img">
        <span class="pn-no">${pn.no}</span>
        <img src="${pn.img}" alt="${p.title} 第${k + 1}格" loading="${k < 2 ? 'eager' : 'lazy'}">
        <span class="reveal-tip">点击看图猜诗句</span>
      </div>
      <div class="pn-txt">
        <div class="verse">${annotate(pn.v, PYM[p.id])}</div>
        <div class="scene">${pn.s}</div>
      </div>
    </article>`).join('');

  // 渲染考纲标准全篇原文
  const fullContentEl = $('fulltextContent');
  if (p.paras && p.paras.length) {
    fullContentEl.innerHTML = p.paras.map(para => {
      // 对全篇原文中难字进行权威注音高亮标注
      return `<p>${annotate(para, PYM[p.id])}</p>`;
    }).join('');
  } else {
    // 降级使用四格的合集
    fullContentEl.innerHTML = `<p>${p.panels.map(pn => annotate(pn.v, PYM[p.id])).join('　')}</p>`;
  }

  // 渲染生僻/易错字速记药丸
  const pillListEl = $('hardPillList');
  const rawNoteEl = $('hardRawNote');
  const hardBoxEl = $('hardBox');
  if (p.hardList && p.hardList.length) {
    hardBoxEl.style.display = 'block';
    pillListEl.innerHTML = p.hardList.map(h => `
      <span class="hard-pill">
        <span class="hz">${h.zi}</span>
        <span class="py">${h.py}</span>
      </span>
    `).join('');
    rawNoteEl.innerHTML = `<strong>【PDF考纲原注】</strong>${p.hard || '—'}`;
  } else if (p.hard) {
    hardBoxEl.style.display = 'block';
    pillListEl.innerHTML = '';
    rawNoteEl.innerHTML = `<strong>【PDF考纲原注】</strong>${p.hard}`;
  } else {
    hardBoxEl.style.display = 'none';
  }

  document.querySelectorAll('.poem-btn').forEach(b => b.classList.toggle('active', +b.dataset.id === cur));
  const volBox = document.querySelector(`.vol[data-vol="${DATA.findIndex(v => v.vol === p.vol)}"]`);
  if (volBox) volBox.classList.add('open');
  const act = document.querySelector('.poem-btn.active');
  if (act) act.scrollIntoView({block: 'nearest'});
  window.scrollTo({top: 0, behavior: 'smooth'});
  history.replaceState(null, '', '#' + p.slug);
}

/* ---------- panel interactions ---------- */
$('grid').addEventListener('click', e => {
  const pn = e.target.closest('.pn');
  if (!pn) return;
  const k = +pn.dataset.k;
  if (blurMode && !pn.classList.contains('revealed')) {
    pn.classList.add('revealed');
  } else {
    openLb(k);
  }
});

/* ---------- lightbox ---------- */
function openLb(k) {
  curPanel = k;
  const p = flat[cur], pn = p.panels[k];
  $('lbImg').src = pn.img;
  $('lbVerse').innerHTML = annotate(pn.v, PYM[p.id]);
  $('lbScene').textContent = `${p.title} · ${p.author}　|　${pn.s}`;
  $('lb').classList.add('show');
}
function closeLb() { $('lb').classList.remove('show'); }
$('lbClose').onclick = closeLb;
$('lb').onclick = e => { if (e.target === $('lb') || e.target.id === 'lbImg') closeLb(); };
$('lbPrev').onclick = e => { e.stopPropagation(); openLb((curPanel + 3) % 4); };
$('lbNext').onclick = e => { e.stopPropagation(); openLb((curPanel + 1) % 4); };
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeLb();
  if ($('lb').classList.contains('show')) {
    if (e.key === 'ArrowLeft') openLb((curPanel + 3) % 4);
    if (e.key === 'ArrowRight') openLb((curPanel + 1) % 4);
    return;
  }
  if (e.key === 'ArrowLeft') go(cur - 1);
  if (e.key === 'ArrowRight') go(cur + 1);
});
document.addEventListener('touchstart', e => { tsx = e.touches[0].clientX; }, {passive: true});
let tsx = 0;
document.addEventListener('touchend', e => {
  if ($('lb').classList.contains('show')) return;
  const dx = e.changedTouches[0].clientX - tsx;
  if (Math.abs(dx) > 90) go(cur + (dx < 0 ? 1 : -1));
}, {passive: true});

/* ---------- toolbar ---------- */
$('btnPrev').onclick = () => go(cur - 1);
$('btnNext').onclick = () => go(cur + 1);
$('btnBlur').onclick = () => {
  blurMode = !blurMode;
  $('btnBlur').classList.toggle('on', blurMode);
  $('btnBlur').textContent = blurMode ? '👁 背诗中' : '👁 看图背诗';
  document.querySelectorAll('.pn').forEach(pn => {
    pn.classList.toggle('hide-verse', blurMode);
    pn.classList.remove('revealed');
  });
};
$('btnPy').onclick = () => {
  const off = document.body.classList.toggle('no-py');
  $('btnPy').classList.toggle('on', !off);
  $('btnPy').textContent = off ? '🔤 拼音（隐藏）' : '🔤 拼音';
};
$('btnScene').onclick = () => {
  showScene = !showScene;
  $('btnScene').classList.toggle('on', !showScene);
  $('btnScene').textContent = showScene ? '📝 图注' : '📝 图注（隐藏）';
  document.querySelectorAll('.pn').forEach(pn => pn.classList.toggle('no-scene', !showScene));
};

/* ---------- sidebar toggle (mobile) ---------- */
function closeSide() { if (innerWidth <= 1080) { $('sidebar').classList.add('collapsed'); $('mask').classList.remove('show'); } }
$('sideToggle').onclick = () => {
  const c = $('sidebar').classList.toggle('collapsed');
  $('mask').classList.toggle('show', !c);
};
$('mask').onclick = closeSide;


/* ---------- 考纲原文展开/折叠与复制 ---------- */
let fulltextFolded = false;
let fulltextVisible = true;

function toggleFulltextFold() {
  const sec = $('fulltextSection');
  const btn = $('btnFoldFulltext');
  fulltextFolded = !fulltextFolded;
  sec.classList.toggle('folded', fulltextFolded);
  btn.textContent = fulltextFolded ? '▼ 展开' : '▲ 收起';
}

function toggleFullText() {
  const sec = $('fulltextSection');
  const btn = $('btnFulltext');
  fulltextVisible = !fulltextVisible;
  sec.style.display = fulltextVisible ? 'block' : 'none';
  btn.classList.toggle('on', fulltextVisible);
  btn.textContent = fulltextVisible ? '📜 考纲原文' : '📜 考纲原文（隐藏）';
  if (fulltextVisible) {
    sec.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }
}
if ($('btnFulltext')) {
  $('btnFulltext').onclick = toggleFullText;
}

function copyCurrentFulltext() {
  const p = flat[cur];
  const text = (p.paras && p.paras.length) ? p.paras.join('\n') : p.panels.map(pn => pn.v).join('\n');
  const fullTextToCopy = `${p.title} —— ${p.author}\n\n${text}\n\n${p.hard ? '【生僻/易错字：' + p.hard + '】' : ''}`;
  navigator.clipboard.writeText(fullTextToCopy).then(() => {
    const btn = $('btnCopyFulltext');
    const old = btn.textContent;
    btn.textContent = '✅ 已复制全文！';
    setTimeout(() => { btn.textContent = old; }, 1800);
  }).catch(() => {
    alert('复制成功：\n' + fullTextToCopy);
  });
}

/* ---------- init ---------- */
const hash = decodeURIComponent(location.hash.replace('#', ''));
if (innerWidth <= 1080) { $('sidebar').classList.add('collapsed'); }
const startIdx = hash ? flat.findIndex(p => p.slug === hash) : 0;
go(startIdx < 0 ? 0 : startIdx);
</script>
</body>
</html>
