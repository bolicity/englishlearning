        background:none;border:none;border-radius:var(--r-s);cursor:pointer;text-align:left;
        font-family:inherit;font-size:.83rem;font-weight:700;color:var(--ts);transition:.15s}

  .vol-btn .arw{font-size:.6rem;color:var(--tm);transition:.2s}
  .vol.open .arw{transform:rotate(90deg)}
  .vol-list{display:none;padding:.1rem 0 .25rem .55rem}

  .poem-btn{width:100%;display:flex;align-items:baseline;gap:.35rem;padding:.36rem .55rem;

  .poem-btn.active{background:var(--red-bg);border-left-color:var(--red);color:var(--red);font-weight:700}
  .poem-btn .pno{font-size:.66rem;color:var(--tm);font-variant-numeric:tabular-nums;flex:none;min-width:1.4em}
  .poem-btn.active .pno{color:var(--red-l)}

  /* ---------- main ---------- */
  main{flex:1;min-width:0;display:flex;flex-direction:column;gap:1rem}
  .panel-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--r-l);
        box-shadow:var(--shadow);padding:1.4rem 1.5rem}

  .poem-title{font-family:'Outfit','Noto Serif SC',serif;font-size:1.75rem;font-weight:800;color:var(--tp);line-height:1.25}

  .pn{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--r-m);

  .pn-img{position:relative;background:#FBF9F4;aspect-ratio:1/1;overflow:hidden}
  .pn-img img{width:100%;height:100%;object-fit:cover;display:block}
  .pn-no{position:absolute;top:.55rem;left:.55rem;width:28px;height:28px;border-radius:50%;
      background:rgba(255,255,255,.92);border:1px solid var(--border);display:flex;align-items:center;
      justify-content:center;font-size:.85rem;color:var(--red);font-weight:700;z-index:2;
      box-shadow:0 1px 4px rgba(0,0,0,.08)}
  .pn-txt{padding:.75rem .85rem .85rem;display:flex;flex-direction:column;gap:.4rem;
      border-top:1px solid var(--border);background:#FFFDFB}
  .verse{font-family:'Noto Serif SC',serif;font-size:.95rem;font-weight:700;color:var(--red);
      line-height:2.05;letter-spacing:.01em}
  .scene{font-size:.72rem;color:var(--tm);line-height:1.6}

  /* ---------- 难字注音 ---------- */
  ruby{ruby-position:over}
  rt{font-family:'Inter','PingFang SC',sans-serif;font-size:.5em;font-weight:500;
     color:var(--tm);letter-spacing:0;line-height:1.1;text-indent:0}
  .verse ruby,.lb-txt .verse ruby{ruby-align:center}
  body.no-py rt{display:none}
  body.no-py .verse{line-height:1.6}
  .pn.hide-verse .verse{filter:blur(6px);opacity:.55;user-select:none;transition:.25s}
  .pn.hide-verse .scene{opacity:.45}
  .pn.hide-verse .pn-img img{filter:brightness(.97)}
  .pn.revealed .verse{filter:none;opacity:1}
  .reveal-tip{position:absolute;bottom:.55rem;left:50%;transform:translateX(-50%);
      background:rgba(15,23,42,.72);color:#fff;font-size:.68rem;padding:.2rem .6rem;border-radius:999px;
      pointer-events:none;opacity:0;transition:.2s}
  .pn.hide-verse:not(.revealed) .reveal-tip{opacity:1}
  .no-scene .scene{display:none}

  /* ---------- lightbox ---------- */
  .lb{position:fixed;inset:0;background:rgba(15,23,42,.92);z-index:200;display:none;
      align-items:center;justify-content:center;padding:1.5rem;cursor:zoom-out}
  .lb.show{display:flex}
  .lb-inner{max-width:min(96vw,1000px);width:100%;background:var(--bg-card);border-radius:var(--r-l);

  .lb-txt{padding:.9rem 1.1rem 1.1rem}

  .lb-txt .scene{margin-top:.3rem}
  .lb-close{position:absolute;top:1rem;right:1.1rem;width:42px;height:42px;border-radius:50%;

  .lb-nav{position:absolute;top:50%;transform:translateY(-50%);width:46px;height:46px;border-radius:50%;
      background:rgba(255,255,255,.16);color:#fff;border:none;font-size:1.3rem;cursor:pointer}
  .lb-nav.prev{left:1rem}.lb-nav.next{right:1rem}

  footer{max-width:1500px;margin:0 auto;padding:1.6rem 1.1rem 3rem;text-align:center;
      color:var(--tm);font-size:.78rem}

  /* ---------- mobile ---------- */
  .side-toggle{display:none}
  @media(max-width:1080px){
    .shell{padding:.8rem}

    .side-toggle{display:inline-flex}
    .mask{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:90;display:none}
    .mask.show{display:block}
  }

  }
  @media(max-width:760px){

    .poem-title{font-size:1.35rem}
    .panel-card{padding:1.05rem}
    .brand-sub{display:none}
    .nav{padding:.6rem .8rem}
  }

  .fulltext-content{font-family:'Noto Serif SC',serif;font-size:1.1rem;color:#1E293B;

三点雨山前", "s": "远处天边疏星七八点，山前飘来三两点细雨，夜行人加快脚步", "img": "images/recitation-comics/xijiangyue-c3.webp", "no": "③"}, {"v": "旧时茅店社林边，路转溪桥忽见", "s": "走过溪上小桥山路一转，旧时熟悉的茅草客店忽然出现在社林旁边", "img": "images/recitation-comics/xijiangyue-c4.webp", "no": "④"}], "py": {"c": {"鹊": "què", "蝉": "chán", "茅": "máo", "见": "xiàn"}, "w": {}}, "paras": ["明月别枝惊鹊，清风半夜鸣蝉。", "稻花香里说丰年，听取蛙声一片。七八个星天外，两三点雨山前。旧时茅店社林边，路转溪桥忽见。"], "hard": "鹊（què）、蝉（chán）、茅（máo）、见（xiàn，通“现”，出现）", "hardList": [{"zi": "鹊", "py": "què"}, {"zi": "蝉", "py": "chán"}, {"zi": "茅", "py": "máo"}, {"zi": "见", "py": "xiàn，通“现”，出现"}]}, {"id": 3, "slug": "langtaosha", "title": "浪淘沙（其一）", "author": "唐·刘禹锡", "type": "古诗", "panels": [{"v": "九曲黄河万里沙", "s": "九曲连环的黄河奔腾东去，河道里裹挟着万里黄沙，浊浪滔滔气势磅礴", "img": "images/recitation-comics/langtaosha-c1.webp", "no": "①"}, {"v": "浪淘风簸自天涯", "s": "巨浪淘涌狂风颠簸，波涛滚滚仿佛从天边奔流而来，水天相接处浪头高卷", "img": "images/recitation-comics/langtaosha-c2.webp", "no": "②"}, {"v": "如今直上银河去", "s": "仰望夜空，思绪随黄河之水扶摇直上银河，银河横贯天际与大河相接", "img": "images/recitation-comics/langtaosha-c3.webp", "no": "③"}, {"v": "同到牵牛织女家", "s": "星河灿灿，河畔牵牛星与织女星遥遥相对，仿佛将一同到那牛郎织女的家中做客", "img": "images/recitation-comics/langtaosha-c4.webp", "no": "④"}], "py": {"c": {"簸": "bǒ", "涯": "yá"}, "w": {}}, "paras": ["九曲黄河万里沙，浪淘风簸自天涯。如今直上银河去，同到牵牛织女家。"], "hard": "簸（bǒ，颠簸）、涯（yá）", "hardList": [{"zi": "簸", "py": "bǒ，颠簸"}, {"zi": "涯", "py": "yá"}]}, {"id": 4, "slug": "jiangnanchun", "title": "江南春", "author": "唐·杜牧", "type": "古诗", "panels": [{"v": "千里莺啼绿映红", "s": "千里江南，黄莺啼鸣，红花与绿叶相互掩映，满目春色烂漫", "img": "images/recitation-comics/jiangnanchun-c1.webp", "no": "①"}, {"v": "水村山郭酒旗风", "s": "傍水的村庄、依山的城郭，酒家的旗子在春风中招展", "img": "images/recitation-comics/jiangnanchun-c2.webp", "no": "②"}, {"v": "南朝四百八十寺", "s": "南朝遗留下来的众多佛寺，殿宇层叠掩映在山野之间", "img": "images/recitation-comics/jiangnanchun-c3.webp", "no": "③"}, {"v": "多少楼台烟雨中", "s": "无数亭台楼阁矗立在朦胧烟雨之中，若隐若现，苍茫迷离", "img": "images/recitation-comics/jiangnanchun-c4.webp", "no": "④"}], "py": {"c": {"莺": "yīng", "啼": "tí", "郭": "guō"}, "w": {}}, "paras": ["千里莺啼绿映红，水村山郭酒旗风。南朝四百八十寺，多少楼台烟雨中。"], "hard": "莺（yīng）、啼（tí）、郭（guō）", "hardList": [{"zi": "莺", "py": "yīng"}, {"zi": "啼", "py": "tí"}, {"zi": "郭", "py": "guō"}]}, {"id": 5, "slug": "shuhuyin", "title": "书湖阴先生壁", "author": "宋·王安石", "type": "古诗", "panels": [{"v": "茅檐长扫净无苔", "s": "茅草屋檐下庭院洁净，主人常加扫拭，阶前青苔不生，一派清幽", "img": "images/recitation-comics/shuhuyin-c1.webp", "no": "①"}, {"v": "花木成畦手自栽", "s": "屋前花木分畦成行、齐整葱茏，皆是主人亲手栽种", "img": "images/recitation-comics/shuhuyin-c2.webp", "no": "②"}, {"v": "一水护田将绿绕", "s": "一条溪水环绕守护着田亩，把一片浓绿温柔地围在中间", "img": "images/recitation-comics/shuhuyin-c3.webp", "no": "③"}, {"v": "两山排闼送青来", "s": "推门而望，两座青山仿佛破门而入，把满目青翠直送到眼前", "img": "images/recitation-comics/shuhuyin-c4.webp", "no": "④"}], "py": {"c": {"檐": "yán", "苔": "tái", "畦": "qí", "闼": "tà"}, "w": {}}, "paras": ["茅檐长扫净无苔，花木成畦手自栽。一水护田将绿绕，两山排闼送青来。"], "hard": "檐（yán）、苔（tái）、畦（qí）、闼（tà，小门）", "hardList": [{"zi": "檐", "py": "yán"}, {"zi": "苔", "py": "tái"}, {"zi": "畦", "py": "qí"}, {"zi": "闼", "py": "tà，小门"}]}, {"id": 6, "slug": "qilv-changzheng", "title": "七律·长征", "author": "毛泽东", "type": "律诗", "panels": [{"v": "红军不怕远征难，万水千山只等闲", "s": "红军队伍翻山越水昂首前行，万水千山在脚下不过寻常，行军队伍绵延于崇山之间", "img": "images/recitation-comics/qilv-changzheng-c1.webp", "no": "①"}, {"v": "五岭逶迤腾细浪，乌蒙磅礴走泥丸", "s": "连绵起伏的五岭在红军眼中不过翻腾的细浪，磅礴的乌蒙山如滚动的泥丸", "img": "images/recitation-comics/qilv-changzheng-c2.webp", "no": "②"}, {"v": "金沙水拍云崖暖，大渡桥横铁索寒", "s": "金沙江浊浪拍击高耸入云的山崖，大渡河上铁索桥横跨激流寒气逼人，红军抢渡飞夺", "img": "images/recitation-comics/qilv-changzheng-c3.webp", "no": "③"}, {"v": "更喜岷山千里雪，三军过后尽开颜", "s": "千里岷山白雪皑皑，红军战士翻越雪山之后个个笑逐颜开，红旗在雪岭上飘扬", "img": "images/recitation-comics/qilv-changzheng-c4.webp", "no": "④"}], "py": {"c": {"迤": "yí", "礴": "bó", "岷": "mín"}, "w": {}}, "paras": ["红军不怕远征难，万水千山只等闲。五岭逶迤腾细浪，乌蒙磅礴走泥丸。金沙水拍云崖暖，大渡桥横铁索寒。更喜岷山千里雪，三军过后尽开颜。"], "hard": "逶迤（wēi yí）、磅礴（páng bó）、岷（mín）", "hardList": [{"zi": "迤", "py": "wēi yí"}, {"zi": "礴", "py": "páng bó"}, {"zi": "岷", "py": "mín"}]}, {"id": 7, "slug": "boyaguchin", "title": "伯牙鼓琴", "author": "《吕氏春秋》", "type": "文言文", "panels": [{"v": "伯牙鼓琴，锺子期听之", "s": "山水之间，伯牙端坐抚琴，锺子期盘坐对面凝神聆听，松风清流相伴", "img": "images/recitation-comics/boyaguchin-c1.webp", "no": "①"}, {"v": "方鼓琴而志在太山，锺子期曰善哉乎鼓琴，巍巍乎若太山", "s": "琴声激越高亢，锺子期侧耳赞叹，眼前仿佛现出巍巍耸立的高山", "img": "images/recitation-comics/boyaguchin-c2.webp", "no": "②"}, {"v": "少选之间而志在流水，锺子期又曰善哉乎鼓琴，汤汤乎若流水", "s": "曲调流转舒缓，锺子期颔首称善，眼前仿佛现出汤汤奔流的江水", "img": "images/recitation-comics/boyaguchin-c3.webp", "no": "③"}, {"v": "锺子期死，伯牙破琴绝弦，终身不复鼓琴", "s": "锺子期已逝，伯牙悲痛中摔破琴挑断琴弦，终身不再弹琴，只余孤琴断弦", "img": "images/recitation-comics/boyaguchin-c4.webp", "no": "④"}], "py": {"c": {"锺": "zhōng", "巍": "wēi", "汤": "shāng", "弦": "xián"}, "w": {}}, "paras": ["伯牙鼓琴，锺子期听之。方鼓琴而志在太山，锺子期曰：“善哉乎鼓琴，巍巍乎若太山。”少选之间而志在流水，锺子期又曰：“善哉乎鼓琴，汤汤乎若流水。”锺子期死，伯牙破琴绝弦，终身不复鼓琴，以为世无足复为鼓琴者。"], "hard": "锺（zhōng）、巍（wēi）、汤（shāng，水大的样子）、弦（xián）", "hardList": [{"zi": "锺", "py": "zhōng"}, {"zi": "巍", "py": "wēi"}, {"zi": "汤", "py": "shāng，水大的样子"}, {"zi": "弦", "py": "xián"}]}]}, {"vol": "七年级（上册）", "color": "#D97706", "items": [{"id": 8, "slug": "guancanghai", "title": "观沧海", "author": "东汉·曹操", "type": "古诗", "panels": [{"v": "东临碣石，以观沧海", "s": "诗人登上碣石山顶，居高临下眺望苍茫大海，秋风猎猎，衣袂飘动", "img": "images/recitation-comics/guancanghai-c1.webp", "no": "①"}, {"v": "水何澹澹，山岛竦峙。树木丛生，百草丰茂", "s": "海面水波荡漾，山岛高高地耸立，岛上树木丛生百草丰茂，一片生机", "img": "images/recitation-comics/guancanghai-c2.webp", "no": "②"}, {"v": "秋风萧瑟，洪波涌起", "s": "萧瑟秋风中海面洪波巨澜汹涌而起，浪涛拍岸气势雄浑", "img": "images/recitation-comics/guancanghai-c3.webp", "no": "③"}, {"v": "日月之行，若出其中；星汉灿烂，若出其里", "s": "沧海吞吐日月，灿烂银河仿佛也从海中升起，天地星月尽在胸中", "img": "images/recitation-comics/guancanghai-c4.webp", "no": "④"}], "py": {"c": {"碣": "jié", "澹": "dàn", "峙": "zhì", "瑟": "sè"}, "w": {}}, "paras": ["东临碣石，以观沧海。水何澹澹，山岛竦峙。树木丛生，百草丰茂。秋风萧瑟，洪波涌起。日月之行，若出其中；星汉灿烂，若出其里。幸甚至哉，歌以咏志。"], "hard": "碣（jié）、澹（dàn）、竦峙（sǒng zhì）、萧瑟（xiāo sè）、咏、（yǒng）", "hardList": [{"zi": "碣", "py": "jié"}, {"zi": "澹", "py": "dàn"}, {"zi": "峙", "py": "sǒng zhì"}, {"zi": "瑟", "py": "xiāo sè"}]}, {"id": 9, "slug": "wenchangling", "title": "闻王昌龄左迁龙标遥有此寄", "author": "唐·李白", "type": "古诗", "panels": [{"v": "杨花落尽子规啼", "s": "暮春时节杨花飘落殆尽，枝头子规声声啼叫，一派萧瑟春光", "img": "images/recitation-comics/wenchangling-c1.webp", "no": "①"}, {"v": "闻道龙标过五溪", "s": "友人远谪荒僻之地，要跋涉五溪蛮荒之地，山水迢迢令人挂念", "img": "images/recitation-comics/wenchangling-c2.webp", "no": "②"}, {"v": "我寄愁心与明月", "s": "诗人仰望夜空，把满怀愁思托付给皎皎明月，月光如水", "img": "images/recitation-comics/wenchangling-c3.webp", "no": "③"}, {"v": "随君直到夜郎西", "s": "明月当空，仿佛带着这颗牵挂之心一路相随，照着友人远去夜郎以西的路", "img": "images/recitation-comics/wenchangling-c4.webp", "no": "④"}], "py": {"c": {"昌": "chāng", "龄": "líng", "啼": "tí", "溪": "xī"}, "w": {}}, "paras": ["杨花落尽子规啼，闻道龙标过五溪。我寄愁心与明月，随君直到夜郎西。"], "hard": "昌（chāng）、龄（líng）、啼（tí）、溪（xī）", "hardList": [{"zi": "昌", "py": "chāng"}, {"zi": "龄", "py": "líng"}, {"zi": "啼", "py": "tí"}, {"zi": "溪", "py": "xī"}]}, {"id": 10, "slug": "cibeigu", "title": "次北固山下", "author": "唐·王湾", "type": "古诗", "panels": [{"v": "客路青山外，行舟绿水前", "s": "旅途蜿蜒在青翠北固山之外，行舟扬帆于碧绿江水之前", "img": "images/recitation-comics/cibeigu-c1.webp", "no": "①"}, {"v": "潮平两岸阔，风正一帆悬", "s": "潮水上涨与岸齐平，江面开阔，顺风行船白帆高高悬挂", "img": "images/recitation-comics/cibeigu-c2.webp", "no": "②"}, {"v": "海日生残夜，江春入旧年", "s": "残夜未尽一轮红日已从海上升起，旧年未过江上已露出春天气息", "img": "images/recitation-comics/cibeigu-c3.webp", "no": "③"}, {"v": "乡书何处达？归雁洛阳边", "s": "仰望北归大雁排成人字掠过长空，家书要寄往何处？就托鸿雁捎到洛阳城边", "img": "images/recitation-comics/cibeigu-c4.webp", "no": "④"}], "py": {"c": {"悬": "xuán", "雁": "yàn", "洛": "luò"}, "w": {}}, "paras": ["客路青山外，行舟绿水前。潮平两岸阔，风正一帆悬。海日生残夜，江春入旧年。乡书何处达？归雁洛阳边。"], "hard": "悬（xuán）、雁（yàn）、洛（luò）", "hardList": [{"zi": "悬", "py": "xuán"}, {"zi": "雁", "py": "yàn"}, {"zi": "洛", "py": "luò"}]}, {"id": 11, "slug": "tianjingsha", "title": "天净沙·秋思", "author": "元·马致远", "type": "曲", "panels": [{"v": "枯藤老树昏鸦", "s": "深秋村野，枯藤缠绕着老树，暮色中乌鸦栖息枝头，一片萧瑟", "img": "images/recitation-comics/tianjingsha-c1.webp", "no": "①"}, {"v": "小桥流水人家", "s": "不远处小桥横跨溪流，桥边炊烟袅袅几户人家，温暖恬静", "img": "images/recitation-comics/tianjingsha-c2.webp", "no": "②"}, {"v": "古道西风瘦马", "s": "荒凉古道上秋风萧瑟，游子骑着一匹瘦马踽踽独行", "img": "images/recitation-comics/tianjingsha-c3.webp", "no": "③"}, {"v": "夕阳西下，断肠人在天涯", "s": "夕阳西沉，愁肠寸断的旅人还漂泊在远离家乡的天涯", "img": "images/recitation-comics/tianjingsha-c4.webp", "no": "④"}], "py": {"c": {"藤": "téng", "涯": "yá"}, "w": {}}, "paras": ["枯藤老树昏鸦，小桥流水人家，古道西风瘦马。夕阳西下，断肠人在天涯。"], "hard": "藤（téng）、涯（yá）", "hardList": [{"zi": "藤", "py": "téng"}, {"zi": "涯", "py": "yá"}]}, {"id": 12, "slug": "lunyu", "title": "《论语》十二章", "author": "孔子弟子及再传弟子", "type": "文言文", "panels": [{"v": "学而时习之，不亦说乎？有朋自远方来，不亦乐乎", "s": "杏坛之上孔子讲学，弟子按时温习欣然会意；远方友人来访，众人拱手相迎笑语盈门", "img": "images/recitation-comics/lunyu-c1.webp", "no": "①"}, {"v": "温故而知新，可以为师矣；学而不思则罔，思而不学则殆", "s": "弟子灯下翻检旧简忽有所悟，一手执卷一手托腮，边读边思温故知新", "img": "images/recitation-comics/lunyu-c2.webp", "no": "②"}, {"v": "一箪食，一瓢饮，在陋巷，人不堪其忧，回也不改其乐", "s": "陋巷之中颜回身居简屋，一箪饭一瓢水，粗茶淡饭却怡然自乐", "img": "images/recitation-comics/lunyu-c3.webp", "no": "③"}, {"v": "三人行，必有我师焉。择其善者而从之，其不善者而改之", "s": "三人同行于道上，年长者指点评说，年少者侧耳聆听，彼此切磋互为师友", "img": "images/recitation-comics/lunyu-c4.webp", "no": "④"}], "py": {"c": {"愠": "yùn", "省": "xǐng", "有": "yǒu", "惑": "huò", "逾": "yú", "罔": "wǎng", "殆": "dài", "箪": "dān", "肱": "gōng", "焉": "yān", "笃": "dǔ"}, "w": {}}, "paras": ["子曰：“学而时习之，不亦说乎？有朋自远方来，不亦乐乎？人不知而不愠，不亦君子乎？”（《学而》）曾子曰：“吾日三省吾身：为人谋而不忠乎？与朋友交而不信乎？传不习乎？”（《学而》）子曰：“吾十有五而志于学，三十而立，四十而不惑，五十而知天命，六十而耳顺，七十而从心所欲，不逾矩。”（《为政》）子曰：“温故而知新，可以为师矣。”（《为政》）子曰：“学而不思则罔，思而不学则殆。”（《为政》）子曰：“贤哉，回也！一箪食，一瓢饮，在陋巷，人不堪其忧，回也不改其乐。贤哉，回也！”（《雍也》）子曰：“知之者不如好之者，好之者不如乐之者。”（《雍也》）子曰：“饭疏食，饮水，曲肱而枕之，乐亦在其中矣。不义而富且贵，于我如浮云。”（《述而》）子曰：“三人行，必有我师焉。择其善者而从之，其不善者而改之。”（《述而》）子在川上曰：“逝者如斯夫，不舍昼夜。”（《子罕》）子曰：“三军可夺帅也，匹夫不可夺志也。”（《子罕》）子夏曰：“博学而笃志，切问而近思，仁在其中矣。”（《子张》）"], "hard": "愠（yùn）、省（xǐng）、有（yòu，通“又”）、惑（huò）、逾（yú）、矩、（jǔ）、罔（wǎng）、殆（dài）、箪（dān）、肱（gōng）、焉（yān）、笃（dǔ）", "hardList": [{"zi": "愠", "py": "yùn"}, {"zi": "省", "py": "xǐng"}, {"zi": "有", "py": "yòu，通“又”"}, {"zi": "惑", "py": "huò"}, {"zi": "逾", "py": "yú"}, {"zi": "罔", "py": "wǎng"}, {"zi": "殆", "py": "dài"}, {"zi": "箪", "py": "dān"}, {"zi": "肱", "py": "gōng"}, {"zi": "焉", "py": "yān"}, {"zi": "笃", "py": "dǔ"}]}, {"id": 13, "slug": "emeishan", "title": "峨眉山月歌", "author": "唐·李白", "type": "古诗", "panels": [{"v": "峨眉山月半轮秋", "s": "秋夜峨眉山头悬着半轮明月，月色清朗山影如黛", "img": "images/recitation-comics/emeishan-c1.webp", "no": "①"}, {"v": "影入平羌江水流", "s": "月影倒映在平羌江中，随江水缓缓流动，碎银满江", "img": "images/recitation-comics/emeishan-c2.webp", "no": "②"}, {"v": "夜发清溪向三峡", "s": "夜色中乘舟从清溪驿出发，直向三峡驶去，两岸山影飞速后退", "img": "images/recitation-comics/emeishan-c3.webp", "no": "③"}, {"v": "思君不见下渝州", "s": "月被山遮思念友人却难以相见，船已顺流而下驶往渝州，怅然回望", "img": "images/recitation-comics/emeishan-c4.webp", "no": "④"}], "py": {"c": {"峨": "é", "羌": "qiāng", "渝": "yú"}, "w": {}}, "paras": ["峨眉山月半轮秋，影入平羌江水流。夜发清溪向三峡，思君不见下渝州。"], "hard": "峨（é）、羌（qiāng）、渝（yú）", "hardList": [{"zi": "峨", "py": "é"}, {"zi": "羌", "py": "qiāng"}, {"zi": "渝", "py": "yú"}]}, {"id": 14, "slug": "liguinian", "title": "江南逢李龟年", "author": "唐·杜甫", "type": "古诗", "panels": [{"v": "岐王宅里寻常见", "s": "开元盛世，岐王宅第里歌舞升平，乐师李龟年抚琴而歌，宾客满座", "img": "images/recitation-comics/liguinian-c1.webp", "no": "①"}, {"v": "崔九堂前几度闻", "s": "崔九堂前多次聆听李龟年的美妙歌声，堂上华灯高照盛极一时", "img": "images/recitation-comics/liguinian-c2.webp", "no": "②"}, {"v": "正是江南好风景", "s": "多年后江南暮春，风景依旧美好，江山却已残破凋零", "img": "images/recitation-comics/liguinian-c3.webp", "no": "③"}, {"v": "落花时节又逢君", "s": "落花纷飞的季节，落魄的乐师与流落的诗人意外重逢，相对无言", "img": "images/recitation-comics/liguinian-c4.webp", "no": "④"}], "py": {"c": {"岐": "qí", "崔": "cuī"}, "w": {}}, "paras": ["岐王宅里寻常见，崔九堂前几度闻。正是江南好风景，落花时节又逢君。"], "hard": "岐（qí）、崔（cuī）", "hardList": [{"zi": "岐", "py": "qí"}, {"zi": "崔", "py": "cuī"}]}, {"id": 15, "slug": "xingjunjiuri", "title": "行军九日思长安故园", "author": "唐·岑参", "type": "古诗", "panels": [{"v": "强欲登高去", "s": "重阳佳节军旅之中，诗人勉强振起精神欲登高远望", "img": "images/recitation-comics/xingjunjiuri-c1.webp", "no": "①"}, {"v": "无人送酒来", "s": "战乱行军之中无酒可送，四顾茫茫，无人相伴举杯", "img": "images/recitation-comics/xingjunjiuri-c2.webp", "no": "②"}, {"v": "遥怜故园菊", "s": "遥想长安故园的菊花此时正独自开放，无人欣赏令人怜惜", "img": "images/recitation-comics/xingjunjiuri-c3.webp", "no": "③"}, {"v": "应傍战场开", "s": "那丛丛菊花大概就开在残破的战场旁边，冷月寒霜映着硝烟散尽的废墟", "img": "images/recitation-comics/xingjunjiuri-c4.webp", "no": "④"}], "py": {"c": {"岑": "cén", "参": "shēn", "强": "qiǎng", "怜": "lián", "傍": "bàng"}, "w": {}}, "paras": ["强欲登高去，无人送酒来。遥怜故园菊，应傍战场开。"], "hard": "岑（cén）、参（shēn）、强（qiǎng）、怜（lián）、傍（bàng）", "hardList": [{"zi": "岑", "py": "cén"}, {"zi": "参", "py": "shēn"}, {"zi": "强", "py": "qiǎng"}, {"zi": "怜", "py": "lián"}, {"zi": "傍", "py": "bàng"}]}, {"id": 16, "slug": "shouxiangcheng", "title": "夜上受降城闻笛", "author": "唐·李益", "type": "古诗", "panels": [{"v": "回乐烽前沙似雪", "s": "回乐峰前的沙地在月光下白得如同积雪，一片苍茫", "img": "images/recitation-comics/shouxiangcheng-c1.webp", "no": "①"}, {"v": "受降城外月如霜", "s": "受降城外夜色如霜，冷月高悬，照着戍楼与旌旗", "img": "images/recitation-comics/shouxiangcheng-c2.webp", "no": "②"}, {"v": "不知何处吹芦管", "s": "不知从何处传来悠悠芦笛声，呜咽婉转在夜空回荡", "img": "images/recitation-comics/shouxiangcheng-c3.webp", "no": "③"}, {"v": "一夜征人尽望乡", "s": "笛声勾起无限乡愁，帐篷中戍边的将士一夜之间全都起身眺望故乡的方向", "img": "images/recitation-comics/shouxiangcheng-c4.webp", "no": "④"}], "py": {"c": {"降": "xiáng", "烽": "fēng", "芦": "lú"}, "w": {}}, "paras": ["回乐烽前沙似雪，受降城外月如霜。不知何处吹芦管，一夜征人尽望乡。"], "hard": "降（xiáng）、烽（fēng）、芦（lú）", "hardList": [{"zi": "降", "py": "xiáng"}, {"zi": "烽", "py": "fēng"}, {"zi": "芦", "py": "lú"}]}, {"id": 17, "slug": "jiezishu", "title": "诫子书", "author": "三国·诸葛亮", "type": "文言文", "panels": [{"v": "静以修身，俭以养德", "s": "书斋之中老父亲端坐案前，屏息静气修身养性，屋内陈设简朴一几一灯", "img": "images/recitation-comics/jiezishu-c1.webp", "no": "①"}, {"v": "非淡泊无以明志，非宁静无以致远", "s": "灯下提笔凝神，笔下写下淡泊明志宁静致远的告诫，窗外月色澄明", "img": "images/recitation-comics/jiezishu-c2.webp", "no": "②"}, {"v": "夫学须静也，才须学也，非学无以广才，非志无以成学", "s": "少年伏案苦读，案上书卷层叠，宁静书房中唯闻翻书之声", "img": "images/recitation-comics/jiezishu-c3.webp", "no": "③"}, {"v": "年与时驰，意与日去，遂成枯落，多不接世，悲守穷庐，将复何及", "s": "时光飞逝如白马过隙，枯叶飘零落满荒芜庭院，老来独守空庐追悔莫及", "img": "images/recitation-comics/jiezishu-c4.webp", "no": "④"}], "py": {"c": {"淫": "yín", "躁": "zào", "治": "zhì", "遂": "suì"}, "w": {}}, "paras": ["夫君子之行，静以修身，俭以养德。非淡泊无以明志，非宁静无以致远。夫学须静也，才须学也，非学无以广才，非志无以成学。淫慢则不能励精，险躁则不能治性。年与时驰，意与日去，遂成枯落，多不接世，悲守穷庐，将复何及！"], "hard": "淫（yín）、躁（zào）、治（chí，通“弛”，修养）、遂（suì）、庐、（lú）", "hardList": [{"zi": "淫", "py": "yín"}, {"zi": "躁", "py": "zào"}, {"zi": "治", "py": "chí，通“弛”，修养"}, {"zi": "遂", "py": "suì"}]}]}, {"vol": "六年级（下册）", "color": "#EA580C", "items": [{"id": 18, "slug": "tiaotiao", "title": "迢迢牵牛星", "author": "《古诗十九首》", "type": "古诗", "panels": [{"v": "迢迢牵牛星，皎皎河汉女", "s": "辽阔夜空中银河横贯，牵牛星与织女星隔河遥遥相望，星光皎洁", "img": "images/recitation-comics/tiaotiao-c1.webp", "no": "①"}, {"v": "纤纤擢素手，札札弄机杼", "s": "织女伸出纤细雪白的手，在织机前札札地穿引织布，梭影翻飞", "img": "images/recitation-comics/tiaotiao-c2.webp", "no": "②"}, {"v": "终日不成章，泣涕零如雨", "s": "织女整日织不成布匹，泪珠如雨般簌簌落下，织机旁愁容满面", "img": "images/recitation-comics/tiaotiao-c3.webp", "no": "③"}, {"v": "河汉清且浅，相去复几许。盈盈一水间，脉脉不得语", "s": "银河之水清浅，相隔并没有多远，两人隔着盈盈一水，含情凝望却不能互诉衷肠", "img": "images/recitation-comics/tiaotiao-c4.webp", "no": "④"}], "py": {"c": {"迢": "tiáo", "皎": "jiǎo", "擢": "zhuó", "札": "zhá", "杼": "zhù", "间": "jiān", "脉": "mò"}, "w": {}}, "paras": ["迢迢牵牛星，皎皎河汉女。纤纤擢素手，札札弄机杼。终日不成章，泣涕零如雨。河汉清且浅，相去复几许。盈盈一水间，脉脉不得语。"], "hard": "迢（tiáo）、皎（jiǎo）、擢（zhuó）、札（zhá）、杼（zhù）、间（jiàn，、间隔）、脉（mò）", "hardList": [{"zi": "迢", "py": "tiáo"}, {"zi": "皎", "py": "jiǎo"}, {"zi": "擢", "py": "zhuó"}, {"zi": "札", "py": "zhá"}, {"zi": "杼", "py": "zhù"}, {"zi": "间", "py": "jiàn，、间隔"}, {"zi": "脉", "py": "mò"}]}, {"id": 19, "slug": "zhushi", "title": "竹石", "author": "清·郑燮", "type": "古诗", "panels": [{"v": "咬定青山不放松", "s": "一丛翠竹紧咬青山石缝，根须深扎，任凭风雨也绝不松动", "img": "images/recitation-comics/zhushi-c1.webp", "no": "①"}, {"v": "立根原在破岩中", "s": "竹根牢牢扎立在破裂的岩石之中，石缝间虬根盘结", "img": "images/recitation-comics/zhushi-c2.webp", "no": "②"}, {"v": "千磨万击还坚劲", "s": "历经千般折磨万般打击，竹身依然挺拔坚劲，傲然不折", "img": "images/recitation-comics/zhushi-c3.webp", "no": "③"}, {"v": "任尔东西南北风", "s": "任凭四面八方狂风袭来，翠竹迎风摇曳而屹立不倒", "img": "images/recitation-comics/zhushi-c4.webp", "no": "④"}], "py": {"c": {"燮": "xiè", "劲": "jìng", "尔": "ěr"}, "w": {}}, "paras": ["咬定青山不放松，立根原在破岩中。千磨万击还坚劲，任尔东西南北风。"], "hard": "燮（xiè）、劲（jìng）、尔（ěr）", "hardList": [{"zi": "燮", "py": "xiè"}, {"zi": "劲", "py": "jìng"}, {"zi": "尔", "py": "ěr"}]}, {"id": 20, "slug": "huixiang", "title": "回乡偶书（其一）", "author": "唐·贺知章", "type": "古诗", "panels": [{"v": "少小离家老大回", "s": "少年离乡时意气风发，归来已是白发苍苍的老翁拄杖立于村口，物是人非", "img": "images/recitation-comics/huixiang-c1.webp", "no": "①"}, {"v": "乡音无改鬓毛衰", "s": "老者开口仍是乡音，只是两鬓的毛发已经斑白稀疏，镜中容颜大改", "img": "images/recitation-comics/huixiang-c2.webp", "no": "②"}, {"v": "儿童相见不相识", "s": "村口孩童围拢过来，睁着好奇的眼睛打量这位陌生的老人", "img": "images/recitation-comics/huixiang-c3.webp", "no": "③"}, {"v": "笑问客从何处来", "s": "孩童笑嘻嘻地拱手发问：客人您是从哪里来的呀？老人一时百感交集", "img": "images/recitation-comics/huixiang-c4.webp", "no": "④"}], "py": {"c": {"鬓": "bìn", "衰": "cuī"}, "w": {}}, "paras": ["少小离家老大回，乡音无改鬓毛衰。儿童相见不相识，笑问客从何处来。"], "hard": "鬓（bìn）、衰（cuī）", "hardList": [{"zi": "鬓", "py": "bìn"}, {"zi": "衰", "py": "cuī"}]}, {"id": 21, "slug": "liangxiaoer", "title": "两小儿辩日", "author": "《列子》", "type": "文言文", "panels": [{"v": "孔子东游，见两小儿辩斗，问其故", "s": "孔子东游途中，路遇两个小孩正在激烈争辩，孔子下车询问缘由", "img": "images/recitation-comics/liangxiaoer-c1.webp", "no": "①"}, {"v": "我以日始出时去人近，而日中时远也；我以日初出远，而日中时近也", "s": "一个小孩指指初升的太阳说早晨近中午远，另一个连连摇头说恰恰相反", "img": "images/recitation-comics/liangxiaoer-c2.webp", "no": "②"}, {"v": "日初出大如车盖，及日中则如盘盂；日初出沧沧凉凉，及其日中如探汤", "s": "一个小孩说日出时大如车盖到中午小如盘盂，另一个说清晨凉而中午热得像把手伸进热水", "img": "images/recitation-comics/liangxiaoer-c3.webp", "no": "③"}, {"v": "孔子不能决也。两小儿笑曰：孰为汝多知乎", "s": "孔子想了半天也判断不出谁对，两个小孩笑着打趣：谁说你知识渊博呢？", "img": "images/recitation-comics/liangxiaoer-c4.webp", "no": "④"}], "py": {"c": {"辩": "biàn", "盂": "yú", "沧": "cāng", "孰": "shú", "汝": "rǔ", "知": "zhì"}, "w": {}}, "paras": ["孔子东游，见两小儿辩斗，问其故。一儿曰：“我以日始出时去人近，而日中时远也。”一儿曰：“我以日初出远，而日中时近也。”一儿曰：“日初出大如车盖，及日中则如盘盂，此不为远者小而近者大乎？”一儿曰：“日初出沧沧凉凉，及其日中如探汤，此不为近者热而远者凉乎？”", "孔子不能决也。两小儿笑曰：“孰为汝多知乎？”"], "hard": "辩（biàn）、盂（yú）、沧（cāng）、孰（shú）、汝（rǔ）、知（zhì，通、“智”）", "hardList": [{"zi": "辩", "py": "biàn"}, {"zi": "盂", "py": "yú"}, {"zi": "沧", "py": "cāng"}, {"zi": "孰", "py": "shú"}, {"zi": "汝", "py": "rǔ"}, {"zi": "知", "py": "zhì，通、“智”"}]}]}, {"vol": "七年级（下册）", "color": "#059669", "items": [{"id": 22, "slug": "dengyouzhoutai", "title": "登幽州台歌", "author": "唐·陈子昂", "type": "古诗", "panels": [{"v": "前不见古人", "s": "诗人独立于幽州台头，向前眺望，古代礼贤下士的明君已不可见", "img": "images/recitation-comics/dengyouzhoutai-c1.webp", "no": "①"}, {"v": "后不见来者", "s": "回首身后，后世的贤明之主同样渺不可寻，天地间唯余苍茫", "img": "images/recitation-comics/dengyouzhoutai-c2.webp", "no": "②"}, {"v": "念天地之悠悠", "s": "天地辽阔，宇宙无穷，个人渺小如沧海一粟，苍穹之下独立高台", "img": "images/recitation-comics/dengyouzhoutai-c3.webp", "no": "③"}, {"v": "独怆然而涕下", "s": "孤身立于高台，悲从中来，怆然泪下，衣袂在风中翻飞", "img": "images/recitation-comics/dengyouzhoutai-c4.webp", "no": "④"}], "py": {"c": {"昂": "áng", "怆": "chuàng", "涕": "tì"}, "w": {}}, "paras": ["前不见古人，后不见来者。念天地之悠悠，独怆然而涕下。"], "hard": "昂（áng）、怆（chuàng）、涕（tì）", "hardList": [{"zi": "昂", "py": "áng"}, {"zi": "怆", "py": "chuàng"}, {"zi": "涕", "py": "tì"}]}, {"id": 23, "slug": "wangyue", "title": "望岳", "author": "唐·杜甫", "type": "古诗", "panels": [{"v": "岱宗夫如何？齐鲁青未了", "s": "远望泰山，青翠的山色绵延齐鲁大地望不到尽头，云雾缭绕", "img": "images/recitation-comics/wangyue-c1.webp", "no": "①"}, {"v": "造化钟神秀，阴阳割昏晓", "s": "大自然把神奇秀美都汇聚于泰山，山南山北明暗分明如分昏晓", "img": "images/recitation-comics/wangyue-c2.webp", "no": "②"}, {"v": "荡胸生曾云，决眦入归鸟", "s": "山中层云升腾荡涤心胸，极目远望归鸟入林，目不转睛", "img": "images/recitation-comics/wangyue-c3.webp", "no": "③"}, {"v": "会当凌绝顶，一览众山小", "s": "定要登上那最高峰，俯瞰群山都显得矮小，登顶者立于云海之上", "img": "images/recitation-comics/wangyue-c4.webp", "no": "④"}], "py": {"c": {"岱": "dài", "曾": "céng", "眦": "zì", "凌": "líng", "览": "lǎn"}, "w": {}}, "paras": ["岱宗夫如何？齐鲁青未了。造化钟神秀，阴阳割昏晓。荡胸生曾云，决眦入归鸟。会当凌绝顶，一览众山小。"], "hard": "岱（dài）、曾（céng，通“层”）、眦（zì）、凌（líng）、览（lǎn）", "hardList": [{"zi": "岱", "py": "dài"}, {"zi": "曾", "py": "céng，通“层”"}, {"zi": "眦", "py": "zì"}, {"zi": "凌", "py": "líng"}, {"zi": "览", "py": "lǎn"}]}, {"id": 24, "slug": "youshanxicun", "title": "游山西村", "author": "宋·陆游", "type": "古诗", "panels": [{"v": "莫笑农家腊酒浑，丰年留客足鸡豚", "s": "丰收年景农家殷勤留客，腊酒虽浑鸡肉充足，主人捧盘相邀", "img": "images/recitation-comics/youshanxicun-c1.webp", "no": "①"}, {"v": "山重水复疑无路，柳暗花明又一村", "s": "山峦重叠水道迂回正疑无路可走，柳色深绿花光明艳忽然又见一村", "img": "images/recitation-comics/youshanxicun-c2.webp", "no": "②"}, {"v": "箫鼓追随春社近，衣冠简朴古风存", "s": "春社将近，村中箫鼓声此起彼伏，村民衣着简朴古风犹存", "img": "images/recitation-comics/youshanxicun-c3.webp", "no": "③"}, {"v": "从今若许闲乘月，拄杖无时夜叩门", "s": "月色朦胧的小路上，诗人拄着拐杖，今后若得闲暇随时再来夜访叩门", "img": "images/recitation-comics/youshanxicun-c4.webp", "no": "④"}], "py": {"c": {"腊": "là", "豚": "tún", "箫": "xiāo", "拄": "zhǔ", "叩": "kòu"}, "w": {}}, "paras": ["莫笑农家腊酒浑，丰年留客足鸡豚。山重水复疑无路，柳暗花明又一村。箫鼓追随春社近，衣冠简朴古风存。从今若许闲乘月，拄杖无时夜叩门。"], "hard": "腊（là）、豚（tún）、箫（xiāo）、拄（zhǔ）、叩（kòu）", "hardList": [{"zi": "腊", "py": "là"}, {"zi": "豚", "py": "tún"}, {"zi": "箫", "py": "xiāo"}, {"zi": "拄", "py": "zhǔ"}, {"zi": "叩", "py": "kòu"}]}, {"id": 25, "slug": "loushiming", "title": "陋室铭", "author": "唐·刘禹锡", "type": "文言文", "panels": [{"v": "山不在高，有仙则名。水不在深，有龙则灵", "s": "远山不必高峻有仙居住便有名，潭水不必幽深有龙潜藏便显灵，山水掩映成趣", "img": "images/recitation-comics/loushiming-c1.webp", "no": "①"}, {"v": "斯是陋室，惟吾德馨。苔痕上阶绿，草色入帘青", "s": "简陋小屋之中德行馨香自远，碧绿苔痕爬上台阶，青葱草色映入门帘", "img": "images/recitation-comics/loushiming-c2.webp", "no": "②"}, {"v": "谈笑有鸿儒，往来无白丁。可以调素琴，阅金经", "s": "屋内谈笑皆博学之士，案上素琴轻抚，佛经静读，气氛清雅", "img": "images/recitation-comics/loushiming-c3.webp", "no": "③"}, {"v": "无丝竹之乱耳，无案牍之劳形。南阳诸葛庐，西蜀子云亭", "s": "没有笙箫扰乱听觉，没有公文劳累身心，正如南阳诸葛庐西蜀扬子亭一般清幽自得", "img": "images/recitation-comics/loushiming-c4.webp", "no": "④"}], "py": {"c": {"陋": "lòu", "馨": "xīn", "苔": "tái", "儒": "rú", "牍": "dú", "蜀": "shǔ"}, "w": {}}, "paras": ["山不在高，有仙则名。水不在深，有龙则灵。斯是陋室，惟吾德馨。苔痕上阶绿，草色入帘青。谈笑有鸿儒，往来无白丁。可以调素琴，阅金经。无丝竹之乱耳，无案牍之劳形。南阳诸葛庐，西蜀子云亭。孔子云：何陋之有？"], "hard": "陋（lòu）、馨（xīn）、苔（tái）、儒（rú）、牍（dú）、蜀（shǔ）", "hardList": [{"zi": "陋", "py": "lòu"}, {"zi": "馨", "py": "xīn"}, {"zi": "苔", "py": "tái"}, {"zi": "儒", "py": "rú"}, {"zi": "牍", "py": "dú"}, {"zi": "蜀", "py": "shǔ"}]}, {"id": 26, "slug": "ailianshuo", "title": "爱莲说", "author": "宋·周敦颐", "type": "文言文", "panels": [{"v": "晋陶渊明独爱菊。自李唐来，世人甚爱牡丹", "s": "东篱下陶渊明独爱秋菊傲霜，唐以来世人竞赏雍容牡丹，花市繁盛", "img": "images/recitation-comics/ailianshuo-c1.webp", "no": "①"}, {"v": "予独爱莲之出淤泥而不染，濯清涟而不妖", "s": "一枝莲花亭亭立于池水之中，从淤泥中生长却不沾染，经清波洗涤而不妖艳", "img": "images/recitation-comics/ailianshuo-c2.webp", "no": "②"}, {"v": "中通外直，不蔓不枝，香远益清，亭亭净植", "s": "莲茎中通外直不生蔓不长枝，清香远播愈发清幽，纯净地挺立水面", "img": "images/recitation-comics/ailianshuo-c3.webp", "no": "③"}, {"v": "莲，花之君子者也", "s": "莲如君子卓然独立于众花之间，菊隐逸牡丹富贵，唯莲清高可敬", "img": "images/recitation-comics/ailianshuo-c4.webp", "no": "④"}], "py": {"c": {"颐": "yí", "蕃": "fán", "淤": "yū", "濯": "zhuó", "涟": "lián", "蔓": "màn", "逸": "yì", "噫": "yī", "鲜": "xiǎn"}, "w": {}}, "paras": ["水陆草木之花，可爱者甚蕃。晋陶渊明独爱菊。自李唐来，世人甚爱牡丹。予独爱莲之出淤泥而不染，濯清涟而不妖，中通外直，不蔓不枝，香远益清，亭亭净植，可远观而不可亵玩焉。予谓菊，花之隐逸者也；牡丹，花之富贵者也；莲，花之君子者也。噫！菊之爱，陶后鲜有闻。莲之爱，同予者何人？牡丹之爱，宜乎众矣。"], "hard": "颐（yí）、蕃（fán）、淤（yū）、濯（zhuó）、涟（lián）、蔓（màn）、亵、（xiè）、逸（yì）、噫（yī）、鲜（xiǎn，少）", "hardList": [{"zi": "颐", "py": "yí"}, {"zi": "蕃", "py": "fán"}, {"zi": "淤", "py": "yū"}, {"zi": "濯", "py": "zhuó"}, {"zi": "涟", "py": "lián"}, {"zi": "蔓", "py": "màn"}, {"zi": "逸", "py": "yì"}, {"zi": "噫", "py": "yī"}, {"zi": "鲜", "py": "xiǎn，少"}]}, {"id": 27, "slug": "boqinhuai", "title": "泊秦淮", "author": "唐·杜牧", "type": "古诗", "panels": [{"v": "烟笼寒水月笼沙", "s": "迷蒙烟雾笼罩着寒冷的秦淮河水，月光映照着江边白沙，一片朦胧", "img": "images/recitation-comics/boqinhuai-c1.webp", "no": "①"}, {"v": "夜泊秦淮近酒家", "s": "夜里小船停泊在秦淮河畔，岸边酒家灯火点点，笙歌隐隐", "img": "images/recitation-comics/boqinhuai-c2.webp", "no": "②"}, {"v": "商女不知亡国恨", "s": "酒楼之上歌女轻拨琵琶依旧唱着靡靡之曲，浑然不知亡国之痛", "img": "images/recitation-comics/boqinhuai-c3.webp", "no": "③"}, {"v": "隔江犹唱后庭花", "s": "隔岸歌声随风飘来还在唱着那曲后庭花，听者心情沉痛江水呜咽", "img": "images/recitation-comics/boqinhuai-c4.webp", "no": "④"}], "py": {"c": {"笼": "lǒng", "淮": "huái", "犹": "yóu"}, "w": {}}, "paras": ["烟笼寒水月笼沙，夜泊秦淮近酒家。商女不知亡国恨，隔江犹唱后庭花。"], "hard": "笼（lǒng）、淮（huái）、犹（yóu）", "hardList": [{"zi": "笼", "py": "lǒng"}, {"zi": "淮", "py": "huái"}, {"zi": "犹", "py": "yóu"}]}, {"id": 28, "slug": "mulanshi", "title": "木兰诗", "author": "北朝民歌", "type": "古诗", "panels": [{"v": "唧唧复唧唧，木兰当户织。昨夜见军帖，可汗大点兵", "s": "木兰对着门户织布机声声声不停，昨夜见到军中文书，可汗大规模征兵", "img": "images/recitation-comics/mulanshi-c1.webp", "no": "①"}, {"v": "愿为市鞍马，从此替爷征。东市买骏马，西市买鞍鞯", "s": "木兰愿替年迈的父亲出征，奔走四方集市买来骏马鞍鞯辔头长鞭", "img": "images/recitation-comics/mulanshi-c2.webp", "no": "②"}, {"v": "万里赴戎机，关山度若飞。朔气传金柝，寒光照铁衣", "s": "万里奔波奔赴战场，飞越关隘山岭，北方寒气中传来打更声，冷月映照铠甲", "img": "images/recitation-comics/mulanshi-c3.webp", "no": "③"}, {"v": "归来见天子，脱我战时袍，著我旧时裳。同行十二年，不知木兰是女郎", "s": "凯旋归来天子赏赐，木兰脱下战袍换上旧时衣裳，同伴才惊觉同行十二年她竟是女子", "img": "images/recitation-comics/mulanshi-c4.webp", "no": "④"}], "py": {"c": {"唧": "jī", "杼": "zhù", "帖": "tiě", "汗": "hán", "鞯": "jiān", "溅": "jiān", "啾": "jiū", "戎": "róng", "柝": "tuò", "勋": "xūn", "鬓": "bìn", "傍": "bàng", "裳": "cháng"}, "w": {}}, "paras": ["唧唧复唧唧，木兰当户织。不闻机杼声，唯闻女叹息。问女何所思，问女何所忆。女亦无所思，女亦无所忆。昨夜见军帖，可汗大点兵。军书十二卷，卷卷有爷名。阿爷无大儿，木兰无长兄。愿为市鞍马，从此替爷征。东市买骏马，西市买鞍鞯，南市买辔头，北市买长鞭。旦辞爷娘去，暮宿黄河边。不闻爷娘唤女声，但闻黄河流水鸣溅溅。旦辞黄河去，暮至黑山头。不闻爷娘唤女声，但闻燕山胡骑鸣啾啾。万里赴戎机，关山度若飞。朔气传金柝，寒光照铁衣。将军百战死，壮士十年归。归来见天子，天子坐明堂。策勋十二转，赏赐百千强。可汗问所欲，木兰不用尚书郎，愿驰千里足，送儿还故乡。爷娘闻女来，出郭相扶将；阿姊闻妹来，当户理红妆；小弟闻姊来，磨刀霍霍向猪羊。开我东阁门，坐我西阁床。脱我战时袍，著我旧时裳。当窗理云鬓，对镜帖花黄。出门看火伴，火伴皆惊忙：同行十二年，不知木兰是女郎。雄兔脚扑朔，雌兔眼迷离；双兔傍地走，安能辨我是雄雌？"], "hard": "唧（jī）、杼（zhù）、帖（tiě，文书）、可汗（kè hán）、鞯（jiān）、辔、（pèi）、溅（jiān）、啾（jiū）、戎（róng）、柝（tuò）、勋（xūn）、帖（tiē，通、“贴”）、鬓（bìn）、傍（bàng）", "hardList": [{"zi": "唧", "py": "jī"}, {"zi": "杼", "py": "zhù"}, {"zi": "帖", "py": "tiě，文书"}, {"zi": "汗", "py": "kè hán"}, {"zi": "鞯", "py": "jiān"}, {"zi": "溅", "py": "jiān"}, {"zi": "啾", "py": "jiū"}, {"zi": "戎", "py": "róng"}, {"zi": "柝", "py": "tuò"}, {"zi": "勋", "py": "xūn"}, {"zi": "帖", "py": "tiē，通、“贴”"}, {"zi": "鬓", "py": "bìn"}, {"zi": "傍", "py": "bàng"}]}, {"id": 29, "slug": "maiyouweng", "title": "卖油翁", "author": "宋·欧阳修", "type": "文言文", "panels": [{"v": "陈康肃公善射，当世无双，公亦以此自矜", "s": "庭院中陈尧咨张弓搭箭十发九中，洋洋自得，观者啧啧称赞", "img": "images/recitation-comics/maiyouweng-c1.webp", "no": "①"}, {"v": "有卖油翁释担而立，睨之久而不去，但微颔之", "s": "卖油翁放下担子站在一旁，斜着眼看了许久，对神射之技只是微微点头", "img": "images/recitation-comics/maiyouweng-c2.webp", "no": "②"}, {"v": "尔安敢轻吾射！无他，但手熟尔", "s": "陈尧咨怒斥老翁敢轻视我的箭术，老翁从容答道不过手熟罢了", "img": "images/recitation-comics/maiyouweng-c3.webp", "no": "③"}, {"v": "徐以杓酌油沥之，自钱孔入，而钱不湿", "s": "老翁取葫芦置于地，铜钱覆在葫芦口上，用勺舀油缓缓注入，油从钱孔穿过而铜钱不湿", "img": "images/recitation-comics/maiyouweng-c4.webp", "no": "④"}], "py": {"c": {"矜": "jīn", "圃": "pǔ", "释": "shì", "睨": "nì", "颔": "hàn", "忿": "fèn", "覆": "fù", "杓": "sháo", "沥": "lì", "遣": "qiǎn"}, "w": {}}, "paras": ["陈康肃公善射，当世无双，公亦以此自矜。尝射于家圃，有卖油翁释担而立，睨之久而不去。见其发矢十中八九，但微颔之。康肃问曰：“汝亦知射乎？吾射不亦精乎？”翁曰：“无他，但手熟尔。”康肃忿然曰：“尔安敢轻吾射！”翁曰：“以我酌油知之。”乃取一葫芦置于地，以钱覆其口，徐以杓酌油沥之，自钱孔入，而钱不湿。因曰：“我亦无他，惟手熟尔。”康肃笑而遣之。"], "hard": "矜（jīn）、圃（pǔ）、释（shì）、睨（nì）、颔（hàn）、忿（fèn）、酌、（zhuó）、覆（fù）、杓（sháo）、沥（lì）、遣（qiǎn）", "hardList": [{"zi": "矜", "py": "jīn"}, {"zi": "圃", "py": "pǔ"}, {"zi": "释", "py": "shì"}, {"zi": "睨", "py": "nì"}, {"zi": "颔", "py": "hàn"}, {"zi": "忿", "py": "fèn"}, {"zi": "覆", "py": "fù"}, {"zi": "杓", "py": "sháo"}, {"zi": "沥", "py": "lì"}, {"zi": "遣", "py": "qiǎn"}]}]}, {"vol": "八年级（上册）", "color": "#0891B2", "items": [{"id": 30, "slug": "sanxia", "title": "三峡", "author": "北魏·郦道元", "type": "文言文", "panels": [{"v": "自三峡七百里中，两岸连山，略无阙处。重岩叠嶂，隐天蔽日", "s": "三峡两岸高山连绵毫无缺口，重重岩崖层层陡壁遮天蔽日，江水从峡中奔流", "img": "images/recitation-comics/sanxia-c1.webp", "no": "①"}, {"v": "夏水襄陵，沿溯阻绝。朝发白帝，暮到江陵", "s": "夏日江水漫上山陵，上行下行水路断绝，清晨从白帝城出发的快船傍晚已到江陵", "img": "images/recitation-comics/sanxia-c2.webp", "no": "②"}, {"v": "春冬之时，素湍绿潭，回清倒影。绝巘多生怪柏，悬泉瀑布，飞漱其间", "s": "春冬时节白色急流碧绿深潭，回旋清波倒映两岸景致，极高的山峰上怪柏丛生，悬泉瀑布飞流冲荡", "img": "images/recitation-comics/sanxia-c3.webp", "no": "③"}, {"v": "每至晴初霜旦，林寒涧肃，常有高猿长啸，哀转久绝", "s": "秋日晴初霜降的早晨，树林山涧一片清寒寂静，高处的猿猴长啸声声，哀婉余音在空谷久久回荡", "img": "images/recitation-comics/sanxia-c4.webp", "no": "④"}], "py": {"c": {"郦": "lì", "阙": "quē", "嶂": "zhàng", "曦": "xī", "襄": "xiāng", "溯": "sù", "湍": "tuān", "巘": "yǎn", "漱": "shù", "峻": "jùn", "涧": "jiàn", "啸": "xiào", "裳": "cháng"}, "w": {}}, "paras": ["自三峡七百里中，两岸连山，略无阙处。重岩叠嶂，隐天蔽日，自非亭午夜分，不见曦月。至于夏水襄陵，沿溯阻绝。或王命急宣，有时朝发白帝，暮到江陵，其间千二百里，虽乘奔御风，不以疾也。春冬之时，则素湍绿潭，回清倒影。绝巘多生怪柏，悬泉瀑布，飞漱其间，清荣峻茂，良多趣味。每至晴初霜旦，林寒涧肃，常有高猿长啸，属引凄异，空谷传响，哀转久绝。故渔者歌曰：“巴东三峡巫峡长，猿鸣三声泪沾裳。”"], "hard": "郦（lì）、阙（quē，通“缺”）、嶂（zhàng）、曦（xī）、襄（xiāng）、、溯（sù）、湍（tuān）、巘（yǎn）、漱（shù）、峻（jùn）、涧（jiàn）、啸（xiào）、属、（zhǔ）、裳（cháng）", "hardList": [{"zi": "郦", "py": "lì"}, {"zi": "阙", "py": "quē，通“缺”"}, {"zi": "嶂", "py": "zhàng"}, {"zi": "曦", "py": "xī"}, {"zi": "襄", "py": "xiāng"}, {"zi": "溯", "py": "sù"}, {"zi": "湍", "py": "tuān"}, {"zi": "巘", "py": "yǎn"}, {"zi": "漱", "py": "shù"}, {"zi": "峻", "py": "jùn"}, {"zi": "涧", "py": "jiàn"}, {"zi": "啸", "py": "xiào"}, {"zi": "裳", "py": "cháng"}]}, {"id": 31, "slug": "daxiezhongshu", "title": "答谢中书书", "author": "南朝·陶弘景", "type": "文言文", "panels": [{"v": "高峰入云，清流见底", "s": "山峰高耸直插云霄，溪流清澈一望见底，山水交映如同画卷", "img": "images/recitation-comics/daxiezhongshu-c1.webp", "no": "①"}, {"v": "两岸石壁，五色交辉。青林翠竹，四时俱备", "s": "两岸石壁色彩斑斓交相辉映，青葱树林翠绿竹林四季常存", "img": "images/recitation-comics/daxiezhongshu-c2.webp", "no": "②"}, {"v": "晓雾将歇，猿鸟乱鸣；夕日欲颓，沉鳞竞跃", "s": "清晨薄雾将要消散时猿鸟此起彼伏地鸣叫，夕阳将落时潜游的鱼儿争相跃出水面", "img": "images/recitation-comics/daxiezhongshu-c3.webp", "no": "③"}, {"v": "实是欲界之仙都", "s": "这里实在是人间的仙境，云雾缭绕山水清绝，令人流连忘返", "img": "images/recitation-comics/daxiezhongshu-c4.webp", "no": "④"}], "py": {"c": {"弘": "hóng", "歇": "xiē", "颓": "tuí", "鳞": "lín", "竞": "jìng", "与": "yù"}, "w": {}}, "paras": ["山川之美，古来共谈。高峰入云，清流见底。两岸石壁，五色交辉。青林翠竹，四时俱备。晓雾将歇，猿鸟乱鸣；夕日欲颓，沉鳞竞跃。实是欲界之仙都。自康乐以来，未复有能与其奇者。"], "hard": "弘（hóng）、歇（xiē）、颓（tuí）、鳞（lín）、竞（jìng）、与（yù，参、与，这里指欣赏）", "hardList": [{"zi": "弘", "py": "hóng"}, {"zi": "歇", "py": "xiē"}, {"zi": "颓", "py": "tuí"}, {"zi": "鳞", "py": "lín"}, {"zi": "竞", "py": "jìng"}, {"zi": "与", "py": "yù，参、与，这里指欣赏"}]}, {"id": 32, "slug": "jichengtiansi", "title": "记承天寺夜游", "author": "宋·苏轼", "type": "文言文", "panels": [{"v": "元丰六年十月十二日夜，解衣欲睡，月色入户，欣然起行", "s": "十月十二的夜晚，苏轼正欲解衣入睡，见月色洒满门户，欣然披衣起身走出门去", "img": "images/recitation-comics/jichengtiansi-c1.webp", "no": "①"}, {"v": "遂至承天寺寻张怀民。怀民亦未寝，相与步于中庭", "s": "到承天寺寻张怀民，怀民也还未睡，两人便一同在庭院中散步", "img": "images/recitation-comics/jichengtiansi-c2.webp", "no": "②"}, {"v": "庭下如积水空明，水中藻荇交横，盖竹柏影也", "s": "月光洒满庭院如一汪积水清澈透明，水中纵横交错的藻荇原来是竹柏的影子", "img": "images/recitation-comics/jichengtiansi-c3.webp", "no": "③"}, {"v": "何夜无月？何处无竹柏？但少闲人如吾两人者耳", "s": "月光下两位闲人并肩缓步，哪个夜晚没有月光？哪里没有竹柏？只是少有像我们这样的闲人罢了", "img": "images/recitation-comics/jichengtiansi-c4.webp", "no": "④"}], "py": {"c": {"遂": "suì", "寝": "qǐn", "藻": "zǎo", "荇": "xìng", "柏": "bǎi"}, "w": {}}, "paras": ["元丰六年十月十二日夜，解衣欲睡，月色入户，欣然起行。念无与为乐者，遂至承天寺寻张怀民。怀民亦未寝，相与步于中庭。庭下如积水空明，水中藻、荇交横，盖竹柏影也。何夜无月？何处无竹柏？但少闲人如吾两人者耳。"], "hard": "遂（suì）、寝（qǐn）、藻（zǎo）、荇（xìng）、柏（bǎi）", "hardList": [{"zi": "遂", "py": "suì"}, {"zi": "寝", "py": "qǐn"}, {"zi": "藻", "py": "zǎo"}, {"zi": "荇", "py": "xìng"}, {"zi": "柏", "py": "bǎi"}]}, {"id": 33, "slug": "yuzhuyuansi", "title": "与朱元思书", "author": "南朝·吴均", "type": "文言文", "panels": [{"v": "风烟俱净，天山共色。从流飘荡，任意东西", "s": "风停烟消天空山色浑然一色，小船随江流飘荡，任凭它时而偏东时而偏西", "img": "images/recitation-comics/yuzhuyuansi-c1.webp", "no": "①"}, {"v": "水皆缥碧，千丈见底。游鱼细石，直视无碍", "s": "江水青白透碧千丈深处也能见底，游动的鱼和细小的石子都能看得清清楚楚", "img": "images/recitation-comics/yuzhuyuansi-c2.webp", "no": "②"}, {"v": "急湍甚箭，猛浪若奔", "s": "湍急的水流比箭还快，凶猛的浪涛像飞奔的骏马", "img": "images/recitation-comics/yuzhuyuansi-c3.webp", "no": "③"}, {"v": "负势竞上，互相轩邈；泉水激石，泠泠作响", "s": "夹岸高山凭依形势争着向上，泉水冲击岩石发出泠泠清响", "img": "images/recitation-comics/yuzhuyuansi-c4.webp", "no": "④"}], "py": {"c": {"缥": "piǎo", "湍": "tuān", "邈": "miǎo", "泠": "líng", "嘤": "yīng", "转": "zhuàn", "鸢": "yuān", "戾": "lì", "纶": "lún", "窥": "kuī", "反": "fǎn", "柯": "kē"}, "w": {}}, "paras": ["风烟俱净，天山共色。从流飘荡，任意东西。自富阳至桐庐一百许里，奇山异水，天下独绝。水皆缥碧，千丈见底。游鱼细石，直视无碍。急湍甚箭，猛浪若奔。夹岸高山，皆生寒树，负势竞上，互相轩邈，争高直指，千百成峰。泉水激石，泠泠作响；好鸟相鸣，嘤嘤成韵。蝉则千转不穷，猿则百叫无绝。鸢飞戾天者，望峰息心；经纶世务者，窥谷忘反。横柯上蔽，在昼犹昏；疏条交映，有时见日。"], "hard": "缥（piǎo）、湍（tuān）、轩邈（xuān miǎo）、泠（líng）、嘤（yīng）、、转（zhuàn，通“啭”）、鸢（yuān）、戾（lì）、纶（lún）、窥（kuī）、反（fǎn，通、“返”）、柯（kē）", "hardList": [{"zi": "缥", "py": "piǎo"}, {"zi": "湍", "py": "tuān"}, {"zi": "邈", "py": "xuān miǎo"}, {"zi": "泠", "py": "líng"}, {"zi": "嘤", "py": "yīng"}, {"zi": "转", "py": "zhuàn，通“啭”"}, {"zi": "鸢", "py": "yuān"}, {"zi": "戾", "py": "lì"}, {"zi": "纶", "py": "lún"}, {"zi": "窥", "py": "kuī"}, {"zi": "反", "py": "fǎn，通、“返”"}, {"zi": "柯", "py": "kē"}]}, {"id": 34, "slug": "yewang", "title": "野望", "author": "唐·王绩", "type": "古诗", "panels": [{"v": "东皋薄暮望，徙倚欲何依", "s": "黄昏时分诗人独立东皋纵目远望，来来回回徘徊不定不知该归依何处", "img": "images/recitation-comics/yewang-c1.webp", "no": "①"}, {"v": "树树皆秋色，山山唯落晖", "s": "棵棵树木都染上秋天的色彩，重重山岭都只披着落日的余晖", "img": "images/recitation-comics/yewang-c2.webp", "no": "②"}, {"v": "牧人驱犊返，猎马带禽归", "s": "牧人赶着牛犊返回村里，猎人骑着马带着猎获的禽鸟归家", "img": "images/recitation-comics/yewang-c3.webp", "no": "③"}, {"v": "相顾无相识，长歌怀采薇", "s": "大家相顾无言彼此都不相识，诗人只好长声歌唱怀念古代采薇的隐士", "img": "images/recitation-comics/yewang-c4.webp", "no": "④"}], "py": {"c": {"皋": "gāo", "徙": "xǐ", "倚": "yǐ", "晖": "huī", "犊": "dú", "禽": "qín"}, "w": {}}, "paras": ["东皋薄暮望，徙倚欲何依。树树皆秋色，山山唯落晖。牧人驱犊返，猎马带禽归。相顾无相识，长歌怀采薇。"], "hard": "皋（gāo）、徙（xǐ）、倚（yǐ）、晖（huī）、犊（dú）、禽（qín）、薇、（wēi）", "hardList": [{"zi": "皋", "py": "gāo"}, {"zi": "徙", "py": "xǐ"}, {"zi": "倚", "py": "yǐ"}, {"zi": "晖", "py": "huī"}, {"zi": "犊", "py": "dú"}, {"zi": "禽", "py": "qín"}]}, {"id": 35, "slug": "huanghelou", "title": "黄鹤楼", "author": "唐·崔颢", "type": "古诗", "panels": [{"v": "昔人已乘黄鹤去，此地空余黄鹤楼", "s": "昔日的仙人已乘黄鹤飞去，此地只留下一座空荡荡的黄鹤楼", "img": "images/recitation-comics/huanghelou-c1.webp", "no": "①"}, {"v": "黄鹤一去不复返，白云千载空悠悠", "s": "黄鹤一去再也没有回来，千百年来只有白云悠悠飘荡", "img": "images/recitation-comics/huanghelou-c2.webp", "no": "②"}, {"v": "晴川历历汉阳树，芳草萋萋鹦鹉洲", "s": "晴日里汉阳一带的树木清晰可见，鹦鹉洲上芳草长得茂盛浓密", "img": "images/recitation-comics/huanghelou-c3.webp", "no": "③"}, {"v": "日暮乡关何处是？烟波江上使人愁", "s": "天色渐暮，眺望远方家乡在何处？江上烟波渺茫更使人发愁", "img": "images/recitation-comics/huanghelou-c4.webp", "no": "④"}], "py": {"c": {"颢": "hào", "鹤": "hè", "载": "zǎi", "萋": "qī", "鹦": "yīng", "鹉": "wǔ"}, "w": {}}, "paras": ["昔人已乘黄鹤去，此地空余黄鹤楼。黄鹤一去不复返，白云千载空悠悠。晴川历历汉阳树，芳草萋萋鹦鹉洲。日暮乡关何处是？烟波江上使人愁。"], "hard": "颢（hào）、鹤（hè）、载（zǎi）、萋（qī）、鹦（yīng）、鹉（wǔ）", "hardList": [{"zi": "颢", "py": "hào"}, {"zi": "鹤", "py": "hè"}, {"zi": "载", "py": "zǎi"}, {"zi": "萋", "py": "qī"}, {"zi": "鹦", "py": "yīng"}, {"zi": "鹉", "py": "wǔ"}]}, {"id": 36, "slug": "shizhisai", "title": "使至塞上", "author": "唐·王维", "type": "古诗", "panels": [{"v": "单车欲问边，属国过居延", "s": "轻车简从出使边塞去慰问，途经居延属国，车马行于广袤大漠", "img": "images/recitation-comics/shizhisai-c1.webp", "no": "①"}, {"v": "征蓬出汉塞，归雁入胡天", "s": "像随风飘飞的蓬草飘出汉塞，像归巢的大雁飞入胡天，羁旅之感油然而生", "img": "images/recitation-comics/shizhisai-c2.webp", "no": "②"}, {"v": "大漠孤烟直，长河落日圆", "s": "浩瀚沙漠中一缕孤烟笔直升起，蜿蜒的黄河上一轮落日浑圆低垂", "img": "images/recitation-comics/shizhisai-c3.webp", "no": "③"}, {"v": "萧关逢候骑，都护在燕然", "s": "到萧关时遇到侦察骑兵，都说都护正在燕然前线，大军远在千里之外", "img": "images/recitation-comics/shizhisai-c4.webp", "no": "④"}], "py": {"c": {"属": "zhǔ", "蓬": "péng", "塞": "sài", "候": "hòu", "燕": "yān"}, "w": {}}, "paras": ["单车欲问边，属国过居延。征蓬出汉塞，归雁入胡天。大漠孤烟直，长河落日圆。萧关逢候骑，都护在燕然。"], "hard": "属（zhǔ）、蓬（péng）、塞（sài）、候（hòu）、燕（yān）", "hardList": [{"zi": "属", "py": "zhǔ"}, {"zi": "蓬", "py": "péng"}, {"zi": "塞", "py": "sài"}, {"zi": "候", "py": "hòu"}, {"zi": "燕", "py": "yān"}]}, {"id": 37, "slug": "dujingmen", "title": "渡荆门送别", "author": "唐·李白", "type": "古诗", "panels": [{"v": "渡远荆门外，来从楚国游", "s": "乘船远渡到荆门山之外，来到古时楚国故地尽情漫游", "img": "images/recitation-comics/dujingmen-c1.webp", "no": "①"}, {"v": "山随平野尽，江入大荒流", "s": "山峦随着平原的出现渐渐消失，江水在辽阔原野上奔流而去", "img": "images/recitation-comics/dujingmen-c2.webp", "no": "②"}, {"v": "月下飞天镜，云生结海楼", "s": "江中月影如天上飞来的明镜，云霞升腾结成海市蜃楼般的奇景", "img": "images/recitation-comics/dujingmen-c3.webp", "no": "③"}, {"v": "仍怜故乡水，万里送行舟", "s": "依旧深爱这来自故乡的江水，不远万里来送我的行舟", "img": "images/recitation-comics/dujingmen-c4.webp", "no": "④"}], "py": {"c": {"荆": "jīng", "怜": "lián"}, "w": {}}, "paras": ["渡远荆门外，来从楚国游。山随平野尽，江入大荒流。月下飞天镜，云生结海楼。仍怜故乡水，万里送行舟。"], "hard": "荆（jīng）、怜（lián）", "hardList": [{"zi": "荆", "py": "jīng"}, {"zi": "怜", "py": "lián"}]}, {"id": 38, "slug": "qiantanghu", "title": "钱塘湖春行", "author": "唐·白居易", "type": "古诗", "panels": [{"v": "孤山寺北贾亭西，水面初平云脚低", "s": "从孤山寺北到贾公亭西，春水初涨与堤岸相平，云幕低垂与湖面相连", "img": "images/recitation-comics/qiantanghu-c1.webp", "no": "①"}, {"v": "几处早莺争暖树，谁家新燕啄春泥", "s": "几只早出的黄莺争着飞向向阳的暖树，谁家新来的燕子正衔着春泥筑巢", "img": "images/recitation-comics/qiantanghu-c2.webp", "no": "②"}, {"v": "乱花渐欲迷人眼，浅草才能没马蹄", "s": "缤纷的春花渐渐要迷住人的眼睛，浅浅的春草刚刚能够没过马蹄", "img": "images/recitation-comics/qiantanghu-c3.webp", "no": "③"}, {"v": "最爱湖东行不足，绿杨阴里白沙堤", "s": "最爱湖东的美景总也游览不够，绿杨阴里那条白沙堤令人流连", "img": "images/recitation-comics/qiantanghu-c4.webp", "no": "④"}], "py": {"c": {"贾": "jiǎ", "莺": "yīng", "啄": "zhuó", "堤": "dī"}, "w": {}}, "paras": ["孤山寺北贾亭西，水面初平云脚低。几处早莺争暖树，谁家新燕啄春泥。乱花渐欲迷人眼，浅草才能没马蹄。最爱湖东行不足，绿杨阴里白沙堤。"], "hard": "贾（jiǎ）、莺（yīng）、啄（zhuó）、堤（dī）", "hardList": [{"zi": "贾", "py": "jiǎ"}, {"zi": "莺", "py": "yīng"}, {"zi": "啄", "py": "zhuó"}, {"zi": "堤", "py": "dī"}]}, {"id": 39, "slug": "tingzhongqishu", "title": "庭中有奇树", "author": "《古诗十九首》", "type": "古诗", "panels": [{"v": "庭中有奇树，绿叶发华滋", "s": "庭院中一株佳美奇异的花树，绿叶间绽开繁盛的花朵", "img": "images/recitation-comics/tingzhongqishu-c1.webp", "no": "①"}, {"v": "攀条折其荣，将以遗所思", "s": "思妇攀着枝条折下最美的一枝花，想把它送给心中思念的远人", "img": "images/recitation-comics/tingzhongqishu-c2.webp", "no": "②"}, {"v": "馨香盈怀袖，路远莫致之", "s": "花香充满她的衣袖，可是路途遥远这花始终无法送到", "img": "images/recitation-comics/tingzhongqishu-c3.webp", "no": "③"}, {"v": "此物何足贵，但感别经时", "s": "这花本不足以珍贵，只是感伤离别已久，睹花思人", "img": "images/recitation-comics/tingzhongqishu-c4.webp", "no": "④"}], "py": {"c": {"华": "huā", "攀": "pān", "遗": "wèi", "馨": "xīn"}, "w": {}}, "paras": ["庭中有奇树，绿叶发华滋。", "攀条折其荣，将以遗所思。馨香盈怀袖，路远莫致之。此物何足贵，但感别经时。"], "hard": "华（huā，通“花”）、攀（pān）、遗（wèi，赠送）、馨（xīn）", "hardList": [{"zi": "华", "py": "huā，通“花”"}, {"zi": "攀", "py": "pān"}, {"zi": "遗", "py": "wèi，赠送"}, {"zi": "馨", "py": "xīn"}]}, {"id": 40, "slug": "yinjiu", "title": "饮酒（其五）", "author": "东晋·陶渊明", "type": "古诗", "panels": [{"v": "结庐在人境，而无车马喧", "s": "在人来人往之地结庐而居，却听不见车马的喧闹，柴门半掩静意自生", "img": "images/recitation-comics/yinjiu-c1.webp", "no": "①"}, {"v": "问君何能尔？心远地自偏", "s": "有人问为何能如此？只因心已远离尘俗，住地自然就显得偏远了", "img": "images/recitation-comics/yinjiu-c2.webp", "no": "②"}, {"v": "采菊东篱下，悠然见南山", "s": "东篱下俯身采菊，不经意间抬起头，悠然望见秀美的南山", "img": "images/recitation-comics/yinjiu-c3.webp", "no": "③"}, {"v": "山气日夕佳，飞鸟相与还", "s": "傍晚的山色氤氲美好，成群的飞鸟结伴归巢", "img": "images/recitation-comics/yinjiu-c4.webp", "no": "④"}], "py": {"c": {"庐": "lú", "喧": "xuān", "篱": "lí", "见": "xiàn", "辨": "biàn"}, "w": {}}, "paras": ["结庐在人境，而无车马喧。问君何能尔？心远地自偏。采菊东篱下，悠然见南山。山气日夕佳，飞鸟相与还。此中有真意，欲辨已忘言。"], "hard": "庐（lú）、喧（xuān）、篱（lí）、见（xiàn，通“现”）、辨（biàn）", "hardList": [{"zi": "庐", "py": "lú"}, {"zi": "喧", "py": "xuān"}, {"zi": "篱", "py": "lí"}, {"zi": "见", "py": "xiàn，通“现”"}, {"zi": "辨", "py": "biàn"}]}, {"id": 41, "slug": "chibi", "title": "赤壁", "author": "唐·杜牧", "type": "古诗", "panels": [{"v": "折戟沉沙铁未销", "s": "一支折断的铁戟沉埋在江底沙中，数百年过去铁还没有完全销蚀", "img": "images/recitation-comics/chibi-c1.webp", "no": "①"}, {"v": "自将磨洗认前朝", "s": "诗人把它捞起磨光洗净，认出那是前朝赤壁之战的遗物", "img": "images/recitation-comics/chibi-c2.webp", "no": "②"}, {"v": "东风不与周郎便", "s": "遥想当年若不是东风给周瑜方便，火攻之计便无从施展", "img": "images/recitation-comics/chibi-c3.webp", "no": "③"}, {"v": "铜雀春深锁二乔", "s": "那样一来，东吴的两位美人早被深锁进曹操的铜雀台了", "img": "images/recitation-comics/chibi-c4.webp", "no": "④"}], "py": {"c": {"戟": "jǐ", "销": "xiāo", "磨": "mó", "雀": "què", "锁": "suǒ"}, "w": {}}, "paras": ["折戟沉沙铁未销，自将磨洗认前朝。东风不与周郎便，铜雀春深锁二乔。"], "hard": "戟（jǐ）、销（xiāo）、磨（mó）、雀（què）、锁（suǒ）", "hardList": [{"zi": "戟", "py": "jǐ"}, {"zi": "销", "py": "xiāo"}, {"zi": "磨", "py": "mó"}, {"zi": "雀", "py": "què"}, {"zi": "锁", "py": "suǒ"}]}, {"id": 42, "slug": "fuguibunengyin", "title": "富贵不能淫", "author": "《孟子》", "type": "文言文", "panels": [{"v": "一怒而诸侯惧，安居而天下熄", "s": "景春指着远方说：公孙衍张仪一发怒诸侯都害怕，他们安静下来天下便太平无事", "img": "images/recitation-comics/fuguibunengyin-c1.webp", "no": "①"}, {"v": "以顺为正者，妾妇之道也", "s": "孟子摇头：把顺从当作准则的，那是妇人丫头遵行的道理，岂是大丈夫", "img": "images/recitation-comics/fuguibunengyin-c2.webp", "no": "②"}, {"v": "居天下之广居，立天下之正位，行天下之大道", "s": "真正的大丈夫住在天下最宽广的住宅里，站在天下最正确的位置，走天下最光明的道路", "img": "images/recitation-comics/fuguibunengyin-c3.webp", "no": "③"}, {"v": "富贵不能淫，贫贱不能移，威武不能屈，此之谓大丈夫", "s": "昂首而立的君子，富贵不能使他迷乱，贫贱不能使他动摇，威武不能使他屈服", "img": "images/recitation-comics/fuguibunengyin-c4.webp", "no": "④"}], "py": {"c": {"衍": "yǎn", "女": "rǔ", "淫": "yín", "贱": "jiàn", "屈": "qū"}, "w": {}}, "paras": ["景春曰：“公孙衍、张仪岂不诚大丈夫哉？一怒而诸侯惧，安居而天下熄。”孟子曰：“是焉得为大丈夫乎？子未学礼乎？丈夫之冠也，父命之；女子之嫁也，母命之，往送之门，戒之曰：'往之女家，必敬必戒，无违夫子！'以顺为正者，妾妇之道也。居天下之广居，立天下之正位，行天下之大道。得志，与民由之；不得志，独行其道。富贵不能淫，贫贱不能移，威武不能屈，此之谓大丈夫。”"], "hard": "衍（yǎn）、女（rǔ，通“汝”）、淫（yín）、贱（jiàn）、屈（qū）", "hardList": [{"zi": "衍", "py": "yǎn"}, {"zi": "女", "py": "rǔ，通“汝”"}, {"zi": "淫", "py": "yín"}, {"zi": "贱", "py": "jiàn"}, {"zi": "屈", "py": "qū"}]}, {"id": 43, "slug": "shengyuyouhuan", "title": "生于忧患，死于安乐", "author": "《孟子》", "type": "文言文", "panels": [{"v": "舜发于畎亩之中，傅说举于版筑之间", "s": "舜从田间耕作中被起用，傅说从筑墙的劳作中被举拔，六位先贤皆从微贱中崛起", "img": "images/recitation-comics/shengyuyouhuan-c1.webp", "no": "①"}, {"v": "天将降大任于是人也，必先苦其心志，劳其筋骨，饿其体肤", "s": "上天将要把重大使命降临给这样的人，必定先使他内心痛苦筋骨劳累身体饥饿", "img": "images/recitation-comics/shengyuyouhuan-c2.webp", "no": "②"}, {"v": "行拂乱其所为，所以动心忍性，曾益其所不能", "s": "让他所做的事颠倒错乱，以此震动心灵坚韧性情，增长他所不具备的才能", "img": "images/recitation-comics/shengyuyouhuan-c3.webp", "no": "③"}, {"v": "然后知生于忧患而死于安乐也", "s": "历经磨砺的人终于挺立起来，沉溺安乐的城邦悄然衰亡，忧患使人生存，安乐使人萎亡", "img": "images/recitation-comics/shengyuyouhuan-c4.webp", "no": "④"}], "py": {"c": {"舜": "shùn", "畎": "quǎn", "说": "yuè", "鬲": "gé", "敖": "áo", "奚": "xī", "拂": "fú", "曾": "zēng", "衡": "héng"}, "w": {}}, "paras": ["舜发于畎亩之中，傅说举于版筑之间，胶鬲举于鱼盐之中，管夷吾举于士，孙叔敖举于海，百里奚举于市。故天将降大任于是人也，必先苦其心志，劳其筋骨，饿其体肤，空乏其身，行拂乱其所为，所以动心忍性，曾益其所不能。人恒过，然后能改；困于心，衡于虑，而后作；征于色，发于声，而后喻。入则无法家拂士，出则无敌国外患者，国恒亡。然后知生于忧患而死于安乐也。"], "hard": "舜（Shùn）、畎（quǎn）、傅说（yuè）、鬲（gé）、敖（áo）、奚（xī）、、拂（fú）、曾（zēng，通“增”）、衡（héng）、拂（bì，通“弼”）", "hardList": [{"zi": "舜", "py": "Shùn"}, {"zi": "畎", "py": "quǎn"}, {"zi": "说", "py": "yuè"}, {"zi": "鬲", "py": "gé"}, {"zi": "敖", "py": "áo"}, {"zi": "奚", "py": "xī"}, {"zi": "拂", "py": "fú"}, {"zi": "曾", "py": "zēng，通“增”"}, {"zi": "衡", "py": "héng"}, {"zi": "拂", "py": "bì，通“弼”"}]}]}, {"vol": "八年级（下册）", "color": "#2563EB", "items": [{"id": 44, "slug": "guanju", "title": "关雎", "author": "《诗经·周南》", "type": "古诗", "panels": [{"v": "关关雎鸠，在河之洲。窈窕淑女，君子好逑", "s": "河中小洲上雎鸠关关和鸣，文静美好的姑娘正是君子的好配偶", "img": "images/recitation-comics/guanju-c1.webp", "no": "①"}, {"v": "参差荇菜，左右流之。窈窕淑女，寤寐求之", "s": "姑娘在水中采捞长短不齐的荇菜，君子对她朝思暮想日夜追求", "img": "images/recitation-comics/guanju-c2.webp", "no": "②"}, {"v": "求之不得，寤寐思服。悠哉悠哉，辗转反侧", "s": "追求不能如愿，思念绵绵不断，长夜漫漫翻来覆去难以入眠", "img": "images/recitation-comics/guanju-c3.webp", "no": "③"}, {"v": "参差荇菜，左右采之。窈窕淑女，琴瑟友之，钟鼓乐之", "s": "姑娘终于款款而来，君子弹琴鼓瑟与她亲近，敲钟打鼓使她快乐", "img": "images/recitation-comics/guanju-c4.webp", "no": "④"}], "py": {"c": {"雎": "jū", "鸠": "jiū", "窕": "tiǎo", "逑": "qiú", "荇": "xìng", "瑟": "sè", "芼": "mào", "乐": "yào"}, "w": {}}, "paras": ["关关雎鸠，在河之洲。窈窕淑女，君子好逑。参差荇菜，左右流之。窈窕淑女，寤寐求之。求之不得，寤寐思服。", "悠哉悠哉，辗转反侧。参差荇菜，左右采之。窈窕淑女，琴瑟友之。参差荇菜，左右芼之。窈窕淑女，钟鼓乐之。"], "hard": "雎（jū）、鸠（jiū）、窈窕（yǎo tiǎo）、逑（qiú）、荇（xìng）、寤寐、（wù mèi）、瑟（sè）、芼（mào）、乐（yào，使…快乐）", "hardList": [{"zi": "雎", "py": "jū"}, {"zi": "鸠", "py": "jiū"}, {"zi": "窕", "py": "yǎo tiǎo"}, {"zi": "逑", "py": "qiú"}, {"zi": "荇", "py": "xìng"}, {"zi": "瑟", "py": "sè"}, {"zi": "芼", "py": "mào"}, {"zi": "乐", "py": "yào，使…快乐"}]}, {"id": 45, "slug": "jianjia", "title": "蒹葭", "author": "《诗经·秦风》", "type": "古诗", "panels": [{"v": "蒹葭苍苍，白露为霜。所谓伊人，在水一方", "s": "深秋芦苇苍茫，白露凝成了霜，所思慕的那个身影就在河的那一方", "img": "images/recitation-comics/jianjia-c1.webp", "no": "①"}, {"v": "溯洄从之，道阻且长。溯游从之，宛在水中央", "s": "逆流而上去追寻她，道路险阻而漫长；顺流而下去寻她，她仿佛又在水的中央", "img": "images/recitation-comics/jianjia-c2.webp", "no": "②"}, {"v": "蒹葭萋萋，白露未晞。所谓伊人，在水之湄", "s": "芦苇茂密连成一片，露水尚未晒干，那人的身影依稀又在水草交接的岸边", "img": "images/recitation-comics/jianjia-c3.webp", "no": "③"}, {"v": "蒹葭采采，白露未已。道阻且右，宛在水中沚", "s": "芦苇繁盛露水未干，追寻之路曲折难行，那身影又仿佛立在水中的小洲上，始终可望而不可即", "img": "images/recitation-comics/jianjia-c4.webp", "no": "④"}], "py": {"c": {"葭": "jiā", "溯": "sù", "洄": "huí", "晞": "xī", "湄": "méi", "坻": "chí", "涘": "sì", "沚": "zhǐ"}, "w": {}}, "paras": ["蒹葭苍苍，白露为霜。所谓伊人，在水一方。溯洄从之，道阻且长。溯游从之，宛在水中央。蒹葭萋萋，白露未晞。所谓伊人，在水之湄。溯洄从之，道阻且跻。溯游从之，宛在水中坻。蒹葭采采，白露未已。所谓伊人，在水之涘。溯洄从之，道阻且右。溯游从之，宛在水中沚。"], "hard": "蒹葭（jiān jiā）、溯（sù）、洄（huí）、晞（xī）、湄（méi）、跻、（jī）、坻（chí）、涘（sì）、沚（zhǐ）", "hardList": [{"zi": "葭", "py": "jiān jiā"}, {"zi": "溯", "py": "sù"}, {"zi": "洄", "py": "huí"}, {"zi": "晞", "py": "xī"}, {"zi": "湄", "py": "méi"}, {"zi": "坻", "py": "chí"}, {"zi": "涘", "py": "sì"}, {"zi": "沚", "py": "zhǐ"}]}, {"id": 46, "slug": "shiwei", "title": "式微", "author": "《诗经·邶风》", "type": "古诗", "panels": [{"v": "式微式微，胡不归", "s": "天色已晚暮色沉沉，为什么还不回家？役夫在暮色中劳作不息", "img": "images/recitation-comics/shiwei-c1.webp", "no": "①"}, {"v": "微君之故，胡为乎中露", "s": "若不是为君主劳役，何至于在露水中终年辛苦", "img": "images/recitation-comics/shiwei-c2.webp", "no": "②"}, {"v": "式微式微，胡不归", "s": "夜幕再次降临，仍不能归家的役夫仰天长叹", "img": "images/recitation-comics/shiwei-c3.webp", "no": "③"}, {"v": "微君之躬，胡为乎泥中", "s": "若不是为君主养贵体，何至于在泥浆中没日没夜地劳作", "img": "images/recitation-comics/shiwei-c4.webp", "no": "④"}], "py": {"c": {"微": "wēi", "邶": "bèi", "躬": "gōng"}, "w": {}}, "paras": ["式微式微，胡不归？微君之故，胡为乎中露？式微式微，胡不归？微君之躬，胡为乎泥中？"], "hard": "式微（shì wēi）、邶（bèi）、躬（gōng）", "hardList": [{"zi": "微", "py": "shì wēi"}, {"zi": "邶", "py": "bèi"}, {"zi": "躬", "py": "gōng"}]}, {"id": 47, "slug": "songshaofu", "title": "送杜少府之任蜀州", "author": "唐·王勃", "type": "古诗", "panels": [{"v": "城阙辅三秦，风烟望五津", "s": "长安城阙被三秦大地护卫着，遥望蜀州五津只见风烟迷茫", "img": "images/recitation-comics/songshaofu-c1.webp", "no": "①"}, {"v": "与君离别意，同是宦游人", "s": "与你分别心中同怀不舍，我们都是远离故乡宦游之人", "img": "images/recitation-comics/songshaofu-c2.webp", "no": "②"}, {"v": "海内存知己，天涯若比邻", "s": "四海之内只要有知心朋友，纵使远在天涯也如近在比邻", "img": "images/recitation-comics/songshaofu-c3.webp", "no": "③"}, {"v": "无为在歧路，儿女共沾巾", "s": "在分别的岔路口，不要像小儿女一样让泪水沾湿佩巾", "img": "images/recitation-comics/songshaofu-c4.webp", "no": "④"}], "py": {"c": {"阙": "què", "辅": "fǔ", "宦": "huàn", "涯": "yá", "歧": "qí", "沾": "zhān"}, "w": {}}, "paras": ["城阙辅三秦，风烟望五津。与君离别意，同是宦游人。海内存知己，天涯若比邻。无为在歧路，儿女共沾巾。"], "hard": "阙（què）、辅（fǔ）、宦（huàn）、涯（yá）、歧（qí）、沾（zhān）", "hardList": [{"zi": "阙", "py": "què"}, {"zi": "辅", "py": "fǔ"}, {"zi": "宦", "py": "huàn"}, {"zi": "涯", "py": "yá"}, {"zi": "歧", "py": "qí"}, {"zi": "沾", "py": "zhān"}]}, {"id": 48, "slug": "wangdongtinghu", "title": "望洞庭湖赠张丞相", "author": "唐·孟浩然", "type": "古诗", "panels": [{"v": "八月湖水平，涵虚混太清", "s": "八月洞庭湖水盛涨与岸齐平，水天含混相接浑然一体", "img": "images/recitation-comics/wangdongtinghu-c1.webp", "no": "①"}, {"v": "气蒸云梦泽，波撼岳阳城", "s": "云梦二泽水气蒸腾白白茫茫，波涛汹涌似乎把岳阳城撼动", "img": "images/recitation-comics/wangdongtinghu-c2.webp", "no": "②"}, {"v": "欲济无舟楫，端居耻圣明", "s": "想要渡水却没有船只，闲居不仕有愧于圣明的时代", "img": "images/recitation-comics/wangdongtinghu-c3.webp", "no": "③"}, {"v": "坐观垂钓者，徒有羡鱼情", "s": "坐着看别人垂钓，空有羡慕鱼儿上钩的心情", "img": "images/recitation-comics/wangdongtinghu-c4.webp", "no": "④"}], "py": {"c": {"涵": "hán", "混": "hùn", "撼": "hàn", "楫": "jí", "耻": "chǐ", "羡": "xiàn"}, "w": {}}, "paras": ["八月湖水平，涵虚混太清。气蒸云梦泽，波撼岳阳城。欲济无舟楫，端居耻圣明。坐观垂钓者，徒有羡鱼情。"], "hard": "涵（hán）、混（hùn）、撼（hàn）、楫（jí）、耻（chǐ）、羡（xiàn）", "hardList": [{"zi": "涵", "py": "hán"}, {"zi": "混", "py": "hùn"}, {"zi": "撼", "py": "hàn"}, {"zi": "楫", "py": "jí"}, {"zi": "耻", "py": "chǐ"}, {"zi": "羡", "py": "xiàn"}]}, {"id": 49, "slug": "taohuayuan", "title": "桃花源记", "author": "东晋·陶渊明", "type": "文言文", "panels": [{"v": "缘溪行，忘路之远近。忽逢桃花林，夹岸数百步，中无杂树，芳草鲜美，落英缤纷", "s": "渔人沿溪行船忘了路程远近，忽然遇见一片桃花林，两岸数百步内没有别的树，芳草鲜嫩落花缤纷", "img": "images/recitation-comics/taohuayuan-c1.webp", "no": "①"}, {"v": "林尽水源，便得一山，山有小口，仿佛若有光。便舍船，从口入", "s": "桃林尽处溪水发源处发现一座山，山有小口隐隐透出光亮，渔人便舍船从洞口钻入", "img": "images/recitation-comics/taohuayuan-c2.webp", "no": "②"}, {"v": "土地平旷，屋舍俨然，有良田、美池、桑竹之属。阡陌交通，鸡犬相闻", "s": "眼前豁然开朗，土地平旷屋舍整齐，良田美池桑竹环绕，田间小路交错相通，鸡鸣犬吠之声彼此可闻", "img": "images/recitation-comics/taohuayuan-c3.webp", "no": "③"}, {"v": "自云先世避秦时乱……不复出焉。后遂无问津者", "s": "村人自言先世为避秦时战乱携妻儿乡邻来此绝境，再也没有出去；渔人出洞处处做标记再去寻找却迷失了路，从此再无人问津", "img": "images/recitation-comics/taohuayuan-c4.webp", "no": "④"}], "py": {"c": {"缘": "yuán", "纷": "fēn", "豁": "huò", "俨": "yǎn", "陌": "mò", "髫": "tiáo", "怡": "yí", "要": "yāo", "咸": "xián", "邑": "yì", "与": "yǔ", "延": "yán", "诣": "yì", "骥": "jì", "津": "jīn"}, "w": {}}, "paras": ["晋太元中，武陵人捕鱼为业。缘溪行，忘路之远近。忽逢桃花林，夹岸数百步，中无杂树，芳草鲜美，落英缤纷。渔人甚异之，复前行，欲穷其林。林尽水源，便得一山，山有小口，仿佛若有光。便舍船，从口入。初极狭，才通人。复行数十步，豁然开朗。土地平旷，屋舍俨然，有良田、美池、桑竹之属。阡陌交通，鸡犬相闻。其中往来种作，男女衣着，悉如外人。黄发垂髫，并怡然自乐。见渔人，乃大惊，问所从来。具答之。便要还家，设酒杀鸡作食。村中闻有此人，咸来问讯。自云先世避秦时乱，率妻子邑人来此绝境，不复出焉，遂与外人间隔。问今是何世，乃不知有汉，无论魏晋。此人一一为具言所闻，皆叹惋。余人各复延至其家，皆出酒食。停数日，辞去。此中人语云：“不足为外人道也。”既出，得其船，便扶向路，处处志之。及郡下，诣太守，说如此。太守即遣人随其往，寻向所志，遂迷，不复得路。南阳刘子骥，高尚士也，闻之，欣然规往。未果，寻病终。后遂无问津者。"], "hard": "缘（yuán）、缤纷（bīn fēn）、豁（huò）、俨（yǎn）、阡陌（qiān mò）、、髫（tiáo）、怡（yí）、要（yāo，通“邀”）、咸（xián）、邑（yì）、与（yǔ）、惋、（wǎn）、延（yán）、诣（yì）、骥（jì）、津（jīn）", "hardList": [{"zi": "缘", "py": "yuán"}, {"zi": "纷", "py": "bīn fēn"}, {"zi": "豁", "py": "huò"}, {"zi": "俨", "py": "yǎn"}, {"zi": "陌", "py": "qiān mò"}, {"zi": "髫", "py": "tiáo"}, {"zi": "怡", "py": "yí"}, {"zi": "要", "py": "yāo，通“邀”"}, {"zi": "咸", "py": "xián"}, {"zi": "邑", "py": "yì"}, {"zi": "与", "py": "yǔ"}, {"zi": "延", "py": "yán"}, {"zi": "诣", "py": "yì"}, {"zi": "骥", "py": "jì"}, {"zi": "津", "py": "jīn"}]}, {"id": 50, "slug": "xiaoshitan", "title": "小石潭记", "author": "唐·柳宗元", "type": "文言文", "panels": [{"v": "从小丘西行百二十步，隔篁竹，闻水声，如鸣珮环，心乐之", "s": "从小丘向西行走，隔着竹林听见水声，像玉珮玉环相互碰击般清脆，心中欢喜", "img": "images/recitation-comics/xiaoshitan-c1.webp", "no": "①"}, {"v": "全石以为底，卷石底以出，为坻，为屿，为嵁，为岩。青树翠蔓，蒙络摇缀，参差披拂", "s": "小潭以整块石头为底，石底翻卷出水面成为坻屿嵁岩，青葱的树木翠绿的藤蔓蒙盖缠绕摇曳参差", "img": "images/recitation-comics/xiaoshitan-c2.webp", "no": "②"}, {"v": "潭中鱼可百许头，皆若空游无所依。日光下澈，影布石上", "s": "潭中约有一百来条鱼，都好像在空中游动没有依托，阳光直射潭底鱼的影子映在石上", "img": "images/recitation-comics/xiaoshitan-c3.webp", "no": "③"}, {"v": "四面竹树环合，寂寥无人，凄神寒骨，悄怆幽邃", "s": "坐在潭上四面竹树环抱，寂静寥落没有旁人，寒气透骨幽静深邃，令人心生凄凉", "img": "images/recitation-comics/xiaoshitan-c4.webp", "no": "④"}], "py": {"c": {"篁": "huáng", "珮": "pèi", "冽": "liè", "坻": "chí", "嵁": "kān", "蔓": "màn", "络": "luò", "缀": "zhuì", "佁": "yǐ", "俶": "chù", "翕": "xī", "寥": "liáo", "怆": "chuàng", "隶": "lì", "壹": "yī"}, "w": {}}, "paras": ["从小丘西行百二十步，隔篁竹，闻水声，如鸣珮环，心乐之。伐竹取道，下见小潭，水尤清冽。全石以为底，近岸，卷石底以出，为坻，为屿，为嵁，为岩。青树翠蔓，蒙络摇缀，参差披拂。潭中鱼可百许头，皆若空游无所依。日光下澈，影布石上，佁然不动；俶尔远逝，往来翕忽。似与游者相乐。潭西南而望，斗折蛇行，明灭可见。其岸势犬牙差互，不可知其源。坐潭上，四面竹树环合，寂寥无人，凄神寒骨，悄怆幽邃。以其境过清，不可久居，乃记之而去。", "同游者：吴武陵，龚古，余弟宗玄。隶而从者，崔氏二小生，曰恕己，曰奉壹。"], "hard": "篁（huáng）、珮（pèi）、冽（liè）、坻（chí）、嵁（kān）、蔓（màn）、、络（luò）、缀（zhuì）、佁（yǐ）、俶（chù）、翕（xī）、寥（liáo）、怆（chuàng）、邃、（suì）、隶（lì）、壹（yī）", "hardList": [{"zi": "篁", "py": "huáng"}, {"zi": "珮", "py": "pèi"}, {"zi": "冽", "py": "liè"}, {"zi": "坻", "py": "chí"}, {"zi": "嵁", "py": "kān"}, {"zi": "蔓", "py": "màn"}, {"zi": "络", "py": "luò"}, {"zi": "缀", "py": "zhuì"}, {"zi": "佁", "py": "yǐ"}, {"zi": "俶", "py": "chù"}, {"zi": "翕", "py": "xī"}, {"zi": "寥", "py": "liáo"}, {"zi": "怆", "py": "chuàng"}, {"zi": "隶", "py": "lì"}, {"zi": "壹", "py": "yī"}]}, {"id": 51, "slug": "hezhouji", "title": "核舟记", "author": "明·魏学洢", "type": "文言文", "panels": [{"v": "明有奇巧人曰王叔远，能以径寸之木，为宫室、器皿、人物，罔不因势象形，各具情态", "s": "明代奇巧匠人王叔远，能用直径一寸的木头雕刻宫室器皿人物，无不因势象形各具情态", "img": "images/recitation-comics/hezhouji-c1.webp", "no": "①"}, {"v": "尝贻余核舟一，盖大苏泛赤壁云", "s": "他曾赠送一枚核舟，刻的正是苏东坡泛舟游赤壁的场景，舟身小巧而气象万千", "img": "images/recitation-comics/hezhouji-c2.webp", "no": "②"}, {"v": "船头坐三人，中峨冠而多髯者为东坡，佛印居右，鲁直居左。苏、黄共阅一手卷", "s": "船头坐着三人，中间峨冠多髯的是东坡，佛印在右鲁直在左，苏黄二人共览一卷书画", "img": "images/recitation-comics/hezhouji-c3.webp", "no": "③"}, {"v": "佛印绝类弥勒，袒胸露乳，矫首昂视，神情与苏、黄不属", "s": "佛印极像弥勒佛，敞开胸怀露出双乳，抬头仰望，神情悠然与苏黄二人不同", "img": "images/recitation-comics/hezhouji-c4.webp", "no": "④"}], "py": {"c": {"洢": "yī", "皿": "mǐn", "罔": "wǎng", "贻": "yí", "有": "yǒu", "轩": "xuān", "箬": "ruò", "篷": "péng", "糁": "sǎn", "髯": "rán", "褶": "zhě", "袒": "tǎn", "矫": "jiǎo", "诎": "qū"}, "w": {}}, "paras": ["（节选）明有奇巧人曰王叔远，能以径寸之木，为宫室、器皿、人物，以至鸟兽、木石，罔不因势象形，各具情态。尝贻余核舟一，盖大苏泛赤壁云。舟首尾长约八分有奇，高可二黍许。中轩敞者为舱，箬篷覆之。旁开小窗，左右各四，共八扇。启窗而观，雕栏相望焉。闭之，则右刻“山高月小，水落石出”，左刻“清风徐来，水波不兴”，石青糁之。船头坐三人，中峨冠而多髯者为东坡，佛印居右，鲁直居左。苏、黄共阅一手卷。东坡右手执卷端，左手抚鲁直背。鲁直左手执卷末，右手指卷，如有所语。东坡现右足，鲁直现左足，各微侧，其两膝相比者，各隐卷底衣褶中。佛印绝类弥勒，袒胸露乳，矫首昂视，神情与苏、黄不属。卧右膝，诎右臂支船，而竖其左膝，左臂挂念珠倚之——珠可历历数也。"], "hard": "洢（yī）、皿（mǐn）、罔（wǎng）、贻（yí）、有（yòu，通“又”）、黍、（shǔ）、轩（xuān）、箬（ruò）、篷（péng）、糁（sǎn）、髯（rán）、褶（zhě）、弥、（mí）、袒（tǎn）、矫（jiǎo）、诎（qū）", "hardList": [{"zi": "洢", "py": "yī"}, {"zi": "皿", "py": "mǐn"}, {"zi": "罔", "py": "wǎng"}, {"zi": "贻", "py": "yí"}, {"zi": "有", "py": "yòu，通“又”"}, {"zi": "轩", "py": "xuān"}, {"zi": "箬", "py": "ruò"}, {"zi": "篷", "py": "péng"}, {"zi": "糁", "py": "sǎn"}, {"zi": "髯", "py": "rán"}, {"zi": "褶", "py": "zhě"}, {"zi": "袒", "py": "tǎn"}, {"zi": "矫", "py": "jiǎo"}, {"zi": "诎", "py": "qū"}]}, {"id": 52, "slug": "beimingyouyu", "title": "北冥有鱼", "author": "《庄子》", "type": "文言文", "panels": [{"v": "北冥有鱼，其名为鲲。鲲之大，不知其几千里也", "s": "北方的大海里有一条鱼，名叫鲲，鲲的巨大不知道有几千里", "img": "images/recitation-comics/beimingyouyu-c1.webp", "no": "①"}, {"v": "化而为鸟，其名为鹏。鹏之背，不知其几千里也", "s": "鲲变化成鸟名叫鹏，鹏的背脊也不知道有几千里，遮天蔽日", "img": "images/recitation-comics/beimingyouyu-c2.webp", "no": "②"}, {"v": "怒而飞，其翼若垂天之云", "s": "大鹏振翅奋飞，那展开的双翅就像悬挂在天空的云", "img": "images/recitation-comics/beimingyouyu-c3.webp", "no": "③"}, {"v": "水击三千里，抟扶摇而上者九万里", "s": "鹏鸟起飞时水面激起三千里波涛，乘着旋风盘旋直上九万里高空", "img": "images/recitation-comics/beimingyouyu-c4.webp", "no": "④"}], "py": {"c": {"冥": "míng", "鲲": "kūn", "鹏": "péng", "徙": "xǐ", "谐": "xié", "抟": "tuán", "邪": "yé"}, "w": {}}, "paras": ["北冥有鱼，其名为鲲。鲲之大，不知其几千里也；化而为鸟，其名为鹏。鹏之背，不知其几千里也；怒而飞，其翼若垂天之云。是鸟也，海运则将徙于南冥。南冥者，天池也。《齐谐》者，志怪者也。《谐》之言曰：“鹏之徙于南冥也，水击三千里，抟扶摇而上者九万里，去以六月息者也。”野马也，尘埃也，生物之以息相吹也。天之苍苍，其正色邪？其远而无所至极邪？其视下也，亦若是则已矣。"], "hard": "冥（míng）、鲲（kūn）、鹏（péng）、徙（xǐ）、谐（xié）、抟（tuán）、、邪（yé）", "hardList": [{"zi": "冥", "py": "míng"}, {"zi": "鲲", "py": "kūn"}, {"zi": "鹏", "py": "péng"}, {"zi": "徙", "py": "xǐ"}, {"zi": "谐", "py": "xié"}, {"zi": "抟", "py": "tuán"}, {"zi": "邪", "py": "yé"}]}, {"id": 53, "slug": "suiyoujiaoyao", "title": "虽有嘉肴", "author": "《礼记》", "type": "文言文", "panels": [{"v": "虽有嘉肴，弗食，不知其旨也；虽有至道，弗学，不知其善也", "s": "即使有美味佳肴不吃就不知道它的甘美，即使有最好的道理不学就不知道它的好处", "img": "images/recitation-comics/suiyoujiaoyao-c1.webp", "no": "①"}, {"v": "学然后知不足，教然后知困", "s": "深入学习之后才知道自己的不足，教导别人之后才知道自己还有困惑", "img": "images/recitation-comics/suiyoujiaoyao-c2.webp", "no": "②"}, {"v": "知不足，然后能自反也；知困，然后能自强也", "s": "知道不足然后才能自我反省，知道困惑然后才能自我勉励", "img": "images/recitation-comics/suiyoujiaoyao-c3.webp", "no": "③"}, {"v": "故曰：教学相长也", "s": "所以教与学是互相推动互相促进的，师者与弟子各有所得", "img": "images/recitation-comics/suiyoujiaoyao-c4.webp", "no": "④"}], "py": {"c": {"肴": "yáo", "弗": "fú", "旨": "zhǐ", "兑": "yuè", "学": "xué"}, "w": {"教学相长": "jiào xiào xiāng zhǎng"}}, "paras": ["虽有嘉肴，弗食，不知其旨也；虽有至道，弗学，不知其善也。是故学然后知不足，教然后知困。知不足，然后能自反也；知困，然后能自强也。故曰：教学相长也。《兑命》曰：“学学半。”其此之谓乎！"], "hard": "肴（yáo）、弗（fú）、旨（zhǐ）、兑（yuè，通“说”）、学（xiào，通、“敩”，教导）", "hardList": [{"zi": "肴", "py": "yáo"}, {"zi": "弗", "py": "fú"}, {"zi": "旨", "py": "zhǐ"}, {"zi": "兑", "py": "yuè，通“说”"}, {"zi": "学", "py": "xiào，通、“敩”，教导"}]}, {"id": 54, "slug": "mashuo", "title": "马说", "author": "唐·韩愈", "type": "文言文", "panels": [{"v": "世有伯乐，然后有千里马。千里马常有，而伯乐不常有", "s": "世上先有伯乐然后才有千里马，千里马经常有，可是伯乐却不常有", "img": "images/recitation-comics/mashuo-c1.webp", "no": "①"}, {"v": "祗辱于奴隶人之手，骈死于槽枥之间", "s": "名马屈辱地在马夫手中受役使，和普通马一起死在马厩里，日行千里之才终被埋没", "img": "images/recitation-comics/mashuo-c2.webp", "no": "②"}, {"v": "食不饱，力不足，才美不外见", "s": "吃不饱力气不足，卓越的才能和优良的素质无法表现在外", "img": "images/recitation-comics/mashuo-c3.webp", "no": "③"}, {"v": "执策而临之，曰：天下无马！呜呼！其真不知马也", "s": "马夫手执马鞭走到马前却说天下没有好马，唉！哪里是真的没有马，只是不识马罢了", "img": "images/recitation-comics/mashuo-c4.webp", "no": "④"}], "py": {"c": {"祗": "zhǐ", "骈": "pián", "枥": "lì", "粟": "sù", "食": "shí", "见": "xiàn", "邪": "yé"}, "w": {}}, "paras": ["世有伯乐，然后有千里马。千里马常有，而伯乐不常有。故虽有名马，祗辱于奴隶人之手，骈死于槽枥之间，不以千里称也。马之千里者，一食或尽粟一石。食马者不知其能千里而食也。是马也，虽有千里之能，食不饱，力不足，才美不外见，且欲与常马等不可得，安求其能千里也？策之不以其道，食之不能尽其材，鸣之而不能通其意，执策而临之，曰：“天下无马！”呜呼！其真无马邪？其真不知马也！"], "hard": "祗（zhǐ）、骈（pián）、槽枥（cáo lì）、粟（sù）、食（sì，通、“饲”）、见（xiàn，通“现”）、邪（yé）", "hardList": [{"zi": "祗", "py": "zhǐ"}, {"zi": "骈", "py": "pián"}, {"zi": "枥", "py": "cáo lì"}, {"zi": "粟", "py": "sù"}, {"zi": "食", "py": "sì，通、“饲”"}, {"zi": "见", "py": "xiàn，通“现”"}, {"zi": "邪", "py": "yé"}]}, {"id": 55, "slug": "maowu", "title": "茅屋为秋风所破歌", "author": "唐·杜甫", "type": "古诗", "panels": [{"v": "八月秋高风怒号，卷我屋上三重茅", "s": "八月秋深狂风怒号，卷走了屋顶上好几层茅草，草飞过江洒落江郊", "img": "images/recitation-comics/maowu-c1.webp", "no": "①"}, {"v": "南村群童欺我老无力，公然抱茅入竹去", "s": "南村的孩童欺负老人无力，当面把茅草抱进竹林，老人唇焦口燥呼喊不得，归来拄杖独自叹息", "img": "images/recitation-comics/maowu-c2.webp", "no": "②"}, {"v": "床头屋漏无干处，雨脚如麻未断绝", "s": "长夜屋漏床头没有一点干处，雨点像麻线一样密集不停，布衾冷硬娇儿踏裂", "img": "images/recitation-comics/maowu-c3.webp", "no": "③"}, {"v": "安得广厦千万间，大庇天下寒士俱欢颜！吾庐独破受冻死亦足", "s": "风雨中诗人遥想广厦千万间庇护天下寒士，哪怕自己的茅屋独破受冻而死也心甘情愿", "img": "images/recitation-comics/maowu-c4.webp", "no": "④"}], "py": {"c": {"号": "háo", "罥": "juàn", "坳": "ào", "燥": "zào", "衾": "qīn", "厦": "shà", "兀": "wù", "见": "xiàn"}, "w": {}}, "paras": ["八月秋高风怒号，卷我屋上三重茅。茅飞渡江洒江郊，高者挂罥长林梢，下者飘转沉塘坳。南村群童欺我老无力，忍能对面为盗贼。公然抱茅入竹去，唇焦口燥呼不得，归来倚杖自叹息。俄顷风定云墨色，秋天漠漠向昏黑。布衾多年冷似铁，娇儿恶卧踏里裂。床头屋漏无干处，雨脚如麻未断绝。自经丧乱少睡眠，长夜沾湿何由彻！安得广厦千万间，大庇天下寒士俱欢颜！风雨不动安如山。呜呼！何时眼前突兀见此屋，吾庐独破受冻死亦足！"], "hard": "号（háo）、罥（juàn）、坳（ào）、燥（zào）、衾（qīn）、厦（shà）、庇、（bì）、突兀（tū wù）、见（xiàn，通“现”）", "hardList": [{"zi": "号", "py": "háo"}, {"zi": "罥", "py": "juàn"}, {"zi": "坳", "py": "ào"}, {"zi": "燥", "py": "zào"}, {"zi": "衾", "py": "qīn"}, {"zi": "厦", "py": "shà"}, {"zi": "兀", "py": "tū wù"}, {"zi": "见", "py": "xiàn，通“现”"}]}, {"id": 56, "slug": "maitanweng", "title": "卖炭翁", "author": "唐·白居易", "type": "古诗", "panels": [{"v": "卖炭翁，伐薪烧炭南山中。满面尘灰烟火色，两鬓苍苍十指黑", "s": "卖炭翁在终南山里伐木烧炭，满面尘灰烟熏火燎之色，两鬓花白十指乌黑", "img": "images/recitation-comics/maitanweng-c1.webp", "no": "①"}, {"v": "可怜身上衣正单，心忧炭贱愿天寒", "s": "可怜他身上衣衫单薄，心里却担忧炭价便宜，宁愿天气更冷些", "img": "images/recitation-comics/maitanweng-c2.webp", "no": "②"}, {"v": "夜来城外一尺雪，晓驾炭车辗冰辙。牛困人饥日已高，市南门外泥中歇", "s": "夜里城外下了一尺厚的雪，清晨驾着炭车碾过冰辙进城，牛困人饥日头已高，在市南门外泥泞中歇脚", "img": "images/recitation-comics/maitanweng-c3.webp", "no": "③"}, {"v": "翩翩两骑来是谁？手把文书口称敕，半匹红纱一丈绫，系向牛头充炭直", "s": "两个骑马的人轻快而来，手拿文书口称皇帝命令，调转车头吆喝着牛往北拉去，一车千余斤的炭只换来半匹红纱一丈绫系在牛头上", "img": "images/recitation-comics/maitanweng-c4.webp", "no": "④"}], "py": {"c": {"翁": "wēng", "鬓": "bìn", "辗": "niǎn", "辙": "zhé", "翩": "piān", "叱": "chì", "绫": "líng", "直": "zhí"}, "w": {}}, "paras": ["卖炭翁，伐薪烧炭南山中。满面尘灰烟火色，两鬓苍苍十指黑。卖炭得钱何所营？身上衣裳口中食。可怜身上衣正单，心忧炭贱愿天寒。夜来城外一尺雪，晓驾炭车辗冰辙。牛困人饥日已高，市南门外泥中歇。翩翩两骑来是谁？黄衣使者白衫儿。手把文书口称敕，回车叱牛牵向北。一车炭，千余斤，宫使驱将惜不得。半匹红纱一丈绫，系向牛头充炭直。"], "hard": "翁（wēng）、鬓（bìn）、辗（niǎn）、辙（zhé）、翩（piān）、敕、（chì）、叱（chì）、绫（líng）、直（zhí，通“值”）", "hardList": [{"zi": "翁", "py": "wēng"}, {"zi": "鬓", "py": "bìn"}, {"zi": "辗", "py": "niǎn"}, {"zi": "辙", "py": "zhé"}, {"zi": "翩", "py": "piān"}, {"zi": "叱", "py": "chì"}, {"zi": "绫", "py": "líng"}, {"zi": "直", "py": "zhí，通“值”"}]}, {"id": 57, "slug": "tiposhansi", "title": "题破山寺后禅院", "author": "唐·常建", "type": "古诗", "panels": [{"v": "清晨入古寺，初日照高林", "s": "清晨走进古老寺院，初升的太阳照耀着高高的山林", "img": "images/recitation-comics/tiposhansi-c1.webp", "no": "①"}, {"v": "曲径通幽处，禅房花木深", "s": "一条曲折的小路通向幽静的深处，禅房就掩映在繁茂花木深处", "img": "images/recitation-comics/tiposhansi-c2.webp", "no": "②"}, {"v": "山光悦鸟性，潭影空人心", "s": "山光明媚使飞鸟更加欢悦，潭水空明清澈涤荡心中的尘念", "img": "images/recitation-comics/tiposhansi-c3.webp", "no": "③"}, {"v": "万籁此都寂，但余钟磬音", "s": "此时此刻万物都沉默静寂，只留下敲钟击磬的悠悠清音", "img": "images/recitation-comics/tiposhansi-c4.webp", "no": "④"}], "py": {"c": {"禅": "chán", "籁": "lài", "磬": "qìng"}, "w": {}}, "paras": ["清晨入古寺，初日照高林。曲径通幽处，禅房花木深。山光悦鸟性，潭影空人心。万籁此都寂，但余钟磬音。"], "hard": "禅（chán）、籁（lài）、磬（qìng）", "hardList": [{"zi": "禅", "py": "chán"}, {"zi": "籁", "py": "lài"}, {"zi": "磬", "py": "qìng"}]}, {"id": 58, "slug": "songyouren", "title": "送友人", "author": "唐·李白", "type": "古诗", "panels": [{"v": "青山横北郭，白水绕东城", "s": "青翠的山峦横卧在城北，波光粼粼的流水绕过东城", "img": "images/recitation-comics/songyouren-c1.webp", "no": "①"}, {"v": "此地一为别，孤蓬万里征", "s": "在此地一分别，友人就像孤飞的蓬草踏上万里征程", "img": "images/recitation-comics/songyouren-c2.webp", "no": "②"}, {"v": "浮云游子意，落日故人情", "s": "天边浮云仿佛游子行踪不定，缓缓下落的夕阳依依不舍像老友惜别之情", "img": "images/recitation-comics/songyouren-c3.webp", "no": "③"}, {"v": "挥手自兹去，萧萧班马鸣", "s": "挥手告别从此离去，连马儿也萧萧长鸣似不忍分离", "img": "images/recitation-comics/songyouren-c4.webp", "no": "④"}], "py": {"c": {"郭": "guō", "蓬": "péng", "兹": "zī", "萧": "xiāo", "班": "bān"}, "w": {}}, "paras": ["青山横北郭，白水绕东城。此地一为别，孤蓬万里征。浮云游子意，落日故人情。挥手自兹去，萧萧班马鸣。"], "hard": "郭（guō）、蓬（péng）、兹（zī）、萧（xiāo）、班（bān）", "hardList": [{"zi": "郭", "py": "guō"}, {"zi": "蓬", "py": "péng"}, {"zi": "兹", "py": "zī"}, {"zi": "萧", "py": "xiāo"}, {"zi": "班", "py": "bān"}]}, {"id": 59, "slug": "busuanzi", "title": "卜算子·咏梅", "author": "宋·陆游", "type": "词", "panels": [{"v": "驿外断桥边，寂寞开无主", "s": "驿站之外的断桥旁边，一树梅花寂寞地开放无人照管", "img": "images/recitation-comics/busuanzi-c1.webp", "no": "①"}, {"v": "已是黄昏独自愁，更著风和雨", "s": "黄昏时分独自发愁，又遭到风吹雨打的摧残", "img": "images/recitation-comics/busuanzi-c2.webp", "no": "②"}, {"v": "无意苦争春，一任群芳妒", "s": "无意苦苦争抢春光，任凭百花嫉妒轻视", "img": "images/recitation-comics/busuanzi-c3.webp", "no": "③"}, {"v": "零落成泥碾作尘，只有香如故", "s": "花瓣零落凋残被碾作尘土，唯有那缕清香依旧如故", "img": "images/recitation-comics/busuanzi-c4.webp", "no": "④"}], "py": {"c": {"驿": "yì", "著": "zhuó", "妒": "dù", "碾": "niǎn"}, "w": {}}, "paras": ["驿外断桥边，寂寞开无主。已是黄昏独自愁，更著风和雨。无意苦争春，一任群芳妒。零落成泥碾作尘，只有香如故。"], "hard": "驿（yì）、著（zhuó）、妒（dù）、碾（niǎn）", "hardList": [{"zi": "驿", "py": "yì"}, {"zi": "著", "py": "zhuó"}, {"zi": "妒", "py": "dù"}, {"zi": "碾", "py": "niǎn"}]}]}, {"vol": "九年级（上册）", "color": "#7C3AED", "items": [{"id": 60, "slug": "qinyuanchun", "title": "沁园春·雪", "author": "毛泽东", "type": "词", "panels": [{"v": "北国风光，千里冰封，万里雪飘", "s": "北国大地千里冰封，万里长空雪花飞舞，一派苍茫壮阔", "img": "images/recitation-comics/qinyuanchun-c1.webp", "no": "①"}, {"v": "山舞银蛇，原驰蜡象，欲与天公试比高", "s": "群山像银蛇舞动，高原如白象奔驰，仿佛要与苍天一比高低", "img": "images/recitation-comics/qinyuanchun-c2.webp", "no": "②"}, {"v": "江山如此多娇，引无数英雄竞折腰", "s": "江山如此壮美多娇，引得古往今来无数英雄为之倾倒", "img": "images/recitation-comics/qinyuanchun-c3.webp", "no": "③"}, {"v": "数风流人物，还看今朝", "s": "秦皇汉武唐宗宋祖皆成过往，真正的风流人物还看今朝", "img": "images/recitation-comics/qinyuanchun-c4.webp", "no": "④"}], "py": {"c": {"莽": "mǎng", "滔": "tāo", "娆": "ráo", "娇": "jiāo", "逊": "xùn", "骚": "sāo", "骄": "jiāo", "汗": "hán", "雕": "diāo", "俱": "jù"}, "w": {}}, "paras": ["北国风光，千里冰封，万里雪飘。望长城内外，惟余莽莽；大河上下，顿失滔滔。山舞银蛇，原驰蜡象，欲与天公试比高。须晴日，看红装素裹，分外妖娆。江山如此多娇，引无数英雄竞折腰。惜秦皇汉武，略输文采；唐宗宋祖，稍逊风骚。一代天骄，成吉思汗，只识弯弓射大雕。俱往矣，数风流人物，还看今朝。"], "hard": "莽（mǎng）、滔（tāo）、娆（ráo）、娇（jiāo）、逊（xùn）、骚（sāo）、、骄（jiāo）、汗（hán）、雕（diāo）、俱（jù）", "hardList": [{"zi": "莽", "py": "mǎng"}, {"zi": "滔", "py": "tāo"}, {"zi": "娆", "py": "ráo"}, {"zi": "娇", "py": "jiāo"}, {"zi": "逊", "py": "xùn"}, {"zi": "骚", "py": "sāo"}, {"zi": "骄", "py": "jiāo"}, {"zi": "汗", "py": "hán"}, {"zi": "雕", "py": "diāo"}, {"zi": "俱", "py": "jù"}]}, {"id": 61, "slug": "yueyanglou", "title": "岳阳楼记", "author": "宋·范仲淹", "type": "文言文", "panels": [{"v": "衔远山，吞长江，浩浩汤汤，横无际涯；朝晖夕阴，气象万千", "s": "洞庭湖衔着远山吞着长江，浩浩荡荡无边无际，清晨湖面洒满阳光傍晚又是一片昏暗，气象变化万千", "img": "images/recitation-comics/yueyanglou-c1.webp", "no": "①"}, {"v": "霪雨霏霏，连月不开；日星隐耀，山岳潜形；薄暮冥冥，虎啸猿啼", "s": "连月阴雨绵绵不晴，日星失去光辉山岳隐没形迹，天色昏暗暮霭沉沉，虎啸猿啼令人满目萧然感极而悲", "img": "images/recitation-comics/yueyanglou-c2.webp", "no": "②"}, {"v": "春和景明，波澜不惊；沙鸥翔集，锦鳞游泳；皓月千里，静影沉璧", "s": "春风和煦阳光明媚，湖面平静沙鸥飞翔锦鳞游泳，皓月千里浮光闪着金色，静静的月影如沉入水中的玉璧", "img": "images/recitation-comics/yueyanglou-c3.webp", "no": "③"}, {"v": "先天下之忧而忧，后天下之乐而乐", "s": "岳阳楼上把酒临风，古仁人不以物喜不以己悲，先于天下人忧忧后于天下人乐乐", "img": "images/recitation-comics/yueyanglou-c4.webp", "no": "④"}], "py": {"c": {"谪": "zhé", "具": "jù", "属": "zhǔ", "汤": "shāng", "晖": "huī", "潇": "xiāo", "骚": "sāo", "霪": "yín", "号": "háo", "耀": "yào", "楫": "jí", "冥": "míng", "谗": "chán", "讥": "jī", "顷": "qǐng", "芷": "zhǐ", "偕": "xié", "嗟": "jiē", "噫": "yī"}, "w": {}}, "paras": ["庆历四年春，滕子京谪守巴陵郡。越明年，政通人和，百废具兴。乃重修岳阳楼，增其旧制，刻唐贤今人诗赋于其上。属予作文以记之。予观夫巴陵胜状，在洞庭一湖。衔远山，吞长江，浩浩汤汤，横无际涯；朝晖夕阴，气象万千。此则岳阳楼之大观也，前人之述备矣。然则北通巫峡，南极潇湘，迁客骚人，多会于此，览物之情，得无异乎？若夫霪雨霏霏，连月不开，阴风怒号，浊浪排空；日星隐耀，山岳潜形；商旅不行，樯倾楫摧；薄暮冥冥，虎啸猿啼。登斯楼也，则有去国怀乡，忧谗畏讥，满目萧然，感极而悲者矣。至若春和景明，波澜不惊，上下天光，一碧万顷；沙鸥翔集，锦鳞游泳；岸芷汀兰，郁郁青青。而或长烟一空，皓月千里，浮光跃金，静影沉璧，渔歌互答，此乐何极！登斯楼也，则有心旷神怡，宠辱偕忘，把酒临风，其喜洋洋者矣。嗟夫！予尝求古仁人之心，或异二者之为，何哉？不以物喜，不以己悲。居庙堂之高则忧其民，处江湖之远则忧其君。是进亦忧，退亦忧。然则何时而乐耶？其必曰“先天下之忧而忧，后天下之乐而乐”乎！噫！微斯人，吾谁与归？时六年九月十五日。"], "hard": "谪（zhé）、具（jù，通“俱”）、属（zhǔ，通“嘱”）、汤（shāng）、涯、（yá）、晖（huī）、潇（xiāo）、骚（sāo）、霪（yín）、号（háo）、耀（yào）、樯、（qiáng）、楫（jí）、冥（míng）、谗（chán）、讥（jī）、顷（qǐng）、芷（zhǐ）、汀、（tīng）、偕（xié）、嗟（jiē）、噫（yī）", "hardList": [{"zi": "谪", "py": "zhé"}, {"zi": "具", "py": "jù，通“俱”"}, {"zi": "属", "py": "zhǔ，通“嘱”"}, {"zi": "汤", "py": "shāng"}, {"zi": "晖", "py": "huī"}, {"zi": "潇", "py": "xiāo"}, {"zi": "骚", "py": "sāo"}, {"zi": "霪", "py": "yín"}, {"zi": "号", "py": "háo"}, {"zi": "耀", "py": "yào"}, {"zi": "楫", "py": "jí"}, {"zi": "冥", "py": "míng"}, {"zi": "谗", "py": "chán"}, {"zi": "讥", "py": "jī"}, {"zi": "顷", "py": "qǐng"}, {"zi": "芷", "py": "zhǐ"}, {"zi": "偕", "py": "xié"}, {"zi": "嗟", "py": "jiē"}, {"zi": "噫", "py": "yī"}]}, {"id": 62, "slug": "zuiwengting", "title": "醉翁亭记", "author": "宋·欧阳修", "type": "文言文", "panels": [{"v": "环滁皆山也。其西南诸峰，林壑尤美，望之蔚然而深秀者，琅琊也", "s": "滁州四面环山，西南诸峰树林山谷格外秀美，草木茂盛幽深秀丽的那座便是琅琊山", "img": "images/recitation-comics/zuiwengting-c1.webp", "no": "①"}, {"v": "峰回路转，有亭翼然临于泉上者，醉翁亭也", "s": "山势回环路随峰转，有一座亭子四角翘起像鸟儿展翅一样飞架在泉上，那便是醉翁亭", "img": "images/recitation-comics/zuiwengting-c2.webp", "no": "②"}, {"v": "若夫日出而林霏开，云归而岩穴暝，晦明变化者，山间之朝暮也", "s": "太阳出来林间雾气散开，云雾归山岩谷昏暗，这明暗交替的便是山间的清晨与傍晚", "img": "images/recitation-comics/zuiwengting-c3.webp", "no": "③"}, {"v": "临溪而渔，溪深而鱼肥；酿泉为酒，泉香而酒洌；觥筹交错，起坐而喧哗者，众宾欢也", "s": "太守宴上临溪捕鱼溪深鱼肥，用酿泉的水造酒泉香酒清，宴中觥筹交错宾客起坐喧哗，苍颜白发的太守颓然醉倒其间", "img": "images/recitation-comics/zuiwengting-c4.webp", "no": "④"}], "py": {"c": {"滁": "chú", "壑": "hè", "蔚": "wèi", "琊": "yá", "潺": "chán", "霏": "fēi", "暝": "míng", "偻": "lǚ", "洌": "liè", "蔌": "sù", "弈": "yì", "筹": "chóu", "颓": "tuí", "翳": "yì", "庐": "lú"}, "w": {}}, "paras": ["环滁皆山也。其西南诸峰，林壑尤美，望之蔚然而深秀者，琅琊也。山行六七里，渐闻水声潺潺，而泻出于两峰之间者，酿泉也。峰回路转，有亭翼然临于泉上者，醉翁亭也。作亭者谁？山之僧智仙也。名之者谁？太守自谓也。太守与客来饮于此，饮少辄醉，而年又最高，故自号曰醉翁也。醉翁之意不在酒，在乎山水之间也。山水之乐，得之心而寓之酒也。若夫日出而林霏开，云归而岩穴暝，晦明变化者，山间之朝暮也。野芳发而幽香，佳木秀而繁阴，风霜高洁，水落而石出者，山间之四时也。朝而往，暮而归，四时之景不同，而乐亦无穷也。至于负者歌于途，行者休于树，前者呼，后者应，伛偻提携，往来而不绝者，滁人游也。临溪而渔，溪深而鱼肥；酿泉为酒，泉香而酒洌；山肴野蔌，杂然而前陈者，太守宴也。宴酣之乐，非丝非竹，射者中，弈者胜，觥筹交错，起坐而喧哗者，众宾欢也。苍颜白发，颓然乎其间者，太守醉也。已而夕阳在山，人影散乱，太守归而宾客从也。树林阴翳，鸣声上下，游人去而禽鸟乐也。然而禽鸟知山林之乐，而不知人之乐；人知从太守游而乐，而不知太守之乐其乐也。醉能同其乐，醒能述以文者，太守也。太守谓谁？庐陵欧阳修也。"], "hard": "滁（chú）、壑（hè）、蔚（wèi）、琅琊（láng yá）、潺（chán）、辄、（zhé）、霏（fēi）、暝（míng）、伛偻（yǔ lǚ）、洌（liè）、蔌（sù）、弈（yì）、觥、（gōng）、筹（chóu）、颓（tuí）、翳（yì）、庐（lú）", "hardList": [{"zi": "滁", "py": "chú"}, {"zi": "壑", "py": "hè"}, {"zi": "蔚", "py": "wèi"}, {"zi": "琊", "py": "láng yá"}, {"zi": "潺", "py": "chán"}, {"zi": "霏", "py": "fēi"}, {"zi": "暝", "py": "míng"}, {"zi": "偻", "py": "yǔ lǚ"}, {"zi": "洌", "py": "liè"}, {"zi": "蔌", "py": "sù"}, {"zi": "弈", "py": "yì"}, {"zi": "筹", "py": "chóu"}, {"zi": "颓", "py": "tuí"}, {"zi": "翳", "py": "yì"}, {"zi": "庐", "py": "lú"}]}, {"id": 63, "slug": "huxinting", "title": "湖心亭看雪", "author": "明·张岱", "type": "文言文", "panels": [{"v": "大雪三日，湖中人鸟声俱绝", "s": "西湖大雪连下三日，湖中行人飞鸟的声音都消失了，天地一片寂静", "img": "images/recitation-comics/huxinting-c1.webp", "no": "①"}, {"v": "余拏一小舟，拥毳衣炉火，独往湖心亭看雪", "s": "更定之后作者撑一叶小舟，裹着毛皮衣拥着炉火，独自前往湖心亭看雪", "img": "images/recitation-comics/huxinting-c2.webp", "no": "②"}, {"v": "雾凇沆砀，天与云与山与水，上下一白。湖上影子，惟长堤一痕、湖心亭一点、与余舟一芥、舟中人两三粒而已", "s": "湖面冰花周围弥漫白气，天与云与山与水浑然一体上下一白，湖上只有长堤一道痕迹湖心亭一点，与一叶小舟舟中两三粒人影", "img": "images/recitation-comics/huxinting-c3.webp", "no": "③"}, {"v": "湖中焉得更有此人！余强饮三大白而别", "s": "亭上竟有两人铺毡对坐备好了酒，见了作者大喜，拉着同饮，作者强饮三大杯后作别", "img": "images/recitation-comics/huxinting-c4.webp", "no": "④"}], "py": {"c": {"岱": "dài", "祯": "zhēn", "拏": "ná", "毳": "cuì", "凇": "sōng", "芥": "jiè", "毡": "zhān", "强": "qiǎng", "喃": "nán", "痴": "chī"}, "w": {}}, "paras": ["崇祯五年十二月，余住西湖。大雪三日，湖中人鸟声俱绝。是日更定矣，余拏一小舟，拥毳衣炉火，独往湖心亭看雪。雾凇沆砀，天与云与山与水，上下一白。湖上影子，惟长堤一痕、湖心亭一点、与余舟一芥、舟中人两三粒而已。到亭上，有两人铺毡对坐，一童子烧酒炉正沸。见余大喜曰：“湖中焉得更有此人！”拉余同饮。余强饮三大白而别。问其姓氏，是金陵人，客此。及下船，舟子喃喃曰：“莫说相公痴，更有痴似相公者。”"], "hard": "岱（dài）、崇祯（chóng zhēn）、拏（ná）、毳（cuì）、凇（sōng）、沆砀、（hàng dàng）、芥（jiè）、毡（zhān）、强（qiǎng）、喃（nán）、痴（chī）", "hardList": [{"zi": "岱", "py": "dài"}, {"zi": "祯", "py": "chóng zhēn"}, {"zi": "拏", "py": "ná"}, {"zi": "毳", "py": "cuì"}, {"zi": "凇", "py": "sōng"}, {"zi": "芥", "py": "jiè"}, {"zi": "毡", "py": "zhān"}, {"zi": "强", "py": "qiǎng"}, {"zi": "喃", "py": "nán"}, {"zi": "痴", "py": "chī"}]}, {"id": 64, "slug": "xinglunan", "title": "行路难（其一）", "author": "唐·李白", "type": "古诗", "panels": [{"v": "金樽清酒斗十千，玉盘珍羞直万钱。停杯投箸不能食", "s": "金杯美酒一斗值十千，玉盘菜肴珍贵值万钱，诗人却放下杯子扔开筷子吃不下去", "img": "images/recitation-comics/xinglunan-c1.webp", "no": "①"}, {"v": "欲渡黄河冰塞川，将登太行雪满山", "s": "想渡黄河冰雪堵塞了河道，想登太行大雪铺满了山路，前路艰难", "img": "images/recitation-comics/xinglunan-c2.webp", "no": "②"}, {"v": "闲来垂钓碧溪上，忽复乘舟梦日边", "s": "遥想姜太公碧溪垂钓终遇明主，伊尹乘舟梦见经过太阳，古贤终有大器晚成之时", "img": "images/recitation-comics/xinglunan-c3.webp", "no": "③"}, {"v": "长风破浪会有时，直挂云帆济沧海", "s": "扬起云帆立于船头，坚信总有一天能乘风破浪，横渡苍茫大海", "img": "images/recitation-comics/xinglunan-c4.webp", "no": "④"}], "py": {"c": {"樽": "zūn", "羞": "xiū", "直": "zhí", "箸": "zhù", "歧": "qí", "沧": "cāng"}, "w": {}}, "paras": ["金樽清酒斗十千，玉盘珍羞直万钱。停杯投箸不能食，拔剑四顾心茫然。欲渡黄河冰塞川，将登太行雪满山。闲来垂钓碧溪上，忽复乘舟梦日边。行路难，行路难，多歧路，今安在？长风破浪会有时，直挂云帆济沧海。"], "hard": "樽（zūn）、羞（xiū，通“馐”）、直（zhí，通“值”）、箸（zhù）、塞、（sè）、歧（qí）、沧（cāng）", "hardList": [{"zi": "樽", "py": "zūn"}, {"zi": "羞", "py": "xiū，通“馐”"}, {"zi": "直", "py": "zhí，通“值”"}, {"zi": "箸", "py": "zhù"}, {"zi": "歧", "py": "qí"}, {"zi": "沧", "py": "cāng"}]}, {"id": 65, "slug": "chouletian", "title": "酬乐天扬州初逢席上见赠", "author": "唐·刘禹锡", "type": "古诗", "panels": [{"v": "巴山楚水凄凉地，二十三年弃置身", "s": "被贬谪到巴山楚水这样凄凉的地方，度过了二十三年被弃置的岁月", "img": "images/recitation-comics/chouletian-c1.webp", "no": "①"}, {"v": "怀旧空吟闻笛赋，到乡翻似烂柯人", "s": "思念故友只能空吟闻笛赋，回到故乡恍如隔世恍若烂柯人", "img": "images/recitation-comics/chouletian-c2.webp", "no": "②"}, {"v": "沉舟侧畔千帆过，病树前头万木春", "s": "沉船旁边千帆竞相驶过，病树前面万木争春欣欣向荣，新事物必将取代旧事物", "img": "images/recitation-comics/chouletian-c3.webp", "no": "③"}, {"v": "今日听君歌一曲，暂凭杯酒长精神", "s": "今天听了你写的诗歌不胜感慨，暂且借着这杯酒振作精神", "img": "images/recitation-comics/chouletian-c4.webp", "no": "④"}], "py": {"c": {"酬": "chóu", "赋": "fù", "柯": "kē", "畔": "pàn", "暂": "zàn", "凭": "píng"}, "w": {}}, "paras": ["巴山楚水凄凉地，二十三年弃置身。怀旧空吟闻笛赋，到乡翻似烂柯人。沉舟侧畔千帆过，病树前头万木春。今日听君歌一曲，暂凭杯酒长精神。"], "hard": "酬（chóu）、赋（fù）、柯（kē）、畔（pàn）、暂（zàn）、凭（píng）", "hardList": [{"zi": "酬", "py": "chóu"}, {"zi": "赋", "py": "fù"}, {"zi": "柯", "py": "kē"}, {"zi": "畔", "py": "pàn"}, {"zi": "暂", "py": "zàn"}, {"zi": "凭", "py": "píng"}]}, {"id": 66, "slug": "shuidiaogetou", "title": "水调歌头（明月几时有）", "author": "宋·苏轼", "type": "词", "panels": [{"v": "明月几时有？把酒问青天", "s": "中秋月夜，诗人举杯遥问青天：明月是从什么时候开始有的？", "img": "images/recitation-comics/shuidiaogetou-c1.webp", "no": "①"}, {"v": "我欲乘风归去，又恐琼楼玉宇，高处不胜寒", "s": "想乘着清风回到天上去，又担心月宫琼楼玉宇太高经不住清寒", "img": "images/recitation-comics/shuidiaogetou-c2.webp", "no": "②"}, {"v": "起舞弄清影，何似在人间", "s": "月下翩翩起舞摆弄清影，天上哪里比得上人间", "img": "images/recitation-comics/shuidiaogetou-c3.webp", "no": "③"}, {"v": "人有悲欢离合，月有阴晴圆缺，此事古难全。但愿人长久，千里共婵娟", "s": "月光转过朱阁低照绮户照着无眠之人，人有悲欢离合月有阴晴圆缺自古难以两全，只愿亲人平安长久，相隔千里也能共赏这轮明月", "img": "images/recitation-comics/shuidiaogetou-c4.webp", "no": "④"}], "py": {"c": {"阙": "què", "琼": "qióng", "胜": "shèng", "绮": "qǐ", "娟": "juān"}, "w": {}}, "paras": ["丙辰中秋，欢饮达旦，大醉，作此篇，兼怀子由。明月几时有？把酒问青天。不知天上宫阙，今夕是何年。我欲乘风归去，又恐琼楼玉宇，高处不胜寒。起舞弄清影，何似在人间。转朱阁，低绮户，照无眠。不应有恨，何事长向别时圆？人有悲欢离合，月有阴晴圆缺，此事古难全。但愿人长久，千里共婵娟。"], "hard": "阙（què）、琼（qióng）、胜（shēng，承受）、绮（qǐ）、婵娟（chán、juān）", "hardList": [{"zi": "阙", "py": "què"}, {"zi": "琼", "py": "qióng"}, {"zi": "胜", "py": "shēng，承受"}, {"zi": "绮", "py": "qǐ"}, {"zi": "娟", "py": "chán、juān"}]}, {"id": 67, "slug": "yueye-yishedi", "title": "月夜忆舍弟", "author": "唐·杜甫", "type": "古诗", "panels": [{"v": "戍鼓断人行，边秋一雁声", "s": "戍楼上的更鼓响起道路断绝人行，边塞秋夜一只孤雁在空中哀鸣", "img": "images/recitation-comics/yueye-yishedi-c1.webp", "no": "①"}, {"v": "露从今夜白，月是故乡明", "s": "露水从今夜起变得更白更凉，月亮还是故乡的最明亮", "img": "images/recitation-comics/yueye-yishedi-c2.webp", "no": "②"}, {"v": "有弟皆分散，无家问死生", "s": "有兄弟却都各自分散飘零，无家可归想打听生死也无从问起", "img": "images/recitation-comics/yueye-yishedi-c3.webp", "no": "③"}, {"v": "寄书长不达，况乃未休兵", "s": "平时寄出的家书常常都送不到，更何况如今战乱还没有平息", "img": "images/recitation-comics/yueye-yishedi-c4.webp", "no": "④"}], "py": {"c": {"戍": "shù", "雁": "yàn", "达": "dá", "况": "kuàng"}, "w": {}}, "paras": ["戍鼓断人行，边秋一雁声。露从今夜白，月是故乡明。有弟皆分散，无家问死生。寄书长不达，况乃未休兵。"], "hard": "戍（shù）、雁（yàn）、达（dá）、况（kuàng）", "hardList": [{"zi": "戍", "py": "shù"}, {"zi": "雁", "py": "yàn"}, {"zi": "达", "py": "dá"}, {"zi": "况", "py": "kuàng"}]}, {"id": 68, "slug": "changsha-jiayi", "title": "长沙过贾谊宅", "author": "唐·刘长卿", "type": "古诗", "panels": [{"v": "三年谪宦此栖迟，万古惟留楚客悲", "s": "贾谊被贬在此居住三年，千秋万代只留下一篇楚客的悲哀", "img": "images/recitation-comics/changsha-jiayi-c1.webp", "no": "①"}, {"v": "秋草独寻人去后，寒林空见日斜时", "s": "诗人踏着秋草独自寻访斯人已去的故宅，寒林间只见夕阳斜照", "img": "images/recitation-comics/changsha-jiayi-c2.webp", "no": "②"}, {"v": "汉文有道恩犹薄，湘水无情吊岂知", "s": "汉文帝是有道的明君对贾谊仍恩情淡薄，湘水无情凭吊又岂能知情", "img": "images/recitation-comics/changsha-jiayi-c3.webp", "no": "③"}, {"v": "寂寂江山摇落处，怜君何事到天涯", "s": "寂寂江山草木摇落的地方，怜悯你为何竟被贬谪到这般天涯", "img": "images/recitation-comics/changsha-jiayi-c4.webp", "no": "④"}], "py": {"c": {"谊": "yì", "谪": "zhé", "宦": "huàn", "栖": "qī", "薄": "bó", "吊": "diào", "涯": "yá"}, "w": {}}, "paras": ["三年谪宦此栖迟，万古惟留楚客悲。秋草独寻人去后，寒林空见日斜时。汉文有道恩犹薄，湘水无情吊岂知。", "寂寂江山摇落处，怜君何事到天涯。"], "hard": "谊（yì）、谪（zhé）、宦（huàn）、栖（qī）、薄（bó）、吊（diào）、寂、（jì）、涯（yá）", "hardList": [{"zi": "谊", "py": "yì"}, {"zi": "谪", "py": "zhé"}, {"zi": "宦", "py": "huàn"}, {"zi": "栖", "py": "qī"}, {"zi": "薄", "py": "bó"}, {"zi": "吊", "py": "diào"}, {"zi": "涯", "py": "yá"}]}, {"id": 69, "slug": "zuoqian-languan", "title": "左迁至蓝关示侄孙湘", "author": "唐·韩愈", "type": "古诗", "panels": [{"v": "一封朝奏九重天，夕贬潮州路八千", "s": "清晨向朝廷呈上一封谏书，傍晚就被贬往八千里外的潮州", "img": "images/recitation-comics/zuoqian-languan-c1.webp", "no": "①"}, {"v": "欲为圣明除弊事，肯将衰朽惜残年", "s": "想替圣明天子革除弊政，哪肯顾惜衰朽之身吝惜残年", "img": "images/recitation-comics/zuoqian-languan-c2.webp", "no": "②"}, {"v": "云横秦岭家何在？雪拥蓝关马不前", "s": "云横秦岭回望长安家在何方？大雪拥塞蓝关马儿也不肯前行", "img": "images/recitation-comics/zuoqian-languan-c3.webp", "no": "③"}, {"v": "知汝远来应有意，好收吾骨瘴江边", "s": "知道你远道赶来应有所打算，正好到瘴江边收殓我的尸骨", "img": "images/recitation-comics/zuoqian-languan-c4.webp", "no": "④"}], "py": {"c": {"贬": "biǎn", "弊": "bì", "朽": "xiǔ", "瘴": "zhàng"}, "w": {}}, "paras": ["一封朝奏九重天，夕贬潮州路八千。欲为圣明除弊事，肯将衰朽惜残年！云横秦岭家何在？雪拥蓝关马不前。知汝远来应有意，好收吾骨瘴江边。"], "hard": "贬（biǎn）、弊（bì）、朽（xiǔ）、瘴（zhàng）", "hardList": [{"zi": "贬", "py": "biǎn"}, {"zi": "弊", "py": "bì"}, {"zi": "朽", "py": "xiǔ"}, {"zi": "瘴", "py": "zhàng"}]}, {"id": 70, "slug": "shangshan", "title": "商山早行", "author": "唐·温庭筠", "type": "古诗"
