<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>理解性默写自测· 86篇全册 | 上海中考27届</title>
<style>
:root{
  --bg:#F8FAFC; --card:#FFFFFF; --subtle:#F1F5F9; --border:#E2E8F0;
  --tx:#0F172A; --tx2:#475569; --mut:#64748B;
  --red:#DC2626; --red-l:#EF4444; --red-bg:#FEF2F2;
  --green:#059669; --green-bg:#ECFDF5; --amber:#D97706; --amber-bg:#FFFBEB;
  --blue:#1D4ED8; --blue-bg:#EFF6FF; --violet:#7C3AED; --violet-bg:#F5F3FF;
  --serif:"Songti SC","STSong","Noto Serif SC","SimSun",serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:-apple-system,"PingFang SC","Segoe UI",sans-serif;background:var(--bg);color:var(--tx);line-height:1.6;display:flex}

/* ---------- 左侧目录 ---------- */
#sidebar{width:276px;flex:none;background:var(--card);border-right:1px solid var(--border);
  display:flex;flex-direction:column;height:100vh;position:sticky;top:0;transition:margin-left .25s ease;z-index:40}
body.collapsed #sidebar{margin-left:-276px}
#side-head{padding:1rem 1rem .8rem;border-bottom:1px solid var(--border);position:relative}
#side-head h1{font-size:1rem;font-weight:800;color:var(--red);letter-spacing:-.01em}
#side-head p{font-size:.72rem;color:var(--mut);margin-top:.15rem}
#fold{position:absolute;right:.7rem;top:1rem;background:var(--subtle);border:1px solid var(--border);
  border-radius:7px;width:30px;height:30px;cursor:pointer;font-size:.8rem;color:var(--tx2);display:flex;align-items:center;justify-content:center}
#fold:hover{background:var(--red-bg);border-color:var(--red-l);color:var(--red)}
#sec-list{flex:1;overflow-y:auto;padding:.5rem}
.vol{margin-bottom:.35rem}
.vol-head{display:flex;align-items:center;gap:.45rem;padding:.42rem .55rem;border-radius:8px;cursor:pointer;user-select:none}
.vol-head:hover{background:var(--subtle)}
.vol-dot{width:7px;height:7px;border-radius:50%;background:var(--border);flex:none}
.vol-dot.full{background:var(--green)}
.vol-dot.half{background:var(--amber)}
.vol-name{flex:1;font-size:.8rem;font-weight:700;color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vol-n{font-size:.68rem;color:var(--mut);flex:none;font-variant-numeric:tabular-nums}
.vol-items{display:none;padding:.1rem 0 .3rem .55rem}
.vol.open .vol-items{display:block}
.pi{display:flex;align-items:center;gap:.4rem;padding:.3rem .5rem;border-radius:7px;cursor:pointer;font-size:.78rem;color:var(--tx2)}
.pi:hover{background:var(--subtle)}
.pi.active{background:var(--red-bg);color:var(--red);font-weight:600}
.pi-t{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pi-ok{font-size:.68rem;color:var(--green);flex:none}
.pi-no{font-size:.66rem;color:var(--mut);flex:none;font-variant-numeric:tabular-nums}
.pi-type{font-size:.6rem;padding:.05rem .28rem;border-radius:4px;background:var(--subtle);color:var(--mut);flex:none}
.pi-type.wy{background:var(--violet-bg);color:var(--violet)}
#side-foot{padding:.7rem 1rem;border-top:1px solid var(--border);font-size:.72rem;color:var(--mut)}
#progress-line{height:6px;border-radius:3px;background:var(--subtle);margin-top:.45rem;overflow:hidden}
#progress-fill{height:100%;background:linear-gradient(90deg,var(--red),var(--red-l));width:0;transition:width .3s}

/* ---------- 主区 ---------- */
main{flex:1;min-width:0;display:flex;flex-direction:column}
header{background:var(--card);border-bottom:1px solid var(--border);padding:.9rem 1.4rem;position:sticky;top:0;z-index:30}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:1rem;max-width:940px;margin:0 auto;flex-wrap:wrap}
#crumb{font-size:.8rem;color:var(--mut)}
#crumb a{color:var(--mut);text-decoration:none}
#crumb a:hover{color:var(--red)}
#crumb b{color:var(--red);font-weight:700}
#crumb .pl{color:var(--blue);font-weight:600}
.hbtns{display:flex;gap:.4rem;align-items:center;flex-wrap:wrap}
.btn{font:inherit;font-size:.76rem;font-weight:600;padding:.42rem .75rem;border-radius:8px;border:1px solid var(--border);
  background:var(--subtle);color:var(--tx2);cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--red-bg);border-color:var(--red-l);color:var(--red)}
.btn.on{background:var(--red);border-color:var(--red);color:#fff}
.btn.g{border-color:var(--green);color:var(--green);background:var(--green-bg)}
.btn.g.on{background:var(--green);color:#fff}
.btn.b{border-color:var(--blue);color:var(--blue);background:var(--blue-bg)}
.btn.b.on{background:var(--blue);color:#fff}

.wrap{max-width:940px;margin:0 auto;padding:1.3rem 1.4rem 4rem;flex:1}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:1.15rem 1.25rem;margin-bottom:1rem}
.title-row{display:flex;align-items:baseline;gap:.6rem;flex-wrap:wrap;margin-bottom:.15rem}
.t-no{font-size:.72rem;color:var(--mut);font-variant-numeric:tabular-nums}
.t-name{font-family:var(--serif);font-size:1.32rem;font-weight:700;letter-spacing:.01em}
.t-au{font-size:.82rem;color:var(--mut)}
.t-meta{display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:.9rem}
.chip{font-size:.68rem;padding:.16rem .5rem;border-radius:20px;background:var(--subtle);color:var(--tx2);font-weight:600}
.chip.wy{background:var(--violet-bg);color:var(--violet)}
.chip.ci{background:var(--blue-bg);color:var(--blue)}
.chip.lv{background:var(--green-bg);color:var(--green)}

.passage{font-family:var(--serif);font-size:1.06rem;line-height:2.15;color:var(--tx);margin-bottom:1rem}
.passage p{margin-bottom:.55rem}
.cue{background:var(--amber-bg);color:var(--amber);padding:0 .18rem;border-radius:3px;font-weight:700}
.ell{color:var(--mut);font-weight:400}
.blank{display:inline-block;min-width:4em;border-bottom:2px solid var(--red);background:var(--red-bg);
  border-radius:3px 3px 0 0;cursor:pointer;vertical-align:baseline;transition:background .15s;
  text-align:center;letter-spacing:.05em;color:transparent;min-height:1.5em;line-height:1.5;padding:0 .2em}
.blank:hover{background:#FEE2E2}
.blank.filled{color:var(--red);background:var(--subtle);border-color:var(--mut)}
.blank.right{color:var(--green);background:var(--green-bg);border-color:var(--green)}
.blank.wrong{color:var(--red);background:#FEF2F2;border-color:var(--red)}
.blank input{font:inherit;width:100%;border:none;background:transparent;color:var(--tx);
  text-align:center;letter-spacing:.05em;outline:none;padding:0}

.hardbox{background:var(--amber-bg);border:1px solid #FDE68A;border-radius:10px;padding:.75rem .9rem;margin-bottom:1rem}
.hardbox h4{font-size:.78rem;color:var(--amber);margin-bottom:.45rem;font-weight:700}
.hz{display:inline-flex;align-items:baseline;gap:.2rem;margin:.16rem .35rem .16rem 0;padding:.2rem .5rem;background:var(--card);
  border:1px solid #FDE68A;border-radius:7px;font-size:.86rem}
.hz b{font-family:var(--serif);font-weight:700}
.hz span{font-size:.7rem;color:var(--mut);font-variant-numeric:tabular-nums}

/* 答案解析 */
.qblock{margin-bottom:.55rem}
.qblock .passage-p{margin-bottom:.4rem}
.ana{background:var(--blue-bg);border:1px solid #BFDBFE;border-radius:10px;padding:.7rem .85rem;margin:.35rem 0 .1rem}
.ana-in .ar{display:flex;gap:.5rem;font-size:.79rem;line-height:1.65;margin-bottom:.3rem}
.ana-in .ar:last-child{margin-bottom:0}
.ana-in .ar b{flex:none;width:5.4rem;color:var(--blue);font-weight:700}
.ana-in .ar span{color:#1E3A8A;flex:1;min-width:0}
.ana-t{font-size:.72rem;font-weight:700;color:var(--blue);margin-bottom:.4rem;letter-spacing:.02em}

.judge{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap;padding-top:.9rem;border-top:1px dashed var(--border)}
.res{font-size:.86rem;font-weight:700}
.res.ok{color:var(--green)} .res.no{color:var(--red)}
.score{font-size:.74rem;color:var(--mut);margin-left:auto}

.note{background:var(--blue-bg);border:1px solid #BFDBFE;border-radius:10px;padding:.75rem .9rem;
  font-size:.8rem;color:#1E40AF;margin-bottom:1rem}
.note b{font-weight:700}
.hint{font-size:.8rem;color:var(--mut);margin-bottom:.8rem}

/* 背诵模式：逐句遮盖 */
.recite{font-family:var(--serif);font-size:1.1rem;line-height:2.3}
.rline{display:block;padding:.18rem .4rem;border-radius:6px;margin-bottom:.1rem;cursor:pointer;transition:background .15s}
.rline:hover{background:var(--subtle)}
.rline.hidden{color:transparent;background:var(--red-bg);user-select:none}
.rline.hidden::after{content:"点击显示";font-family:-apple-system,sans-serif;font-size:.72rem;color:var(--red-l)}
.rline.hi{background:var(--amber-bg)}

.overview{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:.6rem}
.ov{background:var(--card);border:1px solid var(--border);border-radius:11px;padding:.7rem .8rem}
.ov b{display:block;font-size:1.5rem;font-weight:800;color:var(--red);line-height:1.2;font-variant-numeric:tabular-nums}
.ov span{font-size:.7rem;color:var(--mut)}
.ov.g b{color:var(--green)} .ov.b b{color:var(--blue)} .ov.a b{color:var(--amber)}

.warn{background:#FEF2F2;border:1px solid #FECACA;border-radius:10px;padding:.8rem .95rem;font-size:.8rem;color:#991B1B;margin-bottom:1rem}
.warn b{font-weight:700}
table{width:100%;border-collapse:collapse;font-size:.8rem;margin-bottom:.4rem}
th,td{padding:.45rem .55rem;border-bottom:1px solid var(--border);text-align:left;vertical-align:top}
th{background:var(--subtle);font-weight:700;font-size:.76rem;color:var(--tx2)}
td.c{text-align:center;font-variant-numeric:tabular-nums}
.tblwrap{overflow-x:auto}

@media(max-width:760px){
  #sidebar{position:fixed;left:0;top:0;bottom:0;box-shadow:0 0 30px rgba(0,0,0,.12)}
  body.collapsed #sidebar{margin-left:-276px}
  .wrap{padding:1rem .9rem 3rem}
}
@media print{#sidebar,header,.judge{display:none}body{display:block}.wrap{max-width:100%}}
</style>
</head>

<script>
const DATA = [{"volume":"六年级（上册）","items":[{"no":1,"title":"宿建德江","author":"唐·孟浩然","type":"古诗","paras":["移舟泊烟渚，日暮客愁新。野旷天低树，江清月近人。"],"hard":"渚（zhǔ，水中小块陆地）","hardList":[{"zi":"渚","py":"zhǔ，水中小块陆地"}],"len":20},{"no":2,"title":"六月二十七日望湖楼醉书","author":"宋·苏轼","type":"古诗","paras":["黑云翻墨未遮山，白雨跳珠乱入船。卷地风来忽吹散，望湖楼下水如天。"],"hard":"遮（zhē）、卷（juǎn）","hardList":[{"zi":"遮","py":"zhē"},{"zi":"卷","py":"juǎn"}],"len":28},{"no":3,"title":"西江月·夜行黄沙道中","author":"宋·辛弃疾","type":"词","paras":["明月别枝惊鹊，清风半夜鸣蝉。","稻花香里说丰年，听取蛙声一片。七八个星天外，两三点雨山前。旧时茅店社林边，路转溪桥忽见。"],"hard":"鹊（què）、蝉（chán）、茅（máo）、见（xiàn，通“现”，出现）","hardList":[{"zi":"鹊","py":"què"},{"zi":"蝉","py":"chán"},{"zi":"茅","py":"máo"},{"zi":"见","py":"xiàn，通“现”，出现"}],"len":50},{"no":4,"title":"浪淘沙（其一）","author":"唐·刘禹锡","type":"古诗","paras":["九曲黄河万里沙，浪淘风簸自天涯。如今直上银河去，同到牵牛织女家。"],"hard":"簸（bǒ，颠簸）、涯（yá）","hardList":[{"zi":"簸","py":"bǒ，颠簸"},{"zi":"涯","py":"yá"}],"len":28},{"no":5,"title":"江南春","author":"唐·杜牧","type":"古诗","paras":["千里莺啼绿映红，水村山郭酒旗风。南朝四百八十寺，多少楼台烟雨中。"],"hard":"莺（yīng）、啼（tí）、郭（guō）","hardList":[{"zi":"莺","py":"yīng"},{"zi":"啼","py":"tí"},{"zi":"郭","py":"guō"}],"len":28},{"no":6,"title":"书湖阴先生壁","author":"宋·王安石","type":"古诗","paras":["茅檐长扫净无苔，花木成畦手自栽。一水护田将绿绕，两山排闼送青来。"],"hard":"檐（yán）、苔（tái）、畦（qí）、闼（tà，小门）","hardList":[{"zi":"檐","py":"yán"},{"zi":"苔","py":"tái"},{"zi":"畦","py":"qí"},{"zi":"闼","py":"tà，小门"}],"len":28},{"no":7,"title":"七律·长征","author":"毛泽东","type":"律诗","paras":["红军不怕远征难，万水千山只等闲。五岭逶迤腾细浪，乌蒙磅礴走泥丸。金沙水拍云崖暖，大渡桥横铁索寒。更喜岷山千里雪，三军过后尽开颜。"],"hard":"逶迤（wēi yí）、磅礴（páng bó）、岷（mín）","hardList":[{"zi":"迤","py":"wēi yí"},{"zi":"礴","py":"páng bó"},{"zi":"岷","py":"mín"}],"len":56},{"no":8,"title":"伯牙鼓琴","author":"《吕氏春秋》","type":"文言文","paras":["伯牙鼓琴，锺子期听之。方鼓琴而志在太山，锺子期曰：“善哉乎鼓琴，巍巍乎若太山。”少选之间而志在流水，锺子期又曰：“善哉乎鼓琴，汤汤乎若流水。”锺子期死，伯牙破琴绝弦，终身不复鼓琴，以为世无足复为鼓琴者。"],"hard":"锺（zhōng）、巍（wēi）、汤（shāng，水大的样子）、弦（xián）","hardList":[{"zi":"锺","py":"zhōng"},{"zi":"巍","py":"wēi"},{"zi":"汤","py":"shāng，水大的样子"},{"zi":"弦","py":"xián"}],"len":87}]},{"volume":"六年级（下册）","items":[{"no":1,"title":"迢迢牵牛星","author":"《古诗十九首》","type":"古诗","paras":["迢迢牵牛星，皎皎河汉女。纤纤擢素手，札札弄机杼。终日不成章，泣涕零如雨。河汉清且浅，相去复几许。盈盈一水间，脉脉不得语。"],"hard":"迢（tiáo）、皎（jiǎo）、擢（zhuó）、札（zhá）、杼（zhù）、间（jiàn，、间隔）、脉（mò）","hardList":[{"zi":"迢","py":"tiáo"},{"zi":"皎","py":"jiǎo"},{"zi":"擢","py":"zhuó"},{"zi":"札","py":"zhá"},{"zi":"杼","py":"zhù"},{"zi":"间","py":"jiàn，、间隔"},{"zi":"脉","py":"mò"}],"len":50},{"no":2,"title":"竹石","author":"清·郑燮","type":"古诗","paras":["咬定青山不放松，立根原在破岩中。千磨万击还坚劲，任尔东西南北风。"],"hard":"燮（xiè）、劲（jìng）、尔（ěr）","hardList":[{"zi":"燮","py":"xiè"},{"zi":"劲","py":"jìng"},{"zi":"尔","py":"ěr"}],"len":28},{"no":3,"title":"回乡偶书（其一）","author":"唐·贺知章","type":"古诗","paras":["少小离家老大回，乡音无改鬓毛衰。儿童相见不相识，笑问客从何处来。"],"hard":"鬓（bìn）、衰（cuī）","hardList":[{"zi":"鬓","py":"bìn"},{"zi":"衰","py":"cuī"}],"len":28},{"no":4,"title":"两小儿辩日","author":"《列子》","type":"文言文","paras":["孔子东游，见两小儿辩斗，问其故。一儿曰：“我以日始出时去人近，而日中时远也。”一儿曰：“我以日初出远，而日中时近也。”一儿曰：“日初出大如车盖，及日中则如盘盂，此不为远者小而近者大乎？”一儿曰：“日初出沧沧凉凉，及其日中如探汤，此不为近者热而远者凉乎？”","孔子不能决也。两小儿笑曰：“孰为汝多知乎？”"],"hard":"辩（biàn）、盂（yú）、沧（cāng）、孰（shú）、汝（rǔ）、知（zhì，通、“智”）","hardList":[{"zi":"辩","py":"biàn"},{"zi":"盂","py":"yú"},{"zi":"沧","py":"cāng"},{"zi":"孰","py":"shú"},{"zi":"汝","py":"rǔ"},{"zi":"知","py":"zhì，通、“智”"}],"len":129}]},{"volume":"七年级（上册）","items":[{"no":1,"title":"观沧海","author":"东汉·曹操","type":"古诗","paras":["东临碣石，以观沧海。水何澹澹，山岛竦峙。树木丛生，百草丰茂。秋风萧瑟，洪波涌起。日月之行，若出其中；星汉灿烂，若出其里。幸甚至哉，歌以咏志。"],"hard":"碣（jié）、澹（dàn）、竦峙（sǒng zhì）、萧瑟（xiāo sè）、咏、（yǒng）","hardList":[{"zi":"碣","py":"jié"},{"zi":"澹","py":"dàn"},{"zi":"峙","py":"sǒng zhì"},{"zi":"瑟","py":"xiāo sè"}],"len":56},{"no":2,"title":"闻王昌龄左迁龙标遥有此寄","author":"唐·李白","type":"古诗","paras":["杨花落尽子规啼，闻道龙标过五溪。我寄愁心与明月，随君直到夜郎西。"],"hard":"昌（chāng）、龄（líng）、啼（tí）、溪（xī）","hardList":[{"zi":"昌","py":"chāng"},{"zi":"龄","py":"líng"},{"zi":"啼","py":"tí"},{"zi":"溪","py":"xī"}],"len":28},{"no":3,"title":"次北固山下","author":"唐·王湾","type":"古诗","paras":["客路青山外，行舟绿水前。潮平两岸阔，风正一帆悬。海日生残夜，江春入旧年。乡书何处达？归雁洛阳边。"],"hard":"悬（xuán）、雁（yàn）、洛（luò）","hardList":[{"zi":"悬","py":"xuán"},{"zi":"雁","py":"yàn"},{"zi":"洛","py":"luò"}],"len":40},{"no":4,"title":"天净沙·秋思","author":"元·马致远","type":"曲","paras":["枯藤老树昏鸦，小桥流水人家，古道西风瘦马。夕阳西下，断肠人在天涯。"],"hard":"藤（téng）、涯（yá）","hardList":[{"zi":"藤","py":"téng"},{"zi":"涯","py":"yá"}],"len":28},{"no":5,"title":"《论语》十二章","author":"孔子弟子及再传弟子","type":"文言文","paras":["子曰：“学而时习之，不亦说乎？有朋自远方来，不亦乐乎？人不知而不愠，不亦君子乎？”（《学而》）曾子曰：“吾日三省吾身：为人谋而不忠乎？与朋友交而不信乎？传不习乎？”（《学而》）子曰：“吾十有五而志于学，三十而立，四十而不惑，五十而知天命，六十而耳顺，七十而从心所欲，不逾矩。”（《为政》）子曰：“温故而知新，可以为师矣。”（《为政》）子曰：“学而不思则罔，思而不学则殆。”（《为政》）子曰：“贤哉，回也！一箪食，一瓢饮，在陋巷，人不堪其忧，回也不改其乐。贤哉，回也！”（《雍也》）子曰：“知之者不如好之者，好之者不如乐之者。”（《雍也》）子曰：“饭疏食，饮水，曲肱而枕之，乐亦在其中矣。不义而富且贵，于我如浮云。”（《述而》）子曰：“三人行，必有我师焉。择其善者而从之，其不善者而改之。”（《述而》）子在川上曰：“逝者如斯夫，不舍昼夜。”（《子罕》）子曰：“三军可夺帅也，匹夫不可夺志也。”（《子罕》）子夏曰：“博学而笃志，切问而近思，仁在其中矣。”（《子张》）"],"hard":"愠（yùn）、省（xǐng）、有（yòu，通“又”）、惑（huò）、逾（yú）、矩、（jǔ）、罔（wǎng）、殆（dài）、箪（dān）、肱（gōng）、焉（yān）、笃（dǔ）","hardList":[{"zi":"愠","py":"yùn"},{"zi":"省","py":"xǐng"},{"zi":"有","py":"yòu，通“又”"},{"zi":"惑","py":"huò"},{"zi":"逾","py":"yú"},{"zi":"罔","py":"wǎng"},{"zi":"殆","py":"dài"},{"zi":"箪","py":"dān"},{"zi":"肱","py":"gōng"},{"zi":"焉","py":"yān"},{"zi":"笃","py":"dǔ"}],"len":322},{"no":6,"title":"峨眉山月歌","author":"唐·李白","type":"古诗","paras":["峨眉山月半轮秋，影入平羌江水流。夜发清溪向三峡，思君不见下渝州。"],"hard":"峨（é）、羌（qiāng）、渝（yú）","hardList":[{"zi":"峨","py":"é"},{"zi":"羌","py":"qiāng"},{"zi":"渝","py":"yú"}],"len":28},{"no":7,"title":"江南逢李龟年","author":"唐·杜甫","type":"古诗","paras":["岐王宅里寻常见，崔九堂前几度闻。正是江南好风景，落花时节又逢君。"],"hard":"岐（qí）、崔（cuī）","hardList":[{"zi":"岐","py":"qí"},{"zi":"崔","py":"cuī"}],"len":28},{"no":8,"title":"行军九日思长安故园","author":"唐·岑参","type":"古诗","paras":["强欲登高去，无人送酒来。遥怜故园菊，应傍战场开。"],"hard":"岑（cén）、参（shēn）、强（qiǎng）、怜（lián）、傍（bàng）","hardList":[{"zi":"岑","py":"cén"},{"zi":"参","py":"shēn"},{"zi":"强","py":"qiǎng"},{"zi":"怜","py":"lián"},{"zi":"傍","py":"bàng"}],"len":20},{"no":9,"title":"夜上受降城闻笛","author":"唐·李益","type":"古诗","paras":["回乐烽前沙似雪，受降城外月如霜。不知何处吹芦管，一夜征人尽望乡。"],"hard":"降（xiáng）、烽（fēng）、芦（lú）","hardList":[{"zi":"降","py":"xiáng"},{"zi":"烽","py":"fēng"},{"zi":"芦","py":"lú"}],"len":28},{"no":10,"title":"诫子书","author":"三国·诸葛亮","type":"文言文","paras":["夫君子之行，静以修身，俭以养德。非淡泊无以明志，非宁静无以致远。夫学须静也，才须学也，非学无以广才，非志无以成学。淫慢则不能励精，险躁则不能治性。年与时驰，意与日去，遂成枯落，多不接世，悲守穷庐，将复何及！"],"hard":"淫（yín）、躁（zào）、治（chí，通“弛”，修养）、遂（suì）、庐、（lú）","hardList":[{"zi":"淫","py":"yín"},{"zi":"躁","py":"zào"},{"zi":"治","py":"chí，通“弛”，修养"},{"zi":"遂","py":"suì"}],"len":86}]},{"volume":"七年级（下册）","items":[{"no":1,"title":"登幽州台歌","author":"唐·陈子昂","type":"古诗","paras":["前不见古人，后不见来者。念天地之悠悠，独怆然而涕下。"],"hard":"昂（áng）、怆（chuàng）、涕（tì）","hardList":[{"zi":"昂","py":"áng"},{"zi":"怆","py":"chuàng"},{"zi":"涕","py":"tì"}],"len":22},{"no":2,"title":"望岳","author":"唐·杜甫","type":"古诗","paras":["岱宗夫如何？齐鲁青未了。造化钟神秀，阴阳割昏晓。荡胸生曾云，决眦入归鸟。会当凌绝顶，一览众山小。"],"hard":"岱（dài）、曾（céng，通“层”）、眦（zì）、凌（líng）、览（lǎn）","hardList":[{"zi":"岱","py":"dài"},{"zi":"曾","py":"céng，通“层”"},{"zi":"眦","py":"zì"},{"zi":"凌","py":"líng"},{"zi":"览","py":"lǎn"}],"len":40},{"no":3,"title":"游山西村","author":"宋·陆游","type":"古诗","paras":["莫笑农家腊酒浑，丰年留客足鸡豚。山重水复疑无路，柳暗花明又一村。箫鼓追随春社近，衣冠简朴古风存。从今若许闲乘月，拄杖无时夜叩门。"],"hard":"腊（là）、豚（tún）、箫（xiāo）、拄（zhǔ）、叩（kòu）","hardList":[{"zi":"腊","py":"là"},{"zi":"豚","py":"tún"},{"zi":"箫","py":"xiāo"},{"zi":"拄","py":"zhǔ"},{"zi":"叩","py":"kòu"}],"len":56},{"no":4,"title":"陋室铭","author":"唐·刘禹锡","type":"文言文","paras":["山不在高，有仙则名。水不在深，有龙则灵。斯是陋室，惟吾德馨。苔痕上阶绿，草色入帘青。谈笑有鸿儒，往来无白丁。可以调素琴，阅金经。无丝竹之乱耳，无案牍之劳形。南阳诸葛庐，西蜀子云亭。孔子云：何陋之有？"],"hard":"陋（lòu）、馨（xīn）、苔（tái）、儒（rú）、牍（dú）、蜀（shǔ）","hardList":[{"zi":"陋","py":"lòu"},{"zi":"馨","py":"xīn"},{"zi":"苔","py":"tái"},{"zi":"儒","py":"rú"},{"zi":"牍","py":"dú"},{"zi":"蜀","py":"shǔ"}],"len":81},{"no":5,"title":"爱莲说","author":"宋·周敦颐","type":"文言文","paras":["水陆草木之花，可爱者甚蕃。晋陶渊明独爱菊。自李唐来，世人甚爱牡丹。予独爱莲之出淤泥而不染，濯清涟而不妖，中通外直，不蔓不枝，香远益清，亭亭净植，可远观而不可亵玩焉。予谓菊，花之隐逸者也；牡丹，花之富贵者也；莲，花之君子者也。噫！菊之爱，陶后鲜有闻。莲之爱，同予者何人？牡丹之爱，宜乎众矣。"],"hard":"颐（yí）、蕃（fán）、淤（yū）、濯（zhuó）、涟（lián）、蔓（màn）、亵、（xiè）、逸（yì）、噫（yī）、鲜（xiǎn，少）","hardList":[{"zi":"颐","py":"yí"},{"zi":"蕃","py":"fán"},{"zi":"淤","py":"yū"},{"zi":"濯","py":"zhuó"},{"zi":"涟","py":"lián"},{"zi":"蔓","py":"màn"},{"zi":"逸","py":"yì"},{"zi":"噫","py":"yī"},{"zi":"鲜","py":"xiǎn，少"}],"len":119},{"no":6,"title":"泊秦淮","author":"唐·杜牧","type":"古诗","paras":["烟笼寒水月笼沙，夜泊秦淮近酒家。商女不知亡国恨，隔江犹唱后庭花。"],"hard":"笼（lǒng）、淮（huái）、犹（yóu）","hardList":[{"zi":"笼","py":"lǒng"},{"zi":"淮","py":"huái"},{"zi":"犹","py":"yóu"}],"len":28},{"no":7,"title":"木兰诗","author":"北朝民歌","type":"古诗","paras":["唧唧复唧唧，木兰当户织。不闻机杼声，唯闻女叹息。问女何所思，问女何所忆。女亦无所思，女亦无所忆。昨夜见军帖，可汗大点兵。军书十二卷，卷卷有爷名。阿爷无大儿，木兰无长兄。愿为市鞍马，从此替爷征。东市买骏马，西市买鞍鞯，南市买辔头，北市买长鞭。旦辞爷娘去，暮宿黄河边。不闻爷娘唤女声，但闻黄河流水鸣溅溅。旦辞黄河去，暮至黑山头。不闻爷娘唤女声，但闻燕山胡骑鸣啾啾。万里赴戎机，关山度若飞。朔气传金柝，寒光照铁衣。将军百战死，壮士十年归。归来见天子，天子坐明堂。策勋十二转，赏赐百千强。可汗问所欲，木兰不用尚书郎，愿驰千里足，送儿还故乡。爷娘闻女来，出郭相扶将；阿姊闻妹来，当户理红妆；小弟闻姊来，磨刀霍霍向猪羊。开我东阁门，坐我西阁床。脱我战时袍，著我旧时裳。当窗理云鬓，对镜帖花黄。出门看火伴，火伴皆惊忙：同行十二年，不知木兰是女郎。雄兔脚扑朔，雌兔眼迷离；双兔傍地走，安能辨我是雄雌？"],"hard":"唧（jī）、杼（zhù）、帖（tiě，文书）、可汗（kè hán）、鞯（jiān）、辔、（pèi）、溅（jiān）、啾（jiū）、戎（róng）、柝（tuò）、勋（xūn）、帖（tiē，通、“贴”）、鬓（bìn）、傍（bàng）","hardList":[{"zi":"唧","py":"jī"},{"zi":"杼","py":"zhù"},{"zi":"帖","py":"tiě，文书"},{"zi":"汗","py":"kè hán"},{"zi":"鞯","py":"jiān"},{"zi":"溅","py":"jiān"},{"zi":"啾","py":"jiū"},{"zi":"戎","py":"róng"},{"zi":"柝","py":"tuò"},{"zi":"勋","py":"xūn"},{"zi":"帖","py":"tiē，通、“贴”"},{"zi":"鬓","py":"bìn"},{"zi":"傍","py":"bàng"}],"len":330},{"no":8,"title":"卖油翁","author":"宋·欧阳修","type":"文言文","paras":["陈康肃公善射，当世无双，公亦以此自矜。尝射于家圃，有卖油翁释担而立，睨之久而不去。见其发矢十中八九，但微颔之。康肃问曰：“汝亦知射乎？吾射不亦精乎？”翁曰：“无他，但手熟尔。”康肃忿然曰：“尔安敢轻吾射！”翁曰：“以我酌油知之。”乃取一葫芦置于地，以钱覆其口，徐以杓酌油沥之，自钱孔入，而钱不湿。因曰：“我亦无他，惟手熟尔。”康肃笑而遣之。"],"hard":"矜（jīn）、圃（pǔ）、释（shì）、睨（nì）、颔（hàn）、忿（fèn）、酌、（zhuó）、覆（fù）、杓（sháo）、沥（lì）、遣（qiǎn）","hardList":[{"zi":"矜","py":"jīn"},{"zi":"圃","py":"pǔ"},{"zi":"释","py":"shì"},{"zi":"睨","py":"nì"},{"zi":"颔","py":"hàn"},{"zi":"忿","py":"fèn"},{"zi":"覆","py":"fù"},{"zi":"杓","py":"sháo"},{"zi":"沥","py":"lì"},{"zi":"遣","py":"qiǎn"}],"len":143}]},{"volume":"八年级（上册）","items":[{"no":1,"title":"三峡","author":"北魏·郦道元","type":"文言文","paras":["自三峡七百里中，两岸连山，略无阙处。重岩叠嶂，隐天蔽日，自非亭午夜分，不见曦月。至于夏水襄陵，沿溯阻绝。或王命急宣，有时朝发白帝，暮到江陵，其间千二百里，虽乘奔御风，不以疾也。春冬之时，则素湍绿潭，回清倒影。绝巘多生怪柏，悬泉瀑布，飞漱其间，清荣峻茂，良多趣味。每至晴初霜旦，林寒涧肃，常有高猿长啸， ,"hard":"戟（jǐ）、销（xiāo）、磨（mó）、雀（què）、锁（suǒ）","hardList":[{"zi":"戟","py":"jǐ"},{"zi":"销","py":"xiāo"},{"zi":"磨","py":"mó"},{"zi":"雀","py":"què"},{"zi":"锁","py":"suǒ"}],"len":28},{"no":13,"title":"富贵不能淫","author":"《孟子》","type":"文言文","paras":["景春曰：“公孙衍、张仪岂不诚大丈夫哉？一怒而诸侯惧，安居而天下熄。”孟子曰：“是焉得为大丈夫乎？子未学礼乎？丈夫之冠也，父命之；女子之嫁也，母命之，往送之门，戒之曰：'往之女家，必敬必戒，无违夫子！'以顺为正者，妾妇之道也。居天下之广居，立天下之正位，行天下之大道。得志，与民由之；不得志，独行其道。富贵不能淫，贫贱不能移，威武不能屈，此之谓大丈夫。”"],"hard":"衍（yǎn）、女（rǔ，通“汝”）、淫（yín）、贱（jiàn）、屈（qū）","hardList":[{"zi":"衍","py":"yǎn"},{"zi":"女","py":"rǔ，通“汝”"},{"zi":"淫","py":"yín"},{"zi":"贱","py":"jiàn"},{"zi":"屈","py":"qū"}],"len":146},{"no":14,"title":"生于忧患，死于安乐","author":"《孟子》","type":"文言文","paras":["舜发于畎亩之中，傅说举于版筑之间，胶鬲举于鱼盐之中，管夷吾举于士，孙叔敖举于海，百里奚举于市。故天将降大任于是人也，必先苦其心志，劳其筋骨，饿其体肤，空乏其身，行拂乱其所为，所以动心忍性，曾益其所不能。人恒过，然后能改；困于心，衡于虑，而后作；征于色，发于声，而后喻。入则无法家拂士，出则无敌国外患者，国恒亡。然后知生于忧患而死于安乐也。"],"hard":"舜（Shùn）、畎（quǎn）、傅说（yuè）、鬲（gé）、敖（áo）、奚（xī）、、拂（fú）、曾（zēng，通“增”）、衡（héng）、拂（bì，通“弼”）","hardList":[{"zi":"舜","py":"Shùn"},{"zi":"畎","py":"quǎn"},{"zi":"说","py":"yuè"},{"zi":"鬲","py":"gé"},{"zi":"敖","py":"áo"},{"zi":"奚","py":"xī"},{"zi":"拂","py":"fú"},{"zi":"曾","py":"zēng，通“增”"},{"zi":"衡","py":"héng"},{"zi":"拂","py":"bì，通“弼”"}],"len":143}]},{"volume":"八年级（下册）","items":[{"no":1,"title":"关雎","author":"《诗经·周南》","type":"古诗","paras":["关关雎鸠，在河之洲。窈窕淑女，君子好逑。参差荇菜，左右流之。窈窕淑女，寤寐求之。求之不得，寤寐思服。","悠哉悠哉，辗转反侧。参差荇菜，左右采之。窈窕淑女，琴瑟友之。参差荇菜，左右芼之。窈窕淑女，钟鼓乐之。"],"hard":"雎（jū）、鸠（jiū）、窈窕（yǎo tiǎo）、逑（qiú）、荇（xìng）、寤寐、（wù mèi）、瑟（sè）、芼（mào）、乐（yào，使…快乐）","hardList":[{"zi":"雎","py":"jū"},{"zi":"鸠","py":"jiū"},{"zi":"窕","py":"yǎo tiǎo"},{"zi":"逑","py":"qiú"},{"zi":"荇","py":"xìng"},{"zi":"瑟","py":"sè"},{"zi":"芼","py":"mào"},{"zi":"乐","py":"yào，使…快乐"}],"len":80},{"no":2,"title":"蒹葭","author":"《诗经·秦风》","type":"古诗","paras":["蒹葭苍苍，白露为霜。所谓伊人，在水一方。溯洄从之，道阻且长。溯游从之，宛在水中央。蒹葭萋萋，白露未晞。所谓伊人，在水之湄。溯洄从之，道阻且跻。溯游从之，宛在水中坻。蒹葭采采，白露未已。所谓伊人，在水之涘。溯洄从之，道阻且右。溯游从之，宛在水中沚。"],"hard":"蒹葭（jiān jiā）、溯（sù）、洄（huí）、晞（xī）、湄（méi）、跻、（jī）、坻（chí）、涘（sì）、沚（zhǐ）","hardList":[{"zi":"葭","py":"jiān jiā"},{"zi":"溯","py":"sù"},{"zi":"洄","py":"huí"},{"zi":"晞","py":"xī"},{"zi":"湄","py":"méi"},{"zi":"坻","py":"chí"},{"zi":"涘","py":"sì"},{"zi":"沚","py":"zhǐ"}],"len":99},{"no":3,"title":"式微","author":"《诗经·邶风》","type":"古诗","paras":["式微式微，胡不归？微君之故，胡为乎中露？式微式微，胡不归？微君之躬，胡为乎泥中？"],"hard":"式微（shì wēi）、邶（bèi）、躬（gōng）","hardList":[{"zi":"微","py":"shì wēi"},{"zi":"邶","py":"bèi"},{"zi":"躬","py":"gōng"}],"len":32},{"no":4,"title":"送杜少府之任蜀州","author":"唐·王勃","type":"古诗","paras":["城阙辅三秦，风烟望五津。与君离别意，同是宦游人。海内存知己，天涯若比邻。无为在歧路，儿女共沾巾。"],"hard":"阙（què）、辅（fǔ）、宦（huàn）、涯（yá）、歧（qí）、沾（zhān）","hardList":[{"zi":"阙","py":"què"},{"zi":"辅","py":"fǔ"},{"zi":"宦","py":"huàn"},{"zi":"涯","py":"yá"},{"zi":"歧","py":"qí"},{"zi":"沾","py":"zhān"}],"len":40},{"no":5,"title":"望洞庭湖赠张丞相","author":"唐·孟浩然","type":"古诗","paras":["八月湖水平，涵虚混太清。气蒸云梦泽，波撼岳阳城。欲济无舟楫，端居耻圣明。坐观垂钓者，徒有羡鱼情。"],"hard":"涵（hán）、混（hùn）、撼（hàn）、楫（jí）、耻（chǐ）、羡（xiàn）","hardList":[{"zi":"涵","py":"hán"},{"zi":"混","py":"hùn"},{"zi":"撼","py":"hàn"},{"zi":"楫","py":"jí"},{"zi":"耻","py":"chǐ"},{"zi":"羡","py":"xiàn"}],"len":40},{"no":6,"title":"桃花源记","author":"东晋·陶渊明","type":"文言文","paras":["晋太元中，武陵人捕鱼为业。缘溪行，忘路之远近。忽逢桃花林，夹岸数百步，中无杂树，芳草鲜美，落英缤纷。渔人甚异之，复前行，欲穷其林。林尽水源，便得一山，山有小口，仿佛若有光。便舍船，从口入。初极狭，才通人。复行数十步，豁然开朗。土地平旷，屋舍俨然，有良田、美池、桑竹之属。阡陌交通，鸡犬相闻。其中往来种作，男女衣着，悉如外人。黄发垂髫，并怡然自乐。见渔人，乃大惊，问所从来。具答之。便要还家，设酒杀鸡作食。村中闻有此人，咸来问讯。自云先世避秦时乱，率妻子邑人来此绝境，不复出焉，遂与外人间隔。问今是何世，乃不知有汉，无论魏晋。此人一一为具言所闻，皆叹惋。余人各复延至其家，皆出酒食。停数日，辞去。此中人语云：“不足为外人道也。”既出，得其船，便扶向路，处处志之。及郡下，诣太守，说如此。太守即遣人随其往，寻向所志，遂迷，不复得路。南阳刘子骥，高尚士也，闻之，欣然规往。未果，寻病终。后遂无问津者。"],"hard":"缘（yuán）、缤纷（bīn fēn）、豁（huò）、俨（yǎn）、阡陌（qiān mò）、、髫（tiáo）、怡（yí）、要（yāo，通“邀”）、咸（xián）、邑（yì）、与（yǔ）、惋、（wǎn）、延（yán）、诣（yì）、骥（jì）、津（jīn）","hardList":[{"zi":"缘","py":"yuán"},{"zi":"纷","py":"bīn fēn"},{"zi":"豁","py":"huò"},{"zi":"俨","py":"yǎn"},{"zi":"陌","py":"qiān mò"},{"zi":"髫","py":"tiáo"},{"zi":"怡","py":"yí"},{"zi":"要","py":"yāo，通“邀”"},{"zi":"咸","py":"xián"},{"zi":"邑","py":"yì"},{"zi":"与","py":"yǔ"},{"zi":"延","py":"yán"},{"zi":"诣","py":"yì"},{"zi":"骥","py":"jì"},{"zi":"津","py":"jīn"}],"len":322},{"no":7,"title":"小石潭记","author":"唐·柳宗元","type":"文言文","paras":["从小丘西行百二十步，隔篁竹，闻水声，如鸣珮环，心乐之。伐竹取道，下见小潭，水尤清冽。全石以为底，近岸，卷石底以出，为坻，为屿，为嵁，为岩。青树翠蔓，蒙络摇缀，参差披拂。潭中鱼可百许头，皆若空游无所依。日光下澈，影布石上，佁然不动；俶尔远逝，往来翕忽。似与游者相乐。潭西南而望，斗折蛇行，明灭可见。其岸势犬牙差互，不可知其源。坐潭上，四面竹树环合，寂寥无人，凄神寒骨，悄怆幽邃。以其境过清，不可久居，乃记之而去。","同游者：吴武陵，龚古，余弟宗玄。隶而从者，崔氏二小生，曰恕己，曰奉壹。"],"hard":"篁（huáng）、珮（pèi）、冽（liè）、坻（chí）、嵁（kān）、蔓（màn）、、络（luò）、缀（zhuì）、佁（yǐ）、俶（chù）、翕（xī）、寥（liáo）、怆（chuàng）、邃、（suì）、隶（lì）、壹（yī）","hardList":[{"zi":"篁","py":"huáng"},{"zi":"珮","py":"pèi"},{"zi":"冽","py":"liè"},{"zi":"坻","py":"chí"},{"zi":"嵁","py":"kān"},{"zi":"蔓","py":"màn"},{"zi":"络","py":"luò"},{"zi":"缀","py":"zhuì"},{"zi":"佁","py":"yǐ"},{"zi":"俶","py":"chù"},{"zi":"翕","py":"xī"},{"zi":"寥","py":"liáo"},{"zi":"怆","py":"chuàng"},{"zi":"隶","py":"lì"},{"zi":"壹","py":"yī"}],"len":193},{"no":8,"title":"核舟记","author":"明·魏学洢","type":"文言文","paras":["（节选）明有奇巧人曰王叔远，能以径寸之木，为宫室、器皿、人物，以至鸟兽、木石，罔不因势象形，各具情态。尝贻余核舟一，盖大苏泛赤壁云。舟首尾长约八分有奇，高可二黍许。中轩敞者为舱，箬篷覆之。旁开小窗，左右各四，共八扇。启窗而观，雕栏相望焉。闭之，则右刻“山高月小，水落石出”，左刻“清风徐来，水波不兴”，石青糁之。船头坐三人，中峨冠而多髯者为东坡，佛印居右，鲁直居左。苏、黄共阅一手卷。东坡右手执卷端，左手抚鲁直背。鲁直左手执卷末，右手指卷，如有所语。东坡现右足，鲁直现左足，各微侧，其两膝相比者，各隐卷底衣褶中。佛印绝类弥勒，袒胸露乳，矫首昂视，神情与苏、黄不属。卧右膝，诎右臂支船，而竖其左膝，左臂挂念珠倚之——珠可历历数也。"],"hard":"洢（yī）、皿（mǐn）、罔（wǎng）、贻（yí）、有（yòu，通“又”）、黍、（shǔ）、轩（xuān）、箬（ruò）、篷（péng）、糁（sǎn）、髯（rán）、褶（zhě）、弥、（mí）、袒（tǎn）、矫（jiǎo）、诎（qū）","hardList":[{"zi":"洢","py":"yī"},{"zi":"皿","py":"mǐn"},{"zi":"罔","py":"wǎng"},{"zi":"贻","py":"yí"},{"zi":"有","py":"yòu，通“又”"},{"zi":"轩","py":"xuān"},{"zi":"箬","py":"ruò"},{"zi":"篷","py":"péng"},{"zi":"糁","py":"sǎn"},{"zi":"髯","py":"rán"},{"zi":"褶","py":"zhě"},{"zi":"袒","py":"tǎn"},{"zi":"矫","py":"jiǎo"},{"zi":"诎","py":"qū"}],"len":259},{"no":9,"title":"北冥有鱼","author":"《庄子》","type":"文言文","paras":["北冥有鱼，其名为鲲。鲲之大，不知其几千里也；化而为鸟，其名为鹏。鹏之背，不知其几千里也；怒而飞，其翼若垂天之云。是鸟也，海运则将徙于南冥。南冥者，天池也。《齐谐》者，志怪者也。《谐》之言曰：“鹏之徙于南冥也，水击三千里，抟扶摇而上者九万里，去以六月息者也。”野马也，尘埃也，生物之以息相吹也。天之苍苍，其正色邪？其远而无所至极邪？其视下也，亦若是则已矣。"],"hard":"冥（míng）、鲲（kūn）、鹏（péng）、徙（xǐ）、谐（xié）、抟（tuán）、、邪（yé）","hardList":[{"zi":"冥","py":"míng"},{"zi":"鲲","py":"kūn"},{"zi":"鹏","py":"péng"},{"zi":"徙","py":"xǐ"},{"zi":"谐","py":"xié"},{"zi":"抟","py":"tuán"},{"zi":"邪","py":"yé"}],"len":144},{"no":10,"title":"虽有嘉肴","author":"《礼记》","type":"文言文","paras":["虽有嘉肴，弗食，不知其旨也；虽有至道，弗学，不知其善也。是故学然后知不足，教然后知困。知不足，然后能自反也；知困，然后能自强也。故曰：教学相长也。《兑命》曰：“学学半。”其此之谓乎！"],"hard":"肴（yáo）、弗（fú）、旨（zhǐ）、兑（yuè，通“说”）、学（xiào，通、“敩”，教导）","hardList":[{"zi":"肴","py":"yáo"},{"zi":"弗","py":"fú"},{"zi":"旨","py":"zhǐ"},{"zi":"兑","py":"yuè，通“说”"},{"zi":"学","py":"xiào，通、“敩”，教导"}],"len":72},{"no":11,"title":"马说","author":"唐·韩愈","type":"文言文","paras":["世有伯乐，然后有千里马。千里马常有，而伯乐不常有。故虽有名马，祗辱于奴隶人之手，骈死于槽枥之间，不以千里称也。马之千里者，一食或尽粟一石。食马者不知其能千里而食也。是马也，虽有千里之能，食不饱，力不足，才美不外见，且欲与常马等不可得，安求其能千里也？策之不以其道，食之不能尽其材，鸣之而不能通其意，执策而临之，曰：“天下无马！”呜呼！其真无马邪？其真不知马也！"],"hard":"祗（zhǐ）、骈（pián）、槽枥（cáo lì）、粟（sù）、食（sì，通、“饲”）、见（xiàn，通“现”）、邪（yé）","hardList":[{"zi":"祗","py":"zhǐ"},{"zi":"骈","py":"pián"},{"zi":"枥","py":"cáo lì"},{"zi":"粟","py":"sù"},{"zi":"食","py":"sì，通、“饲”"},{"zi":"见","py":"xiàn，通“现”"},{"zi":"邪","py":"yé"}],"len":153},{"no":12,"title":"茅屋为秋风所破歌","author":"唐·杜甫","type":"古诗","paras":["八月秋高风怒号，卷我屋上三重茅。茅飞渡江洒江郊，高者挂罥长林梢，下者飘转沉塘坳。南村群童欺我老无力，忍能对面为盗贼。公然抱茅入竹去，唇焦口燥呼不得，归来倚杖自叹息。俄顷风定云墨色，秋天漠漠向昏黑。布衾多年冷似铁，娇儿恶卧踏里裂。床头屋漏无干处，雨脚如麻未断绝。自经丧乱少睡眠，长夜沾湿何由彻！安得广厦千万间，大庇天下寒士俱欢颜！风雨不动安如山。呜呼！何时眼前突兀见此屋，吾庐独破受冻死亦足！"],"hard":"号（háo）、罥（juàn）、坳（ào）、燥（zào）、衾（qīn）、厦（shà）、庇、（bì）、突兀（tū wù）、见（xiàn，通“现”）","hardList":[{"zi":"号","py":"háo"},{"zi":"罥","py":"juàn"},{"zi":"坳","py":"ào"},{"zi":"燥","py":"zào"},{"zi":"衾","py":"qīn"},{"zi":"厦","py":"shà"},{"zi":"兀","py":"tū wù"},{"zi":"见","py":"xiàn，通“现”"}],"len":171},{"no":13,"title":"卖炭翁","author":"唐·白居易","type":"古诗","paras":["卖炭翁，伐薪烧炭南山中。满面尘灰烟火色，两鬓苍苍十指黑。卖炭得钱何所营？身上衣裳口中食。可怜身上衣正单，心忧炭贱愿天寒。夜来城外一尺雪，晓驾炭车辗冰辙。牛困人饥日已高，市南门外泥中歇。翩翩两骑来是谁？黄衣使者白衫儿。手把文书口称敕，回车叱牛牵向北。一车炭，千余斤，宫使驱将惜不得。半匹红纱一丈绫，系向牛头充炭直。"],"hard":"翁（wēng）、鬓（bìn）、辗（niǎn）、辙（zhé）、翩（piān）、敕、（chì）、叱（chì）、绫（líng）、直（zhí，通“值”）","hardList":[{"zi":"翁","py":"wēng"},{"zi":"鬓","py":"bìn"},{"zi":"辗","py":"niǎn"},{"zi":"辙","py":"zhé"},{"zi":"翩","py":"piān"},{"zi":"叱","py":"chì"},{"zi":"绫","py":"líng"},{"zi":"直","py":"zhí，通“值”"}],"len":135},{"no":14,"title":"题破山寺后禅院","author":"唐·常建","type":"古诗","paras":["清晨入古寺，初日照高林。曲径通幽处，禅房花木深。山光悦鸟性，潭影空人心。万籁此都寂，但余钟磬音。"],"hard":"禅（chán）、籁（lài）、磬（qìng）","hardList":[{"zi":"禅","py":"chán"},{"zi":"籁","py":"lài"},{"zi":"磬","py":"qìng"}],"len":40},{"no":15,"title":"送友人","author":"唐·李白","type":"古诗","paras":["青山横北郭，白水绕东城。此地一为别，孤蓬万里征。浮云游子意，落日故人情。挥手自兹去，萧萧班马鸣。"],"hard":"郭（guō）、蓬（péng）、兹（zī）、萧（xiāo）、班（bān）","hardList":[{"zi":"郭","py":"guō"},{"zi":"蓬","py":"péng"},{"zi":"兹","py":"zī"},{"zi":"萧","py":"xiāo"},{"zi":"班","py":"bān"}],"len":40},{"no":16,"title":"卜算子·咏梅","author":"宋·陆游","type":"词","paras":["驿外断桥边，寂寞开无主。已是黄昏独自愁，更著风和雨。无意苦争春，一任群芳妒。零落成泥碾作尘，只有香如故。"],"hard":"驿（yì）、著（zhuó）、妒（dù）、碾（niǎn）","hardList":[{"zi":"驿","py":"yì"},{"zi":"著","py":"zhuó"},{"zi":"妒","py":"dù"},{"zi":"碾","py":"niǎn"}],"len":44}]},{"volume":"九年级（上册）","items":[{"no":1,"title":"沁园春·雪","author":"毛泽东","type":"词","paras":["北国风光，千里冰封，万里雪飘。望长城内外，惟余莽莽；大河上下，顿失滔滔。山舞银蛇，原驰蜡象，欲与天公试比高。须晴日，看红装素裹，分外妖娆。江山如此多娇，引无数英雄竞折腰。惜秦皇汉武，略输文采；唐宗宋祖，稍逊风骚。一代天骄，成吉思汗，只识弯弓射大雕。俱往矣，数风流人物，还看今朝。"],"hard":"莽（mǎng）、滔（tāo）、娆（ráo）、娇（jiāo）、逊（xùn）、骚（sāo）、、骄（jiāo）、汗（hán）、雕（diāo）、俱（jù）","hardList":[{"zi":"莽","py":"mǎng"},{"zi":"滔","py":"tāo"},{"zi":"娆","py":"ráo"},{"zi":"娇","py":"jiāo"},{"zi":"逊","py":"xùn"},{"zi":"骚","py":"sāo"},{"zi":"骄","py":"jiāo"},{"zi":"汗","py":"hán"},{"zi":"雕","py":"diāo"},{"zi":"俱","py":"jù"}],"len":114},{"no":2,"title":"岳阳楼记","author":"宋·范仲淹","type":"文言文","paras":["庆历四年春，滕子京谪守巴陵郡。越明年，政通人和，百废具兴。乃重修岳阳楼，增其旧制，刻唐贤今人诗赋于其上。属予作文以记之。予观夫巴陵胜状，在洞庭一湖。衔远山，吞长江，浩浩汤汤，横无际涯；朝晖夕阴，气象万千。此则岳阳楼之大观也，前人之述备矣。然则北通巫峡，南极潇湘，迁客骚人，多会于此，览物之情，得无异乎？若夫霪雨霏霏，连月不开，阴风怒号，浊浪排空；日星隐耀，山岳潜形；商旅不行，樯倾楫摧；薄暮冥冥，虎啸猿啼。登斯楼也，则有去国怀乡，忧谗畏讥，满目萧然，感极而悲者矣。至若春和景明，波澜不惊，上下天光，一碧万顷；沙鸥翔集，锦鳞游泳；岸芷汀兰，郁郁青青。而或长烟一空，皓月千里，浮光跃金，静影沉璧，渔歌互答，此乐何极！登斯楼也，则有心旷神怡，宠辱偕忘，把酒临风，其喜洋洋者矣。嗟夫！予尝求古仁人之心，或异二者之为，何哉？不以物喜，不以己悲。居庙堂之高则忧其民，处江湖之远则忧其君。是进亦忧，退亦忧。然则何时而乐耶？其必曰“先天下之忧而忧，后天下之乐而乐”乎！噫！微斯人，吾谁与归？时六年九月十五日。"],"hard":"谪（zhé）、具（jù，通“俱”）、属（zhǔ，通“嘱”）、汤（shāng）、涯、（yá）、晖（huī）、潇（xiāo）、骚（sāo）、霪（yín）、号（háo）、耀（yào）、樯、（qiáng）、楫（jí）、冥（míng）、谗（chán）、讥（jī）、顷（qǐng）、芷（zhǐ）、汀、（tīng）、偕（xié）、嗟（jiē）、噫（yī）","hardList":[{"zi":"谪","py":"zhé"},{"zi":"具","py":"jù，通“俱”"},{"zi":"属","py":"zhǔ，通“嘱”"},{"zi":"汤","py":"shāng"},{"zi":"晖","py":"huī"},{"zi":"潇","py":"xiāo"},{"zi":"骚","py":"sāo"},{"zi":"霪","py":"yín"},{"zi":"号","py":"háo"},{"zi":"耀","py":"yào"},{"zi":"楫","py":"jí"},{"zi":"冥","py":"míng"},{"zi":"谗","py":"chán"},{"zi":"讥","py":"jī"},{"zi":"顷","py":"qǐng"},{"zi":"芷","py":"zhǐ"},{"zi":"偕","py":"xié"},{"zi":"嗟","py":"jiē"},{"zi":"噫","py":"yī"}],"len":370},{"no":3,"title":"醉翁亭记","author":"宋·欧阳修","type":"文言文","paras":["环滁皆山也。其西南诸峰，林壑尤美，望之蔚然而深秀者，琅琊也。山行六七里，渐闻水声潺潺，而泻出于两峰之间者，酿泉也。峰回路转，有亭翼然临于泉上者，醉翁亭也。作亭者谁？山之僧智仙也。名之者谁？太守自谓也。太守与客来饮于此，饮少辄醉，而年又最高，故自号曰醉翁也。醉翁之意不在酒，在乎山水之间也。山水之乐，得之心而寓之酒也。若夫日出而林霏开，云归而岩穴暝，晦明变化者，山间之朝暮也。野芳发而幽香，佳木秀而繁阴，风霜高洁，水落而石出者，山间之四时也。朝而往，暮而归，四时之景不同，而乐亦无穷也。至于负者歌于途，行者休于树，前者呼，后者应，伛偻提携，往来而不绝者，滁人游也。临溪而渔，溪深而鱼肥；酿泉为酒，泉香而酒洌；山肴野蔌，杂然而前陈者，太守宴也。宴酣之乐，非丝非竹，射者中，弈者胜，觥筹交错，起坐而喧哗者，众宾欢也。苍颜白发，颓然乎其间者，太守醉也。已而夕阳在山，人影散乱，太守归而宾客从也。树林阴翳，鸣声上下，游人去而禽鸟乐也。然而禽鸟知山林之乐，而不知人之乐；人知从太守游而乐，而不知太守之乐其乐也。醉能同其乐，醒能述以文者，太守也。太守谓谁？庐陵欧阳修也。"],"hard":"滁（chú）、壑（hè）、蔚（wèi）、琅琊（láng yá）、潺（chán）、辄、（zhé）、霏（fēi）、暝（míng）、伛偻（yǔ lǚ）、洌（liè）、蔌（sù）、弈（yì）、觥、（gōng）、筹（chóu）、颓（tuí）、翳（yì）、庐（lú）","hardList":[{"zi":"滁","py":"chú"},{"zi":"壑","py":"hè"},{"zi":"蔚","py":"wèi"},{"zi":"琊","py":"láng yá"},{"zi":"潺","py":"chán"},{"zi":"霏","py":"fēi"},{"zi":"暝","py":"míng"},{"zi":"偻","py":"yǔ lǚ"},{"zi":"洌","py":"liè"},{"zi":"蔌","py":"sù"},{"zi":"弈","py":"yì"},{"zi":"筹","py":"chóu"},{"zi":"颓","py":"tuí"},{"zi":"翳","py":"yì"},{"zi":"庐","py":"lú"}],"len":402},{"no":4,"title":"湖心亭看雪","author":"明·张岱","type":"文言文","paras":["崇祯五年十二月，余住西湖。大雪三日，湖中人鸟声俱绝。是日更定矣，余拏一小舟，拥毳衣炉火，独往湖心亭看雪。雾凇沆砀，天与云与山与水，上下一白。湖上影子，惟长堤一痕、湖心亭一点、与余舟一芥、舟中人两三粒而已。到亭上，有两人铺毡对坐，一童子烧酒炉正沸。见余大喜曰：“湖中焉得更有此人！”拉余同饮。余强饮三大白而别。问其姓氏，是金陵人，客此。及下船，舟子喃喃曰：“莫说相公痴，更有痴似相公者。”"],"hard":"岱（dài）、崇祯（chóng zhēn）、拏（ná）、毳（cuì）、凇（sōng）、沆砀、（hàng dàng）、芥（jiè）、毡（zhān）、强（qiǎng）、喃（nán）、痴（chī）","hardList":[{"zi":"岱","py":"dài"},{"zi":"祯","py":"chóng zhēn"},{"zi":"拏","py":"ná"},{"zi":"毳","py":"cuì"},{"zi":"凇","py":"sōng"},{"zi":"芥","py":"jiè"},{"zi":"毡","py":"zhān"},{"zi":"强","py":"qiǎng"},{"zi":"喃","py":"nán"},{"zi":"痴","py":"chī"}],"len":163},{"no":5,"title":"行路难（其一）","author":"唐·李白","type":"古诗","paras":["金樽清酒斗十千，玉盘珍羞直万钱。停杯投箸不能食，拔剑四顾心茫然。欲渡黄河冰塞川，将登太行雪满山。闲来垂钓碧溪上，忽复乘舟梦日边。行路难，行路难，多歧路，今安在？长风破浪会有时，直挂云帆济沧海。"],"hard":"樽（zūn）、羞（xiū，通“馐”）、直（zhí，通“值”）、箸（zhù）、塞、（sè）、歧（qí）、沧（cāng）","hardList":[{"zi":"樽","py":"zūn"},{"zi":"羞","py":"xiū，通“馐”"},{"zi":"直","py":"zhí，通“值”"},{"zi":"箸","py":"zhù"},{"zi":"歧","py":"qí"},{"zi":"沧","py":"cāng"}],"len":82},{"no":6,"title":"酬乐天扬州初逢席上见赠","author":"唐·刘禹锡","type":"古诗","paras":["巴山楚水凄凉地，二十三年弃置身。怀旧空吟闻笛赋，到乡翻似烂柯人。沉舟侧畔千帆过，病树前头万木春。今日听君歌一曲，暂凭杯酒长精神。"],"hard":"酬（chóu）、赋（fù）、柯（kē）、畔（pàn）、暂（zàn）、凭（píng）","hardList":[{"zi":"酬","py":"chóu"},{"zi":"赋","py":"fù"},{"zi":"柯","py":"kē"},{"zi":"畔","py":"pàn"},{"zi":"暂","py":"zàn"},{"zi":"凭","py":"píng"}],"len":56},{"no":7,"title":"水调歌头（明月几时有）","author":"宋·苏轼","type":"词","paras":["丙辰中秋，欢饮达旦，大醉，作此篇，兼怀子由。明月几时有？把酒问青天。不知天上宫阙，今夕是何年。我欲乘风归去，又恐琼楼玉宇，高处不胜寒。起舞弄清影，何似在人间。转朱阁，低绮户，照无眠。不应有恨，何事长向别时圆？人有悲欢离合，月有阴晴圆缺，此事古难全。但愿人长久，千里共婵娟。"],"hard":"阙（què）、琼（qióng）、胜（shēng，承受）、绮（qǐ）、婵娟（chán、juān）","hardList":[{"zi":"阙","py":"què"},{"zi":"琼","py":"qióng"},{"zi":"胜","py":"shēng，承受"},{"zi":"绮","py":"qǐ"},{"zi":"娟","py":"chán、juān"}],"len":112},{"no":8,"title":"月夜忆舍弟","author":"唐·杜甫","type":"古诗","paras":["戍鼓断人行，边秋一雁声。露从今夜白，月是故乡明。有弟皆分散，无家问死生。寄书长不达，况乃未休兵。"],"hard":"戍（shù）、雁（yàn）、达（dá）、况（kuàng）","hardList":[{"zi":"戍","py":"shù"},{"zi":"雁","py":"yàn"},{"zi":"达","py":"dá"},{"zi":"况","py":"kuàng"}],"len":40},{"no":9,"title":"长沙过贾谊宅","author":"唐·刘长卿","type":"古诗","paras":["三年谪宦此栖迟，万古惟留楚客悲。秋草独寻人去后，寒林空见日斜时。汉文有道恩犹薄，湘水无情吊岂知。","寂寂江山摇落处，怜君何事到天涯。"],"hard":"谊（yì）、谪（zhé）、宦（huàn）、栖（qī）、薄（bó）、吊（diào）、寂、（jì）、涯（yá）","hardList":[{"zi":"谊","py":"yì"},{"zi":"谪","py":"zhé"},{"zi":"宦","py":"huàn"},{"zi":"栖","py":"qī"},{"zi":"薄","py":"bó"},{"zi":"吊","py":"diào"},{"zi":"涯","py":"yá"}],"len":56},{"no":10,"title":"左迁至蓝关示侄孙湘","author":"唐·韩愈","type":"古诗","paras":["一封朝奏九重天，夕贬潮州路八千。欲为圣明除弊事，肯将衰朽惜残年！云横秦岭家何在？雪拥蓝关马不前。知汝远来应有意，好收吾骨瘴江边。"],"hard":"贬（biǎn）、弊（bì）、朽（xiǔ）、瘴（zhàng）","hardList":[{"zi":"贬","py":"biǎn"},{"zi":"弊","py":"bì"},{"zi":"朽","py":"xiǔ"},{"zi":"瘴","py":"zhàng"}],"len":56},{"no":11,"title":"商山早行","author":"唐·温庭筠","type":"古诗","paras":["晨起动征铎，客行悲故乡。鸡声茅店月，人迹板桥霜。槲叶落山路，枳花明驿墙。因思杜陵梦，凫雁满回塘。"],"hard":"筠（yún）、铎（duó）、茅（máo）、槲（hú）、枳（zhǐ）、驿（yì）、凫、（fú）","hardList":[{"zi":"筠","py":"yún"},{"zi":"铎","py":"duó"},{"zi":"茅","py":"máo"},{"zi":"槲","py":"hú"},{"zi":"枳","py":"zhǐ"},{"zi":"驿","py":"yì"}],"len":40},{"no":12,"title":"无题","author":"唐·李商隐","type":"古诗","paras":["相见时难别亦难，东风无力百花残。春蚕到死丝方尽，蜡炬成灰泪始干。晓镜但愁云鬓改，夜吟应觉月光寒。蓬山此去无多路，青鸟殷勤为探看。"],"hard":"隐（yǐn）、蚕（cán）、炬（jù）、鬓（bìn）、吟（yín）、蓬（péng）、殷、（yīn）","hardList":[{"zi":"隐","py":"yǐn"},{"zi":"蚕","py":"cán"},{"zi":"炬","py":"jù"},{"zi":"鬓","py":"bìn"},{"zi":"吟","py":"yín"},{"zi":"蓬","py":"péng"}],"len":56}]},{"volume":"九年级（下册）","items":[{"no":1,"title":"鱼我所欲也","author":"《孟子》","type":"文言文","paras":["鱼，我所欲也；熊掌，亦我所欲也。二者不可得兼，舍鱼而取熊掌者也。生，亦我所欲也；义，亦我所欲也。二者不可得兼，舍生而取义者也。生亦我所欲，所欲有甚于生者，故不为苟得也；死亦我所恶，所恶有甚于死者，故患有所不辟也。如使人之所欲莫甚于生，则凡可以得生者何不用也？使人之所恶莫甚于死者，则凡可以辟患者何不为也？由是则生而有不用也，由是则可以辟患而有不为也。是故所欲有甚于生者，所恶有甚于死者。非独贤者有是心也，人皆有之，贤者能勿丧耳。一箪食，一豆羹，得之则生，弗得则死。呼尔而与之，行道之人弗受；蹴尔而与之，乞人不屑也。万钟则不辩礼义而受之，万钟于我何加焉！为宫室之美，妻妾之奉，所识穷乏者得我与？乡为身死而不受，今为宫室之美为之；乡为身死而不受，今为妻妾之奉为之；乡为身死而不受，今为所识穷乏者得我而为之：是亦不可以已乎？此之谓失其本心。"],"hard":"兼（jiān）、苟（gǒu）、辟（bì，通“避”）、箪（dān）、羹（gēng）、蹴、（cù）、屑（xiè）、辩（biàn，通“辨”）、乡（xiàng，通“向”）、乏（fá）、得（dé，、通“德”）、与（yú，通“欤”）","hardList":[{"zi":"兼","py":"jiān"},{"zi":"苟","py":"gǒu"},{"zi":"辟","py":"bì，通“避”"},{"zi":"箪","py":"dān"},{"zi":"羹","py":"gēng"},{"zi":"屑","py":"xiè"},{"zi":"辩","py":"biàn，通“辨”"},{"zi":"乡","py":"xiàng，通“向”"},{"zi":"乏","py":"fá"},{"zi":"得","py":"dé，、通“德”"},{"zi":"与","py":"yú，通“欤”"}],"len":317},{"no":2,"title":"曹刿论战","author":"《左传》","type":"文言文","paras":["十年春，齐师伐我。公将战，曹刿请见。其乡人曰：“肉食者谋之，又何间焉？”刿曰：“肉食者鄙，未能远谋。”乃入见。问：“何以战？”公曰：“衣食所安，弗敢专也，必以分人。”对曰：“小惠未遍，民弗从也。”公曰：“牺牲玉帛，弗敢加也，必以信。”对曰：“小信未孚，神弗福也。”公曰：“小大之狱，虽不能察，必以情。”对曰：“忠之属也。可以一战。战则请从。”公与之乘，战于长勺。公将鼓之。刿曰：“未可。”齐人三鼓。刿曰：“可矣。”齐师败绩。公将驰之。刿曰：“未可。”下视其辙，登轼而望之，曰：“可矣。”遂逐齐师。既克，公问其故。对曰：“夫战，勇气也。一鼓作气，再而衰，三而竭。彼竭我盈，故克之。夫大国，难测也，惧有伏焉。吾视其辙乱，望其旗靡，故逐之。”"],"hard":"刿（guì）、间（jiàn）、鄙（bǐ）、帛（bó）、孚（fú）、狱（yù）、勺、（sháo）、辙（zhé）、轼（shì）、靡（mǐ）","hardList":[{"zi":"刿","py":"guì"},{"zi":"间","py":"jiàn"},{"zi":"鄙","py":"bǐ"},{"zi":"帛","py":"bó"},{"zi":"孚","py":"fú"},{"zi":"狱","py":"yù"},{"zi":"辙","py":"zhé"},{"zi":"轼","py":"shì"},{"zi":"靡","py":"mǐ"}],"len":250},{"no":3,"title":"出师表","author":"三国·诸葛亮","type":"文言文","paras":["先帝创业未半而中道崩殂，今天下三分，益州疲弊，此诚危急存亡之秋也。然侍卫之臣不懈于内，忠志之士忘身于外者，盖追先帝之殊遇，欲报之于陛下也。诚宜开张圣听，以光先帝遗德，恢弘志士之气，不宜妄自菲薄，引喻失义，以塞忠谏之路也。宫中府中，俱为一体，陟罚臧否，不宜异同。若有作奸犯科及为忠善者，宜付有司论其刑赏，以昭陛下平明之理，不宜偏私，使内外异法也。侍中、侍郎郭攸之、费祎、董允等，此皆良实，志虑忠纯，是以先帝简拔以遗陛下。愚以为宫中之事，事无大小，悉以咨之，然后施行，必能裨补阙漏，有所广益。将军向宠，性行淑均，晓畅军事，试用于昔日，先帝称之曰能，是以众议举宠为督。愚以为营中之事，悉以咨之，必能使行阵和睦，优劣得所。亲贤臣，远小人，此先汉所以兴隆也；亲小人，远贤臣，此后汉所以倾颓也。先帝在时，每与臣论此事，未尝不叹息痛恨于桓、灵也。侍中、尚书、长史、参军，此悉贞良死节之臣，愿陛下亲之信之，则汉室之隆，可计日而待也。臣本布衣，躬耕于南阳，苟全性命于乱世，不求闻达于诸侯。先帝不以臣卑鄙，猥自枉屈，三顾臣于草庐之中，咨臣以当世之事，由是感激，遂许先帝以驱驰。后值倾覆，受任于败军之际，奉命于危难之间，尔来二十有一年矣。","先帝知臣谨慎，故临崩寄臣以大事也。受命以来，夙夜忧叹，恐托付不效，以伤先帝之明，故五月渡泸，深入不毛。今南方已定，兵甲已足，当奖率三军，北定中原，庶竭驽钝，攘除奸凶，兴复汉室，还于旧都。此臣所以报先帝而忠陛下之职分也。至于斟酌损益，进尽忠言，则攸之、祎、允之任也。愿陛下托臣以讨贼兴复之效，不效，则治臣之罪，以告先帝之灵。若无兴德之言，则责攸之、祎、允等之慢，以彰其咎。陛下亦宜自谋，以咨诹善道，察纳雅言，深追先帝遗诏。臣不胜受恩感激。今当远离，临表涕零，不知所言。"],"hard":"殂（cú）、弊（bì）、懈（xiè）、恢（huī）、妄（wàng）、菲（fěi）、谏、（jiàn）、陟（zhì）、臧否（zāng pǐ）、攸（yōu）、祎（yī）、遗（wèi，赠送）、咨、（zī）、裨（bì）、阙（quē）、淑（shū）、颓（tuí）、桓（huán）、猥（wěi）、有（yòu，、通“又”）、夙（sù）、泸（lú）、驽（nú）、钝（dùn）、攘（rǎng）、斟（zhēn）、酌、（zhuó）、彰（zhāng）、咎（jiù）、诹（zōu）","hardList":[{"zi":"殂","py":"cú"},{"zi":"弊","py":"bì"},{"zi":"懈","py":"xiè"},{"zi":"恢","py":"huī"},{"zi":"妄","py":"wàng"},{"zi":"菲","py":"fěi"},{"zi":"陟","py":"zhì"},{"zi":"否","py":"zāng pǐ"},{"zi":"攸","py":"yōu"},{"zi":"祎","py":"yī"},{"zi":"遗","py":"wèi，赠送"},{"zi":"裨","py":"bì"},{"zi":"阙","py":"quē"},{"zi":"淑","py":"shū"},{"zi":"颓","py":"tuí"},{"zi":"桓","py":"huán"},{"zi":"猥","py":"wěi"},{"zi":"有","py":"yòu，、通“又”"},{"zi":"夙","py":"sù"},{"zi":"泸","py":"lú"},{"zi":"驽","py":"nú"},{"zi":"钝","py":"dùn"},{"zi":"攘","py":"rǎng"},{"zi":"斟","py":"zhēn"},{"zi":"彰","py":"zhāng"},{"zi":"咎","py":"jiù"},{"zi":"诹","py":"zōu"}],"len":624},{"no":4,"title":"送东阳马生序","author":"明·宋濂","type":"文言文","paras":["余幼时即嗜学。家贫，无从致书以观，每假借于藏书之家，手自笔录，计日以还。天大寒，砚冰坚，手指不可屈伸，弗之怠。录毕，走送之，不敢稍逾约。以是人多以书假余，余因得遍观群书。既加冠，益慕圣贤之道。又患无硕师名人与游，尝趋百里外，从乡之先达执经叩问。先达德隆望尊，门人弟子填其室，未尝稍降辞色。余立侍左右，援疑质理，俯身倾耳以请；或遇其叱咄，色愈恭，礼愈至，不敢出一言以复；俟其欣悦，则又请焉。故余虽愚，卒获有所闻。当余之从师也，负箧曳屣行深山巨谷中。穷冬烈风，大雪深数尺，足肤皲裂而不知。至舍，四支僵劲不能动，媵人持汤沃灌，以衾拥覆，久而乃和。寓逆旅，主人日再食，无鲜肥滋味之享。同舍生皆被绮绣，戴朱缨宝饰之帽，腰白玉之环，左佩刀，右备容臭，烨然若神人；余则缊袍敝衣处其间，略无慕艳意，以中有足乐者，不知口体之奉不若人也。盖余之勤且艰若此。"],"hard":"濂（lián）、嗜（shì）、砚（yàn）、弗（fú）、怠（dài）、逾（yú）、冠、（guān）、硕（shuò）、趋（qū）、叩（kòu）、填（tián）、援（yuán）、叱咄（chì、duō）、俟（sì）、卒（zú）、箧（qiè）、曳（yè）、屣（xǐ）、皲（jūn）、媵（yìng）、衾、（qīn）、食（sì）、被（pī，通“披”）、绮（qǐ）、缨（yīng）、烨（yè）、缊（yùn）、、敝（bì）","hardList":[{"zi":"濂","py":"lián"},{"zi":"嗜","py":"shì"},{"zi":"砚","py":"yàn"},{"zi":"弗","py":"fú"},{"zi":"怠","py":"dài"},{"zi":"逾","py":"yú"},{"zi":"硕","py":"shuò"},{"zi":"趋","py":"qū"},{"zi":"叩","py":"kòu"},{"zi":"填","py":"tián"},{"zi":"援","py":"yuán"},{"zi":"咄","py":"chì、duō"},{"zi":"俟","py":"sì"},{"zi":"卒","py":"zú"},{"zi":"箧","py":"qiè"},{"zi":"曳","py":"yè"},{"zi":"屣","py":"xǐ"},{"zi":"皲","py":"jūn"},{"zi":"媵","py":"yìng"},{"zi":"食","py":"sì"},{"zi":"被","py":"pī，通“披”"},{"zi":"绮","py":"qǐ"},{"zi":"缨","py":"yīng"},{"zi":"烨","py":"yè"},{"zi":"缊","py":"yùn"},{"zi":"敝","py":"bì"}],"len":310},{"no":5,"title":"白雪歌送武判官归京","author":"唐·岑参","type":"古诗","paras":["北风卷地白草折，胡天八月即飞雪。忽如一夜春风来，千树万树梨花开。散入珠帘湿罗幕，狐裘不暖锦衾薄。","将军角弓不得控，都护铁衣冷难着。瀚海阑干百丈冰，愁云惨淡万里凝。中军置酒饮归客，胡琴琵琶与羌笛。纷纷暮雪下辕门，风掣红旗冻不翻。轮台东门送君去，去时雪满天山路。山回路转不见君，雪上空留马行处。"],"hard":"衾（qīn）、着（zhuó，穿）、瀚（hàn）、阑（lán）、琵琶（pí pá）、羌、（qiāng）、辕（yuán）、掣（chè）","hardList":[{"zi":"衾","py":"qīn"},{"zi":"着","py":"zhuó，穿"},{"zi":"瀚","py":"hàn"},{"zi":"阑","py":"lán"},{"zi":"琶","py":"pí pá"},{"zi":"辕","py":"yuán"},{"zi":"掣","py":"chè"}],"len":126},{"no":6,"title":"过零丁洋","author":"宋·文天祥","type":"古诗","paras":["辛苦遭逢起一经，干戈寥落四周星。山河破碎风飘絮，身世浮沉雨打萍。惶恐滩头说惶恐，零丁洋里叹零丁。人生自古谁无死，留取丹心照汗青。"],"hard":"寥（liáo）、絮（xù）、萍（píng）、惶（huáng）、汗青（hàn qīng，史、册）","hardList":[{"zi":"寥","py":"liáo"},{"zi":"絮","py":"xù"},{"zi":"萍","py":"píng"},{"zi":"惶","py":"huáng"},{"zi":"青","py":"hàn qīng，史、册"}],"len":56},{"no":7,"title":"山坡羊·潼关怀古","author":"元·张养浩","type":"曲","paras":["峰峦如聚，波涛如怒，山河表里潼关路。望西都，意踌躇。伤心秦汉经行处，宫阙万间都做了土。兴，百姓苦；亡，百姓苦。"],"hard":"潼（tóng）、峦（luán）、踌躇（chóu chú）、阙（què）","hardList":[{"zi":"潼","py":"tóng"},{"zi":"峦","py":"luán"},{"zi":"躇","py":"chóu chú"},{"zi":"阙","py":"què"}],"len":44},{"no":8,"title":"南乡子·登京口北固亭有怀","author":"宋·辛弃疾","type":"词","paras":["何处望神州？满眼风光北固楼。千古兴亡多少事？悠悠。不尽长江滚滚流。年少万兜鍪，坐断东南战未休。天下英雄谁敌手？曹刘。生子当如孙仲谋。"],"hard":"兜鍪（dōu móu）","hardList":[{"zi":"鍪","py":"dōu móu"}],"len":56},{"no":9,"title":"破阵子·为陈同甫赋壮词以寄之","author":"宋·辛弃疾","type":"词","paras":["醉里挑灯看剑，梦回吹角连营。八百里分麾下炙，五十弦翻塞外声，沙场秋点兵。马作的卢飞快，弓如霹雳弦惊。了却君王天下事，赢得生前身后名。可怜白发生！"],"hard":"麾（huī）、炙（zhì）、弦（xián）、霹雳（pī lì）、赢（yíng）","hardList":[{"zi":"麾","py":"huī"},{"zi":"炙","py":"zhì"},{"zi":"弦","py":"xián"},{"zi":"雳","py":"pī lì"},{"zi":"赢","py":"yíng"}],"len":62},{"no":10,"title":"临江仙·夜登小阁，忆洛中旧游","author":"宋·陈与义","type":"词","paras":["忆昔午桥桥上饮，坐中多是豪英。长沟流月去无声。杏花疏影里，吹笛到天明。二十余年如一梦，此身虽在堪惊。闲登小阁看新晴。古今多少事，渔唱起三更。"],"hard":"堪（kān）、渔（yú）","hardList":[{"zi":"堪","py":"kān"},{"zi":"渔","py":"yú"}],"len":60},{"no":11,"title":"江城子·密州出猎","author":"宋·苏轼","type":"词","paras":["老夫聊发少年狂，左牵黄，右擎苍。锦帽貂裘，千骑卷平冈。为报倾城随太守，亲射虎，看孙郎。酒酣胸胆尚开张，鬓微霜，又何妨！持节云中，何日遣冯唐？会挽雕弓如满月，西北望，射天狼。"],"hard":"聊（liáo）、擎（qíng）、貂（diāo）、裘（qiú）、骑（jì，一人一马）、、冈（gāng）、酣（hān）、鬓（bìn）、妨（fáng）、遣（qiǎn）、挽（wǎn）、雕（diāo）","hardList":[{"zi":"聊","py":"liáo"},{"zi":"擎","py":"qíng"},{"zi":"貂","py":"diāo"},{"zi":"裘","py":"qiú"},{"zi":"骑","py":"jì，一人一马"},{"zi":"冈","py":"gāng"},{"zi":"酣","py":"hān"},{"zi":"鬓","py":"bìn"},{"zi":"妨","py":"fáng"},{"zi":"遣","py":"qiǎn"},{"zi":"挽","py":"wǎn"},{"zi":"雕","py":"diāo"}],"len":70},{"no":12,"title":"定风波（莫听穿林打叶声）","author":"宋·苏轼","type":"词","paras":["莫听穿林打叶声，何妨吟啸且徐行。竹杖芒鞋轻胜马，谁怕？一蓑烟雨任平生。料峭春风吹酒醒，微冷，山头斜照却相迎。回首向来萧瑟处，归去，也无风雨也无晴。"],"hard":"妨（fáng）、吟（yín）、啸（xiào）、芒（máng）、蓑（suō）、峭、（qiào）、萧（xiāo）、瑟（sè）","hardList":[{"zi":"妨","py":"fáng"},{"zi":"吟","py":"yín"},{"zi":"啸","py":"xiào"},{"zi":"芒","py":"máng"},{"zi":"蓑","py":"suō"},{"zi":"萧","py":"xiāo"},{"zi":"瑟","py":"sè"}],"len":62},{"no":13,"title":"太常引·建康中秋夜为吕叔潜赋","author":"宋·辛弃疾","type":"词","paras":["一轮秋影转金波，飞镜又重磨。把酒问姮娥：被白发，欺人奈何？乘风好去，长空万里，直下看山河。斫去桂婆娑，人道是，清光更多。"],"hard":"姮（héng）、斫（zhuó）、婆娑（pó suō）","hardList":[{"zi":"姮","py":"héng"},{"zi":"斫","py":"zhuó"},{"zi":"娑","py":"pó suō"}],"len":49},{"no":14,"title":"浣溪沙（身向云山那畔行）","author":"清·纳兰性德","type":"词","paras":["身向云山那畔行，北风吹断马嘶声，深秋远塞若为情！一抹晚烟荒戍垒，半竿斜日旧关城。古今幽恨几时平！"],"hard":"纳兰（nà lán）、畔（pàn）、嘶（sī）、戍（shù）、垒（lěi）、幽、（yōu）","hardList":[{"zi":"兰","py":"nà lán"},{"zi":"畔","py":"pàn"},{"zi":"嘶","py":"sī"},{"zi":"戍","py":"shù"},{"zi":"垒","py":"lěi"}],"len":42}]}];
const NOTES = {"宿建德江::0":{"why":"提示句「移舟泊烟渚，日暮客愁新」已经点出「愁」——夜泊、日暮，旅人的愁绪刚刚生出。愁绪总要有落点，所以后两句把镜头推开：写空旷的天、清亮的江、逼近的月，用景把这份愁托住。","mean":"原野空旷，远处的天显得比树还低；江水清澈，月影仿佛离人更近了。","hard":"「旷」是「日＋广」，别写成「矿」；「低」右边是「氐」，不是「氏」。","point":"以景结情。远望「天低树」见孤寂，近看「月近人」得慰藉，一远一近反衬羁旅之愁。"},"六月二十七日望湖楼醉书::0":{"why":"提示句写了「黑云翻墨」「白雨跳珠」，是这场急雨的「来」；一场骤雨必有「去」。四句按「云—雨—风—晴」的顺序推进，最后必然落在风吹云散、湖面复归平静的景象上。","mean":"忽然一阵卷地大风把云雨吹散，望湖楼下水面平静，天光水色连成一片。","hard":"「遮」走之底；「卷」此处读 juǎn，不读 juàn。","point":"「翻墨」「跳珠」两个比喻写急雨来势；「水如天」以夸张写雨后澄澈，是常考的画面描述题。"},"西江月·夜行黄沙道中::1":{"why":"下片先写「七八个星天外，两三点雨山前」，星稀雨来，正是夜行人最焦急的时候；一个「转」、一个「忽见」，把焦急一下转成惊喜——熟悉的茅店忽然出现，全词的落点就在这一转。","mean":"往日社林边的那家茅店，转过溪桥，忽然出现在眼前。","hard":"「茅」草字头下面是个「矛」；「见」此处读 xiàn，通「现」。","point":"通假字「见」＝现；「忽见」二字写意外之喜，是词的转折处。常考通假与情感变化。"},"浪淘沙（其一）::0":{"why":"前两句写黄河的曲、沙、浪、簸，落点收在「自天涯」——黄河从极远处来。既然来处在天上，顺着它往上游走就很自然「直上银河」；答句用神话收尾，是全诗想象最奇的一笔。","mean":"如今我要沿着黄河直上银河去，一起到牛郎织女的家。","hard":"「簸」读 bǒ，上「箕」下「皮」；「涯」三点水，别写成「崖」。","point":"由实入虚、融入牛郎织女的神话，写豪迈气概。常考「想象」手法与「银河」典故。"},"江南春::0":{"why":"前两句写千里江南的明媚声色，是眼前「晴」的一面；答句引入「南朝」「四百八十寺」的历史，再用「烟雨中」蒙上一层朦胧。由眼前之景转入对历史的感慨，是绝句常见的收束方式。","mean":"南朝留下了那么多寺庙，如今有多少楼台笼罩在迷蒙的烟雨之中。","hard":"「莺」草字头下是「冖＋鸟」，别写成「鹰」；「郭」右耳旁。","point":"前两句明丽、后两句朦胧，形成对比；「多少」二字含讽刺与沧桑感，是高频赏析句。"},"书湖阴先生壁::0":{"why":"前两句写院「内」——檐下扫得干净、花木亲手栽种，是主人的勤与雅；院内写完，视线自然转到院外，于是有「一水」「两山」来「护田」「送青」。由近及远、由内到外，答句正是把山水写活的神来之笔。","mean":"一条溪水环绕护卫着绿油油的田地，两座青山推门而入，送来满眼青翠。","hard":"「檐」木字旁；「畦」田字旁，读 qí；「闼」门字框里是「达」，读 tà。","point":"拟人（护、绕、排、送）＋用典（排闼）；四个动词连用，是中考高频赏析点。"},"七律·长征::0":{"why":"中间两联写山、写水，「云崖暖」「铁索寒」已经把长征的万般艰难写尽；艰难写完了，剩下的只有「翻过最后一座大雪山」的胜利。所以全诗必然以「岷山」「尽开颜」收束，把情绪从艰难推向昂扬。","mean":"更让人欢喜的是翻越千里积雪的岷山，红军过后个个笑逐颜开。","hard":"「岷」山字旁；「崖」是「山＋厓」，注意不要漏笔。","point":"「更喜」「尽开颜」是全诗情感的最高点，与首联的「不怕」「等闲」遥相呼应。"},"伯牙鼓琴::0":{"why":"前面两轮「志在太山」「志在流水」写的是「有知音」——琴声一起，子期就懂；答句写子期死后「破琴绝弦」「终身不复鼓琴」，写的是「失知音」。前文相知写得越深，后文痛绝才越重，文章必须有一个结果句来交代这份情的结局。","mean":"锺子期死后，伯牙摔破琴、扯断弦，一辈子不再弹琴，认为世上再没有值得为之弹琴的人了。","hard":"「锺」金字旁（姓氏用字，不写「钟」）；「弦」左边是「弓」；「汤」此处读 shāng，形容水势浩大。","point":"知音难觅，以「绝弦」这一行为写情谊之深；「汤汤」的读音与释义是高频考点。"},"迢迢牵牛星::0":{"why":"前面写牛郎织女隔着银河，「河汉清且浅，相去复几许」已经把矛盾点明——不是距离远，而是近在咫尺却不能相见；答句用「盈盈一水」「脉脉不得语」把这份矛盾落到画面上，正是全诗的收束。","mean":"只隔着清浅的一条银河，却只能含情相望，不能说一句话。","hard":"「盈」上部注意不要写错；「脉脉」此处读 mò mò，不读 mài。","point":"六个叠词（迢迢、皎皎、纤纤、札札、盈盈、脉脉）是考点；以牛郎织女喻人间离别之苦。"},"竹石::0":{"why":"前两句写「根」——咬定青山、立根破岩，是写竹子的立身；有了这样的根，才有后两句的「坚劲」。答句从「磨」「击」「风」三面来试它，正面点出刚劲不屈，是咏物言志的落点。","mean":"经受千万次折磨打击反而更加坚韧刚劲，任凭你东西南北四面狂风。","hard":"「磨」下面是「石」；「劲」左边是「巠」，注意笔顺。","point":"托物言志，以竹自喻写刚正不阿、不随波逐流。中考名句默写高频。"},"回乡偶书（其一）::0":{"why":"前两句从「少小」到「老大」、从「乡音无改」到「鬓毛衰」，写的是时间带来的变化；而变化需要有人来见证、来发问。于是第三句引入「儿童」，「不相识」再加一个「笑问」，久客伤老之情全托在这一句上。","mean":"家乡的孩子见了我都不认识，笑着问这位客人是从哪里来的。","hard":"「鬓」上面是「髟」；「衰」此处读 cuī（稀疏），不读 shuāi。","point":"「笑问」看似轻松，实含辛酸，以儿童的天真反衬诗人的沧桑。常考「衰」的读音与情感。"},"两小儿辩日::0":{"why":"提示句里，前三个「一儿曰」分别提出「日始出近」「日初出远」两种相反判断，又用「车盖／盘盂」打了近大远小的比方。按对称的辩法，最后一个孩子的理由必然是反面的冷与热——用触觉经验支持自己的「近者热」。","mean":"一个小孩说：太阳刚出来时清凉，到了中午就热得像把手伸进热水里，这不就是离得近才热、离得远才凉吗？","hard":"「沧」三点水；「盂」下面是「皿」；「探汤」的「汤」指热水，读 tāng。","point":"用视觉（大小）与触觉（冷热）两个角度论证同一问题，是先秦寓言的论辩特色。"},"两小儿辩日::1":{"why":"「孔子不能决也」是事情的结果——博学的孔子也无法判断；有了这个结果，必然有人表态。前文一直写两小儿「辩」，答句用两小儿反过来「笑」，一问收束全文，点出「学无止境」的意味。","mean":"孔子也不能判断谁对谁错。两个小孩笑着说：谁说你知识渊博呢？","hard":"「孰」左边是「享」；「汝」三点水；「知」此处同「智」，指智慧。","point":"通假「知」＝智；寓意是学无止境、不能片面看问题。常考人物形象与寓意。"},"观沧海::0":{"why":"前面从「水何澹澹」写到「日月之行，若出其中；星汉灿烂，若出其里」，大海吞吐日月星辰的壮阔已经写足；乐府诗结尾照例要有一句合乐收束的话，所以答句用「幸甚至哉，歌以咏志」点明「咏志」——这正是本诗言志的落点。","mean":"真是幸运极了，用歌唱来表达自己的心志。","hard":"「哉」里面是「口」下加「戈」；「咏」是「口＋永」，别写成「泳」。","point":"这是乐府合乐的套语，与前面的写景没有直接诗意关系，但必须会写会默；「日月之行，若出其中」是必考名句。"},"闻王昌龄左迁龙标遥有此寄::0":{"why":"提示句交代了两件事：时节（杨花落尽、子规啼，已是暮春）和消息（朋友被贬到龙标）。听完坏消息后，诗人心里的「愁」无处安放，就要托付给能陪朋友远行的事物——月亮。答句正是这个「托付」的动作。","mean":"我把这颗忧愁的心托付给明月，让它随着你一直到夜郎的西边。","hard":"「郎」右耳旁；「啼」是「口＋帝」；「寄」上面是「宀」。","point":"拟人——把明月当成使者；相隔万里而能同照，是李白特有的浪漫。中考名句。"},"次北固山下::0":{"why":"第五、六句由「残夜」「旧年」写出时序交替的感新之意，第七句直接发问「乡书何处达」；有问就必有一答，而能替人带信回家的只有北归的大雁——答句顺势给出托雁传书的回答。","mean":"希望北归的大雁能把这封家书带到洛阳去。","hard":"「雁」里面是两个「亻」加「隹」，注意别漏笔；「洛」三点水加「各」。","point":"「生」「入」二字炼字（拟人化时序）；末句用「鸿雁传书」的典故寄托乡思，为高频考点。"},"天净沙·秋思::0":{"why":"前三句列了九个景物，把画面铺满却没有一个人；景物需要被一个「看的人」串起来，所以第四句用「夕阳西下」给出统一的光线与时间，第五句的「断肠人」才是全曲的抒情主体。","mean":"夕阳向西落下，极度悲伤的游子还漂泊在天涯。","hard":"「藤」草字头下是「滕」，下半是「水」；「肠」月字旁；「涯」三点水。","point":"白描、意象叠加；「断肠人」是全曲曲眼，也是主旨句。必考。"},"《论语》十二章::0":{"why":"前面十一章依次讲学习、修身、为人，属于「分说」；到最后一句，子夏把「博学、笃志、切问、近思」四项合在一起讲，落到「仁」这个总纲上。全书以「仁在其中矣」收尾，是十二章的归结句。","mean":"子夏说：广泛学习并坚守志向，恳切地提问、就近思考，仁德就在其中了。","hard":"「笃」竹字头下是「马」；「殆」左边是「歹」；「焉」下面是四点而不是「与」。","point":"「博学」「笃志」「切问」「近思」是治学四要；此句为全篇纲目句，常考理解性默写。"},"峨眉山月歌::0":{"why":"前两句是「静」的——山上之月、江中之影，都是启程前看到的景；第三句用「夜发」交代出发，行程一动，地名接连出现（清溪—三峡—渝州），第四句的「思君不见」才点出离乡的怅惘。","mean":"夜里从清溪出发驶向三峡，想念你却见不到，只好顺流直下渝州。","hard":"「峨」山字旁；「羌」上面是「羊」少一横；「渝」三点水加「俞」。","point":"五地名连用的写法是考点；「月」贯穿全诗，是乡思的载体。"},"江南逢李龟年::0":{"why":"前两句回忆当年在权贵宅第里常听李龟年唱歌，是「盛时」；答句用「落花时节」既写暮春，又暗喻时代与身世的凋零，一个「又」字把数十年的盛衰串起来——重逢必须落在这样的对比上。","mean":"如今正是江南风景最美的时候，在这落花的时节又遇上了你。","hard":"「逢」走之底；「龟」注意与「黾」区分；「岐」山字旁，不写「歧」。","point":"「落花时节」一语三关（时令、时代、身世）；「又」字藏无限沧桑。杜甫晚期名篇，高频赏析。"},"行军九日思长安故园::0":{"why":"提示句写重阳登高却无酒可饮，是「眼前」的缺憾；由「无酒」自然想到故园的菊——重阳赏菊本是旧俗，而长安正在战乱中，于是诗心越过眼前飞到故园，有了这句想象。","mean":"遥想怜惜故园中的菊花，它应该正靠着战场开放吧。","hard":"「怜」竖心旁；「傍」单人旁（靠近），别写成「旁」。","point":"由人及物、以想象写忧国；「战场」二字点出安史之乱的背景。常考末句的情感。"},"夜上受降城闻笛::0":{"why":"前两句写沙白如雪、月冷如霜，是「寒」的视觉铺垫，环境已把人逼到思乡的边上；这时传来一声不知来处的「芦管」，声音是直接的刺激，所以答句立刻写全军「尽望乡」。","mean":"不知从哪里吹起了芦管，一整夜戍守的将士都望着故乡。","hard":"「芦」草字头；「管」竹字头；「降」此处读 xiáng（受降城）。","point":"由景入声、由声入情；「尽」字写思乡之普遍而强烈。中考名句。"},"诫子书::0":{"why":"前文从「静以修身，俭以养德」讲到「淫慢」「险躁」的害处，都是从「该怎么做」立论；文章最后要给出「不这么做」的后果。答句用「年与时驰」「遂成枯落」写时间流逝、志意消磨，以「将复何及」的反问收尾，警诫之意最重。","mean":"年华随时光飞驰，志意随日月消磨，最终像枯枝落叶一样凋零，大多不能接触世事、有所贡献，只能悲哀地守着陋室，那时再后悔又怎么来得及！","hard":"「淫」三点水加「㸒」；「躁」足字旁，别写成「燥」；「庐」广字头。","point":"「静」与「俭」是全文核心；末句以反问作结，是千古家训名句。"},"登幽州台歌::0":{"why":"前两句从时间维度写「前」「后」都无人可遇，已经把孤独写到极处；时间之外还有空间，答句用「天地之悠悠」补上空间的浩渺，两相夹击之下才有了「独怆然而涕下」的抒情主体。","mean":"想到天地如此辽阔久远，我独自悲伤，眼泪纵横而下。","hard":"「怆」竖心旁，读 chuàng；「涕」三点水（古义指眼泪）；「悠」下面是「心」。","point":"时空双线交织；「独」字统摄全篇，写怀才不遇的孤愤。"},"望岳::0":{"why":"前六句都是「望」——远望、近望、细望，写泰山的雄伟与自己的目力所及；第七句一声「会当」由「望」转为「欲登」，答句用「凌绝顶」「众山小」写出登临后的境界，是青年杜甫雄心的落点。","mean":"一定要登上那最高峰，俯瞰群山，它们都会显得矮小。","hard":"「凌」两点水，别写成「陵」；「览」下面是「见」；「曾」此处通「层」。","point":"「会当」语气坚决，是自信与抱负的宣言；化用「登泰山而小天下」。必考名句。"},"游山西村::0":{"why":"中间两联写村中人情的淳朴——春社将临、箫鼓相随、古风犹存，这是「留」下来的理由；于是结尾顺理成章地表态：若能得闲，就趁着月色拄杖随时来敲门。","mean":"今后如果能允许我趁着月色闲游，我会拄着拐杖随时来敲你的门。","hard":"「拄」提手旁；「杖」木字旁；「叩」右边是「卩」，注意与「扣」区分。","point":"尾联以「随时夜叩门」写人情之亲；「山重水复疑无路，柳暗花明又一村」为必考名句。"},"陋室铭::0":{"why":"前面写「苔痕」「草色」「谈笑」「往来」，再到「诸葛庐」「子云亭」，都是用类比把陋室抬到圣贤居所的高度；最后需要一个权威依据来定格，于是引孔子的话——有德者居之则不陋。答句是全篇的落脚点。","mean":"孔子说：有什么简陋的呢？","hard":"「陋」左耳旁加「丙」；「禹」注意与「属」区分；句末的「之」不要漏写。","point":"「何陋之有」是宾语前置句（「之」为宾语前置标志）；引圣言作结，是铭文的典型写法。"},"爱莲说::0":{"why":"前面用菊、牡丹、莲三种花作对比，分别代表隐逸者、富贵者、君子；写莲是「予独爱」，写菊是「鲜有闻」，最后用「牡丹之爱，宜乎众矣」反照世人趋炎附势，以感叹收束全篇。","mean":"对于牡丹的喜爱，当然人很多了。","hard":"「宜」上面是「宀」，下面是「且」；「予」此处读 yú（我）。","point":"「宜乎众矣」含讽刺意味；托物言志，莲＝君子。「出淤泥而不染」为必考名句。"},"泊秦淮::0":{"why":"前两句点出时间（夜）、地点（秦淮酒家）与氛围（烟笼月笼），已经把人带到歌声的来源；第三句把矛头指向唱曲的人，第四句用「后庭花」（陈后主的亡国之音）点破「亡国恨」的实质——表面写歌女，实则讽当局。","mean":"卖唱的歌女不懂什么叫亡国之恨，隔着江水还在唱那支《玉树后庭花》。","hard":"「笼」竹字头；「犹」是「尤」多一点；「隔」左耳旁。","point":"「后庭花」是用典；曲笔讽今，是咏史绝句的典范。"},"木兰诗::0":{"why":"前面写同伴「皆惊忙」，说一起行军十二载竟不知木兰是女子，疑问已经提出；民歌惯用的手法是用比喻作答，于是以雌雄双兔难辨收束全诗，既是调侃，也是赞许。","mean":"提着兔子耳朵悬空时，雄兔两只前脚时时动弹，雌兔两眼迷离；两只兔子贴着地面跑，又怎能分辨哪只是雄、哪只是雌呢？","hard":"「扑朔」「迷离」注意字形；「傍」读 bàng（贴近）；「辨」中间是「刂」加「丿」，别写成「辩」。","point":"成语「扑朔迷离」的出处；以比喻作结，是乐府民歌的典型结尾。"},"卖油翁::0":{"why":"卖油翁用「酌油沥之」演示了「手熟」之理，并亲口说「我亦无他，惟手熟尔」；话说完，故事需要一个结果，而陈康肃由「忿然」转为「笑」，一个「笑」字写出他的折服，故事就此收束。","mean":"康肃公笑着把他打发走了。","hard":"「遣」走之底；「康」下面是「水」的变体；「肃」上半注意笔顺。","point":"与开头「陈康肃公善射……以此自矜」对照，「笑」字完成了人物态度的转变，常考情节与人物形象。"},"三峡::0":{"why":"前文已经写了「高猿长啸，属引凄异，空谷传响，哀转久绝」，把猿声的凄切写足；写完实景之后，用「渔者歌曰」引入当地歌谣作旁证，是《水经注》常见的写法——歌谣放大了猿声的感染力，也收束了全文。","mean":"所以打鱼的人唱道：巴东三峡巫峡最长，猿猴叫三声就让人泪水沾湿衣裳。","hard":"「裳」下面是「衣」，此处读 cháng；「渔」三点水；「沾」三点水。","point":"引歌谣作结，是侧面烘托的典型；「素湍绿潭，回清倒影」为必考写景名句。"},"答谢中书书::0":{"why":"前面写「高峰入云」「清流见底」直到「晓雾将歇」「沉鳞竞跃」，把山川之美铺陈到极致，并下了判断「实是欲界之仙都」；有了这个判断，自然要感叹「谁能共赏」，于是想到山水诗的开创者谢灵运。","mean":"自从谢灵运以来，就再也没有能欣赏这奇妙景色的人了。","hard":"「康」下面是「水」的变体；「与」此处读 yù（参与，此处指欣赏）。","point":"「康乐」指谢灵运（用典）；末句以「知音难逢」自许，情感由赞美转为感慨。"},"记承天寺夜游::0":{"why":"前面用「积水空明」「藻荇交横」比喻月光与竹柏影，写的是「景」；接着两个反问「何夜无月？何处无竹柏？」把问题从「景」转到「人」——景色到处都有，缺的是能欣赏的人。答句给出回答，也是全文的题旨。","mean":"只是缺少像我们两个这样清闲的人罢了。","hard":"「闲」门字框里是「木」；「但」单人旁；「耳」不要写成「尔」。","point":"「闲人」一语含贬谪的悲凉与自我排遣的旷达，是全文理解的关键；「庭下如积水空明」为必考名句。"},"与朱元思书::0":{"why":"前面写完「奇山异水」，又写了由此引发的人生感慨（息心、忘反），把「情」写完了；文章最后回到谷中所见的实景——枝条繁密遮天、稀疏处漏下日光，用景收束，余味更足。","mean":"横斜的树枝在上面遮蔽着，白天也像黄昏；稀疏的枝条交相掩映，有时能见到太阳。","hard":"「柯」木字旁；「蔽」草字头下是「敝」；「疏」左边是「疋」。","point":"由景入情、再以景收尾的结构；「望峰息心」写鄙弃功名之意。"},"野望::0":{"why":"前六句是「望」中所见——树树秋色、山山余晖、牧人驱犊、猎马带禽，都是别人「有归处」的画面；看了别人之后自然要写自己。答句的「无相识」与「怀采薇」正是诗人无所依归的心境，主旨在结尾。","mean":"彼此相望却互不相识，我只好长声歌唱，怀念古代的隐士。","hard":"「犊」牛字旁；「禽」上「人」下「离」；「薇」草字头下是「微」。","point":"「采薇」用伯夷叔齐的典故，写归隐之志；由景到情的转折落在「无相识」三字上。"},"黄鹤楼::0":{"why":"前六句写登楼所见——昔人已去、白云空悠、晴川历历、芳草萋萋，都是有景无情；第七句一句「乡关何处是」把乡愁问出来，答句用「烟波江上」给出视觉上的答案——一片迷蒙，愁就在这一片迷蒙里。","mean":"江上烟波浩渺，更使人增添忧愁。","hard":"「暮」下面是「日」，别写成「目」；「愁」上「秋」下「心」。","point":"「烟波江上使人愁」是全诗情感归宿，与开头的「空悠悠」呼应；「日暮乡关何处是」为高频默写。"},"使至塞上::0":{"why":"前六句写「出使」途中的所见——征蓬、归雁、大漠、长河，都是行进中的景；既然在路上，最后必然到达某个节点。答句写到了萧关遇到侦察骑兵，得知都护已在燕然前线，行程由此收束。","mean":"走到萧关遇上侦察骑兵，得知都护正在燕然前线。","hard":"「萧」草字头下是「肃」；「骑」此处读 jì（骑兵）；「燕」此处读 yān（燕然山）。","point":"「大漠孤烟直，长河落日圆」以「直」「圆」炼字，是「诗中有画」的名句；末句暗写前线战事。"},"渡荆门送别::0":{"why":"前六句写「渡」的过程——山随平野尽、江入大荒流、月影如镜、云生海楼，一路都是新奇壮阔；诗人正当年少远游，却要收一笔，于是把情落在一直伴着自己的江水身上。","mean":"我仍然怜爱故乡的江水，它不远万里送我的行舟。","hard":"「怜」竖心旁；「舟」注意笔顺；「镜」金字旁。","point":"拟人——江水「送」行舟，不说自己思乡而说故乡水多情；「山随平野尽，江入大荒流」为必考名句。"},"钱塘湖春行::0":{"why":"中间四句写「行」中所见——莺争暖树、燕啄春泥、乱花、浅草，都是初春细节；「行不足」三字把「行」的结果写出来——走得不够，说明景太美，所以最后必然要指出「最爱」的那个地方。","mean":"最喜爱湖东的景色，怎么走也走不够，尤其是那绿杨阴里的白沙堤。","hard":"「堤」土字旁，读 dī；「没」此处读 mò（淹没）；「阴」不写「荫」。","point":"「最爱」「行不足」直抒喜爱；「几处早莺争暖树，谁家新燕啄春泥」为必考名句。"},"庭中有奇树::1":{"why":"前面写折花、闻香、欲赠而路远不能送达，是「赠不得」的遗憾；写到这里必须给这份遗憾一个说法，于是答句承认「此物何足贵」——花本身不珍贵，珍贵的是「别经时」的思念。","mean":"这花有什么珍贵的呢？只是感慨离别的时间太久了。","hard":"「足」注意与「是」区分；「但」单人旁；「经」绞丝旁。","point":"以「不足贵」反衬思念之重，是古诗中「以轻写重」的手法；「攀条折其荣，将以遗所思」是常考句。"},"饮酒（其五）::0":{"why":"前八句从「结庐在人境」写到「飞鸟相与还」，一句一句都在写自己「采菊」「见山」时的自在，是具体的体验；体验到底了必然要作总结——答句用「欲辨已忘言」说出「真意」不可言说，正是全诗的哲思落点。","mean":"这里面有人生的真义，想要辨识说明，却忘了该用什么语言来表达。","hard":"「辨」中间是「刂」加「丿」，别写成「辩」；「庐」广字头；「喧」口字旁。","point":"「忘言」化用《庄子》「得意忘言」；全诗核心是「心远地自偏」的哲理，常考理解性默写。"},"赤壁::0":{"why":"前两句写「认前朝」——从江中捞起断戟、认出是前朝之物，这是「由物及史」的起点；既然想到了赤壁之战，就要对这个决定三国格局的战事发表看法，于是有了假设性的议论句。","mean":"倘若东风不给周瑜行方便，那么大乔小乔就要被关进铜雀台了。","hard":"「郎」左「良」右「阝」；「雀」下半笔顺要准；「销」金字旁。","point":"以「二乔」的命运写战局，是史论入诗的妙笔，含生不逢时之慨。"},"富贵不能淫::0":{"why":"前文孟子先驳「妾妇之道」，再正面立论「居天下之广居，立天下之正位，行天下之大道」；接下来要给出大丈夫在具体情形下的三条标准——面对富贵、贫贱、威武三种压力都不动摇，最后以「此之谓大丈夫」收束。","mean":"富贵不能使他迷惑，贫贱不能使他动摇，威武不能使他屈服，这样才叫大丈夫。","hard":"「淫」三点水加「㸒」；「贫」上面是「分」；「屈」尸字框里是「出」。","point":"排比三句是孟子的名言；与「以顺为正者，妾妇之道也」形成对比论证。必考。"},"生于忧患，死于安乐::0":{"why":"前文先列举六位从困境中崛起的圣贤，再从个人推到国家——「入则无法家拂士，出则无敌国外患者，国恒亡」，两面对照之后，全文最后用「然后知」引出结论，点明中心论点。","mean":"这样以后才明白，忧患使人生存发展，安乐使人萎靡死亡。","hard":"「忧」竖心旁；「患」上面是「串」；「恒」竖心旁加「亘」。","point":"全文的中心论点句；「故天将降大任于是人也」的排比是必考默写。"},"关雎::0":{"why":"前四句写「君子好逑」「寤寐求之」，是「求」的动作；求而不得才是全诗的转折，所以紧接着要以「求之不得」点明结果，再由「寤寐思服」写思念之深，开启下文「辗转反侧」。","mean":"追求不到，日日夜夜都在思念。","hard":"「寤寐」两字都是「宀」头，读 wù mèi；「逑」走之底加「求」。","point":"《诗经》重章叠句与「兴」的手法；「窈窕淑女，君子好逑」为必考句。"},"关雎::1":{"why":"全诗用「左右流之—左右采之—左右芼之」三章递进，写采摘荇菜的动作一步步深入，对应求爱的一步步推进；到了最后一章，追求已从「寤寐思服」「辗转反侧」进到「琴瑟友之」，所以结尾必然是更隆重的「钟鼓乐之」——想象中成婚的场面。","mean":"美丽善良的女子，我要敲钟击鼓让她快乐。","hard":"「芼」草字头下是「毛」，读 mào；「乐」此处读 lè（使……快乐）。","point":"重章叠句的递进结构（流—采—芼、求—友—乐）是《诗经》典型手法；末章以想象作结。"},"蒹葭::0":{"why":"全诗三章反复写「溯洄」「溯游」，前面的「宛在水中央」「宛在水中坻」都是可望而不可即；第三章把地点换到「水中沚」，句式不变而意境更深——追寻的对象始终在水的那一边，末句正是这三章的最后一叠。","mean":"顺着流水去寻找她，她仿佛就在水中的小洲上。","hard":"「溯」三点水加「朔」；「沚」三点水加「止」，读 zhǐ；「涘」读 sì。","point":"重章叠句＋「在水一方」的朦胧美；「蒹葭苍苍，白露为霜」为必考名句。"},"式微::0":{"why":"全诗两章一问一答，反复问「胡不归」却始终不归；第一章答的是「为君之故」，在露水中劳作；第二章只把「故」换成「躬」、「中露」换成「泥中」，说明苦役照旧甚至更重，末句正是这一层叠唱。","mean":"如果不是为了君主您，我为什么还在泥水里劳作？","hard":"「胡」右边是「月」；「躬」身字旁加「弓」；「泥」三点水。","point":"重章叠句中只换两字，「露／泥」由轻到重，是《诗经》以少总多的典型手法。"},"送杜少府之任蜀州::0":{"why":"前六句先叙离别之地与宦游之因，再以「海内存知己，天涯若比邻」把离愁一笔扫开——境界已经打开；末句顺此气势劝慰对方，不要在分手的路口像小儿女一样哭泣。","mean":"不必在分手的路口上，像小儿女那样让泪水沾湿手巾。","hard":"「歧」山字旁，别写「岐」；「沾」三点水；「巾」注意与「币」区分。","point":"「无为」＝不要因为；「海内存知己，天涯若比邻」为千古名句，改写了送别诗的悲凉格调。"},"望洞庭湖赠张丞相::0":{"why":"前面写洞庭湖的浩渺（气蒸云梦泽、波撼岳阳城）是「起兴」；「欲济无舟楫，端居耻圣明」已经把「想出仕却无人引荐」的心事说出来；末句用「临渊羡鱼」的典故收束，把求荐之意说得含蓄而不失身份。","mean":"只能坐着看别人钓鱼，空有一片羡慕鱼儿上钩的心情。","hard":"「楫」木字旁加「咠」；「羡」下面是「次」；「徒」双人旁加「走」。","point":"「羡鱼」化用「临渊羡鱼，不如退而结网」；这是干谒诗得体的写法，求荐而不露乞怜之态。"},"桃花源记::0":{"why":"前文写「处处志之」却「不复得路」，已经暗示桃源不可复寻；末尾特意补写高尚士刘子骥想去却「未果，寻病终」，最后一句「后遂无问津者」把故事彻底关上门——越写无迹可寻，越显出桃源的理想性。","mean":"此后就再也没有探寻桃花源的人了。","hard":"「津」三点水；「遂」走之底；「骥」马字旁。","point":"以「无问津者」作结，虚实相生；「阡陌交通，鸡犬相闻」为必考名句。"},"小石潭记::0":{"why":"前文先写「闻水声，心乐之」的欣喜，再写鱼「若空游无所依」的清澈；写到「四面竹树环合，寂寥无人」时气氛骤转凄凉，「凄神寒骨」四字已把情绪写完，所以必须有「不可久居」的理由，才能交代为什么离开。","mean":"因为这里的环境过于凄清，不能久留，于是记下这番景致就离开了。","hard":"「凄」两点水；「寥」宀字头下是「翏」；「邃」走之底，读 suì。","point":"由乐到悲的情感转折是本文考查重点（柳宗元被贬后的抑郁）；「潭中鱼可百许头，皆若空游无所依」为必考名句。"},"小石潭记::1":{"why":"整篇游记已写完景与情，按游记惯例最后要交代同游的人；第一句列了三位同游者，第二句补上跟随的两个年轻人并写出名字，全文就这样干净收束。","mean":"跟着一同去的，还有姓崔的两个年轻人，一个叫恕己，一个叫奉壹。","hard":"「隶」注意与「肄」区分；「恕」下面是「心」；「壹」上面是「士」。","point":"这是文言游记常见的结尾格式；「隶而从者」的「隶」意为随从。人名是易错处，别写错字。"},"核舟记::0":{"why":"前文写中间三人的位置：东坡、鲁直共阅一卷，佛印在旁「矫首昂视」；人物姿态写到「神情与苏、黄不属」时，还差佛印具体的手脚姿态没交代，所以答句补写他的卧膝、支船、竖膝与左臂念珠，最后以「珠可历历数也」赞叹刻工之细。","mean":"他平放着右膝，弯着右臂支在船上，竖起左膝，左臂上挂着念珠靠在膝上——念珠可以一粒一粒数清楚。","hard":"「诎」言字旁加「出」，同「屈」；「倚」单人旁；「历历」两个「历」不要漏。","point":"说明文「总—分」结构中的细部描写；「珠可历历数也」以夸张写微雕之精，是常考赏析点。"},"北冥有鱼::0":{"why":"前文写鲲鹏之大、徙于南冥；接着从「野马也，尘埃也」讲到人抬头看天「苍苍」而不知其正色，是从「下看天」转到「上看下」的过渡；答句顺势给出结论——大鹏往下看，也不过像人看天一样，视野有限。","mean":"大鹏从高空往下看，也不过像这样罢了。","hard":"「冥」上「冖」下「六」；「邪」此处读 yé，同「耶」；「苍」草字头下是「仓」。","point":"以「人看天」与「鹏看下」互喻，写认识受限于角度；「鹏之背，不知其几千里也」是必考句。"},"虽有嘉肴::0":{"why":"前文先讲「学然后知不足，教然后知困」，得出「教学相长」的道理，这是自己的推论；推论需要佐证，于是引《兑命》的「学学半」，最后用「其此之谓乎」以推测语气收束，表示这正是所说的意思。","mean":"大概说的就是这个道理吧！","hard":"「谓」言字旁；「其」不要写成「岂」；「兑」此处读 yuè。","point":"引用论证＋推测语气作结；「教学相长」的出处，是必考名句。"},"马说::0":{"why":"前文写千里马「食不饱，力不足」而「才美不外见」，已归因于「食马者不知其能千里而食」；写到「策之不以其道」等三句排比时，感情达到顶点，于是用「呜呼」感叹、以「其真无马邪」反问，最后一转给出答案。","mean":"大概是真的不认识千里马吧！","hard":"「邪」此处读 yé，同「耶」；「呜」「呼」都是口字旁。","point":"反问作铺垫、感叹句作结，托物寓意讽刺统治者不识人才；「千里马常有，而伯乐不常有」为必考名句。"},"茅屋为秋风所破歌::0":{"why":"前文写秋风破屋、群童抱茅、床头屋漏，都是个人的苦；到「安得广厦千万间，大庇天下寒士」时，诗人的心已经从一身之苦推向天下寒士，这是升华；升华之后需要一个表决心的句子，答句正是这个舍己为人的落点。","mean":"什么时候眼前能突然出现这样的广厦，即使我的茅屋独破、自己受冻而死也心甘情愿！","hard":"「突兀」的「兀」不要多加一撇；「庐」广字头；「俱」单人旁，别写成「具」。","point":"由个人遭遇推及天下寒士，是杜甫推己及人的仁者胸怀；「安得广厦千万间」为必考名句。"},"卖炭翁::0":{"why":"前面写卖炭翁「满面尘灰烟火色」「可怜身上衣正单，心忧炭贱愿天寒」，把辛苦写到极处；再写宫使来了，「手把文书口称敕」「驱将惜不得」，强夺已成事实；最后必须交代拿了什么、够不够，答句用「半匹红纱一丈绫」点出掠夺的性质。","mean":"用半匹红纱和一丈绫，朝牛头上一挂，就算作一车炭的价钱。","hard":"「纱」绞丝旁；「绫」绞丝旁；「直」此处同「值」，是价钱。","point":"通假「直」＝值；对比手法（一车炭千余斤 vs 半匹红纱一丈绫）是必考赏析点。"},"题破山寺后禅院::0":{"why":"前六句从「清晨入古寺」到「潭影空人心」，写的是「入」的过程——由外而内、由景入心，心已被「空」到极静；既然心静到极致，最细微的声音都会被放大，于是有「万籁俱寂，但余钟磬」的收束。","mean":"此时万物都静寂无声，只留下钟磬的声音在回荡。","hard":"「籁」竹字头；「磬」下面是「石」，读 qìng；「余」不要写成「馀」。","point":"以声写静（以钟磬音反衬寂）；「曲径通幽处，禅房花木深」为必考名句。"},"送友人::0":{"why":"前六句写送别之地（青山北郭、白水东城）与别离之情（浮云、落日），情与景都已备足；分别总要有一个动作作结，于是答句用「挥手」这一具体动作写告别，再用「班马鸣」以马声衬人愁，余情不尽。","mean":"挥一挥手从此离去，只听见那匹离群的马儿萧萧长鸣。","hard":"「萧萧」草字头；「兹」上「丷」下「幺」；「班」中间是「刂」。","point":"以「马鸣」写别情，是「以物写人」的手法；「浮云游子意，落日故人情」是常考句。"},"卜算子·咏梅::0":{"why":"上片写梅「寂寞开无主」「更著风和雨」，处境已经很惨；下片先表态「无意苦争春，一任群芳妒」，把态度说清；态度之后要以结果作证，于是答句用「零落成泥碾作尘」这个最极端的处境，来反衬「只有香如故」的不变。","mean":"即使凋零飘落、被碾作尘土，只有那清香依然如故。","hard":"「碾」石字旁；「尘」小字头下是「土」；「妒」女字旁。","point":"托物言志——以梅自喻，写不争宠、不屈服；「零落成泥碾作尘，只有香如故」为必考名句。"},"沁园春·雪::0":{"why":"上片写北国雪景，下片用「江山如此多娇，引无数英雄竞折腰」转入评点历史；接着按秦皇汉武、唐宗宋祖、成吉思汗的顺序一路评下来，评完古人就要给结论——「俱往矣」一句把历史划开，「还看今朝」点明主旨。","mean":"这些人物都已成为过去，要数真正的风流人物，还得看今天。","hard":"「俱」单人旁，别写「具」；「矣」上「厶」下「矢」。","point":"「风流人物」指当代英雄；「俱往矣」三字转折有力，是必考的主旨句。"},"岳阳楼记::0":{"why":"前文从「巴陵胜状」写到「览物之情，得无异乎」，再用「若夫霪雨霏霏」「至若春和景明」两段作对比，最后以「先天下之忧而忧，后天下之乐而乐」立论；「噫！微斯人，吾谁与归」是感慨的收束，答句则是文末交代写作时间的落款。","mean":"写作时间是庆历六年九月十五日。","hard":"「时」不要漏写；「月」不要写成「曰」；「六」不要写成「大」。","point":"这是古文的常见落款格式，最容易因为「不是名句」而在默写时丢分。另注：2026 年秋季新版统编教材据中华书局《范仲淹全集》改字，《岳阳楼记》「淫雨霏霏」已改作「霪雨霏霏」、「日星隐曜」改作「日星隐耀」——27 届用新教材，按「霪」「耀」写。全篇主旨句是「先天下之忧而忧，后天下之乐而乐」。"},"醉翁亭记::0":{"why":"前文从「环滁皆山」写到「太守宴」「众宾欢」，再写「禽鸟乐」「人之乐」，最后归结到「醉能同其乐，醒能述以文者，太守也」；既然点出了「太守」，按规定动作要交代太守是谁，于是自问自答收束全文。","mean":"太守是谁？就是庐陵的欧阳修啊。","hard":"「庐」广字头；「陵」左耳旁，注意与「凌」区分。","point":"自问自答（设问）作结，语气自得而含蓄；「醉翁之意不在酒」为必考名句。"},"湖心亭看雪::0":{"why":"前文写「大雪三日，湖中人鸟声俱绝」时作者独往看雪，又写亭上已有两人对饮，最后借舟子之口点出「痴」字——前面所有「独往」「大喜」「拉余同饮」的举动，都在为这个评价作铺垫。","mean":"等到下船时，船夫喃喃地说：不要说相公痴，还有比相公更痴的人呢。","hard":"「喃」口字旁；「痴」病字头下是「知」；「莫」草字头下是「日」加「大」。","point":"借舟子之口侧面写「痴」，是全文的点睛之笔；「湖上影子，惟长堤一痕、湖心亭一点」为必考名句。"},"行路难（其一）::0":{"why":"前文写「金樽清酒斗十千」却「停杯投箸不能食」，情绪一路沉到「行路难，行路难，多歧路，今安在」的低谷；有了这样的低谷，末句的高扬才显力度——答句用「长风破浪」「济沧海」写决心，是全诗情感的转折与制高点。","mean":"总有一天我会乘长风破万里浪，高高挂起云帆，横渡沧海。","hard":"「沧」三点水加「仓」；「济」三点水加「齐」；「歧」山字旁。","point":"「长风破浪」用宗悫「乘长风破万里浪」之典；由苦闷到昂扬的情感变化是必考题。"},"酬乐天扬州初逢席上见赠::0":{"why":"前六句写「二十三年弃置身」的坎坷（闻笛赋、烂柯人），再用「沉舟」「病树」自比，但「千帆过」「万木春」已透出豁达；最后要回应题目中的「酬……见赠」，于是答句回到眼前的酒席——听歌、饮酒、振作精神。","mean":"今天听了你为我吟诵的诗篇，暂且借这一杯酒来振作精神。","hard":"「暂」上「斩」下「日」；「凭」下面是「几」；「精」米字旁。","point":"「沉舟侧畔千帆过，病树前头万木春」含哲理，是必考名句；尾联回扣「酬赠」的题意。"},"水调歌头（明月几时有）::0":{"why":"下片由「转朱阁，低绮户，照无眠」引出「不应有恨，何事长向别时圆」的埋怨；接着用「人有悲欢离合，月有阴晴圆缺，此事古难全」自我宽解，最后的祝福句正是从中生出——既然自古难全，就祝愿长久。","mean":"只希望人们都能长久平安，即使相隔千里也能共享这美好的月光。","hard":"「婵娟」都是女字旁，读 chán juān；「愿」上面是「原」；「缺」左边是「缶」。","point":"「婵娟」指月亮；由埋怨到宽解再到祝福，情感层层推进，是必考的名句与情感题。"},"月夜忆舍弟::0":{"why":"前文写「戍鼓断人行，边秋一雁声」，点出战乱、秋寒、孤雁的凄凉；再由「露从今夜白，月是故乡明」引出思乡，接着「有弟皆分散，无家问死生」把离散写到极处；最后必须交代为什么音信不通——答句归于「未休兵」这个根本原因。","mean":"寄出的家书常常不能送到，更何况战乱还没有停止。","hard":"「况」两点水；「乃」注意与「及」区分；「休」单人旁加「木」。","point":"「月是故乡明」是名句（主观化写乡思）；末句点出战争背景，是理解全诗的关键。"},"长沙过贾谊宅::0":{"why":"前两联写「三年谪宦此栖迟」「秋草独寻人去后」，都是凭吊之景；凭吊到第三联必须转入议论——由贾谊被贬想到「汉文有道」尚且如此，再以湘水无情反衬自己的哀情，是以古人之事写自己之慨。","mean":"汉文帝虽是有道的明君，对贾谊的恩遇尚且如此微薄；湘水无情，我的凭吊它又怎能知道呢？","hard":"「恩」上「因」下「心」；「薄」草字头；「吊」不要多写一撇。","point":"「汉文有道恩犹薄」是反衬写法，借古讽今；「秋草独寻人去后」为常考句。"},"左迁至蓝关示侄孙湘::0":{"why":"前文交代「一封朝奏九重天，夕贬潮州路八千」的获罪缘由与「欲为圣明除弊事」的初衷；接着写「云横秦岭」「雪拥蓝关」的艰难处境，悲愤已到顶点；末联回头写给专程相送的侄子，把生死托付说出口，语极沉痛。","mean":"我知道你远道而来应该是有用意的，正好在瘴气弥漫的江边为我收殓尸骨吧。","hard":"「瘴」病字头；「拥」提手旁；「汝」三点水加「女」。","point":"「雪拥蓝关马不前」以景写情；末句以嘱托收束，是「示侄孙」的题中之义，常考情感。"},"商山早行::0":{"why":"前六句写「早行」——「晨起动征铎」「鸡声茅店月，人迹板桥霜」再到槲叶、枳花，一路都是路上的实景；行到此处忽然顿住，由眼前之景转入昨夜的梦（杜陵即长安、即家），末句用「凫雁满回塘」的画面写梦中的故乡。","mean":"因此想起昨夜梦中回到杜陵，野鸭大雁落满了曲折的池塘。","hard":"「槲」木字旁加「斛」；「枳」木字旁加「只」，读 zhǐ；「凫」上半是鸟的变体。","point":"以梦结句，虚实相生；「鸡声茅店月，人迹板桥霜」为必考名句（纯名词组合）。"},"无题::0":{"why":"前四句写「相见时难别亦难」「春蚕到死丝方尽」的至情，第五、六句从对面（对方）着笔——她照镜愁鬓改、夜吟觉月寒，写的是彼此的挂念；既已如此，末联便用神话给出希望：距离不远，可托青鸟去探望。","mean":"你的住处离这里没有多远，我会请青鸟殷勤地为你探看。","hard":"「蓬」草字头，别写成「篷」；「殷」此处读 yīn；「看」此处读 kān。","point":"「青鸟」是神话中西王母的信使（用典）；「春蚕到死丝方尽，蜡炬成灰泪始干」为必考名句。"},"鱼我所欲也::0":{"why":"前文先以「舍鱼而取熊掌」设喻，提出「舍生取义」；再从正反两面论证，并用「不食嗟来之食」与「不辩礼义而受万钟」作对照；批到「是亦不可以已乎」时反问已到，答句给出最终判断——这些人丧失的是本心。","mean":"这就叫做丧失了他的本心。","hard":"「谓」言字旁；「本」不要写成「木」；「心」不要加点。","point":"「本心」指人固有的羞恶之心；末句是全文的归结，「舍生取义」为必考名句。"},"曹刿论战::0":{"why":"前文写长勺之战中曹刿两次说「未可」、一次「可矣」，又「下视其辙，登轼而望之」，行动已经完成；战后「公问其故」，需要他来解释，答句就是他的解释——先说明「一鼓作气」的战术，再补充「视辙乱、望旗靡」所以追击，全文以论战作结。","mean":"我看到他们的车轮印混乱，望见他们的旗帜倒下了，所以追击他们。","hard":"「辙」车字旁；「靡」读 mǐ（倒下），麻字头下是「非」；「逐」走之底。","point":"全文以「论战」为中心，详略得当；「一鼓作气」的成语出处，是必考篇目。"},"出师表::0":{"why":"前文从「臣本布衣，躬耕于南阳」写到「三顾臣于草庐之中」，再写「由是感激，遂许先帝以驱驰」，是追述受命之始；既然「许」了，就要写此后经历了什么，答句用「后值倾覆」「受任于败军之际」交代这二十一年的艰难，为下文北伐作铺垫。","mean":"后来遇到兵败，我在战败的时候接受任命，在危难的关头奉命出使，到现在已经二十一年了。","hard":"「覆」上面是「西」；「倾」单人旁；「矣」上「厶」下「矢」。","point":"「受任于败军之际，奉命于危难之间」是千古名句，写忠贞与艰难，必考。"},"出师表::1":{"why":"全文从「先帝创业未半」起，依次劝谏、荐贤、自述、请求北伐，到最后「愿陛下托臣以讨贼兴复之效」「陛下亦宜自谋」把该说的都说完；文末必须有一句告别的话，答句以「临表涕零，不知所言」收束，情辞恳切。","mean":"现在我就要远离陛下了，面对这份表章泪流满面，不知道说了些什么。","hard":"「涕」三点水（眼泪）；「零」雨字头；「言」不要漏笔。","point":"以抒情句作结，是「表」这种文体的典型写法；「亲贤臣，远小人」为必考名句。"},"送东阳马生序::0":{"why":"前文从「余幼时即嗜学」写到「负箧曳屣行深山巨谷中」，再到「同舍生皆被绮绣」而自己「缊袍敝衣处其间」，一路都是具体事例；写完了苦与乐，最后用一句话总收全段——答句正是这一段的总括句。","mean":"我求学时的勤奋和艰苦，大概就是这样。","hard":"「盖」上「羊」下「皿」；「艰」右边是「艮」；「若」草字头下是「右」。","point":"「以中有足乐者，不知口体之奉不若人也」是全段议论句，常考理解性默写。"},"白雪歌送武判官归京::0":{"why":"前两句先写塞外风雪来得早（胡天八月即飞雪），再用「忽如一夜春风来，千树万树梨花开」把雪写成花，是奇想；写完了「外」，就要写雪进到帐内，答句从珠帘、罗幕、狐裘、锦衾一路写寒，把「冷」落到实处。","mean":"雪花飘进珠帘打湿了罗幕，狐皮袍子不暖和，锦被也显得太薄。","hard":"「狐」反犬旁；「裘」下面是「衣」；「衾」上「今」下「衣」，读 qīn。","point":"「忽如一夜春风来，千树万树梨花开」以春花喻冬雪，是必考名句；由外景转入帐内是诗的层次推进。"},"白雪歌送武判官归京::1":{"why":"前面从「中军置酒饮归客」写到「轮台东门送君去」，送别的场面已经写完；人已远去，剩下的只有视线，答句用「山回路转」交代人被山遮住，再用「雪上空留马行处」写目光停在雪地的马蹄印上，送别的怅惘全在这一笔。","mean":"山路曲折回环，已经看不见你了，雪地上只留下马走过的蹄印。","hard":"「蹄」足字旁加「帝」；「留」上面是「卯」的变体；「转」此处读 zhuǎn。","point":"以「空留马行处」的目送作结，含蓄写深情；是送别诗的名句。"},"过零丁洋::0":{"why":"前六句从「辛苦遭逢起一经」写到「山河破碎风飘絮，身世浮沉雨打萍」，再以「惶恐滩」「零丁洋」双关自己的处境，已把国破身危写尽；写到这里必然要给出一个人生的决断，答句以「人生自古谁无死」的反问作铺垫，亮出「留取丹心」的气节。","mean":"自古以来谁能不死？我要留下一颗赤诚的心光照史册。","hard":"「汗青」指史册，不要写成「汉清」；「丹」里面那一点不要漏。","point":"「汗青」是借代（史册）；尾联以反问起、以誓言结，是必考的名句与气节题。"},"山坡羊·潼关怀古::0":{"why":"前文先写「峰峦如聚，波涛如怒」的险要地势，再由「望西都，意踌躇」引出怀古，看到「宫阙万间都做了土」的荒凉；既然兴也成了土、亡也成了土，结论必然落在最基层的人身上，答句以对偶句收束，把全曲的思想推到最高处。","mean":"朝代兴盛，百姓受苦；朝代灭亡，百姓也受苦。","hard":"「踌躇」足字旁，读 chóu chú；「阙」门字框里是「欮」；「做」单人旁。","point":"怀古伤今＋对偶作结；「百姓苦」三个字是全曲的思想高峰，必考。"},"南乡子·登京口北固亭有怀::0":{"why":"上片从「何处望神州？满眼风光北固楼」起，感叹江山依旧而中原难复；下片用「年少万兜鍪，坐断东南战未休」赞孙权年少有为，再以自问自答「天下英雄谁敌手？曹刘」把孙权抬到曹操、刘备之上，最后用曹操的原话作结，褒扬之意最足。","mean":"生儿子就应当像孙仲谋那样。","hard":"「仲」单人旁加「中」；「谋」言字旁加「某」；「敌」右边是「攵」。","point":"用典——引曹操「生子当如孙仲谋」的话；借孙权讽刺南宋统治者的苟安，是必考名句。"},"破阵子·为陈同甫赋壮词以寄之::0":{"why":"上片与下片前半从「醉里挑灯看剑」写到「马作的卢飞快，弓如霹雳弦惊」，一路都是壮阔的军营与战斗场面，情绪高涨到「了却君王天下事，赢得生前身后名」；正当最高处，答句突然用「可怜白发生」五字把梦境打回现实，全词的结构张力全在这一句。","mean":"可惜我已经白发丛生了！","hard":"「怜」竖心旁；「白」不要写成「自」；「发」此处读 fà（头发）。","point":"由壮转悲的陡转结构，是全词的词眼；「马作的卢飞快，弓如霹雳弦惊」为必考名句。"},"临江仙·夜登小阁，忆洛中旧游::0":{"why":"上片回忆「忆昔午桥桥上饮」的豪酣与「杏花疏影里，吹笛到天明」的美好，下片一声「二十余年如一梦」把繁华与乱离一并压下，再写「闲登小阁看新晴」的如今；登阁所闻只有渔歌，末句以「古今多少事，渔唱起三更」把个人身世化成千古兴亡之叹。","mean":"古往今来多少大事，都随着三更响起的渔歌消散了。","hard":"「堪」土字旁加「甚」；「阁」门字框里是「各」；「渔」三点水。","point":"以景结情、以小见大（渔唱→千古兴亡）；「杏花疏影里，吹笛到天明」为常考名句。"},"江城子·密州出猎::0":{"why":"上片写「老夫聊发少年狂」的出猎场面（千骑卷平冈），下片用「酒酣胸胆尚开张」承上，再以「持节云中，何日遣冯唐」用典自比魏尚、盼望被重用；既然盼着被重用，末句就要说出想干的事——挽弓射天狼，抵御外敌。","mean":"我定当拉开雕弓圆如满月，望向西北，射杀那只天狼星。","hard":"「雕」隹字旁；「挽」提手旁加「免」；「遣」走之底。","point":"「天狼」喻侵犯边境的西夏（借代）；「会挽雕弓如满月」三句一气呵成，是必考名句。"},"定风波（莫听穿林打叶声）::0":{"why":"上片写「竹杖芒鞋轻胜马，谁怕？一蓑烟雨任平生」，已经把态度表明；下片写雨过之后「微冷」而「斜照却相迎」，是情势由逆转顺；回头看那场风雨，末句用「也无风雨也无晴」说出不因外境而喜悲的心境，是全词的哲思落点。","mean":"回头看看刚才风雨萧瑟的地方，回去吧，既无所谓风雨，也无所谓天晴。","hard":"「萧瑟」草字头；「蓑」草字头下是「衰」；「斜」右边是「斗」。","point":"「也无风雨也无晴」双关人生的顺逆，是必考名句；「一蓑烟雨任平生」写旷达。"},"太常引·建康中秋夜为吕叔潜赋::0":{"why":"上片从「一轮秋影转金波，飞镜又重磨」写中秋月色，并问「被白发、欺人奈何」，抒发年华虚度之恨；下片说「乘风好去，长空万里，直下看山河」，视野已经打开；既然要看清山河，就要解决遮月的桂树，末句以「斫去桂婆娑」作结，含铲除奸邪的寓意。","mean":"砍去那棵婆娑的桂树，人们说，这样月亮的光辉会更加明亮。","hard":"「斫」石字旁加「斤」，读 zhuó；「婆娑」两字都是女字底；「磨」下面是「石」。","point":"「桂婆娑」隐喻遮蔽贤路的权奸（象征手法），是理解本词的关键。"},"浣溪沙（身向云山那畔行）::0":{"why":"上片写「身向云山那畔行，北风吹断马嘶声」的边塞行程与「深秋远塞若为情」的茫然；下片用「一抹晚烟荒戍垒，半竿斜日旧关城」两个特写把荒凉写足，景到极处便要抒情，末句以「古今幽恨几时平」把个人愁绪扩大为千古之恨。","mean":"这古往今来的幽恨，什么时候才能平息呢！","hard":"「戍」注意与「戌」「戎」区分；「垒」上面是「厽」，下面是「土」。","point":"边塞词的荒寒意境；由个人愁绪上升到「古今幽恨」，是常考的情感层次。"}};
const DATASET_TIP = "【复习提示】2027 届上海中考古诗文「所学即所考」，六至九年级全部课内古诗文均需熟练掌握。理解性默写不仅考查记忆，更考查对诗句含义、主旨、手法的理解。建议按年级逐篇过关，重点关注通假字、生僻字、易混淆字，做到背得出、写得对、理解得准。";
const KEY = 'yw-moshou-drill-v1';
let MODE = 'hide';
let CUR = {v:0,ii:0};
let STATE = {};   // key -> {n:连续无错次数, ok:日期}
try{ STATE = JSON.parse(localStorage.getItem(KEY)||'{}'); }catch(e){ STATE={}; }

const FLAT = [];
DATA.forEach((v,vi)=>v.items.forEach((it,ii)=>FLAT.push({v,vi,ii,it})));

function save(){ try{ localStorage.setItem(KEY, JSON.stringify(STATE)); }catch(e){} }
function k(vi,ii){ return vi+'-'+ii; }
function streak(vi,ii){ return (STATE[k(vi,ii)]||{}).n||0; }

/* ---------------- 侧栏 ---------------- */
function buildSide(){
  const el=document.getElementById('sec-list');
  el.innerHTML = DATA.map((v,vi)=>{
    const done = v.items.filter((_,ii)=>streak(vi,ii)>=3).length;
    const cls = done===v.items.length?'full':(done>0?'half':'');
    return `<div class="vol" data-v="${vi}">
      <div class="vol-head"><span class="vol-dot ${cls}"></span>
        <span class="vol-name">${v.volume}</span><span class="vol-n">${done}/${v.items.length}</span></div>
      <div class="vol-items">${v.items.map((it,ii)=>{
        const s=streak(vi,ii);
        const ok = s>=3 ? '<span class="pi-ok">✓</span>' : (s>0?`<span class="pi-no">${s}</span>`:'');
        const t = it.type==='文言文'?'wy':'';
        return `<div class="pi" data-v="${vi}" data-i="${ii}">
          <span class="pi-t">${it.no}. ${it.title}</span>
          <span class="pi-type ${t}">${it.type}</span>${ok}</div>`;
      }).join('')}</div></div>`;
  }).join('');
  el.querySelectorAll('.vol-head').forEach(h=>{
    h.onclick=()=>h.parentElement.classList.toggle('open');
  });
  el.querySelectorAll('.pi').forEach(p=>{
    p.onclick=()=>{ CUR={v:+p.dataset.v,ii:+p.dataset.i}; openVol(+p.dataset.v); render(); };
  });
  updFoot();
}
function openVol(vi){
  document.querySelectorAll('.vol').forEach(e=>e.classList.toggle('open', +e.dataset.v===vi));
  document.querySelectorAll('.pi').forEach(e=>{
    e.classList.toggle('active', +e.dataset.v===CUR.v && +e.dataset.i===CUR.ii);
  });
}
function updFoot(){
  const done = FLAT.filter(x=>streak(x.vi,x.ii)>=3).length;
  document.getElementById('doneN').textContent = done;
  document.getElementById('progress-fill').style.width = (done/86*100)+'%';
}

/* ---------------- 填空默写（逐句给提示挖句） ---------------- */
/* 断句：句末标点连同收尾的右引号／书名号一起切走。
   旧实现只按 [。！？] 切，于是「……此之谓大丈夫。」」这类句子的右引号被切成独立片段，
   挖出来的「答案」只剩一个右引号；末尾的出处括注（如 （《子张》））也会单独成句。此处一并修掉。 */
function splitSent(para){
  if(para.indexOf('【')===0) return [];   // 非诗文段落（数据附注）不挖空
  const parts=[]; let last=0, m;
  const TERM=/[。！？][”’"）)】]*/g;
  while((m=TERM.exec(para))){ parts.push(para.slice(last, m.index+m[0].length)); last=m.index+m[0].length; }
  if(last<para.length) parts.push(para.slice(last));
  const tailQ=/^[”’"'）)】]+$/;
  const annTail=/^[（(《【][^。！？]{0,14}[)）】》]$/;
  const annLead=/^[（(《【][^。！？]{0,14}[)）】》]/;
  while(parts.length>1 && tailQ.test(parts[parts.length-1].trim())) parts[parts.length-2]+=parts.pop();
  while(parts.length>1 && annTail.test(parts[parts.length-1].trim())) parts[parts.length-2]+=parts.pop();
  for(let i=1;i<parts.length;i++){
    const s=parts[i].match(annLead);
    if(s){ parts[i-1]+=s[0]; parts[i]=parts[i].slice(s[0].length).trim(); }
  }
  return parts;
}
/* 该段被挖走的那一句（＝答案），背诵模式的解析里要标出来 */
function targetOf(para){
  const parts = splitSent(para);
  return parts.length<2 ? '' : parts[parts.length-1];
}
/* 一道题的答案解析 */
function noteHTML(nk){
  const n = NOTES[nk];
  if(!n) return '';
  const row=(lab,txt)=>txt?`<div class="ar"><b>${lab}</b><span>${txt}</span></div>`:'';
  return `<div class="ana-t">答案解析</div><div class="ana-in">`
    + row('为什么是这句', n.why) + row('句意', n.mean) + row('易错字', n.hard) + row('考点', n.point)
    + `</div>`;
}
function pickCue(it, para, pi){
  // 真实理解性默写是「给一句语境，写一句」，所以只挖该段最后一句，前文作提示
  const parts = splitSent(para);
  if(parts.length<2) return null;
  const cueAll = parts.slice(0,-1).join('');
  const target = parts[parts.length-1];
  const n = target.replace(/[，。！？；：、""''《》（）·…—\s]/g,'').length;
  // 长段（文言文常一整段）只保留末尾语境，前面省略，避免整屏高亮
  const cueLen = cueAll.replace(/[，。！？；：、""''《》（）·…—\s]/g,'').length;
  const cue = cueLen>40 ? '<span class="ell">……</span>'+parts.slice(-3,-1).join('') : cueAll;
  return '<span class="cue">'+cue+'</span><span class="blank" data-ans="'+target+'" data-note="'+it.title+'::'+pi+'">'+
         '＿'.repeat(Math.min(14, Math.max(4, n)))+'</span>';
}
function countCues(it){
  return it.paras.reduce((s,p,pi)=>s+(pickCue(it,p,pi)?1:0),0);
}
function renderHide(){
  const {v,ii} = CUR, vol=DATA[v], it=vol.items[ii];
  const cues = it.paras.map((p,pi)=>({html:pickCue(it,p,pi), pi})).filter(c=>c.html);
  const nCue = cues.length;
  const hz = it.hardList.length ? `<div class="hardbox"><h4>本篇易错字（先看这行再默写）</h4>${
    it.hardList.map(h=>`<span class="hz"><b>${h.zi}</b><span>${h.py}</span></span>`).join('')}</div>` : '';
  document.getElementById('view').innerHTML = `
    <div class="note"><b>怎么用：</b>读橙色提示句，在横线上默写缺失的一句——点横线即可输入，按<b>回车</b>下一空。判卷按字比对，<b>错一字该空不得分</b>，判错的空会<b>自动展开答案解析</b>（为什么填这句 / 句意 / 易错字 / 考点）。同一句连续 3 次写对才算过关，左栏出现 ✓。</div>
    <div class="card">
      <div class="title-row">
        <span class="t-no">${vol.volume} · 第${it.no}篇</span>
        <span class="t-name">${it.title}</span>
        <span class="t-au">${it.author||''}</span>
      </div>
      <div class="t-meta">
        <span class="chip">${it.type}</span>
        <span class="chip lv">${it.len} 字</span>
        <span class="chip">${nCue} 空待默</span>
        ${streak(v,ii)>0?`<span class="chip">连续 ${streak(v,ii)} 次</span>`:''}
      </div>
      ${hz}
      <div class="passage">${cues.map(c=>`<div class="qblock"><p>${c.html}</p>
        <div class="ana" hidden>${noteHTML(it.title+'::'+c.pi)}</div></div>`).join('')}</div>
      <div class="judge">
        <button class="btn g" id="check">判卷</button>
        <button class="btn" id="resetWrong" hidden>清空重做</button>
        <button class="btn b" id="toggleAna">显示解析</button>
        <button class="btn" id="pass">全对（跳过填写）</button>
        <button class="btn" id="fail">有错</button>
        <button class="btn" id="showAll">显示全文对照</button>
        <span class="res" id="res"></span>
        <span class="score" id="score"></span>
      </div>
    </div>
    <div class="card" id="ansCard" style="display:none">
      <div class="title-row"><span class="t-name" style="font-size:1.05rem">全文对照 · 逐句解析</span></div>
      <div class="passage">${it.paras.map((p,pi)=>`<p>${p}</p>`
        + (NOTES[it.title+'::'+pi]?`<div class="ana">${noteHTML(it.title+'::'+pi)}</div>`:'')).join('')}</div>
    </div>
    <div class="hbtns">
      <button class="btn" id="prev">← 上一篇</button>
      <button class="btn" id="next">下一篇 →</button>
      <button class="btn b" id="toStat">看总进度</button>
    </div>`;
  const sc=document.getElementById('score');
  const upd=()=>{ sc.textContent = `进度：${FLAT.filter(x=>streak(x.vi,x.ii)>=3).length}/86 篇过关 · 位置 ${v+1}册${it.no}`; };
  upd();

  // 点击横线 → 变成输入框；回车提交并跳下一空
  const blanks=[...document.querySelectorAll('.blank')];
  function anaOf(el){
    const b=el.closest('.qblock');
    return b ? b.querySelector('.ana') : null;
  }
  // 让「显示解析／收起解析」按钮文案始终跟当前展开状态一致（判错会自动展开，按钮要跟着变）
  // 只作用于当前填空的解析（.qblock .ana）；「全文对照」卡里的解析随卡片本身显示，不参与折叠
  function syncAnaBtn(){
    const t=document.getElementById('toggleAna');
    if(!t) return;
    const shown=[...document.querySelectorAll('.qblock .ana')].some(a=>!a.hidden);
    t.textContent = shown ? '收起解析' : '显示解析';
    t.classList.toggle('on', shown);
  }
  function resetBlank(el){
    el.textContent = el.dataset.orig;
    el.classList.remove('filled','right','wrong');
    el.title = '';
    const a=anaOf(el); if(a) a.hidden = true;
    bindBlank(el);
  }
  function bindBlank(el){
    el.onclick = ()=>{
      if(el.querySelector('input')) return;
      const ans = el.dataset.ans;
      el.classList.remove('right','wrong');
      el.classList.add('filled');
      el.textContent = '';
      const inp = document.createElement('input');
      inp.placeholder = '默写这句';
      el.appendChild(inp); inp.focus();
      el.onclick = null;
      const submit = ()=>{
        if(inp.readOnly) return;
        const val = inp.value.trim();
        if(!val){ inp.remove(); el.textContent=el.dataset.orig; el.classList.remove('filled'); bindBlank(el); return; }
        inp.readOnly = true;
        const ok = norm(val)===norm(ans);
        el.classList.remove('filled'); el.classList.add(ok?'right':'wrong');
        el.title = ok ? '✓ 正确' : '✗ 应为：'+ans;
        if(!ok){                                  // 写错就把这句的解析摊开
          resetWrongBtn.hidden = false;
          const a=anaOf(el); if(a) a.hidden = false;
          syncAnaBtn();
        }
      };
      inp.onblur = submit;
      inp.onkeydown = e=>{
        if(e.key==='Enter'){ e.preventDefault(); submit();
          const nx = blanks[blanks.indexOf(el)+1]; if(nx) nx.click(); }
        if(e.key==='Escape'){ e.preventDefault(); inp.remove(); resetBlank(el); }
      };
    };
  }
  blanks.forEach(el=>{ el.dataset.orig = el.textContent; bindBlank(el); });
  function norm(s){ return s.replace(/[\s，。！？；：、"''《》（）·…—]/g,''); }

  const resetWrongBtn = document.getElementById('resetWrong');
  if(resetWrongBtn) resetWrongBtn.onclick = ()=>{ blanks.forEach(resetBlank); resetWrongBtn.hidden = true; syncAnaBtn(); };
  const tgl = document.getElementById('toggleAna');
  if(tgl) tgl.onclick = ()=>{
    const boxes=[...document.querySelectorAll('.qblock .ana')];
    const anyHidden=boxes.some(b=>b.hidden);
    boxes.forEach(b=>b.hidden=!anyHidden);
    syncAnaBtn();
  };
  syncAnaBtn();
  document.getElementById('showAll').onclick=()=>{
    const c=document.getElementById('ansCard');
    c.style.display='block';
    c.scrollIntoView({behavior:'smooth',block:'start'});
  };
  document.getElementById('check').onclick=()=>{
    // 没填的空算错；判错的空自动展开解析
    let ok=0, total=blanks.length;
    blanks.forEach(el=>{
      if(el.classList.contains('right')) ok++;
      else {
        if(!el.classList.contains('filled')){ el.classList.add('wrong'); el.title='✗ 未作答'; }
        const a=anaOf(el); if(a) a.hidden=false;
      }
    });
    syncAnaBtn();
    judge(ok===total, ok===total?'':`${total-ok} / ${total} 空有错`);
  };
  document.getElementById('pass').onclick=()=>judge(true);
  document.getElementById('fail').onclick=()=>judge(false);
  document.getElementById('prev').onclick=()=>move(-1);
  document.getElementById('next').onclick=()=>move(1);
  document.getElementById('toStat').onclick=()=>{ MODE='stat'; syncBtn(); render(); };
  function judge(ok, detail){
    const kk=k(v,ii); STATE[kk]=STATE[kk]||{n:0,ok:''};
    const r=document.getElementById('res');
    if(ok){ STATE[kk].n=(STATE[kk].n||0)+1; STATE[kk].ok=new Date().toISOString().slice(0,10);
      r.className='res ok';
      r.textContent = STATE[kk].n>=3 ? '✓ 过关（连续3次全对）' : `✓ 记一次，还差 ${3-STATE[kk].n} 次`;
    } else { STATE[kk].n=0; r.className='res no';
      r.textContent='✗ 连续次数归零'+ (detail?'（'+detail+'）':'') + '，明天重来'; }
    save(); buildSide(); openVol(v); upd();
  }
}

/* ---------------- 背诵模式：逐句遮挡 ---------------- */
function renderRecite(){
  const {v,ii} = CUR, vol=DATA[v], it=vol.items[ii];
  const hz = it.hardList.length ? `<div class="hardbox"><h4>易错字</h4>${
    it.hardList.map(h=>`<span class="hz"><b>${h.zi}</b><span>${h.py}</span></span>`).join('')}</div>` : '';
  const body = it.paras.map(p=>p.split(/(?<=[。！？])/).filter(Boolean)
    .map(s=>`<span class="rline hidden">${s}</span>`).join('')).join('');
  document.getElementById('view').innerHTML=`
    <div class="hint">逐句自测：先在心里接下一句，点句子看答案。长按拖选可给重点句高亮。</div>
    <div class="card">
      <div class="title-row">
        <span class="t-no">${vol.volume} · 第${it.no}篇</span>

        <span class="t-au">${it.author||''}</span>

      <div class="t-meta"><span class="chip">${it.type}</span><span class="chip lv">${it.len} 字</span></div>

    <div class="card" id="reciteAna" style="display:none">
      <div class="title-row"><span class="t-name" style="font-size:1.05rem">逐句解析 · 为什么是这一句</span></div>
      ${it.paras.map((p,pi)=> NOTES[it.title+'::'+pi]
        ? `<div class="qblock"><p style="font-family:var(--serif);font-size:1rem;font-weight:700;margin-bottom:.3rem">${targetOf(p)}</p><div class="ana">${noteHTML(it.title+'::'+pi)}</div></div>`
        : '').join('')}
    </div>
    <div class="hbtns">
      <button class="btn" id="revealAll">全部显示</button>
      <button class="btn" id="hideAll">全部遮住</button>
      <button class="btn b" id="showReciteAna">本篇逐句解析</button>
      <button class="btn" id="prev">← 上一篇</button>

  document.querySelectorAll('.rline').forEach(el=>{

  document.getElementById('revealAll').onclick=()=>document.querySelectorAll('.rline').forEach(e=>e.classList.remove('hidden'));
  document.getElementById('hideAll').onclick=()=>document.querySelectorAll('.rline').forEach(e=>e.classList.add('hidden'));
  const sra=document.getElementById('showReciteAna');
  if(sra) sra.onclick=()=>{
    const c=document.getElementById('reciteAna');
    c.style.display = c.style.display==='none' ? 'block' : 'none';
    if(c.style.display==='block') c.scrollIntoView({behavior:'smooth',block:'start'});
  };
  document.getElementById('prev').onclick=()=>move(-1);
  document.getElementById('next').onclick=()=>move(1);
}

/* ---------------- 易错字表 ---------------- */
function renderReview(){
  const map = new Map();
  FLAT.forEach(({v,ii,it})=>it.hardList.forEach(h=>{
    if(!map.has(h.zi)) map.set(h.zi,{py:h.py,titles:[]});
    map.get(h.zi).titles.push(it.title);
  }));
  const rows=[...map.entries()].sort((a,b)=>b[1].titles.length-a[1].titles.length);
  document.getElementById('view').innerHTML=`
    <div class="note"><b>共 ${map.size} 个易错字</b>，来自 86 篇默写。排在前面的字跨篇重复出现，默写命中率最高，优先背。左栏点任一篇可回该篇练习。</div>

/* ---------------- 导航 ---------------- */
function move(d){
  const idx = FLAT.findIndex(x=>x.vi===CUR.v && x.ii===CUR.ii);
  const n = Math.min(FLAT.length-1, Math.max(0, idx+d));
  CUR={v:FLAT[n].vi, ii:FLAT[n].ii};
  openVol(CUR.v); render(); window.scrollTo(0,0);
}
function syncBtn(){
  const m={'hide':'mHide','recite':'mRecite','review':'mReview','stat':'mStat'};
  for(const k in m) document.getElementById(m[k]).classList.toggle('on', MODE===k);
}
function render(){
  syncBtn();
  if(MODE==='hide') renderHide();
  else if(MODE==='recite') renderRecite();
  else if(MODE==='review') renderReview();
  else renderStat();
}
document.getElementById('mHide').onclick=()=>{MODE='hide';render();};
document.getElementById('mRecite').onclick=()=>{MODE='recite';render();};
document.getElementById('mReview').onclick=()=>{MODE='review';render();};
document.getElementById('mStat').onclick=()=>{MODE='stat';render();};
document.getElementById('mReset').onclick=()=>{
  if(confirm('清空全部默写进度记录？此操作不可撤销。')){ STATE={}; save(); buildSide(); render(); }
};
document.getElementById('fold').onclick=()=>document.body.classList.toggle('collapsed');

buildSide(); openVol(CUR.v); render();
</script>
