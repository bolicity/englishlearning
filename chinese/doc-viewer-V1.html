<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>语文学科资料在线预览中心 V1.0 - 商务极简版</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-main: #F8FAFC;
      --bg-card: #FFFFFF;
      --bg-subtle: #F1F5F9;
      --border-color: #E2E8F0;
      --text-main: #0F172A;
      --text-secondary: #334155;
      --text-muted: #64748B;
      --primary: #2563EB;
      --primary-soft: #EFF6FF;
      --primary-border: #BFDBFE;
      --radius-sm: 8px;
      --radius-md: 12px;
      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Plus Jakarta Sans', 'Inter', system-ui, -apple-system, sans-serif;
      background-color: var(--bg-main);
      color: var(--text-main);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      background: #FFFFFF;
      border-bottom: 1px solid var(--border-color);
      padding: 12px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 64px;
      box-shadow: var(--shadow-sm);
      z-index: 50;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      background: var(--bg-subtle);
      color: var(--text-secondary);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.2s ease;
    }

    .back-btn:hover {
      background: var(--primary-soft);
      color: var(--primary);
      border-color: var(--primary-border);
    }

    .title-area {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .subj-badge {
      background: linear-gradient(135deg, #2563EB, #1D4ED8);
      color: #FFFFFF;
      font-size: 12px;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 20px;
    }

    .doc-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 550px;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .tool-btn {
      padding: 8px 14px;
      font-size: 13px;
      font-weight: 600;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-color);
      background: #FFFFFF;
      color: var(--text-secondary);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      text-decoration: none;
      transition: all 0.2s ease;
    }

    .tool-btn:hover {
      background: var(--bg-subtle);
      color: var(--text-main);
    }

    .tool-btn.primary {
      background: var(--primary);
      color: #FFFFFF;
      border-color: var(--primary);
    }

    .tool-btn.primary:hover {
      background: #1D4ED8;
    }

    .viewer-layout {
      display: grid;
      grid-template-columns: 340px 1fr;
      flex: 1;
      height: calc(100vh - 64px);
      overflow: hidden;
    }

    .sidebar {
      background: #FFFFFF;
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    .sidebar-header {
      padding: 16px;
      border-bottom: 1px solid var(--border-color);
    }

    .sidebar-title {
      font-size: 14px;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .search-input {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      font-size: 13px;
      outline: none;
      transition: border-color 0.2s ease;
    }

    .search-input:focus {
      border-color: var(--primary);
    }

    .file-list {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .file-item {
      padding: 12px 14px;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      background: #FFFFFF;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .file-item:hover {
      border-color: var(--primary-border);
      background: var(--primary-soft);
    }

    .file-item.active {
      border-color: var(--primary);
      background: var(--primary-soft);
      box-shadow: var(--shadow-sm);
    }

    .file-item-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-main);
      margin-bottom: 6px;
      line-height: 1.4;
      word-break: break-all;
    }

    .file-item-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      color: var(--text-muted);
    }

    .file-tag {
      background: #E2E8F0;
      color: #334155;
      padding: 1px 6px;
      border-radius: 4px;
      font-weight: 500;
    }

    .preview-container {
      background: #F1F5F9;
      position: relative;
      height: 100%;
      width: 100%;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      background: #FFFFFF;
    }

    @media (max-width: 768px) {
      .viewer-layout {
        grid-template-columns: 1fr;
      }
      .sidebar {
        display: none;
      }
      .sidebar.mobile-open {
        display: flex;
        position: fixed;
        top: 64px;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 100;
      }
    }
  </style>
</head>
<body>

  <header>
    <div class="header-left">
      <a href="chinese.html" class="back-btn">
        ← 返回语文中心
      </a>
      <div class="title-area">
        <span class="subj-badge">📖 语文资料库</span>
        <h1 class="doc-title" id="currentDocTitle">选择材料开始预览</h1>
      </div>
    </div>
    <div class="header-right">
      <button class="tool-btn" id="mobileListBtn" onclick="toggleMobileSidebar()" style="display: none;">📁 文件目录</button>
      <a id="downloadBtn" href="#" download class="tool-btn primary">⬇️ 下载当前文件</a>
      <a id="openNewTabBtn" href="#" target="_blank" class="tool-btn">↗️ 新标签打开</a>
    </div>
  </header>

  <div class="viewer-layout">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-title">
          <span>📚 语文配全材料 (7 份)</span>
          <span style="font-size: 11px; color: var(--text-muted);">PDF扫描版</span>
        </div>
        <input type="text" class="search-input" placeholder="🔍 搜索资料名称..." oninput="filterFiles(this.value)">
      </div>
      <div class="file-list" id="fileList"></div>
    </aside>

    <main class="preview-container">
      <iframe id="pdfViewer" src="about:blank" title="文档在线预览视窗"></iframe>
    </main>
  </div>

  <script>
    const filesData = [{"filename": "（上海专用）专项06  写作（原卷版）2027年中考语文必考点“真题 模拟”暑假体验练_扫描版.pdf", "rel_path": "docs/（上海专用）专项06  写作（原卷版）2027年中考语文必考点“真题 模拟”暑假体验练_扫描版.pdf", "size": "2.95 MB", "tag": "必背考点"}, {"filename": "（上海专用）专项03 文学性文本阅读（解析版）2027年中考语文必考点“真题 模拟”暑假体验练_扫描版.pdf", "rel_path": "docs/（上海专用）专项03 文学性文本阅读（解析版）2027年中考语文必考点“真题 模拟”暑假体验练_扫描版.pdf", "size": "32.86 MB", "tag": "必背考点"}, {"filename": "（上海专用）专项02 文言文阅读（解析版）2027年中考语文必考点“真题 模拟”暑假体验练_扫描版.pdf", "rel_path": "docs/（上海专用）专项02 文言文阅读（解析版）2027年中考语文必考点“真题 模拟”暑假体验练_扫描版.pdf", "size": "24.59 MB", "tag": "必背考点"}, {"filename": "【语文】39页中考名著阅读考点整理（含新增）（内部）_扫描版.pdf", "rel_path": "docs/【语文】39页中考名著阅读考点整理（含新增）（内部）_扫描版.pdf", "size": "23.79 MB", "tag": "必背考点"}, {"filename": "专题01 基础积累与语言运用（上海专用）（原卷版）_扫描版.pdf", "rel_path": "docs/专题01 基础积累与语言运用（上海专用）（原卷版）_扫描版.pdf", "size": "5.81 MB", "tag": "真题原卷版"}, {"filename": "（上海专用）专项01 名篇名句默写（解析版）2027年中考语文必考点“真题 模拟”暑假体验练_扫描版.pdf", "rel_path": "docs/（上海专用）专项01 名篇名句默写（解析版）2027年中考语文必考点“真题 模拟”暑假体验练_扫描版.pdf", "size": "4.55 MB", "tag": "必背考点"}, {"filename": "26秋九上语文练习册答案（新）_扫描版.pdf", "rel_path": "docs/26秋九上语文练习册答案（新）_扫描版.pdf", "size": "12.45 MB", "tag": "练习册答案"}];
    let currentFileIndex = 0;

    function renderFileList(filterText = '') {
      const container = document.getElementById('fileList');
      container.innerHTML = '';

      filesData.forEach((file, idx) => {
        if (filterText && !file.filename.toLowerCase().includes(filterText.toLowerCase())) {
          return;
        }

        const item = document.createElement('div');
        item.className = `file-item ${idx === currentFileIndex ? 'active' : ''}`;
        item.onclick = () => selectFile(idx);

        item.innerHTML = `
          <div class="file-item-title">${file.filename}</div>
          <div class="file-item-meta">
            <span class="file-tag">${file.tag}</span>
            <span>💾 ${file.size}</span>
          </div>
        `;
        container.appendChild(item);
      });
    }

    function selectFile(index) {
      if (index < 0 || index >= filesData.length) return;
      currentFileIndex = index;
      const file = filesData[index];

      document.getElementById('currentDocTitle').innerText = file.filename;
      
      const fileUrl = file.rel_path;
      document.getElementById('pdfViewer').src = fileUrl;
      document.getElementById('downloadBtn').href = fileUrl;
      document.getElementById('openNewTabBtn').href = fileUrl;

      renderFileList();

      const sidebar = document.getElementById('sidebar');
      sidebar.classList.remove('mobile-open');
    }

    function filterFiles(val) {
      renderFileList(val);
    }

    function toggleMobileSidebar() {
      const sidebar = document.getElementById('sidebar');
      sidebar.classList.toggle('mobile-open');
    }

    // 解析 URL 参数 ?file=docs/... 自动定位文件
    const urlParams = new URLSearchParams(window.location.search);
    const targetFile = urlParams.get('file');

    let initialIndex = 0;
    if (targetFile) {
      const foundIdx = filesData.findIndex(f => f.rel_path === targetFile || f.filename === targetFile || targetFile.includes(f.filename));
      if (foundIdx !== -1) initialIndex = foundIdx;
    }

    if (filesData.length > 0) {
      selectFile(initialIndex);
    }

    if (window.innerWidth <= 768) {
      document.getElementById('mobileListBtn').style.display = 'inline-flex';
    }
  </script>
</body>
</html>
