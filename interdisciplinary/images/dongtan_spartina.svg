<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="100%" height="100%">
  <rect width="800" height="360" fill="#f8fafc" rx="10"/>
  <g transform="translate(20, 20)">
    <rect width="360" height="320" fill="#ffffff" stroke="#cbd5e1" rx="8"/>
    <text x="180" y="28" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="middle">图1 崇明东滩滩涂湿地与物种竞争分布</text>
    <path d="M 40 100 Q 180 80 320 120 L 320 300 L 40 300 Z" fill="#f1f5f9" stroke="#94a3b8"/>
    <!-- Native reed/scirpus -->
    <rect x="50" y="180" width="110" height="100" fill="#ecfdf5" stroke="#10b981" rx="4"/>
    <text x="105" y="205" font-size="11" font-weight="bold" fill="#047857" text-anchor="middle">本土海三棱藨草</text>
    <text x="105" y="225" font-size="10" fill="#065f46" text-anchor="middle">矮小稀疏(植株≤60cm)</text>
    <text x="105" y="245" font-size="10" fill="#065f46" text-anchor="middle">候鸟天然觅食地(球茎)</text>
    <!-- Invasive Spartina -->
    <rect x="180" y="140" width="130" height="140" fill="#fef2f2" stroke="#ef4444" rx="4"/>
    <text x="245" y="165" font-size="11" font-weight="bold" fill="#b91c1c" text-anchor="middle">入侵物种：互花米草</text>
    <text x="245" y="185" font-size="10" fill="#991b1b" text-anchor="middle">高大密集(高2-3米)</text>
    <text x="245" y="205" font-size="10" fill="#991b1b" text-anchor="middle">根系盘结·侵占潮沟</text>
    <text x="245" y="225" font-size="10" fill="#991b1b" text-anchor="middle">鸟类无法降落停歇</text>
  </g>
  <g transform="translate(400, 20)">
    <rect width="380" height="320" fill="#ffffff" stroke="#cbd5e1" rx="8"/>
    <text x="190" y="28" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="middle">图2 “围堰水淹法”物理治理杀灭米草原理</text>
    <!-- Water level -->
    <rect x="40" y="70" width="300" height="120" fill="#bae6fd" stroke="#0284c7" rx="4"/>
    <text x="190" y="95" font-size="12" font-weight="bold" fill="#0369a1" text-anchor="middle">围堰蓄水淹浸(水深 40~60cm · 持续6个月)</text>
    <!-- Submerged Spartina -->
    <line x1="110" y1="190" x2="110" y2="110" stroke="#ca8a04" stroke-width="4" stroke-dasharray="4,2"/>
    <line x1="190" y1="190" x2="190" y2="100" stroke="#ca8a04" stroke-width="4" stroke-dasharray="4,2"/>
    <line x1="270" y1="190" x2="270" y2="115" stroke="#ca8a04" stroke-width="4" stroke-dasharray="4,2"/>
    <!-- Mud layer -->
    <rect x="40" y="190" width="300" height="60" fill="#78350f" rx="0"/>
    <text x="190" y="225" font-size="11" font-weight="bold" fill="#fef3c7" text-anchor="middle">滩涂淤泥层：地下根茎处于严重缺氧环境</text>
    <!-- Biological result -->
    <rect x="40" y="260" width="300" height="44" fill="#fef2f2" stroke="#f87171" rx="4"/>
    <text x="190" y="287" font-size="11" font-weight="bold" fill="#b91c1c" text-anchor="middle">无氧呼吸产生酒精毒害根系 -> 根茎彻底腐烂死亡</text>
  </g>
</svg>