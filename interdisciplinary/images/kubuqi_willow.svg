<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="100%" height="100%">
  <rect width="800" height="360" fill="#f8fafc" rx="10"/>
  <g transform="translate(20, 20)">
    <rect width="360" height="320" fill="#ffffff" stroke="#cbd5e1" rx="8"/>
    <text x="180" y="28" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="middle">图1 沙丘迎风坡植被与风沙动力特征</text>
    <!-- Wind -->
    <text x="40" y="60" font-size="12" font-weight="bold" fill="#0284c7">西北季风(强风)</text>
    <path d="M 40 75 L 120 75" stroke="#0284c7" stroke-width="3" stroke-dasharray="5,3"/>
    <!-- Dune Shape -->
    <path d="M 30 250 Q 150 200 220 120 L 290 250 Z" fill="#fef08a" stroke="#ca8a04" stroke-width="2"/>
    <text x="140" y="190" font-size="11" fill="#854d0e">缓迎风坡(种植沙柳带)</text>
    <text x="260" y="190" font-size="11" fill="#854d0e">陡背风坡</text>
    <!-- Windbreak willow -->
    <line x1="110" y1="215" x2="110" y2="165" stroke="#15803d" stroke-width="4"/>
    <line x1="150" y1="195" x2="150" y2="145" stroke="#15803d" stroke-width="4"/>
    <text x="180" y="280" font-size="11" font-weight="bold" fill="#15803d" text-anchor="middle">增加地表糙度 · 降低风速达 60%</text>
  </g>
  <g transform="translate(400, 20)">
    <rect width="380" height="320" fill="#ffffff" stroke="#cbd5e1" rx="8"/>
    <text x="190" y="28" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="middle">图2 沙柳“沙埋生根 + 越剪越旺”生理机能</text>
    <!-- Sand burial layer -->
    <path d="M 40 220 Q 190 200 340 220 L 340 270 L 40 270 Z" fill="#fef3c7" stroke="#eab308"/>
    <!-- Stem & Adventitious roots -->
    <line x1="190" y1="260" x2="190" y2="90" stroke="#854d0e" stroke-width="6"/>
    <!-- Branch -->
    <path d="M 190 140 L 150 100" stroke="#16a34a" stroke-width="3"/>
    <path d="M 190 120 L 230 80" stroke="#16a34a" stroke-width="3"/>
    <!-- Roots in sand -->
    <path d="M 190 210 Q 150 220 120 240" stroke="#b45309" stroke-width="3"/>
    <path d="M 190 230 Q 230 240 260 250" stroke="#b45309" stroke-width="3"/>
    <path d="M 190 250 Q 190 270 190 290" stroke="#b45309" stroke-width="4"/>
    <text x="270" y="210" font-size="11" font-weight="bold" fill="#b45309">沙埋促发大量不定根</text>
    <text x="270" y="230" font-size="10" fill="#475569">紧抓流沙 · 水网深扎地下</text>
    <!-- 3 Year Pruning -->
    <rect x="40" y="275" width="300" height="35" fill="#ecfdf5" stroke="#10b981" rx="4"/>
    <text x="190" y="297" font-size="11" font-weight="bold" fill="#047857" text-anchor="middle">三年平茬复壮：解除顶端优势，侧芽丛生倍增</text>
  </g>
</svg>