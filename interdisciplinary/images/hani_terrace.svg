<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="100%" height="100%">
  <rect width="800" height="360" fill="#f8fafc" rx="10"/>
  <g transform="translate(20, 20)">
    <rect width="760" height="320" fill="#ffffff" stroke="#cbd5e1" rx="8"/>
    <text x="380" y="28" font-family="sans-serif" font-size="15" font-weight="bold" fill="#0f172a" text-anchor="middle">云南元阳哀牢山“山顶森林 - 山腰村寨 - 山坡梯田 - 山谷河江”垂直立体生态系统</text>
    <!-- Slope -->
    <path d="M 40 70 L 160 70 L 320 140 L 520 220 L 720 280 L 720 300 L 40 300 Z" fill="#f1f5f9" stroke="#94a3b8"/>
    <!-- Zone 1: Forest -->
    <rect x="50" y="50" width="130" height="65" fill="#ecfdf5" stroke="#059669" rx="6"/>
    <text x="115" y="72" font-size="12" font-weight="bold" fill="#047857" text-anchor="middle">① 山顶森林 (2000m+)</text>
    <text x="115" y="90" font-size="10" fill="#065f46" text-anchor="middle">涵养水源·保持水土</text>
    <text x="115" y="105" font-size="10" fill="#065f46" text-anchor="middle">汇聚降雨与高山雾水</text>
    <!-- Spring streams -->
    <path d="M 180 85 Q 240 95 240 130" stroke="#0284c7" stroke-width="4" fill="none" stroke-dasharray="4,2"/>
    <!-- Zone 2: Village -->
    <rect x="200" y="120" width="140" height="65" fill="#fffbeb" stroke="#d97706" rx="6"/>
    <text x="270" y="142" font-size="12" font-weight="bold" fill="#b45309" text-anchor="middle">② 山腰村寨 (1500~2000m)</text>
    <text x="270" y="160" font-size="10" fill="#92400e" text-anchor="middle">聚落建在梯田上方水源下</text>
    <text x="270" y="175" font-size="10" fill="#92400e" text-anchor="middle">生活污水经沉淀自流施肥</text>
    <!-- Water to terrace -->
    <path d="M 340 150 Q 400 170 420 200" stroke="#0284c7" stroke-width="4" fill="none" stroke-dasharray="4,2"/>
    <!-- Zone 3: Terraces -->
    <rect x="380" y="190" width="180" height="75" fill="#eff6ff" stroke="#2563eb" rx="6"/>
    <text x="470" y="212" font-size="12" font-weight="bold" fill="#1d4ed8" text-anchor="middle">③ 山坡千级梯田 (1000~1500m)</text>
    <text x="470" y="230" font-size="10" fill="#1e40af" text-anchor="middle">等高线修筑·自流灌溉·水土不流失</text>
    <text x="470" y="248" font-size="10" fill="#1e40af" text-anchor="middle">“稻-鱼-鸭”复合共生生态圈</text>
    <!-- Zone 4: River -->
    <rect x="590" y="255" width="130" height="55" fill="#f0fdf4" stroke="#16a34a" rx="6"/>
    <text x="655" y="275" font-size="12" font-weight="bold" fill="#15803d" text-anchor="middle">④ 山谷江河 (&lt;1000m)</text>
    <text x="655" y="295" font-size="10" fill="#166534" text-anchor="middle">气温高·水分剧烈蒸发</text>
    <!-- Evaporation arrow back to mountain -->
    <path d="M 670 250 C 670 120 400 30 140 40" stroke="#9333ea" stroke-width="3" stroke-dasharray="6,3" fill="none"/>
    <text x="450" y="45" font-size="11" font-weight="bold" fill="#9333ea">谷底水汽受热蒸发抬升遇冷成云雾 -> 回到山顶降水闭环</text>
  </g>
</svg>