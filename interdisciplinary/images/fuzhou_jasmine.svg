<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="100%" height="100%">
  <defs>
    <linearGradient id="basinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#86efac" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#16a34a" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="riverGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>
  <rect width="800" height="360" fill="#f8fafc" rx="10"/>
  <!-- Left: Basin & River Diagram -->
  <g transform="translate(20, 20)">
    <rect width="360" height="320" fill="#ffffff" stroke="#cbd5e1" rx="8"/>
    <text x="180" y="28" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="middle">图1 福州冲积盆地与茉莉花种植区分布</text>
    <!-- Mountains -->
    <path d="M 20 220 Q 80 100 140 180 Q 200 80 260 170 Q 310 110 340 220 Z" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="70" y="140" font-size="11" fill="#15803d">北面群山屏障</text>
    <text x="270" y="130" font-size="11" fill="#15803d">阻挡冷空气</text>
    <!-- River Plain -->
    <path d="M 40 250 C 120 230 220 270 320 240 L 320 300 L 40 300 Z" fill="#fef08a" stroke="#ca8a04" stroke-dasharray="3,3"/>
    <path d="M 40 270 C 130 255 210 280 320 260" stroke="url(#riverGrad)" stroke-width="14" fill="none" stroke-linecap="round"/>
    <text x="180" y="270" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">闽江冲积平原（沙壤土·透水透气）</text>
    <text x="180" y="310" font-size="11" fill="#0369a1" text-anchor="middle">水汽充沛 · 根系发达怕积水</text>
  </g>
  <!-- Right: Temp & Aroma Curve -->
  <g transform="translate(400, 20)">
    <rect width="380" height="320" fill="#ffffff" stroke="#cbd5e1" rx="8"/>
    <text x="190" y="28" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="middle">图2 三伏天气温与茉莉花开放释香率</text>
    <!-- Axes -->
    <line x1="50" y1="270" x2="350" y2="270" stroke="#475569" stroke-width="1.5"/>
    <line x1="50" y1="50" x2="50" y2="270" stroke="#475569" stroke-width="1.5"/>
    <!-- Labels -->
    <text x="40" y="60" font-size="11" fill="#e11d48" text-anchor="end">气温(℃)</text>
    <text x="360" y="275" font-size="11" fill="#475569">时间</text>
    <text x="80" y="290" font-size="11" fill="#64748b">清晨6点</text>
    <text x="180" y="290" font-size="11" fill="#64748b">午后14点(日照峰值)</text>
    <text x="300" y="290" font-size="11" fill="#64748b">晚21点(三伏窨花)</text>
    <!-- Temp curve (red) -->
    <path d="M 50 220 Q 180 80 350 180" fill="none" stroke="#ef4444" stroke-width="2.5"/>
    <!-- Aroma curve (purple) -->
    <path d="M 50 250 C 150 250 240 220 290 100 C 310 160 350 200 350 220" fill="none" stroke="#9333ea" stroke-width="2.5" stroke-dasharray="4,2"/>
    <!-- Peak annotation -->
    <circle cx="290" cy="100" r="4" fill="#9333ea"/>
    <text x="290" y="85" font-size="11" font-weight="bold" fill="#9333ea" text-anchor="middle">夜间21-22点 释香峰值(芳香油挥发)</text>
    <!-- Legend -->
    <rect x="70" y="45" width="200" height="35" fill="#f8fafc" rx="4" stroke="#e2e8f0"/>
    <line x1="80" y1="58" x2="105" y2="58" stroke="#ef4444" stroke-width="2"/>
    <text x="115" y="62" font-size="10" fill="#334155">气温曲线(日温达35-38℃)</text>
    <line x1="80" y1="72" x2="105" y2="72" stroke="#9333ea" stroke-width="2" stroke-dasharray="4,2"/>
    <text x="115" y="76" font-size="10" fill="#334155">茉莉精油挥发率(伏花品质最佳)</text>
  </g>
</svg>