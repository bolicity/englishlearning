<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="100%" height="100%">
  <rect width="800" height="360" fill="#f8fafc" rx="10"/>
  <!-- Left: Shading & Soil Evaporation -->
  <g transform="translate(20, 20)">
    <rect width="360" height="320" fill="#ffffff" stroke="#cbd5e1" rx="8"/>
    <text x="180" y="28" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="middle">图1 光伏板遮阴对土壤蒸发与草层高度影响</text>
    <!-- Sun -->
    <circle cx="60" cy="60" r="18" fill="#f59e0b"/>
    <line x1="60" y1="85" x2="120" y2="130" stroke="#fbbf24" stroke-width="2" stroke-dasharray="3,3"/>
    <!-- PV Panel -->
    <polygon points="100,120 240,80 250,90 110,130" fill="#1e3a8a" stroke="#0f172a" stroke-width="1.5"/>
    <!-- Stand -->
    <line x1="160" y1="105" x2="160" y2="220" stroke="#475569" stroke-width="3"/>
    <line x1="220" y1="90" x2="220" y2="220" stroke="#475569" stroke-width="3"/>
    <!-- Ground -->
    <line x1="30" y1="220" x2="330" y2="220" stroke="#78350f" stroke-width="3"/>
    <!-- Grass under panel -->
    <path d="M 120 220 L 130 170 L 140 220 L 150 160 L 160 220 L 180 155 L 190 220 L 210 165 L 220 220" stroke="#16a34a" stroke-width="2.5" fill="none"/>
    <text x="170" y="250" font-size="11" font-weight="bold" fill="#16a34a" text-anchor="middle">板下：遮阴降温·蒸发↓30%·草高达40cm</text>
    <!-- Bare ground outside -->
    <path d="M 260 220 L 270 205 L 280 220 L 300 210 L 310 220" stroke="#ca8a04" stroke-width="1.5" fill="none"/>
    <text x="290" y="200" font-size="10" fill="#a16207">荒漠露天地表</text>
  </g>
  <!-- Right: Ecological Loop -->
  <g transform="translate(400, 20)">
    <rect width="380" height="320" fill="#ffffff" stroke="#cbd5e1" rx="8"/>
    <text x="190" y="28" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="middle">图2 “光伏板-优质牧草-光伏羊-防风固沙”闭环</text>
    <!-- 4 Nodes Circle -->
    <!-- Node 1: PV Panels -->
    <rect x="130" y="50" width="120" height="44" fill="#eff6ff" stroke="#2563eb" rx="6"/>
    <text x="190" y="77" font-size="12" font-weight="bold" fill="#1e40af" text-anchor="middle">太阳能光伏发电</text>
    <!-- Node 2: Grass Growth -->
    <rect x="250" y="130" width="110" height="44" fill="#ecfdf5" stroke="#059669" rx="6"/>
    <text x="305" y="157" font-size="12" font-weight="bold" fill="#065f46" text-anchor="middle">板下保水牧草疯长</text>
    <!-- Node 3: Sheep -->
    <rect x="130" y="220" width="120" height="44" fill="#fffbeb" stroke="#d97706" rx="6"/>
    <text x="190" y="247" font-size="12" font-weight="bold" fill="#92400e" text-anchor="middle">引入“光伏羊”吃草</text>
    <!-- Node 4: Protection & Soil -->
    <rect x="20" y="130" width="110" height="44" fill="#faf5ff" stroke="#7c3aed" rx="6"/>
    <text x="75" y="157" font-size="12" font-weight="bold" fill="#5b21b6" text-anchor="middle">防火灾+粪便还田</text>
    <!-- Arrows -->
    <path d="M 250 72 L 290 72 Q 305 72 305 125" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
    <path d="M 305 180 Q 305 242 255 242" stroke="#64748b" stroke-width="2" fill="none"/>
    <path d="M 130 242 Q 75 242 75 180" stroke="#64748b" stroke-width="2" fill="none"/>
    <path d="M 75 125 Q 75 72 125 72" stroke="#64748b" stroke-width="2" fill="none"/>
    <!-- Center text -->
    <text x="190" y="145" font-size="11" font-weight="bold" fill="#0f172a" text-anchor="middle">生态双赢机制</text>
    <text x="190" y="165" font-size="10" fill="#475569" text-anchor="middle">避免杂草遮板挡光</text>
    <text x="190" y="182" font-size="10" fill="#475569" text-anchor="middle">消除冬季火灾隐患</text>
  </g>
</svg>