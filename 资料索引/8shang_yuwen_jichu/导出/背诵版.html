ry-memory","n":167,"id":"poetry-memory-direct-167","tag":"直接型默写","t":"自评题","stem":"167.\n賽微霜，又何妨！（《江城子．密州出猎》","ans":"酒酣胸胆尚开张","img":"../public/question-crops/poetry-memory/poetry-memory-direct-167.webp","aimg":"","src":"../public/source/poetry-memory/page-05.jpg","ph":false,"jx":"《江城子·密州出猎》苏轼。前句“酒酣胸胆尚开张”写酒兴与胆气，后句“鬓微霜，又何妨”自宽，故填“酒酣胸胆尚开张”。“酣”意为尽兴。"},{"s":"古诗文默写","sid":"poetry-memory","n":168,"id":"poetry-memory-direct-168","tag":"直接型默写","t":"自评题","stem":"168.\n西北望，射天狼。（《江城子• 密州出猎》）","ans":"会挽雕弓如满月","img":"../public/question-crops/poetry-memory/poetry-memory-direct-168.webp","aimg":"","src":"../public/source/poetry-memory/page-05.jpg","ph":false,"jx":"《江城子·密州出猎》苏轼。后句“西北望，射天狼”写抗敌之志，前句写拉满雕弓，故填“会挽雕弓如满月”。“挽”意为拉（弓）。"},{"s":"古诗文默写","sid":"poetry-memory","n":169,"id":"poetry-memory-direct-169","tag":"直接型默写","t":"自评题","stem":"169.醉里挑灯看剑，\n_。（《破阵子•为陈同甫赋壮词以寄之》）","ans":"梦回吹角连营","img":"../public/question-crops/poetry-memory/poetry-memory-direct-169.webp","aimg":"","src":"../public/source/poetry-memory/page-05.jpg","ph":false,"jx":"《破阵子·为陈同甫赋壮词以寄之》辛弃疾（南宋）。前句“醉里挑灯看剑”是现实，此句转入梦境，故填“梦回吹角连营”。“连营”指连成一片的军营。"},{"s":"古诗文默写","sid":"poetry-memory","n":170,"id":"poetry-memory-direct-170","tag":"直接型默写","t":"自评题","stem":"直接型默写第 170 题：请查看原题页后完成默写。","ans":"八百里分麾下炙","img":"../public/question-crops/poetry-memory/poetry-memory-direct-170.webp","aimg":"","src":"../public/source/poetry-memory/page-05.jpg","ph":false,"jx":"《破阵子·为陈同甫赋壮词以寄之》辛弃疾。与下句“五十弦翻塞外声”成对，写分食烤肉、奏乐点兵，故填“八百里分麾下炙”。“麾”指军旗。"},{"s":"古诗文默写","sid":"poetry-memory","n":171,"id":"poetry-memory-direct-171","tag":"直接型默写","t":"自评题","stem":"直接型默写第 171 题：请查看原题页后完成默写。","ans":"五十弦翻塞外声","img":"../public/question-crops/poetry-memory/poetry-memory-direct-171.webp","aimg":"","src":"../public/source/poetry-memory/page-05.jpg","ph":false,"jx":"《破阵子·为陈同甫赋壮词以寄之》辛弃疾。前句写分食烤牛肉，此句写军乐齐奏，两句写战前豪壮，故填“五十弦翻塞外声”。“弦”指乐器。"},{"s":"古诗文默写","sid":"poetry-memory","n":172,"id":"poetry-memory-direct-172","tag":"直接型默写","t":"自评题","stem":"172. 了却君王天下事，\n《破阵子• 为陈同甫赋壮词以寄之》）","ans":"赢得生前身后名","img":"../public/question-crops/poetry-memory/poetry-memory-direct-172.webp","aimg":"","src":"../public/source/poetry-memory/page-05.jpg","ph":false,"jx":"《破阵子·为陈同甫赋壮词以寄之》辛弃疾。前句“了却君王天下事”写功业，此句写由此赢得名声，故填“赢得生前身后名”。“赢”勿写作“羸”。"},{"s":"古诗文默写","sid":"poetry-memory","n":173,"id":"poetry-memory-direct-173","tag":"直接型默写","t":"自评题","stem":"173. 为箘下黄花开遍，\n《满江红》","ans":"秋容如拭","img":"../public/question-crops/poetry-memory/poetry-memory-direct-173.webp","aimg":"","src":"../public/source/poetry-memory/page-05.jpg","ph":false,"jx":"《满江红》秋瑾（清末）。后句“为篱下黄花开遍”以菊花写秋，此句写秋色明净，故填“秋容如拭”。“拭”意为擦拭，写秋色明净如新擦。"},{"s":"古诗文默写","sid":"poetry-memory","n":174,"id":"poetry-memory-direct-174","tag":"直接型默写","t":"自评题","stem":"174. 四面歌残终破楚，\n《满江红》","ans":"八年风味徒思浙","img":"../public/question-crops/poetry-memory/poetry-memory-direct-174.webp","aimg":"","src":"../public/source/poetry-memory/page-05.jpg","ph":false,"jx":"《满江红》秋瑾。后句“四面歌残终破楚”用项羽四面楚歌之典，前句写婚后八年空自思乡，故填“八年风味徒思浙”。“浙”指浙江（故乡）。"},{"s":"古诗文默写","sid":"poetry-memory","n":175,"id":"poetry-memory-direct-175","tag":"直接型默写","t":"自评题","stem":"175.\n英雄末路当磨折。（《满江红》）","ans":"俗子胸襟谁识我","img":"../public/question-crops/poetry-memory/poetry-memory-direct-175.webp","aimg":"","src":"../public/source/poetry-memory/page-05.jpg","ph":false,"jx":"《满江红》秋瑾。后句“英雄末路当磨折”是自励，前句写无人识自己的胸襟，故填“俗子胸襟谁识我”。“襟”勿写作“禁”。"},{"s":"古诗文默写","sid":"poetry-memory","n":176,"id":"poetry-memory-direct-176","tag":"直接型默写","t":"自评题","stem":"176.\n又何间焉？（《曹刿论战》","ans":"肉食者谋之","img":"../public/question-crops/poetry-memory/poetry-memory-direct-176.webp","aimg":"","src":"../public/source/poetry-memory/page-05.jpg","ph":false,"jx":"《曹刿论战》（《左传》，先秦）。后句“又何间焉”是对前面“肉食者谋之”的追问，乡人认为无需参与，故填“肉食者谋之”。“间”读 jiàn，意为参与。"},{"s":"古诗文默写","sid":"poetry-memory","n":177,"id":"poetry-memory-direct-177","tag":"直接型默写","t":"自评题","stem":"177. 肉食者鄙，\n（《曹刿论战》：","ans":"未能远谋","img":"../public/question-crops/poetry-memory/poetry-memory-direct-177.webp","aimg":"","src":"../public/source/poetry-memory/page-05.jpg","ph":false,"jx":"《曹刿论战》。前句“肉食者鄙”是判断，此句说明“鄙”在何处——不能深谋远虑，故填“未能远谋”。“谋”勿写作“某”。"},{"s":"古诗文默写","sid":"poetry-memory","n":178,"id":"poetry-memory-direct-178","tag":"直接型默写","t":"自评题","stem":"178.小信未孚，\n（《曹刿论战》）","ans":"神弗福也","img":"../public/question-crops/poetry-memory/poetry-memory-direct-178.webp","aimg":"","src":"../public/source/poetry-memory/page-05.jpg","ph":false,"jx":"《曹刿论战》。前句“小信未孚，神弗福也”指出小信用不能取信于神，故填“神弗福也”。“孚”意为使人信服。"},{"s":"古诗文默写","sid":"poetry-memory","n":179,"id":"poetry-memory-direct-179","tag":"直接型默写","t":"自评题","stem":"179.\n虽不能察，必以情。（《曹刿论战》）","ans":"小大之狱","img":"../public/question-crops/poetry-memory/poetry-memory-direct-179.webp","aimg":"","src":"../public/source/poetry-memory/page-05.jpg","ph":false,"jx":"《曹刿论战》。后句“虽不能察，必以情”是对案件的处置原则，前面点明所谈对象是诉讼案件，故填“小大之狱”。“狱”在此指案件，非监狱。"},{"s":"古诗文默写","sid":"poetry-memory","n":180,"id":"poetry-memory-direct-180","tag":"直接型默写","t":"自评题","stem":"180. 下视其辙，\n《曹刿论战》）","ans":"登轼而望之","img":"../public/question-crops/poetry-memory/poetry-memory-direct-180.webp","aimg":"","src":"../public/source/poetry-memory/page-05.jpg","ph":false,"jx":"《曹刿论战》。前句“下视其辙”写俯看车辙，此句写登车远望，故填“登轼而望之”。“轼”是车前横木。"},{"s":"古诗文默写","sid":"poetry-memory","n":181,"id":"poetry-memory-direct-181","tag":"直接型默写","t":"自评题","stem":"181. 一鼓作气，\n（《曹刿论战》","ans":"再而衰，三而竭","img":"../public/question-crops/poetry-memory/poetry-memory-direct-181.webp","aimg":"","src":"../public/source/poetry-memory/page-05.jpg","ph":false,"jx":"《曹刿论战》。成语“一鼓作气”的出处，后接“再而衰，三而竭”，故填“再而衰，三而竭”。"},{"s":"古诗文默写","sid":"poetry-memory","n":182,"id":"poetry-memory-direct-182","tag":"直接型默写","t":"自评题","stem":"182. 吾视其辙乱，\n故逐之。（《曹刿论战》：\n27","ans":"望其旗靡","img":"../public/question-crops/poetry-memory/poetry-memory-direct-182.webp","aimg":"","src":"../public/source/poetry-memory/page-05.jpg","ph":false,"jx":"《曹刿论战》。前句“吾视其辙乱”是判断依据，此句写望见军旗倒伏，故填“望其旗靡”。“靡”意为倒下。"},{"s":"古诗文默写","sid":"poetry-memory","n":183,"id":"poetry-memory-direct-183","tag":"直接型默写","t":"自评题","stem":"183. 亲贤臣，远小人，\n（《出师表》，","ans":"此先汉所以兴隆也","img":"../public/question-crops/poetry-memory/poetry-memory-direct-183.webp","aimg":"","src":"../public/source/poetry-memory/page-05.jpg","ph":false,"jx":"《出师表》诸葛亮（三国·蜀汉）。前句“亲贤臣，远小人”是因，此句是果，写先汉因此兴隆，故填“此先汉所以兴隆也”。“隆”勿写作“降”。"},{"s":"古诗文默写","sid":"poetry-memory","n":184,"id":"poetry-memory-direct-184","tag":"直接型默写","t":"自评题","stem":"184. 苟全性命于乱世，\n《出师表》）","ans":"不求闻达于诸侯","img":"../public/question-crops/poetry-memory/poetry-memory-direct-184.webp","aimg":"","src":"../public/source/poetry-memory/page-05.jpg","ph":false,"jx":"《出师表》诸葛亮。前句“苟全性命于乱世”写乱世求生，此句写不求显达，两句写作者本志，故填“不求闻达于诸侯”。“闻达”指显达扬名。"},{"s":"古诗文默写","sid":"poetry-memory","n":185,"id":"poetry-memory-direct-185","tag":"直接型默写","t":"自评题","stem":"直接型默写第 185 题：请查看原题页后完成默写。","ans":"受任于败军之际","img":"../public/question-crops/poetry-memory/poetry-memory-direct-185.webp","aimg":"","src":"../public/source/poetry-memory/page-06.jpg","ph":false,"jx":"《出师表》诸葛亮。原句“受任于败军之际，奉命于危难之间”，写临危受命，故填“受任于败军之际”。“际”指时候。"},{"s":"古诗文默写","sid":"poetry-memory","n":186,"id":"poetry-memory-direct-186","tag":"直接型默写","t":"自评题","stem":"直接型默写第 186 题：请查看原题页后完成默写。","ans":"先帝知臣谨慎","img":"../public/question-crops/poetry-memory/poetry-memory-direct-186.webp","aimg":"","src":"../public/source/poetry-memory/page-06.jpg","ph":false,"jx":"《出师表》诸葛亮。原句“先帝知臣谨慎，故临崩寄臣以大事也”，写先帝托孤的原因，故填“先帝知臣谨慎”。"},{"s":"古诗文默写","sid":"poetry-memory","n":187,"id":"poetry-memory-direct-187","tag":"直接型默写","t":"自评题","stem":"187.\n千树万树梨花开。（《白雪歌送武判官归京》","ans":"忽如一夜春风来","img":"../public/question-crops/poetry-memory/poetry-memory-direct-187.webp","aimg":"","src":"../public/source/poetry-memory/page-06.jpg","ph":false,"jx":"《白雪歌送武判官归京》岑参（唐）。后句“千树万树梨花开”以梨花喻雪，前面写雪来得突然，故填“忽如一夜春风来”。“梨”勿写作“黎”。"},{"s":"古诗文默写","sid":"poetry-memory","n":188,"id":"poetry-memory-direct-188","tag":"直接型默写","t":"自评题","stem":"188. 散入珠帘湿罗幕，\n《白雪歌送武判官归京》","ans":"狐裘不暖锦衾薄","img":"../public/question-crops/poetry-memory/poetry-memory-direct-188.webp","aimg":"","src":"../public/source/poetry-memory/page-06.jpg","ph":false,"jx":"《白雪歌送武判官归京》岑参。前句“散入珠帘湿罗幕”写雪花入帐，此句写狐裘不暖，两句写边地奇寒，故填“狐裘不暖锦衾薄”。“裘”勿写作“求”。"},{"s":"古诗文默写","sid":"poetry-memory","n":189,"id":"poetry-memory-direct-189","tag":"直接型默写","t":"自评题","stem":"189. 瀚海阑干百丈冰，\n、《白雪歌送武判官归京》","ans":"愁云惨淡万里凝","img":"../public/question-crops/poetry-memory/poetry-memory-direct-189.webp","aimg":"","src":"../public/source/poetry-memory/page-06.jpg","ph":false,"jx":"《白雪歌送武判官归京》岑参。上句“瀚海阑干百丈冰”写沙漠冰封，下句写天空阴云，两句写苦寒，故填“愁云惨淡万里凝”。“惨”勿写作“残”。"},{"s":"古诗文默写","sid":"poetry-memory","n":190,"id":"poetry-memory-direct-190","tag":"直接型默写","t":"自评题","stem":"190.\n风掣红旗冻不翻。（《白雪歌送武判官归京》","ans":"纷纷暮雪下辕门","img":"../public/question-crops/poetry-memory/poetry-memory-direct-190.webp","aimg":"","src":"../public/source/poetry-memory/page-06.jpg","ph":false,"jx":"《白雪歌送武判官归京》岑参。后句“风掣红旗冻不翻”写红旗冻硬，前句写暮雪纷纷落于辕门，两句写边地酷寒，故填“纷纷暮雪下辕门”。“辕门”指军营大门。"},{"s":"古诗文默写","sid":"poetry-memory","n":191,"id":"poetry-memory-direct-191","tag":"直接型默写","t":"自评题","stem":"191.\n雪上空留马行处。\n《白雪歌送武判官归京》）","ans":"山回路转不见君","img":"../public/question-crops/poetry-memory/poetry-memory-direct-191.webp","aimg":"","src":"../public/source/poetry-memory/page-06.jpg","ph":false,"jx":"《白雪歌送武判官归京》岑参。前句“山回路转不见君”写目送人不见，此句写雪上只余马蹄印，两句写依依惜别，故填“山回路转不见君”。"},{"s":"古诗文默写","sid":"poetry-memory","n":192,"id":"poetry-memory-direct-192","tag":"直接型默写","t":"自评题","stem":"192. 何处望神州？\n《南乡子•登京口北固亭有怀》）","ans":"满眼风光北固楼","img":"../public/question-crops/poetry-memory/poetry-memory-direct-192.webp","aimg":"","src":"../public/source/poetry-memory/page-06.jpg","ph":false,"jx":"《南乡子·登京口北固亭有怀》辛弃疾（南宋）。前句设问“何处望神州”，此句以登楼所见作答，故填“满眼风光北固楼”。“固”勿写作“故”。"},{"s":"古诗文默写","sid":"poetry-memory","n":193,"id":"poetry-memory-direct-193","tag":"直接型默写","t":"自评题","stem":"193.\n坐断东南战未休。（《南乡子• 登京口北固亭有怀》）","ans":"年少万兜鍪","img":"../public/question-crops/poetry-memory/poetry-memory-direct-193.webp","aimg":"","src":"../public/source/poetry-memory/page-06.jpg","ph":false,"jx":"《南乡子·登京口北固亭有怀》辛弃疾。后句“坐断东南战未休”写孙权据守东南，前句写他年少统兵，故填“年少万兜鍪”。“兜鍪”指头盔，代指士兵。"},{"s":"古诗文默写","sid":"poetry-memory","n":194,"id":"poetry-memory-direct-194","tag":"直接型默写","t":"自评题","stem":"194.\n干戈寥落四周星。（《过零丁洋》）","ans":"辛苦遭逢起一经","img":"../public/question-crops/poetry-memory/poetry-memory-direct-194.webp","aimg":"","src":"../public/source/poetry-memory/page-06.jpg","ph":false,"jx":"《过零丁洋》文天祥（南宋末）。后句“干戈寥落四周星”写抗元四年，前句写因科举入仕而起兵，故填“辛苦遭逢起一经”。“遭逢”指遭遇、经历。"},{"s":"古诗文默写","sid":"poetry-memory","n":195,"id":"poetry-memory-direct-195","tag":"直接型默写","t":"自评题","stem":"195、 山河破碎风飘絮，\n《过零丁洋》）","ans":"身世浮沉雨打萍","img":"../public/question-crops/poetry-memory/poetry-memory-direct-195.webp","aimg":"","src":"../public/source/poetry-memory/page-06.jpg","ph":false,"jx":"《过零丁洋》文天祥。上句“山河破碎风飘絮”写国势，下句以浮萍写身世，两句对偶，故填“身世浮沉雨打萍”。“絮”勿写作“绪”。"},{"s":"古诗文默写","sid":"poetry-memory","n":196,"id":"poetry-memory-direct-196","tag":"直接型默写","t":"自评题","stem":"196.\n，零丁洋里叹零丁。（《过零丁洋》）","ans":"惶恐滩头说惶恐","img":"../public/question-crops/poetry-memory/poetry-memory-direct-196.webp","aimg":"","src":"../public/source/poetry-memory/page-06.jpg","ph":false,"jx":"《过零丁洋》文天祥。后句“零丁洋里叹零丁”与上句地名对举，前面写惶恐滩之事，故填“惶恐滩头说惶恐”。"},{"s":"古诗文默写","sid":"poetry-memory","n":197,"id":"poetry-memory-direct-197","tag":"直接型默写","t":"自评题","stem":"197.人生自古谁无死？\n（《过零丁洋》）","ans":"留取丹心照汗青","img":"../public/question-crops/poetry-memory/poetry-memory-direct-197.webp","aimg":"","src":"../public/source/poetry-memory/page-06.jpg","ph":false,"jx":"《过零丁洋》文天祥。名句“人生自古谁无死？留取丹心照汗青”，以反问表决心，故填“留取丹心照汗青”。“汗青”指史册。"},{"s":"古诗文默写","sid":"poetry-memory","n":198,"id":"poetry-memory-direct-198","tag":"直接型默写","t":"自评题","stem":"198.\n_，山河表里潼关路。（《山坡羊．潼关怀古》）","ans":"峰峦如聚，波涛如怒","img":"../public/question-crops/poetry-memory/poetry-memory-direct-198.webp","aimg":"","src":"../public/source/poetry-memory/page-06.jpg","ph":false,"jx":"《山坡羊·潼关怀古》张养浩（元）。后句“山河表里潼关路”总写形势，前句以“聚”“怒”写峰峦波涛，故填“峰峦如聚，波涛如怒”。“峦”勿写作“恋”。"},{"s":"古诗文默写","sid":"poetry-memory","n":199,"id":"poetry-memory-direct-199","tag":"直接型默写","t":"自评题","stem":"199．望西都，\n（《山坡羊• 潼关怀古》）","ans":"意踌躇","img":"../public/question-crops/poetry-memory/poetry-memory-direct-199.webp","aimg":"","src":"../public/source/poetry-memory/page-06.jpg","ph":false,"jx":"《山坡羊·潼关怀古》张养浩。前句“望西都”是动作，此句写望时的犹豫感伤，故填“意踌躇”。“踌躇”在此意为心情起伏、感慨徘徊。"},{"s":"古诗文默写","sid":"poetry-memory","n":200,"id":"poetry-memory-direct-200","tag":"直接型默写","t":"自评题","stem":"200.伤心秦汉经行处，\n（《山坡羊•潼关怀古》）\n二、理解性默写\n1.《观沧海》中描写大海风急浪涌、惊涛拍岸的壮阔景象的诗句是：\n2.《观沧海》的主要表达方式是描写，但是也有两句诗是叙事的，这两句诗是：\n3. 曹操的《观沧海》抒发气吞山河的博大胸襟的诗句是：\n4.《次北固山下》暗含旅途奔波之意的诗句是：\n5.《次北固山下》中流露出作者对家乡、亲人思念之情的句子是：\n6. 《次北固山下》一诗中蕴含新事物孕育于旧事物解体之时的哲理句是：\n7. 站在江边，微风轻拂，江水浩渺，波平浪静，一叶白帆您然地漂荡在江面上，这恰似王湾《次北固山\n下》中“\n_”的美景。\n8.《钱塘湖春行 》表明观景处所的诗句是：\n9.《钱塘湖春行》中写作者徜徉于西湖，表达作者的喜爱之情的句子是：\n10.唐代诗人白居易在《钱塘湖春行》一诗中，描写早春莺歌燕舞所带来的生机勃勃气象的诗句是：\n《天净沙．秋思》中描写萧条、冷落、凄凉氛围的诗句是：\n《天净沙． 秋思》点明主旨的句子是：\n13.《天净沙．秋思》侧面表现游子长期漂泊异乡的诗句是：","ans":"宫阙万间都做了土","img":"../public/question-crops/poetry-memory/poetry-memory-direct-200.webp","aimg":"","src":"../public/source/poetry-memory/page-06.jpg","ph":false,"jx":"《山坡羊·潼关怀古》张养浩。后句以“宫阙万间都做了土”写秦汉遗迹荒废，前句写经过伤心之地，故填“宫阙万间都做了土”。“阙”勿写作“阕”。"},{"s":"古诗文默写","sid":"poetry-memory","n":1,"id":"poetry-memory-context-1","tag":"理解性默写","t":"自评题","stem":"理解性默写第 1 题：请查看原题页后完成默写。","ans":"秋风萧瑟，洪波涌起","img":"../public/question-crops/poetry-memory/poetry-memory-context-1.webp","aimg":"","src":"../public/source/poetry-memory/page-06.jpg","ph":false,"jx":"《观沧海》曹操（东汉末）。题干关键词是“风急浪涌、惊涛拍岸”，对应写风与浪的“秋风萧瑟，洪波涌起”——“萧瑟”写风声，“涌起”写浪势。"},{"s":"古诗文默写","sid":"poetry-memory","n":2,"id":"poetry-memory-context-2","tag":"理解性默写","t":"自评题","stem":"理解性默写第 2 题：请查看原题页后完成默写。","ans":"东临碣石，以观沧海","img":"../public/question-crops/poetry-memory/poetry-memory-context-2.webp","aimg":"","src":"../public/source/poetry-memory/page-06.jpg","ph":false,"jx":"《观沧海》曹操。题干问“叙事”的两句。全诗仅开头交代登临之事，即“东临碣石，以观沧海”，其余皆为写景抒情。"},{"s":"古诗文默写","sid":"poetry-memory","n":3,"id":"poetry-memory-context-3","tag":"理解性默写","t":"自评题","stem":"理解性默写第 3 题：请查看原题页后完成默写。","ans":"日月之行，若出其中；星汉灿烂，若出其里","img":"../public/question-crops/poetry-memory/poetry-memory-context-3.webp","aimg":"","src":"../public/source/poetry-memory/page-06.jpg","ph":false,"jx":"《观沧海》曹操。题干问“气吞山河的博大胸襟”，对应以想象写大海吞吐日月星辰的“日月之行，若出其中；星汉灿烂，若出其里”。"},{"s":"古诗文默写","sid":"poetry-memory","n":4,"id":"poetry-memory-context-4","tag":"理解性默写","t":"自评题","stem":"理解性默写第 4 题：请查看原题页后完成默写。","ans":"客路青山外，行舟绿水前","img":"../public/question-crops/poetry-memory/poetry-memory-context-4.webp","aimg":"","src":"../public/source/poetry-memory/page-06.jpg","ph":false,"jx":"《次北固山下》王湾（唐）。题干问“暗含旅途奔波”的句子，“客路”二字点明身在旅途，即“客路青山外，行舟绿水前”。"},{"s":"古诗文默写","sid":"poetry-memory","n":5,"id":"poetry-memory-context-5","tag":"理解性默写","t":"自评题","stem":"理解性默写第 5 题：请查看原题页后完成默写。","ans":"乡书何处达？归雁洛阳边","img":"../public/question-crops/poetry-memory/poetry-memory-context-5.webp","aimg":"","src":"../public/source/poetry-memory/page-06.jpg","ph":false,"jx":"《次北固山下》王湾。题干问“思念家乡亲人”，末联以“乡书”“归雁”写乡思，即“乡书何处达？归雁洛阳边”。"},{"s":"古诗文默写","sid":"poetry-memory","n":6,"id":"poetry-memory-context-6","tag":"理解性默写","t":"自评题","stem":"理解性默写第 6 题：请查看原题页后完成默写。","ans":"海日生残夜，江春入旧年","img":"../public/question-crops/poetry-memory/poetry-memory-context-6.webp","aimg":"","src":"../public/source/poetry-memory/page-06.jpg","ph":false,"jx":"《次北固山下》王湾。题干问“新事物孕育于旧事物解体之时的哲理句”，即“海日生残夜，江春入旧年”——“生”“入”二字写新旧交替。"},{"s":"古诗文默写","sid":"poetry-memory","n":7,"id":"poetry-memory-context-7","tag":"理解性默写","t":"自评题","stem":"理解性默写第 7 题：请查看原题页后完成默写。","ans":"潮平两岸阔，风正一帆悬","img":"../public/question-crops/poetry-memory/poetry-memory-context-7.webp","aimg":"","src":"../public/source/poetry-memory/page-06.jpg","ph":false,"jx":"《次北固山下》王湾。题干描述的“潮平岸阔、风正帆悬”正是“潮平两岸阔，风正一帆悬”，两句写江面开阔、行舟顺畅。"},{"s":"古诗文默写","sid":"poetry-memory","n":8,"id":"poetry-memory-context-8","tag":"理解性默写","t":"自评题","stem":"理解性默写第 8 题：请查看原题页后完成默写。","ans":"孤山寺北贾亭西，水面初平云脚低","img":"../public/question-crops/poetry-memory/poetry-memory-context-8.webp","aimg":"","src":"../public/source/poetry-memory/page-06.jpg","ph":false,"jx":"《钱塘湖春行》白居易（唐）。题干问“表明观景处所”的句子，开篇交代起点，即“孤山寺北贾亭西，水面初平云脚低”。"},{"s":"古诗文默写","sid":"poetry-memory","n":9,"id":"poetry-memory-context-9","tag":"理解性默写","t":"自评题","stem":"理解性默写第 9 题：请查看原题页后完成默写。","ans":"最爱湖东行不足，绿杨阴里白沙堤","img":"../public/question-crops/poetry-memory/poetry-memory-context-9.webp","aimg":"","src":"../public/source/poetry-memory/page-06.jpg","ph":false,"jx":"《钱塘湖春行》白居易。题干问“徜徉西湖、表达喜爱之情”的句子，即末联“最爱湖东行不足，绿杨阴里白沙堤”。"},{"s":"古诗文默写","sid":"poetry-memory","n":10,"id":"poetry-memory-context-10","tag":"理解性默写","t":"自评题","stem":"理解性默写第 10 题：请查看原题页后完成默写。","ans":"几处早莺争暖树，谁家新燕啄春泥","img":"../public/question-crops/poetry-memory/poetry-memory-context-10.webp","aimg":"","src":"../public/source/poetry-memory/page-06.jpg","ph":false,"jx":"《钱塘湖春行》白居易。题干问“早春莺歌燕舞”的句子，即“几处早莺争暖树，谁家新燕啄春泥”——“早莺”“新燕”点初春。"},{"s":"古诗文默写","sid":"poetry-memory","n":11,"id":"poetry-memory-context-11","tag":"理解性默写","t":"自评题","stem":"理解性默写第 11 题：请查看原题页后完成默写。","ans":"枯藤老树昏鸦，小桥流水人家，古道西风瘦马","img":"../public/question-crops/poetry-memory/poetry-memory-context-11.webp","aimg":"","src":"../public/source/poetry-memory/page-06.jpg","ph":false,"jx":"《天净沙·秋思》马致远（元）。题干问“萧条冷落凄凉的氛围”，对应开篇三个意象并列的“枯藤老树昏鸦，小桥流水人家，古道西风瘦马”。"},{"s":"古诗文默写","sid":"poetry-memory","n":12,"id":"poetry-memory-context-12","tag":"理解性默写","t":"自评题","stem":"理解性默写第 12 题：请查看原题页后完成默写。","ans":"夕阳西下，断肠人在天涯","img":"../public/question-crops/poetry-memory/poetry-memory-context-12.webp","aimg":"","src":"../public/source/poetry-memory/page-06.jpg","ph":false,"jx":"《天净沙·秋思》马致远。题干问“点明主旨”的句子，即末句“夕阳西下，断肠人在天涯”。"},{"s":"古诗文默写","sid":"poetry-memory","n":13,"id":"poetry-memory-context-13","tag":"理解性默写","t":"自评题","stem":"理解性默写第 13 题：请查看原题页后完成默写。","ans":"断肠人在天涯","img":"../public/question-crops/poetry-memory/poetry-memory-context-13.webp","aimg":"","src":"../public/source/poetry-memory/page-06.jpg","ph":false,"jx":"《天净沙·秋思》马致远。题干问“侧面表现游子长期漂泊”的句子，“断肠人”直陈漂泊之苦，即“断肠人在天涯”。"},{"s":"古诗文默写","sid":"poetry-memory","n":14,"id":"poetry-memory-context-14","tag":"理解性默写","t":"自评题","stem":"14.《天净沙．秋思》中的诗句“\n，将\n不同景物组接在一起，从正、反两面烘托出羁旅游子内心的凄楚与悲怆。","ans":"枯藤老树昏鸦，小桥流水人家，古道西风瘦马","img":"../public/question-crops/poetry-memory/poetry-memory-context-14.webp","aimg":"","src":"../public/source/poetry-memory/page-07.jpg","ph":false,"jx":"《天净沙·秋思》马致远。题干说“把不同景物组接、正反两面烘托凄楚”，对应的正是意象并置的“枯藤老树昏鸦，小桥流水人家，古道西风瘦马”。"},{"s":"古诗文默写","sid":"poetry-memory","n":15,"id":"poetry-memory-context-15","tag":"理解性默写","t":"自评题","stem":"15.《闻王昌龄左迁龙标遥有此寄》一诗中从“_\n’两句可以看\n出王昌龄被贬之地极偏远。","ans":"闻道龙标过五溪","img":"../public/question-crops/poetry-memory/poetry-memory-context-15.webp","aimg":"","src":"../public/source/poetry-memory/page-07.jpg","ph":false,"jx":"《闻王昌龄左迁龙标遥有此寄》李白（唐）。题干问“看出被贬之地极偏远”，对应“闻道龙标过五溪”——“过五溪”写路途遥远荒僻。"},{"s":"古诗文默写","sid":"poetry-memory","n":16,"id":"poetry-memory-context-16","tag":"理解性默写","t":"自评题","stem":"16、古人论诗有云“一切景语皆情语”，意即描写景物也是为了抒情。《闻王昌龄左迁龙标遥有此寄》\n中，\n__”一句即是如此，此句表达了作者悲苦哀愁的心情。","ans":"杨花落尽子规啼","img":"../public/question-crops/poetry-memory/poetry-memory-context-16.webp","aimg":"","src":"../public/source/poetry-memory/page-07.jpg","ph":false,"jx":"《闻王昌龄左迁龙标遥有此寄》李白。题干说“一切景语皆情语、表达悲苦哀愁”，对应以飘零杨花、哀啼子规起兴的“杨花落尽子规啼”。"},{"s":"古诗文默写","sid":"poetry-memory","n":17,"id":"poetry-memory-context-17","tag":"理解性默写","t":"自评题","stem":"17. 《闻王昌龄左迁龙标遥有此寄》一诗中把对友人的怀念之情托付给明月的诗句是：","ans":"我寄愁心与明月，随君直到夜郎西","img":"../public/question-crops/poetry-memory/poetry-memory-context-17.webp","aimg":"","src":"../public/source/poetry-memory/page-07.jpg","ph":false,"jx":"《闻王昌龄左迁龙标遥有此寄》李白。题干问“把怀念之情托付给明月”，即“我寄愁心与明月，随君直到夜郎西”——把明月当作使者。"},{"s":"古诗文默写","sid":"poetry-memory","n":18,"id":"poetry-memory-context-18","tag":"理解性默写","t":"自评题","stem":"18.《闻王昌龄左迁龙标遥有此寄》一诗中“_\n点明了写此诗的\n时令是春末夏初，又渲染了离恨伤感的气氛。","ans":"杨花落尽子规啼，闻道龙标过五溪","img":"../public/question-crops/poetry-memory/poetry-memory-context-18.webp","aimg":"","src":"../public/source/poetry-memory/page-07.jpg","ph":false,"jx":"《闻王昌龄左迁龙标遥有此寄》李白。题干问“点明时令是春末夏初、渲染离恨”，即“杨花落尽子规啼，闻道龙标过五溪”——杨花落尽是暮春。"},{"s":"古诗文默写","sid":"poetry-memory","n":19,"id":"poetry-memory-context-19","tag":"理解性默写","t":"自评题","stem":"19．《夜雨寄北》诗中蕴含宦途失意，羁旅他乡，思乡不得的抑郁愁苦之情，并把愁苦之情融人凄凉萧瑟的\n景色之中的诗句是：","ans":"君问归期未有期，巴山夜雨涨秋池","img":"../public/question-crops/poetry-memory/poetry-memory-context-19.webp","aimg":"","src":"../public/source/poetry-memory/page-07.jpg","ph":false,"jx":"《夜雨寄北》李商隐（晚唐）。题干问“愁苦之情融入凄凉景色”，对应以“巴山夜雨涨秋池”写愁的“君问归期未有期，巴山夜雨涨秋池”。"},{"s":"古诗文默写","sid":"poetry-memory","n":20,"id":"poetry-memory-context-20","tag":"理解性默写","t":"自评题","stem":"20.《夜雨寄北》中表达诗人思念亲人、渴望团聚的诗句是：","ans":"何当共剪西窗烛，却话巴山夜雨时","img":"../public/question-crops/poetry-memory/poetry-memory-context-20.webp","aimg":"","src":"../public/source/poetry-memory/page-07.jpg","ph":false,"jx":"《夜雨寄北》李商隐。题干问“思念亲人、渴望团聚”，对应设想来日重逢的“何当共剪西窗烛，却话巴山夜雨时”。"},{"s":"古诗文默写","sid":"poetry-memory","n":21,"id":"poetry-memory-context-21","tag":"理解性默写","t":"自评题","stem":"21. 李商隐在《夜兩寄北》中用“\n设想未来的相逢，相逢之日\n再诉今日离情。","ans":"何当共剪西窗烛，却话巴山夜雨时","img":"../public/question-crops/poetry-memory/poetry-memory-context-21.webp","aimg":"","src":"../public/source/poetry-memory/page-07.jpg","ph":false,"jx":"《夜雨寄北》李商隐。题干问“设想未来相逢、再诉今日离情”，即“何当共剪西窗烛，却话巴山夜雨时”——“何当”表设想。"},{"s":"古诗文默写","sid":"poetry-memory","n":22,"id":"poetry-memory-context-22","tag":"理解性默写","t":"自评题","stem":"22．《夜兩寄北》中回答亲人归期未卜，并用雨景衬托浓郁相思的句子是：","ans":"君问归期未有期，巴山夜雨涨秋池","img":"../public/question-crops/poetry-memory/poetry-memory-context-22.webp","aimg":"","src":"../public/source/poetry-memory/page-07.jpg","ph":false,"jx":"《夜雨寄北》李商隐。题干问“回答归期未卜、以雨景衬相思”，即首联“君问归期未有期，巴山夜雨涨秋池”。"},{"s":"古诗文默写","sid":"poetry-memory","n":23,"id":"poetry-memory-context-23","tag":"理解性默写","t":"自评题","stem":"23.《泊秦淮》一诗中叙事，点明夜泊地点的诗句是：","ans":"夜泊秦淮近酒家","img":"../public/question-crops/poetry-memory/poetry-memory-context-23.webp","aimg":"","src":"../public/source/poetry-memory/page-07.jpg","ph":false,"jx":"《泊秦淮》杜牧（晚唐）。题干问“叙事并点明夜泊地点”，对应首句“夜泊秦淮近酒家”——“夜泊”点事，“秦淮近酒家”点地。"},{"s":"古诗文默写","sid":"poetry-memory","n":24,"id":"poetry-memory-context-24","tag":"理解性默写","t":"自评题","stem":"24.《泊秦淮》中诗人用曲笔讽刺那些醉生梦死、不关心国事的官僚的名句是：","ans":"商女不知亡国恨，隔江犹唱后庭花","img":"../public/question-crops/poetry-memory/poetry-memory-context-24.webp","aimg":"","src":"../public/source/poetry-memory/page-07.jpg","ph":false,"jx":"《泊秦淮》杜牧。题干问“曲笔讽刺醉生梦死的官僚”，即“商女不知亡国恨，隔江犹唱后庭花”——借歌女唱亡国之音讽今。"},{"s":"古诗文默写","sid":"poetry-memory","n":25,"id":"poetry-memory-context-25","tag":"理解性默写","t":"自评题","stem":"25. 《泊秦淮》一诗中渲染水边夜色的清淡素雅的诗句是：","ans":"烟笼寒水月笼沙","img":"../public/question-crops/poetry-memory/poetry-memory-context-25.webp","aimg":"","src":"../public/source/poetry-memory/page-07.jpg","ph":false,"jx":"《泊秦淮》杜牧。题干问“渲染水边夜色的清淡素雅”，对应首句写烟、水、月、沙的“烟笼寒水月笼沙”——两个“笼”字互文。"},{"s":"古诗文默写","sid":"poetry-memory","n":26,"id":"poetry-memory-context-26","tag":"理解性默写","t":"自评题","stem":"26.《泊秦淮》一诗中抨击统治者沉湎酒色，不理朝政，表现诗人忧患意识的诗句是：","ans":"商女不知亡国恨，隔江犹唱后庭花","img":"../public/question-crops/poetry-memory/poetry-memory-context-26.webp","aimg":"","src":"../public/source/poetry-memory/page-07.jpg","ph":false,"jx":"《泊秦淮》杜牧。题干问“抨击统治者沉湎酒色、表现忧患意识”，仍是“商女不知亡国恨，隔江犹唱后庭花”，讽意正在“犹唱”二字。"},{"s":"古诗文默写","sid":"poetry-memory","n":27,"id":"poetry-memory-context-27","tag":"理解性默写","t":"自评题","stem":"27. 晏殊《浣溪沙》中追忆难忘欢聚，感叹时光易逝的句子是：","ans":"一曲新词酒一杯，去年天气旧亭台","img":"../public/question-crops/poetry-memory/poetry-memory-context-27.webp","aimg":"","src":"../public/source/poetry-memory/page-07.jpg","ph":false,"jx":"《浣溪沙》（一曲新词酒一杯）晏殊（北宋）。题干问“追忆欢聚、感叹时光易逝”，即上阕“一曲新词酒一杯，去年天气旧亭台”——“去年”与今对照。"},{"s":"古诗文默写","sid":"poetry-memory","n":28,"id":"poetry-memory-context-28","tag":"理解性默写","t":"自评题","stem":"28． 晏殊《浣溪沙》中表现诗人沉思形象的句子是：","ans":"小园香径独徘徊","img":"../public/question-crops/poetry-memory/poetry-memory-context-28.webp","aimg":"","src":"../public/source/poetry-memory/page-07.jpg","ph":false,"jx":"《浣溪沙》晏殊。题干问“表现诗人沉思形象”，即结句“小园香径独徘徊”——“独徘徊”是动作化的沉思。"},{"s":"古诗文默写","sid":"poetry-memory","n":29,"id":"poetry-memory-context-29","tag":"理解性默写","t":"自评题","stem":"29.晏殊《浣溪沙》中着重写今曰的感伤，被誉为“干古奇偶”的诗句是：","ans":"无可奈何花落去，似曾相识燕归来","img":"../public/question-crops/poetry-memory/poetry-memory-context-29.webp","aimg":"","src":"../public/source/poetry-memory/page-07.jpg","ph":false,"jx":"《浣溪沙》晏殊。题干问“被誉为千古奇偶”的句子，即下阕“无可奈何花落去，似曾相识燕归来”——对仗工整而情思深婉。"},{"s":"古诗文默写","sid":"poetry-memory","n":30,"id":"poetry-memory-context-30","tag":"理解性默写","t":"自评题","stem":"30.晏殊《浣溪沙》中构成“新”与“旧”、“来”与“去”对比的词句是：","ans":"无可奈何花落去，似曾相识燕归来","img":"../public/question-crops/poetry-memory/poetry-memory-context-30.webp","aimg":"","src":"../public/source/poetry-memory/page-07.jpg","ph":false,"jx":"《浣溪沙》晏殊。题干问“新与旧、来与去的对比”，正是“无可奈何花落去，似曾相识燕归来”——“去/来”相形而见时光流转。"},{"s":"古诗文默写","sid":"poetry-memory","n":31,"id":"poetry-memory-context-31","tag":"理解性默写","t":"自评题","stem":"31. 《望岳》中诗人借齐鲁大地烘托泰山拔地而起、参天耸立形象的句子是：","ans":"岱宗夫如何？齐鲁青未了","img":"../public/question-crops/poetry-memory/poetry-memory-context-31.webp","aimg":"","src":"../public/source/poetry-memory/page-07.jpg","ph":false,"jx":"《望岳》杜甫（唐）。题干问“借齐鲁大地烘托泰山高大”，即首联“岱宗夫如何？齐鲁青未了”——以两地之色写山势绵延。"},{"s":"古诗文默写","sid":"poetry-memory","n":32,"id":"poetry-memory-context-32","tag":"理解性默写","t":"自评题","stem":"32．杜甫在《望岳》中写出细望泰山云气团团、众鸟飞归的句子是：","ans":"荡胸生曾云，决眦入归鸟","img":"../public/question-crops/poetry-memory/poetry-memory-context-32.webp","aimg":"","src":"../public/source/poetry-memory/page-07.jpg","ph":false,"jx":"《望岳》杜甫。题干问“细望泰山云气、众鸟飞归”，即颈联“荡胸生曾云，决眦入归鸟”——“眦”是眼眶，写凝望之专。"},{"s":"古诗文默写","sid":"poetry-memory","n":33,"id":"poetry-memory-context-33","tag":"理解性默写","t":"自评题","stem":"33.《望岳》中既是攀登泰山极顶的誓言，又是攀登人生顶峰的誓言（表现作者志向高远、坚定）的诗句\n是：","ans":"会当凌绝顶，一览众山小","img":"../public/question-crops/poetry-memory/poetry-memory-context-33.webp","aimg":"","src":"../public/source/poetry-memory/page-07.jpg","ph":false,"jx":"《望岳》杜甫。题干问“攀登极顶的誓言、志向高远”，即尾联“会当凌绝顶，一览众山小”——“会当”表当须、终将。"},{"s":"古诗文默写","sid":"poetry-memory","n":34,"id":"poetry-memory-context-34","tag":"理解性默写","t":"自评题","stem":"34. 王安石《登飞来峰》中有“不畏浮云遮望眼，自缘身在最高层”，杜甫《望岳》中与之有异曲同工之妙\n的句子是：","ans":"会当凌绝顶，一览众山小","img":"../public/question-crops/poetry-memory/poetry-memory-context-34.webp","aimg":"","src":"../public/source/poetry-memory/page-07.jpg","ph":false,"jx":"《望岳》杜甫。题干要与王安石“不畏浮云遮望眼，自缘身在最高层”比较，二者同写登高望远、境界开阔，故答“会当凌绝顶，一览众山小”。"},{"s":"古诗文默写","sid":"poetry-memory","n":35,"id":"poetry-memory-context-35","tag":"理解性默写","t":"自评题","stem":"35. 杜甫的《望岳》用虚实结合的手法写出泰山神奇秀丽和巍峨高大的句子是：","ans":"造化钟神秀，阴阳割昏晓","img":"../public/question-crops/poetry-memory/poetry-memory-context-35.webp","aimg":"","src":"../public/source/poetry-memory/page-07.jpg","ph":false,"jx":"《望岳》杜甫。题干问“虚实结合写神奇秀丽与巍峨高大”，即颔联“造化钟神秀，阴阳割昏晓”——“钟”是聚集，“割”是分割。"},{"s":"古诗文默写","sid":"poetry-memory","n":36,"id":"poetry-memory-context-36","tag":"理解性默写","t":"自评题","stem":"36. 杜甫《春望》中写战火连绵，久盼家音，抒发千古以来战争中人们的共同感受的名句是：","ans":"烽火连三月，家书抵万金","img":"../public/question-crops/poetry-memory/poetry-memory-context-36.webp","aimg":"","src":"../public/source/poetry-memory/page-08.jpg","ph":false,"jx":"《春望》杜甫（唐）。题干问“战火连绵、久盼家音”，即“烽火连三月，家书抵万金”——“抵万金”以夸张写家书之贵。"},{"s":"古诗文默写","sid":"poetry-memory","n":37,"id":"poetry-memory-context-37","tag":"理解性默写","t":"自评题","stem":"37．杜甫在《春望》一诗中，描写国都沦陷但山河依/旧、春天降临却乱草丛生的诗句是：","ans":"国破山河在，城春草木深","img":"../public/question-crops/poetry-memory/poetry-memory-context-37.webp","aimg":"","src":"../public/source/poetry-memory/page-08.jpg","ph":false,"jx":"《春望》杜甫。题干问“国都沦陷而山河依旧、春天降临却乱草丛生”，即首联“国破山河在，城春草木深”。"},{"s":"古诗文默写","sid":"poetry-memory","n":38,"id":"poetry-memory-context-38","tag":"理解性默写","t":"自评题","stem":"38. 《春望》一诗中，运用拟人手法表现诗人对国事忧伤、对家人思念的两句诗是：","ans":"感时花溅泪，恨别鸟惊心","img":"../public/question-crops/poetry-memory/poetry-memory-context-38.webp","aimg":"","src":"../public/source/poetry-memory/page-08.jpg","ph":false,"jx":"《春望》杜甫。题干问“拟人手法表现忧国思家”，即“感时花溅泪，恨别鸟惊心”——移情于花鸟，故曰拟人。"},{"s":"古诗文默写","sid":"poetry-memory","n":39,"id":"poetry-memory-context-39","tag":"理解性默写","t":"自评题","stem":"39.刘禹锡《酬乐天扬州初逢席上见赠》一诗中蕴含哲理，表明新事物必将取代旧事物的诗句是：","ans":"沉舟侧畔千帆过，病树前头万木春","img":"../public/question-crops/poetry-memory/poetry-memory-context-39.webp","aimg":"","src":"../public/source/poetry-memory/page-08.jpg","ph":false,"jx":"《酬乐天扬州初逢席上见赠》刘禹锡（唐）。题干问“蕴含哲理、新事物取代旧事物”，即“沉舟侧畔千帆过，病树前头万木春”。"},{"s":"古诗文默写","sid":"poetry-memory","n":40,"id":"poetry-memory-context-40","tag":"理解性默写","t":"自评题","stem":"40.刘禹锡《酬乐天扬州初逢席上见赠》一诗中表达诗人对友人的关怀的感激，与友人共勉的诗句是；","ans":"今日听君歌一曲，暂凭杯酒长精神","img":"../public/question-crops/poetry-memory/poetry-memory-context-40.webp","aimg":"","src":"../public/source/poetry-memory/page-08.jpg","ph":false,"jx":"《酬乐天扬州初逢席上见赠》刘禹锡。题干问“感激友人关怀、与友人共勉”，即尾联“今日听君歌一曲，暂凭杯酒长精神”。"},{"s":"古诗文默写","sid":"poetry-memory","n":41,"id":"poetry-memory-context-41","tag":"理解性默写","t":"自评题","stem":"41.《酬乐天扬州初逢席上见赠》一诗中慨叹世事的变化而产生的生疏、惆怅之情的诗句是：","ans":"怀旧空吟闻笛赋，到乡翻似烂柯人","img":"../public/question-crops/poetry-memory/poetry-memory-context-41.webp","aimg":"","src":"../public/source/poetry-memory/page-08.jpg","ph":false,"jx":"《酬乐天扬州初逢席上见赠》刘禹锡。题干问“慨叹世事变化、生疏惆怅”，即“怀旧空吟闻笛赋，到乡翻似烂柯人”——两句连用二典。"},{"s":"古诗文默写","sid":"poetry-memory","n":42,"id":"poetry-memory-context-42","tag":"理解性默写","t":"自评题","stem":"42.《酬乐天扬州初逢席上见赠》一诗中运用了典故的句子是：","ans":"怀旧空吟闻笛赋，到乡翻似烂柯人","img":"../public/question-crops/poetry-memory/poetry-memory-context-42.webp","aimg":"","src":"../public/source/poetry-memory/page-08.jpg","ph":false,"jx":"《酬乐天扬州初逢席上见赠》刘禹锡。题干问“运用典故的句子”，即“怀旧空吟闻笛赋，到乡翻似烂柯人”——“闻笛赋”用向秀典，“烂柯人”用王质典。"},{"s":"古诗文默写","sid":"poetry-memory","n":43,"id":"poetry-memory-context-43","tag":"理解性默写","t":"自评题","stem":"43. 《酬乐天扬州初逢席上见赠》中饱含诗人无限的辛酸和愤怒的诗句是：","ans":"巴山楚水凄凉地，二十三年弃置身","img":"../public/question-crops/poetry-memory/poetry-memory-context-43.webp","aimg":"","src":"../public/source/poetry-memory/page-08.jpg","ph":false,"jx":"《酬乐天扬州初逢席上见赠》刘禹锡。题干问“饱含辛酸和愤怒”，即首联“巴山楚水凄凉地，二十三年弃置身”——“二十三年”写贬谪之久。"},{"s":"古诗文默写","sid":"poetry-memory","n":44,"id":"poetry-memory-context-44","tag":"理解性默写","t":"自评题","stem":"44. 杜牧在《赤壁》中表达机遇可以造就英雄的诗句是：","ans":"东风不与周郎便，铜雀春深锁二乔","img":"../public/question-crops/poetry-memory/poetry-memory-context-44.webp","aimg":"","src":"../public/source/poetry-memory/page-08.jpg","ph":false,"jx":"《赤壁》杜牧（晚唐）。题干问“机遇可以造就英雄”，即“东风不与周郎便，铜雀春深锁二乔”——从反面假设，说明成败系于时运。"},{"s":"古诗文默写","sid":"poetry-memory","n":45,"id":"poetry-memory-context-45","tag":"理解性默写","t":"自评题","stem":"45.《赤壁》中诗人借物起兴慨叹前朝人物和事迹的诗句是：","ans":"折戟沉沙铁未销，自将磨洗认前朝","img":"../public/question-crops/poetry-memory/poetry-memory-context-45.webp","aimg":"","src":"../public/source/poetry-memory/page-08.jpg","ph":false,"jx":"《赤壁》杜牧。题干问“借物起兴、慨叹前朝人物事迹”，即“折戟沉沙铁未销，自将磨洗认前朝”——以一件残戟引出怀古。"},{"s":"古诗文默写","sid":"poetry-memory","n":46,"id":"poetry-memory-context-46","tag":"理解性默写","t":"自评题","stem":"46. 《赤壁》中诗人从反面落笔进行议论的诗句是：","ans":"东风不与周郎便，铜雀春深锁二乔","img":"../public/question-crops/poetry-memory/poetry-memory-context-46.webp","aimg":"","src":"../public/source/poetry-memory/page-08.jpg","ph":false,"jx":"《赤壁》杜牧。题干问“从反面落笔进行议论”，即“东风不与周郎便，铜雀春深锁二乔”——不正面写胜利而假设失败。"},{"s":"古诗文默写","sid":"poetry-memory","n":47,"id":"poetry-memory-context-47","tag":"理解性默写","t":"自评题","stem":"47．文天祥在《过零丁洋》中感慨国势危亡、人生坎坷的两句诗是：","ans":"山河破碎风飘絮，身世浮沉雨打萍","img":"../public/question-crops/poetry-memory/poetry-memory-context-47.webp","aimg":"","src":"../public/source/poetry-memory/page-08.jpg","ph":false,"jx":"《过零丁洋》文天祥（南宋末）。题干问“感慨国势危亡、人生坎坷”，即“山河破碎风飘絮，身世浮沉雨打萍”——“絮”“萍”两喻并出。"},{"s":"古诗文默写","sid":"poetry-memory","n":48,"id":"poetry-memory-context-48","tag":"理解性默写","t":"自评题","stem":"48.文天祥的《过零丁洋》中表现诗人哲死报国，表现诗人崇高的爱国情怀与坚贞的民族气节的名句是：","ans":"人生自古谁无死？留取丹心照汗青","img":"../public/question-crops/poetry-memory/poetry-memory-context-48.webp","aimg":"","src":"../public/source/poetry-memory/page-08.jpg","ph":false,"jx":"《过零丁洋》文天祥。题干问“誓死报国、坚贞民族气节的名句”，即“人生自古谁无死？留取丹心照汗青”。“汗青”指史册。"},{"s":"古诗文默写","sid":"poetry-memory","n":49,"id":"poetry-memory-context-49","tag":"理解性默写","t":"自评题","stem":"49．文天祥在《过零丁洋》中表明以死明志决心的句子是：","ans":"人生自古谁无死？留取丹心照汗青","img":"../public/question-crops/poetry-memory/poetry-memory-context-49.webp","aimg":"","src":"../public/source/poetry-memory/page-08.jpg","ph":false,"jx":"《过零丁洋》文天祥。题干问“以死明志的决心”，仍是“人生自古谁无死？留取丹心照汗青”，反问句把生死看得极轻。"},{"s":"古诗文默写","sid":"poetry-memory","n":50,"id":"poetry-memory-context-50","tag":"理解性默写","t":"自评题","stem":"50.文天祥的《过零丁洋 》概括写出诗人被捕前的全部经历的诗句是：","ans":"辛苦遭逢起一经，干戈寥落四周星","img":"../public/question-crops/poetry-memory/poetry-memory-context-50.webp","aimg":"","src":"../public/source/poetry-memory/page-08.jpg","ph":false,"jx":"《过零丁洋》文天祥。题干问“概括被捕前的全部经历”，即颔联“辛苦遭逢起一经，干戈寥落四周星”——由科举入仕到起兵抗元。"},{"s":"古诗文默写","sid":"poetry-memory","n":51,"id":"poetry-memory-context-51","tag":"理解性默写","t":"自评题","stem":"51. 文天祥的《过零丁洋》中概括写出两次抗元遭受失败后的心情的诗句是：","ans":"惶恐滩头说惶恐，零丁洋里叹零丁","img":"../public/question-crops/poetry-memory/poetry-memory-context-51.webp","aimg":"","src":"../public/source/poetry-memory/page-08.jpg","ph":false,"jx":"《过零丁洋》文天祥。题干问“两次抗元失败后的心情”，即颈联“惶恐滩头说惶恐，零丁洋里叹零丁”，以地名双关心情。"},{"s":"古诗文默写","sid":"poetry-memory","n":52,"id":"poetry-memory-context-52","tag":"理解性默写","t":"自评题","stem":"52.《行路难》（其一）中借用两个典故表达了作者渴望回到君王身边的语句是：","ans":"闲来垂钓碧溪上，忽复乘舟梦日边","img":"../public/question-crops/poetry-memory/poetry-memory-context-52.webp","aimg":"","src":"../public/source/poetry-memory/page-08.jpg","ph":false,"jx":"《行路难（其一）》李白（唐）。题干问“借用两个典故表达渴望回到君王身边”，即“闲来垂钓碧溪上，忽复乘舟梦日边”——姜尚、伊尹二典。"},{"s":"古诗文默写","sid":"poetry-memory","n":53,"id":"poetry-memory-context-53","tag":"理解性默写","t":"自评题","stem":"53. 面对人生中的困难和挫折，我们要像李白《行路难》（其一）里说的那样，对未来充满信心和希望：","ans":"长风破浪会有时，直挂云帆济沧海","img":"../public/question-crops/poetry-memory/poetry-memory-context-53.webp","aimg":"","src":"../public/source/poetry-memory/page-08.jpg","ph":false,"jx":"《行路难（其一）》李白。题干问“对未来充满信心和希望”，即“长风破浪会有时，直挂云帆济沧海”。“会”意为终当、总会。"},{"s":"古诗文默写","sid":"poetry-memory","n":54,"id":"poetry-memory-context-54","tag":"理解性默写","t":"自评题","stem":"54. 刘禹锡《酬乐天扬州初逢席上见赠》中，‘\n〞两句，运用典\n故表达了作者久谪归来、人事已非、恍如隔世之感。","ans":"怀旧空吟闻笛赋，到乡翻似烂柯人","img":"../public/question-crops/poetry-memory/poetry-memory-context-54.webp","aimg":"","src":"../public/source/poetry-memory/page-08.jpg","ph":false,"jx":"《酬乐天扬州初逢席上见赠》刘禹锡。题干问“用典表达久谪归来、人事已非、恍如隔世”，即“怀旧空吟闻笛赋，到乡翻似烂柯人”。"},{"s":"古诗文默写","sid":"poetry-memory","n":55,"id":"poetry-memory-context-55","tag":"理解性默写","t":"自评题","stem":"理解性默写第 55 题：请查看原题页后完成默写。","ans":"沉舟侧畔千帆过，病树前头万木春","img":"../public/question-crops/poetry-memory/poetry-memory-context-55.webp","aimg":"","src":"../public/source/poetry-memory/page-08.jpg","ph":false,"jx":"《酬乐天扬州初逢席上见赠》刘禹锡（唐）。此句“沉舟侧畔千帆过，病树前头万木春”是全诗最具哲理、也最常被引用的名句，写新陈代谢不可阻挡。"},{"s":"古诗文默写","sid":"poetry-memory","n":56,"id":"poetry-memory-context-56","tag":"理解性默写","t":"自评题","stem":"理解性默写第 56 题：请查看原题页后完成默写。","ans":"但愿人长久，千里共婵娟","img":"../public/question-crops/poetry-memory/poetry-memory-context-56.webp","aimg":"","src":"../public/source/poetry-memory/page-08.jpg","ph":false,"jx":"《水调歌头·明月几时有》苏轼（北宋）。此句“但愿人长久，千里共婵娟”是全词祝愿之句，“婵娟”代指明月。"},{"s":"古诗文默写","sid":"poetry-memory","n":57,"id":"poetry-memory-context-57","tag":"理解性默写","t":"自评题","stem":"57. 杜甫《春望》中，\n与他的《月夜忆舍弟》一诗中“寄丰\n长不达，况乃末休兵〞两句表达的意思相近。","ans":"烽火连三月，家书抵万金","img":"../public/question-crops/poetry-memory/poetry-memory-context-57.webp","aimg":"","src":"../public/source/poetry-memory/page-09.jpg","ph":false,"jx":"《春望》杜甫（唐）。题干与《月夜忆舍弟》“寄书长不达，况乃未休兵”意思相近，都写战乱中书信难通，故答“烽火连三月，家书抵万金”。"},{"s":"古诗文默写","sid":"poetry-memory","n":58,"id":"poetry-memory-context-58","tag":"理解性默写","t":"自评题","stem":"58. 李商隐的《无题》中表达对所爱的人至死不渝的深情的句子是：","ans":"春蚕到死丝方尽，蜡炬成灰泪始干","img":"../public/question-crops/poetry-memory/poetry-memory-context-58.webp","aimg":"","src":"../public/source/poetry-memory/page-09.jpg","ph":false,"jx":"《无题》（相见时难别亦难）李商隐（晚唐）。题干问“对所爱之人至死不渝的深情”，即“春蚕到死丝方尽，蜡炬成灰泪始干”。"},{"s":"古诗文默写","sid":"poetry-memory","n":59,"id":"poetry-memory-context-59","tag":"理解性默写","t":"自评题","stem":"59． 生活中有收获的喜悦，也有失去的痛苦，只要我们拥有“\n的\n良好心;态就能正确对待人生。（用范仲淹《岳阳楼记》中的句子填写）","ans":"不以物喜，不以己悲","img":"../public/question-crops/poetry-memory/poetry-memory-context-59.webp","aimg":"","src":"../public/source/poetry-memory/page-09.jpg","ph":false,"jx":"《岳阳楼记》范仲淹（北宋）。题干问“良好心态、正确对待得失”，即“不以物喜，不以己悲”——不因外物与个人遭遇而喜悲。"},{"s":"古诗文默写","sid":"poetry-memory","n":60,"id":"poetry-memory-context-60","tag":"理解性默写","t":"自评题","stem":"60. 《岳阳楼记》中传诵干古，表达范仲淹宏伟抱负的名句是：","ans":"先天下之忧而忧，后天下之乐而乐","img":"../public/question-crops/poetry-memory/poetry-memory-context-60.webp","aimg":"","src":"../public/source/poetry-memory/page-09.jpg","ph":false,"jx":"《岳阳楼记》范仲淹。题干问“传诵千古、表达宏伟抱负的名句”，即“先天下之忧而忧，后天下之乐而乐”。"},{"s":"古诗文默写","sid":"poetry-memory","n":61,"id":"poetry-memory-context-61","tag":"理解性默写","t":"自评题","stem":"61.“项庄舞剑，意在沛公”比喻说话和行动的真实意图别有所指。《醉翁亭记》中与它意思相近的句子\n是：","ans":"醉翁之意不在酒，在乎山水之间也","img":"../public/question-crops/poetry-memory/poetry-memory-context-61.webp","aimg":"","src":"../public/source/poetry-memory/page-09.jpg","ph":false,"jx":"《醉翁亭记》欧阳修（北宋）。题干以“项庄舞剑，意在沛公”作比，都指本意另有所指，故答“醉翁之意不在酒，在乎山水之间也”。"},{"s":"古诗文默写","sid":"poetry-memory","n":62,"id":"poetry-memory-context-62","tag":"理解性默写","t":"自评题","stem":"62.古人写雪，手法不一。刘义庆《世说新语．咏雪》中的“未若柳絮因风起”，比喻精妙；而张岱《湖\n心亭看雪》中的“\n〞则用白描，同样形神兼备。","ans":"湖上影子，惟长堤一痕、湖心亭一点、与余舟一芥、舟中人两三粒而已","img":"../public/question-crops/poetry-memory/poetry-memory-context-62.webp","aimg":"","src":"../public/source/poetry-memory/page-09.jpg","ph":false,"jx":"《湖心亭看雪》张岱（明末清初）。题干问“用白描写雪”，即“湖上影子，惟长堤一痕、湖心亭一点、与余舟一芥、舟中人两三粒而已”——以“一痕”“一点”“一芥”“两三粒”缩景为微。"},{"s":"古诗文默写","sid":"poetry-memory","n":63,"id":"poetry-memory-context-63","tag":"理解性默写","t":"自评题","stem":"63.《渔家傲•秋思》中写出当时战争形势的诗句是：","ans":"四面边声连角起，千嶂里，长烟落日孤城闭","img":"../public/question-crops/poetry-memory/poetry-memory-context-63.webp","aimg":"","src":"../public/source/poetry-memory/page-09.jpg","ph":false,"jx":"《渔家傲·秋思》范仲淹（北宋）。题干问“写出当时的战争形势”，即“四面边声连角起，千嶂里，长烟落日孤城闭”——从声、山、城三面写军情紧急。"},{"s":"古诗文默写","sid":"poetry-memory","n":64,"id":"poetry-memory-context-64","tag":"理解性默写","t":"自评题","stem":"64.《渔家傲．秋思》中写出将士们生活艰苦而又思乡心切惆怅的句子是：","ans":"浊酒一杯家万里，燕然未勒归无计","img":"../public/question-crops/poetry-memory/poetry-memory-context-64.webp","aimg":"","src":"../public/source/poetry-memory/page-09.jpg","ph":false,"jx":"《渔家傲·秋思》范仲淹。题干问“生活艰苦而又思乡心切”，即“浊酒一杯家万里，燕然未勒归无计”——借酒解乡愁，功未成故归不得。"},{"s":"古诗文默写","sid":"poetry-memory","n":65,"id":"poetry-memory-context-65","tag":"理解性默写","t":"自评题","stem":"65.《渔家傲．秋思》中从虚写的角度，突出战争持久，将士背井离乡远征边塞的痛苦的诗句是：","ans":"人不寐，将军白发征夫泪","img":"../public/question-crops/poetry-memory/poetry-memory-context-65.webp","aimg":"","src":"../public/source/poetry-memory/page-09.jpg","ph":false,"jx":"《渔家傲·秋思》范仲淹。题干问“从虚写角度突出战争持久、将士痛苦”，即“人不寐，将军白发征夫泪”——以白头与泪写久戍之痛。"},{"s":"古诗文默写","sid":"poetry-memory","n":66,"id":"poetry-memory-context-66","tag":"理解性默写","t":"自评题","stem":"66. 苏轼《江城子．密州出猎》中抒发立志为国效命的情怀的句子是：","ans":"会挽雕弓如满月，西北望，射天狼","img":"../public/question-crops/poetry-memory/poetry-memory-context-66.webp","aimg":"","src":"../public/source/poetry-memory/page-09.jpg","ph":false,"jx":"《江城子·密州出猎》苏轼（北宋）。题干问“立志为国效命的情怀”，即结句“会挽雕弓如满月，西北望，射天狼”——“天狼”喻侵扰边境的敌人。"},{"s":"古诗文默写","sid":"poetry-memory","n":67,"id":"poetry-memory-context-67","tag":"理解性默写","t":"自评题","stem":"67.《破阵子．为陈同甫赋壮词以寄之》中从视觉与听觉两方面再现激烈战斗场面的句子是：","ans":"马作的卢飞快，弓如霹雳弦惊","img":"../public/question-crops/poetry-memory/poetry-memory-context-67.webp","aimg":"","src":"../public/source/poetry-memory/page-09.jpg","ph":false,"jx":"《破阵子·为陈同甫赋壮词以寄之》辛弃疾（南宋）。题干问“视觉与听觉两方面再现激烈战斗场面”，即“马作的卢飞快，弓如霹雳弦惊”——前句视觉，后句听觉。"},{"s":"古诗文默写","sid":"poetry-memory","n":68,"id":"poetry-memory-context-68","tag":"理解性默写","t":"自评题","stem":"68. 《满江红》中描述鉴湖女俠的巾帼英雄的形象，表达她的抱负、志向和思想感情的转变的句子是：","ans":"身不得，男儿列；心却比，男儿烈","img":"../public/question-crops/poetry-memory/poetry-memory-context-68.webp","aimg":"","src":"../public/source/poetry-memory/page-09.jpg","ph":false,"jx":"《满江红》秋瑾（清末）。题干问“巾帼英雄形象、抱负与思想感情转变”，即“身不得，男儿列；心却比，男儿烈”——身体与志气的对照。"},{"s":"古诗文默写","sid":"poetry-memory","n":69,"id":"poetry-memory-context-69","tag":"理解性默写","t":"自评题","stem":"69.《十五从军征》中更加深刻地表现出老翁孤独凄凉的处境和心情的句子是：","ans":"遥望是君家，松柏冢累累","img":"../public/question-crops/poetry-memory/poetry-memory-context-69.webp","aimg":"","src":"../public/source/poetry-memory/page-09.jpg","ph":false,"jx":"《十五从军征》（汉乐府）。题干问“更深刻表现老翁孤独凄凉”，即“遥望是君家，松柏冢累累”——家已变坟，是最大打击。"},{"s":"古诗文默写","sid":"poetry-memory","n":70,"id":"poetry-memory-context-70","tag":"理解性默写","t":"自评题","stem":"70.《十五从军征》中揭露(表现） 汉代极端不合理的封建兵役制度的句子是：","ans":"十五从军征，八十始得归","img":"../public/question-crops/poetry-memory/poetry-memory-context-70.webp","aimg":"","src":"../public/source/poetry-memory/page-09.jpg","ph":false,"jx":"《十五从军征》（汉乐府）。题干问“揭露极端不合理的兵役制度”，即首句“十五从军征，八十始得归”——“十五”与“八十”的反差即是控诉。"},{"s":"古诗文默写","sid":"poetry-memory","n":71,"id":"poetry-memory-context-71","tag":"理解性默写","t":"自评题","stem":"71. 岑参《白雪歌送武判官归京》中写在军营里设置酒宴，用有西域特色的管弦乐器齐鸣和响来增添苍凉\n悲壮豪气的诗句是：","ans":"中军置酒饮归客，胡琴琵琶与羌笛","img":"../public/question-crops/poetry-memory/poetry-memory-context-71.webp","aimg":"","src":"../public/source/poetry-memory/page-09.jpg","ph":false,"jx":"《白雪歌送武判官归京》岑参（唐）。题干问“军营设酒宴、用西域管弦增添苍凉悲壮”，即“中军置酒饮归客，胡琴琵琶与羌笛”。"},{"s":"古诗文默写","sid":"poetry-memory","n":72,"id":"poetry-memory-context-72","tag":"理解性默写","t":"自评题","stem":"72.《白雪歌送武判官归京》中，写诗人目送友人离去流露依依不舍之情的诗句是：","ans":"山回路转不见君，雪上空留马行处","img":"../public/question-crops/poetry-memory/poetry-memory-context-72.webp","aimg":"","src":"../public/source/poetry-memory/page-09.jpg","ph":false,"jx":"《白雪歌送武判官归京》岑参。题干问“目送友人离去、依依不舍”，即结句“山回路转不见君，雪上空留马行处”——人已不见而蹄印尚存。"},{"s":"古诗文默写","sid":"poetry-memory","n":73,"id":"poetry-memory-context-73","tag":"理解性默写","t":"自评题","stem":"73.《南乡子．登京口北固亭有怀》中看江水东流，发思古幽情的句子是：","ans":"千古兴亡多少事？悠悠。不尽长江滚滚流","img":"../public/question-crops/poetry-memory/poetry-memory-context-73.webp","aimg":"","src":"../public/source/poetry-memory/page-09.jpg","ph":false,"jx":"《南乡子·登京口北固亭有怀》辛弃疾（南宋）。题干问“看江水东流、发思古幽情”，即“千古兴亡多少事？悠悠。不尽长江滚滚流”。"},{"s":"古诗文默写","sid":"poetry-memory","n":74,"id":"poetry-memory-context-74","tag":"理解性默写","t":"自评题","stem":"74． 在纪念中国人民抗日战争胜利 74 周年的主题班会上，同学们一起吟咏文天祥的《过零丁洋》，其中\n_”不禁让我们想起中华民族的那段悲惨历史，也让我们\n深深体会到个人前途与国家命运紧密相连的深刻道理。","ans":"山河破碎风飘絮，身世浮沉雨打萍","img":"../public/question-crops/poetry-memory/poetry-memory-context-74.webp","aimg":"","src":"../public/source/poetry-memory/page-09.jpg","ph":false,"jx":"《过零丁洋》文天祥（南宋末）。题干以民族苦难与个人前途国家命运相连立意，对应“山河破碎风飘絮，身世浮沉雨打萍”。"},{"s":"古诗文默写","sid":"poetry-memory","n":75,"id":"poetry-memory-context-75","tag":"理解性默写","t":"自评题","stem":"75．在生死大义面前，孟子主张“舍生而取义者也”，文天祥慷慨陈词：\n？\n_。”古人的这些豪壮之语感召了多少仁人志士为正义事业而英勇献身！","ans":"人生自古谁无死？留取丹心照汗青","img":"../public/question-crops/poetry-memory/poetry-memory-context-75.webp","aimg":"","src":"../public/source/poetry-memory/page-09.jpg","ph":false,"jx":"《过零丁洋》文天祥。题干引孟子“舍生而取义”，问文天祥的慷慨之词，即“人生自古谁无死？留取丹心照汗青”。"},{"s":"古诗文默写","sid":"poetry-memory","n":76,"id":"poetry-memory-context-76","tag":"理解性默写","t":"自评题","stem":"理解性默写第 76 题：请查看原题页后完成默写。","ans":"峰峦如聚，波涛如怒，山河表里潼关路","img":"../public/question-crops/poetry-memory/poetry-memory-context-76.webp","aimg":"","src":"../public/source/poetry-memory/page-09.jpg","ph":false,"jx":"《山坡羊·潼关怀古》张养浩（元）。此句“峰峦如聚，波涛如怒，山河表里潼关路”以拟人写潼关险要，是怀古的起笔。"},{"s":"古诗文默写","sid":"poetry-memory","n":77,"id":"poetry-memory-context-77","tag":"理解性默写","t":"自评题","stem":"理解性默写第 77 题：请查看原题页后完成默写。","ans":"兴，百姓苦；亡，百姓苦","img":"../public/question-crops/poetry-memory/poetry-memory-context-77.webp","aimg":"","src":"../public/source/poetry-memory/page-09.jpg","ph":false,"jx":"《山坡羊·潼关怀古》张养浩。此句“兴，百姓苦；亡，百姓苦”是全曲主旨，把兴亡之叹落到百姓身上。"},{"s":"古诗文默写","sid":"poetry-memory","n":78,"id":"poetry-memory-context-78","tag":"理解性默写","t":"自评题","stem":"理解性默写第 78 题：请查看原题页后完成默写。","ans":"所欲有甚于生者，故患有所不辟也","img":"../public/question-crops/poetry-memory/poetry-memory-context-78.webp","aimg":"","src":"../public/source/poetry-memory/page-10.jpg","ph":false,"jx":"《鱼我所欲也》孟子（战国）。此句“所欲有甚于生者，故患有所不辟也”说明舍生的理由——有比生命更可贵的东西。“辟”通“避”。"},{"s":"古诗文默写","sid":"poetry-memory","n":79,"id":"poetry-memory-context-79","tag":"理解性默写","t":"自评题","stem":"理解性默写第 79 题：请查看原题页后完成默写。","ans":"以中有足乐者，不知口体之奉不若人也","img":"../public/question-crops/poetry-memory/poetry-memory-context-79.webp","aimg":"","src":"../public/source/poetry-memory/page-10.jpg","ph":false,"jx":"《送东阳马生序》宋濂（明）。此句“以中有足乐者，不知口体之奉不若人也”说明作者不以衣食之劣为耻的原因在于心中有乐。“口体之奉”指吃穿。"},{"s":"古诗文默写","sid":"poetry-memory","n":80,"id":"poetry-memory-context-80","tag":"理解性默写","t":"自评题","stem":"理解性默写第 80 题：请查看原题页后完成默写。","ans":"一鼓作气，再而衰，三而竭，彼竭我盈","img":"../public/question-crops/poetry-memory/poetry-memory-context-80.webp","aimg":"","src":"../public/source/poetry-memory/page-10.jpg","ph":false,"jx":"《曹刿论战》（《左传》，先秦）。此句“一鼓作气，再而衰，三而竭，彼竭我盈”是成语“一鼓作气”的出处，讲的是把握战机。“盈”意为充沛。"},{"s":"古诗文默写","sid":"poetry-memory","n":81,"id":"poetry-memory-context-81","tag":"理解性默写","t":"自评题","stem":"理解性默写第 81 题：请查看原题页后完成默写。","ans":"小大之狱，虽不能察，必以情","img":"../public/question-crops/poetry-memory/poetry-memory-context-81.webp","aimg":"","src":"../public/source/poetry-memory/page-10.jpg","ph":false,"jx":"《曹刿论战》。此句“小大之狱，虽不能察，必以情”是鲁庄公所说的可取之处，也是曹刿认可他“可以一战”的依据。“狱”指案件。"},{"s":"古诗文默写","sid":"poetry-memory","n":82,"id":"poetry-memory-context-82","tag":"理解性默写","t":"自评题","stem":"82.《邹忌讽齐王纳谏》中齐威王奖赏进谏的政令下达\"期年之后”的情况：虽欲言，无可进者。这表明\n齐国政治日益清明。从而达到“_\n_”的目的。","ans":"此所谓战胜于朝廷","img":"../public/question-crops/poetry-memory/poetry-memory-context-82.webp","aimg":"","src":"../public/source/poetry-memory/page-10.jpg","ph":false,"jx":"《邹忌讽齐王纳谏》（《战国策》，先秦）。题干说“期年之后，虽欲言，无可进者”，表明政令得当、无须再谏，达到的效果即“此所谓战胜于朝廷”。"},{"s":"古诗文默写","sid":"poetry-memory","n":83,"id":"poetry-memory-context-83","tag":"理解性默写","t":"自评题","stem":"83.陶淋明的《饮酒》（其五）中，表明诗人决意摆脱尘世的干扰，过闲适恬静的生活的诗句是：","ans":"结庐在人境，而无车马喧","img":"../public/question-crops/poetry-memory/poetry-memory-context-83.webp","aimg":"","src":"../public/source/poetry-memory/page-10.jpg","ph":false,"jx":"《饮酒（其五）》陶渊明（东晋）。题干问“决意摆脱尘世干扰、过闲适生活”，即首联“结庐在人境，而无车马喧”——身在人境而心不受扰。"},{"s":"古诗文默写","sid":"poetry-memory","n":84,"id":"poetry-memory-context-84","tag":"理解性默写","t":"自评题","stem":"84. 王维的《使至塞上》中写塞外奇特美丽风光的干古名句是：","ans":"大漠孤烟直，长河落日圆","img":"../public/question-crops/poetry-memory/poetry-memory-context-84.webp","aimg":"","src":"../public/source/poetry-memory/page-10.jpg","ph":false,"jx":"《使至塞上》王维（唐）。题干问“写塞外奇特美丽风光的千古名句”，即颈联“大漠孤烟直，长河落日圆”——“直”“圆”二字最见炼字功力。"},{"s":"古诗文默写","sid":"poetry-memory","n":85,"id":"poetry-memory-context-85","tag":"理解性默写","t":"自评题","stem":"85.小伙子一般都喜欢美丽而又贤慧的姑娘，《关雎》一诗中的\n这两\n句就是佐证。","ans":"窈窕淑女，君子好逑","img":"../public/question-crops/poetry-memory/poetry-memory-context-85.webp","aimg":"","src":"../public/source/poetry-memory/page-10.jpg","ph":false,"jx":"《诗经·关雎》（西周至春秋）。题干问“小伙子喜欢美丽贤慧姑娘的佐证”，即“窈窕淑女，君子好逑”。“逑”意为配偶。"},{"s":"古诗文默写","sid":"poetry-memory","n":86,"id":"poetry-memory-context-86","tag":"理解性默写","t":"自评题","stem":"86.《蒹葭》中能印证“上穷碧落下黄泉，两处茫茫皆不见”的寻找道求的诗句是：","ans":"所谓伊人，在水一方。溯洄从之，道阻且长；溯游从之，宛在水中央","img":"../public/question-crops/poetry-memory/poetry-memory-context-86.webp","aimg":"","src":"../public/source/poetry-memory/page-10.jpg","ph":false,"jx":"《诗经·蒹葭》。题干以“上穷碧落下黄泉，两处茫茫皆不见”的寻觅之意作比，对应反复追寻而伊人缥缈的“所谓伊人，在水一方。溯洄从之，道阻且长；溯游从之，宛在水中央”。"},{"s":"古诗文默写","sid":"poetry-memory","n":87,"id":"poetry-memory-context-87","tag":"理解性默写","t":"自评题","stem":"87.《生于忧患，死于安乐》中用来警策激励人的名句是：","ans":"然后知生于忧患而死于安乐也","img":"../public/question-crops/poetry-memory/poetry-memory-context-87.webp","aimg":"","src":"../public/source/poetry-memory/page-10.jpg","ph":false,"jx":"《生于忧患，死于安乐》孟子（战国）。题干问“警策激励人的名句”，即全文结句“然后知生于忧患而死于安乐也”。"},{"s":"古诗文默写","sid":"poetry-memory","n":88,"id":"poetry-memory-context-88","tag":"理解性默写","t":"自评题","stem":"88.《生于忧患，死于安乐》中分析亡国的条件的句子是：","ans":"入则无法家拂士，出则无敌国外患者，国恒亡","img":"../public/question-crops/poetry-memory/poetry-memory-context-88.webp","aimg":"","src":"../public/source/poetry-memory/page-10.jpg","ph":false,"jx":"《生于忧患，死于安乐》孟子。题干问“分析亡国的条件”，即“入则无法家拂士，出则无敌国外患者，国恒亡”——内无法度之士、外无敌国之患则亡。“拂”通“弼”。"},{"s":"古诗文默写","sid":"poetry-memory","n":89,"id":"poetry-memory-context-89","tag":"理解性默写","t":"自评题","stem":"89.《渔家傲》中展现了一幅海天相接、辽阔的画面和描绘出瑰奇雄伟景象的句子是：","ans":"天接云涛连晓雾，星河欲转千帆舞","img":"../public/question-crops/poetry-memory/poetry-memory-context-89.webp","aimg":"","src":"../public/source/poetry-memory/page-10.jpg","ph":false,"jx":"《渔家傲·天接云涛连晓雾》李清照（宋）。题干问“海天相接、瑰奇雄伟的景象”，即“天接云涛连晓雾，星河欲转千帆舞”。"},{"s":"古诗文默写","sid":"poetry-memory","n":90,"id":"poetry-memory-context-90","tag":"理解性默写","t":"自评题","stem":"90.《渔家傲》中，作者直抒胸臆感叹自己空有卓越才华，虽苦苦求索，终因遭遇不幸未能找到光明出路的\n句子是：","ans":"我报路长嗟日暮，学诗谩有惊人句","img":"../public/question-crops/poetry-memory/poetry-memory-context-90.webp","aimg":"","src":"../public/source/poetry-memory/page-10.jpg","ph":false,"jx":"《渔家傲·天接云涛连晓雾》李清照。题干问“直抒胸臆、叹空有才华、终因不幸未找到出路”，即“我报路长嗟日暮，学诗谩有惊人句”。“谩”意为徒然。"},{"s":"古诗文默写","sid":"poetry-memory","n":91,"id":"poetry-memory-context-91","tag":"理解性默写","t":"自评题","stem":"91. 诸葛亮的《出师表》中诸葛亮劝刘禅对宫中、府中官员的赏罚要坚持同一标准的句子是：","ans":"陟罚臧否，不宜异同","img":"../public/question-crops/poetry-memory/poetry-memory-context-91.webp","aimg":"","src":"../public/source/poetry-memory/page-10.jpg","ph":false,"jx":"《出师表》诸葛亮（三国·蜀汉）。题干问“劝刘禅对宫中府中官员赏罚同一标准”，即“陟罚臧否，不宜异同”——“陟”是升，“臧否”是褒贬评判。"},{"s":"古诗文默写","sid":"poetry-memory","n":92,"id":"poetry-memory-context-92","tag":"理解性默写","t":"自评题","stem":"92.《出师表》中，表明作者志趣的句子是：","ans":"苟全性命于乱世，不求闻达于诸侯","img":"../public/question-crops/poetry-memory/poetry-memory-context-92.webp","aimg":"","src":"../public/source/poetry-memory/page-10.jpg","ph":false,"jx":"《出师表》诸葛亮。题干问“表明作者志趣”，即“苟全性命于乱世，不求闻达于诸侯”——不求显达、只求自保，正是布衣本色。"},{"s":"古诗文默写","sid":"poetry-memory","n":93,"id":"poetry-memory-context-93","tag":"理解性默写","t":"自评题","stem":"93．写出先汉兴隆和后汉倾颓的原因的句子是：","ans":"亲贤臣，远小人，此先汉所以兴隆也；亲小人，远贤臣，此后汉所以倾颓也","img":"../public/question-crops/poetry-memory/poetry-memory-context-93.webp","aimg":"","src":"../public/source/poetry-memory/page-10.jpg","ph":false,"jx":"《出师表》诸葛亮。题干问“写出先汉兴隆和后汉倾颓的原因”，即“亲贤臣，远小人，此先汉所以兴隆也；亲小人，远贤臣，此后汉所以倾颓也”——两组正反对照。"},{"s":"古诗文默写","sid":"poetry-memory","n":94,"id":"poetry-memory-context-94","tag":"理解性默写","t":"自评题","stem":"94. 当任命一个人来挽救局面，人们常引用《出师表》中的一句名言：","ans":"受任于败军之际，奉命于危难之间","img":"../public/question-crops/poetry-memory/poetry-memory-context-94.webp","aimg":"","src":"../public/source/poetry-memory/page-10.jpg","ph":false,"jx":"《出师表》诸葛亮。题干问“任命某人挽救局面时常引用的名言”，即“受任于败军之际，奉命于危难之间”。"},{"s":"古诗文默写","sid":"poetry-memory","n":95,"id":"poetry-memory-context-95","tag":"理解性默写","t":"自评题","stem":"理解性默写第 95 题：请查看原题页后完成默写。","ans":"今天下三分，益州疲弊","img":"../public/question-crops/poetry-memory/poetry-memory-context-95.webp","aimg":"","src":"../public/source/poetry-memory/page-10.jpg","ph":false,"jx":"《出师表》诸葛亮（三国·蜀汉）。此句“今天下三分，益州疲弊”写当时局势危急，是后文“此诚危急存亡之秋也”的依据。"},{"s":"古诗文默写","sid":"poetry-memory","n":96,"id":"poetry-memory-context-96","tag":"理解性默写","t":"自评题","stem":"理解性默写第 96 题：请查看原题页后完成默写。","ans":"安得广厦千万间，大庇天下寒士俱欢颜！风雨不动安如山","img":"../public/question-crops/poetry-memory/poetry-memory-context-96.webp","aimg":"","src":"../public/source/poetry-memory/page-10.jpg","ph":false,"jx":"《茅屋为秋风所破歌》杜甫（唐）。此句“安得广厦千万间，大庇天下寒士俱欢颜！风雨不动安如山”是推己及人的理想，与后文舍己之誓同属一篇之魂。"},{"s":"古诗文默写","sid":"poetry-memory","n":97,"id":"poetry-memory-context-97","tag":"理解性默写","t":"自评题","stem":"97.《茅屋为秋风所破歌》一诗中表现杜甫舍己为人、至死不悔的决心的两句诗是：","ans":"何时眼前突兀见此屋，吾庐独破受冻死亦足","img":"../public/question-crops/poetry-memory/poetry-memory-context-97.webp","aimg":"","src":"../public/source/poetry-memory/page-10.jpg","ph":false,"jx":"《茅屋为秋风所破歌》杜甫。题干问“舍己为人、至死不悔的决心”，即“何时眼前突兀见此屋，吾庐独破受冻死亦足”——宁自己冻死也要天下寒士有屋住。"},{"s":"古诗文默写","sid":"poetry-memory","n":98,"id":"poetry-memory-context-98","tag":"理解性默写","t":"自评题","stem":"98. 欧阳修的《醉翁亭记》中写出醉翁言在此而意在彼，情趣所在的句子是：","ans":"醉翁之意不在酒，在乎山水之间也","img":"../public/question-crops/poetry-memory/poetry-memory-context-98.webp","aimg":"","src":"../public/source/poetry-memory/page-11.jpg","ph":false,"jx":"《醉翁亭记》欧阳修（北宋）。题干问“言在此而意在彼、情趣所在”，即“醉翁之意不在酒，在乎山水之间也”。"},{"s":"古诗文默写","sid":"poetry-memory","n":99,"id":"poetry-memory-context-99","tag":"理解性默写","t":"自评题","stem":"99.李贺的《雁门太守行》中描写白天戒备森严，无比威严的诗句是：","ans":"黑云压城城欲摧，甲光向日金鳞开","img":"../public/question-crops/poetry-memory/poetry-memory-context-99.webp","aimg":"","src":"../public/source/poetry-memory/page-11.jpg","ph":false,"jx":"《雁门太守行》李贺（中唐）。题干问“白天戒备森严、无比威严”，即首联“黑云压城城欲摧，甲光向日金鳞开”——以黑云喻敌军，以金鳞写铠甲。"},{"s":"古诗文默写","sid":"poetry-memory","n":100,"id":"poetry-memory-context-100","tag":"理解性默写","t":"自评题","stem":"100.李贺的《雁门太守行》中从听觉和视觉的角度描写了这场惊心动魄的战斗的句子是：","ans":"角声满天秋色里，塞上燕脂凝夜紫","img":"../public/question-crops/poetry-memory/poetry-memory-context-100.webp","aimg":"","src":"../public/source/poetry-memory/page-11.jpg","ph":false,"jx":"《雁门太守行》李贺。题干问“从听觉和视觉写惊心动魄的战斗”，即“角声满天秋色里，塞上燕脂凝夜紫”——“角声”是听觉，“燕脂凝紫”是视觉。"},{"s":"古诗文默写","sid":"poetry-memory","n":101,"id":"poetry-memory-context-101","tag":"理解性默写","t":"自评题","stem":"101.李贺的《雁门太守行》中抒发誓死报国忠心的诗句是：","ans":"报君黄金台上意，提携玉龙为君死","img":"../public/question-crops/poetry-memory/poetry-memory-context-101.webp","aimg":"","src":"../public/source/poetry-memory/page-11.jpg","ph":false,"jx":"《雁门太守行》李贺。题干问“抒发誓死报国的忠心”，即结句“报君黄金台上意，提携玉龙为君死”——用燕昭王筑台招贤之典。"},{"s":"古诗文默写","sid":"poetry-memory","n":102,"id":"poetry-memory-context-102","tag":"理解性默写","t":"自评题","stem":"102. 李商隐的《无题》中以极其沉痛的心情写伤别的诗句是：","ans":"相见时难别亦难，东风无力百花残","img":"../public/question-crops/poetry-memory/poetry-memory-context-102.webp","aimg":"","src":"../public/source/poetry-memory/page-11.jpg","ph":false,"jx":"《无题》（相见时难别亦难）李商隐（晚唐）。题干问“以极沉痛的心情写伤别”，即首联“相见时难别亦难，东风无力百花残”。"},{"s":"古诗文默写","sid":"poetry-memory","n":103,"id":"poetry-memory-context-103","tag":"理解性默写","t":"自评题","stem":"103. 南仁东二十二年的砥砺前行，让中国的“天眼”望穿苍穹，描绘宇宙。他的精神正如李商隐的《无\n题》中所说：","ans":"春蚕到死丝方尽，蜡炬成灰泪始干","img":"../public/question-crops/poetry-memory/poetry-memory-context-103.webp","aimg":"","src":"../public/source/poetry-memory/page-11.jpg","ph":false,"jx":"《无题》李商隐。题干以“南仁东二十二年砥砺前行”的精神作比，对应至死不渝的“春蚕到死丝方尽，蜡炬成灰泪始干”。"},{"s":"古诗文默写","sid":"poetry-memory","n":104,"id":"poetry-memory-context-104","tag":"理解性默写","t":"自评题","stem":"104. 苏轼的《水调歌头．明月几时有》一词中对月光动态描写的诗句是：","ans":"转朱阁，低绮户，照无眠","img":"../public/question-crops/poetry-memory/poetry-memory-context-104.webp","aimg":"","src":"../public/source/poetry-memory/page-11.jpg","ph":false,"jx":"《水调歌头·明月几时有》苏轼（北宋）。题干问“对月光的动态描写”，即“转朱阁，低绮户，照无眠”——写月光移动，实写人不能寐。"},{"s":"古诗文默写","sid":"poetry-memory","n":105,"id":"poetry-memory-context-105","tag":"理解性默写","t":"自评题","stem":"105. 苏轼的《水调歌头．明月几时有》一词中表达了作者旷达胸襟，表现了作者感悟人生哲理的词句是：","ans":"人有悲欢离合，月有阴晴圆缺，此事古难全","img":"../public/question-crops/poetry-memory/poetry-memory-context-105.webp","aimg":"","src":"../public/source/poetry-memory/page-11.jpg","ph":false,"jx":"《水调歌头·明月几时有》苏轼。题干问“旷达胸襟、感悟人生哲理”，即“人有悲欢离合，月有阴晴圆缺，此事古难全”——由不平到通达。"},{"s":"古诗文默写","sid":"poetry-memory","n":106,"id":"poetry-memory-context-106","tag":"理解性默写","t":"自评题","stem":"理解性默写第 106 题：请查看原题页后完成默写。","ans":"但愿人长久，千里共婵娟","img":"../public/question-crops/poetry-memory/poetry-memory-context-106.webp","aimg":"","src":"../public/source/poetry-memory/page-11.jpg","ph":false,"jx":"《水调歌头·明月几时有》苏轼（北宋）。此句“但愿人长久，千里共婵娟”是全词祝愿之句，写对远人之念。“婵娟”代指明月。"},{"s":"古诗文默写","sid":"poetry-memory","n":107,"id":"poetry-memory-context-107","tag":"理解性默写","t":"自评题","stem":"理解性默写第 107 题：请查看原题页后完成默写。","ans":"人有悲欢离合，月有阴晴圆缺","img":"../public/question-crops/poetry-memory/poetry-memory-context-107.webp","aimg":"","src":"../public/source/poetry-memory/page-11.jpg","ph":false,"jx":"《水调歌头·明月几时有》苏轼。此句“人有悲欢离合，月有阴晴圆缺”以人月对照，是上阕怨月之后的自我排解。"},{"s":"古诗文默写","sid":"poetry-memory","n":108,"id":"poetry-memory-context-108","tag":"理解性默写","t":"自评题","stem":"108. 韩愈的《马说》中写伯乐对干里马起决定作用的句子是：","ans":"世有伯乐，然后有千里马","img":"../public/question-crops/poetry-memory/poetry-memory-context-108.webp","aimg":"","src":"../public/source/poetry-memory/page-11.jpg","ph":false,"jx":"《马说》韩愈（唐）。题干问“伯乐对千里马起决定作用”，即“世有伯乐，然后有千里马”——先有识马者，才有千里马之名。"},{"s":"古诗文默写","sid":"poetry-memory","n":109,"id":"poetry-memory-context-109","tag":"理解性默写","t":"自评题","stem":"109.韩愈的《马说》中写怀才不遇的人常慨叹的两句话是：","ans":"千里马常有，而伯乐不常有","img":"../public/question-crops/poetry-memory/poetry-memory-context-109.webp","aimg":"","src":"../public/source/poetry-memory/page-11.jpg","ph":false,"jx":"《马说》韩愈。题干问“怀才不遇者常慨叹的两句”，即“千里马常有，而伯乐不常有”——“而”字一转，怨在识者难得。"},{"s":"古诗文默写","sid":"poetry-memory","n":110,"id":"poetry-memory-context-110","tag":"理解性默写","t":"自评题","stem":"110. 韩愈的《马说》中描写干里马终身遭遇的句子是：","ans":"祗辱于奴隶人之手，骈死于槽枥之间","img":"../public/question-crops/poetry-memory/poetry-memory-context-110.webp","aimg":"","src":"../public/source/poetry-memory/page-11.jpg","ph":false,"jx":"《马说》韩愈。题干问“描写千里马终身遭遇”，即“祗辱于奴隶人之手，骈死于槽枥之间”——“骈死”指并列而死。"},{"s":"古诗文默写","sid":"poetry-memory","n":111,"id":"poetry-memory-context-111","tag":"理解性默写","t":"自评题","stem":"111. 韩愈的《马说》中写千里马被埋没的直接原因是：","ans":"食马者不知其能千里而食也","img":"../public/question-crops/poetry-memory/poetry-memory-context-111.webp","aimg":"","src":"../public/source/poetry-memory/page-11.jpg","ph":false,"jx":"《马说》韩愈。题干问“千里马被埋没的直接原因”，即“食马者不知其能千里而食也”——喂马人不按千里马的需要饲养。"},{"s":"古诗文默写","sid":"poetry-memory","n":112,"id":"poetry-memory-context-112","tag":"理解性默写","t":"自评题","stem":"112.韩愈的《马说》中写人才被埋没的根本原因是：伯乐不常有；主旨是：","ans":"其真无马邪？其真不知马也","img":"../public/question-crops/poetry-memory/poetry-memory-context-112.webp","aimg":"","src":"../public/source/poetry-memory/page-11.jpg","ph":false,"jx":"《马说》韩愈。题干问“人才被埋没的根本原因”，前有“千里马常有，而伯乐不常有”，全文主旨句为反诘后的结论“其真无马邪？其真不知马也”。"},{"s":"古诗文默写","sid":"poetry-memory","n":113,"id":"poetry-memory-context-113","tag":"理解性默写","t":"自评题","stem":"113.《论语》中，孔子认为有两句话可以拿来作为终生遵守的准则是：","ans":"己所不欲，勿施于人","img":"../public/question-crops/poetry-memory/poetry-memory-context-113.webp","aimg":"","src":"../public/source/poetry-memory/page-11.jpg","ph":false,"jx":"《论语》十二章（春秋）。题干问“可以终身奉行的准则”，即子贡问时孔子所答“己所不欲，勿施于人”。"},{"s":"古诗文默写","sid":"poetry-memory","n":114,"id":"poetry-memory-context-114","tag":"理解性默写","t":"自评题","stem":"114.《论语》中主张君子应成人之美，成为君子是儒家的做人目标，那么，孔子认为君子的标准是：","ans":"君子成人之美，不成人之恶","img":"../public/question-crops/poetry-memory/poetry-memory-context-114.webp","aimg":"","src":"../public/source/poetry-memory/page-11.jpg","ph":false,"jx":"《论语》十二章。题干问“君子成人之美”，即“君子成人之美，不成人之恶”——与“小人反是”对照。"},{"s":"古诗文默写","sid":"poetry-memory","n":115,"id":"poetry-memory-context-115","tag":"理解性默写","t":"自评题","stem":"115.《论语》中对待别人的事情，对待先进与落后的正确态度是：","ans":"见贤思齐焉，见不贤而内自省也","img":"../public/question-crops/poetry-memory/poetry-memory-context-115.webp","aimg":"","src":"../public/source/poetry-memory/page-11.jpg","ph":false,"jx":"《论语》十二章。题干问“对待先进与落后的正确态度”，即“见贤思齐焉，见不贤而内自省也”——见人善恶皆反求诸己。"},{"s":"古诗文默写","sid":"poetry-memory","n":116,"id":"poetry-memory-context-116","tag":"理解性默写","t":"自评题","stem":"116.《论语》中孔子认为言与行的关系是：","ans":"先行其言而后从之","img":"../public/question-crops/poetry-memory/poetry-memory-context-116.webp","aimg":"","src":"../public/source/poetry-memory/page-11.jpg","ph":false,"jx":"《论语》十二章。题干问“言与行的关系”，即“先行其言而后从之”——先做后说，是孔子对“敏于事而慎于言”的具体化。"},{"s":"古诗文默写","sid":"poetry-memory","n":117,"id":"poetry-memory-context-117","tag":"理解性默写","t":"自评题","stem":"117.《论语》中与“君子爱才，取之有道”意思相近的句子是：","ans":"富与贵，是人之所欲也；不以其道得之，不处也","img":"../public/question-crops/poetry-memory/poetry-memory-context-117.webp","aimg":"","src":"../public/source/poetry-memory/page-11.jpg","ph":false,"jx":"《论语》十二章。题干以“君子爱财，取之有道”作比，对应“富与贵，是人之所欲也；不以其道得之，不处也”——不以其道则不接受。"},{"s":"古诗文默写","sid":"poetry-memory","n":118,"id":"poetry-memory-context-118","tag":"理解性默写","t":"自评题","stem":"118.《论语》中曾子所说人必须有坚强的意志和远大的抱负的句子是：","ans":"士不可以不弘毅，任重而道远","img":"../public/question-crops/poetry-memory/poetry-memory-context-118.webp","aimg":"","src":"../public/source/poetry-memory/page-11.jpg","ph":false,"jx":"《论语》十二章。题干问“曾子所说人必须有坚强意志和远大抱负”，即“士不可以不弘毅，任重而道远”——“弘”是宽广，“毅”是刚强。"},{"s":"古诗文默写","sid":"poetry-memory","n":119,"id":"poetry-memory-context-119","tag":"理解性默写","t":"自评题","stem":"119． 周敦颐在《爱莲说》中，以“\n’两句写出了站艹\n污、洁身自好的精神品质。","ans":"出淤泥而不染，濯清涟而不妖","img":"../public/question-crops/poetry-memory/poetry-memory-context-119.webp","aimg":"","src":"../public/source/poetry-memory/page-11.jpg","ph":false,"jx":"《爱莲说》周敦颐（北宋）。题干问“出淤泥、洁身自好的精神品质”，即“出淤泥而不染，濯清涟而不妖”——前者写不同流，后者写不媚俗。"},{"s":"古诗文默写","sid":"poetry-memory","n":120,"id":"poetry-memory-context-120","tag":"理解性默写","t":"自评题","stem":"120.《送东阳马生序》中，作者说自己穿着破旧衣服，与衣着华丽的同学在一起\n是：","ans":"余则缊袍敝衣处其间，略无慕艳意","img":"../public/question-crops/poetry-memory/poetry-memory-context-120.webp","aimg":"","src":"../public/source/poetry-memory/page-11.jpg","ph":false,"jx":"《送东阳马生序》宋濂（明）。题干问“自己穿破衣与衣着华丽同学相处”的句子，即“余则缊袍敝衣处其间，略无慕艳意”——“略无”是一点也没有。"},{"s":"古诗词比较阅读","sid":"gushi-compare","n":1,"id":"gushi-compare-1","tag":"","t":"选择题","stem":"请完成原资料第 1 题。识别文字不完整，建议点击“查看原题页”对照作答。","ans":"A","img":"../public/question-crops/gushi-compare/gushi-compare-1.webp","aimg":"","src":"../public/source/gushi-compare/page-01.jpg","ph":true,"jx":""},{"s":"古诗词比较阅读","sid":"gushi-compare","n":2,"id":"gushi-compare-2","tag":"","t":"选择题","stem":"请完成原资料第 2 题。识别文字不完整，建议点击“查看原题页”对照作答。","ans":"C","img":"../public/question-crops/gushi-compare/gushi-compare-2.webp","aimg":"","src":"../public/source/gushi-compare/page-01.jpg","ph":true,"jx":""},{"s":"古诗词比较阅读","sid":"gushi-compare","n":3,"id":"gushi-compare-3","tag":"","t":"选择题","stem":"请完成原资料第 3 题。识别文字不完整，建议点击“查看原题页”对照作答。","ans":"B","img":"../public/question-crops/gushi-compare/gushi-compare-3.webp","aimg":"","src":".. 清泉注入观众的内心。\n①不得不说，现代观众对文化的需求更加迫切\n②不仅在于其用流行音乐包装了古典诗词\n③源于古诗词中穿越时空的精神传承\n④更是源于古诗词本身的深厚内涵\nA. ③④②①\nB. ②③④①\nC. ②④③①\nD. ③①②④","ans":"C","img":"../public/question-crops/sentence-order/sentence-order-1.webp","aimg":"","src":"../public/source/sentence-order/page-01.jpg","ph":false,"jx":""},{"s":"句子排序与衔接","sid":"sentence-order","n":2,"id":"sentence-order-2","tag":"","t":"选择题","stem":"2.依次填入横线上的句子，街接最恰当的一项是\n中国自古以来就有重视家风家训的传统。通过家风家训建设改善村风民风，我市在这方面做了很\n多探索。我们深有感触的是，家风家训的确立要切合实际，\n，要做好打持久战的\n思想准备。\nA.要大力宣传本地优秀的家风家训 也要借鉴外地经验\nB. 要大力宣传本地优秀的家风家训 也要做好经验总结\nC.避免干篇一律，流于形式 还要认识到社会风气的改变不可能一蹴而就\nD. 避免说一套，做一套 还要认识到社会风气的改变是一个润物细无声的过程","ans":"C","img":"../public/question-crops/sentence-order/sentence-order-2.webp","aimg":"","src":"../public/source/sentence-order/page-01.jpg","ph":false,"jx":""},{"s":"句子排序与衔接","sid":"sentence-order","n":3,"id":"sentence-order-3","tag":"","t":"选择题","stem":"3.选出下列句子顺序排列正确的一项\n①当然，有的书是有缺点的，我们要善于选择\n②所以，如果你勤读书，该好书，就一定能真正体会到读书的乐趣\n③确实，书是人类最好的朋友、老师\n④书还是人类获得知识的重要途径\n⑤ “开卷有益”是说打开书就一定有收获\nA. ⑤③④①②\nB. ④③①②⑤\nC. ③②⑤①④\nD. ⑤④①③②","ans":"A","img":"../public/question-crops/sentence-order/sentence-order-3.webp","aimg":"","src":"../public/source/sentence-order/page-01.jpg","ph":false,"jx":""},{"s":"句子排序与衔接","sid":"sentence-order","n":4,"id":"sentence-order-4","tag":"","t":"选择题","stem":"4. 下列依次填入文段横线处的句子，最恰当的一项是\n阅读给予人的馈赠与都助可谓无穷，它是一种最好的心灵涵养方式。阅读可得良师益友，\n_；阅读让人心生安宁，_；阅读亦能怡情养颜，_\n①黄庭坚说三日不读书，“对镜觉面目可憎”，多年沉淀积累，琢颜如玉\n②李涉语：“偷得浮生半日闲。”静坐一隅捧卷而读，内心澄澈\n③于谦有诗：“书卷多情似故人。”穿越时空倾情交流，酣畅淋漓\nA. ①②③\nB. ②①③\nC. ③①②\nD. ③②①","ans":"D","img":"../public/question-crops/sentence-order/sentence-order-4.webp","aimg":"","src":"../public/source/sentence-order/page-01.jpg","ph":false,"jx":""},{"s":"句子排序与衔接","sid":"sentence-order","n":5,"id":"sentence-order-5","tag":"","t":"选择题","stem":"5．将下列句子组成一段话，排序最恰当的一项是\n①笑是一种最为简单而有效的健身运动。\n②腹肌在大笑中强烈地收缩和震荡，不仅有助于把血液挤入胸腔静脉，改善心肌供血，而且对胃、肠等\n脏器也是一种极好的按摩。\n③开怀大笑时，随着呼吸肌群的运动，胸腔和支气管先后扩张，增强了换气量和血氧饱和度，有助于心\n脏供氧。\n\n④一张一弛之间，劳累的肌肉在运动中得以放松。\n⑤大笑伴随着腹部肌群的起伏，又是一种极好的腹肌运动。\nA. ①③⑤②④\nB. ③④⑤①②\n¢. ③①⑤④②\nD. ①③⑤④②","ans":"A","img":"../public/question-crops/sentence-order/sentence-order-5.webp","aimg":"","src":"../public/source/sentence-order/page-01.jpg","ph":false,"jx":""},{"s":"句子排序与衔接","sid":"sentence-order","n":6,"id":"sentence-order-6","tag":"","t":"选择题","stem":"6.下列句子顺序排列正确的一项是\n①那时已经是深秋，露水很大，雾也很大，父亲浮在雾里。\n②黄泥是用来砌缝的，这种黏性很强的黄泥掺上一些石灰水、豆浆水，砌出的缝铁老鼠也钻不开。\n③我起来时，父亲已在新屋门口踏黄泥。\n④那天早上父亲天没亮就起了床，我听着父亲的脚步声很轻地响进院子里去。\n⑤晃破了便滚到额头上，额头上一会儿就滚满了黄豆大的露珠。\n⑥父亲头发上像是飘了一层细兩，每一根细发都艰难地挑着一颗乃至数颗小水珠，随着父亲踏黄泥的节\n奏一起一伏。\nA. ①③②④⑥⑤\nB. ①④③②⑥⑤\n④①③②⑥⑤\nD. ④③②①⑥⑤","ans":"D","img":"../public/question-crops/sentence-order/sentence-order-6.webp","aimg":"","src":"../public/source/sentence-order/page-02.jpg","ph":false,"jx":""},{"s":"句子排序与衔接","sid":"sentence-order","n":7,"id":"sentence-order-7","tag":"","t":"选择题","stem":"7. 依次填入空缺处的句子最恰当的一项是\n白日里浑然一片的泉鸣，此时却能分出许多层次：那柔曼如提琴者，\n那清脆如弹拨者，\n_；那厚重如贝斯轰响者，_；那雄浑如铜管 齐鸣者，二\n①应为万道细流汇于空谷 ②是草丛中淌过的小溪 ③定是激流直下陡壁，飞瀑落下深潭 ④是石缝间\n漏下的滴泉\nA. ①②④③\nB. ②④①③\nC. ②④③①\nD. ④②①③","ans":"B","img":"../public/question-crops/sentence-order/sentence-order-7.webp","aimg":"","src":"../public/source/sentence-order/page-02.jpg","ph":false,"jx":""},{"s":"句子排序与衔接","sid":"sentence-order","n":8,"id":"sentence-order-8","tag":"","t":"选择题","stem":"8.下列选项中，与上下文街接最恰当的一项是\n打造粤港澳大湾区，要有追赶思维，更要有探索精神，以往我们强调追赶思维，为了追赶别人定下\n的目标，努力向前。但是_\n_，因为你会对前方的路一无所知；而探索精神可以让我们\n看清前方的路，找到经济发展的突破口，实现突围。\nA.如果没有追赶思维，就有可能落后\nB.如果只有追赶思维，就不可能领先\nC.只要拥有追赶思锥，就不可能落后\nD. 只要没有追赶思维，就有可能领先","ans":"B","img":"../public/question-crops/sentence-order/sentence-order-8.webp","aimg":"","src":"../public/source/sentence-order/page-02.jpg","ph":false,"jx":""},{"s":"句子排序与衔接","sid":"sentence-order","n":9,"id":"sentence-order-9","tag":"","t":"选择题","stem":"9. 填入文段横线上的句子，衔接最恰当的一项是\n在韩国废除汉字几十年后的今天，韩国、日本等国又对汉字“敬为上宾〞，毕竞汉宇在语言表现\n力、思考能力上的“深思熟虑”高于韩文、日文，汉字的兴盛_①_。\n复旦大学邵毅平认为，汉字的命运不是由汉字本身决定的，而是由国家力量强弱决定的。“现在\n越来越多的人学习汉语或者复兴汉字，根本原因还是 ②。”\n2.①不能只看其经济利益，更应注重发扬其精神文化 ②汉字博大精深\nB.①不能只发扬其精神文化，更应注重其经济利益 ②中国强大了\nC.①不能只看其经济利益，更应注重发扬其精神文化 ②中国强大了\nD.①不能只发扬其精神文化，更应注重其经济利益 ②汉字博大精深","ans":"C","img":"../public/question-crops/sentence-order/sentence-order-9.webp","aimg":"","src":"../public/source/sentence-order/page-02.jpg","ph":false,"jx":""},{"s":"句子排序与衔接","sid":"sentence-order","n":10,"id":"sentence-order-10","tag":"","t":"选择题","stem":"10.“可以肯定地说，读‘无字书’比读纸本书、电子书更艰难”一句放人下面文段最恰当的一处是\n①精读、略读、快读三种读法可以交错地用于纸本书、电子书、“无字书”这三种书。②并不\n是纸本阅读都是“深阅读〞，没有浅阁读；也不是网上阅读都是“浅阅读”，没有深阁读；更不是说\n“无字书”皆为游山玩水，浮光掠影，没有学问。③老子和孔子观水就读出了许多名堂。④老子的\n“上善若水〞论，从水的七种善性悟出了人的七种德性。⑤孔子的“水的德性”论，从水的品性悟\n出了人的十种德性。\nA. ①-②之间\nB. ②—③之间\nC. ③-④之间\nD. ④—⑤之闻\n85","ans":"B","img":"../public/question-crops/sentence-order/sentence-order-10.webp","aimg":"","src":"../public/source/sentence-order/page-02.jpg","ph":false,"jx":""},{"s":"句子排序与衔接","sid":"sentence-order","n":11,"id":"sentence-order-11","tag":"","t":"选择题","stem":"请完成原资料第 11 题。识别文字不完整，建议点击“查看原题页”对照作答。","ans":"A","img":"../public/question-crops/sentence-order/sentence-order-11.webp","aimg":"","src":"../public/source/sentence-order/page-02.jpg","ph":true,"jx":""},{"s":"句子排序与衔接","sid":"sentence-order","n":12,"id":"sentence-order-12","tag":"","t":"选择题","stem":"请完成原资料第 12 题。识别文字不完整，建议点击“查看原题页”对照作答。","ans":"B","img":"../public/question-crops/sentence-order/sentence-order-12.webp","aimg":"","src":"../public/source/sentence-order/page-03.jpg","ph":true,"jx":""},{"s":"句子排序与衔接","sid":"sentence-order","n":13,"id":"sentence-order-13","tag":"","t":"选择题","stem":"请完成原资料第 13 题。识别文字不完整，建议点击“查看原题页”对照作答。","ans":"A","img":"../public/question-crops/sentence-order/sentence-order-13.webp","aimg":"","src":"../public/source/sentence-order/page-03.jpg","ph":true,"jx":""},{"s":"句子排序与衔接","sid":"sentence-order","n":14,"id":"sentence-order-14","tag":"","t":"选择题","stem":"14. 将①-⑤句连缀成语意连贯的一段话，排序正确的一项是 （　）\n①像文韬武略的辛奔医沦为田舍菜翁，把一腔孤愤化为词间沟壑，青史留名。\n②苦而不言不是什么亏都吃下去，而是少抱怨，因为所有的苦难还得自己去解决。\n③喜而不语是不炫耀，不能为了自己高兴而让别人不快乐。\n④苦而不言，喜而不语，是一种人生智慧。\n⑤像炎樱常在经济困难的好友张爱玲面前大谈投资理财，最后两人感情淡漠。\nA. ②⑤③①④\nB. ④②①③⑤\n€. ⑤①④②③\nD. ②④③⑤①","ans":"B","img":"../public/question-crops/sentence-order/sentence-order-14.webp","aimg":"","src":"../public/source/sentence-order/page-03.jpg","ph":false,"jx":""},{"s":"句子排序与衔接","sid":"sentence-order","n":15,"id":"sentence-order-15","tag":"","t":"选择题","stem":"15．下列句子顺序排列最恰当的一项是 （　）\n①人们在生活中的时间和精力都是有限的，过重的负荷会让人疲魚不堪。\n②只有御下自己身上过重的负担，将压力释放，才能享受生活中的诗意。\n③在美妙的意境中，人们不仅能感受到艺术的美，而且能感悟到人生的哲理。\n④在喧關匆忙的世界里，我们也需要凡事留有余地，需要给生活留白。\n⑤中国画中常常留出大大小小的、各式各样的空白，显示出丰富而美妙的意境。\n⑥留自，是中国画的一种布局。它既是一种艺术的美，又是一种人生的智慧。\n③⑤④①②⑥\nB. ④⑤③①②⑥\nC. ⑥⑤③④②①\nD","ans":"D","img":"../public/question-crops/sentence-order/sentence-order-15.webp","aimg":"","src":"../public/source/sentence-order/page-03.jpg","ph":false,"jx":""},{"s":"句子排序与衔接","sid":"sentence-order","n":16,"id":"sentence-order-16","tag":"","t":"选择题","stem":"16.下列语段空白处填入四个句子，顺序最恰当的一项是\n国无德不兴，人无德不立，在传承千年的中国传统文化中，\n_，更要立志报效祖国。\n①还是“修身、齐家、治国、平天下〞的人生追求\n②无论是“天下兴亡，匹夫有责”的家国大义\n③修身立德强调的从来不只是在私人领域做到“独善其身”\n④抑或是“已所不欲，勿施于人”的推己及人\nA. ②①③④\nB. ②①④③\nC. ③②①④\nD. ③④①②","ans":"B","img":"../public/question-crops/sentence-order/sentence-order-16.webp","aimg":"","src":"../public/source/sentence-order/page-04.jpg","ph":false,"jx":""},{"s":"句子排序与衔接","sid":"sentence-order","n":17,"id":"sentence-order-17","tag":"","t":"选择题","stem":"17. 将下列句子组成语段，顺序排列正确的一项是 （　）\n①凡是普通的花草树木，随便地种在盆子里的，例如菊、月季、杜鹃等，只能称为盆植。\n②如果是盆栽，那就要树干苍老，枝条经过整理，形成了美的姿态，方才合格。\n③一般人对于种在盆子里的花草树木，统称为盆景，其实是有分别的。\n④此外还有水石，以石为主体，或横峰，或竖峰，用水盘盛了水来供着，也要点缀几件小玩意。\n⑤至于盆景，那么除了将树木作为主体外，还要配以拳石或石笋，和屋、亭、桥、船、塔与人物等。\nA. ①⑤②③④\nB. ①⑤③②④\n¢. ③②⑤④①\nD. ③①②⑤④","ans":"D","img":"../public/question-crops/sentence-order/sentence-order-17.webp","aimg":"","src":"../public/source/sentence-order/page-04.jpg","ph":false,"jx":""},{"s":"句子排序与衔接","sid":"sentence-order","n":18,"id":"sentence-order-18","tag":"","t":"选择题","stem":"请完成原资料第 18 题。识别文字不完整，建议点击“查看原题页”对照作答。","ans":"B","img":"../public/question-crops/sentence-order/sentence-order-18.webp","aimg":"","src":"../public/source/sentence-order/page-04.jpg","ph":true,"jx":""},{"s":"句子排序与衔接","sid":"sentence-order","n":19,"id":"sentence-order-19","tag":"","t":"选择题","stem":"请完成原资料第 19 题。识别文字不完整，建议点击“查看原题页”对照作答。","ans":"C","img":"../public/question-crops/sentence-order/sentence-order-19.webp","aimg":"","src":"../public/source/sentence-order/page-04.jpg","ph":true,"jx":""},{"s":"句子排序与衔接","sid":"sentence-order","n":20,"id":"sentence-order-20","tag":"","t":"选择题","stem":"20.依次填入下面一段文字横线处的语句，街接最恰当的一项是\n我们一直在选择，谨慎地选择。选择博爱，_\n；选择回忆，\n选择诚信，\n_；选择坚强，二；选择关爱，我们因几颗心同时跳动而愉悦不已•••\n①我们品味异样精彩的人生 ②我们感受苦尽甘来的喜悦 ③我们度量往事的厚重 ④我们畅享生命\n的真真切切\nA. ②①③④\nB. ③①②④\n€. ②③①④\nD. ①③④②","ans":"D","img":"../public/question-crops/sentence-order/sentence-order-20.webp","aimg":"","src":"../public/source/sentence-order/page-04.jpg","ph":false,"jx":""},{"s":"句子排序与衔接","sid":"sentence-order","n":21,"id":"sentence-order-21","tag":"","t":"选择题","stem":"21. 依次填入下面一段文字横线处的语句，衔接最恰当的一项是\n清明时节，天气晴朗。\n。正在凝望之间，一朵自云冉冉而来，钻进了我们的房间里。\n①处处岗峦起伏，白云出没 ②有时一片白云忽然飘散，变成了许多楼台\n\n③凭窗远眺，但见近处古木参天，绿荫薇日 ④有时一带树林忽然不见，变成了一片云海\nA. ①④③②\nB. ③②①④\nC. ②③①④\nD. ③①④②","ans":"D","img":"../public/question-crops/sentence-order/sentence-order-21.webp","aimg":"","src":"../public/source/sentence-order/page-04.jpg","ph":false,"jx":""},{"s":"句子排序与衔接","sid":"sentence-order","n":22,"id":"sentence-order-22","tag":"","t":"选择题","stem":"22. 依次填入下面一段文字横线处的语句，街接最恰当的一项是\n信息时代给人们带来了一种新的极其便捷的阅读方式，那就是网络阅读。网络阅读远远超越了传\n统的阅读概念，_\n__。因此，阅读的趣味性大大提高，吸引力更强，影响力更大。\n①能够对文字、图片、影像、声音等信息形态进行有机的合成 ②能够更好地满足人们沟通交流的需\n求 ③与传统阅读相比，信息更加全面，视野更加开問，也更直观、更逼真 ④提供读、看、听三方面\n的内容 ⑤它改变了单一的文字或静态的图像的表现形式 ⑥还具有共享性、开放性和互动性\nA. ③②⑤④①⑥\nB. ③⑥⑤①②④\nC. ⑤①④③⑥②\nD. ⑤④③②①⑥","ans":"C","img":"../public/question-crops/sentence-order/sentence-order-22.webp","aimg":"","src":"../public/source/sentence-order/page-05.jpg","ph":false,"jx":""},{"s":"句子排序与衔接","sid":"sentence-order","n":23,"id":"sentence-order-23","tag":"","t":"选择题","stem":"23. 依次填入下面一段文字横线处的语句，街接最恰当的一项是\n汉字承载了中华民族的文明和智慧。\n①且这种现象越来越低龄化。\n②但是互联网时代，汉字却陷人有声无形的窘境。\n③现在越来越多的人出现提笔忘字的现象。\n④专家学者认为：汉字对智力的开发有巨大作用；认识的汉字越多，联想就越丰富。\n⑤其兼备象形和表意的特点及蕴含的思想和文化内涵是任何科技也无法模拟和取代的。\nA. ③①⑤④② B. ⑤④②③①\n¢. ⑤①②③④\nD. ②①④③⑤","ans":"B","img":"../public/question-crops/sentence-order/sentence-order-23.webp","aimg":"","src":"../public/source/sentence-order/page-05.jpg","ph":false,"jx":""},{"s":"句子排序与衔接","sid":"sentence-order","n":24,"id":"sentence-order-24","tag":"","t":"选择题","stem":"24. 依次填入下面一段文字横线处的语向，衔接最恰当的一项是\n语文学习，就是一段精彩的旅行。\n①这些美味大餐中，我们感受生活的酸甜苦辣，体味人生的干姿百态。\n②你将与安东尼奥交流，领悟戏剧中的人生，人生中的戏剧。\n③你将与孔乙己对话，体味生命的本质，引|发对人生的思考。\n④所以，爱语文，就是爱生活，爱人生！\n⑤一篇篇文质优美的课文，是一道道视觉美味，也是一道道精神大餐。\n⑥在旅行中，你将走进小说天地，登上戏剧舞台。\nA. ⑤①④⑥②③ B. ⑥⑤①③②④\nC. ⑥③②⑤①④\nD. ⑤①⑥③②④","ans":"B","img":"../public/question-crops/sentence-order/sentence-order-24.webp","aimg":"","src":"../public/source/sentence-order/page-05.jpg","ph":false,"jx":""},{"s":"句子排序与衔接","sid":"sentence-order","n":25,"id":"sentence-order-25","tag":"","t":"选择题","stem":"25.依次填入下面一段文字横线处的语向，街接最恰当的一项是\n到了三四月份，生长在高原上的紫花地丁也会自在绽放，三朵两朵地挨在一起，看上去，\n①)_。花瓣左右对称，向外弯曲，_②_。柴花地丁紫得清新淡雅，_③_。它虽最微小但并不\n自惭形秒，反而更追求精致，活出精彩。\nA.①好像在说悄悄话的小姑娘 ②像水墨画中的一缕青烟 ③是扎在姑娘头上的马尾辫\nB. ①是扎在姑娘头上的马尾辫②好像在说悄悄话的小姑娘 ③像水墨画中的一缕青烟\nC.①好像在说悄悄话的小姑娘 ②是扎在姑娘头上的马尾辫 ③像水墨画中的一缕青烟\nD. ①像水墨画中的一缕青烟 ②是扎在姑娘头上的马尾辫 ③好像在说悄悄话的小姑娘","ans":"C","img":"../public/question-crops/sentence-order/sentence-order-25.webp","aimg":"","src":"../public/source/sentence-order/page-05.jpg","ph":false,"jx":""},{"s":"句子排序与衔接","sid":"sentence-order","n":26,"id":"sentence-order-26","tag":"","t":"选择题","stem":"26. 依次填入下面一段文字横线处的语向，街接最恰当的一项是\n当时问变得越发昂贵，消磨时间、降低速度的“闲”越发奢侈。久远年代的诗词里，“海鸡无\n事，闲飞闲宿”，\n__；“有约不来过夜半，闲敲棋子落灯花”，__；“人闲桂花落，夜\n游春山空”，_。生活的忙碌让我们怎能不怀想“闲”的飘逸。\n一①是何等馨香又空灵的意境 ②是何等悠远又自在的心緒 ③是何等寂寞又淡然的雅趣\n②③①\nB. ③①②\n€. ②①③\nD. ①③②","ans":"A","img":"../public/question-crops/sentence-order/sentence-order-26.webp","aimg":"","src":"../public/source/sentence-order/page-05.jpg","ph":false,"jx":""},{"s":"句子排序与衔接","sid":"sentence-order","n":27,"id":"sentence-order-27","tag":"","t":"选择题","stem":"27. 给下列句子排序，最恰当的一项是 （　）\n①如果能做到这些，你一定会成为一个富有创造力的人。\n②任何人都拥有创造力，首先要坚信这一点。\n③一且产生小的灵感，相信它的价值，并锲而不舍地把它发展下去。\n④不满足于一个答案，而去探求新思路，去运用所得的知识。\n⑤关键是要经常保持好奇心，不断积累知识。\nA. ①③④⑤②\nB. ⑤④①②③\nC. ②⑤④③①\nD. ③②⑤④①","ans":"C","img":"../public/question-crops/sentence-order/sentence-order-27.webp","aimg":"","src":"../public/source/sentence-order/page-06.jpg","ph":false,"jx":""},{"s":"句子排序与衔接","sid":"sentence-order","n":28,"id":"sentence-order-28","tag":"","t":"选择题","stem":"28.把下列句子组合成语意连贯的一段话，语序排列正确的一项是 （　）\n①它主要承担长征五号火箭、长征七号火箭的发射任务。\n②文昌卫星发射中心的建设也给海南国际旅游岛带来了新的发展机遇。\n③文昌卫星发射中心是我国四大卫星发射中心之一，位于海南省文昌市。\n④它的建成填补了我国低纬度发射的市场空白，为参与国际商业航天发射市场的竞争开拓了广阔的\n空间。\nA. ③①④②\nB. ①②④③\n③④①②\nD. ①②③④","ans":"A","img":"../public/question-crops/sentence-order/sentence-order-28.webp","aimg":"","src":"../public/source/sentence-order/page-06.jpg","ph":false,"jx":""},{"s":"句子排序与衔接","sid":"sentence-order","n":29,"id":"sentence-order-29","tag":"","t":"选择题","stem":"29. 下面语句的顺序排列恰当的一项是 （　）\n①另外，通常的看法是，右者为尊，因此道受贬谪称为“左迁”。而在位次的排序上，地位次尊的人\n则居于最尊者的右边。\n②在举行朝会的时候，则是背北面南为尊，故称帝叫作“南面”，而为臣则叫作“北面”\n③古时座次有着严格的尊卑之分。\n④在筵席上，最尊的座次是坐西朝东，其次是坐北朝南，再次是坐南朝北，最卑是坐东朝西。\nA. ②③④①\nB. ③④②①\nC. ③①②④\nD. ④②①③","ans":"B","img":"../public/question-crops/sentence-order/sentence-order-29.webp","aimg":"","src":"../public/source/sentence-order/page-06.jpg","ph":false,"jx":""},{"s":"句子排序与衔接","sid":"sentence-order","n":30,"id":"sentence-order-30","tag":"","t":"选择题","stem":"30.下列句子排序最恰当的一项是 （　）\n①但在有些病人身上表现不典型，通常和普通感冒症状类似，只是在程度上稍重。\n②但季节性和传染性较强，一定要引起注意。\n③流感是由流感病毒引|起的，特点是具有流行性。\n④尽管这些流行性感冒的主要症状与普通感冒相似。\n⑤流行性感冒多发于冬春季节，大面积群体出现。\n⑥流感的症状在有些病人身上表现比较典型，一发病即可能出现高烧，常达38.5°c以上，并伴有寒\n战、肌肉酸痛、头痛、咽痛、全身乏力等症状。\nA. ③④②⑥①⑤ B. ③⑤⑥①④②\nC. ⑤④①⑥②③\n⑤③⑥②④①","ans":"B","img":"../public/question-crops/sentence-order/sentence-order-30.webp","aimg":"","src":"../public/source/sentence-order/page-06.jpg","ph":false,"jx":""},{"s":"句子排序与衔接","sid":"sentence-order","n":31,"id":"sentence-order-31","tag":"","t":"选择题","stem":"31. 下列句子排序恰当的一项是\n①我以为“过去未来皆是现在”的话倒有些道理。\n②故一时代的思潮，不是单纯在这个时代所能凭空成立的，不晓得有几多 “过去”时代的思潮，差不\n多可以说是由所有“过去〞时代的思潮凑合而成的。\n③有的哲学家说，时间只有“过去”与“未来”，并无“现在”。\n④因为“现在〞就是所有“过去”流人的世界，换句话说，所有“过去〞都埋没于“现在”的里边。\n⑤有的又说，“过去”“未来”皆是“现在”。\nA. ③⑤①④②\nB. ⑤①④②③\nC. ①④②③⑤\nD. ③⑤①②④","ans":"A","img":"../public/question-crops/sentence-order/sentence-order-31.webp","aimg":"","src":"../public/source/sentence-order/page-06.jpg","ph":false,"jx":""},{"s":"句子排序与衔接","sid":"sentence-order","n":32,"id":"sentence-order-32","tag":"","t":"选择题","stem":"32.将下面的句子组成一段连贯的话，排序合理的一项是\n①实际上，猪是很聪明的动物，“智商”远高于牛、羊等家畜。\n89\n②然而，事实并非如此。\n③例如，英国曾有一头小猪，在六个月大的时候，就具备了与人握手、从1数到8等技能。\n\n④人们常用笨得像猪形容某人很愚笨。\n⑤科学家还认为，猪与狗、黑猩猩、人类等高智商物种一样，具有认知能力。\nA. ④②①⑤③ B. ①②③⑤④\nC. ④①②③⑤\nD. ①②⑤③④","ans":"A","img":"../public/question-crops/sentence-order/sentence-order-32.webp","aimg":"","src":"../public/source/sentence-order/page-06.jpg","ph":false,"jx":""},{"s":"句子排序与衔接","sid":"sentence-order","n":33,"id":"sentence-order-33","tag":"","t":"选择题","stem":"请完成原资料第 33 题。识别文字不完整，建议点击“查看原题页”对照作答。","ans":"C","img":"../public/question-crops/sentence-order/sentence-order-33.webp","aimg":"","src":"../public/source/sentence-order/page-07.jpg","ph":true,"jx":""},{"s":"句子排序与衔接","sid":"sentence-order","n":34,"id":"sentence-order-34","tag":"","t":"选择题","stem":"请完成原资料第 34 题。识别文字不完整，建议点击“查看原题页”对照作答。","ans":"C","img":"../public/question-crops/sentence-order/sentence-order-34.webp","aimg":"","src":"../public/source/sentence-order/page-07.jpg","ph":true,"jx":""},{"s":"句子排序与衔接","sid":"sentence-order","n":35,"id":"sentence-order-35","tag":"","t":"选择题","stem":"35.依次填入文段横线处恰当的一组句子是\n文学是__，你尽可流动明眸，欣赏白云蓝天，飞流急湍；文学是__，你尽可闭目凝\n神，倾听莺歌燕舞，春水潺溽；文学是_\n_，你尽可翁动鼻翼，呼吸牡丹的浓香，黄菊的清爽；\n文学是__，你尽可品评自娱，把玩啜饮。\n①一座姹紫嫣红的百花园 ②一杯回味无穷的香茗 ③一幅意境高远的中国画 ④一首清脆园润的古曲\nA. ③④①②\nB. ①③④②\nC. ④③②①\nD. ②①③④","ans":"A","img":"../public/question-crops/sentence-order/sentence-order-35.webp","aimg":"","src":"../public/source/sentence-order/page-07.jpg","ph":false,"jx":""},{"s":"句子排序与衔接","sid":"sentence-order","n":36,"id":"sentence-order-36","tag":"","t":"选择题","stem":"36. 给下列句子排序，最合理的一项是\n①收获的季节，丰收的人家踏实地享受着秋日的馈赠。\n②春日的秧苗孕育着农人的希望。\n③而倦懒耕耘的人们则黯然神伤地敲打着生锈的犁耙。面对歉收，懊悔那些荒废的岁月。\n④看来，在拥有希望的同时，还要努力地付出汗水。\n⑤闲聊着春夏那些辛勤的细枝末节，唇齿开合间透着一种愜意。\nA. ②①⑤③④ B. ②③①⑤④\nC. ①③②⑤④\nD. ①⑤②③④","ans":"A","img":"../public/question-crops/sentence-order/sentence-order-36.webp","aimg":"","src":"../public/source/sentence-order/page-07.jpg","ph":false,"jx":""},{"s":"句子排序与衔接","sid":"sentence-order","n":37,"id":"sentence-order-37","tag":"","t":"选择题","stem":"37.给下列句子排序，最合理的一项是 （　）\n(①我们将坚持以人民为中心的发展思想，深入贯彻新的发展理念，建设现代化经济体系。\n②发展更高层次的开放型经济，深人推进“一带一路〞建设，推动形成全面开放的新格局。\n③十九大制定了新时代中国特色社会主义的行动纲领和发展蓝图。\n④全面深化改革，大力激发全社会的创造力，持续释放发展活力。\n⑤展望未来，中国发展动力更足、人民获得感更多、同世界互动更深，将为全球发展创造更多机遇，\n做出更大贡献。\nA. ③④②①⑤\nB. ①④②③⑤\nC. ①③④②⑤\nD. ③①④②⑤","ans":"D","img":"../public/question-crops/sentence-order/sentence-order-37.webp","aimg":"","src":"../public/source/sentence-order/page-07.jpg","ph":false,"jx":""},{"s":"句子排序与衔接","sid":"sentence-order","n":38,"id":"sentence-order-38","tag":"","t":"选择题","stem":"38.给下列句子排序，最合理的一项是\n①钱穆在《现代中国学术论衡》中称“西方人则于国之上并无一天下观，至今仍仅有一国际观”。\n②很早就意识到“以国为天下，天下不可为也”，要“以天下观天下”\n③可以说，今天中国人的天下观，富于优秀传统文化的滋养，自有其独特的视野与境界、气度与\n格局。\n④中国古人很早就涵养了天下观，观察的范围是整个世界，体察的对象是全人类。\nu漱溟所言：“中国人是富于世界观念的，狭隘的国家主义和民族主义在中国都没有，中国人对\n于世界向来是一视同仁。”\nA. ④②⑤①③\nB. ④①②③⑤\n①③④②⑤\nD. ⑤①③④②","ans":"A","img":"../public/question-crops/sentence-order/sentence-order-38.webp","aimg":"","src":"../public/source/sentence-order/page-07.jpg","ph":false,"jx":""},{"s":"句子排序与衔接","sid":"sentence-order","n":39,"id":"sentence-order-39","tag":"","t":"选择题","stem":"39. 给下列句子排序，最合理的一项是\n①过分草率地决定，可能会给今后的生活和工作带来不必要的麻烦，也会产生悔不当初的愧疚。\n②所以选择既要把握好时机，又要仔细慎重。\n③人生在世有很多的时候需要选择，但是选择是一个艰难的过程，何去何从常常会让我们犹豫不决。\n④除此之外，就是在决策的时候，不要一味地依赖别人的意见，他人并不知道你真实的处境，无法设\n身处地地从你的角度出发来选择。\n⑤过分地彷徨，可能会错失良机，让机会从面前溜走，造成“机不可失，时不再来”的感叹。\nA. ③①⑤②④\nB. ③⑤①②④\n¢. ①⑤③②④\nD. ③⑤①④②","ans":"D","img":"../public/question-crops/sentence-order/sentence-order-39.webp","aimg":"","src":"../public/source/sentence-order/page-08.jpg","ph":false,"jx":""},{"s":"句子排序与衔接","sid":"sentence-order","n":40,"id":"sentence-order-40","tag":"","t":"选择题","stem":"40.给下列句子排序，最合理的一项是\n①于是，隔夜食物是否会危害健康的疑问，逐渐困扰起都市人来。\n②现代营养专家认为，隔夜食物并不等于洪水猛兽，只要不是放置时间过长、食用频率过多，就无须\n谈之色变。\n③随着生活条件越来越好，人们对身体健康也越来越看重。\n④凉拌菜的卫生情况不好把控，冷藏更容易变质。\n⑤熟的河海鲜时间长了易产生蛋白质降解物，会损伤肝、肾功能，甚至会产生毒素。\n⑥不过需要说明的是，这不包括熟的河海鲜和凉拌菜。\nA. ②③①④⑤⑥ B. ②①⑥⑤④③\n. ③①②⑥⑤④\nD. ③①②⑥④⑤","ans":"C","img":"../public/question-crops/sentence-order/sentence-order-40.webp","aimg":"","src":"../public/source/sentence-order/page-08.jpg","ph":false,"jx":""},{"s":"句子排序与衔接","sid":"sentence-order","n":41,"id":"sentence-order-41","tag":"","t":"选择题","stem":"41. 给下列句子排序，最合理的一项是\n①这样，会读到不同的作者写类似主题时，他们对题材的切人和处理方法。\n②不管是小说、散文还是传记、评论，尽可能全部都读一遍。\n③我喜欢在一个时期内读同一个作者的各类作品。\n④这样的阅读可以清晰地了解这个作者的作品、创作过程和写作经验，对作者的生活轨迹和思想脉络\n也会有一个全面的掌握。\n⑤如果深人关注，对阅读和理解他们的作品非常有好处。\n⑥我还会把文化背景相同的作者的作品放在一起比较着读。\nA. ②①③④⑥⑤ B. ②⑤③④⑥①\nC. ③②④⑥①⑤\nD. ③⑥①②④⑤","ans":"C","img":"../public/question-crops/sentence-order/sentence-order-41.webp","aimg":"","src":"../public/source/sentence-order/page-08.jpg","ph":false,"jx":""},{"s":"句子排序与衔接","sid":"sentence-order","n":42,"id":"sentence-order-42","tag":"","t":"选择题","stem":"42．给下列句子排序，最合理的一项是\n、\n①浩荡图卷背后，隐藏着人物的锦绣才华和生命迷踪。\n②游移着媚上嫉贤、蠹食国运的佞臣禁京的才高品低的闪烁眼神•⋯\n③缥缈着“不会为君，什么都会”的宋徽宗对江山永固的一厢情愿。\n④我们不但从山重水复的缝隙张望到先人的背影。\n⑤还见证了中央美院的老师经年累月、耐住寂寞，一重重上色复制1/10 的《干里江山图》⋯•\n⑥目睹了非物质文化遗产国画颜料制作传人荒野寻石、陋室研磨，探索朱砂、石青、石绿等清丽五色\n“千年不腐”的秘诀。\n⑦电视片《国家宝藏》将你看不到的故事细细还原，一下子让国宝“活”了起来，“近”了起来。\nA. ⑦④⑥⑤①③② B. ⑦①③②④⑥⑤ €. ⑦①③④②⑤⑥\nD. ⑦④⑤⑥①②③","ans":"B","img":"../public/question-crops/sentence-order/sentence-order-42.webp","aimg":"","src":"../public/source/sentence-order/page-08.jpg","ph":false,"jx":""},{"s":"句子排序与衔接","sid":"sentence-order","n":43,"id":"sentence-order-43","tag":"","t":"选择题","stem":"43．在下面一段文字横线处填入语句，街接最恰当的一项是\n为什么在信息时代，仍有很多人钟情于传统通信方式？\n①人“自谦而敬人〞的做人原则在书信中表现为对自己的谦称和对别人的敬称。\n②比如称呼自己为“做人”，就是谦称；称呼别人为“阁下”，就是敬称。\n③专家认为，传统信件承载了太多的文化内涵，一封信就是一份沉甸甸的敬意。\n91\n④因此，纸质信是传统礼仪的集中体现。\nA. ①③②④\nB. ③①④②\n. ③②①④\nD. ③①②④","ans":"D","img":"../public/question-crops/sentence-order/sentence-order-43.webp","aimg":"","src":"../public/source/sentence-order/page-08.jpg","ph":false,"jx":""},{"s":"句子排序与衔接","sid":"sentence-order","n":44,"id":"sentence-order-44","tag
