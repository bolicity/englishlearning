":"","t":"选择题","stem":"44， 在下面一段文字横线处填入语句，街接最恰当的一项是\n古代使用筷子的习俗和礼节一直流传至今。\n①在握筷时，不可取位过高，这样容易被认为清高孤做，同时也有远离父母家门的嫌疑；也不可取位\n过低，这样会显得缺乏教养。\n②尤其被忌讳的一点是，切不可将筷子插在饭菜上，古俗认为只有在祭祀先人时才这样做，平时插筷\n则很不吉利。\n③在摆放位置上，人们总是把筷子整齐地放置于进餐者的右手边，筷子用于手执的一端要与桌面边缘\n垂直(如果是圆桌，摆放角度要与半径线重合），不要将筷子用于进食的一端朝泉外摆放，也不要将\n一双筷子一反一正并列摆放。\n④用餐完毕后，要将筷子轻轻放在桌上，不可随意放置。\n⑤筷子不要在桌上延伸过长，跨别人面前夹菜是不礼貌的。\n⑥在举筷夹菜时，不要游移不定，也不要旁若无人地乱找好菜。\nA. ③①②④⑤⑥ B. ③①⑥⑤④②\nC. ①⑥③②⑤④\nD. ①④⑤②③⑥","ans":"B","img":"../public/question-crops/sentence-order/sentence-order-44.webp","aimg":"","src":"../public/source/sentence-order/page-09.jpg","ph":false,"jx":""},{"s":"句子排序与衔接","sid":"sentence-order","n":45,"id":"sentence-order-45","tag":"","t":"选择题","stem":"45.在下面一段文字横线处填入语句，街接最恰当的一项是\n年轻的时候，读郑振铎先生译的泰戈尔的《新月集》，极其美菜书中那个稚气甚至近于傻气的小\n男孩。\n①思维和行为可亲、可爱、可信赖、可容忍\n②尤其像《孩童之道》《偷睡眠者》《同情》《恶邮差》等\n③他是一个真正的孩子\n④不仅表现了孩子思维的幼稚天真\n⑤让人看到了一个孩子真实的精神世界\n⑥更凸显了孩子幼小心灵的爱心和善意\nA. ③①②④⑥⑤\nB. ③①④⑤②⑥\n. ⑤②④⑥①③\nD. ⑤④⑥②①③","ans":"A","img":"../public/question-crops/sentence-order/sentence-order-45.webp","aimg":"","src":"../public/source/sentence-order/page-09.jpg","ph":false,"jx":""},{"s":"句子排序与衔接","sid":"sentence-order","n":46,"id":"sentence-order-46","tag":"","t":"选择题","stem":"46. 在下面一段文字横线处填入语句，街接最恰当的一项是\n唐代知识分子不囡于书斋生活，读书之外喜好游历天下。特别是盛唐时期，当时社会财富充足，\n国库般实，民生稳定，道路畅通，社会秩序良好。这为读书人的漫游提供了必要条件。\n①祖国的大好河山所吸引1②广泛地接触社会人生 ③广交天下诗友 ④寻求从政的道路\n⑤走出书斋 ⑥他们为昂扬的时代精神所鼓舞\nA. ①⑥④⑤②③ B. ⑥①⑤②③④\n€. ⑥③①⑤④②\nD. ⑥①⑤④③②","ans":"B","img":"../public/question-crops/sentence-order/sentence-order-46.webp","aimg":"","src":"../public/source/sentence-order/page-09.jpg","ph":false,"jx":""},{"s":"句子排序与衔接","sid":"sentence-order","n":47,"id":"sentence-order-47","tag":"","t":"选择题","stem":"请完成原资料第 47 题。识别文字不完整，建议点击“查看原题页”对照作答。","ans":"B","img":"../public/question-crops/sentence-order/sentence-order-47.webp","aimg":"","src":"../public/source/sentence-order/page-09.jpg","ph":true,"jx":""},{"s":"句子排序与衔接","sid":"sentence-order","n":48,"id":"sentence-order-48","tag":"","t":"选择题","stem":"请完成原资料第 48 题。识别文字不完整，建议点击“查看原题页”对照作答。","ans":"A","img":"../public/question-crops/sentence-order/sentence-order-48.webp","aimg":"","src":"../public/source/sentence-order/page-09.jpg","ph":true,"jx":""},{"s":"句子排序与衔接","sid":"sentence-order","n":49,"id":"sentence-order-49","tag":"","t":"选择题","stem":"49，下列语句的顺序排列正确的一项是\n①当爬上山顶时，发现自己是孤独的。\n②如果有人问我是否后悔，我会肯定地回答，不后悔。\n③山顶，除了梦想，也是荒芜的。\n④可是，当我们努力向上的时候，我们的同伴越来越少。\n⑤人生，如同爬山，一开始我们会有无数的同伴，为了同一个目标，同一个梦想而相聚在一起。\n⑥就像智者所言，自己不断地往上爬，追求着自己的梦想。\nA. ⑤⑥④①③② B. ⑤①③⑥④②\nC. ①③②⑤④⑥\nD. ③②⑤①④⑥","ans":"A","img":"../public/question-crops/sentence-order/sentence-order-49.webp","aimg":"","src":"../public/source/sentence-order/page-10.jpg","ph":false,"jx":""},{"s":"句子排序与衔接","sid":"sentence-order","n":50,"id":"sentence-order-50","tag":"","t":"选择题","stem":"50. 下列语句的顺序排列正确的一项是\n①那该是大自然在多长的时间里的杰作！\n②我们居住的这个星球在最古者时代原是一个寂寞的大石球，没有一层土壤。\n③想一想肥沃土地的来历，你会不由得涌起一种遥接万代的感情。\n④经过了多少亿万年，太阳风雨的力量，原始生物的尸骸，才给地球造成了一层层的土壤，每经历干\n年万年，土壞才增加薄薄的一层。\n⑤想一想我们那土壞厚达五十米的华北黄土高原吧！\nA. ⑤②③④①\nB. ③⑤①②④\nC. ③②④⑤①\nD. ⑤①③②④","ans":"C","img":"../public/question-crops/sentence-order/sentence-order-50.webp","aimg":"","src":"../public/source/sentence-order/page-10.jpg","ph":false,"jx":""},{"s":"句子排序与衔接","sid":"sentence-order","n":51,"id":"sentence-order-51","tag":"","t":"选择题","stem":"51.下列语句的顺序排列正确的一项是\n①在快乐中我们要感谢生命，在痛苦中我们也要感谢生命。\n②要记住：不是每一道港湾都能入海，不流动的便成了死湖。\n③生命中不是永远快乐，也不是永远痛苦，快乐和痛苦是相生相成的。\n④不是每一粒种子都能成树，不生长的便成了空壳。\n⑤好比水道要经过不同的两岸，树木要经过常变的四时。\nA. ②③④⑤①\nB. ③⑤①②④\nC. ②④③①⑤\nD. ②④③⑤①","ans":"D","img":"../public/question-crops/sentence-order/sentence-order-51.webp","aimg":"","src":"../public/source/sentence-order/page-10.jpg","ph":false,"jx":""},{"s":"句子排序与衔接","sid":"sentence-order","n":52,"id":"sentence-order-52","tag":"","t":"选择题","stem":"52. 下列语句的顺序排列正确的一项是\n①使用语言，不仅要用得对，在语法上不出毛病，而且要力求用得好，要有艺术性，有感染力。\n②如果语言不符合语法，说都说不通，就没有什么好的修辞可言。\n③语言是用来传递信息、交流思想、表达感情的。\n④这就要讲究运用语言的艺术，也就是要讲究一点修辞。\n⑤有意用不符合语法常规的办法取得某种修辞效果是许可的，然而这只是偶一为之，并且要有特定的\n条件。\n93\n⑥好的修辞，必然是符合语法规律的。\nA. ③②⑥①④⑤\nB. ③①④⑥②⑤\nC. ⑥⑤③①②④\nD. ⑥②③①⑤④","ans":"B","img":"../public/question-crops/sentence-order/sentence-order-52.webp","aimg":"","src":"../public/source/sentence-order/page-10.jpg","ph":false,"jx":""},{"s":"句子排序与衔接","sid":"sentence-order","n":53,"id":"sentence-order-53","tag":"","t":"选择题","stem":"请完成原资料第 53 题。识别文字不完整，建议点击“查看原题页”对照作答。","ans":"D","img":"../public/question-crops/sentence-order/sentence-order-53.webp","aimg":"","src":"../public/source/sentence-order/page-11.jpg","ph":true,"jx":""},{"s":"句子排序与衔接","sid":"sentence-order","n":54,"id":"sentence-order-54","tag":"","t":"选择题","stem":"请完成原资料第 54 题。识别文字不完整，建议点击“查看原题页”对照作答。","ans":"A","img":"../public/question-crops/sentence-order/sentence-order-54.webp","aimg":"","src":"../public/source/sentence-order/page-11.jpg","ph":true,"jx":""},{"s":"句子排序与衔接","sid":"sentence-order","n":55,"id":"sentence-order-55","tag":"","t":"选择题","stem":"55. 下列语句的顺序排列正确的一项是\n①如果我们用一颗有求的心面对所有事情，那么无疑是打开了一个烦恼的盒子。\n②我们总是找种种借口去发脾气，来表达自己的自私与狭隘。\n③我们的烦恼更多是来自于自己的自私和狭隘。\n④学会满足，学会放弃，烦恼就会远离我们。\n⑤生活里，我们往往不经意就被烦恼包围。\nA. ①②③④⑤ B. ①⑤④②③\nC. ⑤②④③①\nD. ⑤③②①④","ans":"D","img":"../public/question-crops/sentence-order/sentence-order-55.webp","aimg":"","src":"../public/source/sentence-order/page-11.jpg","ph":false,"jx":""},{"s":"句子排序与衔接","sid":"sentence-order","n":56,"id":"sentence-order-56","tag":"","t":"选择题","stem":"56.下列语句的顺序排列正确的一项是\n一\n①书总归是要读的。\n②读书更不应该盲目地追求数量，而应在质量上下功夫。\n③但万万不可为读书而读书，为装装门面而死读书。\n④殊不知，一本好书，真正读懂参透了，它会影响一个人的一生。\n⑤读书的过程应该是天地间一种很美妙的享受，如同欣赏音乐。\nA. ①④③⑤② B. ①③⑤②④\nC. ⑤②④③①\nD. ⑤①③④②","ans":"B","img":"../public/question-crops/sentence-order/sentence-order-56.webp","aimg":"","src":"../public/source/sentence-order/page-11.jpg","ph":false,"jx":""},{"s":"句子排序与衔接","sid":"sentence-order","n":57,"id":"sentence-order-57","tag":"","t":"选择题","stem":"57. 填写在横线上的语句顺序最恰当的一项是\n你的话语应该是一缕饱含早春气息的柔风，\n你的表白应该是田野爆裂的豆英，\n；你的辦答应该是凭借原则的盾牌，\n你的呐喊应该是仰仗正义的力量，\n①迎承谈判桌上的唇枪舌剑 ②构思并阐述金色的成熟 ③弥合朋友之间人为的小隙 ④澎湃青春的\n热忱和血液\nA. ③④①②\nB. ②①③④\n€. ③②①④\nD. ④①③②","ans":"C","img":"../public/question-crops/sentence-order/sentence-order-57.webp","aimg":"","src":"../public/source/sentence-order/page-11.jpg","ph":false,"jx":""},{"s":"句子排序与衔接","sid":"sentence-order","n":58,"id":"sentence-order-58","tag":"","t":"选择题","stem":"58. 填入下面横线处的语句，与上下文街接最恰当的一项是\n对于实现梦想而言，今天最重要。今天是你搬来的砖石，虽然不足道，\n；今天是你栽下\n的树苗，虽然不伟岸，__；今天是你写下的片段，虽然不完整，__\n请你珍惜今天，\n用今天的积淀成就明天的梦想！\n上A一却谱就了你明天的华章 却垫起了你明天的高度 却给予了你明天的阴凉\nB. 却给予了你明天的阴凉 却谱就了你明天的华章 却垫起了你明天的高度\n\nC.却垫起了你明天的高度 却给予了你明天的阴凉 却谱就了你明天的华章\nD. 却垫起了你明天的高度 却谱就了你明天的华章 却给予了你明天的阴凉","ans":"C","img":"../public/question-crops/sentence-order/sentence-order-58.webp","aimg":"","src":"../public/source/sentence-order/page-11.jpg","ph":false,"jx":""},{"s":"句子排序与衔接","sid":"sentence-order","n":59,"id":"sentence-order-59","tag":"","t":"选择题","stem":"59、 填写在横线上的语句顺序最恰当的一项是\n兰花和牡丹不同，兰花象征着隐逸的美，因为它常常生长于多荫的幽谷。\n_。为此，它便成为不与凡俗为伍的君子以及真友谊的象征。\n①可是当人们欣赏它的时候，这香是多么飘逸啊\n②据说它有“孤芳自赏”的美德，不在意人们看不看它，而且极不情愿被移植到城市里去\n③而且，它的香味又是很微妙的，似乎并不故意要去取悦任何人\n④所以，我们常常称美丽的隐逸的少女，或隐居山中鄙视名利权势的大学者为“空谷幽兰”\n⑤如果它被人们移植到城市里，它也必须顺自然的本性生长，否则便会枯菱而死\nA. ②⑤④③①\nB. ③⑤①②④\nC. ②④③①⑤\nD. ②④③⑤①","ans":"A","img":"../public/question-crops/sentence-order/sentence-order-59.webp","aimg":"","src":"../public/source/sentence-order/page-12.jpg","ph":false,"jx":""},{"s":"句子排序与衔接","sid":"sentence-order","n":60,"id":"sentence-order-60","tag":"","t":"选择题","stem":"60.填写在横线上的语句顺序最恰当的一项是\n花儿赋予我们勇气和力量，让我们看到了生命的美好和希望。让我们做一朵花儿吧，无论是身处\n高山还是匍甸低谷，_—；让我们做一朵花儿吧，无论是晴空万里还是乌云密布，二；让\n我们做一朵花儿吧，无论是雍容华贵还是暗香浮动，二_；让我们做一朵花儿吧，无论是枝头绽\n放还是凋谢飘零，.\n①都浸透着优雅与高洁的气质 ②都展示着昂扬与淡定的气度 ③都能无喜无忧，从容安然地面对\n④都能宠辱不惊，恭敬自如地生活\nA. ③④②①\nB. ④③①②\n¢. ①②④③\nD. ④③②①","ans":"B","img":"../public/question-crops/sentence-order/sentence-order-60.webp","aimg":"","src":"../public/source/sentence-order/page-12.jpg","ph":false,"jx":""},{"s":"句子排序与衔接","sid":"sentence-order","n":61,"id":"sentence-order-61","tag":"","t":"选择题","stem":"61. 填写在横线上的语句顺序排列正确的一项是\n葱岭脚下则是五颜六色的石头，紫红、黛青、黧黑、奶白、豆绿。传说，这里是共工怒触不周\n山的地方，不周山就是葱岭。这色彩缤纷的石头，就是女娲补天之石吗？\n__在这块沧桑的大\n地上，今天，一代一代新中国的建设者们，远离家人，从内地来到边强，润色葱岭、美化葱岭。\n①唐朝在此设立了“葱岭守捉”，高僧玄奘经此讲经月余，然后去天竺国取经。\n②当年周天子姬满曾驾着八骏到过这里。\n③1876年左宗棠率军挺进新疆，驱除外寇，捍卫了这片神圣的国土。\n④汉朝的都护曾到此驻守。\nA. ③①④②\nB. ②④①③\n. ①④②③\nD. ④①③②\n95","ans":"B","img":"../public/question-crops/sentence-order/sentence-order-61.webp","aimg":"","src":"../public/source/sentence-order/page-12.jpg","ph":false,"jx":""},{"s":"文学常识与名著","sid":"literature","n":1,"id":"literature-1","tag":"专题四","t":"选择题","stem":"1. 下列各项中表述有误的一项是 ( )\nA. 苏轼，字子由，号东坡居士，北宋文学家。我们曾学过他的诗歌《浣溪沙》《水调歌头》 《江\n城子·密州出猎》。\nB. 古代文人合称中，一般来说，“王孟”指王维、孟浩然，“韩柳”指韩愈、柳宗元，“苏辛”指苏 轼、\n辛弃疾。\nC. “我是大火中的一点火星，趁生命之火没有熄灭，我投入火的队伍、光的队伍，把‘一’和‘无数’ 融合\n在一起，为真理而斗争。”出自艾青《光的赞歌》。\nD. 《哈利·波特》系列是英国作家J·K·罗琳创作的魔幻小说系列，小说探讨了爱和拯救、忠诚和 背叛、\n善恶共生等话题。","ans":"A","img":"../public/question-crops/literature/literature-1.webp","aimg":"","src":"../public/source/literature/page-01.jpg","ph":false,"jx":"答案 A。错在「苏轼，字子由」——苏轼字子瞻，「子由」是他弟弟苏辙的字。B 项王孟（王维·孟浩然）、韩柳（韩愈·柳宗元）、苏辛（苏轼·辛弃疾）三组并称无误；C 项出自艾青《光的赞歌》；D 项《哈利·波特》为英国作家 J·K·罗琳所作。"},{"s":"文学常识与名著","sid":"literature","n":2,"id":"literature-2","tag":"专题四","t":"选择题","stem":"2. 下列各项中表述有误的一项是 ( )\nA. 《湖心亭看雪》选自《陶庵梦忆》,作者是张岱，他是明末清初的文学家。\nB. 《乡愁》的作者是崔颢，这首诗以邮票等意象抒发了浓厚强烈的思乡情怀。\nC. 《红 岩 》 中 的刘 思扬虽然是资产阶级出身，却是位真正的共产党人。\nD. 唐僧师徒经过一处山涧时，唐僧骑的马被孽龙吃了。观音菩萨擒住孽龙，把它变作白马，让白马驮 唐僧\n上西天取经。","ans":"B","img":"../public/question-crops/literature/literature-2.webp","aimg":"","src":"../public/source/literature/page-01.jpg","ph":false,"jx":"答案 B。错在「《乡愁》的作者是崔颢」——《乡愁》是余光中的诗，崔颢写的是《黄鹤楼》。A 项《湖心亭看雪》出自张岱《陶庵梦忆》；C 项刘思扬确是《红岩》中出身资产阶级家庭的共产党人；D 项写的是鹰愁涧小白龙吃马、观音收服化作白马。"},{"s":"文学常识与名著","sid":"literature","n":3,"id":"literature-3","tag":"专题四","t":"选择题","stem":"3. 下列各项中表述有误的一项是 ( )\nA. 朱自清，散文家、诗人、学者，我们曾学过他的作品《背影》。\nB. 《琐记》中鲁迅回忆了在正月初一清晨，长妈妈让他吃福橘的往事。\nC. 《骆驼祥子》中刘四爷问祥子虎妞在什么地方，祥子没有告诉他。\nD. 《钢铁是怎样炼成的》中保尔在战斗间隙，为战友们读《牛虻》,大家深受感动。","ans":"B","img":"../public/question-crops/literature/literature-3.webp","aimg":"","src":"../public/source/literature/page-01.jpg","ph":false,"jx":"答案 B。「正月初一清晨让『我』吃福橘」出自《阿长与〈山海经〉》，不是《琐记》——《琐记》写的是衍太太和留学南京。A 项朱自清《背影》、C 项祥子未告知刘四爷虎妞下落、D 项保尔为战友读《牛虻》均无误。"},{"s":"文学常识与名著","sid":"literature","n":4,"id":"literature-4","tag":"专题四","t":"选择题","stem":"4. 下列各项中表述有误的一项是 ( )\nA . 李白，唐代诗人，我们曾学过他的作品《闻王昌龄左迁龙标遥有此寄》和《行路难》(其一)。\nB. 《红岩》中的许云峰和成岗被捕后，面对徐鹏飞的威逼利诱，拒绝出卖党组织。\nC. 《西游记》中的孙悟空因在五庄观偷吃人参果连累了唐僧，被唐僧赶回花果山。\nD . 看着面对困难依然干劲冲天的筑路队员们，朱赫来感慨：“钢铁就是这样炼成的!”","ans":"C","img":"../public/question-crops/literature/literature-4.webp","aimg":"","src":"../public/source/literature/page-01.jpg","ph":false,"jx":"答案 C。孙悟空被唐僧赶回花果山，是「三打白骨精」之后；五庄观偷吃人参果、推倒人参果树后，他是去求观音医树，并未被赶走。A、B、D 三项分别对应李白作品、《红岩》许云峰与成岗、朱赫来「钢铁就是这样炼成的」。"},{"s":"文学常识与名著","sid":"literature","n":5,"id":"literature-5","tag":"专题四","t":"选择题","stem":"5. 下列各项中表述有误的一项是 ( )\nA . 马致远，元代戏曲作家、散曲家。我们学过他的作品《天净沙·秋思》。\nB. 《西游记》中的唐僧在五行山揭去观音菩萨的压帖，救出孙悟空，赐号“行者”。\nC. 《红岩》中的江姐对党忠诚，面对特务把竹签子钉进十指的酷刑，她坚贞不屈。\nD. 《格列佛游记》中的格列佛遇到的小人国国王贪婪残忍，大人国国王贤明正直。","ans":"B","img":"../public/question-crops/literature/literature-5.webp","aimg":"","src":"../public/source/literature/page-01.jpg","ph":false,"jx":"答案 B。五行山顶的六字真言压帖是**如来**所贴，不是观音。A 项马致远《天净沙·秋思》、C 项江姐受竹签钉指之刑、D 项小人国国王贪婪残忍与大人国国王贤明正直，均无误。"},{"s":"文学常识与名著","sid":"literature","n":6,"id":"literature-6","tag":"专题四","t":"选择题","stem":"6. 下列各项中表述有误的一项是 ( )\nA. 叶圣陶，中国作家、教育家、出版家、社会活动家。我们曾学过他的作品《苏州园林》。\nB. 《钢铁是怎样炼成的》中保尔虽被学校奖励 了 书 和 奖 状 ，但因家境贫困不得不退学。\nC. 在桑菲尔德庄园做家庭教师时，简·爱以自己的人格和自尊赢得了罗切斯特的倾心。\nD. 飞岛国国王迫使地上人民归顺的极端手段是让飞岛直接落到他们头上，将人和房屋一起毁灭。","ans":"B","img":"../public/question-crops/literature/literature-6.webp","aimg":"","src":"../public/source/literature/page-01.jpg","ph":false,"jx":"答案 B。保尔是被学校开除的（往神父的复活节面团里撒烟灰），并无「被学校奖励了书和奖状、因家境贫困退学」这一情节。A 项叶圣陶《苏州园林》、C 项简·爱在桑菲尔德当家庭教师、D 项飞岛国毁灭手段，均无误。"},{"s":"文学常识与名著","sid":"literature","n":7,"id":"literature-7","tag":"专题四","t":"选择题","stem":"7 下列对名著知识分析有误的一项是 ( )\nA. 善于说故事，善于塑造人物，充满天马行空的想象和大胆奇特的夸张，是《西游记》这部小说的三大成功之处。\nB. 《西游记》是长篇章回体神话 (魔)小说，是古典神话小说中成就最高、最受喜爱的小说。但这\n部作品并非全无依傍，它有历史真实的影子。玄奘取经的故事经民间文艺演 出，成为小说的素材\n来源。\nC. 《卖油翁》是北宋文学家欧阳修的作品。\nD. 《水浒传》中，高俅被梁山好汉擒捉上山，宋江安排宴会给他压惊，请他促成招安。高俅回京后，\n立即奏请招安。于是，皇帝派人去梁山泊招抚。","ans":"D","img":"../public/question-crops/literature/literature-7.webp","aimg":"","src":"../public/source/literature/page-02.jpg","ph":false,"jx":"答案 D。高俅被擒上山后并未奏请招安——他回京后隐瞒此事；真正促成招安的是宿太尉（宿元景）。A、B 项《西游记》的艺术成就与素材来源、C 项《卖油翁》为欧阳修所作，均无误。"},{"s":"文学常识与名著","sid":"literature","n":8,"id":"literature-8","tag":"专题四","t":"选择题","stem":"8. 下面各项中表述有误的一项是 ( )\nA. 茅盾，作家、社会活动家。原名沈雁冰，字德鸿，浙江桐乡人。\n\nB. 《水调歌头》《江城子·密州出猎》都是北宋文学家苏轼的作品。\nC. 《红岩》中的江姐外柔内刚，在危急关头从容镇定，面对敌人的严刑拷打坚贞不屈。\nD. 保尔敢于向命运挑战，自强不息，有崇高的革命理想、忘我的献身精神和乐观的生活态度。","ans":"A","img":"../public/question-crops/literature/literature-8.webp","aimg":"","src":"../public/source/literature/page-02.jpg","ph":false,"jx":"答案 A。茅盾**原名沈德鸿，字雁冰**，选项把名和字颠倒了。B 项苏轼两首词、C 项《红岩》江姐、D 项保尔的精神品质均无误。"},{"s":"文学常识与名著","sid":"literature","n":9,"id":"literature-9","tag":"专题四","t":"选择题","stem":"9 下列各项中表述有误的一项是 ( )\nA. 《水浒传》中浔阳楼吟反诗、三打祝家庄、大破连环马等故事都与宋公明有关。\nB. 杨绛，作家、翻译家。代表作有散文《干校六记》、译作《堂吉诃德》等。\nC. 《格列佛游记》中作者用讽刺手法和虚构的情节，剖析了当时法国的社会现实。\nD. 郦道元，字善长，北魏地理学家。三峡是瞿塘峡、巫峡 和西陵峡的总称。","ans":"C","img":"../public/question-crops/literature/literature-9.webp","aimg":"","src":"../public/source/literature/page-02.jpg","ph":false,"jx":"答案 C。《格列佛游记》讽刺剖析的是**英国**社会现实，不是法国。A 项浔阳楼吟反诗、三打祝家庄、大破连环马都与宋江有关；B 项杨绛代表作《干校六记》、译作《堂吉诃德》；D 项郦道元与三峡三名，均无误。"},{"s":"文学常识与名著","sid":"literature","n":10,"id":"literature-10","tag":"专题四","t":"选择题","stem":"10. 下列各项中表述有误的一项是 ( )\nA. 人到底应该怎样度过自己的一生 ? 怎样才能在革命斗争中成长为真正的钢铁战士 ?保尔·柯察金\n以自己的实际行动做出了响亮的回答。\nB. 苏轼，北宋文学家，字子瞻，号东坡居士，唐宋 八大家之一。代表作品有《水调歌头·明月几时\n有》《念奴娇·赤壁怀古》《赤壁赋》等。\nC. 《水浒传》中“被逼上梁山”的“逼”字在林冲身上体现得最明显。\nD. 格列佛第一次出游，发现小人国是用跳绳比赛来选拔官员的，他第四次出游来到了飞岛国。","ans":"D","img":"../public/question-crops/literature/literature-10.webp","aimg":"","src":"../public/source/literature/page-02.jpg","ph":false,"jx":"答案 D。格列佛**第三次**出游才到飞岛国（勒皮他），**第四次**去的是慧骃国。A 项保尔的人生回答、B 项苏轼名号与代表作、C 项林冲「被逼上梁山」，均无误。"},{"s":"文学常识与名著","sid":"literature","n":11,"id":"literature-11","tag":"专题四","t":"选择题","stem":"11. 下列各项中表述有误的一项是 ( )\nA. 《礼记》,战国至秦汉间儒家论著的汇编，相传是西汉经学家戴圣编纂的。\nB. 《阿长与〈山海经〉》中的长妈妈，是作者儿时的保姆。祖母叫她阿长， 是因为她身材高大。\nC. 《论语》是记录孔子和他弟子言行的一部书，是儒家经典著作。\nD. 在《格列佛游记》描述的小人国里，如果重要职位出缺，候补人员就会通过绳上跳舞比赛来决定谁\n接任这个宫职。","ans":"B","img":"../public/question-crops/literature/literature-11.webp","aimg":"","src":"../public/source/literature/page-02.jpg","ph":false,"jx":"答案 B。错在「祖母叫她阿长，是因为她身材高大」——身材高大的是先前那位女工「真阿长」，本名阿长（长妈妈）的黄胖而矮，只是顶了旧名。《礼记》戴圣编纂、《论语》为儒家经典、小人国绳上跳舞选官，均无误。"},{"s":"文学常识与名著","sid":"literature","n":12,"id":"literature-12","tag":"专题四","t":"选择题","stem":"12. 下列各项中表述有误的一项是 ( )\nA. 《生于忧患，死于安乐》选自《孟子·告子下》,《孟子》是记录孟子及其弟子言行的著作。\nB. “人的一生应当这样度过：当他回首往事的时候，他不会因为虚度年华而悔恨，也不会因为碌碌无\n为而羞愧……”这是《钢铁是怎样炼成的》主人公保尔一生恪守的人生原则。\nC. 《骆驼祥子》结尾，祥子重燃了自己的理想，从一个麻木、潦倒、狡猾 、自暴自弃的行尸走肉，变\n成了一个诚实可爱的青年。\nD. 《二十四孝图》选自鲁迅的散文集《朝花夕拾》 ,对荒谬愚昧的封建孝道进行了抨击。","ans":"C","img":"../public/question-crops/literature/literature-12.webp","aimg":"","src":"../public/source/literature/page-02.jpg","ph":false,"jx":"答案 C。方向正好相反：《骆驼祥子》结尾祥子由诚实可爱的青年**堕落**为麻木、潦倒、狡猾、自暴自弃的行尸走肉，他并没有「重燃理想」。A、B、D 三项（《生于忧患》出处、保尔的人生原则、《二十四孝图》）均无误。"},{"s":"文学常识与名著","sid":"literature","n":13,"id":"literature-13","tag":"专题四","t":"选择题","stem":"13. 下列各项中表述有误的一项是 ( )\nA. 《简·爱》中的女主人公身份低微、相貌平平，却富于激情、幻想和反抗精神， 一直坚定地捍卫自\n己的独立人格和尊严，是浪漫主义文学形象的代表。\nB. 《水浒传》成功塑造了一大批栩栩如生的人物形象，如及时雨宋江、黑旋风李逵、豹子头林冲等，\n小说还讲述了大闹野猪林、智取生辰纲、拳打镇关西等脍炙人口的名篇。\nC. 《格列佛游记》中“慧驷”们教育子女学习克制、勤勉以及整洁等课程，还训练子女沿着陡峭山坡\n上下奔跑，以提高它们的力量、速度和耐力。\n\nD. 《阿长与〈山海经〉》中阿长是“我们”家保姆，她姓长，又高又瘦，她迷信唠叨，令人厌烦， 她为\n“我”买来了《山海经》,让“我”对她产生了新的敬意。","ans":"D","img":"../public/question-crops/literature/literature-13.webp","aimg":"","src":"../public/source/literature/page-02.jpg","ph":false,"jx":"答案 D。错在「阿长姓长，又高又瘦」——阿长既不姓长，也非又高又瘦，原文作「黄胖而矮」，「长」只是沿用旧女工的名字。A 项《简·爱》女主人公、B 项水浒人物绰号与故事、C 项慧骃国教育子女的方式，均无误。"},{"s":"文学常识与名著","sid":"literature","n":14,"id":"literature-14","tag":"专题四","t":"选择题","stem":"14. 下列各项中表述有误的一项是\nA. 《河中石兽》选自《阅微草堂笔记》,作者是纪昀，字晓岚，清代学者、文学家。\nB. 《简·爱》中谭波尔小姐离开后，简·爱厌倦了孤儿院的生活，登广告谋求家庭教师的职业。\nC. 《最苦与最乐》的作者是梁启超，文章提出了“未尽责任最苦，尽了责任最乐”的观点。\nD. 《无常》多次写医生开出的奇特药引，目的是讽刺所谓的名医其实是误人性命的庸医。","ans":"D","img":"../public/question-crops/literature/literature-14.webp","aimg":"","src":"../public/source/literature/page-03.jpg","ph":false,"jx":"答案 D。错在把《父亲的病》的内容安到了《无常》上——「多次写医生开出的奇特药引、讽刺庸医误人性命」是《父亲的病》；《无常》写的是迎神赛会中的无常，借此讽刺「正人君子」。A 项纪昀与《河中石兽》、B 项谭波尔小姐离开后简·爱登广告求职、C 项梁启超《最苦与最乐》，均无误。"},{"s":"文学常识与名著","sid":"literature","n":15,"id":"literature-15","tag":"专题四","t":"选择题","stem":"15. 下列各项中表述有误的一项是 (\nA. 苏轼，北宋文学家，字子瞻，号东坡居士，我们学过他的《水调歌头·明月几时有》《江城子·\n州出猎》《记承天寺夜游》。\nB. 《红岩》中，当解放军逼近重庆，白公馆中的一部分地下党利用华子良挖的秘密通道，逃出了\n虎口。\nC. 《钢铁是怎样炼成的》的主人公保尔在发电厂工作时结识了红军撤退时留下的老水手朱赫来，正是\n在这位老水手的教育下，他才走上了革命的道路。\nD. 《最苦与最乐》作者是梁启超，号任公，别号饮冰室主人，思想家、学者。","ans":"B","img":"../public/question-crops/literature/literature-15.webp","aimg":"","src":"../public/source/literature/page-03.jpg","ph":false,"jx":"答案 B。《红岩》中白公馆越狱所走的是**许云峰**在地牢挖出的通道；华子良装疯十五年，担任的是狱内外联络。A 项苏轼作品、C 项朱赫来引导保尔走上革命道路、D 项梁启超名号，均无误。"},{"s":"文学常识与名著","sid":"literature","n":16,"id":"literature-16","tag":"专题四","t":"选择题","stem":"16. 下面各项中表述有误的一项是 ( )\nA. 《骆驼祥子》叙写了旧北京人力车夫的辛酸故事，小说大量使用北京口语，还有一些关于老北京风\n土人情的描写，是现代白话小说的经典作品。\nB. 《故乡》作者鲁迅。这篇小说以“我”回故乡的见闻为线索，以“回到故乡”“在故乡”“离开故\n乡”三部分紧密相关的内容构成。\nC. 《邹忌讽齐王纳谏》选自《战国策·齐策一》,《战国策》是一部记录战国时期各国谋臣策士活动\n的国别体史书。\nD. 《鲁滨孙漂流记》的主人公鲁滨孙热衷于航海，性格坚毅。他在小人国、大人国历险多年，历尽千\n辛万苦，终于得到了可观的财富。","ans":"D","img":"../public/question-crops/literature/literature-16.webp","aimg":"","src":"../public/source/literature/page-03.jpg","ph":false,"jx":"答案 D。「在小人国、大人国历险」的是**格列佛**（《格列佛游记》）；鲁滨孙是流落荒岛二十八年。A 项《骆驼祥子》的京味与白话小说地位、B 项《故乡》的叙事线索、C 项《战国策》为国别体史书，均无误。"},{"s":"文学常识与名著","sid":"literature","n":17,"id":"literature-17","tag":"专题四","t":"选择题","stem":"17. 下列各项中表述有误的一项是 ( )\nA. 斯威夫特笔下的格列佛，在小人国看到一种特殊的游戏：人们在离地高绳上跳舞，皇帝依据表演的\n好坏，按名次奖给表演者蓝色、红色、绿色丝线。\nB. 闻一多，诗人、学者、民主战士。代表作有诗集《红烛》《死水》,学术著作《神话与诗》《唐诗\n杂论》等。\nC. 《孙权劝学》选自《资治通鉴》。《资治通鉴》是由北宋司马光主持编纂的一部编年体通史。\nD. 《阿长与〈山海经〉》选自《朝花夕拾》,这是一部散文集，我 们 学 过 的 鲁 迅 的 作 品 选 自其 中 的 还\n有《从百草园到三味书屋》。","ans":"A","img":"../public/question-crops/literature/literature-17.webp","aimg":"","src":"../public/source/literature/page-03.jpg","ph":false,"jx":"答案 A。原著中小人国赏赐的丝线是**紫、黄、白**三色（紫色最尊贵），选项写作「蓝、红、绿」，与原著不符。B 项闻一多的诗集与学术著作、C 项《资治通鉴》为司马光主持编纂的编年体通史、D 项《阿长与〈山海经〉》选自《朝花夕拾》，均无误。"},{"s":"文学常识与名著","sid":"literature","n":18,"id":"literature-18","tag":"专题四","t":"选择题","stem":"18. 下列各项中表述有误的一项是 ( )\nA. 《水浒传》成功塑造了一大批栩栩如生的人物形象，如及时雨宋江、黑旋风李逵、豹子头林冲等，\n小说还讲述了大闹野猪林、智取生辰纲、拳打镇关西等脍炙人口的名篇。\nB. 《格列佛游记》叙述了主人公格列佛先后周游小人国、大人国及其他奇异诸岛的故事。\nC. 孙悟空三打白骨精，在师傅唐僧写下一纸贬书后，径直回到花果山。后来，猪八戒用激将法将其\n请出。\nD. 挪威作家斯坦·贾德的《苏菲的世界》是一部引人入胜的自传体小说，也是一部通俗而有趣的哲学\n启蒙读物。","ans":"D","img":"../public/question-crops/literature/literature-18.webp","aimg":"","src":"../public/source/literature/page-03.jpg","ph":false,"jx":"答案 D。错在「斯坦·贾德」应为**乔斯坦·贾德**（挪威作家），且《苏菲的世界》是哲学启蒙小说，不是「自传体小说」。A 项水浒人物与情节、B 项格列佛的游历、C 项三打白骨精与猪八戒激将，均无误。"},{"s":"文学常识与名著","sid":"literature","n":19,"id":"literature-19","tag":"专题四","t":"选择题","stem":"19. 下列各项中表述有误的一项是 ( )\nA. 朱自清，原名自华，号秋实，后改名自清，字佩弦。散文家、诗人、学者。著有诗文集《踪\n迹》,散文集《背影》《欧游杂记》《你我》等。\n\nB. 《朝花夕拾》是鲁迅唯一一本散文集，作者在《二十四孝图》一文中以“无论忤逆，无论孝顺，小\n孩子多不愿意‘诈’作，听故事也不喜欢是谣言”,这出于人性和人情的儿童心理，批判了“老莱\n娱亲”和“郭巨埋儿”的孝道。\nC. 《钢铁是怎样炼成的》作者是苏联作家尼克拉·奥斯特洛夫斯基，该小说出版后，他又忍着病痛完\n成了另一部小说《暴风雨所诞生的》的创作。\nD. 《水浒传》塑造了粗中有细、豁达明理的鲁智深，头脑简单、直爽率真的李逵，崇尚忠义、有恩必\n报、有仇必复的武松等一大批鲜活的人物形象。","ans":"C","img":"../public/question-crops/literature/literature-19.webp","aimg":"","src":"../public/source/literature/page-04.jpg","ph":false,"jx":"答案 C。错在作者名「尼克拉·奥斯特洛夫斯基」，应为**尼古拉**·奥斯特洛夫斯基。A 项朱自清名号与文集、B 项《二十四孝图》批判老莱娱亲与郭巨埋儿、D 项鲁智深李逵武松三人形象，均无误。"},{"s":"文学常识与名著","sid":"literature","n":20,"id":"literature-20","tag":"专题四","t":"选择题","stem":"20 下列各项中表述有误的一项是 ( )\nA. 《世说新语》是南朝宋临川壬刘义庆组织编写的，这是一部志人小说集，主要记载汉末至东晋士大\n夫的言谈、逸事。\nB. 《简·爱》中简·爱从小就表现出强烈的反抗精神，与表哥、舅妈以及学校校长对抗，长大后又以\n其独立人格和勇敢个性赢得了罗切斯特的爱情。\nC. 《钢铁是怎样炼成的》中保尔在母亲和妻子丽达的帮助下，用生命写出的小说《暴风雨所诞生的》\n终于出版了。\nD. 《最后一次讲演》作者闻一多，这篇文章是闻一多在李公朴的追悼会上发表的演讲，表现了闻一多\n坚持正义、追求真理、追求光明、视死如归的斗争精神。","ans":"C","img":"../public/question-crops/literature/literature-20.webp","aimg":"","src":"../public/source/literature/page-04.jpg","ph":false,"jx":"答案 C。帮助保尔写成《暴风雨所诞生的》的是母亲和**妻子达雅**；丽达是保尔的恋人兼革命引路人，不是他的妻子。A 项《世说新语》为刘义庆组织编写、B 项简·爱的反抗精神、D 项《最后一次讲演》的背景，均无误。"},{"s":"文学常识与名著","sid":"literature","n":21,"id":"literature-21","tag":"专题四","t":"选择题","stem":"21. 选出对下列名著相关内容的表述有误的一项 ( )\nA. “我至今一想起，还诧异我的父亲何以要在那个时候叫我来背书。”这是《五猖会》的最后一句，\n句中所背的书是《鉴略》。\nB. 老舍的《骆驼祥子》,通过祥子这个人物命运的变化，无情地批判了祥子所处的那个社会——它不\n让好人有出路。\nC. 《格列佛游记》第四卷，以恣肆的笔调，展示了人兽颠倒的怪诞景象。其中的人叫“慧驷”,兽叫\n“耶胡”。\nD. “写鬼写妖高人一等，刺贪刺虐人骨三分”,这是给予蒲松龄和他的《聊斋志异》的高度评价。","ans":"C","img":"../public/question-crops/literature/literature-21.webp","aimg":"","src":"../public/source/literature/page-04.jpg","ph":false,"jx":"答案 C。慧骃国里**马**才是理性的「慧骃」（原题「慧驷」当为「慧骃」，骃读 yīn），人形兽叫「耶胡」——选项把两者说反了。A 项《五猖会》所背为《鉴略》、B 项《骆驼祥子》的社会批判、D 项郭沫若题蒲松龄故居对联，均无误。"},{"s":"文学常识与名著","sid":"literature","n":22,"id":"literature-22","tag":"专题四","t":"选择题","stem":"22. 下列关于文学名著表述有误的一项是 ( )\nA. 在《骆驼祥子》中，“他只是个有时候教点书，有时候也做些别的事的一个中等人物……他的家庭\n是沙漠中的一个小绿洲”,这里的“他”就是被祥子看成圣贤的刘四爷。\nB. 真假孙悟空都神通广大，沙僧、菩萨、玉帝、唐僧、地藏等均不能辨出真假，直至来到如来佛祖面\n前，被佛祖轻而易举判出真假。真悟空打死假悟空，师徒团聚。\nC. 格列佛在慧驷国遇到很有理性、观察敏锐而且判断正确的慧驷马，对它顶礼膜拜，学它走路，模仿\n它说话的腔调。当慧驷马要求他离开时，格列佛非常悲伤。\nD. 水浒英雄各有绰号，有些绰号鲜明地概括出人物的特征，如“豹子头”,突出林冲生得“豹头环\n眼，燕额虎须”;“神行太保”则突出戴宗能“程途八百里，朝去暮还来”。","ans":"A","img":"../public/question-crops/literature/literature-22.webp","aimg":"","src":"../public/source/literature/page-04.jpg","ph":false,"jx":"答案 A。「他只是个有时候教点书……他的家庭是沙漠中的一个小绿洲」，这个人是**曹先生**——祥子把他看成圣贤，不是刘四爷。B 项真假美猴王、C 项格列佛在慧骃国、D 项豹子头与神行太保两组绰号，均无误。"},{"s":"文学常识与名著","sid":"literature","n":23,"id":"literature-23","tag":"专题四","t":"选择题","stem":"23. 下列关于名著的解说不正确的一项是 ( )\nA. “浪迹天涯忆旧游，故人生死各千秋。已摈忧患寻常事，留得豪情作楚囚。”出自《艾青诗选》,\n作者恽代英。\nB. 林冲是《水浒传》中的人物，绰号“豹子头”。他武艺高强，安分守己，但懦弱隐忍，逆来顺受，\n因为遭到高太尉陷害，被一步步逼上梁山。\nC. 《骆驼祥子》中的祥子最终也没能拥有一辆自己的洋车：第一次买的车被大兵抢走，第二次买车的\n钱被侦探敲诈去了，第三次买的车安葬虎妞时卖掉了。\nD. 孙悟空被封为齐天大圣，猪八戒做过天蓬元帅，沙僧是卷帘大将，但后来他们都做了唐僧的徒弟，\n随唐僧西天取经。","ans":"A","img":"../public/question-crops/literature/literature-23.webp","aimg":"","src":"../public/source/literature/page-04.jpg","ph":false,"jx":"答案 A。「浪迹天涯忆旧游……留得豪情作楚囚」是**恽代英**的《狱中诗》，出自革命烈士诗抄，与《艾青诗选》无关。B 项林冲被逼上梁山、C 项祥子三次买车（被抢、被敲诈、卖车葬虎妞）、D 项三人取经前的身份，均无误。"},{"s":"文学常识与名著","sid":"literature","n":24,"id":"literature-24","tag":"专题四","t":"选择题","stem":"24. 下列对名著有关内容的表述不正确的一项是 ( )\nA. 《红岩》中许云峰曾在地牢里创造了一个奇迹：把地牢挖穿了。他挖穿地牢后不久就牺牲了，一 部\n分难友顺着他生前挖的秘密通道逃出了虎口。\nB. 智取生辰纲的关键在于下蒙汗药的时间和方式，宋江、吴用、刘唐等好汉引诱对方上钩，全然不露\n痕迹，杨志虽极精细，仍然中了计。\nC. “老迅，我们今天不喝酒了，我要去看看光复绍兴，我们同去。”这是范爱农在绍兴光复后的第二\n天上城时对鲁迅说的话，可见革命胜利后他内心无比喜悦。\nD. 罗刹捶着胸膛骂道：“那泼猴赚了我的宝贝，现出原身走了!气杀我也!”罗刹女生气的原因是孙\n悟空假扮了牛魔王，从她手上骗走了芭蕉扇。","ans":"B","img":"../public/question-crops/literature/literature-24.webp","aimg":"","src":"../public/source/literature/page-05.jpg","ph":false,"jx":"答案 B。智取生辰纲是**晁盖、吴用、公孙胜、刘唐、三阮、白胜**等人所为，**宋江并未参与**。A 项许云峰挖穿地牢、C 项范爱农在绍兴光复后对鲁迅说的话、D 项罗刹女被假牛魔王骗走芭蕉扇，均无误。"},{"s":"文学常识与名著","sid":"literature","n":25,"id":"literature-25","tag":"专题四","t":"自评题","stem":"25. 下列有关文学名著的内容与理解，表述有误的两项是 ( )\nA. 《狗·猫·鼠》中，作者追忆童年时所救养的一只可爱隐鼠遭到摧残的经历，表达了对弱小者的同\n情和对暴虐者的憎恨。\nB. 蟠桃会上，孙悟空喝光宴会用的仙酒，吃尽太上老君的金丹。太上老君大怒，随即和哪吒三太子\n带十万天兵去花果山捉拿悟空，被悟空打败。\nC. 《聊斋志异》是一部以写狐鬼故事著称的短篇文言小说集，它多以谈鬼说狐的形式讽刺现实的黑暗\n和官场的罪恶。\nD. 在“慧驷”各种美德的感化下，格列佛一心想留在“慧驷”国。经“慧驷”国全国代表大会表决通\n过，格列佛实现愿望，留了下来。","ans":"BD","img":"../public/question-crops/literature/literature-25.webp","aimg":"","src":"../public/source/literature/page-05.jpg","ph":false,"jx":"答案 BD。B 错：蟠桃会偷仙酒、盗金丹的是孙悟空，但率十万天兵围剿花果山的是**托塔李天王与哪吒**（第二次围剿），并非「太上老君和哪吒一起」；D 错：慧骃国全国代表大会的表决结果是**不能留下**，格列佛最终被迫离开。A 项《狗·猫·鼠》、C 项《聊斋志异》为文言短篇小说集，均正确。"},{"s":"文学常识与名著","sid":"literature","n":26,"id":"literature-26","tag":"专题四","t":"选择题","stem":"26. 某校某班召开读书学习交流会，同学们畅谈了自己的学习收获。下列表述有误的一项是 ( )\nA. 书路说：“爱情是文学作品永恒的主题，我最欣赏简·爱，她出身卑微，也不美丽，但在罗切斯特\n面前自尊自爱。她是我的女神!”\nB. 思琦说：“侠义精神最有魅力，我特别喜欢《水浒传》中的武松大闹野猪林、宋公明三打祝家庄的\n故事。”\nC. 焕然说：“历险小说才开阔视野呢，如鲁滨孙放弃安逸生活，出海历险，荒岛求生，表现了人类挑\n战自然的勇气。”\nD. 童童说：“还是古典名篇更具思想内涵，战国时期著名思想家孟子写的《生于忧患，死于安乐》让\n人警醒。”","ans":"B","img":"../public/question-crops/literature/literature-26.webp","aimg":"","src":"../public/source/literature/page-05.jpg","ph":false,"jx":"答案 B。「大闹野猪林」的是**鲁智深**，不是武松；武松的代表情节是景阳冈打虎、醉打蒋门神、大闹飞云浦。A 项简·爱自尊自爱、C 项鲁滨孙荒岛求生、D 项孟子《生于忧患，死于安乐》，均无误。"},{"s":"文学常识与名著","sid":"literature","n":27,"id":"literature-27","tag":"专题四","t":"选择题","stem":"27. 下列各项中表述有误的一项是 ( )\nA. 长篇小说《格列佛游记》用丰富的讽刺手法和虚构的离奇情节，深刻地剖析了当时英国的社会\n现实。\nB. 江姐到川北城门口发现丈夫被害，后来从双枪老太婆口中得知，丈夫是因为掩护群众撤退而被\n捕的。\nC. 《琐记》中，看似冷静叙述衍太太对自家儿子狠，对别家孩子好，实则讽刺她自私阴险。\nD. 在经典名著中，很多人物都历经磨难，例如唐僧师徙四人历经九九八十一次磨难，终获真经；格列\n佛流落荒岛二十八年，克服了种种难以想象的困难。","ans":"D","img":"../public/question-crops/literature/literature-27.webp","aimg":"","src":"../public/source/literature/page-05.jpg","ph":false,"jx":"答案 D。「流落荒岛二十八年」的是**鲁滨孙**，格列佛是四次航海游历小人国、大人国、飞岛国、慧骃国；唐僧师徒历的是「九九八十一难」（选项「八十一次」表述亦误）。A 项《格列佛游记》剖析英国社会、B 项江姐得知丈夫被害、C 项《琐记》讽刺衍太太，均无误。"},{"s":"文学常识与名著","sid":"literature","n":28,"id":"literature-28","tag":"专题四","t":"选择题","stem":"28. 选出下列文学常识表述有误的一项 ( )\nA. 宋濂，字景濂，号潜溪，宋代文学家，我们学习了他的《送东阳马生序》。\nB. 《桃花源记》和五言古诗《饮酒》的作者都是陶渊明，他是东晋时期人。\nC. 《论语》是儒家经典著作，记录了孔子及其弟子的言行，共20篇。\nD. 《木兰诗》选自《乐府诗集》,它是南北朝时北方的一首乐府民歌。","ans":"A","img":"../public/question-crops/literature/literature-28.webp","aimg":"","src":"../public/source/literature/page-05.jpg","ph":false,"jx":"答案 A。宋濂是**明代**文学家（字景濂，号潜溪），不是宋代。B 项陶渊明为东晋人、C 项《论语》共 20 篇、D 项《木兰诗》为南北朝北方乐府民歌，均无误。"},{"s":"文学常识与名著","sid":"literature","n":29,"id":"literature-29","tag":"专题四","t":"选择题","stem":"29. 选出下列关于名著的说法有误的一项 ( )\nA. 《西游记》是中国古典文学中最富有想象力的作品之一，小说围绕唐僧师徒四人前往西天取经的主\n线，写了许多降妖除魔的故事。\n\nB. 《五猖会》中，“我”迫切地渴望去看迎神赛会，但父亲要求“我”必须背会《鉴略》才能去，\n“我”很快便背下来了，欣然前往。\nC. 苏联作家尼古拉·奥斯特洛夫斯基，强忍病痛，在病榻上历时三年，终于完成了长篇小说《钢铁是\n怎样炼成的》。\nD. 《简·爱》是一部具有自传色彩的作品。主人公简·爱虽然贫穷、低微、不美、矮小，但一直坚定\n地捍卫自己的独立人格和尊严。","ans":"B","img":"../public/question-crops/literature/literature-29.webp","aimg":"","src":"../public/source/literature/page-06.jpg","ph":false,"jx":"答案 B。《五猖会》中「我」被父亲逼迫背《鉴略》，背完虽得以去看会，却已兴致全无（「我却并没有他们那么高兴」），并非「欣然前往」。A 项《西游记》的想象力、C 项奥斯特洛夫斯基病中著书、D 项《简·爱》的自传色彩，均无误。"},{"s":"文学常识与名著","sid":"literature","n":30,"id":"literature-30","tag":"专题四","t":"选择题","stem":"30. 下列有关作家作品和文化常识的说法不正确的一项是 ( )\nA. 《战国策》是西汉左丘明根据战国时期的史料整理编辑而成的史书。\nB. “表”是古代向帝王陈情言事的一种文体，如诸葛亮的《出师表》。\nC. 《中国人失掉自信力了吗》是驳论文，选自鲁迅的《且介亭杂文》。\nD. “长河落日圆”“饮于河渭”“山河表里潼关路”这几句诗文中的“河”指的是“黄河”。","ans":"A","img":"../public/question-crops/literature/literature-30.webp","aimg":"","src":"../public/source/literature/page-06.jpg","ph":false,"jx":"答案 A。《战国策》是**西汉刘向**整理编辑的史书，左丘明著的是《左传》《国语》。B 项「表」的文体与《出师表》、C 项《中国人失掉自信力了吗》选自《且介亭杂文》、D 项「河」指黄河，均无误。"},{"s":"文学常识与名著","sid":"literature","n":31,"id":"literature-31","tag":"专题四","t":"选择题","stem":"31. 下列选项中表述不正确的一项是 ( )\nA. 保尔在朱赫来的影响下，逐步走上革命道路，最终成长为无产阶级战士。\nB. 《红岩》中许云峰被捕后，面对徐鹏飞等人的威逼利诱，拒绝出卖党组织。\nC. 唐僧师徒四人路遇火焰山时受阻，孙悟空万不得已，向铁扇公主借芭蕉扇。\nD. 在和表哥约翰·里德发生冲突后，简·爱被舅舅关进了阴森恐怖的红房子里。","ans":"D","img":"../public/question-crops/literature/literature-31.webp","aimg":"","src":"../public/source/literature/page-06.jpg","ph":false,"jx":"答案 D。简·爱是被**舅妈（里德太太）**关进红房子的，舅舅里德先生早已去世（且正是死在红房子里）。A 项保尔在朱赫来影响下成长、B 项《红岩》许云峰拒降、C 项借芭蕉扇过火焰山，均无误。"},{"s":"文学常识与名著","sid":"literature","n":32,"id":"literature-32","tag":"专题四","t":"选择题","stem":"32. 下列说法不正确的一项是 ( )\nA. 谚语“八月十五云遮月，来岁元宵雪打灯”的意思是中秋节晚上如果是云遮月的阴雨天，则来年的\n正月十五花灯节就会下雪。\nB. 话剧综合了文学、表演、美术、音乐、舞蹈等多种文艺成分。它以演唱为主要手段。\nC. 古代年龄都有特定的别称，未满周岁的婴儿被称之为“襁褓”。\nD. 老舍，原名舒庆春，字舍予，是新中国第一位获得“人民艺术家”称号的作家。代表作有《骆驼祥\n子》《茶馆》等。","ans":"B","img":"../public/question-crops/literature/literature-32.webp","aimg":"","src":"../public/source/literature/page-06.jpg","ph":false,"jx":"答案 B。话剧以**对话（说白）和动作**为主要表现手段，「以演唱为主要手段」的是歌剧、戏曲一类。A 项谚语释义、C 项「襁褓」指未满周岁的婴儿、D 项老舍名号与代表作，均无误。"},{"s":"文学常识与名著","sid":"literature","n":33,"id":"literature-33","tag":"专题四","t":"选择题","stem":"33. 下列各句表述错误的一项是 ( )\nA. 《海底两万里》是凡尔纳的一部科幻小说，赞扬了尼摩船长等反抗压迫的战士形象。\nB. 《五猖会》中父亲让“我”背的书是《千字文》。\nC. 《昆虫记》被鲁迅认为是把科学著作注入了灵魂 和生气，使之成为 “一部很有趣，也很有益\n的书”。\nD. 保尔因往神父的面团里撒烟灰，被学校开除，当时的他只有12岁。","ans":"B","img":"../public/question-crops/literature/literature-33.webp","aimg":"","src":"../public/source/literature/page-06.jpg","ph":false,"jx":"答案 B。《五猖会》中父亲要求背的是**《鉴略》**，不是《千字文》。A 项《海底两万里》与尼摩船长、C 项鲁迅对《昆虫记》的评价、D 项保尔撒烟灰被开除（时年十二岁），均无误。"},{"s":"文学常识与名著","sid":"literature","n":34,"id":"literature-34","tag":"专题四","t":"选择题","stem":"34. 下列有关文学常识和名著阅读的表述，正确的一项是 ( )\nA. “是日更定矣”中的“更定”,指晚上八时左右。更，古代夜间的计时单位，一夜分为五更，每更\n约两小时。\nB. 《钢铁是怎样炼成的》《红星照耀中国》《昆虫记》的作者分别是苏联作家尼古拉·奥斯特洛夫斯\n基、英国记者埃德加·斯诺、法国昆虫学家法布尔。\nC. 唐僧师徒四人去西天取经，路遇火焰山受阻。 为过火焰山，孙悟空变作牛魔王的模样从铁扇公主\n手中骗来芭蕉扇。牛魔王知道真相后，采用相同的办法，变成沙僧的样子，又从孙悟空手中骗回\n了扇子。\nD. 除夕是农历旧年的最后一夜，又叫“团圆夜”,有吃团圆饭、吃饺子、守岁等习俗；春节是农历新\n年的第一天，俗称“过年”,有贴春联、拜年、吃元宵等习俗。","ans":"A","img":"../public/question-crops/literature/literature-34.webp","aimg":"","src":"../public/source/literature/page-06.jpg","ph":false,"jx":"答案 A。「更定」课本注为晚上八时左右，一夜五更、每更约两小时。B 错：《红星照耀中国》作者斯诺是**美国**记者；C 错：牛魔王变成的是**猪八戒**的样子骗回芭蕉扇，不是沙僧；D 错：「吃元宵」属**元宵节**（正月十五）习俗，不属春节习俗。"},{"s":"文学常识与名著","sid":"literature","n":35,"id":"literature-35","tag":"专题四","t":"选择题","stem":"35. 下列关于文学文化常识的说法不正确的一项是 ( )\nA. “铭、说、记、表”等都是文体的标志，无论叙事、抒情、写景，都是为了表达观点。\nB. “风骚”本指《诗经》中的《国风》和屈原的《离骚》,后来泛指文学。\nC. 对联是我国传统文化的瑰宝，上联尾字用仄声，下联尾字用平声是最基本的定则。\n\nD. 中国传统戏曲脸谱的各种颜色有不同的代表意义，如关公的红色脸谱代表忠义。","ans":"A","img":"../public/question-crops/literature/literature-35.webp","aimg":"","src":"../public/source/literature/page-06.jpg","ph":false,"jx":"答案 A。「无论叙事、抒情、写景，都是为了表达观点」把文体功能说死了——「记」以记叙写景为主（如《小石潭记》），并不都以议论说理为目的。B 项「风骚」释义、C 项对联仄起平收、D 项红脸关公表忠义，均无误。"},{"s":"文学常识与名著","sid":"literature","n":36,"id":"literature-36","tag":"专题四","t":"选择题","stem":"36. 下列关于文学文化常识的表述不正确的一项是 ( )\nA. 古代对于不同的年龄有相应的不同的称呼，如：豆蔻——女子十三四岁，弱冠—男子二十岁左 右，花\n甲——六十周岁。\nB. 孟子，名轲，儒家学派的代表人物之一，地位仅次于孔子，与孔子并称“孔孟”。宣扬“仁政”, 最早提\n出“民贵君轻”的思想。\nC. 《战国策》是一部国别体史书，《邹忌讽齐王纳谏》《周亚夫军细柳》两篇课文都出自于这部 史书。\nD. 郦道元《三峡》中“每至晴初霜旦，林寒涧肃……哀转久绝”所描写的应该是霜降至立冬节气之间 的景物。","ans":"C","img":"../public/question-crops/literature/literature-36.webp","aimg":"","src":"../public/source/literature/page-07.jpg","ph":false,"jx":"答案 C。《周亚夫军细柳》选自**《史记》**（司马迁），不是《战国策》；出自《战国策》的是《邹忌讽齐王纳谏》。A 项豆蔻、弱冠、花甲诸称、B 项孟子「民贵君轻」、D 项三峡写霜降至立冬之景，均无误。"},{"s":"文学常识与名著","sid":"literature","n":37,"id":"literature-37","tag":"专题四","t":"选择题","stem":"37 下列关于名著的说法正确的一项是 ( )\nA. 艾青作品里常出现的“光明”是中国必胜信念的象征，埃德加·斯诺的传记小说《红星照耀中国》 向全世\n界宣告：毛泽东就是那颗给全中国带来光明的闪亮红星。\nB. 吴承恩根据玄奘出游的传说虚构了西天取经的故事；儒勒·凡尔纳把潜水艇想象成“诺第留斯号” 船，虚\n构了它在大海航行中遭遇种种惊险的故事。\nC. 《简·爱》中的简·爱和《骆驼祥子》中的虎妞都经历了生活中的磨难，但是依然人格独立，心灵 强大，\n具有强烈的反抗精神，敢于追求自由与平等。\nD. 《儒林外史》的讽刺手法很有特点：它将讽刺的锋芒隐藏在耐人寻味的细节中，通过夸张的描写， 鞭挞丑\n恶，揭露虚伪。","ans":"D","img":"../public/question-crops/literature/literature-37.webp","aimg":"","src":"../public/source/literature/page-07.jpg","ph":false,"jx":"答案 D。《儒林外史》的讽刺锋芒确实藏在含而不露的细节里，靠夸张描写鞭挞丑恶——这是它最突出的艺术特点。A 错：《红星照耀中国》是**纪实作品（报告文学）**，不是「传记小说」；C 错：虎妞并不「人格独立、追求自由平等」，她好逸恶劳、控制欲极强。"},{"s":"文学常识与名著","sid":"literature","n":38,"id":"literature-38","tag":"专题四","t":"选择题","stem":"38. 下列有关名著和文化常识的表述，不正确的一项是 ( )\nA. 鲁迅的《朝花夕拾》描述往事，既有温情与童趣，又夹杂着犀利的批判。\nB. 吴敬梓《儒林外史》主要写明清时期读书人及官绅的活动和精神面貌。\nC. 苏东坡的主要功绩是使词依附于音乐，成为一种新型的独立抒情工具。\nD. 律诗是近体诗的一种，每句五个字或七个字，简称“五律”或“七律”。","ans":"C","img":"../public/question-crops/literature/literature-38.webp","aimg":"","src":"../public/source/literature/page-07.jpg","ph":false,"jx":"答案 C。苏轼的贡献是让词**摆脱**对音乐的依附、成为独立的抒情诗体（「以诗为词」），选项说成「使词依附于音乐」，方向反了。A 项《朝花夕拾》、B 项《儒林外史》写明清士林、D 项律诗常识，均无误。"},{"s":"文学常识与名著","sid":"literature","n":39,"id":"literature-39","tag":"专题四","t":"选择题","stem":"39. 下列有关文学文化常识的表述，错误的一项是 ( )\nA. 古代有许多特定年龄的别称，如“弱冠”是指男子20岁时束发加冠，举行加冠礼，表示已经成年。 “耄耋”\n指八九十岁。\nB. 科举考试中的“乡试”,是每三年举行一次全省的考试，秀才才有资格参加，考中为举人。《范进 中举》\n中的范进就是参加乡试而中为举人。\nC. 《我的叔叔于勒》的作者莫泊桑，是法国优秀的批判现实主义作家。他与俄国的屠格涅夫、美国的 欧·亨\n利并称为“世界三大短篇小说之王”。\nD. 铭，古代刻在器物上用来警诫自己或者称述功德的文字，后来成为一种文体，这种文体一般是用韵 的。唐\n代刘禹锡的《陋室铭》就是用韵的。","ans":"C","img":"../public/question-crops/literature/literature-39.webp","aimg":"","src":"../public/source/literature/page-07.jpg","ph":false,"jx":"答案 C。与莫泊桑并称「世界三大短篇小说之王」的是**俄国的契诃夫和美国的欧·亨利**，不是屠格涅夫（屠格涅夫以长篇小说著称）。A 项弱冠、耄耋、B 项乡试与范进中举、D 项「铭」的文体与《陋室铭》，均无误。"},{"s":"文学常识与名著","sid":"literature","n":40,"id":"literature-40","tag":"专题四","t":"选择题","stem":"40. 下列有关文学名著内容的表述，错误的一项是 ( )\nA. 《西游记》中观音菩萨领如来法旨，在去东土寻找取经人的路上，先后收服沙悟净、猪悟能、小白 龙、孙悟\n空，为唐僧取经路上陆续收徒埋下了伏笔。\nB. 《骆驼祥子》中刘四爷因嫌弃祥子是个臭拉车的，并且怀疑祥子是因为贪图他的钱财而娶虎妞，在 寿诞之\n日与虎妞争吵至闹翻。\nC. 苏联作家奥斯特洛夫斯基在极度困难条件下，创作《钢铁是怎样炼成的》。作品塑造的保尔·柯 察金这\n个青年英雄形象，激励了一代又一代青年向善向美。\nD. 《简·爱》中罗切斯特与简·爱互诉衷肠的情形是全书最感人的篇章之一。罗切斯特拐弯抹角地 试探简·\n爱的心思，而简·爱则极力维护自己做人的尊严，最终导致简·爱没能接受罗切斯特的 爱情。","ans":"D","img":"../public/question-crops/literature/literature-40.webp","aimg":"","src":"../public/source/literature/page-07.jpg","ph":false,"jx":"答案 D。《简·爱》的结局是简·爱**最终接受了**罗切斯特的爱情（庄园焚毁、罗切斯特失明后二人结合），并非「没能接受」。A 项观音东行途中先后点化沙悟净、猪悟能、小白龙、孙悟空（第 8 回）、B 项刘四爷与虎妞闹翻、C 项奥斯特洛夫斯基的创作经历，均无误。"},{"s":"文学常识与名著","sid":"literature","n":41,"id":"literature-41","tag":"专题四","t":"自评题","stem":"41. 下列有关名著的表述正确的两项是 ( )\nA. 《西游记》中悟空经常称八戒是“呆子”,其实“呆子”有时候也不呆，比如猪八\n戒义激猴王，让 他重回取经队伍智降妖怪。\nB. 《骆驼祥子》中，虎妞大胆泼辣但有点变态，敢于追求幸福却又好逸恶劳，控制欲\n极强，她难产而 死是祥子走向堕落的根本原因。\nC. 《钢铁是怎样炼成的》中保尔永不言败，意志如钢铁般坚强，但他也有温情的一面，\n比如书中写到 他的亲情、恋情、友情等。\nD. 《水浒传》中吴用、宋江、刘唐等人采用了激将法，激林冲火并了心胸狭隘的王伦，\n随后大家便尊 推宋江坐上了第一把交椅。","ans":"AC","img":"../public/question-crops/literature/literature-41.webp","aimg":"","src":"../public/source/literature/page-08.jpg","ph":false,"jx":"答案 AC。B 错：虎妞难产而死是打击，但祥子堕落的**根本原因是黑暗的社会**；D 错：激林冲火并王伦的是吴用等人，被尊推坐上第一把交椅的是**晁盖**（此时宋江尚未上梁山）。A 项猪八戒义激猴王、C 项保尔的温情面，均正确。"},{"s":"文学常识与名著","sid":"literature","n":42,"id":"literature-42","tag":"专题四","t":"选择题","stem":"42. 下列关于古代文化、文学常识的表述完全正确的一项是 ( )\nA. 古人对年龄有特定称谓，按照从小到大的顺序依次为垂髫、弱冠、束发、而立、花\n甲、知命、古稀 等；对官职的升迁也有特定称谓，“谪”“左迁”“放”属于降低\n官职。\nB. “大漠孤烟直，长河落日圆”中“河”指“黄河”,“岱宗夫如何?齐鲁青未了”中\n“岱宗”指“泰 山”,“城阙辅三秦，风烟望五津”中“三秦”指“关中地区”。\nC. 《史记》是我国第一部纪传体通史，被鲁迅誉为“史家之绝唱，无韵之《离骚》”;\n《诗经》是我 国最早的一部诗歌总集，也称“诗三百”,它与《中庸》《孟子》《大\n学》合称“四书”。\nD. “一门父子三词客，千古文章四大家。”苏轼既是“三词客”之一，又是“四大家”\n成员，他的 《破阵子·为陈同甫赋壮词以寄之》《水调歌头》成为千古流传的名篇。","ans":"B","img":"../public/question-crops/literature/literature-42.webp","aimg":"","src":"../public/source/literature/page-08.jpg","ph":false,"jx":"答案 B。B 项三处文化常识（「河」指黄河、岱宗指泰山、三秦指关中）全部正确。A 错：年龄顺序中**束发（十五岁）应在弱冠（二十岁）之前**；C 错：与《中庸》《孟子》《大学》合称「四书」的是**《论语》**，《诗经》属「五经」；D 错：《破阵子·为陈同甫赋壮词以寄之》作者是**辛弃疾**。"},{"s":"文学常识与名著","sid":"literature","n":43,"id":"literature-43","tag":"专题四","t":"选择题","stem":"43. 下列有关名著内容的表述，完全正确的一项是 ( )\nA. 《红星照耀中国》曾易名《西行漫记》,小说从多个方面展示中国共产党为民族解\n放而艰苦奋斗、 牺牲奉献的崇高精神。\nB. 夏洛蒂·勃朗特的代表作《简·爱》讲述了贫苦孤女简·爱为寻求人格独立、爱情\n和尊严而挣扎奋 斗的故事，最终她与罗切斯特分道扬镳。\nC. 《儒林外史》没有贯穿全书的中心人物和主要情节，小说将讽刺的锋芒隐藏在含而\n不露、耐人寻味 的叙述中，寥寥数语便将人物形象和世俗风貌描摹得形神兼备、入\n木三分。\nD. 《水浒传》中人物形象栩栩如生，各具特色。林冲武艺高强有勇有谋，是个侠义之\n士，他醉打蒋门 神、大闹飞云浦，有仇必复，有恩必报。","ans":"C","img":"../public/question-crops/literature/literature-43.webp","aimg":"","src":"../public/source/literature/page-08.jpg","ph":false,"jx":"答案 C。《儒林外史》没有贯穿全书的主角，讽刺锋芒藏在耐人寻味的叙述中，寥寥数语写尽人物与世俗——此说准确。A 错：《红星照耀中国》是纪实作品，不是「小说」；B 错：简·爱最终与罗切斯特**结合**，不是分道扬镳；D 错：「醉打蒋门神」「大闹飞云浦」的是**武松**。"},{"s":"文学常识与名著","sid":"literature","n":44,"id":"literature-44","tag":"专题四","t":"选择题","stem":"44. 下列关于文学名著的表述，不正确的一项是 ( )\nA. 埃德加·斯诺在《红星照耀中国》中，客观地记录了中国共产党人的真实生活，首\n次向全世界报道 了中国工农红军长征这一举世无双的“军事壮举”。\nB. 吴敬梓的《儒林外史》由众多故事连缀而成，小说通过刻画奔走于科举道路上的众\n多士人形象，对 封建科举制度和整个封建社会的“儒林”作了深刻的批判。\nC. 《红岩》中，叛徒甫志高假冒共产党员潜入刘公馆，前来了解刘思扬在狱中的表现，\n并要他详细汇 报狱中地下党的情况。刘思扬识破了他的伪装，亲手将他击毙。\nD. 《创业史》中，梁生宝在解放前夕辛苦一年的收获，全被地租高利贷压榨净了；解\n放后，他成了互 助组和贫雇农的骨干，带领大家一起创业，终于取得了成功。","ans":"C","img":"../public/question-crops/literature/literature-44.webp","aimg":"","src":"../public/source/literature/page-08.jpg","ph":false,"jx":"答案 C。潜入刘公馆、冒充进步青年的是特务**郑克昌**（甫志高是叛变后带特务抓人的叛徒），且刘思扬并未亲手击毙他。A 项斯诺与长征报道、B 项《儒林外史》对科举与士林的批判、D 项《创业史》梁生宝，均无误。"},{"s":"文学常识与名著","sid":"literature","n":45,"id":"literature-45","tag":"专题四","t":"选择题","stem":"45. 下列有关文学、文化知识的表述不正确的一项是 ( )\nA. 儒家经典《周易大传》中“天行健，君子以自强不息”“地势坤，君子以厚德载物”\n这两句话凝结 了中国文化传统的基本精神。\nB. 明清的科举制度中，全省的考试一般称为“乡试”,考中者为举人，第一名称“解\n元”。《范进中 举》一文中，范进参加的就是乡试。\nC. 我国四大古典文学名著中塑造了一些足智多谋的军师形象，如《水浒传》中人称“\n智多星”的吴 用、《三国志》中号称“卧龙”的诸葛亮。\n\nD. 《格列佛游记》中的格列佛遇到的小人国国王贪婪、残忍，大人国国王贤明正直。","ans":"C","img":"../public/question-crops/literature/literature-45.webp","aimg":"","src":"../public/source/literature/page-08.jpg","ph":false,"jx":"答案 C。错在「《三国志》」——「卧龙」诸葛亮是**《三国演义》**（四大古典名著之一）中的人物；《三国志》是史书，不在四大名著之列。A 项《周易大传》两句名言、B 项乡试解元与范进中举、D 项小人国国王贪婪残忍，均无误。"},{"s":"文学常识与名著","sid":"literature","n":46,"id":"literature-46","tag":"专题四","t":"选择题","stem":"46. 下列对《水浒传》中人物的评价，正确的一项是 ( )\nA. 鲁达谦逊深沉，是《水浒传》中难以捉摸的人物。\nB. 林冲足智多谋，是《水浒传》中不可多得的智者。\nC. 李逵性情急躁，是《水浒传》中有勇无谋的典型。\nD. 吴用桀骜不驯，是《水浒传》中鲁莽刚烈的代表。","ans":"C","img":"../public/question-crops/literature/literature-46.webp","aimg":"","src":"../public/source/literature/page-09.jpg","ph":false,"jx":"答案 C。李逵性情急躁、有勇无谋，是水浒中最典型的莽汉形象。A 错：鲁达豪爽粗直，「谦逊深沉、难以捉摸」说的是吴用一类人；B 错：林冲以隐忍著称，「足智多谋的智者」是吴用；D 错：「桀骜不驯、鲁莽刚烈」是李逵、鲁智深的特征，吴用沉稳多谋。"},{"s":"文学常识与名著","sid":"literature","n":47,"id":"literature-47","tag":"专题四","t":"选择题","stem":"47. 下列关于名著内容表述正确的一项是 ( )\nA. 《钢铁是怎样炼成的》讲述了主人公奥斯特洛夫斯基从不懂事的少年最终成为一名钢铁般战士的\n故事。\nB. 《傅雷家书》是傅雷夫妇在1954年到1966年写给父母的家信摘编。\nC. 《格列佛游记》以主人公格列佛的四次航海冒险经历为线索，揭露并批判了日本统治阶级的腐败和\n罪恶。\nD. 《艾青诗选》涵盖了诗人艾青各个时期的重要作品，艾青的作品主要描写土地、太阳、火把、黎明\n等具有象征意味的事物。","ans":"D","img":"../public/question-crops/literature/literature-47.webp","aimg":"","src":"../public/source/literature/page-09.jpg","ph":false,"jx":"答案 D。艾青诗选中反复出现土地、太阳、火把、黎明等象征性意象，这是他创作的核心特征。A 错：《钢铁是怎样炼成的》主人公是**保尔·柯察金**，奥斯特洛夫斯基是作者；B 错：《傅雷家书》是傅雷夫妇写给**儿子傅聪等**的家信，不是写给父母；C 错：《格列佛游记》批判的是**英国**统治阶级，不是日本。"},{"s":"文学常识与名著","sid":"literature","n":48,"id":"literature-48","tag":"专题四","t":"自评题","stem":"48. 阅读《水浒传》选段，完成问题。\n且说① (A. 蔡京 B. 高俅)得做了殿帅府太尉，选择吉日良辰，去殿帅府里到任。所有\n一应合属公使衙将，都军禁军，马步人等，尽来参拜，各呈手本，开报花名。高殿帅一一点过。于\n内只欠一名八十万禁军教头② (A.王进 B. 林冲)。 半月之前，已有病状在官，患病未痊，\n不曾入衙门管事。高殿帅大怒，喝道：“胡说?既有手本呈来。却不是那厮抗拒官府，搪塞下\n官。此人即系推病在家。快与我拿来。”\n(1)①②两处的人物分别是指 ① ② 。(填写人名)\n(2)选文中殿帅认为“那厮抗拒官府，搪塞下官”的真正原因是 ( )\nA. 自己的干儿子曾被教头教训而怀恨在心\nB. 教头没有给自己送“孝敬银子”而怀恨在心\nC. 当年自己找教头的父亲比武却被打败而怀恨在心","ans":"（1）①高俅 ②王进 （2）C","img":"../public/question-crops/literature/literature-48.webp","aimg":"","src":"../public/source/literature/page-09.jpg","ph":false,"jx":"答案：（1）①**高俅** ②**王进**；（2）**C**。选文出自《水浒传》第二回「王教头私走延安府」：高俅发迹做了殿帅府太尉，八十万禁军教头王进因病未到衙参拜，高俅大怒要拿他。真正的缘由是当年高俅未发迹时与王进的父亲**王升**比武，被王升一棒打翻，高俅怀恨在心，如今借机报复——这正是选项 C。A 项「干儿子被教头教训」是林冲与高衙内的关系，B 项「没送孝敬银子」于文无据。"},{"s":"文学常识与名著","sid":"literature","n":49,"id":"literature-49","tag":"专题四","t":"自评题","stem":"49. 根据名著内容填空。\n名著中有许多鲜活的孩子形象。那个自幼随母亲投奔外祖父，后来因为染坏了一匹布，竟被外祖\n父打得昏死过去的男孩是 (填人名);那个因反抗表哥殴打，被舅妈关进红房子，后来去了洛\n伍德学校的女孩是 (填人名)。","ans":"阿廖沙；简·爱","img":"../public/question-crops/literature/literature-49.webp","aimg":"","src":"../public/source/literature/page-09.jpg","ph":false,"jx":"答案：**阿廖沙**；**简·爱**。前一空出自高尔基《童年》：阿廖沙随母亲投奔外祖父，因染坏桌布被外祖父毒打；后一空出自《简·爱》：简·爱反抗表哥约翰·里德的殴打，被舅妈里德太太关进红房子，后来被送进洛伍德学校。"},{"s":"文学常识与名著","sid":"literature","n":50,"id":"literature-50","tag":"专题四","t":"自评题","stem":"50. 走近名著。\n文学名著中的人物，往往具有多面性。从下面三个人物中任选一个，结合相关情节进行分析。\nA. 祥子 B. 唐僧 C.林冲\n示例：周瑜——足智多谋，才华横溢，如在赤壁之战中，运筹帷幄，指挥若定，大胜曹操；但又心胸狭\n窄，嫉妒诸葛亮的才华，竟发出“既生瑜何生亮”的感慨。","ans":"示例：林冲——武艺高强，救弱济贫，如在东京为官时，同情百姓，具有正义感，免将李小二送官司；但又逆来顺受，一味地委曲求全，面对妻子被调戏只是忍气吞声，最终惨遭陷害。","img":"../public/question-crops/literature/literature-50.webp","aimg":"","src":"../public/source/literature/page-09.jpg","ph":false,"jx":"答案：示例见参考答案（林冲）。此类题的作答要领是「一句定评＋两处情节对照」：先说人物的正面品质并举情节，再说其局限并举情节，形成「多面性」。如林冲：武艺高强、救弱济贫（在东京为官时同情百姓、救护李小二）；却又逆来顺受、委曲求全（妻子遭高衙内调戏仍忍气吞声，最终被陷害发配）。若选祥子：勤劳坚韧、要强上进（三年攒钱买车），但结局麻木潦倒、自暴自弃。若选唐僧：意志坚定、目标明确（西行路上不改为取经之志），但有时善恶不分、懦弱怕事（如错怪孙悟空滥杀）。"},{"s":"文学常识与名著","sid":"literature","n":51,"id":"literature-51","tag":"专题四","t":"自评题","stem":"51. 走近名著。\n(1)根据要求填空。\n“看看醉猫似的爸爸，看看自己， 看看两个饿得像老鼠似的弟弟，小福子只剩了哭。”这段文\n字出自作家 _之手。\n(2)下面关于名著内容的表述有误的一项是 ( )\nA. 《西游记》中的唐僧在五行山揭去如来佛的压帖，救出孙悟空。\n\nB. 《藤野先生》叙述了作者在仙台医专受日本学生歧视、侮辱和决定弃医从文的经过。\nC. 在荒岛上格列佛无法使独木舟下水，决定开一条运河，把水引到船底下来。\nD. 保尔·柯察金参加红军后英勇无畏，在战斗中光荣负伤，一只眼睛失明了。","ans":"（1）老舍（或：舒庆春） （2）C","img":"../public/question-crops/literature/literature-51.webp","aimg":"","src":"../public/source/literature/page-09.jpg","ph":false,"jx":"答案：（1）**老舍**（舒庆春）——这段写小福子一家，出自《骆驼祥子》；（2）**C**。C 项「在荒岛上无法使独木舟下水，决定开一条运河把水引到船底下来」是**鲁滨孙**的经历，不是格列佛——格列佛游的是小人国、大人国、飞岛国、慧骃国，没有荒岛造船情节。A 项五行山揭帖救悟空、B 项《藤野先生》弃医从文的起因、D 项保尔作战负伤失明，均无误。"},{"s":"文学常识与名著","sid":"literature","n":52,"id":"literature-52","tag":"专题四","t":"自评题","stem":"52. 走近名著。\n(1) 根据要求填空。\n他向我和蔼地说道：“你看，你将这条血管移了一点位置了。——自然，这样一移，的确比\n较的好看些，然而图不是美术，实物是那样的，我们没法改换它。现在我给你改好了，以后你要\n全照着黑板上那样的画。”\n这段文字出自《朝花夕拾》,选段中的“他”是\n(2)下面关于名著内容的表述有误的一项是 ( )\nA. 《红岩》中负责指挥所有军、警、宪、特工人员的是侦防处处长徐鹏飞，表面追求革命的黎纪\n纲和郑克昌都是特务。许云峰到沙坪书店检查工作，敏锐地发现了郑克昌的可疑之处。\nB. 《傅雷家书》凝聚了傅雷对祖国、对儿子深厚的爱。傅雷现身说法，教导儿子如何做人，如何\n做事，如何对待生活。\nC. 祥子拼命攒下的钱被孙侦探敲诈一空，买车的梦想再次化为泡影。\nD. 唐僧师徒取经路上降妖伏魔的故事有智擒红孩儿、智取生辰纲等。","ans":"（1）藤野先生（或：藤野严九郎、藤野） （2）D","img":"../public/question-crops/literature/literature-52.webp","aimg":"","src":"../public/source/literature/page-10.jpg","ph":false,"jx":"答案：（1）**藤野先生**（藤野严九郎）——选段写他给「我」改正血管图的错误；（2）**D**。D 项「智取生辰纲」是《水浒传》的情节，不在《西游记》中；唐僧师徒降妖伏魔的故事应为智擒红孩儿、三打白骨精、大战黄袍怪等。A 项《红岩》徐鹏飞与郑克昌、许云峰沙坪书店发现可疑、B 项《傅雷家书》、C 项孙侦探敲诈祥子，均无误。"},{"s":"文学常识与名著","sid":"literature","n":53,"id":"literature-53","tag":"专题四","t":"自评题","stem":"53. 走近名著。\n(1) 根据要求填空。\n他经受了这初次的打击，正如他在学习拳击时经受了朱赫来初次的打击一样：当时他虽然倒\n下去，可是立刻就站了起来。\n这段文字出自《钢铁是怎样炼成的》,选段中的“他”是\n(2)下面关于名著内容的表述正确的一项是 ( )\nA. 《名人传》中，贝多芬“惟其痛苦，才有快乐”这句充满豪情的名言，正是他一生的写照，今\n天已成为勇敢者的座右铭。\nB. 父亲给鲁迅买来渴求已久的《山海经》,使他充满了感激与尊敬。\nC. 在小人国里，格列佛犹如一只渺小的蚂蚁，可以任人踩踏。\nD. 孙悟空在无奈之下，请求观音菩萨帮助，擒住牛魔王，最终找回袈裟。","ans":"（1）保尔（或：保尔·柯察金） （2）A","img":"../public/question-crops/literature/literature-53.webp","aimg":"","src":"../public/source/literature/page-10.jpg","ph":false,"jx":"答案：（1）**保尔**（保尔·柯察金）——选段写他受朱赫来拳击的往事，出自《钢铁是怎样炼成的》；（2）**A**。A 项贝多芬「惟其痛苦，才有快乐」一语确为他一生的写照。B 错：给鲁迅买来《山海经》的是**长妈妈**，不是父亲；C 错：在小人国里格列佛是**巨人**（小人国人身高不足六英寸），「渺小的蚂蚁」是在大人国；D 错：孙悟空请观音收服的是**黑风山黑熊精**（夺锦襕袈裟的妖怪），不是牛魔王。"},{"s":"文学常识与名著","sid":"literature","n":54,"id":"literature-54","tag":"专题四","t":"自评题","stem":"54. 走近名著。\n(1) 根据下面提供的信息，写出对应的作品。\n①面圆且大、鼻直口方、身长八尺、腰阔十围\n②大闹五台山\n③爱憎分明，见义勇为，扶危济困，疾恶如仇\n作品：\n(2)下面关于名著内容的表述有误的一项是 ( )\nA. 《骆驼祥子》真实地描绘了北平城里一个人力车夫的悲惨命运。\nB. 《水浒传》中宋江因长得黑，有孝名，被人称为“孝义黑三郎”。\nC. 《名人传》包括《贝多芬传》《米开朗琪罗传》《托尔斯泰传》。\nD. 《钢铁是怎样炼成的》这部著作的主人公是奥斯特洛夫斯基。","ans":"（1）《水浒传》 （2）D","img":"../public/question-crops/literature/literature-54.webp","aimg":"","src":"../public/source/literature/page-10.jpg","ph":false,"jx":"答案：（1）**《水浒传》**——「面圆耳大、鼻直口方、身长八尺、腰阔十围」「大闹五台山」「爱憎分明、见义勇为」三条信息都指向鲁智深；（2）**D**。D 项《钢铁是怎样炼成的》主人公是**保尔·柯察金**，奥斯特洛夫斯基是作者，两者不能混为一谈。A 项《骆驼祥子》写北平人力车夫、B 项宋江「孝义黑三郎」、C 项《名人传》三传，均无误。"},{"s":"文学常识与名著","sid":"literature","n":55,"id":"literature-55","tag":"专题四","t":"自评题","stem":"55. 走近名著。\n(1)根据要求填空。\n两匹马走到我跟前，仔细地端详我的脸和手。那匹灰色马用右前蹄摸了一圈我的礼帽，弄得\n它不成样子，我只得摘下来整理一下重新戴好。它和它的伙伴(一匹栗色马)见此更加惊讶了。\n这段文字出自名著《________》。\n\n(2)下面关于名著的表述有误的一项是 (\nA. 《水浒传》中的鲁达个性鲜明，他拳打镇关西、大闹野猪林，尽显疾恶如仇、有勇有谋的英雄本色。\nB. 《名人传》分别叙述 了 德 国 的 贝 多 芬 、意大利的米开朗琪罗、俄国的列夫·托尔斯泰三人伟大\n而坎坷的一生。\nC. 《格列佛游记》讲述的是英国船医格列佛因海难等原因流落到小人国、大人国和宝象国等地的\n经历。\nD. 《骆驼祥子》的主人公祥子来到北平后，当上了人力车夫。他省吃俭用地拼了三年，买了第一\n辆车。","ans":"（1）《格列佛游记》 （2）C","img":"../public/question-crops/literature/literature-55.webp","aimg":"","src":"../public/source/literature/page-10.jpg","ph":false,"jx":"答案：（1）**《格列佛游记》**——两匹马（灰色马与栗色马）端详格列佛，是慧骃国中的情节；（2）**C**。C 项错在「宝象国」——《格列佛游记》中格列佛游历的是小人国、大人国、飞岛国、慧骃国；宝象国是《西游记》中的国家。A 项鲁达拳打镇关西与大闹野猪林、B 项《名人传》三位传主、D 项祥子省吃俭用三年买第一辆车，均无误。"},{"s":"文学常识与名著","sid":"literature","n":56,"id":"literature-56","tag":"专题四","t":"自评题","stem":"56. 阅读《骆驼祥子》选段，根据要求填空。\n(1)“不喝就滚出去!好心好意，不领情是怎着? 你个傻骆驼!辣不死你!连我还能喝四两呢，\n不信，你看看!”她把酒盅端起来，灌了多半盅，一闭眼，哈了一声，举着盅儿：“你喝!要不\n我揪耳朵灌你!”\n(2)人间的真话本来不多，一个女子的脸红胜过一大片话：这祥子也明白了她的意思，在他的眼里，\n她是个最美的女子。美在骨头里，就是她满身都长了疮，把皮肉都烂掉，在他心中她依然很美。\n她美，她年轻，她要强，她勤俭。假若祥子想再娶，她是个理想的人。他并不想马上就续娶，\n他顾不得想任何的事。可是她既然愿意，而且是因为生活的压迫不能不马上提出来，他似乎没有\n法子拒绝。\n上述语段(1)中的“她”是 (人名),小说刻画了她 _的性格特点(至少答\n出两点);语段(2)中的“她”是 (人名),小说中她最终的结局是","ans":"虎妞；好逸恶劳、粗俗刁泼；小福子；上吊自杀了","img":"../public/question-crops/literature/literature-56.webp","aimg":"","src":"../public/source/literature/page-12.jpg","ph":false,"jx":"答案：**虎妞**；**好逸恶劳、粗俗刁泼**（答「泼辣粗俗、有心计、控制欲强」亦可）；**小福子**；**上吊自杀**。语段（1）「傻骆驼」「辣不死你」「揪耳朵灌你」是虎妞灌祥子喝酒时的口吻，粗俗泼辣、好逸恶劳正是她的标签；语段（2）「她美，她年轻，她要强，她勤俭」指小福子，她最终不堪屈辱在树林里上吊自尽。"},{"s":"文学常识与名著","sid":"literature","n":57,"id":"literature-57","tag":"专题四","t":"自评题","stem":"57. 阅读名著片段，回答问题。\n①我身边的人都听见了远处的笛声，听到了牧童的歌唱，而我什么也听不见，这对我是何等的羞\n辱啊!为此，我痛苦不堪，陷入了绝望之中，甚至想到了自杀。可是，我没有去死，是艺术最终留\n住了我的生命。我想在还没有把艺术使命完成之前，我还不能离开这个世界。于是，我就开始忍耐\n这种悲惨的生活。尽管，身体的一点变化都有可能损坏我的健康，我还是要坚持下去，直到死神最终\n割断我的生命线为止。\n②两周前看完《卓别林自传》,对1920至1954年间的美国有了一个初步认识，那种物质文明给\n人的影响，确非我们意料所及。一般大富翁的穷奢极欲，我实在体会不出有什么乐趣可言。那种哄\n闹取乐的玩意儿，宛如五花八门、光怪陆离的万花筒，在书本上看看已经头晕目迷，更不用说亲自经\n历了。像我这样，简直一天都受不了：不仅心理上憎厌，生理上、神经上也吃不消。\n(1)片段①中的“我”是指 ，片段②中的“我”是指 。\n(2)阅读以上材料后，你从中得到了哪些启示?","ans":"（1）贝多芬；傅雷 （2）①要勇敢面对命运的挑战；②要坚持对梦想的追求；③要抵制物质的诱惑。","img":"../public/question-crops/literature/literature-57.webp","aimg":"","src":"../public/source/literature/page-12.jpg","ph":false,"jx":"答案：（1）**贝多芬**；**傅雷**。片段①「我身边的人都听见了远处的笛声……而我什么也听不见」是贝多芬失聪后的自述；片段②读《卓别林自传》后的感慨，出自傅雷的文字（《傅雷家书》）。启示（任答两点）：勇敢面对命运的挑战；坚持对梦想与艺术的追求；抵制物质的诱惑，保持精神的清醒。"},{"s":"文学常识与名著","sid":"literature","n":58,"id":"literature-58","tag":"专题四","t":"自评题","stem":"58. 名著阅读。\n“洒家今日不曾多带得些出来；你有银子，借些与俺，洒家明日便送还你。”\n“直甚么,要哥哥还!”遂去包裹里取出一锭十两银子放在桌上。\n句中的“洒家”指的是 ，“你”指的是 。","ans":"鲁智深（或：鲁达、鲁提辖、花和尚）；史进（九纹龙）","img":"../public/question-crops/literature/literature-58.webp","aimg":"","src":"../public/source/literature/page-12.jpg","ph":false,"jx":"答案：**鲁智深**（鲁达、鲁提辖、花和尚均可）；**史进**（九纹龙）。「洒家」是鲁智深的自称；这段是《水浒传》第三回潘家酒楼中鲁达向史进借钱，准备周济金氏父女的情节，史进「去包裹里取出一锭十两银子放在桌上」，显出他仗义疏财。"},{"s":"文学常识与名著","sid":"literature","n":59,"id":"literature-59","tag":"专题四","t":"自评题","stem":"59. 名著阅读。\n选段一 牌局散了，太太叫他把客人送回家。两位女客急于要同时走，所以得另雇一辆车。祥子喊\n来一辆，大太太撩袍拖带的浑身找钱，预备着代付客人的车资；客人谦让了两句，大太太仿佛要拼命\n似的喊：“你这是怎么了，老妹子! 到了我这儿啦，还没个车钱吗!老妹子!坐上啦!”她到这时候，才摸出来一毛钱。\n\n选段二 我常坐老王的三轮。他蹬，我坐， 一路上我们说着闲话。\n据老王自己讲：北京解放后，蹬三轮的都组织起来；那时候他 “脑袋慢”,“没绕过来”,“晚\n了一步”,就“进不去了”。他感叹自己“人老了，没用了”。\n( 1 ) 选 段 一 是 祥 子 给 拉 包 车 的 一 个 情 节 ； 选 段 二 中 的 “我” 是\no\n(2)祥子与老王都有着令人同情的命运，根据原著简要概括祥子在这家拉包车时的遭遇。","ans":"（1）杨家（或：杨先生、杨宅）；杨绛 （2）被当作佣人，做了许多额外的家务，还被辱骂。","img":"../public/question-crops/literature/literature-59.webp","aimg":"","src":"../public/source/literature/page-12.jpg","ph":false,"jx":"答案：（1）**杨家**（杨先生、杨宅）；**杨绛**——选段二出自杨绛的《老王》。（2）祥子在杨家拉包车时，不但要拉车，还被当作佣人使唤，做许多额外家务（挑水、扫院子、买菜、带孩子等），稍有不合便遭辱骂，工钱也未曾如约给付。这段经历让祥子初次尝到「给人做工」的屈辱。"},{"s":"文学常识与名著","sid":"literature","n":60,"id":"literature-60","tag":"专题四","t":"自评题","stem":"60. 名著阅读。\n《水浒传》(一百回本)第六十六回：时迁火烧翠云楼，吴用智取 A (地名)。\n梁中书见不是头势，带领随行伴当，飞奔南门。南门传说道： “一个胖大和尚 B (人名)抡动\n铁禅杖，一个虎面行者，掣出双戒刀，发喊杀入城来。”…… C (人名)浑身脱剥，睁圆怪眼，咬\n定牙根，手搦双斧，从城濠里飞杀过来 ……只见左手下杀声震响，火把 丛中军马无数，却是大刀\nD (人名),拍动赤兔马，手舞青龙刀，径抢梁中书。\nA. B. C. D.","ans":"A.大名府 B.鲁智深（或：鲁提辖） C.李逵 D.关胜","img":"../public/question-crops/literature/literature-60.webp","aimg":"","src":"../public/source/literature/page-14.jpg","ph":false,"jx":"答案：A.**大名府** B.**鲁智深**（鲁提辖） C.**李逵** D.**关胜**。回目为「时迁火烧翠云楼，吴用智取大名府」；「胖大和尚」抡铁禅杖是鲁智深，「虎面行者」掣双戒刀是武松，「浑身脱剥、手搦双斧」是李逵，「拍动赤兔马、手舞青龙刀」是大刀关胜。"},{"s":"文学常识与名著","sid":"literature","n":61,"id":"literature-61","tag":"专题四","t":"自评题","stem":"61. 名著阅读。\n“好姑娘，你别担心，我可不会这么容易就进棺材的。我还要活下去，哪怕有意跟那些医学权威\n的预言捣捣蛋也好嘛。他们对我病情的诊断完全正确，但是写个证明，说我百分之百失去了劳动能\n力，那就大错特错了。 我们走着瞧吧 !”\n这段文字出自《________》, 文中的“好姑娘”是指________。","ans":"《钢铁是怎样炼成的》；达雅","img":"../public/question-crops/literature/literature-61.webp","aimg":"","src":"../public/source/literature/page-14.jpg","ph":false,"jx":"答案：**《钢铁是怎样炼成的》**；**达雅**。这段话是保尔在重病中说给妻子达雅的——医生判定他失去了劳动能力，他却决意「活下去」，继续与命运抗争。「好姑娘」即达雅。"},{"s":"文学常识与名著","sid":"literature","n":62,"id":"literature-62","tag":"专题四","t":"自评题","stem":"62. 名著阅读。\n(1)关于名著《海底两万里》,下列描述不正确的一项是 ( )\nA. 尼摩是个不明国籍的神秘人物，他会说多国语言。他是个了不起的科学家，设计并建造了超乎\n人们想象的“鹦鹉螺”号潜艇。\nB. 科幻小说《海底两万里》主要讲述法国生物学家阿龙纳斯跟随尼摩船长乘坐诺第留斯号潜艇，\n在海底做了两万里环球旅行的故事。\nC. 凡尔纳没有到过海底，却把海底的景色写得如此生动，使读者如临其境。\nD. “鹦鹉螺”号潜艇从太平洋出发，尼摩他们经历了很多险情。曾在印度洋遭遇巨型章鱼，在红\n海又击儒艮，在大西洋肉搏鲨鱼等。\n(2)请列举一部有冒险经历的名著并写出作者，简要概述其中一个能体现这种经历的故事情节。(《海\n底两万里》除外)","ans":"（1）D （2）示例：《格列佛游记》作者：乔纳森·斯威夫特（或：斯威夫特）。故事情节：利立浦特王宫女官因看传奇小说时睡着了，导致皇后寝宫失火，水源不在近处，吊桶太小，虽然那些人一桶桶地供应给格列佛，可是火势太猛无济于事，情急之下，他急中生智，撒了一大泡尿，不到三分钟火就熄灭了。","img":"../public/question-crops/literature/literature-62.webp","aimg":"","src":"../public/source/literature/page-14.jpg","ph":false,"jx":"答案：（1）**D**——错在把两处情节调了位置：尼摩在**印度洋（锡兰采珠场）**是与**鲨鱼**搏斗救采珠人，在**大西洋**遭遇的是**巨型章鱼**，在红海捕杀的是儒艮。A 项尼摩的身份与「诺第留斯号」、B 项阿龙纳斯与环球海底旅行、C 项凡尔纳未到海底却写活海底景色，均无误。（2）示例：《格列佛游记》，作者乔纳森·斯威夫特；情节：格列佛在小人国时，皇后寝宫失火，水源太远、水桶太小，他急中生智撒尿灭火，救下整座宫殿。"},{"s":"文学常识与名著","sid":"literature","n":63,"id":"literature-63","tag":"专题四","t":"自评题","stem":"63. 阅读下面的名著选段，按要求答题。\n忽一 日，开炉取丹。那 A 双手捂着眼，正 自揉搓流涕，只听得炉头声响。猛睁睛看见光\n明，他就忍不住将身一纵，跳出丹炉，唿喇一声，蹬倒八卦炉，往外就走。慌得那架火、看炉与丁\n甲一班人来扯，被他一个个都放倒， 好似癫痫的白额虎， 疯狂的独角龙。老君赶上抓一把，被他一\n捽 ，捽了个倒栽葱，脱身走了。即去耳中掣出如意棒，迎风幌一幌，碗来粗细，依然拿在手中，不\n分好歹，却又大乱天宫，打得那九曜( yà o) 星闭门闭户，四大王无影无踪。\n(1)选段中的A 所指的人物是 o\n(2)本名著中，与人物A 有关的故事还有 。 (写出一个即可)","ans":"（1）孙悟空（或：孙行者、孙猴子） （2）示例：“孙悟空大闹天宫”“孙悟空三打白骨精”等。","img":"../public/question-crops/literature/literature-63.webp","aimg":"","src":"../public/source/literature/page-14.jpg","ph":false,"jx":"答案：（1）**孙悟空**（孙行者、孙猴子均可）——选段写他蹬倒八卦炉、大闹天宫；（2）示例：**大闹天宫／三打白骨精／三借芭蕉扇／真假美猴王**等（写出一个与该人物有关的故事即可）。"},{"s":"文学常识与名著","sid":"literature","n":64,"id":"literature-64","tag":"专题四","t":"自评题","stem":"64. 名著导读。\n乔纳森·斯威夫特(1667—1745)是 _ (国家名)18世纪前期最优秀的讽刺作家和政论家\n他的小说 以清新的文字将读者带进了一个奇异的幻境。","ans":"英国；《格列佛游记》","img":"../public/question-crops/literature/literature-64.webp","aimg":"","src":"../public/source/literature/page-16.jpg","ph":false,"jx":"答案：**英国**；**《格列佛游记》**。乔纳森·斯威夫特（1667—1745）是英国 18 世纪前期最优秀的讽刺作家和政论家，其代表作以虚构的航海幻境讽喻英国时政。"},{"s":"文学常识与名著","sid":"literature","n":65,"id":"literature-65","tag":"专题四","t":"自评题","stem":"65. 学校将在读书日开展“我读中外名著”的学习活动。请你根据提示完成下列读书卡，和同学交流。\n我读中外名著\n书名 《钢铁是怎样炼成的》 作者 (1) 国籍 (2)\n主人公 (3)\n主人公的精神品质 (4)","ans":"（1）奥斯特洛夫斯基（或：尼古拉·奥斯特洛夫斯基） （2）苏联 （3）保尔（或：保尔·柯察金） （4）示例：为理想而献身的精神，钢铁般的意志和顽强奋斗的高贵品质。","img":"../public/question-crops/literature/literature-65.webp","aimg":"","src":"../public/source/literature/page-16.jpg","ph":false,"jx":"答案：（1）**奥斯特洛夫斯基**（尼古拉·奥斯特洛夫斯基）；（2）**苏联**；（3）**保尔**（保尔·柯察金）；（4）示例：为理想而献身的精神、钢铁般的意志和顽强奋斗的高贵品质。注意「作者」与「主人公」不能混答，这是本卷反复出现的考点。"},{"s":"文学常识与名著","sid":"literature","n":66,"id":"literature-66","tag":"专题四","t":"自评题","stem":"66. 名著阅读。\n阅读下面名著选段，按要求填空。\n文段 作品 作者 主要艺术特色\n我们踩着明亮的沙层走动，它是贝壳变成的粉末\n构成的。像长长的暗礁一样出现的“诺第留斯\n号”船身，已经渐渐隐没不见了。\n\n(1)_\n\n(2) 构思巧妙，科学与幻\n想结合\n我走出了危险地带，略停了一会儿，拔出了手\n上、脸上的箭，擦上了些药膏，这是初到时利立\n浦特人给我的。\n\n(3)_ 乔纳森·\n斯威夫特\n(4)_ ,\n讽刺辛辣","ans":"（1）《海底两万里》 （2）凡尔纳 （3）《格列佛游记》 （4）想象奇异","img":"../public/question-crops/literature/literature-66.webp","aimg":"","src":"../public/source/literature/page-16.jpg","ph":false,"jx":"答案：（1）**《海底两万里》** （2）**凡尔纳** （3）**《格列佛游记》** （4）**想象奇异**。文段一写「诺第留斯号」船身没入贝壳粉末铺成的沙层，属《海底两万里》，其艺术特色是「构思巧妙，科学与幻想结合」；文段二写利立浦特（小人国）人给格列佛的箭伤敷药，属斯威夫特的《格列佛游记》，特点是「想象奇异，讽刺辛辣」。"},{"s":"文学常识与名著","sid":"literature","n":67,"id":"literature-67","tag":"专题四","t":"自评题","stem":"67. 名著阅读。\n(1)阅读《水浒传》选段，回答问题。\n鲁智深道：“‘杀人须见血，救人须救彻。’洒家放你不下，直送兄弟到沧州。”两个公人\n听了，暗暗地道：“苦也!却是坏了我们的勾当，转去时怎回话! 且只得随顺他一处行路。”\n从鲁智深的话可以看出其 _ 的品质；“兄弟”是指 ;“兄弟”到了沧\n州，未能立足，最终上了梁山，其原因 是 0\n(2)请根据《西游记》中悟空和唐僧之间关系变化过程填空。\n五行山获救，师徒结缘 →① , 师徒心生嫌隙—→ 中计戴上紧箍咒，师徒关\n系始稳定—→ ② ,师徒关系“破裂”—→战黄袍怪救回师父，师徒彼此慢慢信任\n→③ ,师徒关系再次“破裂”——如来指出假悟空，④ o","ans":"（1）仗义；林冲；高太尉要两个差人在途中杀死林冲 （2）①悟空杀盗贼 ②三打白骨精 ③真假美猴王 ④师徒关系融洽","img":"../public/question-crops/literature/literature-67.webp","aimg":"","src":"../public/source/literature/page-16.jpg","ph":false,"jx":"答案：（1）**仗义**（重情重义、救人救彻）；**林冲**；原因是**高太尉（高俅）指使两个差人在途中杀害林冲**——林冲脱险后杀了陆谦等人，最终上了梁山。（2）①**悟空杀盗贼**（打死六贼，唐僧责备，师徒心生嫌隙）②**三打白骨精**（被唐僧赶走，师徒关系「破裂」）③**真假美猴王**（假悟空打伤唐僧，师徒再次「破裂」）④**师徒关系融洽**（如来辨明真假，师徒重归于好）。"},{"s":"文学常识与名著","sid":"literature","n":68,"id":"literature-68","tag":"专题四","t":"自评题","stem":"68. 名著阅读。\n(1)下列选项中表述正确的一项是 ( )\nA. 许云峰在狱中经受了严刑拷打，宁死不屈，写下《我的“自白书”》。\nB. 《水浒传》中宋江成为梁山寨主之后，将“忠义堂”改名为“聚义厅”。\nC. 《骆驼祥子》中祥子的理想是拥有一辆自己的车，他一共买过三次车，每一次都是用自己省吃\n俭用、辛苦赚来的钱买的。\nD. 鲁迅在《朝花夕拾》中描写了迷信啰唆却善良真诚的“长妈妈”,表达了对她的深切怀念\n之情。\n(2)阅读《西游记》选段，根据原著填空。\n①众神道：“说起他来，或者大圣也知道。他 是 的儿子，铁扇公主养的。他曾在火焰山\n修行了三百年，炼成了 ,却也神通广大……乳名叫做 ,号叫做圣婴大王。”\n②行者满脸赔笑道：“嫂嫂原来不察理，错怪了老孙，令郎因是捉了师父，要蒸要煮，幸亏被\nO 菩萨收他去，救出我师。如今做了 ,受了正果，与天地同寿，日月同\n庚。”","ans":"（1）D （2）①牛魔王；三昧真火；红孩儿 ②观音；善财童子","img":"../public/question-crops/literature/literature-68.webp","aimg":"","src":"../public/source/literature/page-16.jpg","ph":false,"jx":"答案：（1）**D**——A 错：《我的「自白书」》是**陈然**所作，许云峰是在地牢中挖穿地道；B 错：宋江是把「**聚义厅**」改名为「**忠义堂**」，选项说反了；C 错：祥子三次买车并非都用自己攒的钱——第一次用自己攒的钱、第二次钱被孙侦探敲诈（未买成）、第三次用虎妞的钱（虎妞死后卖车葬她）。（2）①**牛魔王**；**三昧真火**；**红孩儿** ②**观音**；**善财童子**。红孩儿是牛魔王与铁扇公主之子，号圣婴大王，后被观音收为善财童子。"},{"s":"文学常识与名著","sid":"literature","n":69,"id":"literature-69","tag":"专题四","t":"自评题","stem":"69. 阅读下面的文字，回答问题。\n(1)《西游记》第六回中大圣变成一座土地庙，“只有尾巴不好收，竖在后面，变做一根旗杆”,被赶\n到的真君识破真相。\n真君是怎样识破大圣变化的 ?你从这里悟出了什么道理 ?\n\n(2)薛霸双手举起来，望林冲脑袋上便劈下来。说时迟，那时快，薛霸的棍恰举起来，只见松树背后\n雷鸣也似一声，那条铁禅杖飞将来，把这水火棍一隔，丢去九霄云外，跳出一 个胖大和尚来，喝\n道：“洒家在林子里听你多时!”两个公人看那和尚时，穿一领皂布直裰，跨一口 戒刀，提起禅\n杖，轮起来打两个公人。林冲方才闪开眼看时，认得是鲁智深。林冲连忙叫道： “师兄，不可\n下手!我有话说。”智深听得，收住禅杖。 两个公差呆了半晌，动掸不得。\n①简要说说选段中画线句的表达效果。\n\n②鲁智深在大闹野猪林之前做的哪几件事体现了他惩恶扬善、锄强扶弱的特点?","ans":"（1）真君从未见过旗杆竖在庙宇后面。本领再大的人也难免有弱点；假象总是难掩破绽；生活常识有助于人识别真相。 （2）①画线句运用了神态描写，形象生动地描绘出两个公人又惊又怕的神情，侧面衬托出鲁智深声势猛、动作快、力气大。②拳打镇关西、大闹桃花村、火烧瓦罐寺。","img":"../public/question-crops/literature/literature-69.webp","aimg":"","src":"../public/source/literature/page-18.jpg","ph":false,"jx":"答案：（1）真君**从未见过旗杆竖在庙宇后面**——大圣把尾巴变作旗杆立在庙后，露出破绽，因此被识破。得到的道理：本领再大的人也难免有弱点；假象终究难掩破绽；生活常识有助于识破伪装。（2）①画线句「两个公差呆了半晌，动掸不得」运用**神态描写**，生动写出两个公人又惊又怕的样子，从**侧面衬托**出鲁智深声势猛、动作快、力气大的特点。②在野猪林之前，鲁智深还做了**拳打镇关西**（救金氏父女）、**大闹桃花村**（救刘太公之女，痛打小霸王周通）、**火烧瓦罐寺**（除害）等事，都体现他惩恶扬善、锄强扶弱。"},{"s":"文学常识与名著","sid":"literature","n":70,"id":"literature-70","tag":"专题四","t":"自评题","stem":"70. 根据相关信息，在横线上写出相应内容。\n《骆驼祥子》是① 的作品，作为语言大师的他创造性地运用 ② (地名)市民的口\n语，“把顶平凡的话调动得生动有力 ”,使人一读就能感受到小说浓浓的京味儿。小说讲述了一个人\n力车夫的辛酸故事，主人公祥子最大的梦想不过是 ③ 但残酷的现实让他的希望一次\n又一次破灭。作者正是通过祥 子这个人物的悲剧命运，无情地批判了这个社会 ——它不让好人有\n出路。","ans":"①老舍（舒庆春） ②北京（旧北京、北平） ③拥有一辆自己的车（人力车、黄包车）","img":"../public/question-crops/literature/literature-70.webp","aimg":"","src":"../public/source/literature/page-18.jpg","ph":false,"jx":"答案：①**老舍**（舒庆春）②**北京**（旧北京、北平）③**拥有一辆自己的车**（人力车、黄包车）。「把顶平凡的话调动得生动有力」「京味儿」是《骆驼祥子》的语言标识；祥子最大的梦想就是拥有一辆属于自己的新车。"},{"s":"文学常识与名著","sid":"literature","n":71,"id":"literature-71","tag":"专题四","t":"自评题","stem":"71. 名著阅读。\n“我是被压迫的，瞧，那就是压迫者 ! 由于他，所有一切我热爱过的，尊敬过的，祖国、父\n母、爱人、子女他们全死亡了 ! 所有我仇恨的一切，就在那里 !”船长不愿这艘战舰的残骸跟 “复\n仇号”的光荣残骸相混，他把战舰引向东方。第二天，可怕的打击开始了 !\n(1)此语段出自《海底两万里》,文段中的船长是 (人物)。\n(2)体会文段中的语言，概括作品中船长具有哪些性格特点。(任写两点)","ans":"（1）尼摩 （2）头脑冷静，沉着智慧，富有正义感和奉献精神，反抗殖民主义者，是有勇有谋的工程师，海的隐者。","img":"../public/question-crops/literature/literature-71.webp","aimg":"","src":"../public/source/literature/page-18.jpg","ph":false,"jx":"答案：（1）**尼摩**——语段出自《海底两万里》，「船长」即尼摩船长；（2）性格特点（任答两点）：头脑冷静、沉着机智；富有正义感与奉献精神；仇恨压迫者、反抗殖民主义；学识渊博，是有勇有谋的工程师。语段中「我是被压迫的，瞧，那就是压迫者」直接点出他对压迫者的仇恨。"},{"s":"文学常识与名著","sid":"literature","n":72,"id":"literature-72","tag":"专题四","t":"自评题","stem":"72. 名著阅读。\n一到夏天，睡觉时她又伸开两脚两手，在床中间摆成一个“大”字，挤得我没有余地翻身，久睡\n在一角的席子上，又已经烤得那么热。推她呢，不动；叫她呢，也不闻。\n(1)这段文字选自鲁迅的散文集 ,文中描写的人物是\n(2)关于这部文集，下列说法不正确的一项是\nA. 《狗·猫·鼠》表现了对弱小者的同情和对暴虐者的憎恨，《二十四孝图》揭示了封建孝道的\n虚伪与残酷。\n\nB. 《五猖会》记述了作者儿时盼望观看迎神赛会时的急切、兴奋的心情，并借此对“正人君子”\n予以了辛辣的嘲讽。\nC. 《从百草园到三味书屋》描述了作者儿时在家中百草园玩耍时的无限乐趣和在三味书屋读书的\n乏味生活。\nD. 《琐记》《藤野先生》《范爱农》三篇，记述了鲁迅远离故乡到南京、日本求学和回国后的一\n段生活，留下了鲁迅追寻真理的足迹。","ans":"（1）《朝花夕拾》；阿长（长妈妈） （2）B","img":"../public/question-crops/literature/literature-72.webp","aimg":"","src":"../public/source/literature/page-18.jpg","ph":false,"jx":"答案：（1）**《朝花夕拾》**；**阿长**（长妈妈）——「在床中间摆成一个大字」是阿长睡相的经典描写。（2）**B**——B 项错在「借此对『正人君子』予以了辛辣的嘲讽」：《五猖会》记述的是儿时盼看迎神赛会却被父亲逼背《鉴略》的扫兴，批判的是**封建家长制**与死记硬背的教育方式；嘲讽「正人君子」的是《狗·猫·鼠》《无常》等篇。A、C、D 三项对《朝花夕拾》各篇内容的概括均正确。"},{"s":"文学常识与名著","sid":"literature","n":73,"id":"literature-73","tag":"专题四","t":"自评题","stem":"73. 名著积累。\n(1)以下文字是对鲁迅《朝花夕拾》相关内容的概述，请据此填空。\n这是一场让人渴盼的盛事， “我”伸长了颈子遥望，久候，却总是匆匆一眼；这是一场让人痴念\n的盛事，“我”宁愿生一场病，也想满足 “扮犯人”的心愿 ……\n这场充满地方民俗风情的 “盛事 ”是指 . ,这些情境出现在鲁迅《朝花夕拾》中的\n《_》里。\n(2)《父亲的病》和《琐记》都写到衍太太。请任选一篇，写一件与衍太太相关的事，并说说她是一\n个什么样的人。","ans":"（1）迎神赛会；五猖会 （2）衍太太怂恿“我”去偷母亲的手饰变卖，“我”并没有听从，然而却出现了关于“我”偷家里东西卖钱的流言，“我”心里十分恼怒。这件事表现了衍太太是一个表里不一、用心阴险的人。","img":"../public/question-crops/literature/literature-73.webp","aimg":"","src":"../public/source/literature/page-20.jpg","ph":false,"jx":"答案：（1）**迎神赛会**；**《五猖会》**——「宁愿生一场病，也想满足『扮犯人』的心愿」正是《五猖会》中「我」对赛会的痴念。（2）示例：在《琐记》中，衍太太怂恿「我」去偷母亲的首饰变卖，随后又散布「我」偷家里东西的流言，「我」因此十分恼怒——可见她是个**表里不一、用心阴险**的人。（选《父亲的病》亦可：她让「我」在父亲临终时大声呼喊，害得父亲不能安静地离去。）"},{"s":"文学常识与名著","sid":"literature","n":74,"id":"literature-74","tag":"专题四","t":"自评题","stem":"74. 走近名著,与大师的心灵对话，与高贵的精神同行。请按要求完成下面的读书卡。\n作品 作家 事件 精彩原文 人物 阅读批注\n\n《海底两万里》\n\n儒勒·凡尔纳\n\nA\n这场面只是瞬间的事。鲨\n鱼掉转头来，翻转身子，正准备\n把采珠人拦腰咬断。突然间，\n我觉得蹲在我身旁的尼摩船长忽\n地站直身子，举着匕首，朝那大\n怪物扑过去，与它展开了顽强的\n搏斗。\n尼\n摩\n赏\n析\n式\n批\n注\n\n对尼摩的\n动作描写，突\n出了他勇敢顽\n强、毫不畏惧\n的品质。\n\n《钢铁是怎\n样炼成的》\n\n尼古拉·奥斯\n特洛夫斯基\n\n保尔和他的\n初恋分手\n“摆脱一切束缚，到我们的\n队伍中来吧，让我们一起为消灭\n统治阶级而奋斗……你说我的朋\n友们对你不友好，但是你为什么\n要打扮得像去参加资产阶级的舞\n会呢?是虚荣心害了你。你说\n你不愿意穿上肮脏的军服。你\n既然有勇气爱一个工人，却不能\n爱工人阶级的理想。跟你分\n手，我感到遗憾，但愿你能给我\n留下美好的记忆。”保尔不再说\n下去了。\n保\n尔\n和B\n评\n价\n式\n批\n注\n\n从这件事中，\n看出保尔是个\nC的人。\nA. B.\nC. ","ans":"A.一行人（尼摩、尼德·兰等）遭遇鲨鱼 B.冬妮娅 C.示例一：为了党的事业，放弃个人幸福；示例二：信仰坚定，敢于牺牲；示例三：在个人幸福与革命事业发生冲突时，信仰坚定。","img":"../public/question-crops/literature/literature-74.webp","aimg":"","src":"../public/source/literature/page-20.jpg","ph":false,"jx":"答案：A.**一行人（尼摩、尼德·兰等）遭遇鲨鱼**（采珠场斗鲨）；B.**冬妮娅**（保尔的初恋）；C.示例一：为了党的事业，放弃个人幸福；示例二：信仰坚定，敢于牺牲；示例三：在个人幸福与革命事业发生冲突时，坚定地选择革命事业。表格题的读法：先看「作品—作家」定篇目，再由「精彩原文」定位情节，最后由「人物」填出批注落点。"},{"s":"文学常识与名著","sid":"literature","n":75,"id":"literature-75","tag":"专题四","t":"自评题","stem":"75. 名著阅读。\n《西游记》目录(摘选)\n第四回 官封弼马心何足 名注齐天意未宁\n\n第五回 乱蟠桃大圣偷丹 反天宫诸神捉怪\n第六回 观音赴会问原因 小圣施威降大圣\n第七回 八卦炉中逃大圣 五行山下定心猿\n第十二回 唐王秉诚修大会 观音显圣化金蝉\n第十四回 心猿归正 六贼无踪\n第十五回 蛇盘山诸神暗佑 鹰愁涧意马收缰\n第十七回 孙行者大闹黑风山 观世音收伏熊罴怪\n第十八回 观音院唐僧脱难 高老庄大圣降魔\n第十九回 云栈洞悟空收八戒 浮屠山玄奘受心经\n第二十二回 八戒大战流沙河 木叉奉法收悟净\n(1)唐僧在何处收谁为徒?检索摘选的目录，按照收徒的顺序填空。\n五行山收孙悟空→ → →流沙河收沙悟净\n(2)阅读第十四回选段，完成题目。\n他见三藏只管绪绪叨叨，按不住心头火发道：“你既是这等，说我做不得和尚，上不得西天，\n不必恁般绪咕恶我，我回去便了!”那三藏却不曾答应，他就使一个性子，将身一纵，说一声“老\n孙去也!”三藏急抬头，早已不见。只闻得呼的一声，回东而去。\n①结合选段中的相关语句分析孙悟空的性格。\n\n②整部小说写到孙悟空三次离开取经队伍，选段写的是第一次。请写出孙悟空另一次离队时的表\n现，结合选段说明他的成长变化。","ans":"（1）鹰愁涧收白龙马；云栈洞收猪八戒 （2）①示例一：选段通过“按不住心头火发”“使一个性子”“将身一纵”等语句，表现了孙悟空任性（急躁、率性）的性格。示例二：选段通过孙悟空“不必怎般绪恼恶我，我回去便了”等语言，表现了孙悟空任性（急躁、率性）的性格。②示例一：孙悟空打死白骨精后，唐僧赶他走，孙悟空向师父下拜告别，嘱咐沙师弟，止不住流泪，表现了孙悟空重师徒之情。与第一次离队的表现相比，孙悟空由任性急躁变得成熟稳重，说明他成长了。示例二：孙悟空打死了一群草寇，唐僧赶他走，孙悟空苦求不成，离开后又回来向师父求饶，被拒后，向观音菩萨求助。与第一次离队的表现相比，孙悟空能理性地处理问题，说明他成长了。","img":"../public/question-crops/literature/literature-75.webp","aimg":"","src":"../public/source/literature/page-20.jpg","ph":false,"jx":"答案：（1）**鹰愁涧收白龙马**；**云栈洞收猪八戒**（顺序与目录一致：五行山收孙悟空 → 鹰愁涧收白龙马 → 云栈洞收猪八戒 → 流沙河收沙悟净）。（2）①选段通过「按不住心头火发」「使一个性子」「将身一纵」等语句，表现孙悟空**任性（急躁、率性）**的性格。②示例：三打白骨精后唐僧赶他走，孙悟空**向师父下拜告别、嘱咐沙师弟照看师父、临行止不住流泪**，表现他重师徒之情——与第一次离队「说走就走」相比，他变得成熟稳重了。（或答打死草寇后被赶，他去而复返、又向观音求助，说明他学会了理性处理问题。）"},{"s":"文学常识与名著","sid":"literature","n":76,"id":"literature-76","tag":"专题四","t":"自评题","stem":"76. 阅读《水浒传》部分目录，完成下面小题。\n第三回 史大郎夜走华阴县 鲁提辖拳打镇关西\n第四回 赵员外重修文殊院 鲁智深大闹\n第五回 小霸王醉入销金帐花和尚大闹\n第六回 九纹龙翦径赤松林 鲁智深火烧\n第七回 花和尚倒拔垂杨柳 豹子头误入白虎堂\n第八回 林教头刺配沧州道 鲁智深大闹\n(1)目录中画横线处依次填入的地名，正确的一项是 ( )\nA. 五台山 桃花村 瓦罐寺 野猪林\nB. 瓦罐寺 五台山 桃花村 野猪林\nC. 桃花村 五台山野猪林 瓦罐寺\nD. 五台山 野猪林 桃花村 瓦罐寺\n(2)清代文学评论家金圣叹说：“《水浒传》写一百八个人性格，真有一百八样。”请结合第三回至第\n八回的内容，简要评述鲁达与其他梁山好汉的不同之处。","ans":"（1）A （2）与其他梁山好汉不同，鲁达几番与人争斗，皆因打抱不平，为救金氏父女，打死镇关西，因而上五台山出家；为救刘太公女儿，痛打“小霸王”周通；为保护林冲，一路暗中相随，于野猪林出手相救。他虽然性急，但心思缜密；虽然粗鲁，但心地善良；他疾恶如仇，是一个义薄云天的真汉子。","img":"../public/question-crops/literature/literature-76.webp","aimg":"","src":"../public/source/literature/page-22.jpg","ph":false,"jx":"答案：（1）**A**（五台山 桃花村 瓦罐寺 野猪林）——依次对应第四回大闹五台山、第五回大闹桃花村、第六回火烧瓦罐寺、第八回大闹野猪林。（2）与其他好汉不同，鲁达几次与人争斗**都是为打抱不平**：救金氏父女三拳打死镇关西，救刘太公之女痛打小霸王周通，为保护林冲一路暗中相随、在野猪林出手相救。他虽性急粗鲁，却**心思缜密、心地善良、疾恶如仇**，是义薄云天的真汉子。"},{"s":"文学常识与名著","sid":"literature","n":77,"id":"literature-77","tag":"专题四","t":"自评题","stem":"77 名著阅读。\n(1)在横线上填写与名著内容概述相对应的书名(范围为指定的名著阅读书目)。\n① ,记叙了作者童年的生活和青年时求学的历程，追忆那些难以忘怀的人和事，抒发了对\n亲友和师长的怀念之情。\n② , 通过叙写一波三折的爱情故事，塑造了一个出身低微、生活道路曲折，却始终坚持维\n护独立人格，追求个性自由、不向命运低头的女性形象。\n(2)名著中的主要人物，往往具有多面性。从下列人物中任选一个，结合相关情节进行分析。\nA. 宋江 B. 猪八戒 C. 虎妞\n示例：尼德·兰—性情暴躁，常打算逃跑；但在危急关头能挺身而出，如当尼摩船长为救采珠人\n被鲨鱼攻击时，他用钢叉刺中鲨鱼，挽救了船长的性命。","ans":"（1）①《朝花夕拾》 ②《简·爱》 （2）示例A：宋江——人称“及时雨”，仗义疏财，扶危济困，对来投奔他的人没有不收留的；但后来主动招安，改聚义厅为忠义堂，为了青史留名竟背叛同伴，导致最后的悲剧。示例B：猪八戒——好吃懒做，常提出散伙回家；但他憨厚忠实，当师徒受阻于流沙河，几次潜入水中勇斗妖怪，和孙悟空一起保护唐僧。","img":"../public/question-crops/literature/literature-77.webp","aimg":"","src":"../public/source/literature/page-24.jpg","ph":false,"jx":"答案：（1）①**《朝花夕拾》** ②**《简·爱》**（2）示例 A（宋江）：人称「及时雨」，仗义疏财、扶危济困，对来投奔的人无不收留；但后来主动谋求招安，把「聚义厅」改为「忠义堂」，为求青史留名不惜断送众兄弟前程，最终酿成悲剧。示例 B（猪八戒）：好吃懒做、贪财好色，动辄嚷着散伙回高老庄；但憨厚忠实，遇流沙河受阻时几次潜入水底勇斗妖怪，与孙悟空一起保护唐僧。示例 C（虎妞）：敢爱敢恨、富有心计，主动追求祥子；但好逸恶劳、控制欲极强，最终因难产而死。"},{"s":"文学常识与名著","sid":"literature","n":78,"id":"literature-78","tag":"专题四","t":"自评题","stem":"78 名著阅读。\n(1)《平凡的世界》是一部以黄土高原为背景，全景式地表现20世纪七八十年代中国城乡社会生活的\n长篇小说，是 (作者)的代表作，获第三届 文学奖。\n(2)关于这部小说，下列表述不正确的一项是 ( )\nA. 小说以陕北黄土高原双水村村民的命运为中心，深刻展示了普通人在大时代历史进程中所走过\n的艰难曲折的道路。\nB. 1978 年十一届三中全会后，孙少安领导生产队推广责任制，并成了公社的“冒尖户”。\nC. 孙少平因不懂技术，办砖窑蒙受了巨大损失。\nD. 田晓霞从师专毕业后到省报当了记者，在抗洪采访中为抢救灾民光荣献身。","ans":"（1）路遥；茅盾 （2）C","img":"../public/question-crops/literature/literature-78.webp","aimg":"","src":"../public/source/literature/page-24.jpg","ph":false,"jx":"答案：（1）**路遥**；**茅盾**——《平凡的世界》获第三届茅盾文学奖。（2）**C**——C 项错在人物张冠李戴：因不懂技术、办砖窑蒙受巨大损失的是**孙少安**；孙少平走的是外出闯荡、下矿井的路。A 项双水村村民命运、B 项孙少安推广责任制成「冒尖户」、D 项田晓霞抗洪牺牲，均无误。"},{"s":"文学常识与名著","sid":"literature","n":79,"id":"literature-79","tag":"专题四","t":"选择题","stem":"79. 下面所列名著与信息，对应正确的一项是 ( )\nA. 《朝花夕拾》 散文集 《阿长与〈山海经〉》 闰土\nB. 《简·爱》 英国文学 罗切斯特 第一人称\nC. 《水浒传》 章回体 鲁智深醉打蒋门神 农民起义\nD. 《海底两万里》 凡尔纳 基地三部曲 诺第留斯号","ans":"B","img":"../public/question-crops/literature/literature-79.webp","aimg":"","src":"../public/source/literature/page-24.jpg","ph":false,"jx":"答案 B。B 项四项信息全部对应：国别（英国文学）、人物（罗切斯特）、叙述人称（第一人称）都属《简·爱》。A 错：「闰土」是《故乡》的人物，出自小说集《呐喊》，不属《朝花夕拾》；C 错：「醉打蒋门神」的是**武松**，不是鲁智深；D 错：「基地三部曲」是阿西莫夫的科幻作品，与《海底两万里》无关。"},{"s":"文学常识与名著","sid":"literature","n":80,"id":"literature-80","tag":"专题四","t":"自评题","stem":"80. 下图是文学名著《水浒传》连环画中的一幅，请仔细观察，并按要求作答。\n\n郑屠挣扎不起来，鲁达抢前一步，\n踏着他的胸脯，提起拳头，一面打一面骂。\n(1)《水浒传》中鲁达的绰号是 ,与图中内容相关的情节是\n(2)有人认为鲁达是个有担当的人。其他经典名著中也不乏有担当的人物形象，请从《西游记》《海\n底两万里》《钢铁是怎样炼成的》三部作品中找出一个这样的人物，并作简要分析。","ans":"（1）花和尚；鲁提辖拳打镇关西 （2）示例一：孙悟空。三打白骨精中三次识破妖精诡计，成功保护唐僧不被吃，尽管被唐僧误解也无怨无悔。示例二：《海底两万里》中，尼摩船长是一个有担当的人，他遇事头脑冷静，沉着而又机智。当祖国沦为殖民地后，他带领少数志同道合的人潜入海底，用反抗的行动和不满的言论，支持和唤醒被压迫民族反抗殖民统治的斗争。示例三：《钢铁是怎样炼成的》，保尔·柯察金是一个有担当的人，在战争中英勇无畏，双目失明，身残志坚。修筑铁路时带领同伴奋战在工地上，起得最早，睡得最晚，满身伤残的保尔患了关节炎，严重的伤寒病几乎令他丧命。从死亡线上挣扎回来后，保尔继续没命地工作。","img":"../public/question-crops/literature/literature-80.webp","aimg":"","src":"../public/source/literature/page-24.jpg","ph":false,"jx":"答案：（1）**花和尚**；**鲁提辖拳打镇关西**——图中郑屠被踏住胸脯、挨打的场面即「三拳打死镇关西」。（2）示例一：**孙悟空**（《西游记》）。三打白骨精时他三次识破妖精诡计，力保唐僧不被加害，虽遭师父误解驱逐也无怨无悔。示例二：**尼摩船长**（《海底两万里》）。祖国沦为殖民地后，他带领志同道合者潜入海底，用行动和言论支持和唤醒被压迫民族的反抗。示例三：**保尔**（《钢铁是怎样炼成的》）。战争中英勇无畏，双目失明、全身瘫痪后仍以写作继续战斗。"},{"s":"文学常识与名著","sid":"literature","n":81,"id":"literature-81","tag":"专题四","t":"自评题","stem":"81. 走近名著。\nA亦垂泪道：“罢，罢，罢!生时服侍哥哥，死了也只是哥哥部下一个小鬼 !”言讫泪下，便\n觉身体有些沉重。当时泪洒，拜别了宋江下船。回到润州，果然药发身死。 A 临死之时，嘱咐从\n人：“我死了，可千万将我灵柩去楚州南门外蓼儿洼和哥哥一处埋葬。”嘱罢而死。\n(1)这段文字节选自《水浒传》,选段中的A是 。他死的原因是 o\n(2)从选段中能看出A 具有怎样的性格特点?","ans":"（1）李逵；宋江怕他闹事，让他喝毒酒 （2）忠诚；忠心；重情重义。","img":"../public/question-crops/literature/literature-81.webp","aimg":"","src":"../public/source/literature/page-26.jpg","ph":false,"jx":"答案：（1）**李逵**；宋江被赐毒酒，**怕自己死后李逵闹事（造反）坏了忠义之名，便让他也喝下毒酒**，同死。（2）**忠诚**（忠心、重情重义）。选段中「生时服侍哥哥，死了也只是哥哥部下一个小鬼」和遵嘱归葬蓼儿洼，都写尽他对宋江的赤诚。"},{"s":"文学常识与名著","sid":"literature","n":82,"id":"literature-82","tag":"专题四","t":"自评题","stem":"82. 阅读下面文段，回答文段后的问题。\n①一年，两年，至少有三四年；一滴汗，两滴汗，不知道多少万滴汗，才挣出那辆车。②从风\n里雨里的咬牙，从饭里茶里的自苦，才赚出那辆车，那辆车是他的一切挣扎与困苦的总结果与报酬，\n像身经百战的武士的一颗徽章。③在他赁人家的车的时候，他从早到晚，由东到西，由南到北，像被\n人家抽着转的陀螺：他没有自己。④可是在这种旋转之中，他的眼并没有花，心并没有乱，他老想着\n远远的一辆车，可以使他自由，独立，像自己的手脚的那么一辆车。⑤有了自己的车，他可以不再受\n拴车的人们的气，也无须敷衍别人，有自己的力气与洋车，睁开眼就可以有饭吃。\n(1) 文段中的“他”是 , 是老舍塑造的一个典型文学人物。\n(2)根据示例对①至③句，从内容、语言两方面各写一个批注，表达你的心得体会。\n下面是就④⑤句写的两个批注示例。\n内容：他想要一辆车的心情多么迫切。\n语言：把车比作自己的手脚，生动地表达了他认为\n拥有车就拥有了自由与独立的想法。\n请你就①至③句写两个批注。\n内容：\n语言：","ans":"（1）祥子 （2）他为拥有一辆车付出太多。时间、汗水的铺陈，把他比作陀螺，具体、生动地展示了他的艰辛。","img":"../public/question-crops/literature/literature-82.webp","aimg":"","src":"../public/source/literature/page-26.jpg","ph":false,"jx":"答案：（1）**祥子**（2）内容批注：他为拥有一辆车**付出了太多血汗**——三四年的辛劳、数不清的汗水才换来那辆车。语言批注：①至③句以「一年，两年，至少有三四年；一滴汗，两滴汗……多少万滴汗」**铺陈时间与汗水**，又把被雇拉车比作「像被人家抽着转的陀螺」，具体生动地写出他的艰辛与身不由己。"},{"s":"文学常识与名著","sid":"literature","n":83,"id":"literature-83","tag":"专题四","t":"自评题","stem":"83. 阅读下面语段，回答问题。\n那些拉着买卖的，即使是最漂亮的小伙子，也居然甘于丢脸，不敢再跑，只低着头慢慢地走。每\n一个井台都成了他们的救星，不管刚拉了几步，见井就奔过去；赶不上新汲的水，便和驴马们同在水\n槽里灌一大气。还有的，因为中了暑，或是发痧，走着走着，一头栽在地上，永不起来。连祥子都\n有些胆怯了!拉着空车走了几步，他觉出由脸到脚都被热气围着，连手背上都流了汗。可是，见了\n座儿，他还想拉，以为跑起来也许倒能有点风。\n(选自老舍《骆驼祥子》 ,人民教育出版社 )\n(1) 语段体现了当时怎样的自然环境特征?\n\n(2)语段中写道：“可是，见了座儿，他还想拉。”联系全书，简要回答祥子如此拼命拉车的原因。","ans":"（1）没有风，天气炎热异常。 （2）他想攒钱买车。","img":"../public/question-crops/literature/literature-83.webp","aimg":"","src":"../public/source/literature/page-26.jpg","ph":false,"jx":"答案：（1）**没有风、天气酷热异常**——「见井就奔过去」「和驴马们同在水槽里灌一大气」「中了暑」「连手背上都流了汗」都指向酷热无风。（2）他想**攒钱买一辆自己的车**——有了自己的车就能不再受拴车人的气、不必敷衍别人，靠自己的力气吃上饭。这是全书贯穿的动机，「拼命拉车」正是为这个目标。"},{"s":"文学常识与名著","sid":"literature","n":84,"id":"literature-84","tag":"专题四","t":"自评题","stem":"84. 阅读《朝花夕拾》选段，完成相关题目。\n选段(一) 但那是我最为心爱的宝书，看起来，确是人面的兽；九头的蛇；一脚的牛；袋子似的帝\n江；没有头而“以乳为目，以脐为口”,还要“执干戚而舞”的刑天。\n选段(二) 哦，原来世界上竟然还有一个赫胥黎坐在书房里那么想，而且想得那么新鲜?一口气\n读下去，“物竞”“天择”也出来了，苏格拉第、柏拉图也出来了，斯多葛也出来了。\n\n选段(三)\n每当夜间疲倦，正想偷懒时，仰面在灯光中瞥见他黑瘦的面貌，似乎正要说出抑\n扬顿挫的话来，便使我忽又良心发现，而且增加勇气了，于是点上一支烟，再继续写\n些为“正人君子”之流所深恶痛疾的文字。\n\n(1) 鲁迅先生非常喜欢选段(一)(二)中提及的两部书，请写出两部书的名称。\n\n(2) 《朝花夕拾》中“为‘正人君子’之流所深恶痛疾的文字”有许多，你觉得他们最 “深恶痛\n的”可能是书中的哪一篇?请简要阐明理由。\n\n(3)“写作”是鲁迅和保尔·柯察金(《钢铁是怎样炼成的》)的人生转折点，请分别概述他们走上写\n作道路的原因。","ans":"（1）《山海经》《天演论》 （2）《狗·猫·鼠》。理由：这篇文章以动物写人，表面上写讨厌猫，实际上却鞭挞了具有与猫类似习性的一类人，如当时社会上的一些“正人君子”、军阀统治者的帮凶。 （3）鲁迅：①他在日本的时候，作为在日本人眼里弱小的中国人被高度歧视。国外留学生看不起中国学生，认为中国人考到60分就不是自己的本事，认为藤野给鲁迅泄题。②当他看到一部关于中国人被斩首的幻灯片的时候，发现中国人看日本人杀给俄国人做奸细的中国人时拍手称快、表情麻木，意识到改变中国人的精神和灵魂才能真正地救国。于是他决定回国弃医从文，文学救国。保尔：①身体原因：保尔完全瘫痪，继而双目失明；②坚强的革命信念又使他重新回到革命工作的队伍中去。","img":"../public/question-crops/literature/literature-84.webp","aimg":"","src":"../public/source/literature/page-26.jpg","ph":false,"jx":"答案：（1）**《山海经》**（选段一写其插图）、**《天演论》**（选段二写「物竞」「天择」）。（2）示例：**《狗·猫·鼠》**。这篇文章以动物写人，表面写厌恶猫，实际鞭挞了与猫习性相似的一类人——当时社会上的「正人君子」和军阀统治者的帮凶，正中其痛处。（答《二十四孝图》《无常》并说清理由亦可。）（3）**鲁迅**：在日本看幻灯片，见中国人围观同胞被杀却神情麻木，认识到改变国民精神才能救国，于是**弃医从文**；**保尔**：全身瘫痪、双目失明后，找到以**写作**继续革命的新方式，小说《暴风雨所诞生的》出版。"},{"s":"文学常识与名著","sid":"literature","n":85,"id":"literature-85","tag":"专题四","t":"自评题","stem":"85. 阅读下列语段，回答问题。\n【甲】鲁提辖假意道：“你这厮诈死，洒家再打。”只见面皮渐渐的变了。鲁达寻思道：“俺只\n指望痛打这厮一顿，不想三拳真个打死了他，洒家须吃官司，又没人送饭，不如及早撒开。”\n【乙】那大王却待挣扎，鲁智深把右手捏起拳头，骂一声：“直娘贼!”连耳根带脖子只一拳，\n那大王叫一声：“做甚么便打老公?”鲁智深喝道：“教你认的老婆!”拖倒在床边，拳头脚尖一齐\n上，打得大王叫救人。\n(1)【甲】段中“他”的绰号是 。【乙】段鲁智深在桃花村痛打周通，表现了他 的\n性格特征。\n(2)【甲】段中的“鲁提辖”与【乙】段中“鲁智深”都是指鲁达。为什么在前后情节中他的称谓发\n生了变化?","ans":"（1）镇关西；疾恶如仇（也作“嫉恶如仇”） （2）他本名鲁达，是渭州经略府提辖（官名），所以人称“鲁提辖”，因打抱不平三拳打死恶霸镇关西，为躲避官府缉捕便在五台山出家做了和尚，法名智深，所以后来称“鲁智深”。","img":"../public/question-crops/literature/literature-85.webp","aimg":"","src":"../public/source/literature/page-28.jpg","ph":false,"jx":"答案：（1）**镇关西**；**疾恶如仇**（嫉恶如仇）。（2）他本名鲁达，原是渭州经略府的**提辖**（官职），所以人称「鲁提辖」；因打抱不平三拳打死恶霸镇关西，为躲避官府缉捕，在五台山出家做了和尚，法名**智深**，因此此后称「鲁智深」。同一个人物两个称谓，正对应他「提辖—出家」的身份变化。"},{"s":"文学常识与名著","sid":"literature","n":86,"id":"literature-86","tag":"专题四","t":"自评题","stem":"86. 阅读一部名著时，个性鲜明的人物、曲折起伏的情节、纷繁多样的人情世态……都可能引发你的阅读\n兴趣。请结合一部名著的内容，说出是什么引发了你的阅读兴趣，并简要说明这一兴趣是如何促使你\n阅读这部名著的。(100字左右)","ans":"示例：我读《西游记》的兴趣是，孙悟空如何保护唐僧完成西天取经。读小说前几回，我知道他神通广大。往下阅读，我知道他凭借本领，打死白骨精，战胜红孩儿。我还想知道他保护着唐僧又经历了哪些磨难才最终取得真经。","img":"../public/question-crops/literature/literature-86.webp","aimg":"","src":"../public/source/literature/page-28.jpg","ph":false,"jx":"答案：开放题，参考示例——「我读《西游记》的兴趣在于：孙悟空究竟怎样一路保护唐僧走到西天。读前几回我知道他神通广大；往下读，见他打死白骨精、战胜红孩儿；我越来越想知道他还要经历哪些磨难才取得真经。」答题要领：先点明兴趣点（人物／情节／人情世态之一），再写这一兴趣如何推动自己读下去，约 100 字。"},{"s":"文学常识与名著","sid":"literature","n":87,"id":"literature-87","tag":"专题四","t":"自评题","stem":"87. “不忘初心，方得始终。”请结合保尔四次死里逃生经历中的某一次，分析他是如何在艰难的环境中坚\n持初心的。","ans":"示例一：第一次是在与波兰白军战斗中，保尔腿受伤并得了伤寒。示例二：第二次是保尔在骑兵部队的战斗中头部受伤。示例三：第三次是繁重紧张的工作击倒了他，他不得不离开岗位回家养病。示例四：第四次是在修筑铁路时，患了伤寒和大叶性肺炎。保尔身受伤病的折磨也不放弃革命的信念，重新回到战斗行列，坚持革命工作。这就是他对初心的坚持。","img":"../public/question-crops/literature/literature-87.webp","aimg":"","src":"../public/source/literature/page-28.jpg","ph":false,"jx":"答案：示例——**第一次死里逃生**：与波兰白军作战时，保尔腿部负伤并染上伤寒，刚刚能走便要求归队；**第二次**：在骑兵部队战斗中头部重伤，右眼失明仍坚持革命工作；**第三次**：繁重紧张的工作把他击倒，他回家养病后又重返岗位；**第四次**：修筑铁路时患伤寒和大叶性肺炎，几乎丧命，稍愈便再次投入战斗。任选一次，答出「在伤病与艰苦环境中仍不放弃革命信念、坚持为理想工作」，即扣住「不忘初心」。"},{"s":"文学常识与名著","sid":"literature","n":88,"id":"literature-88","tag":"专题四","t":"自评题","stem":"88. 简答题。\n金圣叹评点《水浒传》中林冲这个人物时说他是个“狠角色”,也有人认为林冲“忍”字当头，性\n格懦弱。请结合两处故事情节说说林冲性格中懦弱和忍让的表现。","ans":"①妻子遭到调戏，林冲本要惩治恶人，但一看是高太尉养子高衙内，虽然怒火中烧，还是强忍了下来。②林冲被高俅设计陷害，误闯白虎堂，惹上官司，发配沧州，也没有反抗，有忍让和懦弱的一面。③发配前休妻，也表现出性格中的懦弱和忍让。④发配途中，董超、薛霸受高俅指使，对林冲各种折磨（炎热天气中，不顾林冲棒疮发作，逼迫林冲快走。村中客店，灌醉林冲，烧开水烫伤林冲双脚。四更早起，让被烫伤双脚的林冲穿新草鞋，使林冲鲜血淋漓，走不动），林冲一再忍受，也是一种懦弱。","img":"../public/question-crops/literature/literature-88.webp","aimg":"","src":"../public/source/literature/page-28.jpg","ph":false,"jx":"答案：林冲「忍」与「懦弱」的表现（答两处即可）：①**妻子遭高衙内调戏**，他怒火中烧，一看是高太尉的养子，便强忍下来；②被高俅设计**误入白虎堂**、含冤发配沧州，他并不反抗，只求平安服刑；③**发配前休妻**，把妻子让与别人，也见其委曲求全；④押解途中被董超、薛霸百般折磨（烫伤双脚、逼穿新草鞋），他**一再忍受**。金圣叹说他「狠」，指的正是这种忍到极处的隐忍一旦爆发便狠厉（如风雪山神庙杀陆谦）。"},{"s":"文学常识与名著","sid":"literature","n":89,"id":"literature-89","tag":"专题四","t":"自评题","stem":"89. 阅读下面文字。回答问题。\n地名他很熟习，即使有时候绕点远也没有多大关系，好在自己有的是力气。拉车的方法，以他干\n过的那些推、拉、扛、挑的经验来领会，也不算十分难。况且他有他的主意：多留神，少争胜，大\n概总不会出了毛病。至于讲价争座，他的嘴慢气盛，弄不过那些老油子们。知道这个短处， 他干脆\n\n不大到“车口儿”上去；哪里没车，他放在哪里 。在这僻静的地点，他可以从容地讲价，而且有时\n候不肯要价，只说声：“坐上吧，瞧着给!”他的样子是那么诚实，脸上是那么简单可爱，人们好像\n只好信任他，不敢想这个傻大个子是会敲人的。即使人们疑心，也只能怀疑他是新到城里来的乡下佬\n儿，大概不认识路，所以讲不出价钱来。 以至人们问到：“认识呀?”他就又像装傻，又像耍俏的\n那么一笑，使人们不知怎样才好。\n这段文字出自 ,文中的“他”诚实、健壮、坚韧，最大的梦想是拥有一辆自己的\n洋车。 但在当时的社会条件下，“他”的希望一次又一次地破灭，最后他放弃了自己的理想，变成了\n一个 的行尸走肉。","ans":"《骆驼祥子》；麻木、潦倒、狡猾、自暴自弃","img":"../public/question-crops/literature/literature-89.webp","aimg":"","src":"../public/source/literature/page-28.jpg","ph":false,"jx":"答案：**《骆驼祥子》**；**麻木、潦倒、狡猾、自暴自弃**。这段文字写祥子拉车的门道与他的老实憨厚——「多留神，少争胜」「装作傻，耍俏」；而他的结局正是由诚实健壮的青年变成「麻木、潦倒、狡猾、自暴自弃」的行尸走肉。"},{"s":"文学常识与名著","sid":"literature","n":90,"id":"literature-90","tag":"专题四","t":"自评题","stem":"90. 阅读《水浒传》中的两个片段，回答问题。\n①宋江听罢，吃了一惊，肚里寻思道： “晁盖是我心腹兄弟。他如今犯了弥天大 罪，我不救他\n时，捕获将去，性命便休了 !” ……晁盖听罢，吃了一惊 道：“贤弟大恩难报!”宋江道：“哥哥，\n你休要多说，只顾安排走路，不要缠障。我便回去了。 ”\n②宋江大醉，叫取纸笔来， 一时乘着酒兴，作满江红一词： “……衷心愿平虏，保民安国。日\n月常悬忠烈胆，风尘障却奸邪目。望天王降 诏，早招安，心方足。 ” ……宋江道：“今皇上至圣至\n明，只被奸臣闭塞，暂时昏昧，有日云开见日，知我等替天行道， 不扰良民，同心报国，青史留名，\n有何不美 !”\n(1)从上述两段选文中可以看出宋江 的性格特点。\n(2)结合整部小说，简要分析宋江以上性格对小说情节发展的作用。","ans":"（1）义；忠 （2）“义”使宋江成为梁山义军的领袖，“忠”使宋江最终引导义军走向招安。","img":"../public/question-crops/literature/literature-90.webp","aimg":"","src":"../public/source/literature/page-30.jpg","ph":false,"jx":"答案：（1）**义**；**忠**——第①段写他为救心腹兄弟晁盖不惜冒险，「义」字当头；第②段写他盼朝廷招安、要「保民安国」「青史留名」，「忠」字当头。（2）「**义**」使他广得人心，成为梁山义军的领袖；「**忠**」使他最终主动谋求招安，把义军引向被朝廷收编、而后消亡的悲剧结局——这两个字共同决定了梁山事业的走向。"},{"s":"文学常识与名著","sid":"literature","n":91,"id":"literature-91","tag":"专题四","t":"自评题","stem":"91. 根据阅读积累，在下面文段的空缺处填写相应的内容。\n经典名著是一个时代留给我们的精神食粮。读《水浒传》 ,我们结识了景阳 冈打虎的\n(1). , 在他身上我们看到了草莽英雄的血性与气概；读《西游记》,我们认识了火眼金睛、会\n七十二变的(2) , 被他桀骜不驯、爱憎分明的性格所吸引；(3)读《________》,我们\n和尼摩船长一起航行，领略了海底的奇妙与美丽； 读《昆虫记》,我们了解了昆虫生活的奥秘，也被\n(4). (作者)积极探索、求真务实的精神所感动……徜徉书海，我们的心灵得到滋养，我们的\n思想变得深刻。(5)祥子是老舍在《骆驼祥子》中成功塑造的人力车夫形象。在祥子起 伏悲惨的命运\n中，曹先生和小福子是两个重要人物。请结合小说内容，分别概括这两个人物对祥子的影响。","ans":"（1）武松 （2）孙悟空 （3）海底两万里 （4）法布尔 （5）曹先生是祥子遇到困难时最想投奔和依靠的人。曹先生同情祥子，给予祥子的帮助、关心和信任，让他感受到温暖、安慰和做人的尊严，使祥子燃起对生活的希望。小福子是祥子喜欢的人，与祥子共同的悲惨命运拉近了他们心与心的距离。虎妞死后，小福子让祥子对新生活又有了希望。小福子的死，让祥子的美好愿望再次破灭，最终彻底沉沦。","img":"../public/question-crops/literature/literature-91.webp","aimg":"","src":"../public/source/literature/page-30.jpg","ph":false,"jx":"答案：（1）**武松** （2）**孙悟空** （3）**海底两万里** （4）**法布尔** （5）**曹先生**是祥子遇难时最想投奔和依靠的人，他同情祥子，给予帮助、关心和信任，让祥子感到温暖、安慰和做人的尊严，重新燃起生活的希望；**小福子**是祥子喜欢的姑娘，相似的悲惨命运拉近了两人的心，虎妞死后她让祥子对新生活又有了盼头——而小福子的死使这最后的希望破灭，祥子终于彻底沉沦。"},{"s":"字音、字形 A","sid":"ziyin-a","n":1,"id":"ziyin-a-1","tag":"","t":"选择题","stem":"1. 下列词语中加点字的字音、字形完全正确的一项是\nA. 朗润(liang)\n酝酿(yun)\n卖弄(nong)\n花枝招展（z）\nB. 喉咙(hou）\n应和(he）\n嘹亮(lido）\n呼朋引伴(bin）\nC. 烘拖(tuo）\n静默(mo）\n风筝(zheng）\n咄咄逼人(duo）\nD. 抖擞( sou)\n健状(zhudng） 镶上(xiang)\n绿草如茵(yin）","ans":"B","img":"../public/question-crops/ziyin-a/ziyin-a-1.webp","aimg":"","src":"../public/source/ziyin-a/page-01.jpg","ph":false,"jx":""},{"s":"字音、字形 A","sid":"ziyin-a","n":2,"id":"ziyin-a-2","tag":"","t":"选择题","stem":"2. 下列词语中加点字的字音、字形完全正确的一项是 （　）\nA. 着落(zhdo)\n慈善(cf）\n肌肤(fu）\n一泄千里(xie）\nB. 秀气(x）\n宽敞(chang)\n贮存(chu）\n水泻不通(xie）\nC.鸣蝉( cdn）\n花苞(bao）\n娇媚(mei)\n杯盘狼藉（j）\nD. 澄清(cheng)\n空灵(ling）\n地毯(tn）\n装模作样(mu）","ans":"D","img":"../public/question-crops/ziyin-a/ziyin-a-2.webp","aimg":"","src":"../public/source/ziyin-a/page-01.jpg","ph":false,"jx":""},{"s":"字音、字形 A","sid":"ziyin-a","n":3,"id":"ziyin-a-3","tag":"","t":"选择题","stem":"3.下列词语中加点字的字音、字形完全正确的一项是 （　）\nA. 棱镜(Iing)\n粗犷(kuang）\n睫毛(j\n与日具增(j）\nB. 衣裳(chdng)\n玲铛(dang)\n端庄(zhuang)\n落英缤纷(fen）\nC. 静谧（mi）\n屋檐(yan)\n凄冷(qi）\n翻来覆去(fu）\nD. 化装(zhuang)莅临(）\n造访(zhdo）\n不可抗拒（j）","ans":"C","img":"../public/question-crops/ziyin-a/ziyin-a-3.webp","aimg":"","src":"../public/source/ziyin-a/page-01.jpg","ph":false,"jx":""},{"s":"字音、字形 A","sid":"ziyin-a","n":4,"id":"ziyin-a-4","tag":"","t":"选择题","stem":"4.下列词语中加点字的字音、字形完全正确的一项是 （　）\nA. 吝啬(se）\n淋漓(l）\n干涩(she）\n美不胜收( sheng）\nB.草垛(duo)\n瘫痪(huan）\n暴怒(bdo)\n津津有味 (jing)\nC. 沉寂（j）\n待弄(shi）\n捶打(chuf）\n花团紧簇(jin）\nD. 憔悴( qido）\n央求(yang)\n絮叨(x）\n隐隐约约(yue）","ans":"D","img":"../public/question-crops/ziyin-a/ziyin-a-4.webp","aimg":"","src":"../public/source/ziyin-a/page-01.jpg","ph":false,"jx":""},{"s":"字音、字形 A","sid":"ziyin-a","n":5,"id":"ziyin-a-5","tag":"","t":"选择题","stem
