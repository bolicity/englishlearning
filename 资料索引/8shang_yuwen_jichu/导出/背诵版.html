<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>初中语文基础题库 · 背诵版</title>
<style>
:root{
  --bg:#F8FAFC; --card:#FFFFFF; --subtle:#F1F5F9; --border:#E2E8F0;
  --tx:#0F172A; --tx2:#475569; --mut:#64748B; --red:#DC2626; --red-l:#EF4444; --red-bg:#FEF2F2;
  --green:#059669; --green-bg:#ECFDF5; --amber:#D97706; --amber-bg:#FFFBEB;
  --blue:#1D4ED8; --blue-bg:#EFF6FF;
  --serif:"Songti SC","STSong","Noto Serif SC","SimSun",serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:-apple-system,"PingFang SC","Inter",sans-serif;background:var(--bg);color:var(--tx);line-height:1.6;display:flex}

/* ---------- 左侧目录（可折叠） ---------- */
#sidebar{width:264px;flex:none;background:var(--card);border-right:1px solid var(--border);
  display:flex;flex-direction:column;height:100vh;position:sticky;top:0;transition:margin-left .25s ease;z-index:40}
body.collapsed #sidebar{margin-left:-264px}
#side-head{padding:1rem 1rem .8rem;border-bottom:1px solid var(--border)}
#side-head h1{font-size:1.02rem;font-weight:800;color:var(--red)}
#side-head p{font-size:.72rem;color:var(--mut)}
#sec-list{flex:1;overflow-y:auto;padding:.5rem}
.sec{border-radius:9px;margin-bottom:2px;cursor:pointer;user-select:none}
.sec-row{display:flex;align-items:center;gap:.5rem;padding:.5rem .6rem;border-radius:9px}
.sec:hover{background:var(--subtle)}
.sec.active{background:var(--red-bg)}
.sec-name{flex:1;font-size:.82rem;font-weight:600;color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sec.active .sec-name{color:var(--red)}
.sec-n{font-size:.68rem;color:var(--mut);flex:none}
.sec-dot{width:6px;height:6px;border-radius:50%;background:var(--border);flex:none}
.sec-dot.full{background:var(--green)}
#side-foot{padding:.7rem 1rem;border-top:1px solid var(--border);font-size:.7rem;color:var(--mut)}
#progress-line{height:6px;border-radius:3px;background:var(--subtle);margin-top:.45rem;overflow:hidden}
#progress-fill{height:100%;background:linear-gradient(90deg,var(--red),var(--red-l));width:0;transition:width .3s}

/* ---------- 主区 ---------- */
#main{flex:1;display:flex;flex-direction:column;height:100vh;min-width:0}
#topbar{background:var(--card);border-bottom:1px solid var(--border);padding:.55rem .9rem;
  display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;position:sticky;top:0;z-index:30}
#burger{border:1px solid var(--border);background:var(--card);border-radius:8px;width:34px;height:34px;
  cursor:pointer;font-size:1rem;color:var(--tx2);flex:none}
.modes{display:flex;border:1px solid var(--border);border-radius:9px;overflow:hidden;flex:none}
.modes button{border:0;background:var(--card);padding:.42rem .8rem;font-size:.8rem;font-weight:600;color:var(--mut);cursor:pointer}
.modes button.on{background:var(--red);color:#fff}
#search{flex:1;min-width:150px;border:1px solid var(--border);border-radius:9px;padding:.45rem .7rem;font-size:.85rem;outline:none;background:var(--subtle)}
#search:focus{border-color:var(--red-l);background:#fff}
.fchip{border:1px solid var(--border);background:var(--card);border-radius:9px;padding:.42rem .7rem;
  font-size:.78rem;font-weight:600;color:var(--mut);cursor:pointer;flex:none}
.fchip.on{background:var(--amber-bg);border-color:#FDE68A;color:var(--amber)}
.fchip.ans-on{background:var(--green-bg);border-color:#A7F3D0;color:var(--green)}
.fchip.jx-on{background:var(--blue-bg);border-color:#BFDBFE;color:var(--blue)}
#view{flex:1;overflow-y:auto;padding:.8rem 1.1rem 3rem}

/* ---------- 背诵卡（紧凑版） ---------- */
#card-wrap{max-width:760px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:1rem 1.15rem;box-shadow:0 1px 3px rgba(15,23,42,.06)}
.meta{display:flex;gap:.35rem;flex-wrap:wrap;align-items:center;margin-bottom:.55rem}
.chip{font-size:.64rem;font-weight:700;padding:.1rem .46rem;border-radius:99px;background:var(--red-bg);color:var(--red)}
.chip.gray{background:var(--subtle);color:var(--mut)}
.stem{font-family:var(--serif);font-size:1rem;line-height:1.75;white-space:pre-wrap;color:var(--tx)}
.stem .blank{color:var(--red);font-weight:700;letter-spacing:.05em}
.imgbox{margin-top:.55rem;border:1px solid var(--border);border-radius:9px;overflow:hidden;background:var(--subtle);display:none}
.imgbox img{display:block;margin:0 auto;max-width:100%;max-height:64vh;cursor:zoom-in}
.imgbox.show{display:block}
#reveal-btn{display:block;width:100%;margin-top:.7rem;padding:.58rem;border:0;border-radius:9px;
  background:var(--red);color:#fff;font-size:.84rem;font-weight:700;cursor:pointer}
#reveal-btn:hover{background:var(--red-l)}
.answer{display:none;margin-top:.7rem;border-radius:10px;padding:.7rem .85rem;background:var(--green-bg);border:1px solid #A7F3D0}
.answer.show{display:block}
.answer .alabel{font-size:.64rem;font-weight:800;color:var(--green);margin-bottom:.25rem}
.answer .atext{font-family:var(--serif);font-size:1rem;line-height:1.72;color:#064E3B;white-space:pre-wrap}
.answer img{max-width:100%;border-radius:8px;margin-top:.4rem;display:block;cursor:zoom-in}
/* 解析块 */
.jx{margin-top:.7rem;padding-top:.6rem;border-top:1px dashed #6EE7B7}
.jxlabel{font-size:.64rem;font-weight:800;color:var(--blue);margin-bottom:.3rem;letter-spacing:.02em}
.jxtext{font-family:var(--serif);font-size:.98rem;line-height:1.72;color:var(--tx);white-space:pre-wrap}
.jxtext .k{color:var(--blue);font-weight:700}
body.nojx .jx{display:none}
.ops{display:flex;gap:.5rem;margin-top:.7rem;flex-wrap:wrap}
.ops button{flex:1;min-width:110px;padding:.52rem;border-radius:9px;border:1px solid var(--border);
  background:var(--card);font-size:.78rem;font-weight:700;color:var(--tx2);cursor:pointer}
.ops .know{background:var(--green);border-color:var(--green);color:#fff}
.ops .know.on{background:var(--green-bg);color:var(--green)}
.ops button:hover{filter:brightness(.97)}
.navrow{display:flex;justify-content:space-between;align-items:center;margin-top:.6rem;gap:.5rem}
.navrow button{border:1px solid var(--border);background:var(--card);border-radius:9px;padding:.42rem .8rem;
  font-size:.78rem;font-weight:600;color:var(--tx2);cursor:pointer}
.navrow button:hover{background:var(--subtle)}
#cardbar{height:4px;border-radius:3px;background:var(--subtle);overflow:hidden;margin-bottom:.55rem}
#cardbar-f{height:100%;background:var(--red-l);transition:width .25s}
.hint{text-align:center;color:var(--mut);font-size:.66rem;margin-top:.6rem}
.hint kbd{background:var(--subtle);border:1px solid var(--border);border-radius:4px;padding:0 .3rem;font-size:.62rem}

/* ---------- 速览 ---------- */
#list{max-width:860px;margin:0 auto}
.li{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:.8rem .95rem;margin-bottom:.55rem;cursor:pointer}
.li:hover{border-color:var(--red-l)}
.li-head{display:flex;gap:.45rem;align-items:center;margin-bottom:.3rem}
.li-n{font-size:.7rem;font-weight:800;color:var(--mut)}
.li-sect{font-size:.68rem;color:var(--mut);background:var(--subtle);border-radius:99px;padding:.05rem .5rem}
.li-know{margin-left:auto;font-size:.68rem;color:var(--green);font-weight:700}
.li-stem{font-family:var(--serif);font-size:1rem;line-height:1.85;white-space:pre-wrap}
.li-ans{margin-top:.45rem;font-family:var(--serif);font-size:1rem;line-height:1.8;color:var(--green);
  background:var(--green-bg);border-radius:8px;padding:.45rem .7rem;white-space:pre-wrap}
.li img.qimg{margin-top:.5rem;max-width:min(420px,100%);border-radius:8px;border:1px solid var(--border);display:block}
.li-jx{margin-top:.45rem;font-family:var(--serif);font-size:.92rem;line-height:1.7;color:var(--tx2);
  border-left:3px solid #BFDBFE;padding-left:.6rem}
.li-jx .k{color:var(--blue);font-weight:700}
body.nojx .li-jx{display:none}
mark{background:#FEF08A;border-radius:3px;padding:0 1px}
.empty{text-align:center;color:var(--mut);padding:3rem 1rem;font-size:.9rem}
@media (max-width:760px){
  #sidebar{position:fixed;left:0;top:0;box-shadow:4px 0 16px rgba(0,0,0,.08)}
  body:not(.collapsed) #sidebar{margin-left:0}
  body.collapsed #sidebar{margin-left:-280px}
  #main{width:100%}
}
</style>
</head>

<script>

id":"ciyu-17","tag":"","t":"选择题","stem":"17. 依次填入下面横线处的词语最恰当的一项是\n云彩像一位艺术大师，让雪山增添了不尽的神奇。时而云蒸霞游，玉龙山二；时而碧空;\n水，群峰_；时而云带東腰，云中雪峰皎洁，云下.__二_；时而晚霞似火，雪峰如披红纱\nA. 时隐时现 晶莹耀眼 娇艳妩媚 冈峦翠碧\nB. 时隐时现 晶莹耀眼 冈峦翠碧 娇艳妩媚\nC. 娇艳妩媚 峦翠碧 晶莹耀眼 时隐时现\nD. 晶莹耀眼 时隐时现 娇艳妩媚 冈峦翠碧","ans":"B","img":"../public/question-crops/ciyu/ciyu-17.webp","aimg":"","src":"../public/source/ciyu/page-04.jpg","ph":false,"jx":""},{"s":"词语理解与运用","sid":"ciyu","n":18,"id":"ciyu-18","tag":"","t":"选择题","stem":"18. 依次填入下面句子横线处的词语最恰当的一项是\n春天带来的温暖，在人身上；志愿者帶来的温暖，在人心里。志愿者们的故事_\n_，他们因\n为不同的_走上了志愿者之路，又在各自的路上_着志瓜者精神的种子，在他们眼里，\n做一个志愿者不仅时尚，而且_。\nA. 不胜枚举 理由 传播 高尚\nB. 比肩接睡 理由 播撒 伟大\nC.不胜枚举 缘由 播撒高尚\nD.比肩接踵 缘由 传播 伟大","ans":"C","img":"../public/question-crops/ciyu/ciyu-18.webp","aimg":"","src":"../public/source/ciyu/page-04.jpg","ph":false,"jx":""},{"s":"词语理解与运用","sid":"ciyu","n":19,"id":"ciyu-19","tag":"","t":"选择题","stem":"19.依次填入下面句子横线处的词语最恰当的一项是\n花开是常有的事，花开时有香气更是_\n_在这个只有我一个人的世界里，我就觉\n得很不__。有花香感我寂寥，我甚至有点儿因花香而_\n_了。\nA. 司空见惯 但是寻常 沉醉\nB. 唾手可得 因为 寻常 沉迷\nC.司空见惯 因为 平凡 沉迷\nD. 唾手可得 但是 平凡 沉醉","ans":"A","img":"../public/question-crops/ciyu/ciyu-19.webp","aimg":"","src":"../public/source/ciyu/page-04.jpg","ph":false,"jx":""},{"s":"词语理解与运用","sid":"ciyu","n":20,"id":"ciyu-20","tag":"","t":"选择题","stem":"20. 填入下面横线处的词语，与上下文街接最恰当的一项是\n在大雪纷飞中，在夕阳残照里，这些绝壁上的松树像_的战士，\n_的渔夫，\n_的隐者，站立出自己的风骨。大自然叩击着我们的心灵，让我们探求着忠诚、勇敢、洒脱的\n卖谛。\nA. 搏击风浪 坚守阵地 远离世俗\nB. 坚守阵地 远离世俗 搏击风浪\nC.坚守阵地 博击风浪 远离世俗\nD. 搏击风浪 远离世俗 坚守阵地","ans":"C","img":"../public/question-crops/ciyu/ciyu-20.webp","aimg":"","src":"../public/source/ciyu/page-04.jpg","ph":false,"jx":""},{"s":"词语理解与运用","sid":"ciyu","n":21,"id":"ciyu-21","tag":"","t":"选择题","stem":"请完成原资料第 21 题。识别文字不完整，建议点击“查看原题页”对照作答。","ans":"C","img":"../public/question-crops/ciyu/ciyu-21.webp","aimg":"","src":"../public/source/ciyu/page-04.jpg","ph":true,"jx":""},{"s":"词语理解与运用","sid":"ciyu","n":22,"id":"ciyu-22","tag":"","t":"选择题","stem":"请完成原资料第 22 题。识别文字不完整，建议点击“查看原题页”对照作答。","ans":"A","img":"../public/question-crops/ciyu/ciyu-22.webp","aimg":"","src":"../public/source/ciyu/page-04.jpg","ph":true,"jx":""},{"s":"词语理解与运用","sid":"ciyu","n":23,"id":"ciyu-23","tag":"","t":"选择题","stem":"23.根据句意依次填入下面横线上的词语最恰当的一项是 （　）\n只有完善集聚人才、发挥人才作用的机制，才能做到寻觅人才.\n_二，发现人才_\n_，举\n荐人才__，使用人才_\nA. 求贤若渴 如获至宝 不拘一格 各尽其能\nB. 如获至宝 求贤若渴 各尽其能 不拘一格\nC.不拘一格 各尽其能 求贤若渴 如获至宝\nD. 各尽其能 不拘一格 如获至宝 求贤若渴","ans":"A","img":"../public/question-crops/ciyu/ciyu-23.webp","aimg":"","src":"../public/source/ciyu/page-05.jpg","ph":false,"jx":""},{"s":"词语理解与运用","sid":"ciyu","n":24,"id":"ciyu-24","tag":"","t":"选择题","stem":"24. 依次填入下面句子横线处的词语最恰当的一项是\n时光荏莓，白驹过隙，书的神、形，至今被人们營为心灵的补养品。书，自然是汉字的\n_，细心品读，似身临其境。在书中，你可以领略高山的淳朴、流水的真挚。在麵巍高山和\n潺溽流水中体会“永恒的真谛”。一本好书，宛如一曲神采奕奕的古典音乐，婉转而灵动；一本好\n书，宛如一掬洁白无瑕的山泉，甘甜而纯真。这真是__的景致，午后的朦胧、鸟的吟唱，\n_着每一个人的心灵，优雅而恬静。让书的\n_充实你人生的步展吧！\nA. 精华 美不胜收 抚感 滋润\nB. 精髓 花枝招展 安抚 滋养\nC. 精华 花团锦簇 抚感 滋养\nD. 精髓 美不胜收 安抚 滋润","ans":"A","img":"../public/question-crops/ciyu/ciyu-24.webp","aimg":"","src":"../public/source/ciyu/page-05.jpg","ph":false,"jx":""},{"s":"词语理解与运用","sid":"ciyu","n":25,"id":"ciyu-25","tag":"","t":"选择题","stem":"25.依次填入下面一段文字横线处的词语，最恰当的一项是\n兰州人对黃河奇石的喜爱体现了崇尚自然的审美观念。中国古人认为，奇石是天人合一的产物，\n它\n_，妙在\nA. 千姿百态 浑然天成 栩树如生\nB. 栩栩如生 干姿百态 浑然天成\nC.栩栩如生 浑然天成 干姿百态\nD. 干姿百态 栩栩如生 浑然天成","ans":"D","img":"../public/question-crops/ciyu/ciyu-25.webp","aimg":"","src":"../public/source/ciyu/page-05.jpg","ph":false,"jx":""},{"s":"词语理解与运用","sid":"ciyu","n":26,"id":"ciyu-26","tag":"","t":"选择题","stem":"26. 依次填入下面句子横线处的词语最恰当的一项是\n岭南艺术展开设了雕塑展览专场，展出的大量雕塑作品非常精美，龙其是木雕，以其_\n的\n雕刻技艺吸引了众多参观者。这些作品有的简练粗放，有的__，其中最为突出的是“三英战吕\n布”组雕，人物__，令人惊叹。\nA. 巧夺天工 具体而微 引人入胜\nB. 美不胜收 精雕细刻 引人人胜\nC.巧夺天工 精雕细刻 惟妙惟肖\nD. 美不胜收 具体而微 惟妙惟肖","ans":"C","img":"../public/question-crops/ciyu/ciyu-26.webp","aimg":"","src":"../public/source/ciyu/page-05.jpg","ph":false,"jx":""},{"s":"词语理解与运用","sid":"ciyu","n":27,"id":"ciyu-27","tag":"","t":"选择题","stem":"27. 填入下面文段空白处的词语，最恰当的一项是 （　）\n在先秦诸子看来，幸福有着怎样的内涵呢？他们认为，物质财富对幸福来说_不重要，\n_相比较而言，精神快乐更是幸福所必需的。 _，他们主张对物质财富、外在环境持淡\n泊态度，应该_\n_注重心灵的知足，关注那些符合人之本性、来自内心的幸福。这样，_\n会获得真正的幸福。\nA. 也许 只是 所 s/ciyu/ciyu-41.webp","aimg":"","src":"../public/source/ciyu/page-08.jpg","ph":false,"jx":""},{"s":"词语理解与运用","sid":"ciyu","n":42,"id":"ciyu-42","tag":"","t":"选择题","stem":"42. 依次填入横线处的词语最恰当的一项是\n被誉为“天下第一行书”的《兰亨集序》，笔画__\n，滿酒流利，直观呈现了行书独特的宇\n体风貌，展示出王義之_的书法技艺，其文本内容_俩、道两家思想，描绘了兰亭的景\n致和聚会的乐趣，抒发了作者对盛事不常、“修短随化，终期于尽”的感叹。字体、技法和文本内\n容_结合，深刻体现出书者对所处时代文化精神的精准把握。\nA. 浑厚雄健 巧夺天工 融合 完美\nB. 纤细轻盈 出神入化 融汇完满\nC. 浑厚雄健 巧夺天工 融合 完满\nD. 纤细轻盈 出神入化 融汇 完美","ans":"D","img":"../public/question-crops/ciyu/ciyu-42.webp","aimg":"","src":"../public/source/ciyu/page-08.jpg","ph":false,"jx":""},{"s":"词语理解与运用","sid":"ciyu","n":43,"id":"ciyu-43","tag":"","t":"选择题","stem":"43. 依次选用文中括号里的词语，最恰当的一项是\n自古以来，燕子就是诗词歌赋中的重要角色。文人墨客对燕子从不吝惜笔墨，歌咏春燕的文赋不\n胜枚举，多有精粹之作。北宋晏殊的《破阵子•春景》以燕子开篇，寥寥数笔，春天的勃勃生机便跃\n然纸上。现代作家也一样，对春燕(刮目相看/情有独钟），把燕子刻画得细致入微，惟炒惟肖。郑\n振铎先生的《燕子》，（简洁/简捷）流畅，脍炙人口。在他笔下，燕子在阳光下微风中翩跹起舞的景\n象，是春天最诱人的风景。即便歌脚在电线上，也是“五线谱”上的音符，谱成際亮您扬的春曲。\nA. 刮目相看 简洁\nB.情有独钟 简捷\nC. 情有独钟 简洁\nD. 刮目相看 简捷","ans":"C","img":"../public/question-crops/ciyu/ciyu-43.webp","aimg":"","src":"../public/source/ciyu/page-08.jpg","ph":false,"jx":""},{"s":"词语理解与运用","sid":"ciyu","n":44,"id":"ciyu-44","tag":"","t":"选择题","stem":"44. 在下列横线上依次填入所给的词语，最合适的一项是\n空气和水中的酸类，__了岩石中的一部分物质。水流和风还不断地二\n_、吹拂着\n它，造成了许多奇形怪状的石头。雨水落到河湖里，\n_到地下，都对岩石有破坏作用。即使\n，海水也在不断地_\n_着岸上的石壁。\n冲击 渗人 冲刷\nB. 腐蚀 冲击 进人 冲刷\n腐蚀 冲刷渗人 冲击\nD. 破坏冲刷进人 冲击","ans":"C","img":"../public/question-crops/ciyu/ciyu-44.webp","aimg":"","src":"../public/source/ciyu/page-08.jpg","ph":false,"jx":""},{"s":"词语理解与运用","sid":"ciyu","n":45,"id":"ciyu-45","tag":"","t":"选择题","stem":"45. 依次填入下面横线处的词语最恰当的一组是\n我们在唐代诗人狂做的背后也能看到_\n一方面，他们躬逢盛世，_飞扬，如孔雀\n开屏般绚丽多彩；另一方面，他们放下身段，态度谦恭，甚至__，如孔雀背后的狼狈不堪。现\n实的窘迫、人性的复杂，使得多种看似矛盾对立的东西却_\n。这才是真实的人生。\nA.卑贱 神采 前倨后恭 浑然天成\nB. 卑微 个性 阿谀奉承 浑然一体\nC. 卑微 神采 阿谀奉承 浑然天成\nD. 卑贱 个性 前倨后茶 浑然一体","ans":"B","img":"../public/question-crops/ciyu/ciyu-45.webp","aimg":"","src":"../public/source/ciyu/page-09.jpg","ph":false,"jx":""},{"s":"词语理解与运用","sid":"ciyu","n":46,"id":"ciyu-46","tag":"","t":"选择题","stem":"46. 依次填入下面句子横线处的词语最恰当的一项是\n一个民族和一个时代的质量，往往取决于这个民族和这个时代的审美愿望、审美能力和审美水\n平。\n_因为穷，我们就在心理上_\n__了美，它的后果无非两个：一是对美的麻木，二是对\n美的误判。对美的误判相当可怕，很可能拿心机当\n_；拿愚昧当坚忍⋯\nA. 如果删除聪明\nB. 即使剔除聪明\nC.如果剔除 智慧\nD. 即使删除 智慧","ans":"C","img":"../public/question-crops/ciyu/ciyu-46.webp","aimg":"","src":"../public/source/ciyu/page-09.jpg","ph":false,"jx":""},{"s":"词语理解与运用","sid":"ciyu","n":47,"id":"ciyu-47","tag":"","t":"选择题","stem":"47. 依次填入下列句子中横线上的词语最恰当的一组是 （　）\n（1）对历史人物，不能简单地以过去的道德观念來_\n（2）那一年他以同等_ __申请了研究生招生全国统一考试。\n（3）如智力不集中，可令读数学，盖演题须_\n_，稍有分散即须重演。\nA. 判别 学历 全神贯注\nB. 判别 学历 吹毛求疵\nC.评判 学力 吹毛求疵\nD. 评判 学历 全神贯注","ans":"D","img":"../public/question-crops/ciyu/ciyu-47.webp","aimg":"","src":"../public/source/ciyu/page-09.jpg","ph":false,"jx":""},{"s":"词语理解与运用","sid":"ciyu","n":48,"id":"ciyu-48","tag":"","t":"选择题","stem":"48. 依次填入下面一段文字横线处的词语最恰当的一项是\n校园艺术节开菜式上，校长首先致辞：“艺术就像蓝天上舞动的云霞，时而洁白如雪，时而五彩\n缤纷，时而_柔曼，时而辉煌热烈⋯⋯艺术可以让人生充满诗意，时时处处_\n_我们的生\n活。让我们从热爱艺术开始，热爱生活吧！”热情洋溢的讲话深深_ __了在场的每一个人。\nA.轻快 点缀 感慨\nB. 轻盈 连缀 感慨\nC.轻盈 点缀 感染\nD.轻快 连缀 感染","ans":"C","img":"../public/question-crops/ciyu/ciyu-48.webp","aimg":"","src":"../public/source/ciyu/page-09.jpg","ph":false,"jx":""},{"s":"词语理解与运用","sid":"ciyu","n":49,"id":"ciyu-49","tag":"","t":"选择题","stem":"49. 依次填入下面句子横线处的词语最恰当的一项是\n东个人都应该学会为自己鼓掌。在这个世界上，你是一种_的存在。懂得为自己鼓掌，\n才能在生命的乐章中奏出自己的_\n为自己鼓掌，并不是唯我独尊地_\n_，也不是傲视一\n切地孤芳自赏，_一种醒悟，一种境界，一种推动自己向挫折与失败挑战的勇气与动力。\nA. 独特 音符 安自菲薄 但是\nB. 独自 诗篇 狂放不羁 而是\nC. 独特 音符 狂放不羁 而是\nD. 独自 诗篇 妄自菲薄 但是","ans":"C","img":"../public/question-crops/ciyu/ciyu-49.webp","aimg":"","src":"../public/source/ciyu/page-09.jpg","ph":false,"jx":""},{"s":"词语理解与运用","sid":"ciyu","n":50,"id":"ciyu-50","tag":"","t":"选择题","stem":"50. 选出依次填入下面语段横线处的词语最恰当的一项\n经典从来不是旧纸堆里的过往云烟，\n宛如长者的谆谆叮嘱，在每一个时代都有可以落脚\n的现实意义，让人常读常新，二 经典的意义，在于它经得起时光的打磨、岁月的_\n历久弥新，滋养着一代又一代对它_\n仰望的人们。\n21\nA. 而是 耳目一新 涤荡 虔诚\nB. 就是 获益匪浅 洗礼 真诚\nC. 就是 耳目一新 涤荡 真诚\nD. 而是 获益匪浅 洗礼 虔诚","ans":"D","img":"../public/question-crops/ciyu/ciyu-50.webp","aimg":"","src":"../public/source/ciyu/page-09.jpg","ph":false,"jx":""},{"s":"词语理解与运用","sid":"ciyu","n":51,"id":"ciyu-51","tag":"","t":"选择题","stem":"51. 依次填入下面句子横线处的词语最恰当的一项是\n放假在即，各种校外培训机构又在广州大大小小的中小学校及幼儿园门前上演“招生秀”，这些\n培训机构_\n，而培训机构的教学质量与广大学子的切身利益__，所以规范校外培训机\n的发展已经__了。\nA.鱼龙混杂 息息相关 刻不容缓\nB. 鱼目混珠 息息相关 众望所归\nC. 鱼龙混杂 休戚与共 众望所归\nD. 鱼目混珠 休戚与共 刻不容缓","ans":"A","img":"../public/question-crops/ciyu/ciyu-51.webp","aimg":"","src":"../public/source/ciyu/page-10.jpg","ph":false,"jx":""},{"s":"词语理解与运用","sid":"ciyu","n":52,"id":"ciyu-52","tag":"","t":"选择题","stem":"52、 依次填入下面横线处的词语最恰当的一组是\n文明如水，\n从黄河长江流域到幼发拉底河、底格里斯河流域，从印度次大陆到中南半\n岛，古老而_\n_的亚洲文明彼此交相辉映、__，筑牢了文明互鉴的情感纽带，_\n民心相通的友好桥梁。\nA. 波澜不兴 多边 百花齐放 搭建\nB. 润物无声 多元 相得益彰 搭建\nC. 波澜不兴 多元 百花齐放 组建\nD. 润物无声 多边 相得益彰 组建","ans":"B","img":"../public/question-crops/ciyu/ciyu-52.webp","aimg":"","src":"../public/source/ciyu/page-10.jpg","ph":false,"jx":""},{"s":"词语理解与运用","sid":"ciyu","n":53,"id":"ciyu-53","tag":"","t":"选择题","stem":"53.依次填入下列句子横线处的词语最恰当的一项是\n诗歌要有时代担当。诗歌是心灵的颤动和诗意的_\n_，但不可能离开特定的社会历史语境，\n_脱离时代和人民，\n__只能是阁楼里的低吟浅唱和_\nA. 传播 尽管也孤掌难鸣\nB. 传送既然就 自命不凡\nC. 传递 如果就 孤芳自赏\nD. 传达即使也 自命清高","ans":"C","img":"../public/question-crops/ciyu/ciyu-53.webp","aimg":"","src":"../public/source/ciyu/page-10.jpg","ph":false,"jx":""},{"s":"词语理解与运用","sid":"ciyu","n":54,"id":"ciyu-54","tag":"","t":"选择题","stem":"54. 依次填入下面一段文字横线处的词语最恰当的一项是\n劳动教育的重要性不言而喻。于学生而言，家庭是劳动教育的重要__\n。从叠被子打扫卫\n生到洗衣做饭，千万不要小瞧这些身边的生活_\n_，它们看似琐碎，都是孩子们_自我的\n第一道门槛。独立自主处理事务的能力和品性，也就从这一伸手一弯腰、一根线一粒米的家务琐事\n中，得到了_\n_和激励。\nA. 场地 技能 锻炼培训\nB. 场所 技术 训练 培养\nC. 场地 技术 训练培训\nD. 场所 技能锻炼培养","ans":"D","img":"../public/question-crops/ciyu/ciyu-54.webp","aimg":"","src":"../public/source/ciyu/page-10.jpg","ph":false,"jx":""},{"s":"古诗文默写","sid":"poetry-memory","n":1,"id":"poetry-memory-direct-1","tag":"直接型默写","t":"自评题","stem":"1. 东临碣石，________。（《观沧海》）","ans":"以观沧海","img":"../public/question-crops/poetry-memory/poetry-memory-direct-1.webp","aimg":"","src":"../public/source/poetry-memory/page-01.jpg","ph":false,"jx":"《观沧海》曹操（东汉末）。上句“东临碣石”点出登临之处，空格接的是登山目的——来看大海。“沧”从“氵”，勿写作“苍”。"},{"s":"古诗文默写","sid":"poetry-memory","n":2,"id":"poetry-memory-direct-2","tag":"直接型默写","t":"自评题","stem":"2. 水何澹澹，________。（《观沧海》）","ans":"山岛竦峙","img":"../public/question-crops/poetry-memory/poetry-memory-direct-2.webp","aimg":"","src":"../public/source/poetry-memory/page-01.jpg","ph":false,"jx":"《观沧海》曹操。上句写水波荡漾，下句转写山岛耸立，两句由水及山，故填“山岛竦峙”。课本作“竦峙”，勿写作“耸峙”。"},{"s":"古诗文默写","sid":"poetry-memory","n":3,"id":"poetry-memory-direct-3","tag":"直接型默写","t":"自评题","stem":"3. ________，百草丰茂。（《观沧海》）","ans":"树木丛生","img":"../public/question-crops/poetry-memory/poetry-memory-direct-3.webp","aimg":"","src":"../public/source/poetry-memory/page-01.jpg","ph":false,"jx":"《观沧海》曹操。“树木丛生”与“百草丰茂”对举，同写岛上草木繁盛，据此可判断空格处填“树木丛生”。“丛”勿写作“从”。"},{"s":"古诗文默写","sid":"poetry-memory","n":4,"id":"poetry-memory-direct-4","tag":"直接型默写","t":"自评题","stem":"4. ________，洪波涌起。（《观沧海》）","ans":"秋风萧瑟","img":"../public/question-crops/poetry-memory/poetry-memory-direct-4.webp","aimg":"","src":"../public/source/poetry-memory/page-01.jpg","ph":false,"jx":"《观沧海》曹操。下句“洪波涌起”写海浪翻腾，前提是先起风，故填“秋风萧瑟”。“萧瑟”勿写作“萧涩”。"},{"s":"古诗文默写","sid":"poetry-memory","n":5,"id":"poetry-memory-direct-5","tag":"直接型默写","t":"自评题","stem":"5. 日月之行，________。（《观沧海》）","ans":"若出其中","img":"../public/question-crops/poetry-memory/poetry-memory-direct-5.webp","aimg":"","src":"../public/source/poetry-memory/page-01.jpg","ph":false,"jx":"《观沧海》曹操。全联为“日月之行，若出其中；星汉灿烂，若出其里”，以想象写大海吞吐日月星辰。承接“日月”的是“若出其中”。"},{"s":"古诗文默写","sid":"poetry-memory","n":6,"id":"poetry-memory-direct-6","tag":"直接型默写","t":"自评题","stem":"6. 星汉灿烂，________。（《观沧海》）","ans":"若出其里","img":"../public/question-crops/poetry-memory/poetry-memory-direct-6.webp","aimg":"","src":"../public/source/poetry-memory/page-01.jpg","ph":false,"jx":"《观沧海》曹操。与“若出其中”并列成对，一作“其中”、一作“其里”，写大海包孕星河，注意两句勿写反。"},{"s":"古诗文默写","sid":"poetry-memory","n":7,"id":"poetry-memory-direct-7","tag":"直接型默写","t":"自评题","stem":"7. ________，歌以咏志。（《观沧海》）","ans":"幸甚至哉","img":"../public/question-crops/poetry-memory/poetry-memory-direct-7.webp","aimg":"","src":"../public/source/poetry-memory/page-01.jpg","ph":false,"jx":"《观沧海》曹操。这是乐府诗结尾的套语，与正文内容无关，四字顺序固定，不可颠倒。"},{"s":"古诗文默写","sid":"poetry-memory","n":8,"id":"poetry-memory-direct-8","tag":"直接型默写","t":"自评题","stem":"8. ________，闻道龙标过五溪。（《闻王昌龄左迁龙标遥有此寄》）","ans":"杨花落尽子规啼","img":"../public/question-crops/poetry-memory/poetry-memory-direct-8.webp","aimg":"","src":"../public/source/poetry-memory/page-01.jpg","ph":false,"jx":"《闻王昌龄左迁龙标遥有此寄》李白（唐）。“杨花落尽”“子规啼”既点暮春时节，又渲染飘零哀愁。“子规”勿写作“子归”。"},{"s":"古诗文默写","sid":"poetry-memory","n":9,"id":"poetry-memory-direct-9","tag":"直接型默写","t":"自评题","stem":"9. 我寄愁心与明月，________。（《闻王昌龄左迁龙标遥有此寄》）","ans":"随君直到夜郎西","img":"../public/question-crops/poetry-memory/poetry-memory-direct-9.webp","aimg":"","src":"../public/source/poetry-memory/page-01.jpg","ph":false,"jx":"《闻王昌龄左迁龙标遥有此寄》李白。把愁心托付明月、让它随友人同去，故填“随君直到夜郎西”。“夜郎”是地名，勿写作“夜朗”。"},{"s":"古诗文默写","sid":"poetry-memory","n":10,"id":"poetry-memory-direct-10","tag":"直接型默写","t":"自评题","stem":"10. ________，行舟绿水前。（《次北固山下》）","ans":"客路青山外","img":"../public/question-crops/poetry-memory/poetry-memory-direct-10.webp","aimg":"","src":"../public/source/poetry-memory/page-01.jpg","ph":false,"jx":"《次北固山下》王湾（唐）。“客路”对“行舟”，先陆路后水路，故填“客路青山外”。"},{"s":"古诗文默写","sid":"poetry-memory","n":11,"id":"poetry-memory-direct-11","tag":"直接型默写","t":"自评题","stem":"11. 潮平两岸阔，________。（《次北固山下》）","ans":"风正一帆悬","img":"../public/question-crops/poetry-memory/poetry-memory-direct-11.webp","aimg":"","src":"../public/source/poetry-memory/page-01.jpg","ph":false,"jx":"《次北固山下》王湾。岸阔因“潮平”，帆悬因“风正”，前后句因果相承，故填“风正一帆悬”。“悬”勿写作“县”。"},{"s":"古诗文默写","sid":"poetry-memory","n":12,"id":"poetry-memory-direct-12","tag":"直接型默写","t":"自评题","stem":"12. ________，江春入旧年。（《次北固山下》）","ans":"海日生残夜","img":"../public/question-crops/poetry-memory/poetry-memory-direct-12.webp","aimg":"","src":"../public/source/poetry-memory/page-01.jpg","ph":false,"jx":"《次北固山下》王湾。与“江春入旧年”构成对偶，“生”对“入”、“残夜”对“旧年”，故填“海日生残夜”。“生”勿写作“升”。"},{"s":"古诗文默写","sid":"poetry-memory","n":13,"id":"poetry-memory-direct-13","tag":"直接型默写","t":"自评题","stem":"13. 乡书何处达？________。（《次北固山下》）","ans":"归雁洛阳边","img":"../public/question-crops/poetry-memory/poetry-memory-direct-13.webp","aimg":"","src":"../public/source/poetry-memory/page-01.jpg","ph":false,"jx":"《次北固山下》王湾。上句“乡书何处达”发问，下句用“归雁”作答，故填“归雁洛阳边”。“雁”勿写作“燕”。"},{"s":"古诗文默写","sid":"poetry-memory","n":14,"id":"poetry-memory-direct-14","tag":"直接型默写","t":"自评题","stem":"14. ________，小桥流水人家，古道西风瘦马。（《天净沙·秋思》）","ans":"枯藤老树昏鸦","img":"../public/question-crops/poetry-memory/poetry-memory-direct-14.webp","aimg":"","src":"../public/source/poetry-memory/page-01.jpg","ph":false,"jx":"《天净沙·秋思》马致远（元）。三个偏正短语并列铺陈，把枯藤、老树、昏鸦组接在一起，是开篇的写景句。“藤”勿写作“滕”。"},{"s":"古诗文默写","sid":"poetry-memory","n":15,"id":"poetry-memory-direct-15","tag":"直接型默写","t":"自评题","stem":"15. 夕阳西下，________。（《天净沙·秋思》）","ans":"断肠人在天涯","img":"../public/question-crops/poetry-memory/poetry-memory-direct-15.webp","aimg":"","src":"../public/source/poetry-memory/page-01.jpg","ph":false,"jx":"《天净沙·秋思》马致远。末句点明主旨，由景入情，故填“断肠人在天涯”。“涯”勿写作“崖”。"},{"s":"古诗文默写","sid":"poetry-memory","n":16,"id":"poetry-memory-direct-16","tag":"直接型默写","t":"自评题","stem":"16. ________，不亦君子乎？（《论语》十二章）","ans":"人不知而不愠","img":"../public/question-crops/poetry-memory/poetry-memory-direct-16.webp","aimg":"","src":"../public/source/poetry-memory/page-01.jpg","ph":false,"jx":"《论语》十二章（孔子及其弟子言行，春秋）。此句与“不亦说乎”“不亦乐乎”并列，都是反问语气，故填“人不知而不愠”。“愠”读 yùn，勿写作“温”。"},{"s":"古诗文默写","sid":"poetry-memory","n":17,"id":"poetry-memory-direct-17","tag":"直接型默写","t":"自评题","stem":"17. 温故而知新，________。（《论语》十二章）","ans":"可以为师矣","img":"../public/question-crops/poetry-memory/poetry-memory-direct-17.webp","aimg":"","src":"../public/source/poetry-memory/page-01.jpg","ph":false,"jx":"《论语》十二章。上句“温故而知新”是条件，下句推结论，故填“可以为师矣”。"},{"s":"古诗文默写","sid":"poetry-memory","n":18,"id":"poetry-memory-direct-18","tag":"直接型默写","t":"自评题","stem":"18. ________，思而不学则殆。（《论语》十二章）","ans":"学而不思则罔","img":"../public/question-crops/poetry-memory/poetry-memory-direct-18.webp","aimg":"","src":"../public/source/poetry-memory/page-01.jpg","ph":false,"jx":"《论语》十二章。名句“学而不思则罔，思而不学则殆”，“罔”指迷惑无所得，与“殆”对举。“罔”勿写作“惘”。"},{"s":"古诗文默写","sid":"poetry-memory","n":19,"id":"poetry-memory-direct-19","tag":"直接型默写","t":"自评题","stem":"19. ________，其不善者而改之。（《论语》十二章）","ans":"择其善者而从之","img":"../public/question-crops/poetry-memory/poetry-memory-direct-19.webp","aimg":"","src":"../public/source/poetry-memory/page-01.jpg","ph":false,"jx":"《论语》十二章。原句“择其善者而从之，其不善者而改之”，“从”即学习、效法，两句正反对照。"},{"s":"古诗文默写","sid":"poetry-memory","n":20,"id":"poetry-memory-direct-20","tag":"直接型默写","t":"自评题","stem":"20. 知之者不如好之者，________。（《论语》十二章）","ans":"好之者不如乐之者","img":"../public/question-crops/poetry-memory/poetry-memory-direct-20.webp","aimg":"","src":"../public/source/poetry-memory/page-01.jpg","ph":false,"jx":"《论语》十二章。“知之者不如好之者，好之者不如乐之者”三层递进，最高一层是“乐之”，故填“好之者不如乐之者”。"},{"s":"古诗文默写","sid":"poetry-memory","n":21,"id":"poetry-memory-direct-21","tag":"直接型默写","t":"自评题","stem":"21. 吾日三省吾身：________？________？传不习乎？（《论语》十二章）","ans":"为人谋而不忠乎 ｜ 与朋友交而不信乎","img":"../public/question-crops/poetry-memory/poetry-memory-direct-21.webp","aimg":"","src":"../public/source/poetry-memory/page-01.jpg","ph":false,"jx":"《论语》十二章。三句自省依次对应“谋事—交友—传习”，故依次填“为人谋而不忠乎”“与朋友交而不信乎”。"},{"s":"古诗文默写","sid":"poetry-memory","n":22,"id":"poetry-memory-direct-22","tag":"直接型默写","t":"自评题","stem":"22. ________，于我如浮云。（《论语》十二章）","ans":"不义而富且贵","img":"../public/question-crops/poetry-memory/poetry-memory-direct-22.webp","aimg":"","src":"../public/source/poetry-memory/page-01.jpg","ph":false,"jx":"《论语》十二章。原句“不义而富且贵，于我如浮云”，讲君子对不义富贵的态度。“浮云”是比喻，非实指云。"},{"s":"古诗文默写","sid":"poetry-memory","n":23,"id":"poetry-memory-direct-23","tag":"直接型默写","t":"自评题","stem":"23. 三人行，________。（《论语》十二章）","ans":"必有我师焉","img":"../public/question-crops/poetry-memory/poetry-memory-direct-23.webp","aimg":"","src":"../public/source/poetry-memory/page-01.jpg","ph":false,"jx":"《论语》十二章。原句“三人行，必有我师焉”，“焉”是兼词，相当于“于此”。"},{"s":"古诗文默写","sid":"poetry-memory","n":24,"id":"poetry-memory-direct-24","tag":"直接型默写","t":"自评题","stem":"24. ________，不舍昼夜。（《论语》十二章）","ans":"逝者如斯夫","img":"../public/question-crops/poetry-memory/poetry-memory-direct-24.webp","aimg":"","src":"../public/source/poetry-memory/page-01.jpg","ph":false,"jx":"《论语》十二章。以流水喻时光，“逝者”指流逝的时光，故填“逝者如斯夫”。“逝”勿写作“誓”。"},{"s":"古诗文默写","sid":"poetry-memory","n":25,"id":"poetry-memory-direct-25","tag":"直接型默写","t":"自评题","stem":"25. ________，匹夫不可夺志也。（《论语》十二章）","ans":"三军可夺帅也","img":"../public/question-crops/poetry-memory/poetry-memory-direct-25.webp","aimg":"","src":"../public/source/poetry-memory/page-01.jpg","ph":false,"jx":"《论语》十二章。原句“三军可夺帅也，匹夫不可夺志也”，两句对举，先写“可夺”，故填“三军可夺帅也”。"},{"s":"古诗文默写","sid":"poetry-memory","n":26,"id":"poetry-memory-direct-26","tag":"直接型默写","t":"自评题","stem":"26. 博学而笃志，切问而近思，________。（《论语》十二章）","ans":"仁在其中矣","img":"../public/question-crops/poetry-memory/poetry-memory-direct-26.webp","aimg":"","src":"../public/source/poetry-memory/page-01.jpg","ph":false,"jx":"《论语》十二章。原句“博学而笃志，切问而近思，仁在其中矣”，三者是并列的修身条目，结论落在“仁”上。“笃”勿写作“督”。"},{"s":"古诗文默写","sid":"poetry-memory","n":27,"id":"poetry-memory-direct-27","tag":"直接型默写","t":"自评题","stem":"27. ________，险躁则不能治性。（《诫子书》）","ans":"淫慢则不能励精","img":"../public/question-crops/poetry-memory/poetry-memory-direct-27.webp","aimg":"","src":"../public/source/poetry-memory/page-01.jpg","ph":false,"jx":"《诫子书》诸葛亮（三国·蜀汉）。后句“险躁则不能治性”与前句对偶，“淫慢”对“险躁”、“励精”对“治性”，故填“淫慢则不能励精”。"},{"s":"古诗文默写","sid":"poetry-memory","n":28,"id":"poetry-memory-direct-28","tag":"直接型默写","t":"自评题","stem":"28. 夫君子之行，________，________。（《诫子书》）","ans":"静以修身 ｜ 俭以养德","img":"../public/question-crops/poetry-memory/poetry-memory-direct-28.webp","aimg":"","src":"../public/source/poetry-memory/page-01.jpg","ph":false,"jx":"《诫子书》诸葛亮。开篇提出“静以修身，俭以养德”，先“静”后“俭”分承修身与养德，注意两空次序。"},{"s":"古诗文默写","sid":"poetry-memory","n":29,"id":"poetry-memory-direct-29","tag":"直接型默写","t":"自评题","stem":"29. 非淡泊无以明志，________。（《诫子书》）","ans":"非宁静无以致远","img":"../public/question-crops/poetry-memory/poetry-memory-direct-29.webp","aimg":"","src":"../public/source/poetry-memory/page-01.jpg","ph":false,"jx":"《诫子书》诸葛亮。“淡泊”与“宁静”相应、“明志”与“致远”相应，两句对偶，故填“非宁静无以致远”。“致”勿写作“至”。"},{"s":"古诗文默写","sid":"poetry-memory","n":30,"id":"poetry-memory-direct-30","tag":"直接型默写","t":"自评题","stem":"30. ________，将复何及！（《诫子书》）","ans":"悲守穷庐","img":"../public/question-crops/poetry-memory/poetry-memory-direct-30.webp","aimg":"","src":"../public/source/poetry-memory/page-01.jpg","ph":false,"jx":"《诫子书》诸葛亮。末句感叹年华与意志“遂成枯落”，“悲守穷庐”则与后文“将复何及”呼应，故填“悲守穷庐”。"},{"s":"古诗文默写","sid":"poetry-memory","n":31,"id":"poetry-memory-direct-31","tag":"直接型默写","t":"自评题","stem":"31. ________，巴山夜雨涨秋池。（《夜雨寄北》）","ans":"君问归期未有期","img":"../public/question-crops/poetry-memory/poetry-memory-direct-31.webp","aimg":"","src":"../public/source/poetry-memory/page-01.jpg","ph":false,"jx":"《夜雨寄北》李商隐（晚唐）。上句是“君问归期”之答，点明羁旅羁留之愁，故填“君问归期未有期”。"},{"s":"古诗文默写","sid":"poetry-memory","n":32,"id":"poetry-memory-direct-32","tag":"直接型默写","t":"自评题","stem":"32. ________，却话巴山夜雨时。（《夜雨寄北》）","ans":"何当共剪西窗烛","img":"../public/question-crops/poetry-memory/poetry-memory-direct-32.webp","aimg":"","src":"../public/source/poetry-memory/page-01.jpg","ph":false,"jx":"《夜雨寄北》李商隐。后句“却话巴山夜雨时”是设想中的追忆，前面必是设想相聚，故填“何当共剪西窗烛”。"},{"s":"古诗文默写","sid":"poetry-memory","n":33,"id":"poetry-memory-direct-33","tag":"直接型默写","t":"自评题","stem":"33，不闻机杼声，\n（《木兰诗》）","ans":"惟闻女叹息","img":"../public/question-crops/poetry-memory/poetry-memory-direct-33.webp","aimg":"","src":"../public/source/poetry-memory/page-02.jpg","ph":false,"jx":"《木兰诗》（北朝民歌）。前句写听不到织布声，只听见木兰叹息，故填“惟闻女叹息”。“惟”勿写作“唯”。"},{"s":"古诗文默写","sid":"poetry-memory","n":34,"id":"poetry-memory-direct-34","tag":"直接型默写","t":"自评题","stem":"34.\n关山度若飞。\n《木兰诗》）","ans":"万里赴戎机","img":"../public/question-crops/poetry-memory/poetry-memory-direct-34.webp","aimg":"","src":"../public/source/poetry-memory/page-02.jpg","ph":false,"jx":"《木兰诗》。后句“关山度若飞”写行军神速，前句应写奔赴战场，故填“万里赴戎机”。“戎”勿写作“戌”。"},{"s":"古诗文默写","sid":"poetry-memory","n":35,"id":"poetry-memory-direct-35","tag":"直接型默写","t":"自评题","stem":"35.\n寒光照铁衣。\n《木兰诗》）","ans":"朔气传金柝","img":"../public/question-crops/poetry-memory/poetry-memory-direct-35.webp","aimg":"","src":"../public/source/poetry-memory/page-02.jpg","ph":false,"jx":"《木兰诗》。前句写北方寒气传来打更声，后句写“寒光照铁衣”，两句写边塞军营苦寒，故填“朔气传金柝”。“柝”勿写作“析”。"},{"s":"古诗文默写","sid":"poetry-memory","n":36,"id":"poetry-memory-direct-36","tag":"直接型默写","t":"自评题","stem":"36. 将军百战死，\n《木兰诗》）","ans":"壮士十年归","img":"../public/question-crops/poetry-memory/poetry-memory-direct-36.webp","aimg":"","src":"../public/source/poetry-memory/page-02.jpg","ph":false,"jx":"《木兰诗》。后句“将军百战死”与“壮士十年归”互文见义，写十年沙场的幸存者，故填“壮士十年归”。"},{"s":"古诗文默写","sid":"poetry-memory","n":37,"id":"poetry-memory-direct-37","tag":"直接型默写","t":"自评题","stem":"37. 当窗理云鬓，\n《木兰诗》）","ans":"对镜帖花黄","img":"../public/question-crops/poetry-memory/poetry-memory-direct-37.webp","aimg":"","src":"../public/source/poetry-memory/page-02.jpg","ph":false,"jx":"《木兰诗》。上句“当窗理云鬓”写梳头，下句写对着镜子贴花饰，故填“对镜帖花黄”。“帖”在此通“贴”，课本作“帖”。"},{"s":"古诗文默写","sid":"poetry-memory","n":38,"id":"poetry-memory-direct-38","tag":"直接型默写","t":"自评题","stem":"38.\n惟吾德馨。\n《陋室铭》）","ans":"斯是陋室","img":"../public/question-crops/poetry-memory/poetry-memory-direct-38.webp","aimg":"","src":"../public/source/poetry-memory/page-02.jpg","ph":false,"jx":"《陋室铭》刘禹锡（唐）。后句“惟吾德馨”是“吾”的自我陈述，前句先点明所居是陋室，故填“斯是陋室”。“馨”勿写作“磬”。"},{"s":"古诗文默写","sid":"poetry-memory","n":39,"id":"poetry-memory-direct-39","tag":"直接型默写","t":"自评题","stem":"39.\n草色人帘青。（《陋室铭》）","ans":"苔痕上阶绿","img":"../public/question-crops/poetry-memory/poetry-memory-direct-39.webp","aimg":"","src":"../public/source/poetry-memory/page-02.jpg","ph":false,"jx":"《陋室铭》刘禹锡。后句“草色入帘青”写室外景，前句写台阶苔痕，两句都写“陋室不陋”，故填“苔痕上阶绿”。“苔”勿写作“台”。"},{"s":"古诗文默写","sid":"poetry-memory","n":40,"id":"poetry-memory-direct-40","tag":"直接型默写","t":"自评题","stem":"40.无丝竹之乱耳，\n(《陋室铭》）","ans":"无案牍之劳形","img":"../public/question-crops/poetry-memory/poetry-memory-direct-40.webp","aimg":"","src":"../public/source/poetry-memory/page-02.jpg","ph":false,"jx":"《陋室铭》刘禹锡。上句“无丝竹之乱耳”写听觉不受扰乱，下句写身体不受公务劳形，故填“无案牍之劳形”。“牍”勿写作“渎”。"},{"s":"古诗文默写","sid":"poetry-memory","n":41,"id":"poetry-memory-direct-41","tag":"直接型默写","t":"自评题","stem":"41.孔子云：\n（《陋室铭》）","ans":"何陋之有","img":"../public/question-crops/poetry-memory/poetry-memory-direct-41.webp","aimg":"","src":"../public/source/poetry-memory/page-02.jpg","ph":false,"jx":"《陋室铭》刘禹锡。末句引孔子的话作结，反问中藏“不陋”之意，故填“何陋之有”。"},{"s":"古诗文默写","sid":"poetry-memory","n":42,"id":"poetry-memory-direct-42","tag":"直接型默写","t":"自评题","stem":"42.\n可爱者甚蕃。（《爱莲说》）","ans":"水陆草木之花","img":"../public/question-crops/poetry-memory/poetry-memory-direct-42.webp","aimg":"","src":"../public/source/poetry-memory/page-02.jpg","ph":false,"jx":"《爱莲说》周敦颐（北宋）。后句“可爱者甚蕃”中的“可爱者”指花，空格是“可爱者”的定语，故填“水陆草木之花”。"},{"s":"古诗文默写","sid":"poetry-memory","n":43,"id":"poetry-memory-direct-43","tag":"直接型默写","t":"自评题","stem":"43. 予独爱莲之出淤泥而不染，\n(《爱莲说》）","ans":"濯清涟而不妖","img":"../public/question-crops/poetry-memory/poetry-memory-direct-43.webp","aimg":"","src":"../public/source/poetry-memory/page-02.jpg","ph":false,"jx":"《爱莲说》周敦颐。名句“出淤泥而不染，濯清涟而不妖”上下对偶，“出淤泥”对“濯清涟”，故填“濯清涟而不妖”。“濯”意为洗涤，读 zhuó。"},{"s":"古诗文默写","sid":"poetry-memory","n":44,"id":"poetry-memory-direct-44","tag":"直接型默写","t":"自评题","stem":"44. 亭亭净植，\n。（《爱莲说》）","ans":"可远观而不可亵玩焉","img":"../public/question-crops/poetry-memory/poetry-memory-direct-44.webp","aimg":"","src":"../public/source/poetry-memory/page-02.jpg","ph":false,"jx":"《爱莲说》周敦颐。原句“亭亭净植，可远观而不可亵玩焉”，先写挺立之姿，再写只能远观。“亵”勿写作“泄”。"},{"s":"古诗文默写","sid":"poetry-memory","n":45,"id":"poetry-memory-direct-45","tag":"直接型默写","t":"自评题","stem":"45. 莲之爱，\n（《爱莲说》）","ans":"同予者何人","img":"../public/question-crops/poetry-memory/poetry-memory-direct-45.webp","aimg":"","src":"../public/source/poetry-memory/page-02.jpg","ph":false,"jx":"《爱莲说》周敦颐。三种花三种态度对照，末句以反问写知音之少，故填“同予者何人”。“予”即“我”。"},{"s":"古诗文默写","sid":"poetry-memory","n":46,"id":"poetry-memory-direct-46","tag":"直接型默写","t":"自评题","stem":"46. 牡丹之爱，\n，（《爱莲说》）","ans":"宜乎众矣","img":"../public/question-crops/poetry-memory/poetry-memory-direct-46.webp","aimg":"","src":"../public/source/poetry-memory/page-02.jpg","ph":false,"jx":"《爱莲说》周敦颐。承“牡丹之爱”而来，感叹逐利者众，故填“宜乎众矣”。“宜”在此意为“应当”。"},{"s":"古诗文默写","sid":"poetry-memory","n":47,"id":"poetry-memory-direct-47","tag":"直接型默写","t":"自评题","stem":"47.\n独怆然而涕下！（《登幽州台歌》）","ans":"念天地之悠悠","img":"../public/question-crops/poetry-memory/poetry-memory-direct-47.webp","aimg":"","src":"../public/source/poetry-memory/page-02.jpg","ph":false,"jx":"《登幽州台歌》陈子昂（唐）。后句“独怆然而涕下”写流泪，前句写天地悠悠、人生有限，故填“念天地之悠悠”。“怆”勿写作“苍”。"},{"s":"古诗文默写","sid":"poetry-memory","n":48,"id":"poetry-memory-direct-48","tag":"直接型默写","t":"自评题","stem":"48.\n齐鲁青未了。（《望岳》）","ans":"岱宗夫如何","img":"../public/question-crops/poetry-memory/poetry-memory-direct-48.webp","aimg":"","src":"../public/source/poetry-memory/page-02.jpg","ph":false,"jx":"《望岳》杜甫（唐）。后句“齐鲁青未了”是以齐鲁两地之色写泰山绵延，前面必先设问，故填“岱宗夫如何”。“岱”勿写作“贷”。"},{"s":"古诗文默写","sid":"poetry-memory","n":49,"id":"poetry-memory-direct-49","tag":"直接型默写","t":"自评题","stem":"49． 造化钟神秀，\n《望岳》）","ans":"阴阳割昏晓","img":"../public/question-crops/poetry-memory/poetry-memory-direct-49.webp","aimg":"","src":"../public/source/poetry-memory/page-02.jpg","ph":false,"jx":"《望岳》杜甫。“造化钟神秀”写泰山之秀，“阴阳割昏晓”写泰山之大，两句对偶，故填“阴阳割昏晓”。“割”字写出山势遮蔽天色之力。"},{"s":"古诗文默写","sid":"poetry-memory","n":50,"id":"poetry-memory-direct-50","tag":"直接型默写","t":"自评题","stem":"50. 荡胸生曾云，\n（《望岳》）","ans":"决眦入归鸟","img":"../public/question-crops/poetry-memory/poetry-memory-direct-50.webp","aimg":"","src":"../public/source/poetry-memory/page-02.jpg","ph":false,"jx":"《望岳》杜甫。上句“荡胸生曾云”写望中所见云气，下句写目送归鸟，两句连写远望之景，故填“决眦入归鸟”。“眦”勿写作“滋”。"},{"s":"古诗文默写","sid":"poetry-memory","n":51,"id":"poetry-memory-direct-51","tag":"直接型默写","t":"自评题","stem":"51. 会当凌绝顶，\n（《望岳》）","ans":"一览众山小","img":"../public/question-crops/poetry-memory/poetry-memory-direct-51.webp","aimg":"","src":"../public/source/poetry-memory/page-02.jpg","ph":false,"jx":"《望岳》杜甫。末联由望岳而抒怀，表达登临绝顶之志，故填“一览众山小”。“览”勿写作“揽”。"},{"s":"古诗文默写","sid":"poetry-memory","n":52,"id":"poetry-memory-direct-52","tag":"直接型默写","t":"自评题","stem":"52.\n闻说鸡鸣见曰升。 （《登飞来峰》）","ans":"飞来山上千寻塔","img":"../public/question-crops/poetry-memory/poetry-memory-direct-52.webp","aimg":"","src":"../public/source/poetry-memory/page-02.jpg","ph":false,"jx":"《登飞来峰》王安石（北宋）。下句“闻说鸡鸣见日升”透露出处之高，故填“飞来山上千寻塔”。"},{"s":"古诗文默写","sid":"poetry-memory","n":53,"id":"poetry-memory-direct-53","tag":"直接型默写","t":"自评题","stem":"53.\n自缘身在最高层。 （《登飞来峰》）","ans":"不畏浮云遮望眼","img":"../public/question-crops/poetry-memory/poetry-memory-direct-53.webp","aimg":"","src":"../public/source/poetry-memory/page-02.jpg","ph":false,"jx":"《登飞来峰》王安石。后句“自缘身在最高层”是原因，前句写不畏浮云蔽目，故填“不畏浮云遮望眼”。“遮”勿写作“庶”。"},{"s":"古诗文默写","sid":"poetry-memory","n":54,"id":"poetry-memory-direct-54","tag":"直接型默写","t":"自评题","stem":"54. 莫笑农家腊酒浑，\n《游山西村》","ans":"丰年留客足鸡豚","img":"../public/question-crops/poetry-memory/poetry-memory-direct-54.webp","aimg":"","src":"../public/source/poetry-memory/page-02.jpg","ph":false,"jx":"《游山西村》陆游（南宋）。上句“莫笑农家腊酒浑”写淳朴待客，下句写丰足，故填“丰年留客足鸡豚”。“豚”勿写作“逐”。"},{"s":"古诗文默写","sid":"poetry-memory","n":55,"id":"poetry-memory-direct-55","tag":"直接型默写","t":"自评题","stem":"55. 山重水复疑无路，\n《游山西村》","ans":"柳暗花明又一村","img":"../public/question-crops/poetry-memory/poetry-memory-direct-55.webp","aimg":"","src":"../public/source/poetry-memory/page-02.jpg","ph":false,"jx":"《游山西村》陆游。名句“山重水复疑无路，柳暗花明又一村”，前后转折，故填“柳暗花明又一村”。"},{"s":"古诗文默写","sid":"poetry-memory","n":56,"id":"poetry-memory-direct-56","tag":"直接型默写","t":"自评题","stem":"56.\n衣冠简朴古风存。\n《游山西村》","ans":"箫鼓追随春社近","img":"../public/question-crops/poetry-memory/poetry-memory-direct-56.webp","aimg":"","src":"../public/source/poetry-memory/page-02.jpg","ph":false,"jx":"《游山西村》陆游。后句“衣冠简朴古风存”写民风，前面写春社日的鼓乐迎神，故填“箫鼓追随春社近”。“箫”勿写作“萧”。"},{"s":"古诗文默写","sid":"poetry-memory","n":57,"id":"poetry-memory-direct-57","tag":"直接型默写","t":"自评题","stem":"57.从今若许闲乘月，\n《游山西村》","ans":"拄杖无时夜叩门","img":"../public/question-crops/poetry-memory/poetry-memory-direct-57.webp","aimg":"","src":"../public/source/poetry-memory/page-02.jpg","ph":false,"jx":"《游山西村》陆游。原句“从今若许闲乘月，拄杖无时夜叩门”，写盼望再来夜访，故填“拄杖无时夜叩门”。“叩”勿写作“扣”，课本作“叩”。"},{"s":"古诗文默写","sid":"poetry-memory","n":58,"id":"poetry-memory-direct-58","tag":"直接型默写","t":"自评题","stem":"58.\n吟鞭东指即天涯。\n《己亥杂诗》","ans":"浩荡离愁白日斜","img":"../public/question-crops/poetry-memory/poetry-memory-direct-58.webp","aimg":"","src":"../public/source/poetry-memory/page-02.jpg","ph":false,"jx":"《己亥杂诗》龚自珍（清）。下句“吟鞭东指即天涯”写离京远行，空格写离愁之盛，故填“浩荡离愁白日斜”。"},{"s":"古诗文默写","sid":"poetry-memory","n":59,"id":"poetry-memory-direct-59","tag":"直接型默写","t":"自评题","stem":"59. 落红不是无情物，\n（《己亥杂诗》","ans":"化作春泥更护花","img":"../public/question-crops/poetry-memory/poetry-memory-direct-59.webp","aimg":"","src":"../public/source/poetry-memory/page-02.jpg","ph":false,"jx":"《己亥杂诗》龚自珍。名句“落红不是无情物，化作春泥更护花”，以落花自喻，故填“化作春泥更护花”。"},{"s":"古诗文默写","sid":"poetry-memory","n":60,"id":"poetry-memory-direct-60","tag":"直接型默写","t":"自评题","stem":"60.\n，不见曦月。（《三峡》）","ans":"自非亭午夜分","img":"../public/question-crops/poetry-memory/poetry-memory-direct-60.webp","aimg":"","src":"../public/source/poetry-memory/page-02.jpg","ph":false,"jx":"《三峡》郦道元（北魏）。后句“不见曦月”写两岸山峰高峻蔽日，前句是假设连词引出的条件，故填“自非亭午夜分”。“曦”勿写作“熙”。"},{"s":"古诗文默写","sid":"poetry-memory","n":61,"id":"poetry-memory-direct-61","tag":"直接型默写","t":"自评题","stem":"61. 至于夏水襄陵，\n_。（《三峽》）","ans":"沿溯阻绝","img":"../public/question-crops/poetry-memory/poetry-memory-direct-61.webp","aimg":"","src":"../public/source/poetry-memory/page-02.jpg","ph":false,"jx":"《三峡》郦道元。后句“沿溯阻绝”是“夏水襄陵”的直接后果，故填“沿溯阻绝”。“溯”勿写作“塑”。"},{"s":"古诗文默写","sid":"poetry-memory","n":62,"id":"poetry-memory-direct-62","tag":"直接型默写","t":"自评题","stem":"62.\n不以痪也。（《三峽》","ans":"虽乘奔御风","img":"../public/question-crops/poetry-memory/poetry-memory-direct-62.webp","aimg":"","src":"../public/source/poetry-memory/page-02.jpg","ph":false,"jx":"《三峡》郦道元。原句“虽乘奔御风，不以疾也”，以夸张反衬夏水之迅疾，故填“虽乘奔御风”。“御”勿写作“驭”。"},{"s":"古诗文默写","sid":"poetry-memory","n":63,"id":"poetry-memory-direct-63","tag":"直接型默写","t":"自评题","stem":"63.\n良多趣味。 《三峡》）","ans":"清荣峻茂","img":"../public/question-crops/poetry-memory/poetry-memory-direct-63.webp","aimg":"","src":"../public/source/poetry-memory/page-02.jpg","ph":false,"jx":"《三峡》郦道元。原句“清荣峻茂，良多趣味”，四字分写水清、树荣、山峻、草茂，故填“清荣峻茂”。"},{"s":"古诗文默写","sid":"poetry-memory","n":64,"id":"poetry-memory-direct-64","tag":"直接型默写","t":"自评题","stem":"64. 空谷传响，\n《三峽》）","ans":"哀转久绝","img":"../public/question-crops/poetry-memory/poetry-memory-direct-64.webp","aimg":"","src":"../public/source/poetry-memory/page-02.jpg","ph":false,"jx":"《三峡》郦道元。前句写“空谷传响”，后句写回声久久才消散，故填“哀转久绝”。“哀转”的“转”意为婉转。"},{"s":"古诗文默写","sid":"poetry-memory","n":65,"id":"poetry-memory-direct-65","tag":"直接型默写","t":"自评题","stem":"65. 高峰入云，\n《答谢中书书》）","ans":"清流见底","img":"../public/question-crops/poetry-memory/poetry-memory-direct-65.webp","aimg":"","src":"../public/source/poetry-memory/page-02.jpg","ph":false,"jx":"《答谢中书书》陶弘景（南朝·梁）。上句写“高峰入云”，下句由山及水，故填“清流见底”。"},{"s":"古诗文默写","sid":"poetry-memory","n":66,"id":"poetry-memory-direct-66","tag":"直接型默写","t":"自评题","stem":"66. 青竹翠林，\n《答谢中书书》）","ans":"四时俱备","img":"../public/question-crops/poetry-memory/poetry-memory-direct-66.webp","aimg":"","src":"../public/source/poetry-memory/page-02.jpg","ph":false,"jx":"《答谢中书书》陶弘景。课本作“青林翠竹，四时俱备”，后句“四时”即四季，前句写林木竹丛，故填“四时俱备”。“俱”勿写作“具”。"},{"s":"古诗文默写","sid":"poetry-memory","n":67,"id":"poetry-memory-direct-67","tag":"直接型默写","t":"自评题","stem":"直接型默写第 67 题：请查看原题页后完成默写。","ans":"夕日欲颓","img":"../public/question-crops/poetry-memory/poetry-memory-direct-67.webp","aimg":"","src":"../public/source/poetry-memory/page-02.jpg","ph":false,"jx":"《答谢中书书》陶弘景。原句“夕日欲颓，沉鳞竞跃”，写傍晚时分水中鱼群争跃。此处填上句。“颓”指（太阳）落下。"},{"s":"古诗文默写","sid":"poetry-memory","n":68,"id":"poetry-memory-direct-68","tag":"直接型默写","t":"自评题","stem":"直接型默写第 68 题：请查看原题页后完成默写。","ans":"未复有能与其奇者","img":"../public/question-crops/poetry-memory/poetry-memory-direct-68.webp","aimg":"","src":"../public/source/poetry-memory/page-02.jpg","ph":false,"jx":"《答谢中书书》陶弘景。这是全文末句，“自康乐以来，未复有能与其奇者”，表达知音难遇之叹。“与”读 yù，意为参与、欣赏。"},{"s":"古诗文默写","sid":"poetry-memory","n":69,"id":"poetry-memory-direct-69","tag":"直接型默写","t":"自评题","stem":"直接型默写第 69 题：请查看原题页后完成默写。","ans":"遂至承天寺寻张怀民","img":"../public/question-crops/poetry-memory/poetry-memory-direct-69.webp","aimg":"","src":"../public/source/poetry-memory/page-02.jpg","ph":false,"jx":"《记承天寺夜游》苏轼（北宋）。原句“遂至承天寺寻张怀民”写夜起之后去寻友，是叙事的第一步。“遂”意为于是。"},{"s":"古诗文默写","sid":"poetry-memory","n":70,"id":"poetry-memory-direct-70","tag":"直接型默写","t":"自评题","stem":"70.\n相与步于中庭。（《记承天寺夜游》）","ans":"怀民亦未寝","img":"../public/question-crops/poetry-memory/poetry-memory-direct-70.webp","aimg":"","src":"../public/source/poetry-memory/page-02.jpg","ph":false,"jx":"《记承天寺夜游》苏轼。前句“遂至承天寺寻张怀民”，后句“相与步于中庭”，说明友人未睡，故填“怀民亦未寝”。“寝”勿写作“侵”。"},{"s":"古诗文默写","sid":"poetry-memory","n":71,"id":"poetry-memory-direct-71","tag":"直接型默写","t":"自评题","stem":"71.\n_，盖竹柏影也。（《记承天寺夜游》）","ans":"庭下如积水空明，水中藻、荇交横","img":"../public/question-crops/poetry-memory/poetry-memory-direct-71.webp","aimg":"","src":"../public/source/poetry-memory/page-03.jpg","ph":false,"jx":"《记承天寺夜游》苏轼。后句“盖竹柏影也”是比喻的本体还原，故前句须是比喻句“庭下如积水空明，水中藻、荇交横”。注意“藻、荇”是并列，顿号不可省。"},{"s":"古诗文默写","sid":"poetry-memory","n":72,"id":"poetry-memory-direct-72","tag":"直接型默写","t":"自评题","stem":"72. 何夜无月？何处无竹柏？\n星。（《记承天寺夜游》）","ans":"但少闲人如吾两人者耳","img":"../public/question-crops/poetry-memory/poetry-memory-direct-72.webp","aimg":"","src":"../public/source/poetry-memory/page-03.jpg","ph":false,"jx":"《记承天寺夜游》苏轼。前两句反问“何夜无月？何处无竹柏？”，此句作结，点出所缺的只是知音，故填“但少闲人如吾两人者耳”。“闲人”含自嘲与自负。"},{"s":"古诗文默写","sid":"poetry-memory","n":73,"id":"poetry-memory-direct-73","tag":"直接型默写","t":"自评题","stem":"73.\n_，地利不如人和。（《得道多助，失道寡助》）","ans":"天时不如地利","img":"../public/question-crops/poetry-memory/poetry-memory-direct-73.webp","aimg":"","src":"../public/source/poetry-memory/page-03.jpg","ph":false,"jx":"《得道多助，失道寡助》孟子（战国）。全句为“天时不如地利，地利不如人和”，两句递进比较，故填“天时不如地利”。"},{"s":"古诗文默写","sid":"poetry-memory","n":74,"id":"poetry-memory-direct-74","tag":"直接型默写","t":"自评题","stem":"74. 域民不以封疆之界，\n_。（《得道多助，失道寡助》）","ans":"固国不以山溪之险 ｜ 威天下不以兵革之利","img":"../public/question-crops/poetry-memory/poetry-memory-direct-74.webp","aimg":"","src":"../public/source/poetry-memory/page-03.jpg","ph":false,"jx":"《得道多助，失道寡助》孟子。原句“域民不以封疆之界，固国不以山溪之险，威天下不以兵革之利”三句排比，两空依次填“固国不以山溪之险”“威天下不以兵革之利”。"},{"s":"古诗文默写","sid":"poetry-memory","n":75,"id":"poetry-memory-direct-75","tag":"直接型默写","t":"自评题","stem":"75.寡助之至，\n（《得道多助，失道寡助》）","ans":"亲戚畔之","img":"../public/question-crops/poetry-memory/poetry-memory-direct-75.webp","aimg":"","src":"../public/source/poetry-memory/page-03.jpg","ph":false,"jx":"《得道多助，失道寡助》孟子。原句“寡助之至，亲戚畔之”，写失道者众叛亲离。“畔”通“叛”。"},{"s":"古诗文默写","sid":"poetry-memory","n":76,"id":"poetry-memory-direct-76","tag":"直接型默写","t":"自评题","stem":"76.\n贫贱不能移，\n。（《富贵不能淫》）","ans":"富贵不能淫 ｜ 威武不能屈","img":"../public/question-crops/poetry-memory/poetry-memory-direct-76.webp","aimg":"","src":"../public/source/poetry-memory/page-03.jpg","ph":false,"jx":"《富贵不能淫》孟子。原句“富贵不能淫，贫贱不能移，威武不能屈”，以“富贵”起首、以“威武”收尾，两空依次填“富贵不能淫”“威武不能屈”。“淫”在此意为迷惑。"},{"s":"古诗文默写","sid":"poetry-memory","n":77,"id":"poetry-memory-direct-77","tag":"直接型默写","t":"自评题","stem":"77.\n必先苦其心志。（《生于忧患，死于安乐》）","ans":"故天将降大任于是人也","img":"../public/question-crops/poetry-memory/poetry-memory-direct-77.webp","aimg":"","src":"../public/source/poetry-memory/page-03.jpg","ph":false,"jx":"《生于忧患，死于安乐》孟子。后句“必先苦其心志”是上天的磨练，前面应写担当大任，故填“故天将降大任于是人也”。“是”课本作“是”（有人亦作“斯”）。"},{"s":"古诗文默写","sid":"poetry-memory","n":78,"id":"poetry-memory-direct-78","tag":"直接型默写","t":"自评题","stem":"78. 困于心，\n__，而后作。（《生于忧患，死于安乐》）","ans":"衡于虑","img":"../public/question-crops/poetry-memory/poetry-memory-direct-78.webp","aimg":"","src":"../public/source/poetry-memory/page-03.jpg","ph":false,"jx":"《生于忧患，死于安乐》孟子。原句“困于心，衡于虑，而后作”，“衡”通“横”，指思虑阻塞。故填“衡于虑”。"},{"s":"古诗文默写","sid":"poetry-memory","n":79,"id":"poetry-memory-direct-79","tag":"直接型默写","t":"自评题","stem":"79.\n出则无敌国外患者，国恒亡。（《生于忧患，死于安乐》）","ans":"入则无法家拂士","img":"../public/question-crops/poetry-memory/poetry-memory-direct-79.webp","aimg":"","src":"../public/source/poetry-memory/page-03.jpg","ph":false,"jx":"《生于忧患，死于安乐》孟子。原句“入则无法家拂士，出则无敌国外患者，国恒亡”，从“入”“出”两面写亡国条件，故填“入则无法家拂士”。“拂士”的“拂”读 bì，通“弼”。"},{"s":"古诗文默写","sid":"poetry-memory","n":80,"id":"poetry-memory-direct-80","tag":"直接型默写","t":"自评题","stem":"80.\n而无车马喧。〔《饮酒（其五）》〕","ans":"结庐在人境","img":"../public/question-crops/poetry-memory/poetry-memory-direct-80.webp","aimg":"","src":"../public/source/poetry-memory/page-03.jpg","ph":false,"jx":"《饮酒（其五）》陶渊明（东晋）。后句“而无车马喧”承“结庐在人境”而来，先写居所后写无喧扰，故填“结庐在人境”。“庐”勿写作“芦”。"},{"s":"古诗文默写","sid":"poetry-memory","n":81,"id":"poetry-memory-direct-81","tag":"直接型默写","t":"自评题","stem":"81. 问君何能尔？\n《饮酒（其五）》]","ans":"心远地自偏","img":"../public/question-crops/poetry-memory/poetry-memory-direct-81.webp","aimg":"","src":"../public/source/poetry-memory/page-03.jpg","ph":false,"jx":"《饮酒（其五）》陶渊明。前句自问“问君何能尔”，后句自答因心境高远，故填“心远地自偏”。"},{"s":"古诗文默写","sid":"poetry-memory","n":82,"id":"poetry-memory-direct-82","tag":"直接型默写","t":"自评题","stem":"82.\n悠然见南山。 [《饮酒（其五）》]","ans":"采菊东篱下","img":"../public/question-crops/poetry-memory/poetry-memory-direct-82.webp","aimg":"","src":"../public/source/poetry-memory/page-03.jpg","ph":false,"jx":"《饮酒（其五）》陶渊明。原句“采菊东篱下，悠然见南山”，“见”是无意中看到，写出闲适。“见”不可改为“望”。"},{"s":"古诗文默写","sid":"poetry-memory","n":83,"id":"poetry-memory-direct-83","tag":"直接型默写","t":"自评题","stem":"83. 山气日夕佳，\n《饮酒（其五）》]","ans":"飞鸟相与还","img":"../public/question-crops/poetry-memory/poetry-memory-direct-83.webp","aimg":"","src":"../public/source/poetry-memory/page-03.jpg","ph":false,"jx":"《饮酒（其五）》陶渊明。上句写山间暮色，下句写飞鸟结伴还巢，两句写归趣，故填“飞鸟相与还”。“相与”意为共同、一起。"},{"s":"古诗文默写","sid":"poetry-memory","n":84,"id":"poetry-memory-direct-84","tag":"直接型默写","t":"自评题","stem":"84. 此中有真意，\n《饮酒（其五）》]","ans":"欲辨已忘言","img":"../public/question-crops/poetry-memory/poetry-memory-direct-84.webp","aimg":"","src":"../public/source/poetry-memory/page-03.jpg","ph":false,"jx":"《饮酒（其五）》陶渊明。前句“此中有真意”点出有深意，此句写想说却已忘言，故填“欲辨已忘言”。“辨”在此意为辨析、说明。"},{"s":"古诗文默写","sid":"poetry-memory","n":85,"id":"poetry-memory-direct-85","tag":"直接型默写","t":"自评题","stem":"85.\n城春草木深。（《春望》）","ans":"国破山河在","img":"../public/question-crops/poetry-memory/poetry-memory-direct-85.webp","aimg":"","src":"../public/source/poetry-memory/page-03.jpg","ph":false,"jx":"《春望》杜甫（唐）。后句“城春草木深”写春日照临下的荒芜，前句写国都沦陷而山河依旧，故填“国破山河在”。“国”指国都长安。"},{"s":"古诗文默写","sid":"poetry-memory","n":86,"id":"poetry-memory-direct-86","tag":"直接型默写","t":"自评题","stem":"86.感时花溅泪，\n《春望》）","ans":"恨别鸟惊心","img":"../public/question-crops/poetry-memory/poetry-memory-direct-86.webp","aimg":"","src":"../public/source/poetry-memory/page-03.jpg","ph":false,"jx":"《春望》杜甫。上句“感时花溅泪”写因时局而流泪，下句写为离别而惊心，两句拟人，故填“恨别鸟惊心”。"},{"s":"古诗文默写","sid":"poetry-memory","n":87,"id":"poetry-memory-direct-87","tag":"直接型默写","t":"自评题","stem":"87.\n家书抵万金。\n《春望》）","ans":"烽火连三月","img":"../public/question-crops/poetry-memory/poetry-memory-direct-87.webp","aimg":"","src":"../public/source/poetry-memory/page-03.jpg","ph":false,"jx":"《春望》杜甫。后句“家书抵万金”写家信珍贵，前提是战火阻隔，故填“烽火连三月”。“烽”勿写作“峰”。"},{"s":"古诗文默写","sid":"poetry-memory","n":88,"id":"poetry-memory-direct-88","tag":"直接型默写","t":"自评题","stem":"88. 白头搔更短，\n《春望》）","ans":"浑欲不胜簪","img":"../public/question-crops/poetry-memory/poetry-memory-direct-88.webp","aimg":"","src":"../public/source/poetry-memory/page-03.jpg","ph":false,"jx":"《春望》杜甫。前句“白头搔更短”写愁苦日深，此句写白发稀到插不住簪，故填“浑欲不胜簪”。“簪”勿写作“赞”。"},{"s":"古诗文默写","sid":"poetry-memory","n":89,"id":"poetry-memory-direct-89","tag":"直接型默写","t":"自评题","stem":"89．黑云压城城欲摧，\n（《雁门太守行》","ans":"甲光向日金鳞开","img":"../public/question-crops/poetry-memory/poetry-memory-direct-89.webp","aimg":"","src":"../public/source/poetry-memory/page-03.jpg","ph":false,"jx":"《雁门太守行》李贺（中唐）。上句“黑云压城城欲摧”写敌军压境，下句写守军铠甲映日，两句一暗一明，故填“甲光向日金鳞开”。“鳞”勿写作“麟”。"},{"s":"古诗文默写","sid":"poetry-memory","n":90,"id":"poetry-memory-direct-90","tag":"直接型默写","t":"自评题","stem":"90. 角声满天秋色里，\n《雁门太守行》）","ans":"塞上燕脂凝夜紫","img":"../public/question-crops/poetry-memory/poetry-memory-direct-90.webp","aimg":"","src":"../public/source/poetry-memory/page-03.jpg","ph":false,"jx":"《雁门太守行》李贺。上句写“角声满天”是听觉，下句写日光染色是视觉，两句从声、色两面写战斗，故填“塞上燕脂凝夜紫”。“燕脂”即胭脂。"},{"s":"古诗文默写","sid":"poetry-memory","n":91,"id":"poetry-memory-direct-91","tag":"直接型默写","t":"自评题","stem":"91.\n霜重鼓寒声不起。（《雁门太守行》）","ans":"半卷红旗临易水","img":"../public/question-crops/poetry-memory/poetry-memory-direct-91.webp","aimg":"","src":"../public/source/poetry-memory/page-03.jpg","ph":false,"jx":"《雁门太守行》李贺。后句“霜重鼓寒声不起”写寒夜苦战，前面写部队夜行军至易水，故填“半卷红旗临易水”。“卷”勿写作“捲”。"},{"s":"古诗文默写","sid":"poetry-memory","n":92,"id":"poetry-memory-direct-92","tag":"直接型默写","t":"自评题","stem":"92. 报君黄金台上意，\n《雁门太守行》）","ans":"提携玉龙为君死","img":"../public/question-crops/poetry-memory/poetry-memory-direct-92.webp","aimg":"","src":"../public/source/poetry-memory/page-03.jpg","ph":false,"jx":"《雁门太守行》李贺。上句“报君黄金台上意”用燕昭王筑台招贤之典，下句表誓死杀敌，故填“提携玉龙为君死”。“玉龙”是宝剑的代称。"},{"s":"古诗文默写","sid":"poetry-memory","n":93,"id":"poetry-memory-direct-93","tag":"直接型默写","t":"自评题","stem":"93.\n自将磨洗认前朝。\n《赤壁》","ans":"折戟沉沙铁未销","img":"../public/question-crops/poetry-memory/poetry-memory-direct-93.webp","aimg":"","src":"../public/source/poetry-memory/page-03.jpg","ph":false,"jx":"《赤壁》杜牧（晚唐）。后句“自将磨洗认前朝”是磨洗折戟后的动作，前面写沙中拾得残戟，故填“折戟沉沙铁未销”。“销”指锈蚀、销蚀。"},{"s":"古诗文默写","sid":"poetry-memory","n":94,"id":"poetry-memory-direct-94","tag":"直接型默写","t":"自评题","stem":"94. 东风不与周郎便，\n《赤壁》","ans":"铜雀春深锁二乔","img":"../public/question-crops/poetry-memory/poetry-memory-direct-94.webp","aimg":"","src":"../public/source/poetry-memory/page-03.jpg","ph":false,"jx":"《赤壁》杜牧。上句假想“东风不与周郎便”，下句推想东吴败亡的结局，以反笔议论，故填“铜雀春深锁二乔”。"},{"s":"古诗文默写","sid":"poetry-memory","n":95,"id":"poetry-memory-direct-95","tag":"直接型默写","t":"自评题","stem":"95.仿佛梦魂归帝所，闻天语，\n。（《渔家傲•天接云涛连晓雾》）","ans":"殷勤问我归何处","img":"../public/question-crops/poetry-memory/poetry-memory-direct-95.webp","aimg":"","src":"../public/source/poetry-memory/page-03.jpg","ph":false,"jx":"《渔家傲·天接云涛连晓雾》李清照（宋）。前句写“闻天语”，此句接写天帝殷勤询问，故填“殷勤问我归何处”。“殷勤”意为情意恳切。"},{"s":"古诗文默写","sid":"poetry-memory","n":96,"id":"poetry-memory-direct-96","tag":"直接型默写","t":"自评题","stem":"96.\n_，学诗谩有惊人句。（ 《渔家傲．天接云涛连晓雾》）","ans":"我报路长嗟日暮","img":"../public/question-crops/poetry-memory/poetry-memory-direct-96.webp","aimg":"","src":"../public/source/poetry-memory/page-03.jpg","ph":false,"jx":"《渔家傲·天接云涛连晓雾》李清照。后句“学诗谩有惊人句”是“报”的内容之一，前句写路长日暮，感叹求索无功，故填“我报路长嗟日暮”。“嗟”勿写作“磋”。"},{"s":"古诗文默写","sid":"poetry-memory","n":97,"id":"poetry-memory-direct-97","tag":"直接型默写","t":"自评题","stem":"97. 风休住，\n_！（《渔家傲．天接云涛连晓雾》）","ans":"蓬舟吹取三山去","img":"../public/question-crops/poetry-memory/poetry-memory-direct-97.webp","aimg":"","src":"../public/source/poetry-memory/page-03.jpg","ph":false,"jx":"《渔家傲·天接云涛连晓雾》李清照。原句“九万里风鹏正举。风休住，蓬舟吹取三山去”，写乘风远举之愿，故填“蓬舟吹取三山去”。“蓬”勿写作“篷”。"},{"s":"古诗文默写","sid":"poetry-memory","n":98,"id":"poetry-memory-direct-98","tag":"直接型默写","t":"自评题","stem":"98. 缘溪行，\n（《桃花源记》）","ans":"忘路之远近","img":"../public/question-crops/poetry-memory/poetry-memory-direct-98.webp","aimg":"","src":"../public/source/poetry-memory/page-03.jpg","ph":false,"jx":"《桃花源记》陶渊明（东晋）。后句写乘船前行，前句点出“缘溪行”的缘由是忘了路程远近，故填“忘路之远近”。"},{"s":"古诗文默写","sid":"poetry-memory","n":99,"id":"poetry-memory-direct-99","tag":"直接型默写","t":"自评题","stem":"99. 复行数十步，\n_。（《桃花源记》）","ans":"豁然开朗","img":"../public/question-crops/poetry-memory/poetry-memory-direct-99.webp","aimg":"","src":"../public/source/poetry-memory/page-03.jpg","ph":false,"jx":"《桃花源记》陶渊明。原句“复行数十步，豁然开朗”，写山有小口、穿行之后忽然开阔，故填“豁然开朗”。“豁”勿写作“格”。"},{"s":"古诗文默写","sid":"poetry-memory","n":100,"id":"poetry-memory-direct-100","tag":"直接型默写","t":"自评题","stem":"100.\n并怡然自乐。（《桃花源记》）","ans":"黄发垂髫","img":"../public/question-crops/poetry-memory/poetry-memory-direct-100.webp","aimg":"","src":"../public/source/poetry-memory/page-03.jpg","ph":false,"jx":"《桃花源记》陶渊明。后句“并怡然自乐”的主人是老人和小孩，故填“黄发垂髫”。“黄发”指老人，“垂髫”指小孩，两者不可互换。"},{"s":"古诗文默写","sid":"poetry-memory","n":101,"id":"poetry-memory-direct-101","tag":"直接型默写","t":"自评题","stem":"101. 村中闻有此人，\n《桃花源记》","ans":"咸来问讯","img":"../public/question-crops/poetry-memory/poetry-memory-direct-101.webp","aimg":"","src":"../public/source/poetry-memory/page-03.jpg","ph":false,"jx":"《桃花源记》陶渊明。后句写村人纷纷前来打听消息，前提是此人已被村中听见，故填“咸来问讯”。“咸”意为都。"},{"s":"古诗文默写","sid":"poetry-memory","n":102,"id":"poetry-memory-direct-102","tag":"直接型默写","t":"自评题","stem":"102.\n设酒杀鸡作食。（《桃花源记》","ans":"便要还家","img":"../public/question-crops/poetry-memory/poetry-memory-direct-102.webp","aimg":"","src":"../public/source/poetry-memory/page-03.jpg","ph":false,"jx":"《桃花源记》陶渊明。后句“设酒杀鸡作食”是待客之举，前面写村人邀请到家，故填“便要还家”。“要”通“邀”。"},{"s":"古诗文默写","sid":"poetry-memory","n":103,"id":"poetry-memory-direct-103","tag":"直接型默写","t":"自评题","stem":"103.\n皆出酒食。（《桃花源记》）","ans":"余人各复延至其家","img":"../public/question-crops/poetry-memory/poetry-memory-direct-103.webp","aimg":"","src":"../public/source/poetry-memory/page-03.jpg","ph":false,"jx":"《桃花源记》陶渊明。后句“皆出酒食”的主语是其余村民，前面写各自把人请到家，故填“余人各复延至其家”。“延”意为邀请。"},{"s":"古诗文默写","sid":"poetry-memory","n":104,"id":"poetry-memory-direct-104","tag":"直接型默写","t":"自评题","stem":"104. 伐竹取道，下见小潭，\n_。（《小石潭记》","ans":"水尤清冽","img":"../public/question-crops/poetry-memory/poetry-memory-direct-104.webp","aimg":"","src":"../public/source/poetry-memory/page-03.jpg","ph":false,"jx":"《小石潭记》柳宗元（唐）。原句“伐竹取道，下见小潭，水尤清冽”，先开路、再见潭、后写水清，故填“水尤清冽”。“冽”从“冫”，勿写作“洌”。"},{"s":"古诗文默写","sid":"poetry-memory","n":105,"id":"poetry-memory-direct-105","tag":"直接型默写","t":"自评题","stem":"105. 青树翠蔓，\n_，参差披拂。（《小石潭记》）","ans":"蒙络摇缀","img":"../public/question-crops/poetry-memory/poetry-memory-direct-105.webp","aimg":"","src":"../public/source/poetry-memory/page-03.jpg","ph":false,"jx":"《小石潭记》柳宗元。原句“青树翠蔓，蒙络摇缀，参差披拂”，写藤蔓缠绕下垂之态，故填“蒙络摇缀”。“蔓”勿写作“漫”。"},{"s":"古诗文默写","sid":"poetry-memory","n":106,"id":"poetry-memory-direct-106","tag":"直接型默写","t":"自评题","stem":"106. 潭西南而望，\n_。（《小石潭记》\n25","ans":"斗折蛇行，明灭可见","img":"../public/question-crops/poetry-memory/poetry-memory-direct-106.webp","aimg":"","src":"../public/source/poetry-memory/page-03.jpg","ph":false,"jx":"《小石潭记》柳宗元。原句“潭西南而望，斗折蛇行，明灭可见”，以北斗弯折、游蛇蜿蜒喻溪身，故填“斗折蛇行，明灭可见”。“斗”指北斗星，读 dǒu。"},{"s":"古诗文默写","sid":"poetry-memory","n":107,"id":"poetry-memory-direct-107","tag":"直接型默写","t":"自评题","stem":"107.\n不可知其源。（《小石潭记》）","ans":"其岸势犬牙差互","img":"../public/question-crops/poetry-memory/poetry-memory-direct-107.webp","aimg":"","src":"../public/source/poetry-memory/page-03.jpg","ph":false,"jx":"《小石潭记》柳宗元。前句“其岸势犬牙差互”写岸形参差，后句“不可知其源”是由此推出的结论，故填“其岸势犬牙差互”。“差互”意为交错。"},{"s":"古诗文默写","sid":"poetry-memory","n":108,"id":"poetry-memory-direct-108","tag":"直接型默写","t":"自评题","stem":"108.\n不可久居，乃记之而去。（《小石潭记》","ans":"以其境过清","img":"../public/question-crops/poetry-memory/poetry-memory-direct-108.webp","aimg":"","src":"../public/source/poetry-memory/page-03.jpg","ph":false,"jx":"《小石潭记》柳宗元。后句“不可久居，乃记之而去”写离开，前句点明离开的原因是环境过于清冷，故填“以其境过清”。“以”意为因为。"},{"s":"古诗文默写","sid":"poetry-memory","n":109,"id":"poetry-memory-direct-109","tag":"直接型默写","t":"自评题","stem":"109.关关雎鸠，\n（《诗经．关雎》）","ans":"在河之洲","img":"../public/question-crops/poetry-memory/poetry-memory-direct-109.webp","aimg":"","src":"../public/source/poetry-memory/page-04.jpg","ph":false,"jx":"《诗经·关雎》（西周至春秋）。后句“在河之洲”写雎鸠所栖之处，前句以鸟鸣起兴，故填“关关雎鸠”。“雎”从“且”，勿写作“睢”。"},{"s":"古诗文默写","sid":"poetry-memory","n":110,"id":"poetry-memory-direct-110","tag":"直接型默写","t":"自评题","stem":"110. ________，君子好逑。（《诗经·关雎》）","ans":"窈窕淑女","img":"../public/question-crops/poetry-memory/poetry-memory-direct-110.webp","aimg":"","src":"../public/source/poetry-memory/page-04.jpg","ph":false,"jx":"《诗经·关雎》。上句“窈窕淑女”写女子之美好，下句写男子的思慕，故填“窈窕淑女”。“窈窕”勿写作“遥眺”。"},{"s":"古诗文默写","sid":"poetry-memory","n":111,"id":"poetry-memory-direct-111","tag":"直接型默写","t":"自评题","stem":"111. 求之不得，寤寐思服。\n_，辗转反侧。（《诗经•关雎》）","ans":"悠哉悠哉","img":"../public/question-crops/poetry-memory/poetry-memory-direct-111.webp","aimg":"","src":"../public/source/poetry-memory/page-04.jpg","ph":false,"jx":"《诗经·关雎》。前句“求之不得，寤寐思服”写思念之切，此句写因思而辗转难眠，故填“悠哉悠哉”。“哉”勿写作“栽”。"},{"s":"古诗文默写","sid":"poetry-memory","n":112,"id":"poetry-memory-direct-112","tag":"直接型默写","t":"自评题","stem":"112. 蒹葭苍苍，\n。所谓伊人，\n星。（《诗经•兼葭》）","ans":"白露为霜 ｜ 在水一方","img":"../public/question-crops/poetry-memory/poetry-memory-direct-112.webp","aimg":"","src":"../public/source/poetry-memory/page-04.jpg","ph":false,"jx":"《诗经·蒹葭》（西周至春秋）。开篇以秋景起兴，两空依次填“白露为霜”“在水一方”。注意“蒹葭”勿写作“兼葭”。"},{"s":"古诗文默写","sid":"poetry-memory","n":113,"id":"poetry-memory-direct-113","tag":"直接型默写","t":"自评题","stem":"113.《论语》十二章中，阐述“学”和“思”辦证关系的句子是_","ans":"学而不思则罔，思而不学则殆","img":"../public/question-crops/poetry-memory/poetry-memory-direct-113.webp","aimg":"","src":"../public/source/poetry-memory/page-04.jpg","ph":false,"jx":"《论语》十二章。题干问“学”与“思”的辩证关系，原文即“学而不思则罔，思而不学则殆”，两面兼顾方为辩证。“罔”“殆”两字都不可漏。"},{"s":"古诗文默写","sid":"poetry-memory","n":114,"id":"poetry-memory-direct-114","tag":"直接型默写","t":"自评题","stem":"114. 求学应该谦虚，正如孔子在《论语》十二章中所说：","ans":"三人行，必有我师焉","img":"../public/question-crops/poetry-memory/poetry-memory-direct-114.webp","aimg":"","src":"../public/source/poetry-memory/page-04.jpg","ph":false,"jx":"《论语》十二章。题干关键词是“谦虚”“求师”，对应原文“三人行，必有我师焉”。“焉”是句末兼词，不可省。"},{"s":"古诗文默写","sid":"poetry-memory","n":115,"id":"poetry-memory-direct-115","tag":"直接型默写","t":"自评题","stem":"115.《论语》十二章中提出当别人不了解自己、误解自己时要_","ans":"人不知而不愠，不亦君子乎","img":"../public/question-crops/poetry-memory/poetry-memory-direct-115.webp","aimg":"","src":"../public/source/poetry-memory/page-04.jpg","ph":false,"jx":"《论语》十二章。题干问“别人不了解、误解自己时”的态度，原文即“人不知而不愠，不亦君子乎”，重点在“不愠”（不恼怒）。"},{"s":"古诗文默写","sid":"poetry-memory","n":116,"id":"poetry-memory-direct-116","tag":"直接型默写","t":"自评题","stem":"116.《论语》十二章《述而》篇中论述君子对富贵的正确态度是","ans":"不义而富且贵，于我如浮云","img":"../public/question-crops/poetry-memory/poetry-memory-direct-116.webp","aimg":"","src":"../public/source/poetry-memory/page-04.jpg","ph":false,"jx":"《论语》十二章。题干限定《述而》篇、问“对富贵的正确态度”，对应“不义而富且贵，于我如浮云”——关键在“不义”二字，义然后取。"},{"s":"古诗文默写","sid":"poetry-memory","n":117,"id":"poetry-memory-direct-117","tag":"直接型默写","t":"自评题","stem":"117.唐太宗有一句名言“以人为鉴，可以知得失”。由此我们可以联想到《论语》十二章中孔子的","ans":"择其善者而从之，其不善者而改之","img":"../public/question-crops/poetry-memory/poetry-memory-direct-117.webp","aimg":"","src":"../public/source/poetry-memory/page-04.jpg","ph":false,"jx":"《论语》十二章。题干用唐太宗“以人为鉴”的名言作引，落到孔子“择其善者而从之，其不善者而改之”，兼含学人之善与自改其过两面。"},{"s":"古诗文默写","sid":"poetry-memory","n":118,"id":"poetry-memory-direct-118","tag":"直接型默写","t":"自评题","stem":"118. 孔子在《论语》十二章中感叹时光易逝，以勉励自己和学生要珍惜时间求学的句子是_","ans":"逝者如斯夫，不舍昼夜","img":"../public/question-crops/poetry-memory/poetry-memory-direct-118.webp","aimg":"","src":"../public/source/poetry-memory/page-04.jpg","ph":false,"jx":"《论语》十二章。题干问“感叹时光易逝、勉励珍惜时间”，对应“逝者如斯夫，不舍昼夜”，以流水喻时间不可回。"},{"s":"古诗文默写","sid":"poetry-memory","n":119,"id":"poetry-memory-direct-119","tag":"直接型默写","t":"自评题","stem":"119． 怒而飞，\n_。（《北冥有鱼》）","ans":"其翼若垂天之云","img":"../public/question-crops/poetry-memory/poetry-memory-direct-119.webp","aimg":"","src":"../public/source/poetry-memory/page-04.jpg","ph":false,"jx":"《北冥有鱼》庄子（战国）。原句“怒而飞，其翼若垂天之云”，以夸张写鲲鹏之大，故填“其翼若垂天之云”。“翼”勿写作“冀”。"},{"s":"古诗文默写","sid":"poetry-memory","n":120,"id":"poetry-memory-direct-120","tag":"直接型默写","t":"自评题","stem":"120．虽有佳肴，弗食，\n（《虽有佳肴》）","ans":"不知其旨也","img":"../public/question-crops/poetry-memory/poetry-memory-direct-120.webp","aimg":"","src":"../public/source/poetry-memory/page-04.jpg","ph":false,"jx":"《虽有嘉肴》（《礼记·学记》）。原句“虽有嘉肴，弗食，不知其旨也”，以“不食不知味”类比不学不知理，故填“不知其旨也”。"},{"s":"古诗文默写","sid":"poetry-memory","n":121,"id":"poetry-memory-direct-121","tag":"直接型默写","t":"自评题","stem":"121.是故学然后知不足，\n上。（《虽有佳肴》）","ans":"教然后知困","img":"../public/question-crops/poetry-memory/poetry-memory-direct-121.webp","aimg":"","src":"../public/source/poetry-memory/page-04.jpg","ph":false,"jx":"《虽有嘉肴》。后句“教然后知困”是“知不足”之后的另一半，两句对举，故填“教然后知困”。“困”指困惑不通。"},{"s":"古诗文默写","sid":"poetry-memory","n":122,"id":"poetry-memory-direct-122","tag":"直接型默写","t":"自评题","stem":"122. 千里马常有，\n（《马说》）","ans":"而伯乐不常有","img":"../public/question-crops/poetry-memory/poetry-memory-direct-122.webp","aimg":"","src":"../public/source/poetry-memory/page-04.jpg","ph":false,"jx":"《马说》韩愈（唐）。原句“千里马常有，而伯乐不常有”，后句转折指出识马者难得，故填“而伯乐不常有”。“乐”在此读 lè。"},{"s":"古诗文默写","sid":"poetry-memory","n":123,"id":"poetry-memory-direct-123","tag":"直接型默写","t":"自评题","stem":"123. 故虽有名马，\n_二，不以干里称也。（《马说》）","ans":"祗辱于奴隶人之手 ｜ 骈死于槽枥之间","img":"../public/question-crops/poetry-memory/poetry-memory-direct-123.webp","aimg":"","src":"../public/source/poetry-memory/page-04.jpg","ph":false,"jx":"《马说》韩愈。原句“故虽有名马，祗辱于奴隶人之手，骈死于槽枥之间，不以千里称也”，两空依次填“祗辱于奴隶人之手”“骈死于槽枥之间”。“祗”课本作“祗”（只），勿写作“抵”。"},{"s":"古诗文默写","sid":"poetry-memory","n":124,"id":"poetry-memory-direct-124","tag":"直接型默写","t":"自评题","stem":"124.其真无马邪？\n《马说》）","ans":"其真不知马也","img":"../public/question-crops/poetry-memory/poetry-memory-direct-124.webp","aimg":"","src":"../public/source/poetry-memory/page-04.jpg","ph":false,"jx":"《马说》韩愈。前句反问“其真无马邪”，后句自答，点出真相是不识马，故填“其真不知马也”。注意“邪”读 yé，表疑问。"},{"s":"古诗文默写","sid":"poetry-memory","n":125,"id":"poetry-memory-direct-125","tag":"直接型默写","t":"自评题","stem":"125. 唇焦口燥呼不得，\n（《茅屋为秋风所破歌》）","ans":"归来倚杖自叹息","img":"../public/question-crops/poetry-memory/poetry-memory-direct-125.webp","aimg":"","src":"../public/source/poetry-memory/page-04.jpg","ph":false,"jx":"《茅屋为秋风所破歌》杜甫（唐）。前句“唇焦口燥呼不得”写制止群童无效，此句写只能归来倚杖叹气，故填“归来倚杖自叹息”。“倚”勿写作“依”。"},{"s":"古诗文默写","sid":"poetry-memory","n":126,"id":"poetry-memory-direct-126","tag":"直接型默写","t":"自评题","stem":"126.\n娇儿恶卧踏里裂。\n《茅屋为秋风所破歌》，","ans":"布衾多年冷似铁","img":"../public/question-crops/poetry-memory/poetry-memory-direct-126.webp","aimg":"","src":"../public/source/poetry-memory/page-04.jpg","ph":false,"jx":"《茅屋为秋风所破歌》杜甫。后句“娇儿恶卧踏里裂”写被褥破旧之因，前句写布被冷硬多年，故填“布衾多年冷似铁”。“衾”指被子。"},{"s":"古诗文默写","sid":"poetry-memory","n":127,"id":"poetry-memory-direct-127","tag":"直接型默写","t":"自评题","stem":"127. 自经丧乱少睡眠，\n《茅屋为秋风所破歌》）","ans":"长夜沾湿何由彻","img":"../public/question-crops/poetry-memory/poetry-memory-direct-127.webp","aimg":"","src":"../public/source/poetry-memory/page-04.jpg","ph":false,"jx":"《茅屋为秋风所破歌》杜甫。上句“自经丧乱少睡眠”点明失眠缘由，此句接写浑身湿冷如何挨到天亮，故填“长夜沾湿何由彻”。“彻”意为到天亮。"},{"s":"古诗文默写","sid":"poetry-memory","n":128,"id":"poetry-memory-direct-128","tag":"直接型默写","t":"自评题","stem":"128.安得广厦干万间，\n《茅屋为秋风所破歌》）","ans":"大庇天下寒士俱欢颜","img":"../public/question-crops/poetry-memory/poetry-memory-direct-128.webp","aimg":"","src":"../public/source/poetry-memory/page-04.jpg","ph":false,"jx":"《茅屋为秋风所破歌》杜甫。上句“安得广厦千万间”是设想，下句写庇护天下寒士，故填“大庇天下寒士俱欢颜”。“庇”意为遮蔽、掩护。"},{"s":"古诗文默写","sid":"poetry-memory","n":129,"id":"poetry-memory-direct-129","tag":"直接型默写","t":"自评题","stem":"129．何时眼前突兀见此屋，\n！（《茅屋为秋风所破歌》，","ans":"吾庐独破受冻死亦足","img":"../public/question-crops/poetry-memory/poetry-memory-direct-129.webp","aimg":"","src":"../public/source/poetry-memory/page-04.jpg","ph":false,"jx":"《茅屋为秋风所破歌》杜甫。原句“何时眼前突兀见此屋，吾庐独破受冻死亦足”，以舍己之誓作结，故填“吾庐独破受冻死亦足”。“突兀”意为高耸。"},{"s":"古诗文默写","sid":"poetry-memory","n":130,"id":"poetry-memory-direct-130","tag":"直接型默写","t":"自评题","stem":"130. 满面尘灰烟火色，\n《卖炭翁》）","ans":"两鬓苍苍十指黑","img":"../public/question-crops/poetry-memory/poetry-memory-direct-130.webp","aimg":"","src":"../public/source/poetry-memory/page-04.jpg","ph":false,"jx":"《卖炭翁》白居易。上句写满面尘灰烟火色，此句对仗写两鬓与十指，工笔勾勒卖炭翁的辛劳形象。“苍苍”指灰白。"},{"s":"古诗文默写","sid":"poetry-memory","n":131,"id":"poetry-memory-direct-131","tag":"直接型默写","t":"自评题","stem":"131. 可怜身上衣正单，\n《卖炭翁》）","ans":"心忧炭贱愿天寒","img":"../public/question-crops/poetry-memory/poetry-memory-direct-131.webp","aimg":"","src":"../public/source/poetry-memory/page-04.jpg","ph":false,"jx":"《卖炭翁》白居易。前句“可怜身上衣正单”写衣单，此句写他反而盼天寒，矛盾中见辛酸，故填“心忧炭贱愿天寒”。“炭”勿写作“碳”。"},{"s":"古诗文默写","sid":"poetry-memory","n":132,"id":"poetry-memory-direct-132","tag":"直接型默写","t":"自评题","stem":"132.\n黄衣使者白衫儿。（《卖炭翁》）","ans":"翩翩两骑来是谁","img":"../public/question-crops/poetry-memory/poetry-memory-direct-132.webp","aimg":"","src":"../public/source/poetry-memory/page-04.jpg","ph":false,"jx":"《卖炭翁》白居易。后句“黄衣使者白衫儿”是来者的身份特征，前句写骑马而来的两人，故填“翩翩两骑来是谁”。“翩”勿写作“偏”。"},{"s":"古诗文默写","sid":"poetry-memory","n":133,"id":"poetry-memory-direct-133","tag":"直接型默写","t":"自评题","stem":"133. 手把文书口称敕，\n（《卖炭翁》）","ans":"回车叱牛牵向北","img":"../public/question-crops/poetry-memory/poetry-memory-direct-133.webp","aimg":"","src":"../public/source/poetry-memory/page-04.jpg","ph":false,"jx":"《卖炭翁》白居易。前句“手把文书口称敕”写使者仗势下令，此句写强硬驱赶，故填“回车叱牛牵向北”。“叱”勿写作“斥”。"},{"s":"古诗文默写","sid":"poetry-memory","n":134,"id":"poetry-memory-direct-134","tag":"直接型默写","t":"自评题","stem":"134. 然则北通巫峽，南极满湘，\n，多会于此。（《岳阳楼记》）","ans":"迁客骚人","img":"../public/question-crops/poetry-memory/poetry-memory-direct-134.webp","aimg":"","src":"../public/source/poetry-memory/page-04.jpg","ph":false,"jx":"《岳阳楼记》范仲淹（北宋）。前句写“北通巫峡，南极潇湘”的地理形势，并由此推出“多会于此”的人是贬谪的官员与诗人，故填“迁客骚人”。"},{"s":"古诗文默写","sid":"poetry-memory","n":135,"id":"poetry-memory-direct-135","tag":"直接型默写","t":"自评题","stem":"135.登斯楼也，则有去国怀乡，\n_，感极而悲者矣。（《岳阳楼记》）","ans":"忧谗畏讥 ｜ 满目萧然","img":"../public/question-crops/poetry-memory/poetry-memory-direct-135.webp","aimg":"","src":"../public/source/poetry-memory/page-04.jpg","ph":false,"jx":"《岳阳楼记》范仲淹。原句“则有去国怀乡，忧谗畏讥，满目萧然，感极而悲者矣”，两空依次填“忧谗畏讥”“满目萧然”。“谗”勿写作“馋”。"},{"s":"古诗文默写","sid":"poetry-memory","n":136,"id":"poetry-memory-direct-136","tag":"直接型默写","t":"自评题","stem":"136．居庙堂之高则忧其民，\n（《岳阳楼记》）","ans":"处江湖之远则忧其君","img":"../public/question-crops/poetry-memory/poetry-memory-direct-136.webp","aimg":"","src":"../public/source/poetry-memory/page-04.jpg","ph":false,"jx":"《岳阳楼记》范仲淹。上句“居庙堂之高则忧其民”写身在朝廷，下句写身处江湖，两句对照，故填“处江湖之远则忧其君”。"},{"s":"古诗文默写","sid":"poetry-memory","n":137,"id":"poetry-memory-direct-137","tag":"直接型默写","t":"自评题","stem":"137.\n_，后天下之乐而乐。 （《岳阳楼记》）","ans":"先天下之忧而忧","img":"../public/question-crops/poetry-memory/poetry-memory-direct-137.webp","aimg":"","src":"../public/source/poetry-memory/page-04.jpg","ph":false,"jx":"《岳阳楼记》范仲淹。名句“先天下之忧而忧，后天下之乐而乐”，与后句成对，故填“先天下之忧而忧”。"},{"s":"古诗文默写","sid":"poetry-memory","n":138,"id":"poetry-memory-direct-138","tag":"直接型默写","t":"自评题","stem":"138.\n在乎山水之间也。（《醉翁亭记》）","ans":"醉翁之意不在酒","img":"../public/question-crops/poetry-memory/poetry-memory-direct-138.webp","aimg":"","src":"../public/source/poetry-memory/page-04.jpg","ph":false,"jx":"《醉翁亭记》欧阳修（北宋）。后句“在乎山水之间也”是该句的补足说明，前句是本义所在，故填“醉翁之意不在酒”。"},{"s":"古诗文默写","sid":"poetry-memory","n":139,"id":"poetry-memory-direct-139","tag":"直接型默写","t":"自评题","stem":"139. 野芳发而幽香，\n_。（《醉翁亭记》）","ans":"佳木秀而繁阴","img":"../public/question-crops/poetry-memory/poetry-memory-direct-139.webp","aimg":"","src":"../public/source/poetry-memory/page-04.jpg","ph":false,"jx":"《醉翁亭记》欧阳修。原句“野芳发而幽香，佳木秀而繁阴”，两句分写春夏之景，故填“佳木秀而繁阴”。“阴”指树荫。"},{"s":"古诗文默写","sid":"poetry-memory","n":140,"id":"poetry-memory-direct-140","tag":"直接型默写","t":"自评题","stem":"140. 苍颜白发，\n太守醉也。（《醉翁亭记》）","ans":"颓然乎其间者","img":"../public/question-crops/poetry-memory/poetry-memory-direct-140.webp","aimg":"","src":"../public/source/poetry-memory/page-04.jpg","ph":false,"jx":"《醉翁亭记》欧阳修。前句写“苍颜白发”的太守，此句写醉态，故填“颓然乎其间者”。“颓然”指醉倒的样子，非消沉。"},{"s":"古诗文默写","sid":"poetry-memory","n":141,"id":"poetry-memory-direct-141","tag":"直接型默写","t":"自评题","stem":"141. 大雪三日，\n（《湖心亭看雪》）","ans":"湖中人鸟声俱绝","img":"../public/question-crops/poetry-memory/poetry-memory-direct-141.webp","aimg":"","src":"../public/source/poetry-memory/page-04.jpg","ph":false,"jx":"《湖心亭看雪》张岱（明末清初）。前句“大雪三日”交代时间与天气，此句写游人绝迹，为后文独往看雪铺垫，故填“湖中人鸟声俱绝”。“俱”勿写作“具”。"},{"s":"古诗文默写","sid":"poetry-memory","n":142,"id":"poetry-memory-direct-142","tag":"直接型默写","t":"自评题","stem":"142.\n，玉盘珍羞直万钱。 [《行路难（其一）》]","ans":"金樽清酒斗十千","img":"../public/question-crops/poetry-memory/poetry-memory-direct-142.webp","aimg":"","src":"../public/source/poetry-memory/page-04.jpg","ph":false,"jx":"《行路难（其一）》李白（唐）。后句“玉盘珍羞直万钱”写菜肴之贵，前句写酒之贵，两句合写盛宴，故填“金樽清酒斗十千”。“樽”勿写作“尊”。"},{"s":"古诗文默写","sid":"poetry-memory","n":143,"id":"poetry-memory-direct-143","tag":"直接型默写","t":"自评题","stem":"直接型默写第 143 题：请查看原题页后完成默写。","ans":"停杯投箸不能食","img":"../public/question-crops/poetry-memory/poetry-memory-direct-143.webp","aimg":"","src":"../public/source/poetry-memory/page-04.jpg","ph":false,"jx":"《行路难（其一）》李白。前句写面对美酒佳肴却“停杯投箸不能食”，此句写放下杯筷、拔剑四顾而心茫然，是乐景写哀情。“箸”指筷子。"},{"s":"古诗文默写","sid":"poetry-memory","n":144,"id":"poetry-memory-direct-144","tag":"直接型默写","t":"自评题","stem":"直接型默写第 144 题：请查看原题页后完成默写。","ans":"拔剑四顾心茫然","img":"../public/question-crops/poetry-memory/poetry-memory-direct-144.webp","aimg":"","src":"../public/source/poetry-memory/page-04.jpg","ph":false,"jx":"《行路难（其一）》李白。承“停杯投箸不能食”而来，写拔剑环顾、心无所措。“拔剑四顾心茫然”一行四动作，写出苦闷之深。"},{"s":"古诗文默写","sid":"poetry-memory","n":145,"id":"poetry-memory-direct-145","tag":"直接型默写","t":"自评题","stem":"直接型默写第 145 题：请查看原题页后完成默写。","ans":"闲来垂钓碧溪上","img":"../public/question-crops/poetry-memory/poetry-memory-direct-145.webp","aimg":"","src":"../public/source/poetry-memory/page-04.jpg","ph":false,"jx":"《行路难（其一）》李白。此句用姜太公渭水垂钓之典，与下句“忽复乘舟梦日边”（伊尹梦日）并用，表达仍抱希望。“垂钓”勿写作“垂钩”。"},{"s":"古诗文默写","sid":"poetry-memory","n":146,"id":"poetry-memory-direct-146","tag":"直接型默写","t":"自评题","stem":"146. 长风破浪会有时，\n《行路难（其一）》]","ans":"直挂云帆济沧海","img":"../public/question-crops/poetry-memory/poetry-memory-direct-146.webp","aimg":"","src":"../public/source/poetry-memory/page-04.jpg","ph":false,"jx":"《行路难（其一）》李白。名句“长风破浪会有时，直挂云帆济沧海”，前句写信念，后句写行动，故填“直挂云帆济沧海”。“济”意为渡过。"},{"s":"古诗文默写","sid":"poetry-memory","n":147,"id":"poetry-memory-direct-147","tag":"直接型默写","t":"自评题","stem":"147.\n二十三年奔置身。（《酬乐天扬州初逢席上见赠》）","ans":"巴山楚水凄凉地","img":"../public/question-crops/poetry-memory/poetry-memory-direct-147.webp","aimg":"","src":"../public/source/poetry-memory/page-05.jpg","ph":false,"jx":"《酬乐天扬州初逢席上见赠》刘禹锡（唐）。后句“二十三年弃置身”点出被贬之久，前句写被贬之地，故填“巴山楚水凄凉地”。“凄”勿写作“妻”。"},{"s":"古诗文默写","sid":"poetry-memory","n":148,"id":"poetry-memory-direct-148","tag":"直接型默写","t":"自评题","stem":"148.\n到乡翻似烂柯人。（《酬乐天扬州初逢席上见赠》）","ans":"怀旧空吟闻笛赋","img":"../public/question-crops/poetry-memory/poetry-memory-direct-148.webp","aimg":"","src":"../public/source/poetry-memory/page-05.jpg","ph":false,"jx":"《酬乐天扬州初逢席上见赠》刘禹锡。后句“到乡翻似烂柯人”用王质烂柯之典写恍如隔世，前句用向秀《思旧赋》典写怀旧，故填“怀旧空吟闻笛赋”。“赋”勿写作“付”。"},{"s":"古诗文默写","sid":"poetry-memory","n":149,"id":"poetry-memory-direct-149","tag":"直接型默写","t":"自评题","stem":"149.\n病树前头万木春。（《酬乐天扬州初逢席上见赠》","ans":"沉舟侧畔千帆过","img":"../public/question-crops/poetry-memory/poetry-memory-direct-149.webp","aimg":"","src":"../public/source/poetry-memory/page-05.jpg","ph":false,"jx":"《酬乐天扬州初逢席上见赠》刘禹锡。名句“沉舟侧畔千帆过，病树前头万木春”，以沉舟病树自比而见新陈代谢之理，故填“沉舟侧畔千帆过”。“畔”勿写作“判”。"},{"s":"古诗文默写","sid":"poetry-memory","n":150,"id":"poetry-memory-direct-150","tag":"直接型默写","t":"自评题","stem":"150. 今日听君歌一曲，\n，（《酬乐天扬州初逢席上见赠》，","ans":"暂凭杯酒长精神","img":"../public/question-crops/poetry-memory/poetry-memory-direct-150.webp","aimg":"","src":"../public/source/poetry-memory/page-05.jpg","ph":false,"jx":"《酬乐天扬州初逢席上见赠》刘禹锡。前句“今日听君歌一曲”写答谢，此句写借酒振作，故填“暂凭杯酒长精神”。“长”在此读 zhǎng，意为增长。"},{"s":"古诗文默写","sid":"poetry-memory","n":151,"id":"poetry-memory-direct-151","tag":"直接型默写","t":"自评题","stem":"151.\n，何似在人间。 （《水调歌头•明月几时有》）","ans":"起舞弄清影","img":"../public/question-crops/poetry-memory/poetry-memory-direct-151.webp","aimg":"","src":"../public/source/poetry-memory/page-05.jpg","ph":false,"jx":"《水调歌头·明月几时有》苏轼（北宋）。后句“何似在人间”是比较的结论，前句写月下起舞，故填“起舞弄清影”。“弄”意为把玩、起舞自赏。"},{"s":"古诗文默写","sid":"poetry-memory","n":152,"id":"poetry-memory-direct-152","tag":"直接型默写","t":"自评题","stem":"152．不应有恨，\n《水调歌头•明月几时有》）","ans":"何事长向别时圆","img":"../public/question-crops/poetry-memory/poetry-memory-direct-152.webp","aimg":"","src":"../public/source/poetry-memory/page-05.jpg","ph":false,"jx":"《水调歌头·明月几时有》苏轼。前句“不应有恨”是对月的诘问，此句问月为何总在人离别时圆，故填“何事长向别时圆”。“长”意为总是。"},{"s":"古诗文默写","sid":"poetry-memory","n":153,"id":"poetry-memory-direct-153","tag":"直接型默写","t":"自评题","stem":"153. 人有悲欢离合，\n此事古难全。（《水调歌头•明月几时有》）","ans":"月有阴晴圆缺","img":"../public/question-crops/poetry-memory/poetry-memory-direct-153.webp","aimg":"","src":"../public/source/poetry-memory/page-05.jpg","ph":false,"jx":"《水调歌头·明月几时有》苏轼。原句“人有悲欢离合，月有阴晴圆缺，此事古难全”，以人月对照说人生难全之理，故填“月有阴晴圆缺”。"},{"s":"古诗文默写","sid":"poetry-memory","n":154,"id":"poetry-memory-direct-154","tag":"直接型默写","t":"自评题","stem":"154. 但愿人长久，\n（《水调歌头•明月几时有》）","ans":"千里共婵娟","img":"../public/question-crops/poetry-memory/poetry-memory-direct-154.webp","aimg":"","src":"../public/source/poetry-memory/page-05.jpg","ph":false,"jx":"《水调歌头·明月几时有》苏轼。名句“但愿人长久，千里共婵娟”，以“婵娟”代指明月，表达对亲人的祝愿，故填“千里共婵娟”。“婵娟”勿写作“蝉娟”。"},{"s":"古诗文默写","sid":"poetry-memory","n":155,"id":"poetry-memory-direct-155","tag":"直接型默写","t":"自评题","stem":"155.人皆有之，\n《鱼我所欲也》，","ans":"贤者能勿丧耳","img":"../public/question-crops/poetry-memory/poetry-memory-direct-155.webp","aimg":"","src":"../public/source/poetry-memory/page-05.jpg","ph":false,"jx":"《鱼我所欲也》孟子（战国）。原句“非独贤者有是心也，人皆有之，贤者能勿丧耳”，强调差别只在能否保持，故填“贤者能勿丧耳”。“丧”意为丧失。"},{"s":"古诗文默写","sid":"poetry-memory","n":156,"id":"poetry-memory-direct-156","tag":"直接型默写","t":"自评题","stem":"156.蹴尔而与之，\n（《鱼我所欲也》）","ans":"乞人不屑也","img":"../public/question-crops/poetry-memory/poetry-memory-direct-156.webp","aimg":"","src":"../public/source/poetry-memory/page-05.jpg","ph":false,"jx":"《鱼我所欲也》孟子。原句“蹴尔而与之，乞人不屑也”，以乞人不食嗟来之食为例，故填“乞人不屑也”。“蹴”意为用脚踢。"},{"s":"古诗文默写","sid":"poetry-memory","n":157,"id":"poetry-memory-direct-157","tag":"直接型默写","t":"自评题","stem":"157.\n_，万钟于我何加焉！（《鱼我所欲也》）","ans":"万钟则不辩礼义而受之","img":"../public/question-crops/poetry-memory/poetry-memory-direct-157.webp","aimg":"","src":"../public/source/poetry-memory/page-05.jpg","ph":false,"jx":"《鱼我所欲也》孟子。后句“万钟于我何加焉”是反问，前句写无礼而受厚禄，故填“万钟则不辩礼义而受之”。“辩”在此通“辨”，意为辨别。"},{"s":"古诗文默写","sid":"poetry-memory","n":158,"id":"poetry-memory-direct-158","tag":"直接型默写","t":"自评题","stem":"158. 以是人多以书假余，\n上。（《送东阳马生序》）","ans":"余因得遍观群书","img":"../public/question-crops/poetry-memory/poetry-memory-direct-158.webp","aimg":"","src":"../public/source/poetry-memory/page-05.jpg","ph":false,"jx":"《送东阳马生序》宋濂（明）。前句“以是人多以书假余”写借书，此句写因此得以博览，故填“余因得遍观群书”。“遍”勿写作“编”。"},{"s":"古诗文默写","sid":"poetry-memory","n":159,"id":"poetry-memory-direct-159","tag":"直接型默写","t":"自评题","stem":"159. 既加冠，\n_。（《送东阳马生序》）","ans":"益慕圣贤之道","img":"../public/question-crops/poetry-memory/poetry-memory-direct-159.webp","aimg":"","src":"../public/source/poetry-memory/page-05.jpg","ph":false,"jx":"《送东阳马生序》宋濂。前句“既加冠”写成年，此句写更加仰慕圣贤之道，故填“益慕圣贤之道”。“益”意为更加。"},{"s":"古诗文默写","sid":"poetry-memory","n":160,"id":"poetry-memory-direct-160","tag":"直接型默写","t":"自评题","stem":"160.故余虽愚，\n《送东阳马生序》）","ans":"卒获有所闻","img":"../public/question-crops/poetry-memory/poetry-memory-direct-160.webp","aimg":"","src":"../public/source/poetry-memory/page-05.jpg","ph":false,"jx":"《送东阳马生序》宋濂。前句“故余虽愚”是让步，此句写终于有所收获，故填“卒获有所闻”。“卒”在此意为终于。"},{"s":"古诗文默写","sid":"poetry-memory","n":161,"id":"poetry-memory-direct-161","tag":"直接型默写","t":"自评题","stem":"161. 塞下秋来风景异，\n二。（《渔家傲•秋思》）","ans":"衡阳雁去无留意","img":"../public/question-crops/poetry-memory/poetry-memory-direct-161.webp","aimg":"","src":"../public/source/poetry-memory/page-05.jpg","ph":false,"jx":"《渔家傲·秋思》范仲淹（北宋）。后句“塞下秋来风景异”点出“异”，此句以雁去无留意来写边地之异，故填“衡阳雁去无留意”。“衡”勿写作“横”。"},{"s":"古诗文默写","sid":"poetry-memory","n":162,"id":"poetry-memory-direct-162","tag":"直接型默写","t":"自评题","stem":"162． 四面边声连角起，干嶂里，\n_。（《渔家傲•秋思》）","ans":"长烟落日孤城闭","img":"../public/question-crops/poetry-memory/poetry-memory-direct-162.webp","aimg":"","src":"../public/source/poetry-memory/page-05.jpg","ph":false,"jx":"《渔家傲·秋思》范仲淹。前句“四面边声连角起，千嶂里”写声与山，此句写落日孤城，合写边塞苍凉，故填“长烟落日孤城闭”。"},{"s":"古诗文默写","sid":"poetry-memory","n":163,"id":"poetry-memory-direct-163","tag":"直接型默写","t":"自评题","stem":"163. 油酒一杯家万里，\n二。（《渔家傲•秋思》）","ans":"燕然未勒归无计","img":"../public/question-crops/poetry-memory/poetry-memory-direct-163.webp","aimg":"","src":"../public/source/poetry-memory/page-05.jpg","ph":false,"jx":"《渔家傲·秋思》范仲淹。上句写借酒浇乡愁，此句转折说明归不得的原因——战功未成，故填“燕然未勒归无计”。“燕然”用窦宪勒石记功之典。"},{"s":"古诗文默写","sid":"poetry-memory","n":164,"id":"poetry-memory-direct-164","tag":"直接型默写","t":"自评题","stem":"164. 羌管悠悠霜满地，人不寐，\n_。（《渔家傲•秋思》，","ans":"将军白发征夫泪","img":"../public/question-crops/poetry-memory/poetry-memory-direct-164.webp","aimg":"","src":"../public/source/poetry-memory/page-05.jpg","ph":false,"jx":"《渔家傲·秋思》范仲淹。前句“羌管悠悠霜满地，人不寐”写夜不能寐，此句写愁白头的将士与征夫之泪，故填“将军白发征夫泪”。"},{"s":"古诗文默写","sid":"poetry-memory","n":165,"id":"poetry-memory-direct-165","tag":"直接型默写","t":"自评题","stem":"165. 锦帽貂裘，\n星。（《江城子•密州出猎》）","ans":"千骑卷平冈","img":"../public/question-crops/poetry-memory/poetry-memory-direct-165.webp","aimg":"","src":"../public/source/poetry-memory/page-05.jpg","ph":false,"jx":"《江城子·密州出猎》苏轼（北宋）。后句写随从众多，前句写猎装，故填“千骑卷平冈”。“骑”在此读 jì，指一人一马。"},{"s":"古诗文默写","sid":"poetry-memory","n":166,"id":"poetry-memory-direct-166","tag":"直接型默写","t":"自评题","stem":"166.\n亲射虎，看孙郎。（《江城子．密州出猎》）","ans":"为报倾城随太守","img":"../public/question-crops/poetry-memory/poetry-memory-direct-166.webp","aimg":"","src":"../public/source/poetry-memory/page-05.jpg","ph":false,"jx":"《江城子·密州出猎》苏轼。后句“亲射虎，看孙郎”用孙权射虎之典自比，前句写全城人随太守出猎，故填“为报倾城随太守”。"},{"s":"古诗文默写","sid":"poet
