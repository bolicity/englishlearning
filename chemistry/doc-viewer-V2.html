<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-main: #F8FAFC;
      --bg-card: #FFFFFF;
      --bg-subtle: #F1F5F9;
      --border-color: #E2E8F0;
      --text-main: #0F172A;
      --text-secondary: #334155;
      --text-muted: #64748B;
      --primary: #EA580C;
      --primary-soft: #FFF7ED;
      --primary-border: #FFEDD5;
      --radius-sm: 8px;
      --radius-md: 12px;
      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Plus Jakarta Sans', 'Inter', system-ui, -apple-system, sans-serif;
      background-color: var(--bg-main); color: var(--text-main); height: 100vh;
      display: flex; flex-direction: column; overflow: hidden;
    }

    header {
      background: #FFFFFF; border-bottom: 1px solid var(--border-color);
      padding: 12px 24px; display: flex; align-items: center; justify-content: space-between;
      height: 64px; box-shadow: var(--shadow-sm); z-index: 50;
    }

    .header-left { display: flex; align-items: center; gap: 16px; }

    .back-btn {
      display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px;
      background: var(--bg-subtle); color: var(--text-secondary);
      border: 1px solid var(--border-color); border-radius: var(--radius-sm);
      font-size: 13px; font-weight: 600; text-decoration: none; transition: all 0.2s ease;
    }
    .back-btn:hover { background: var(--primary-soft); color: var(--primary); border-color: var(--primary-border); }

    .subj-badge {
      background: linear-gradient(135deg, #EA580C, #C2410C);
      color: #FFFFFF; font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 20px;
    }

    .doc-title {
      font-size: 15px; font-weight: 700; color: var(--text-main);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 550px;
    }

    .tool-btn {
      padding: 8px 14px; font-size: 13px; font-weight: 600;
      border-radius: var(--radius-sm); border: 1px solid var(--border-color);
      background: #FFFFFF; color: var(--text-secondary); cursor: pointer;
      display: inline-flex; align-items: center; gap: 6px; text-decoration: none;
      transition: all 0.2s ease;
    }
    .tool-btn:hover { background: var(--bg-subtle); color: var(--text-main); }
    .tool-btn.primary { background: var(--primary); color: #FFFFFF; border-color: var(--primary); }
    .tool-btn.primary:hover { background: #C2410C; }

    .viewer-layout {
      display: grid; grid-template-columns: 360px 1fr;
      flex: 1; height: calc(100vh - 64px); overflow: hidden;
    }

    .sidebar {
      background: #FFFFFF; border-right: 1px solid var(--border-color);
      display: flex; flex-direction: column; height: 100%;
    }
    .sidebar-header { padding: 16px; border-bottom: 1px solid var(--border-color); }
    .sidebar-title { font-size: 14px; font-weight: 700; color: var(--text-main); margin-bottom: 10px; display: flex; justify-content: space-between; }
    .search-input { width: 100%; padding: 8px 12px; border: 1px solid var(--border-color); border-radius: var(--radius-sm); font-size: 13px; outline: none; }
    .search-input:focus { border-color: var(--primary); }

    .file-list { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 8px; }

    .file-item {
      padding: 12px 14px; border: 1px solid var(--border-color);
      border-radius: var(--radius-sm); background: #FFFFFF; cursor: pointer; transition: all 0.2s ease;
    }
    .file-item:hover { border-color: var(--primary-border); background: var(--primary-soft); }
    .file-item.active { border-color: var(--primary); background: var(--primary-soft); box-shadow: var(--shadow-sm); }

    .file-item-title { font-size: 13px; font-weight: 600; color: var(--text-main); margin-bottom: 6px; line-height: 1.4; word-break: break-all; }
    .file-item-meta { display: flex; justify-content: space-between; align-items: center; font-size: 11px; color: var(--text-muted); }
    .file-tag { background: #FFF7ED; color: #EA580C; padding: 1px 6px; border-radius: 4px; font-weight: 600; }

    .preview-container { background: #F1F5F9; position: relative; height: 100%; width: 100%; }
    iframe { width: 100%; height: 100%; border: none; background: #FFFFFF; }
  </style>
</head>
<body>
  <header>
    <div class="header-left">
      <a href="chemistry-V3.html" id="backBtn" class="back-btn">← 返回化学中心</a>
      <div class="title-area">
        <span class="subj-badge">🧪 化学资料库</span>
        <h1 class="doc-title" id="currentDocTitle">选择材料开始预览</h1>
      </div>
    </div>
    <div class="header-right">
      <a id="downloadBtn" href="#" download class="tool-btn primary">⬇️ 下载当前文件</a>
      <a id="openNewTabBtn" href="#" target="_blank" class="tool-btn">↗️ 新标签打开</a>
    </div>
  </header>

  <div class="viewer-layout">
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-title">
          <span>📚 化学9月月考真题解析库 (8 份)</span>
          <span style="font-size: 11px; color: var(--text-muted);">PDF 扫描解析版</span>
        </div>
        <input type="text" class="search-input" placeholder="🔍 搜索学校或文件..." oninput="filterFiles(this.value)">
      </div>
      <div class="file-list" id="fileList"></div>
    </aside>

    <main class="preview-container">
      <iframe id="pdfViewer" src="about:blank" title="化学文档在线预览"></iframe>
    </main>
  </div>

  <script>
    const filesData = [{'filename': '精品解析：上海市华育中学2025-2026学年九年级上学期9月测试化学试卷（解析版）_扫描版.pdf', 'rel_path': 'docs/25-26学年上海九年级【化学】第一次月考真题整理（内部）/精品解析：上海市华育中学2025-2026学年九年级上学期9月测试化学试卷（解析版）_扫描版.pdf', 'title': '华育中学 9月测试化学', 'size': '2.7 MB', 'tag': '华育中学 · 解析版'}, {'filename': '精品解析：上海市闵行区2025-2026学年九年级上学期9月月考化学试卷（解析版）_扫描版.pdf', 'rel_path': 'docs/25-26学年上海九年级【化学】第一次月考真题整理（内部）/精品解析：上海市闵行区2025-2026学年九年级上学期9月月考化学试卷（解析版）_扫描版.pdf', 'title': '闵行区联考 9月月考化学', 'size': '2.9 MB', 'tag': '闵行区联考 · 解析版'}, {'filename': '精品解析：上海市华东师范大学附属宝山宝杨实验学校2025-2026学年九年级上学期9月月考化学试题（解析版）_扫描版.pdf', 'rel_path': 'docs/25-26学年上海九年级【化学】第一次月考真题整理（内部）/精品解析：上海市华东师范大学附属宝山宝杨实验学校2025-2026学年九年级上学期9月月考化学试题（解析版）_扫描版.pdf', 'title': '华师宝杨实验 9月月考化学', 'size': '2.4 MB', 'tag': '华师宝杨 · 解析版'}, {'filename': '精品解析：上海市建平实验地杰中学2025-2026学年九年级上学期9月月考化学试卷（解析版）_扫描版.pdf', 'rel_path': 'docs/25-26学年上海九年级【化学】第一次月考真题整理（内部）/精品解析：上海市建平实验地杰中学2025-2026学年九年级上学期9月月考化学试卷（解析版）_扫描版.pdf', 'title': '建平实验地杰 9月月考化学', 'size': '2.5 MB', 'tag': '建平地杰 · 解析版'}, {'filename': '精品解析：上海市建平实验中学2025-2026学年九年级上学期第一次测试化学试卷（解析版）_扫描版.pdf', 'rel_path': 'docs/25-26学年上海九年级【化学】第一次月考真题整理（内部）/精品解析：上海市建平实验中学2025-2026学年九年级上学期第一次测试化学试卷（解析版）_扫描版.pdf', 'title': '建平实验中学 9月测试化学', 'size': '2.6 MB', 'tag': '建平实验 · 解析版'}, {'filename': '精品解析：上海市嘉定区嘉一实验初级中学2025-2026学年九年级上学期9月考化学学科（解析版）_扫描版.pdf', 'rel_path': 'docs/25-26学年上海九年级【化学】第一次月考真题整理（内部）/精品解析：上海市嘉定区嘉一实验初级中学2025-2026学年九年级上学期9月考化学学科（解析版）_扫描版.pdf', 'title': '嘉一实验初级 9月考化学', 'size': '2.3 MB', 'tag': '嘉一实验 · 解析版'}, {'filename': '精品解析：上海市民办华曜浦东实验学校2025-2026学年九年级上学期9月月考化学试卷（解析版）_扫描版.pdf', 'rel_path': 'docs/25-26学年上海九年级【化学】第一次月考真题整理（内部）/精品解析：上海市民办华曜浦东实验学校2025-2026学年九年级上学期9月月考化学试卷（解析版）_扫描版.pdf', 'title': '华曜浦东实验 9月月考化学', 'size': '2.8 MB', 'tag': '华曜浦东 · 解析版'}, {'filename': '26秋上海九年级《化学综合活动手册》参考答案（新）_扫描版.pdf', 'rel_path': 'docs/26秋上海九年级《化学综合活动手册》参考答案（新）_扫描版.pdf', 'title': '九年级化学活动手册答案', 'size': '9.65 MB', 'tag': '官方活动手册答案'}];

    let currentFileIndex = 0;

    function renderFileList(filterText = '') {
      const container = document.getElementById('fileList');
      container.innerHTML = '';

      filesData.forEach((file, idx) => {
        if (filterText && !file.filename.toLowerCase().includes(filterText.toLowerCase())) return;

        const item = document.createElement('div');
        item.className = `file-item ${idx === currentFileIndex ? 'active' : ''}`;
        item.onclick = () => selectFile(idx);

        item.innerHTML = `
          <div class="file-item-title">${file.filename}</div>
          <div class="file-item-meta">
            <span class="file-tag">${file.tag}</span>
            <span>💾 ${file.size}</span>
          </div>
        `;
        container.appendChild(item);
      });
    }

    function selectFile(index) {
      if (index < 0 || index >= filesData.length) return;
      currentFileIndex = index;
      const file = filesData[index];

      document.getElementById('currentDocTitle').innerText = file.filename;
      const fileUrl = encodeURI(file.rel_path);
      document.getElementById('pdfViewer').src = fileUrl;
      document.getElementById('downloadBtn').href = fileUrl;
      document.getElementById('openNewTabBtn').href = fileUrl;

      renderFileList();
    }

    function filterFiles(val) { renderFileList(val); }

    const urlParams = new URLSearchParams(window.location.search);
    const targetFile = urlParams.get('file');

    let initialIndex = 0;
    if (targetFile) {
      const decoded = decodeURIComponent(targetFile);
      const foundIdx = filesData.findIndex(f => f.rel_path === targetFile || f.rel_path === decoded || f.filename.includes(decoded) || decoded.includes(f.filename));
      if (foundIdx !== -1) initialIndex = foundIdx;
    }

    if (filesData.length > 0) selectFile(initialIndex);

    document.addEventListener('DOMContentLoaded', function() {
      const backBtn = document.getElementById('backBtn');
      if (backBtn) {
        backBtn.addEventListener('click', function(e) {
          if (document.referrer && (document.referrer.includes('chemistry') || document.referrer.includes('index.html'))) {
            e.preventDefault();
            window.location.href = document.referrer;
          } else {
            e.preventDefault();
            window.location.href = 'chemistry-V3.html';
          }
        });
      }
    });
  </script>
</body>
</html>
